---
# Source: takserver/templates/takserver-plugins-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-plugins
spec:
  selector:
      matchLabels:
        app: takserver-plugins
  replicas: 1
  template:
    metadata:
      labels:
        app: takserver-plugins
    spec:
      serviceAccountName: takserver-ignite
      containers:
        - name: takserver-plugins 
          image: "ghcr.io/onemindos/takserver-base:plugins-upstream-5.8-onemind"
          imagePullPolicy: Always
          env:
            - name: "spring_profiles_active"
              value: "k8cluster"
            - name: "PLUGIN_MANAGER_MAX_HEAP"
              value: "1024"
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 10800
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config #The name(key) value must match pod volumes name(key) value
              mountPath: /certs-configmap/
            - name: tak-ignite-config
              mountPath: /TAKIgniteConfig.xml
      volumes:
        - name: config
          configMap:
            name: cert-migration
        - name: tak-ignite-config
          configMap:
            name: tak-ignite-config

      imagePullSecrets:
        - name: ghcr
