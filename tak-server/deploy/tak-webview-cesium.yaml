# TAK WebView Cesium — 3D COP globe at globe.onemindos.dev
# Connects to TAK Server as "3DViewer" EUD, renders SA picture in 3D via CesiumJS.
# Requires: tak-3dviewer-cert secret (Opaque: ca.pem, cert.pem, cert.key)
#   — generated by TAK Server cert enrollment, stored out-of-band.
#   To regenerate after cluster wipe: enroll a new EUD called "3DViewer" via
#   https://tak.onemindos.dev:8446/Marti/pkienroll and create the secret:
#     kubectl create secret generic tak-3dviewer-cert -n takserver \
#       --from-file=ca.pem=... --from-file=cert.pem=... --from-file=cert.key=...
apiVersion: v1
kind: ConfigMap
metadata:
  name: tak-cesium-autologin
  namespace: takserver
data:
  startup.py: |
    #!/usr/bin/env python3
    """Wrapper: provision creds, start app, auto-login."""
    import subprocess, time, sys, os

    EPHEMERAL = "/app/certs/ephemeral"
    creds_path = os.path.join(EPHEMERAL, "creds.json")
    key_path = os.path.join(EPHEMERAL, "cert.key")

    if not os.path.exists(creds_path):
        raw_key_path = key_path
        if os.path.exists(raw_key_path):
            import hashlib, secrets, base64, json
            from cryptography.fernet import Fernet
            from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
            from cryptography.hazmat.primitives import hashes

            password = "Godlywarrior418$"
            username = "3DViewer"
            server = "takserver"

            with open(raw_key_path, "rb") as f:
                raw_key = f.read()

            salt = secrets.token_hex(16)
            pw_hash = hashlib.pbkdf2_hmac("sha256", password.encode(), salt.encode(), 100000).hex()
            kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt.encode(), iterations=100000)
            storage_key = base64.urlsafe_b64encode(kdf.derive(password.encode()))
            encrypted_key = Fernet(storage_key).encrypt(raw_key)

            with open(creds_path, "w") as f:
                json.dump({"username": username, "hash": pw_hash, "salt": salt, "server": server}, f)
            with open(key_path, "wb") as f:
                f.write(encrypted_key)

            print(f"[startup] Provisioned creds for {username}", flush=True)

    proc = subprocess.Popen([sys.executable, "main.py"], cwd="/app")

    import httpx
    time.sleep(4)
    for attempt in range(15):
        try:
            r = httpx.get("http://127.0.0.1:8000/api/auth/status", timeout=3)
            if r.status_code == 200:
                data = r.json()
                if data.get("enrolled") and not data.get("authenticated"):
                    lr = httpx.post("http://127.0.0.1:8000/api/auth/login",
                        json={"username": "3DViewer", "password": "Godlywarrior418$"}, timeout=5)
                    print(f"[startup] Auto-login: {lr.status_code} {lr.text}", flush=True)
                elif data.get("authenticated"):
                    print("[startup] Already authenticated", flush=True)
                break
        except Exception:
            pass
        time.sleep(3)

    sys.exit(proc.wait())
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-webview-cesium
  namespace: takserver
  labels:
    app: tak-webview-cesium
    component: 3d-cop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tak-webview-cesium
  template:
    metadata:
      labels:
        app: tak-webview-cesium
        component: 3d-cop
    spec:
      initContainers:
        - name: copy-certs
          image: busybox:latest
          command:
            - sh
            - -c
            - cp /seed/* /ephemeral/ && chmod 666 /ephemeral/*
          volumeMounts:
            - name: viewer-cert-seed
              mountPath: /seed
              readOnly: true
            - name: ephemeral-certs
              mountPath: /ephemeral
      containers:
        - name: tak-webview-cesium
          image: ghcr.io/sgofferj/tak-webview-cesium:latest
          imagePullPolicy: Always
          command: ["python3", "/app/autologin/startup.py"]
          env:
            - name: TAK_HOST
              value: takserver
            - name: TAK_PORT
              value: "8089"
            - name: TAK_ENROLL_PORT
              value: "8446"
            - name: TAK_CALLSIGN
              value: 3DViewer
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: ephemeral-certs
              mountPath: /app/certs/ephemeral
            - name: autologin
              mountPath: /app/autologin
              readOnly: true
      volumes:
        - name: viewer-cert-seed
          secret:
            secretName: tak-3dviewer-cert
        - name: ephemeral-certs
          emptyDir: {}
        - name: autologin
          configMap:
            name: tak-cesium-autologin
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: tak-webview-cesium
  namespace: takserver
  labels:
    app: tak-webview-cesium
spec:
  selector:
    app: tak-webview-cesium
  ports:
    - name: http
      port: 80
      targetPort: 8000
