# OneMind b3 fix: mount the core-config configmap into the plugins pod so the
# TAK plugin manager's cluster messenger reads <cluster natsURL="nats://takserver-nats:4222">.
# Upstream chart does NOT mount core-config into plugins, so the plugin manager
# defaulted to nats://localhost:4222 (monolith assumption) -> PluginClusterMessenger
# NullPointerException -> injected CoT never reached the TAK fabric.
#
# Apply after (re)deploying takserver-plugins from the vendored chart:
#   kubectl -n takserver patch deploy takserver-plugins --type=json \
#     -p "$(python3 -c 'import json,sys; print(json.dumps(yaml_to_json))')"
# or apply the JSON patch below directly:
#
#   kubectl -n takserver patch deploy takserver-plugins --type=json -p '[
#     {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"core-config","configMap":{"name":"core-config"}}},
#     {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"core-config","mountPath":"/CoreConfig.xml","subPath":"CoreConfig.xml"}}
#   ]'
#
# NOTE: the config service (takserver-config) is the source of truth — it reads
# /CoreConfig.xml (from the core-config cm) and serves it via pluginCoreConfigApi.
# After editing the cluster block, restart order: config -> messaging -> plugins.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-plugins
  namespace: takserver
spec:
  template:
    spec:
      volumes:
        - name: core-config
          configMap:
            name: core-config
      containers:
        - name: takserver-plugins
          volumeMounts:
            - name: core-config
              mountPath: /CoreConfig.xml
              subPath: CoreConfig.xml
