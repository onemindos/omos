# MediaMTX — raw RTSP ingress tier (PRIMARY for machine consumers)
#
# Architecture:
#   cameras/drones → mediamtx.takserver:8554 (this) → cloudtak-media.cloudtak:8554 (users)
#                                              └──────► vision-worker (ML inference)
#                                              └──────► TAK-ML inference
#
# Cameras push once to mediamtx.takserver. This config auto-relays every stream
# to cloudtak-media via runOnReady so WebTAK users see streams without needing
# to know about the raw tier.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: takserver
data:
  mediamtx.yml: |
    logLevel: info
    rtsp: yes
    rtspAddress: :8554
    rtmp: yes
    rtmpAddress: :1935
    hls: yes
    hlsAddress: :8889
    webrtc: yes
    webrtcAddress: :8888
    api: yes
    apiAddress: :9997
    paths:
      "~.*":
        runOnReady: >-
          ffmpeg -i rtsp://localhost:8554/$MTX_PATH
          -c copy -f rtsp -rtsp_transport tcp
          rtsp://cloudtak-media.cloudtak.svc.cluster.local:8554/$MTX_PATH
        runOnReadyRestart: yes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  namespace: takserver
  labels:
    app: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.20.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8554
              name: rtsp
            - containerPort: 1935
              name: rtmp
            - containerPort: 8888
              name: webrtc
            - containerPort: 8889
              name: hls
            - containerPort: 9997
              name: api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
---
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  namespace: takserver
  labels:
    app: mediamtx
spec:
  selector:
    app: mediamtx
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
    - name: rtmp
      port: 1935
      targetPort: 1935
    - name: webrtc
      port: 8888
      targetPort: 8888
    - name: hls
      port: 8889
      targetPort: 8889
    - name: api
      port: 9997
      targetPort: 9997
