# TAK Server on the tailnet (private path for EUDs) — Tailscale K8s Operator.
#
# The operator sees loadBalancerClass: tailscale and creates a tailnet node named
# `tak` (MagicDNS: tak.tail717ba0.ts.net) that forwards the ports below to the same
# tak-lb-proxy pods that back the public tak-external LB. No public IP, no cloud LB.
# tak-external is deliberately untouched: both paths run side by side until EUDs
# have been re-enrolled onto the tailnet name (docs/networking/NETWORKING.md).
#
# Multi-port is proven on this cluster: nats/omos-nats (same class) forwards
# 4222/7422/8080 under operator v1.98.4.
#
# Why tak-lb-proxy and not the TAK pods directly: it is already the single L4 TCP
# passthrough in front of the api/messaging/murmur services (no TLS termination, so
# client-cert mTLS is untouched) and keeps the two paths identical.
#
# Not exposed here on purpose:
#   9101/9102  TAK federation is server-to-server with peers that are not on our tailnet;
#              it stays on the public tak-external LB until that decision is made.
#   64738/UDP  Mumble voice; the proxy is TCP-only (stream). Mumble falls back to TCP.
#
# Caveat: the TAK server certificate must be valid for the name EUDs dial. If clients
# verify the hostname, add tak.tail717ba0.ts.net as a SAN when re-issuing (see runbook).
apiVersion: v1
kind: Service
metadata:
  name: tak-tailnet
  namespace: takserver
  labels:
    app.kubernetes.io/name: tak-tailnet
    app.kubernetes.io/part-of: omos-networking
  annotations:
    tailscale.com/hostname: "tak"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: tak-lb-proxy
  ports:
    - name: cot
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: webtak
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: enroll
      port: 8446
      targetPort: 8446
      protocol: TCP
    - name: mumble
      port: 64738
      targetPort: 64738
      protocol: TCP
