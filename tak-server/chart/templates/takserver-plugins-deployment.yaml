{{ if .Values.takserver.plugins.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-plugins
spec:
  selector:
      matchLabels:
        app: takserver-plugins
  replicas: {{ .Values.takserver.plugins.replicas }}
  template:
    metadata:
      labels:
        app: takserver-plugins
    spec:
      serviceAccountName: takserver-ignite
      containers:
        - name: takserver-plugins 
          image: "{{ .Values.takserver.plugins.image.repository }}:{{ .Values.takserver.plugins.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          env:
            - name: "spring_profiles_active"
              value: "k8cluster"
            - name: "PLUGIN_MANAGER_MAX_HEAP"
              value: "{{ .Values.takserver.plugins.maxHeapMb | default 1024 }}"
          resources:
            requests:
              cpu: {{ .Values.takserver.plugins.resources.requests.cpu }}
              memory: {{ .Values.takserver.plugins.resources.requests.memory }}
            limits:
              cpu: {{ .Values.takserver.api.resources.limits.cpu }}
              memory: {{ .Values.takserver.plugins.resources.limits.memory }}
          livenessProbe:
            tcpSocket:
              port: 10800
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config #The name(key) value must match pod volumes name(key) value
              mountPath: /certs-configmap/
            - name: tak-ignite-config
              mountPath: /TAKIgniteConfig.xml
      volumes:
        - name: config
          configMap:
            name: {{ .Values.certConfigMapName }}
        - name: tak-ignite-config
          configMap:
            name: {{ .Values.takIgniteConfigMapName }}

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
{{- end }}
