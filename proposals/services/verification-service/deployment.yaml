apiVersion: v1
kind: Namespace
metadata:
  name: verification-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
  namespace: verification-service
  labels: {app: 'verification-service'}
spec:
  replicas: 1
  selector:
    matchLabels: {app: 'verification-service'}
  template:
    metadata:
      labels: {app: 'verification-service'}
      annotations:
        prometheus.io/scrape: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/onemindos/onemind-portal@sha256:d544f491f4d7e17ac20ebd418714c9fd4fcd1fd047897b8f933f5c6d6d7b8833
          ports: [{name: http, containerPort: 7007}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: verification-service
spec:
  selector: {app: 'verification-service'}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: verification-service
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
