apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: onemind-observations
  title: OneMind Observational API
  description: Source-verified read-only portal observations; provider setup and data freshness are explicit.
  tags: [onemind, openapi, observational]
spec:
  type: openapi
  lifecycle: production
  owner: group:default/onemind-admins
  definition: |
    {
      "openapi": "3.0.3",
      "info": {
        "title": "OneMind observational API",
        "version": "1.0.0",
        "description": "Portal endpoints. User authentication required; billing and cloud require OneMind administrator membership. Unknown/configuration-required are not healthy or zero."
      },
      "servers": [
        {
          "url": "https://onemind-preview.tail717ba0.ts.net/api/onemind"
        }
      ],
      "security": [
        {
          "portalBearer": []
        }
      ],
      "paths": {
        "/status": {
          "get": {
            "operationId": "getStatus",
            "summary": "Cluster workloads, Argo exceptions, backup schedules and fixed service health",
            "responses": {
              "200": {
                "description": "Observation or explicit unavailable/configuration-required state",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/Status"
                    }
                  }
                }
              },
              "401": {
                "description": "Portal user authentication required"
              }
            }
          }
        },
        "/fabric": {
          "get": {
            "operationId": "getFabric",
            "summary": "Single-server NATS monitoring aggregates; no agent completion history",
            "responses": {
              "200": {
                "description": "Observation or explicit unavailable/configuration-required state",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/Fabric"
                    }
                  }
                }
              },
              "401": {
                "description": "Portal user authentication required"
              }
            }
          }
        },
        "/cloud": {
          "get": {
            "operationId": "getCloud",
            "summary": "Bounded Zoho Projects task observations",
            "responses": {
              "200": {
                "description": "Observation or explicit unavailable/configuration-required state",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/Cloud"
                    }
                  }
                }
              },
              "401": {
                "description": "Portal user authentication required"
              },
              "403": {
                "description": "OneMind administrator membership required"
              }
            }
          }
        },
        "/costs": {
          "get": {
            "operationId": "getCosts",
            "summary": "Whole-account DigitalOcean billing balances in USD",
            "responses": {
              "200": {
                "description": "Observation or explicit unavailable/configuration-required state",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/Costs"
                    }
                  }
                }
              },
              "401": {
                "description": "Portal user authentication required"
              },
              "403": {
                "description": "OneMind administrator membership required"
              }
            }
          }
        },
        "/calendar": {
          "get": {
            "operationId": "getCalendar",
            "summary": "Selected US Zoho calendar; bounded seven-day upcoming window",
            "responses": {
              "200": {
                "description": "Observation or source readiness state",
                "content": {
                  "application/json": {
                    "schema": {
                      "$ref": "#/components/schemas/Calendar"
                    }
                  }
                }
              },
              "401": {
                "description": "User authentication required"
              },
              "403": {
                "description": "OneMind administrator membership required"
              }
            }
          }
        }
      },
      "components": {
        "securitySchemes": {
          "portalBearer": {
            "type": "http",
            "scheme": "bearer"
          }
        },
        "schemas": {
          "Status": {
            "type": "object",
            "required": [
              "observedAt",
              "partial",
              "totalWorkloads",
              "unavailable",
              "deployments",
              "backups"
            ],
            "properties": {
              "observedAt": {
                "type": "string",
                "format": "date-time"
              },
              "partial": {
                "type": "boolean"
              },
              "totalWorkloads": {
                "type": "integer"
              },
              "unavailable": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "unavailableSources": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "deployments": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "health": {
                      "type": "string"
                    },
                    "sync": {
                      "type": "string"
                    }
                  }
                }
              },
              "backups": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "suspended": {
