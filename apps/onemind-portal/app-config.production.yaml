app:
  baseUrl: ${PORTAL_URL}
backend:
  baseUrl: ${PORTAL_URL}
  listen:
    host: 0.0.0.0
    port: 7007
  cors:
    origin: ${PORTAL_URL}
    credentials: true
  database:
    client: pg
    connection:
      host: backstage-postgres
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}
  reading:
    allow:
      - host: github.com
catalog:
  locations:
    - type: file
      target: /app/templates/service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/app-onboarding/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/deployment-change/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/recovery-preparation/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/catalog/apps.yaml
    - type: file
      target: /app/catalog/cluster.yaml
    - type: file
      target: /app/catalog/org.yaml
      rules:
        - allow: [User, Group]
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: do-nyc3-omos-cloud
          title: OneMind Cloud — NYC3
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          skipMetricsLookup: false
          dashboardUrl: https://headlamp.tail717ba0.ts.net
