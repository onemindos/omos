enableExperimentalRedirectFlow: true
app:
  title: OneMind
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: OneMindDirectory
              column: 0
              row: 2
              width: 8
              height: 18
              deletable: false
            - component: OneMindStatus
              column: 8
              row: 2
              width: 4
              height: 12
            - component: HomePageStarredEntities
              column: 8
              row: 14
              width: 4
              height: 6
organization:
  name: OneMind
backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  actions:
    pluginSources: [catalog]
auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: https://onemind-auth.tail717ba0.ts.net/application/o/onemind-backstage/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        additionalScopes: [offline_access]
  clientIdMetadataDocuments:
    enabled: false
permission:
  enabled: true
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    - type: file
      target: ../../templates/service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../catalog/apps.yaml
    - type: file
      target: ../../catalog/cluster.yaml
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [User, Group]
techdocs:
  builder: external
  publisher:
    type: local
    local:
      publishDirectory: /app/techdocs
mcpActions:
  name: OneMind
  description: Search and inspect the OneMind catalog. Operational changes use separately authorized workflows.
