apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: onemind-deployment-change
  title: OneMind deployment change proposal
  description: Creates or updates a draft PR for explicit human review. No account provisioning, live deployment, restore,
    or catalog registration is performed.
spec:
  owner: group:default/onemind-admins
  type: service
  parameters:
  - title: OneMind deployment change proposal
    required:
    - name
    - entity
    - image
    - rollback
    - maintenance
    properties:
      name:
        title: Proposal name
        type: string
        pattern: ^[a-z][a-z0-9-]{2,39}$
      entity:
        title: Catalog entity
        type: string
        ui:field: EntityPicker
        ui:options:
          allowedKinds:
          - Component
          - Resource
          - System
          defaultKind: Component
        description: Choose the existing target; reviewers confirm ownership and current state.
      image:
        title: Proposed image pinned by digest
        type: string
        pattern: ^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$
      rollback:
        title: Rollback approach
        type: string
        minLength: 10
        maxLength: 1500
        ui:widget: textarea
      maintenance:
        title: Proposed maintenance window
        type: string
        minLength: 3
        maxLength: 150
  - title: Review information
    required:
    - reason
    - reviewer
    properties:
      reason:
        title: Purpose and expected outcome
        type: string
        minLength: 10
        maxLength: 1500
        ui:widget: textarea
      reviewer:
        title: Reviewer / accountable owner
        type: string
        minLength: 3
        maxLength: 100
        description: Human review remains mandatory; this field does not assign or notify anyone.
  - title: GitHub access
    required:
    - githubToken
    properties:
      githubToken:
        title: Fine-grained GitHub token
        description: Restrict to onemindos/omos, Contents and Pull requests write, with a short expiry. Never put credentials
          in proposal fields.
        type: string
        ui:field: Secret
  steps:
  - id: render
    name: Prepare review package
    action: fetch:template
    input:
      url: ./skeleton
      values:
        name: ${{ parameters.name }}
        entity: ${{ parameters.entity }}
        image: ${{ parameters.image }}
        rollback: ${{ parameters.rollback }}
        maintenance: ${{ parameters.maintenance }}
        reason: ${{ parameters.reason }}
        reviewer: ${{ parameters.reviewer }}
  - id: publish
    name: Create or update draft PR
    action: publish:github:pull-request
    input:
      repoUrl: github.com?owner=onemindos&repo=omos
      branchName: proposal/deployment-change-${{ parameters.name }}
      targetBranchName: main
      title: 'OneMind deployment change proposal: ${{ parameters.name }}'
      description: Review this proposal and complete its checklist. Files are outside live catalog and GitOps paths. Merging
        this proposal does not deploy or execute anything. A separate promotion PR is required.
      sourcePath: .
      targetPath: proposals/changes/${{ parameters.name }}
      draft: true
      update: true
      token: ${{ secrets.githubToken }}
  output:
    links:
    - title: Review draft pull request
      url: ${{ steps.publish.output.remoteUrl }}
