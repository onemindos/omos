apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: onemind-recovery-preparation
  title: OneMind recovery preparation proposal
  description: Creates or updates a draft PR for explicit human review. No account provisioning, live deployment, restore,
    or catalog registration is performed.
spec:
  owner: group:default/onemind-admins
  type: documentation
  parameters:
  - title: OneMind recovery preparation proposal
    required:
    - name
    - entity
    - scenario
    - evidence
    - recoveryObjective
    properties:
      name:
        title: Proposal name
        type: string
        pattern: ^[a-z][a-z0-9-]{2,39}$
      entity:
        title: Catalog entity
        type: string
        ui:field: EntityPicker
        ui:options:
          allowedKinds:
          - Component
          - Resource
          - System
          defaultKind: Component
        description: Choose the existing target; reviewers confirm ownership and current state.
      scenario:
        title: Recovery scenario
        type: string
        enum:
        - database-restore
        - service-failure
        - identity-recovery
        - cloud-to-home-recovery
      evidence:
        title: Backup or recovery evidence reference
        type: string
        minLength: 3
        maxLength: 1000
        description: A non-secret archive identifier or runbook reference. Never paste access keys, signed URLs, or backup
          contents.
      recoveryObjective:
        title: Recovery objective and acceptable data loss
        type: string
        minLength: 10
        maxLength: 1000
        ui:widget: textarea
  - title: Review information
    required:
    - reason
    - reviewer
    properties:
      reason:
        title: Purpose and expected outcome
        type: string
        minLength: 10
        maxLength: 1500
        ui:widget: textarea
      reviewer:
        title: Reviewer / accountable owner
        type: string
        minLength: 3
        maxLength: 100
        description: Human review remains mandatory; this field does not assign or notify anyone.
  - title: GitHub access
    required:
    - githubToken
    properties:
      githubToken:
        title: Fine-grained GitHub token
        description: Restrict to onemindos/omos, Contents and Pull requests write, with a short expiry. Never put credentials
          in proposal fields.
        type: string
        ui:field: Secret
  steps:
  - id: render
    name: Prepare review package
    action: fetch:template
    input:
      url: ./skeleton
      values:
        name: ${{ parameters.name }}
        entity: ${{ parameters.entity }}
        scenario: ${{ parameters.scenario }}
        evidence: ${{ parameters.evidence }}
        recoveryObjective: ${{ parameters.recoveryObjective }}
        reason: ${{ parameters.reason }}
        reviewer: ${{ parameters.reviewer }}
  - id: publish
    name: Create or update draft PR
    action: publish:github:pull-request
    input:
      repoUrl: github.com?owner=onemindos&repo=omos
      branchName: proposal/recovery-preparation-${{ parameters.name }}
      targetBranchName: main
      title: 'OneMind recovery preparation proposal: ${{ parameters.name }}'
      description: Review this proposal and complete its checklist. Files are outside live catalog and GitOps paths. Merging
        this proposal does not deploy or execute anything. A separate promotion PR is required.
      sourcePath: .
      targetPath: proposals/recovery/${{ parameters.name }}
      draft: true
      update: true
      token: ${{ secrets.githubToken }}
  output:
    links:
    - title: Review draft pull request
      url: ${{ steps.publish.output.remoteUrl }}
