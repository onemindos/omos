apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: onemind-gitops-service
  title: OneMind GitOps service proposal
  description: Propose a private service through a draft pull request. A reviewer must wire it into GitOps before deployment.
spec:
  owner: group:default/onemind-admins
  type: service
  parameters:
    - title: Service
      required: [name, image, port]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,39}$'
        image:
          title: Container image pinned by digest
          type: string
          pattern: '^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$'
        port:
          title: HTTP container port
          type: integer
          minimum: 1024
          maximum: 65535
          default: 8080
    - title: GitHub access
      required: [githubToken]
      properties:
        githubToken:
          title: Fine-grained GitHub token
          description: Restrict to onemindos/omos, Contents and Pull requests write. Use a short expiry. Never use an organization-wide credential.
          type: string
          ui:field: Secret
  steps:
    - id: render
      name: Generate proposal
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
    - id: publish
      name: Create or update draft PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=onemindos&repo=omos
        branchName: proposal/service-${{ parameters.name }}
        targetBranchName: main
        title: 'Service proposal: ${{ parameters.name }}'
        description: Review the service proposal, health path, networking, resources and secret requirements. Add the approved deployment to GitOps explicitly. This proposal is not auto-deployed.
        sourcePath: .
        targetPath: proposals/services/${{ parameters.name }}
        draft: true
        update: true
        token: ${{ secrets.githubToken }}
  output:
    links:
      - title: Review draft pull request
        url: ${{ steps.publish.output.remoteUrl }}
