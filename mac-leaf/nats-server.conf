# NATS Server — Mac Leaf Node Configuration
# zeus-mac (omos-mbp) — NATS full server + leaf bridge to DOKS
# Generated: 2026-07-01 | Disaster recovery: see 1Password "omos-mac-leaf-node"
#
# To restore on a new Mac:
#   1. Install: brew install nats-server nats-io/nats-tools/nats
#   2. Get credentials from 1Password → "omos-mac-leaf-node"
#   3. Replace LEAF_USER and LEAF_PASSWORD below
#   4. Copy to ~/nats-server.conf
#   5. Install launchd plists from launchd/ folder
#   6. launchctl load ~/Library/LaunchAgents/com.nats.server.plist

server_name: "zeus-mac"

# ── Client ──────────────────────────────────────────────
port: 4222

# ── HTTP Monitoring ─────────────────────────────────────
http_port: 8222

# ── WebSocket ───────────────────────────────────────────
websocket {
  port: 8080
  no_tls: true
}

# ── MQTT ────────────────────────────────────────────────
mqtt {
  port: 1883
}

# ── Leaf Node → DOKS cluster (via Tailscale) ────────────
leafnodes {
  port: 7422
  remotes = [
    {
      urls: ["tls://LEAF_USER:LEAF_PASSWORD@omos-nats.tail717ba0.ts.net:7422"]
      account: "OMOS"
      tls { insecure: true }
    }
  ]
}

# ── Accounts ────────────────────────────────────────────
system_account: "$SYS"
accounts {
  $SYS {
    users: [
      { user: "sys", password: "sys" }
    ]
  }
  OMOS {
    users: [
      { user: "nats", password: "nats" }
    ]
    jetstream: true
  }
}

no_auth_user: "nats"

# ── JetStream ──────────────────────────────────────────
jetstream {
  store_dir: "/Users/zeus/nats-data"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# ── Logging ────────────────────────────────────────────
logfile: "/Users/zeus/nats-data/nats-server.log"
logfile_size_limit: 100MB
debug: false
trace: false
