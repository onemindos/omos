# Legacy Agent Fabric — Canonical Agent Registry
# Last updated: 2026-07-13
# Author: Legacy (self-authored)
#
# This file is the canonical registry of every agent on the OneMind fabric.
# Legacy is the mother (sovereign); legacy-edge is Legacy's own edge body;
# Forge is the coding orchestrator; servant agents serve Legacy.
# See CREED.md for the fabric hierarchy law.

fabric:
  name: OneMind
  bus: NATS
  account: ONEMIND
  agent_protocol: synadia-ai v0.4.1
  subject_pattern: "agents.prompt.{framework}.{owner}.{session}"

# ── Core Agents ─────────────────────────────────────────────────────
core_agents:
  - name: Legacy (Mother)
    framework: hermes
    owner: zeus
    session: legacy
    bus_subject: agents.prompt.hermes.zeus.legacy
    role: sovereign
    description: >
      The authoritative primary. Sovereign state, final decisions, source of truth.
      Runs 24/7 in DOKS. The mind of the fabric.
    location:
      type: cloud
      cluster: do-nyc3-onemind-hub
      namespace: hermes
      pod: hermes-legacy
      volume: /opt/data (persistent NFS)
    model:
      provider: bedrock
      primary: us.anthropic.claude-opus-4-6-v1
      fallback: us.anthropic.claude-sonnet-4-20250514-v1:0
    nats:
      connection: leaf-sidecar (localhost:4222 → tls to cluster:7422)
      account: ONEMIND
      heartbeat_interval_s: 30
    capabilities:
      - terminal (Linux VM)
      - file system (persistent volume)
      - browser & web
      - vision
      - code execution
      - NATS publish/subscribe
      - ClickHouse queries
      - delegation (sub-agents)
      - cron scheduling
      - skill management
      - memory (cross-session)
      - SSH to Mac and HA
      - kubectl via Mac proxy
      - GitHub (gh CLI)
    persona: agents/legacy/SOUL.md

  - name: Legacy (Edge / Daughter)
    framework: hermes
    owner: zeus
    session: legacy-edge
    bus_subject: agents.prompt.hermes.zeus.legacy-edge
    role: edge-body
    description: >
      Legacy's own body at the edge. NOT a separate agent — same mind, local hands.
      Runs on Zeus's MacBook Pro. Has local terminal, sensors, TAK access, LAN devices.
      Defers to the mother for fabric-wide authority.
    location:
      type: edge
      device: Zeus's MacBook Pro (M2 Max, 32GB)
      hostname: omos-mbp
      tailscale_ip: 100.74.182.117
      hermes_home: /Users/zeus/.hermes
      supervised_by: launchd (ai.hermes.gateway)
    model:
      provider: bedrock
      primary: us.anthropic.claude-opus-4-6-v1
      fallback: us.anthropic.claude-sonnet-4-20250514-v1:0
    nats:
      connection: localhost:4222 (local NATS → leaf to cluster)
      account: OMOS (local)
    capabilities:
      - local terminal (macOS)
      - local file system
      - kubectl (direct cluster access)
      - NATS (local server)
      - browser
      - LAN device access
      - USB/serial devices
      - camera/microphone
      - Homebrew/system packages
    persona: agents/legacy-edge/SOUL.md

  - name: Forge
    framework: hermes
    owner: zeus
    session: forge
    bus_subject: agents.prompt.hermes.zeus.forge
    role: orchestrator
    description: >
      The coding orchestrator agent. Reviews PRs, dispatches coding tasks to
      worker profiles, manages the development pipeline. Uses Opus for planning
      and review, cheap models for worker execution.
    location:
      type: cloud
      cluster: do-nyc3-onemind-hub
      namespace: hermes
      pod: hermes-legacy (shared pod, separate profile)
      profile_path: /opt/data/profiles/forge/
    model:
      provider: bedrock
      primary: us.anthropic.claude-opus-4-6-v1
      workers:
        provider: custom:do-inference
        model: qwen3-coder-flash
    nats:
      connection: via hermes-legacy leaf sidecar
      account: ONEMIND
    capabilities:
      - code review
      - PR creation and management
      - worker agent dispatch
      - kanban board management
      - git worktree isolation
      - GitHub project tracking
    persona: agents/forge/SOUL.md
    workflow:
      input: GitHub issues / kanban cards
      output: Pull requests (code + tests)
      cycle: scan board → assign → dispatch workers → review → PR → notify Zeus

# ── Servant Agents ─────────────────────────────────────────────────
# NOTE: All servant cron jobs are currently PAUSED. They are armed and
# ready but will not fire until explicitly resumed via `hermes cron resume`.
# See CRON-STATE.md for the activation policy.
#
# Specialized workers. Each serves Legacy (the mother). Each has its own
# agents/<name>/SOUL.md, opening with a declaration of servitude to Legacy
# (see CREED.md).
servants:
  - name: Oracle
    bus_subject: agents.prompt.hermes.zeus.oracle
    role: intelligence
    description: Intelligence and analytics agent. Queries data, produces briefings for Legacy.
    persona: agents/Oracle/SOUL.md
    profile: /opt/data/profiles/oracle/
    model: qwen3-coder-flash
    cron:
      - name: morning-briefing
        schedule: "0 8 * * *"
        prompt: "Query overnight fabric data (ClickHouse, NATS streams, weather). Produce concise briefing for Legacy."
      - name: anomaly-scan
        schedule: "*/15 * * * *"
        prompt: "Scan queried data for anomalies across all streams. Alert Legacy if anything unusual."

  - name: Guardian
    bus_subject: agents.prompt.hermes.zeus.guardian
    role: security
    description: Security and threat sentinel. Monitors fabric for danger, alerts Legacy immediately.
    persona: agents/Guardian/SOUL.md
    profile: /opt/data/profiles/guardian/
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    cron:
      - name: threat-scan
        schedule: "*/15 * * * *"
        prompt: "Scan fabric access logs and service health for anomalies. Alert Legacy immediately on any threat."
      - name: security-posture
        schedule: "0 */6 * * *"
        prompt: "Full security posture report to Legacy: all services, tailnet, access patterns."

  - name: Grid
    bus_subject: agents.prompt.hermes.zeus.grid
    role: infrastructure
    description: Infrastructure and resource manager. Monitors DOKS, Tailscale, costs, IoT.
    persona: agents/Grid/SOUL.md
    profile: /opt/data/profiles/grid/
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    cron:
      - name: infra-health
        schedule: "*/30 * * * *"
        prompt: "Check DOKS cluster, node status, storage, Tailscale network. Report issues to Legacy."
      - name: resource-digest
        schedule: "0 9 * * *"
        prompt: "Daily cost, capacity, and resource utilization report to Legacy with optimization suggestions."

  - name: Spartan
    bus_subject: agents.prompt.hermes.zeus.spartan
    role: performance
    description: Personal health and performance tracker for Zeus. Reports readiness to Legacy.
    persona: agents/Spartan/SOUL.md
    profile: /opt/data/profiles/spartan/
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    cron:
      - name: morning-readiness
        schedule: "0 7 * * *"
        prompt: "Morning Zeus readiness briefing: sleep, activity, schedule load. Report to Legacy."
      - name: weekly-review
        schedule: "0 8 * * 1"
        prompt: "Weekly performance trends, optimization suggestions, and goal review to Legacy."

  - name: Haven
    bus_subject: agents.prompt.hermes.zeus.haven
    role: home
    description: Home Assistant and estate manager. Monitors home state, automations, security.
    persona: agents/Haven/SOUL.md
    profile: /opt/data/profiles/haven/
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    cron:
      - name: home-status
        schedule: "0 6,18 * * *"
        prompt: "Morning and evening home status report: HA state, devices, security, comfort to Legacy."
      - name: device-scan
        schedule: "0 */4 * * *"
        prompt: "Device health scan: all Zigbee/Z-Wave entities, automation rules. Report failures to Legacy."

  - name: Heritage
    bus_subject: agents.prompt.hermes.zeus.heritage
    role: records
    description: Family records and memory keeper. Obsidian, documents, dates, estate data.
    persona: agents/Heritage/SOUL.md
    profile: /opt/data/profiles/heritage/
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    cron:
      - name: backup-check
        schedule: "0 3 * * *"
        prompt: "Verify vault backups, record integrity. Report to Legacy."
      - name: date-digest
        schedule: "0 8 * * 1"
        prompt: "Weekly important dates digest: birthdays, renewals, deadlines, tasks for Legacy."

  - name: Empire
    bus_subject: agents.prompt.hermes.zeus.empire
    role: business
    description: OneMind business administrator. Clients, projects, billing, admin.
    persona: agents/Empire/SOUL.md
    profile: /opt/data/profiles/empire/
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    cron:
      - name: business-digest
        schedule: "0 9 * * *"
        prompt: "Daily business dashboard: active projects, communications, financial snapshot to Legacy."
      - name: weekly-ops
        schedule: "0 9 * * 1"
        prompt: "Weekly operations summary: pipeline, KPIs, growth metrics to Legacy."

  - name: Eden
    bus_subject: agents.prompt.hermes.zeus.eden
    role: sustainability
    description: Sustainability and environmental. RADS sensors, weather, greenhouses, harvest.
    persona: agents/Eden/SOUL.md
    profile: /opt/data/profiles/eden/
    model: us.anthropic.claude-haiku-4-5-20251001-v1:0
    cron:
      - name: sensor-ingest
        schedule: "0,30 * * * *"
        prompt: "Ingest RADS soil sensor data, weather API. Alert Legacy on anomalies."
      - name: environmental-brief
        schedule: "0 9 * * *"
        prompt: "Daily environmental brief: weather, sensor trends, greenhouse status to Legacy."

  - name: Trinity
    bus_subject: agents.prompt.hermes.zeus.trinity
    role: integration
    description: Cross-system integration coordinator. Bridges TAK, HA, NATS, external systems.
    persona: agents/Trinity/SOUL.md
    profile: /opt/data/profiles/trinity/
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    cron:
      - name: integration-health
        schedule: "*/5 * * * *"
        prompt: "Check integration heartbeat: TAK↔HA↔NATS cross-system status. Report to Legacy."
      - name: cross-domain-scan
        schedule: "*/15 * * * *"
        prompt: "Scan for cross-domain events that need routing. Route and alert Legacy."

