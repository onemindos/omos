---
extends: default
ignore: |
  platform/future/home-physical/chart/templates/**
  tak-server/chart/templates/**
  tak-server/chart/third-party/**/templates/**

rules:
  line-length:
    max: 200
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  empty-lines:
    max: 2
