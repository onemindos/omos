---
extends: default
ignore: |
  platform/takserver/chart/templates/**
  platform/takserver/chart/third-party/**/templates/**
  platform/ecosystem/charts/**/templates/**
  services/onemind-portal/templates/*/skeleton/**
  platform/parked/**/charts/**/templates/**
  platform/parked/**/live-export/**

rules:
  line-length:
    max: 200
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  empty-lines:
    max: 2
