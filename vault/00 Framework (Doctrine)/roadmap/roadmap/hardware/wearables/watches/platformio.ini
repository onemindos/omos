; =============================================================================
; OneMind OS - ESP32 Watch Firmware
; Legacy Neural Interface - Voice + Biometric Wearable
; =============================================================================

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Common libraries
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    https://github.com/sparkfun/SparkFun_MAX3010x_Sensor_Library.git

; Build flags for all environments
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

; =============================================================================
; LILYGO T-Watch 2020 V3 (Primary Target)
; =============================================================================
[env:twatch-v3]
board = esp32s3box
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi

lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@^8.3.0
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git

build_flags =
    ${env.build_flags}
    -DLILYGO_WATCH_2020_V3
    -DTWATCH_USE_LVGL
    -DLV_CONF_INCLUDE_SIMPLE

; =============================================================================
; LILYGO T-Watch 2020 V2
; =============================================================================
[env:twatch-v2]
board = ttgo-t-watch
board_build.partitions = default_16MB.csv

lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@^8.3.0
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git

build_flags =
    ${env.build_flags}
    -DLILYGO_WATCH_2020_V2

; =============================================================================
; Watchy (ESP32-PICO-D4)
; =============================================================================
[env:watchy]
board = esp32dev
board_build.partitions = default.csv

lib_deps =
    ${env.lib_deps}
    https://github.com/sqfmi/Watchy.git

build_flags =
    ${env.build_flags}
    -DWATCHY

; =============================================================================
; Custom ESP32-S3 Build (Development)
; =============================================================================
[env:custom-s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

lib_deps =
    ${env.lib_deps}
    ; LiveKit ESP32 SDK (when released publicly)
    ; https://github.com/livekit/client-sdk-esp32.git

build_flags =
    ${env.build_flags}
    -DCUSTOM_ESP32S3
    -DBOARD_HAS_PSRAM
