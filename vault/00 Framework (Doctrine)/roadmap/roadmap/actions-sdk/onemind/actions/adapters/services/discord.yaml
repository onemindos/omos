# Discord Bot API
# Docs: https://discord.com/developers/docs/reference

name: discord
base_url: https://discord.com/api/v10

auth:
  type: bearer
  token_env: DISCORD_BOT_TOKEN
  header: Authorization
  prefix: Bot

default_headers:
  Content-Type: application/json

actions:
  # ==========================================================================
  # MESSAGES
  # ==========================================================================
  send_message:
    description: "Send a message to a channel"
    method: POST
    path: /channels/{channel_id}/messages
    path_params: [channel_id]
    body_params:
      - content
      - tts
      - embeds
      - components
      - sticker_ids
      - files
      - attachments
      - flags
      - message_reference
    required: [channel_id]

  get_message:
    description: "Get a specific message"
    method: GET
    path: /channels/{channel_id}/messages/{message_id}
    path_params: [channel_id, message_id]
    required: [channel_id, message_id]

  get_messages:
    description: "Get messages from a channel"
    method: GET
    path: /channels/{channel_id}/messages
    path_params: [channel_id]
    query_params:
      - around
      - before
      - after
      - limit
    required: [channel_id]

  edit_message:
    description: "Edit a message"
    method: PATCH
    path: /channels/{channel_id}/messages/{message_id}
    path_params: [channel_id, message_id]
    body_params:
      - content
      - embeds
      - components
      - attachments
      - flags
    required: [channel_id, message_id]

  delete_message:
    description: "Delete a message"
    method: DELETE
    path: /channels/{channel_id}/messages/{message_id}
    path_params: [channel_id, message_id]
    required: [channel_id, message_id]

  # ==========================================================================
  # REACTIONS
  # ==========================================================================
  add_reaction:
    description: "Add a reaction to a message"
    method: PUT
    path: /channels/{channel_id}/messages/{message_id}/reactions/{emoji}/@me
    path_params: [channel_id, message_id, emoji]
    required: [channel_id, message_id, emoji]

  remove_reaction:
    description: "Remove own reaction"
    method: DELETE
    path: /channels/{channel_id}/messages/{message_id}/reactions/{emoji}/@me
    path_params: [channel_id, message_id, emoji]
    required: [channel_id, message_id, emoji]

  # ==========================================================================
  # CHANNELS
  # ==========================================================================
  get_channel:
    description: "Get a channel"
    method: GET
    path: /channels/{channel_id}
    path_params: [channel_id]
    required: [channel_id]

  modify_channel:
    description: "Modify a channel"
    method: PATCH
    path: /channels/{channel_id}
    path_params: [channel_id]
    body_params:
      - name
      - topic
      - nsfw
      - rate_limit_per_user
      - position
      - permission_overwrites
      - parent_id
    required: [channel_id]

  delete_channel:
    description: "Delete a channel"
    method: DELETE
    path: /channels/{channel_id}
    path_params: [channel_id]
    required: [channel_id]

  # ==========================================================================
  # GUILDS (SERVERS)
  # ==========================================================================
  get_guild:
    description: "Get a guild"
    method: GET
    path: /guilds/{guild_id}
    path_params: [guild_id]
    query_params:
      - with_counts
    required: [guild_id]

  get_guild_channels:
    description: "Get all channels in a guild"
    method: GET
    path: /guilds/{guild_id}/channels
    path_params: [guild_id]
    required: [guild_id]

  create_guild_channel:
    description: "Create a channel in a guild"
    method: POST
    path: /guilds/{guild_id}/channels
    path_params: [guild_id]
    body_params:
      - name
      - type
      - topic
      - nsfw
      - rate_limit_per_user
      - position
      - permission_overwrites
      - parent_id
    required: [guild_id, name]

  # ==========================================================================
  # MEMBERS
  # ==========================================================================
  get_member:
    description: "Get a guild member"
    method: GET
    path: /guilds/{guild_id}/members/{user_id}
    path_params: [guild_id, user_id]
    required: [guild_id, user_id]

  list_members:
    description: "List guild members"
    method: GET
    path: /guilds/{guild_id}/members
    path_params: [guild_id]
    query_params:
      - limit
      - after
    required: [guild_id]

  # ==========================================================================
  # THREADS
  # ==========================================================================
  create_thread:
    description: "Create a thread from a message"
    method: POST
    path: /channels/{channel_id}/messages/{message_id}/threads
    path_params: [channel_id, message_id]
    body_params:
      - name
      - auto_archive_duration
    required: [channel_id, message_id, name]

  create_thread_no_message:
    description: "Create a thread without a message"
    method: POST
    path: /channels/{channel_id}/threads
    path_params: [channel_id]
    body_params:
      - name
      - auto_archive_duration
      - type
      - invitable
    required: [channel_id, name]

  join_thread:
    description: "Join a thread"
    method: PUT
    path: /channels/{thread_id}/thread-members/@me
    path_params: [thread_id]
    required: [thread_id]

  leave_thread:
    description: "Leave a thread"
    method: DELETE
    path: /channels/{thread_id}/thread-members/@me
    path_params: [thread_id]
    required: [thread_id]

  # ==========================================================================
  # USERS
  # ==========================================================================
  get_current_user:
    description: "Get the current bot user"
    method: GET
    path: /users/@me

  get_user:
    description: "Get a user"
    method: GET
    path: /users/{user_id}
    path_params: [user_id]
    required: [user_id]

  # ==========================================================================
  # WEBHOOKS (for custom integrations)
  # ==========================================================================
  execute_webhook:
    description: "Execute a webhook"
    method: POST
    path: /webhooks/{webhook_id}/{webhook_token}
    path_params: [webhook_id, webhook_token]
    body_params:
      - content
      - username
      - avatar_url
      - tts
      - embeds
      - components
      - attachments
      - flags
      - thread_name
    required: [webhook_id, webhook_token]
