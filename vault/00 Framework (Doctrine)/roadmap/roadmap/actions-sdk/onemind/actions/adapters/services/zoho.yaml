# Zoho CRM API v7
# Docs: https://www.zoho.com/crm/developer/docs/api/v7/

name: zoho
base_url: https://www.zohoapis.com/crm/v7

auth:
  type: bearer
  token_env: ZOHO_ACCESS_TOKEN
  header: Authorization
  prefix: Zoho-oauthtoken

default_headers:
  Content-Type: application/json

actions:
  # ==========================================================================
  # RECORDS - Generic CRUD for all modules
  # ==========================================================================
  get_records:
    description: "Get records from a module (Leads, Contacts, Deals, etc.)"
    method: GET
    path: /{module}
    path_params: [module]
    query_params:
      - fields
      - sort_order
      - sort_by
      - converted
      - approved
      - page
      - per_page
      - cvid
      - ids
      - include_child
    required: [module]

  get_record:
    description: "Get a single record by ID"
    method: GET
    path: /{module}/{record_id}
    path_params: [module, record_id]
    required: [module, record_id]

  create_record:
    description: "Create a new record"
    method: POST
    path: /{module}
    path_params: [module]
    body_params:
      - data
      - trigger
      - process
      - duplicate_check_fields
    required: [module, data]

  update_record:
    description: "Update a record"
    method: PUT
    path: /{module}/{record_id}
    path_params: [module, record_id]
    body_params:
      - data
      - trigger
      - process
    required: [module, record_id, data]

  delete_record:
    description: "Delete a record"
    method: DELETE
    path: /{module}/{record_id}
    path_params: [module, record_id]
    required: [module, record_id]

  # ==========================================================================
  # SEARCH
  # ==========================================================================
  search_records:
    description: "Search records in a module"
    method: GET
    path: /{module}/search
    path_params: [module]
    query_params:
      - criteria
      - email
      - phone
      - word
      - converted
      - approved
      - page
      - per_page
    required: [module]

  # ==========================================================================
  # LEADS
  # ==========================================================================
  get_leads:
    description: "Get all leads"
    method: GET
    path: /Leads
    query_params:
      - fields
      - sort_order
      - sort_by
      - converted
      - approved
      - page
      - per_page

  create_lead:
    description: "Create a new lead"
    method: POST
    path: /Leads
    body_params:
      - data
      - trigger
      - duplicate_check_fields
    required: [data]

  convert_lead:
    description: "Convert a lead to contact/account/deal"
    method: POST
    path: /Leads/{lead_id}/actions/convert
    path_params: [lead_id]
    body_params:
      - data
    required: [lead_id, data]

  # ==========================================================================
  # CONTACTS
  # ==========================================================================
  get_contacts:
    description: "Get all contacts"
    method: GET
    path: /Contacts
    query_params:
      - fields
      - sort_order
      - sort_by
      - page
      - per_page

  create_contact:
    description: "Create a new contact"
    method: POST
    path: /Contacts
    body_params:
      - data
      - trigger
      - duplicate_check_fields
    required: [data]

  # ==========================================================================
  # DEALS
  # ==========================================================================
  get_deals:
    description: "Get all deals"
    method: GET
    path: /Deals
    query_params:
      - fields
      - sort_order
      - sort_by
      - page
      - per_page

  create_deal:
    description: "Create a new deal"
    method: POST
    path: /Deals
    body_params:
      - data
      - trigger
    required: [data]

  # ==========================================================================
  # ACCOUNTS
  # ==========================================================================
  get_accounts:
    description: "Get all accounts"
    method: GET
    path: /Accounts
    query_params:
      - fields
      - sort_order
      - sort_by
      - page
      - per_page

  create_account:
    description: "Create a new account"
    method: POST
    path: /Accounts
    body_params:
      - data
      - trigger
    required: [data]

  # ==========================================================================
  # TASKS
  # ==========================================================================
  get_tasks:
    description: "Get all tasks"
    method: GET
    path: /Tasks
    query_params:
      - fields
      - sort_order
      - sort_by
      - page
      - per_page

  create_task:
    description: "Create a new task"
    method: POST
    path: /Tasks
    body_params:
      - data
      - trigger
    required: [data]

  # ==========================================================================
  # CALLS
  # ==========================================================================
  get_calls:
    description: "Get all calls"
    method: GET
    path: /Calls
    query_params:
      - fields
      - sort_order
      - sort_by
      - page
      - per_page

  create_call:
    description: "Log a call"
    method: POST
    path: /Calls
    body_params:
      - data
      - trigger
    required: [data]

  # ==========================================================================
  # EVENTS
  # ==========================================================================
  get_events:
    description: "Get all events"
    method: GET
    path: /Events
    query_params:
      - fields
      - sort_order
      - sort_by
      - page
      - per_page

  create_event:
    description: "Create a new event"
    method: POST
    path: /Events
    body_params:
      - data
      - trigger
    required: [data]

  # ==========================================================================
  # NOTES
  # ==========================================================================
  get_notes:
    description: "Get notes for a record"
    method: GET
    path: /{module}/{record_id}/Notes
    path_params: [module, record_id]
    query_params:
      - page
      - per_page
    required: [module, record_id]

  create_note:
    description: "Add a note to a record"
    method: POST
    path: /{module}/{record_id}/Notes
    path_params: [module, record_id]
    body_params:
      - data
    required: [module, record_id, data]

  # ==========================================================================
  # METADATA
  # ==========================================================================
  get_modules:
    description: "Get all available modules"
    method: GET
    path: /settings/modules

  get_fields:
    description: "Get fields for a module"
    method: GET
    path: /settings/fields
    query_params:
      - module
    required: [module]

  get_layouts:
    description: "Get layouts for a module"
    method: GET
    path: /settings/layouts
    query_params:
      - module
    required: [module]

  # ==========================================================================
  # USERS
  # ==========================================================================
  get_users:
    description: "Get all users"
    method: GET
    path: /users
    query_params:
      - type
      - page
      - per_page

  get_current_user:
    description: "Get current user info"
    method: GET
    path: /users?type=CurrentUser
