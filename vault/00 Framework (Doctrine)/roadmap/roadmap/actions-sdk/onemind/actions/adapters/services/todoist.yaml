# Todoist REST API v2
# Docs: https://developer.todoist.com/rest/v2/

name: todoist
base_url: https://api.todoist.com/rest/v2

auth:
  type: bearer
  token_env: TODOIST_API_TOKEN
  header: Authorization
  prefix: Bearer

default_headers:
  Content-Type: application/json

actions:
  # ==========================================================================
  # TASKS
  # ==========================================================================
  get_tasks:
    description: "Get tasks with optional filters"
    method: GET
    path: /tasks
    query_params:
      - project_id
      - filter
      - label
      - ids

  get_task:
    description: "Get a single task by ID"
    method: GET
    path: /tasks/{task_id}
    path_params: [task_id]
    required: [task_id]

  create_task:
    description: "Create a new task"
    method: POST
    path: /tasks
    body_params:
      - content
      - description
      - project_id
      - section_id
      - parent_id
      - order
      - labels
      - priority
      - due_string
      - due_date
      - due_datetime
      - due_lang
      - assignee_id
      - duration
      - duration_unit
    required: [content]

  update_task:
    description: "Update an existing task"
    method: POST
    path: /tasks/{task_id}
    path_params: [task_id]
    body_params:
      - content
      - description
      - labels
      - priority
      - due_string
      - due_date
      - due_datetime
      - assignee_id
      - duration
      - duration_unit
    required: [task_id]

  complete_task:
    description: "Mark a task as complete"
    method: POST
    path: /tasks/{task_id}/close
    path_params: [task_id]
    required: [task_id]

  reopen_task:
    description: "Reopen a completed task"
    method: POST
    path: /tasks/{task_id}/reopen
    path_params: [task_id]
    required: [task_id]

  delete_task:
    description: "Delete a task"
    method: DELETE
    path: /tasks/{task_id}
    path_params: [task_id]
    required: [task_id]

  # ==========================================================================
  # PROJECTS
  # ==========================================================================
  get_projects:
    description: "Get all projects"
    method: GET
    path: /projects

  get_project:
    description: "Get a single project"
    method: GET
    path: /projects/{project_id}
    path_params: [project_id]
    required: [project_id]

  create_project:
    description: "Create a new project"
    method: POST
    path: /projects
    body_params:
      - name
      - parent_id
      - color
      - is_favorite
      - view_style
    required: [name]

  update_project:
    description: "Update a project"
    method: POST
    path: /projects/{project_id}
    path_params: [project_id]
    body_params:
      - name
      - color
      - is_favorite
      - view_style
    required: [project_id]

  delete_project:
    description: "Delete a project"
    method: DELETE
    path: /projects/{project_id}
    path_params: [project_id]
    required: [project_id]

  # ==========================================================================
  # SECTIONS
  # ==========================================================================
  get_sections:
    description: "Get all sections"
    method: GET
    path: /sections
    query_params: [project_id]

  create_section:
    description: "Create a new section"
    method: POST
    path: /sections
    body_params:
      - name
      - project_id
      - order
    required: [name, project_id]

  # ==========================================================================
  # LABELS
  # ==========================================================================
  get_labels:
    description: "Get all labels"
    method: GET
    path: /labels

  create_label:
    description: "Create a new label"
    method: POST
    path: /labels
    body_params:
      - name
      - color
      - order
      - is_favorite
    required: [name]

  # ==========================================================================
  # COMMENTS
  # ==========================================================================
  get_comments:
    description: "Get comments for a task or project"
    method: GET
    path: /comments
    query_params:
      - task_id
      - project_id

  add_comment:
    description: "Add a comment to a task"
    method: POST
    path: /comments
    body_params:
      - task_id
      - project_id
      - content
      - attachment
    required: [content]
