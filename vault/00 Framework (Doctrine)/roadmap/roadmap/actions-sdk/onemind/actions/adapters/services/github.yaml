# GitHub REST API
# Docs: https://docs.github.com/en/rest

name: github
base_url: https://api.github.com

auth:
  type: bearer
  token_env: GITHUB_TOKEN
  header: Authorization
  prefix: Bearer

default_headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"

env_vars:
  default_owner: GITHUB_DEFAULT_OWNER

# Special transformers for owner/repo handling
transformers:
  owner: owner_repo
  repo: repo_from_owner_repo

actions:
  # ==========================================================================
  # USER
  # ==========================================================================
  get_user:
    description: "Get authenticated user info"
    method: GET
    path: /user

  # ==========================================================================
  # REPOSITORIES
  # ==========================================================================
  get_repos:
    description: "Get repositories for authenticated user"
    method: GET
    path: /user/repos
    query_params:
      - type
      - sort
      - direction
      - per_page
      - page

  get_repo:
    description: "Get repository details"
    method: GET
    path: /repos/{owner}/{repo}
    path_params: [owner, repo]
    required: [owner, repo]

  # ==========================================================================
  # ISSUES
  # ==========================================================================
  get_issues:
    description: "Get issues for a repository"
    method: GET
    path: /repos/{owner}/{repo}/issues
    path_params: [owner, repo]
    query_params:
      - state
      - labels
      - assignee
      - creator
      - mentioned
      - sort
      - direction
      - since
      - per_page
      - page
    required: [owner, repo]

  get_issue:
    description: "Get a single issue"
    method: GET
    path: /repos/{owner}/{repo}/issues/{issue_number}
    path_params: [owner, repo, issue_number]
    required: [owner, repo, issue_number]

  create_issue:
    description: "Create a new issue"
    method: POST
    path: /repos/{owner}/{repo}/issues
    path_params: [owner, repo]
    body_params:
      - title
      - body
      - assignee
      - assignees
      - milestone
      - labels
    required: [owner, repo, title]

  update_issue:
    description: "Update an issue"
    method: PATCH
    path: /repos/{owner}/{repo}/issues/{issue_number}
    path_params: [owner, repo, issue_number]
    body_params:
      - title
      - body
      - state
      - state_reason
      - labels
      - assignees
      - milestone
    required: [owner, repo, issue_number]

  close_issue:
    description: "Close an issue"
    method: PATCH
    path: /repos/{owner}/{repo}/issues/{issue_number}
    path_params: [owner, repo, issue_number]
    body_params:
      - state
      - state_reason
    required: [owner, repo, issue_number]

  # ==========================================================================
  # ISSUE COMMENTS
  # ==========================================================================
  get_issue_comments:
    description: "Get comments on an issue"
    method: GET
    path: /repos/{owner}/{repo}/issues/{issue_number}/comments
    path_params: [owner, repo, issue_number]
    query_params:
      - since
      - per_page
      - page
    required: [owner, repo, issue_number]

  create_comment:
    description: "Create a comment on an issue or PR"
    method: POST
    path: /repos/{owner}/{repo}/issues/{issue_number}/comments
    path_params: [owner, repo, issue_number]
    body_params: [body]
    required: [owner, repo, issue_number, body]

  # ==========================================================================
  # PULL REQUESTS
  # ==========================================================================
  get_prs:
    description: "Get pull requests for a repository"
    method: GET
    path: /repos/{owner}/{repo}/pulls
    path_params: [owner, repo]
    query_params:
      - state
      - head
      - base
      - sort
      - direction
      - per_page
      - page
    required: [owner, repo]

  get_pr:
    description: "Get a single pull request"
    method: GET
    path: /repos/{owner}/{repo}/pulls/{pr_number}
    path_params: [owner, repo, pr_number]
    required: [owner, repo, pr_number]

  create_pr:
    description: "Create a pull request"
    method: POST
    path: /repos/{owner}/{repo}/pulls
    path_params: [owner, repo]
    body_params:
      - title
      - body
      - head
      - base
      - draft
      - maintainer_can_modify
    required: [owner, repo, title, head, base]

  update_pr:
    description: "Update a pull request"
    method: PATCH
    path: /repos/{owner}/{repo}/pulls/{pr_number}
    path_params: [owner, repo, pr_number]
    body_params:
      - title
      - body
      - state
      - base
      - maintainer_can_modify
    required: [owner, repo, pr_number]

  merge_pr:
    description: "Merge a pull request"
    method: PUT
    path: /repos/{owner}/{repo}/pulls/{pr_number}/merge
    path_params: [owner, repo, pr_number]
    body_params:
      - commit_title
      - commit_message
      - sha
      - merge_method
    required: [owner, repo, pr_number]

  # ==========================================================================
  # COMMITS
  # ==========================================================================
  get_commits:
    description: "Get commits for a repository"
    method: GET
    path: /repos/{owner}/{repo}/commits
    path_params: [owner, repo]
    query_params:
      - sha
      - path
      - author
      - committer
      - since
      - until
      - per_page
      - page
    required: [owner, repo]

  get_commit:
    description: "Get a single commit"
    method: GET
    path: /repos/{owner}/{repo}/commits/{ref}
    path_params: [owner, repo, ref]
    required: [owner, repo, ref]

  # ==========================================================================
  # BRANCHES
  # ==========================================================================
  get_branches:
    description: "Get branches for a repository"
    method: GET
    path: /repos/{owner}/{repo}/branches
    path_params: [owner, repo]
    query_params:
      - protected
      - per_page
      - page
    required: [owner, repo]

  get_branch:
    description: "Get a single branch"
    method: GET
    path: /repos/{owner}/{repo}/branches/{branch}
    path_params: [owner, repo, branch]
    required: [owner, repo, branch]

  # ==========================================================================
  # RELEASES
  # ==========================================================================
  get_releases:
    description: "Get releases for a repository"
    method: GET
    path: /repos/{owner}/{repo}/releases
    path_params: [owner, repo]
    query_params:
      - per_page
      - page
    required: [owner, repo]

  create_release:
    description: "Create a release"
    method: POST
    path: /repos/{owner}/{repo}/releases
    path_params: [owner, repo]
    body_params:
      - tag_name
      - target_commitish
      - name
      - body
      - draft
      - prerelease
      - generate_release_notes
    required: [owner, repo, tag_name]
