# =============================================================================
# OneMind OS — Core Infrastructure Stack
# =============================================================================
# Archived from 104.248.4.212 (onemind-main) — April 2026
#
# Services:
#   - NATS JetStream   (IoT event bus, MQTT bridge, multi-location leaf nodes)
#   - OmniDB           (PostgreSQL 16 + TimescaleDB + pgvector — unified DB)
#   - NATS Ingester    (NATS → OmniDB pipeline)
#   - legacy-bridge    (NATS → OpenClaw webhook forwarder)
#   - n8n              (Deterministic workflow engine) [profile: full]
#   - livekit          (Self-hosted WebRTC fallback)   [profile: voice/full]
#   - voice-agent      (Deepgram STT + Azure OpenAI TTS) [profile: voice/full]
#
# Usage:
#   docker-compose up -d                    # NATS + bridge only
#   docker-compose --profile data up -d    # + OmniDB + ingester
#   docker-compose --profile full up -d    # everything
#
# =============================================================================

networks:
  onemind-network:
    driver: bridge

volumes:
  nats_data:
    driver: local
  omnidb_data:
    driver: local
  n8n_data:
    driver: local

services:
  # ===========================================================================
  # NATS JetStream (IoT Event Bus — MQTT + native + leaf nodes + WebSocket)
  # ===========================================================================
  nats:
    image: nats:latest
    container_name: onemind-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # NATS native clients
      - "7422:7422"   # Leaf nodes (remote locations)
      - "1883:1883"   # MQTT (IoT devices, Home Assistant, Victron)
      - "8222:8222"   # HTTP monitoring
      - "9222:9222"   # WebSocket (browser clients, onemind-ui, project-ux)
    volumes:
      - ./nats/config/hub.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    networks:
      - onemind-network
    command: ["-c", "/etc/nats/nats-server.conf"]
    healthcheck:
      test: ["CMD", "/nats-server", "-version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # OmniDB: PostgreSQL 16 + TimescaleDB + pgvector (Unified Memory Database)
  # ===========================================================================
  # ONE database, THREE superpowers:
  #   1. PostgreSQL 16  — full SQL, JSONB, triggers
  #   2. TimescaleDB    — time-series events, continuous aggregates
  #   3. pgvector       — embeddings, cosine similarity, semantic search
  # ===========================================================================
  omnidb:
    image: timescale/timescaledb:latest-pg16
    container_name: onemind-omnidb
    restart: unless-stopped
    profiles: ["data", "full"]
    ports:
      - "5432:5432"
    volumes:
      - omnidb_data:/var/lib/postgresql/data
      - ./openclaw/nats/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      POSTGRES_USER: ${OMNIDB_USER:-onemind}
      POSTGRES_PASSWORD: ${OMNIDB_PASSWORD:-onemind-omnidb-2026}
      POSTGRES_DB: ${OMNIDB_DB:-onemind}
    networks:
      - onemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OMNIDB_USER:-onemind} -d ${OMNIDB_DB:-onemind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # NATS Ingester: NATS JetStream → OmniDB Pipeline
  # ===========================================================================
  nats-ingester:
    image: python:3.12-slim
    container_name: onemind-nats-ingester
    restart: unless-stopped
    profiles: ["data", "full"]
    working_dir: /app
    command: >
      sh -c "pip install nats-py psycopg2-binary --quiet && python openclaw/nats/nats_ingester.py"
    volumes:
      - .:/app
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OMNIDB_URL: ${OMNIDB_URL:-postgresql://onemind:onemind-omnidb-2026@omnidb:5432/onemind}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      nats:
        condition: service_healthy
      omnidb:
        condition: service_healthy
    networks:
      - onemind-network

  # ===========================================================================
  # Legacy Bridge: NATS → OpenClaw Webhook Forwarder
  # ===========================================================================
  # Subscribes to NATS subjects and forwards events to OpenClaw gateway
  # as webhook hooks — giving Legacy full awareness of all IoT/system events.
  # OpenClaw gateway must be running on the host (not in Docker).
  # ===========================================================================
  legacy-bridge:
    image: python:3.12-slim
    container_name: onemind-legacy-bridge
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install nats-py httpx --quiet && python openclaw/workspace/bridge.py"
    volumes:
      - .:/app
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-http://host.docker.internal:18789}
      OPENCLAW_HOOKS_TOKEN: ${OPENCLAW_HOOKS_TOKEN}
      BRIDGE_AGENT_ID: ${BRIDGE_AGENT_ID:-legacy}
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - onemind-network
