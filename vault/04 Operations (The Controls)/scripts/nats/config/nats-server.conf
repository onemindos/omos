# =============================================================================
# OneMind OS - NATS Central Server Configuration
# =============================================================================
# This is the central NATS server that all locations connect to.
# It handles:
# - Digital sensors from OpenMind Bridge
# - Physical sensors from leaf nodes (house, greenhouse, barn, etc.)
# - MQTT bridge for IoT devices
# - JetStream for persistent event storage
# =============================================================================

# Server identity
server_name: onemind-central

# Client port (for NATS clients)
port: 4222

# HTTP monitoring port
http_port: 8222

# =============================================================================
# JETSTREAM: Persistent Event Storage
# =============================================================================
jetstream {
  # Storage directory (mounted as Docker volume)
  store_dir: "/data/jetstream"

  # Memory limits (corrected field names)
  max_mem: 1G
  max_file: 10G
}

# =============================================================================
# LEAF NODES: Remote Locations (House, Greenhouse, Barn, etc.)
# =============================================================================
leafnodes {
  # Port for leaf node connections
  port: 7422
}

# =============================================================================
# MQTT BRIDGE: IoT Devices (ESP32, Arduino, Sensors)
# =============================================================================
mqtt {
  # MQTT port
  port: 1883
}

# =============================================================================
# WEBSOCKET: Browser/Flutter App Connections
# =============================================================================
websocket {
  port: 8080
  no_tls: true

  # CORS for web apps
  same_origin: false
}

# =============================================================================
# LOGGING
# =============================================================================
debug: false
trace: false
logtime: true
