[service]
name = "nats-server"

[build]
# Use official NATS docker image
image = "nats:latest"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# Expose NATS ports
# 4222: Client port
# 8222: HTTP monitoring port
# 6222: Clustering port (not needed for single node)
[[deploy.serviceVariables]]
name = "NATS_CLIENT_PORT"
value = "4222"

[[deploy.serviceVariables]]
name = "NATS_HTTP_PORT"
value = "8222"
