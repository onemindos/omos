# =============================================================================
# OneMind OS - NATS Leaf Node Configuration (Edge)
# =============================================================================
#
# This NATS instance runs on edge devices and connects as a leaf node
# to the cloud NATS hub. All events are automatically bridged.
#
# Local services → Edge NATS → Cloud NATS Hub → Event Intelligence → Legacy
#
# =============================================================================

# Server identification
server_name: onemind-edge-${EDGE_LOCATION}

# Client connections (local services connect here)
port: 4222

# HTTP monitoring
http_port: 8222

# =============================================================================
# LEAF NODE CONNECTION TO CLOUD
# =============================================================================
# Connects to cloud NATS hub. All subjects are automatically bridged.
# Uses Tailscale IP for secure connection.
# =============================================================================

leafnodes {
    remotes [
        {
            # Cloud NATS hub URL (use Tailscale IP)
            url: "nats://${CLOUD_NATS_HOST}:7422"

            # Authentication
            credentials: "/etc/nats/edge.creds"

            # Or use username/password
            # account: "edge"
            # user: "edge-${EDGE_LOCATION}"
            # password: "${EDGE_PASSWORD}"
        }
    ]
}

# =============================================================================
# JETSTREAM (Local Persistence)
# =============================================================================
# Small local JetStream for buffering when cloud is unavailable.
# Events are stored locally and synced when connection restored.
# =============================================================================

jetstream {
    store_dir: /data
    max_file_store: 256MB
    max_memory_store: 64MB
}

# =============================================================================
# LOGGING
# =============================================================================

debug: false
trace: false
logtime: true

# =============================================================================
# CONNECTION LIMITS
# =============================================================================

max_connections: 100
max_payload: 1MB

# Write deadline for slow consumers
write_deadline: 10s
