# =============================================================================
# OneMind OS - NATS JetStream Configuration (Cloud Hub)
# =============================================================================
# THE HEART of the system - event streaming with sub-millisecond latency
#
# This is the CLOUD hub that:
# 1. Receives connections from all services (NATS :4222)
# 2. Accepts MQTT connections from IoT devices (:1883)
# 3. Accepts leaf node connections from edge locations (:7422)
# 4. Stores events in JetStream
#
# REPLACES: Mosquitto + EMQX (NATS has native MQTT support)
# =============================================================================

# Server identification
server_name: onemind-cloud-hub

# Client connections (NATS native protocol)
port: 4222

# HTTP monitoring
http_port: 8222

# =============================================================================
# AUTHENTICATION
# =============================================================================
# Define users that can connect via NATS or MQTT.
# The mqtt_device user is used for anonymous MQTT connections.
# =============================================================================

# Allow anonymous connections from docker internal network
no_auth_user: onemind

authorization {
    users = [
        # Anonymous MQTT user for IoT devices
        { user: "mqtt_device", password: "" }
        # Service account for internal services
        { user: "onemind", password: "" }
    ]
}

# =============================================================================
# MQTT PROTOCOL SUPPORT (Replaces Mosquitto/EMQX)
# =============================================================================
# IoT devices, Home Assistant, and sensors connect here via MQTT.
# Messages are automatically bridged to NATS subjects.
#
# MQTT Topic → NATS Subject mapping:
#   homeassistant/sensor/temp → homeassistant.sensor.temp
#   frigate/events → frigate.events
# =============================================================================

mqtt {
    port: 1883

    # Allow anonymous MQTT connections (for local IoT)
    # For production, configure authentication
    no_auth_user: mqtt_device

    # MQTT-specific settings
    ack_wait: "1m"
    max_ack_pending: 100
}

# WebSocket support for UI
websocket {
    port: 9222
    no_tls: true  # TLS handled by Caddy/Cloudflare
}

# =============================================================================
# LEAF NODE LISTENER (for edge locations)
# =============================================================================
# Edge devices (Jetson, Raspberry Pi) connect here as leaf nodes.
# Each edge runs its own NATS and bridges to this cloud hub.
# =============================================================================

leafnodes {
    port: 7422

    # Authorization for leaf connections
    authorization {
        # Each edge location gets a unique user
        users = [
            { user: "edge-home", password: "$EDGE_HOME_PASSWORD" }
            { user: "edge-office", password: "$EDGE_OFFICE_PASSWORD" }
            { user: "edge-farm", password: "$EDGE_FARM_PASSWORD" }
        ]
    }
}

# =============================================================================
# JETSTREAM CONFIGURATION
# =============================================================================
# Persistent message storage for durability and replay.
# =============================================================================

jetstream {
    store_dir: /data
    max_file_store: 2GB
    max_memory_store: 512MB
}

# =============================================================================
# LOGGING
# =============================================================================

debug: false
trace: false
logtime: true

# =============================================================================
# CONNECTION LIMITS
# =============================================================================

max_connections: 1000
max_payload: 1MB

# Write deadline for slow consumers
write_deadline: 10s
