<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloMat — OneMind Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, system-ui, sans-serif;
    user-select: none;
  }

  canvas { display: block; }

  #toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 240, 255, 0.15);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: #00f0ff;
    padding: 10px 24px;
    border-radius: 100px;
    font-size: 14px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toast" id="toast"></div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────
const APPS = [
  { id: "status",     icon: "⚡", label: "Status",    color: "#00f0ff", angle: -90  },
  { id: "music",      icon: "🎵", label: "Music",     color: "#ff006e", angle: -45  },
  { id: "smart_home", icon: "🏠", label: "Home",      color: "#ffbe0b", angle: 0    },
  { id: "tasks",      icon: "✅", label: "Tasks",     color: "#06d6a0", angle: 45   },
  { id: "chat",       icon: "💬", label: "Chat",      color: "#a78bfa", angle: 90   },
  { id: "sensors",    icon: "🌡️", label: "Sensors",  color: "#f97316", angle: 135  },
  { id: "robotics",   icon: "🤖", label: "Robot",     color: "#22d3ee", angle: 180  },
  { id: "calendar",   icon: "📅", label: "Calendar",  color: "#4ade80", angle: 225  },
];

const ORBIT_R   = 160;   // px from center to app icon
const ICON_R    = 36;    // app icon circle radius
const CENTER_R  = 48;    // center button radius
const ANIM_MS   = 400;   // animation duration

// ─── State ─────────────────────────────────────────────────────────────────
let expanded    = false;
let animStart   = null;
let animFrom    = 0;      // 0 = collapsed, 1 = expanded
let animTo      = 0;
let progress    = 1;      // 0–1 animation progress
let hoveredApp  = null;
let cx, cy;               // canvas center

// ─── Canvas setup ──────────────────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  cx = canvas.width  / 2;
  cy = canvas.height / 2;
}
window.addEventListener("resize", resize);
resize();

// ─── easing ────────────────────────────────────────────────────────────────
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

// ─── Draw ──────────────────────────────────────────────────────────────────
function draw(ts) {
  requestAnimationFrame(draw);

  // Advance animation
  if (animStart !== null) {
    const elapsed = ts - animStart;
    const raw = Math.min(elapsed / ANIM_MS, 1);
    progress = animFrom + (animTo - animFrom) * easeInOut(raw);
    if (raw >= 1) { animStart = null; progress = animTo; }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw orbit ring (fades in with expansion)
  if (progress > 0.01) {
    ctx.save();
    ctx.strokeStyle = `rgba(0,240,255,${0.08 * progress})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy, ORBIT_R, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Draw apps
  APPS.forEach((app, i) => {
    const rad   = (app.angle * Math.PI) / 180;
    const dist  = ORBIT_R * progress;
    const ax    = cx + Math.cos(rad) * dist;
    const ay    = cy + Math.sin(rad) * dist;
    const alpha = progress;

    if (alpha < 0.05) return;

    const isHovered = hoveredApp === app.id;
    const r = isHovered ? ICON_R * 1.15 : ICON_R;

    // Glow
    if (isHovered) {
      const grd = ctx.createRadialGradient(ax, ay, r * 0.3, ax, ay, r * 1.8);
      grd.addColorStop(0, `${app.color}44`);
      grd.addColorStop(1, "transparent");
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(ax, ay, r * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Circle background
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = isHovered ? `${app.color}30` : `${app.color}18`;
    ctx.strokeStyle = isHovered ? app.color : `${app.color}88`;
    ctx.lineWidth = isHovered ? 2 : 1;
    ctx.beginPath();
    ctx.arc(ax, ay, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Icon
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${Math.round(r * 0.85)}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(app.icon, ax, ay);
    ctx.restore();

    // Label
    ctx.save();
    ctx.globalAlpha = alpha * (isHovered ? 1 : 0.5);
    ctx.fillStyle = "#fff";
    ctx.font = `${isHovered ? 12 : 11}px -apple-system, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(app.label, ax, ay + r + 6);
    ctx.restore();
  });

  // Center button
  const pulse = 1 + 0.04 * Math.sin(ts / 600);
  const cR = CENTER_R * (expanded ? 1 : pulse);

  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, cR * 1.5);
  grd.addColorStop(0, expanded ? "#ff006e44" : "#00f0ff33");
  grd.addColorStop(1, "transparent");
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(cx, cy, cR * 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.fillStyle   = expanded ? "#ff006e18" : "#00f0ff18";
  ctx.strokeStyle = expanded ? "#ff006e"   : "#00f0ff";
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, cR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Center label
  ctx.save();
  ctx.fillStyle    = expanded ? "#ff006e" : "#00f0ff";
  ctx.font         = "bold 13px -apple-system, system-ui, sans-serif";
  ctx.textAlign    = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(expanded ? "✕ CLOSE" : "⚡ LEGACY", cx, cy);
  ctx.restore();
}
requestAnimationFrame(draw);

// ─── Interaction ───────────────────────────────────────────────────────────
function toggle() {
  expanded = !expanded;
  animFrom = progress;
  animTo   = expanded ? 1 : 0;
  animStart = performance.now();
}

function getHoveredApp(x, y) {
  if (progress < 0.3) return null;
  for (const app of APPS) {
    const rad  = (app.angle * Math.PI) / 180;
    const ax   = cx + Math.cos(rad) * ORBIT_R * progress;
    const ay   = cy + Math.sin(rad) * ORBIT_R * progress;
    const dist = Math.sqrt((x - ax) ** 2 + (y - ay) ** 2);
    if (dist < ICON_R * 1.2) return app;
  }
  return null;
}

function isOnCenter(x, y) {
  return Math.sqrt((x - cx) ** 2 + (y - cy) ** 2) < CENTER_R * 1.2;
}

canvas.addEventListener("mousemove", (e) => {
  const app = getHoveredApp(e.clientX, e.clientY);
  hoveredApp = app ? app.id : null;
  canvas.style.cursor = (hoveredApp || isOnCenter(e.clientX, e.clientY)) ? "pointer" : "default";
});

canvas.addEventListener("click", (e) => {
  if (isOnCenter(e.clientX, e.clientY)) {
    toggle();
    return;
  }
  const app = getHoveredApp(e.clientX, e.clientY);
  if (app) launchApp(app);
});

// Touch support
canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (isOnCenter(t.clientX, t.clientY)) { toggle(); return; }
  const app = getHoveredApp(t.clientX, t.clientY);
  if (app) launchApp(app);
});

// ─── App launch → OpenClaw webhook ─────────────────────────────────────────
const HOOKS_URL   = window.OPENCLAW_HOOKS_URL   || "http://localhost:18789";
const HOOKS_TOKEN = window.OPENCLAW_HOOKS_TOKEN || "";

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

async function launchApp(app) {
  showToast(`Launching ${app.label}…`);
  toggle();  // collapse menu after selection

  const messages = {
    status:     "Give me a quick system status — agents, NATS, services, home.",
    music:      "What's playing on Spotify? Let's get some music going.",
    smart_home: "What's the current home status? Any alerts?",
    tasks:      "What are my top tasks for today in Todoist?",
    chat:       "I'm here — what do you need?",
    sensors:    "Pull the latest sensor readings from the homestead.",
    robotics:   "What's the status of connected OM1 nodes and robots?",
    calendar:   "What's on my calendar for today?",
  };

  try {
    const resp = await fetch(`${HOOKS_URL}/hooks/canvas`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        ...(HOOKS_TOKEN ? { Authorization: `Bearer ${HOOKS_TOKEN}` } : {}),
      },
      body: JSON.stringify({
        source:  "holomat",
        app:     app.id,
        message: messages[app.id] || `Open ${app.label}`,
      }),
    });
    if (!resp.ok) console.warn("HoloMat hook failed:", resp.status);
  } catch (err) {
    console.warn("HoloMat hook error:", err);
  }
}

// ─── Keyboard shortcut ─────────────────────────────────────────────────────
window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Escape") toggle();
});
</script>
</body>
</html>
