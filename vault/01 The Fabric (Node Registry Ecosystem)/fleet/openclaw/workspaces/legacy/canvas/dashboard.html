<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
.container { text-align: center; }
.title { font-size: 3rem; font-weight: 700; background: linear-gradient(135deg, #00f0ff, #ff006e, #ffbe0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { font-size: 1.2rem; color: #888; margin-top: 1rem; }
.status { display: flex; gap: 2rem; justify-content: center; margin-top: 3rem; }
.card { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 1.5rem 2rem; min-width: 150px; }
.card h3 { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }
.card .value { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; color: #00f0ff; }
.time { margin-top: 2rem; font-size: 1rem; color: #555; }
</style>
</head>
<body>
<div class="container">
  <div class="title">⚡ LEGACY ONLINE</div>
  <div class="subtitle">OneMind OS — Sovereign Intelligence</div>
  <div class="status">
    <div class="card"><h3>Node</h3><div class="value">Mac</div></div>
    <div class="card"><h3>Voice</h3><div class="value">Matilda</div></div>
    <div class="card"><h3>Status</h3><div class="value">ACTIVE</div></div>
  </div>
  <div class="time" id="t"></div>
</div>
<script>setInterval(() => { document.getElementById('t').textContent = new Date().toLocaleTimeString(); }, 1000);</script>
</body>
</html>
