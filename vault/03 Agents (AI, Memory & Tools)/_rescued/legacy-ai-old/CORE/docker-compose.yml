version: '3.8'

services:
  # ============================================================
  # LiveKit Server - WebRTC SFU for real-time media transport
  # ============================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: phase2_livekit
    ports:
      - "7880:7880"    # WebRTC signaling
      - "7881:7881"    # TURN/TCP fallback
      - "50000-50100:50000-50100/udp"  # RTC port range
    volumes:
      - ./livekit/config.yaml:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_CONFIG=/etc/livekit.yaml
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - legacy-ai-phase2

  # ============================================================
  # LiveKit Agent - Voice/Vision AI agent worker
  # ============================================================
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: phase2_agent
    environment:
      # LiveKit connection
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      
      # AssemblyAI STT
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      
      # Cartesia TTS
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      
      # Azure Vision (optional)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_VISION_DEPLOYMENT=${AZURE_VISION_DEPLOYMENT:-gpt-4o}
      
      # Letta LLM
      - LETTA_URL=http://letta:8283
      - LETTA_AGENT_ID=${LETTA_AGENT_ID}
      - LETTA_API_KEY=${LETTA_API_KEY}
      
      # Supabase logging
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # MCP Tools
      - CLICKUP_API_KEY=${CLICKUP_API_KEY}
      - CLICKUP_LIST_ID=${CLICKUP_LIST_ID}
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
      
      # Hybrid mode (future)
      - MODE=${MODE:-online}  # online | offline | auto
    depends_on:
      - livekit
      - letta
    restart: unless-stopped
    networks:
      - legacy-ai-phase2

  # ============================================================
  # Letta Server - Stateful AI agent with persistent memory
  # ============================================================
  letta:
    image: letta/letta:latest
    container_name: phase2_letta
    ports:
      - "8283:8283"
    environment:
      - POSTGRES_URI=postgresql://letta:${POSTGRES_PASSWORD}@postgres:5432/letta
      - REDIS_URL=redis://redis:6379
      - LETTA_SERVER_HOST=0.0.0.0
      - LETTA_SERVER_PORT=8283
    volumes:
      - ./letta:/letta-config:ro
      - letta_data:/root/.letta
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - legacy-ai-phase2

  # ============================================================
  # PostgreSQL - Letta memory storage
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: phase2_postgres
    environment:
      - POSTGRES_DB=letta
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"  # Expose for debugging only
    restart: unless-stopped
    networks:
      - legacy-ai-phase2

  # ============================================================
  # Redis - Caching layer for Letta
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: phase2_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"  # Expose for debugging only
    restart: unless-stopped
    networks:
      - legacy-ai-phase2

# ============================================================
# Volumes for persistent data
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  letta_data:
    driver: local

# ============================================================
# Network for service communication
# ============================================================
networks:
  legacy-ai-phase2:
    driver: bridge
    name: legacy-ai-phase2
