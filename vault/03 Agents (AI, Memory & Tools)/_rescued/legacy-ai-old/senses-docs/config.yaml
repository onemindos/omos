# LiveKit Server Configuration
# Self-hosted setup for hybrid cognitive architecture

port: 7880
log_level: info

# RTC (Real-Time Communication) settings
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  
  # CRITICAL: Set to true for cloud/VM deployment
  # LiveKit will use STUN to discover public IP
  use_external_ip: true
  
  # Optional: Specify STUN servers
  # stun_servers:
  #   - stun:stun.l.google.com:19302

# Redis for distributed state (required for multi-node scaling)
redis:
  address: redis:6379
  password: ${REDIS_PASSWORD}  # From environment
  db: 0

# API keys for authentication
# Generate with: openssl rand -hex 32
keys:
  # Replace with actual keys from .env
  # Format: APIkeyValue: APIsecretValue
  devkey: secret  # CHANGE THIS IN PRODUCTION

# TURN server for NAT traversal
turn:
  enabled: true
  # domain: livekit.zeusops.dev  # Uncomment for TLS
  # tls_port: 5349
  udp_port: 3478  # Standard TURN port

# Prometheus metrics for monitoring
# prometheus_port: 6789

# Logging configuration
# logging:
#   level: debug  # For troubleshooting
#   pion_level: warn  # WebRTC library
#   sample: false  # Log sampling
