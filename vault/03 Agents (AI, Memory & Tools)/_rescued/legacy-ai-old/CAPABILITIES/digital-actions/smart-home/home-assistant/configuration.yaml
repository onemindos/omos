# Home Assistant Configuration
# Production configuration for Legacy AI Infrastructure

# Basic configuration
homeassistant:
  name: Legacy AI Smart Home
  latitude: !secret latitude
  longitude: !secret longitude
  elevation: 0
  unit_system: imperial
  temperature_unit: F
  time_zone: America/New_York
  currency: USD
  country: US
  
  # Customize entities
  customize: !include customize.yaml
  
  # Auth providers
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 100.0.0.0/8  # Tailscale network
        - 172.16.0.0/12  # Docker network
      allow_bypass_login: true

# Enable default config
default_config:

# Enable frontend
frontend:
  themes: !include_dir_merge_named themes

# Enable configuration UI
config:

# Enable system health
system_health:

# Enable history
history:

# Enable logbook
logbook:

# Enable recorder (database)
recorder:
  db_url: sqlite:////config/home-assistant_v2.db
  purge_keep_days: 30
  commit_interval: 1

# Enable automation
automation: !include automations.yaml

# Enable scripts
script: !include scripts.yaml

# Enable scenes
scene: !include scenes.yaml

# ===================
# MQTT Configuration
# ===================
mqtt:
  broker: mosquitto
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  birth_message:
    topic: 'homeassistant/status'
    payload: 'online'
  will_message:
    topic: 'homeassistant/status'
    payload: 'offline'

# ===================
# HTTP Configuration
# ===================
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12  # Docker network
  ip_ban_enabled: true
  login_attempts_threshold: 5

# ===================
# Logger
# ===================
logger:
  default: info
  logs:
    homeassistant.core: warning
    homeassistant.components.mqtt: info

# ===================
# Sensors
# ===================
sensor:
  # System Monitor
  - platform: systemmonitor
    resources:
      - type: disk_use_percent
        arg: /
      - type: memory_use_percent
      - type: processor_use
      - type: last_boot

  # Time & Date
  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'

# ===================
# Binary Sensors
# ===================
binary_sensor:

# ===================
# Switches
# ===================
switch:

# ===================
# Lights
# ===================
light:

# ===================
# Climate
# ===================
climate:

# ===================
# Media Players
# ===================
media_player:

# ===================
# Notifications
# ===================
notify:
  - platform: file
    name: file_log
    filename: /config/notifications.log

# ===================
# Integration: REST API for n8n/Dify
# ===================
# Use automations to call webhooks

# ===================
# Integration: Node-RED
# ===================
# Configure via Node-RED Home Assistant nodes

# ===================
# Energy Management
# ===================
# Configure via UI if you have energy sensors
