version: '3.8'

services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: unless-stopped
    networks:
      - legacy_network
    ports:
      - "1884:1883"      # MQTT
      - "8084:8083"      # MQTT/WebSocket
      - "8885:8883"      # MQTT/SSL
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=emqx.zeusops.dev
      # Dashboard credentials
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=hfqCLA6yEnWIpIA2xXRfWUzreKcVxRM5
      # Disable anonymous access
      - EMQX_ALLOW_ANONYMOUS=false
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD-SHELL", "emqx_ctl status | grep -q is_running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  legacy_network:
    external: true

volumes:
  emqx_data:
    name: emqx_data
  emqx_log:
    name: emqx_log
