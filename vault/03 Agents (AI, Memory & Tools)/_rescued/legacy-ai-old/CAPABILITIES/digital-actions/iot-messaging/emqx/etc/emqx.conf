# EMQX Configuration

## Basic Settings
node.name = emqx@emqx.zeusops.dev
node.cookie = emqxsecretcookie

## Cluster
cluster.discovery = static
cluster.static.seeds = emqx@emqx.zeusops.dev

## Listeners - MQTT TCP
listener.tcp.external = 0.0.0.0:1883
listener.tcp.external.max_connections = 1024000

## Listeners - MQTT WebSocket
listener.ws.external = 0.0.0.0:8083
listener.ws.external.mqtt_path = /mqtt

## Listeners - MQTT SSL/TLS
listener.ssl.external = 0.0.0.0:8883
listener.ssl.external.max_connections = 102400

## Dashboard
dashboard.listeners.http.bind = 18083
dashboard.default_username = admin
dashboard.default_password = hfqCLA6yEnWIpIA2xXRfWUzreKcVxRM5

## Authentication
allow_anonymous = false

## Zones
zone.external.idle_timeout = 15s
zone.external.publish_limit = 10,1m
zone.external.max_packet_size = 1MB

## Log
log.to = both
log.level = warning
log.dir = /opt/emqx/log

## MQTT Protocol
mqtt.max_packet_size = 1MB
mqtt.max_clientid_len = 65535
mqtt.max_topic_levels = 128
mqtt.max_topic_alias = 65535
mqtt.retain_available = true
mqtt.wildcard_subscription = true
mqtt.shared_subscription = true

## Session
mqtt.session.max_subscriptions = 0
mqtt.session.upgrade_qos = off
mqtt.session.max_inflight = 32
mqtt.session.retry_interval = 30s
mqtt.session.max_awaiting_rel = 100
mqtt.session.await_rel_timeout = 300s
mqtt.session.expiry_interval = 2h

## Queue
mqtt.mqueue.max_len = 1000
mqtt.mqueue.store_qos0 = true
mqtt.mqueue.priorities = disabled

## Sys Topics
mqtt.sys_interval = 1m

## Modules
module.recon = true
module.presence = true
module.presence.qos = 1
