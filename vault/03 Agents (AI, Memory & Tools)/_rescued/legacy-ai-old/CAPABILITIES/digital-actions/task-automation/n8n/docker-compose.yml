version: '3.8'

services:
  # PostgreSQL database for n8n
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=iQXbgSz6HMmcNDegeabmv5PGy3cWVsGX
      - POSTGRES_DB=n8n
      - POSTGRES_NON_ROOT_USER=n8n
      - POSTGRES_NON_ROOT_PASSWORD=iQXbgSz6HMmcNDegeabmv5PGy3cWVsGX
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - legacy_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for queue mode
  n8n-redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: unless-stopped
    volumes:
      - n8n_redis_data:/data
    networks:
      - legacy_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # n8n main instance (handles UI, scheduling, webhooks)
  n8n-main:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Database configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=iQXbgSz6HMmcNDegeabmv5PGy3cWVsGX
      
      # Queue mode configuration
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      
      # Webhook configuration
      - N8N_HOST=n8n.zeusops.dev
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.zeusops.dev/
      
      # Security
      - N8N_ENCRYPTION_KEY=PkCAVScE0TawgRq9BWgdTeJ3wPU4x8GGZijfFkM2Po4=
      
      # Task runners (code isolation)
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=rS/Aj9gNQH9LC2gxq+H9Wua6WyHApL4lbopkjViR8Hg=
      
      # General settings
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      # Metrics and monitoring
      - N8N_METRICS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      
      # Execution settings
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      
      # Concurrency limits (production)
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=20
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - legacy_network
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy

  # n8n task runner (for code isolation)
  n8n-task-runner:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-task-runner
    restart: unless-stopped
    command: start --task-runner
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_AUTH_TOKEN=rS/Aj9gNQH9LC2gxq+H9Wua6WyHApL4lbopkjViR8Hg=
      - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=info
      - N8N_ENCRYPTION_KEY=PkCAVScE0TawgRq9BWgdTeJ3wPU4x8GGZijfFkM2Po4=
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - legacy_network
    depends_on:
      - n8n-main

  # n8n worker 1 (processes workflow executions from queue)
  n8n-worker-1:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-worker-1
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      # Database configuration (same as main)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=iQXbgSz6HMmcNDegeabmv5PGy3cWVsGX
      
      # Queue mode configuration
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      
      # Security (MUST match main instance)
      - N8N_ENCRYPTION_KEY=PkCAVScE0TawgRq9BWgdTeJ3wPU4x8GGZijfFkM2Po4=
      
      # General settings
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - legacy_network
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
      n8n-main:
        condition: service_started

  # n8n worker 2 (additional worker for scalability)
  n8n-worker-2:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-worker-2
    restart: unless-stopped
    command: worker --concurrency=10
    environment:
      # Database configuration (same as main)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=iQXbgSz6HMmcNDegeabmv5PGy3cWVsGX
      
      # Queue mode configuration
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      
      # Security (MUST match main instance)
      - N8N_ENCRYPTION_KEY=PkCAVScE0TawgRq9BWgdTeJ3wPU4x8GGZijfFkM2Po4=
      
      # General settings
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - legacy_network
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
      n8n-main:
        condition: service_started

  # n8n webhook processor (handles webhook executions separately)
  n8n-webhook:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-webhook
    restart: unless-stopped
    command: webhook
    environment:
      # Database configuration (same as main)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=iQXbgSz6HMmcNDegeabmv5PGy3cWVsGX
      
      # Queue mode configuration
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=n8n-redis
      - QUEUE_BULL_REDIS_PORT=6379
      
      # Webhook configuration
      - WEBHOOK_URL=https://n8n.zeusops.dev/
      
      # Security (MUST match main instance)
      - N8N_ENCRYPTION_KEY=PkCAVScE0TawgRq9BWgdTeJ3wPU4x8GGZijfFkM2Po4=
      
      # General settings
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - legacy_network
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
      n8n-main:
        condition: service_started

volumes:
  n8n_postgres_data:
    driver: local
  n8n_redis_data:
    driver: local
  n8n_data:
    driver: local

networks:
  legacy_network:
    external: true
