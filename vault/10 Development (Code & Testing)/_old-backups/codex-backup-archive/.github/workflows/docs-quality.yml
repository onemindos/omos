name: Documentation Quality

on:
  # DISABLED - All triggers commented out
  # push:
  #   branches: [main]
  #   paths:
  #     - '**/*.md'
  #     - '.github/workflows/docs-quality.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Create markdownlint config
        run: |
          cat > .markdownlint.json << 'EOF'
          {
            "default": true,
            "MD013": false,
            "MD033": false,
            "MD041": false,
            "MD024": {
              "siblings_only": true
            },
            "MD029": {
              "style": "ordered"
            }
          }
          EOF

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' \
            --ignore 'node_modules' \
            --ignore '.obsidian' \
            --ignore 'Organize-non-important' \
            --ignore '.git' \
            || true
        continue-on-error: true

  link-check:
    name: Link Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lychee
        uses: taiki-e/install-action@lychee

      - name: Check internal links
        id: lychee
        run: |
          lychee --no-progress \
            --exclude-path '.obsidian' \
            --exclude-path 'node_modules' \
            --exclude-path 'Organize-non-important' \
            --exclude-mail \
            --exclude 'localhost' \
            --exclude '127.0.0.1' \
            --accept '200,204,301,302,403,429' \
            --max-retries 3 \
            --timeout 30 \
            '**/*.md' 2>&1 | tee lychee_output.txt || true

      - name: Upload link check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-results
          path: lychee_output.txt
          retention-days: 7

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install -g cspell

      - name: Create cspell config
        run: |
          cat > cspell.json << 'EOF'
          {
            "version": "0.2",
            "language": "en",
            "words": [
              "onemind",
              "codex",
              "letta",
              "todoist",
              "obsidian",
              "zoho",
              "webhook",
              "webhooks",
              "infra",
              "terraform",
              "postgres",
              "postgresql",
              "lightsail",
              "ghcr",
              "buildx",
              "trivy",
              "tfsec",
              "checkov",
              "infracost",
              "cspell",
              "markdownlint",
              "lychee",
              "zeus",
              "delacruz",
              "solarpunk",
              "hive",
              "agno",
              "cortex",
              "nerves"
            ],
            "ignorePaths": [
              ".obsidian/**",
              "node_modules/**",
              "Organize-non-important/**",
              ".git/**",
              "*.json",
              "*.yml",
              "*.yaml"
            ],
            "ignoreRegExpList": [
              "\\[.*?\\]\\(.*?\\)",
              "`[^`]+`",
              "```[\\s\\S]*?```"
            ]
          }
          EOF

      - name: Run spell check
        run: |
          cspell '**/*.md' \
            --no-progress \
            --show-context \
            --show-suggestions \
            || true
        continue-on-error: true

  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML files
        run: |
          yamllint -d relaxed .github/workflows/*.yml 2>&1 || true
        continue-on-error: true

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [markdown-lint, link-check, spell-check, yaml-validate]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Documentation Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown Lint | ${{ needs.markdown-lint.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link Check | ${{ needs.link-check.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Spell Check | ${{ needs.spell-check.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YAML Validation | ${{ needs.yaml-validate.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Note: Warnings don't block the build but should be reviewed.*" >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 📝 Documentation Quality Check

            | Check | Status |
            |-------|--------|
            | Markdown Lint | ${{ needs.markdown-lint.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |
            | Link Check | ${{ needs.link-check.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |
            | Spell Check | ${{ needs.spell-check.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |
            | YAML Validation | ${{ needs.yaml-validate.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |

            *Review any warnings in the [Actions tab](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
