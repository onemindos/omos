server {
    listen 80;
    server_name _;

    location /console/api {
        proxy_pass http://dify-api:5001;
        include /etc/nginx/proxy.conf;
    }

    location /api {
        proxy_pass http://dify-api:5001;
        include /etc/nginx/proxy.conf;
    }

    location /v1 {
        proxy_pass http://dify-api:5001;
        include /etc/nginx/proxy.conf;
    }

    location /files {
        proxy_pass http://dify-api:5001;
        include /etc/nginx/proxy.conf;
    }

    location / {
        proxy_pass http://dify-web:3000;
        include /etc/nginx/proxy.conf;
    }

    # Increase file upload size
    client_max_body_size 15M;
}
