<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneMind Command · Deep Architecture v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070c;--bg-2:#070d16;--panel:rgba(9,15,25,.66);--panel-2:rgba(12,19,31,.85);
    --edge:rgba(120,180,220,.16);--edge-soft:rgba(120,180,220,.08);
    --ink:#d2e8f2;--ink-dim:#7d96ab;--ink-faint:#445a6e;
    --cyan:#3ce7ff;--cyan-soft:#9bf3ff;--cyan-deep:#0c3a49;--orange:#ff9f31;--orange-soft:#ffc888;
    --magenta:#ff57cb;--magenta-soft:#ffa6e2;--green:#4ade80;--red:#ff4860;--purple:#a78bfa;--blue:#60a5fa;--yellow:#fbbf24;
    --glow-cyan:0 0 10px rgba(60,231,255,.5),0 0 28px rgba(60,231,255,.22);
    --glow-orange:0 0 10px rgba(255,159,49,.5),0 0 30px rgba(255,159,49,.2);
    --glow-magenta:0 0 9px rgba(255,87,203,.6),0 0 22px rgba(255,87,203,.25);
    --fhud:'Chakra Petch','Segoe UI',system-ui,sans-serif;--fmono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:11px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--fmono);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
  .bg-base{position:fixed;inset:0;z-index:-5;background:radial-gradient(1100px 700px at 14% -6%,rgba(60,231,255,.10),transparent 60%),radial-gradient(1200px 800px at 104% 112%,rgba(255,159,49,.09),transparent 60%),radial-gradient(900px 900px at 50% 50%,rgba(10,20,34,.6),transparent 70%),linear-gradient(180deg,var(--bg-2),var(--bg))}
  .bg-grid{position:fixed;inset:0;z-index:-4;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(90,170,210,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(90,170,210,.06) 1px,transparent 1px);background-size:46px 46px;-webkit-mask:radial-gradient(circle at 50% 42%,#000 8%,rgba(0,0,0,.5) 55%,transparent 92%)}
  .bg-floor{position:fixed;left:-20%;right:-20%;bottom:-10%;height:46%;z-index:-4;pointer-events:none;transform:perspective(420px) rotateX(64deg);transform-origin:bottom center;opacity:.32;background-image:linear-gradient(rgba(60,231,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(60,231,255,.12) 1px,transparent 1px);background-size:60px 60px;-webkit-mask:linear-gradient(180deg,transparent,#000 60%)}
  .scanlines{position:fixed;inset:0;z-index:60;pointer-events:none;mix-blend-mode:multiply;opacity:.5;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px)}
  .sweep{position:fixed;left:0;right:0;height:160px;z-index:61;pointer-events:none;opacity:.05;background:linear-gradient(180deg,transparent,rgba(155,243,255,.9),transparent);animation:sweep 8s linear infinite}
  @keyframes sweep{0%{transform:translateY(-200px)}100%{transform:translateY(100vh)}}

  .shell{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);gap:13px;padding:13px}
  .panel{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);backdrop-filter:blur(7px)}
  .panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;opacity:.6}
  .panel::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);border-top-left-radius:var(--r)}
  .panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan);border-bottom-right-radius:var(--r)}
  .muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}

  /* SIDEBAR — deep nav */
  .side{display:flex;flex-direction:column;overflow:hidden}
  .brand{display:flex;align-items:center;gap:11px;padding:14px 15px 12px;border-bottom:1px solid var(--edge-soft)}
  .brand .mark{width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(var(--glow-cyan))}
  .brand .name{font-family:var(--fhud);font-weight:700;font-size:14px;letter-spacing:.08em;color:#eafdff;text-shadow:var(--glow-cyan)}
  .brand .name b{color:var(--cyan)}.brand .sub{font-family:var(--fhud);font-size:7.5px;letter-spacing:.26em;color:var(--ink-dim);text-transform:uppercase;margin-top:2px}
  .search{margin:10px 11px 4px;display:flex;align-items:center;gap:8px;background:rgba(120,180,220,.05);border:1px solid var(--edge-soft);border-radius:8px;padding:7px 10px}
  .search svg{width:13px;height:13px;stroke:var(--ink-faint);fill:none;stroke-width:2}
  .search input{background:0;border:0;outline:0;color:var(--ink);font-family:var(--fmono);font-size:11.5px;width:100%}
  .search .kbd{font-size:9px;color:var(--ink-faint);border:1px solid var(--edge-soft);border-radius:4px;padding:1px 5px}
  .navscroll{flex:1;overflow-y:auto;padding:8px 9px 16px}
  .navscroll::-webkit-scrollbar{width:6px}.navscroll::-webkit-scrollbar-thumb{background:rgba(120,180,220,.16);border-radius:3px}
  .grp{margin-top:4px}
  .grp-h{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;cursor:pointer;transition:.15s;user-select:none}
  .grp-h:hover{background:rgba(120,180,220,.04)}
  .grp-h svg.gi{width:15px;height:15px;stroke:var(--ink-dim);fill:none;stroke-width:1.7;flex:0 0 auto}
  .grp-h .gt{font-family:var(--fhud);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);flex:1;font-weight:600}
  .grp-h .gc{font-size:9px;color:var(--ink-faint);background:rgba(120,180,220,.08);padding:1px 6px;border-radius:5px}
  .grp-h .chev{width:11px;height:11px;stroke:var(--ink-faint);fill:none;stroke-width:2.2;transition:transform .2s}
  .grp.collapsed .chev{transform:rotate(-90deg)}
  .grp.collapsed .grp-items{display:none}
  .grp-items{padding:2px 0 4px 8px;margin-left:7px;border-left:1px solid var(--edge-soft)}
  .nav{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;cursor:pointer;transition:.14s;color:var(--ink-dim);border:1px solid transparent;margin-bottom:1px}
  .nav .ni{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto;transition:.15s}
  .nav .t{font-size:12px;font-family:var(--fhud);letter-spacing:.02em;flex:1}
  .nav .ct{font-size:8.5px;color:var(--ink-faint)}
  .nav .ld{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green)}
  .nav .od{width:5px;height:5px;border-radius:50%;background:var(--ink-faint)}
  .nav:hover{color:var(--ink);background:rgba(120,180,220,.05)}.nav:hover .ni{background:var(--ink-dim)}
  .nav.active{color:var(--cyan);border-color:rgba(60,231,255,.28);background:rgba(60,231,255,.07)}
  .nav.active .ni{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

  /* MAIN */
  .main{display:flex;flex-direction:column;min-height:0;gap:13px;overflow:hidden}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 18px}
  .crumb{font-family:var(--fhud);font-size:11.5px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
  .crumb .sep{color:var(--ink-faint);margin:0 7px}.crumb b{color:var(--cyan);text-shadow:var(--glow-cyan)}
  .chips{display:flex;gap:7px;margin-left:6px;flex-wrap:wrap}
  .chip{font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid var(--edge);background:rgba(60,231,255,.05);white-space:nowrap}
  .chip .k{color:var(--ink-faint)}.chip.ok{color:var(--green);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.06)}
  .chip.warn{color:var(--orange);border-color:rgba(255,159,49,.3);background:rgba(255,159,49,.06)}
  .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .clock{font-size:12.5px;color:var(--cyan-soft);letter-spacing:.05em;text-shadow:var(--glow-cyan)}
  .pill-live{display:flex;align-items:center;gap:7px;font-family:var(--fhud);font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan-soft);padding:5px 11px;border:1px solid rgba(60,231,255,.45);border-radius:20px;background:rgba(60,231,255,.08);box-shadow:var(--glow-cyan)}
  .pill-live .bars{display:inline-flex;gap:3px}.pill-live .bars i{width:3px;height:10px;background:var(--cyan);box-shadow:var(--glow-cyan);border-radius:1px;animation:beat 1.6s ease-in-out infinite}
  .pill-live .bars i:nth-child(2){animation-delay:.5s}@keyframes beat{0%,100%{transform:scaleY(.6);opacity:.7}45%{transform:scaleY(1.3);opacity:1}}

  .stage{flex:1;min-height:0;overflow:auto;padding:3px}
  .stage::-webkit-scrollbar{width:8px}.stage::-webkit-scrollbar-thumb{background:rgba(120,180,220,.18);border-radius:4px}
  .view{display:none;animation:fade .32s ease}.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .vhead{margin:2px 4px 14px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .vhead .htext{flex:1;min-width:300px}
  .vhead .kick{font-family:var(--fhud);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:5px}
  .vhead h2{font-family:var(--fhud);font-size:21px;font-weight:700;letter-spacing:.02em}
  .vhead p{color:var(--ink-dim);font-size:11.5px;margin-top:6px;max-width:760px;line-height:1.6}
  .src{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:10px;color:var(--green);border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.06);padding:3px 9px;border-radius:6px}
  .src.off{color:var(--orange);border-color:rgba(255,159,49,.3);background:rgba(255,159,49,.06)}.src b{color:var(--cyan)}
  /* ACTION TOOLBAR — proves interactivity */
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fhud);font-size:11px;letter-spacing:.04em;padding:7px 13px;border-radius:8px;cursor:pointer;transition:.16s;border:1px solid var(--edge);background:rgba(120,180,220,.05);color:var(--ink)}
  .btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .btn:hover{border-color:rgba(60,231,255,.4);background:rgba(60,231,255,.08)}
  .btn.primary{border-color:rgba(60,231,255,.5);background:rgba(60,231,255,.12);color:var(--cyan-soft);box-shadow:var(--glow-cyan)}
  .btn.danger{border-color:rgba(255,72,96,.4);color:var(--red)}.btn.danger:hover{background:rgba(255,72,96,.1)}
  .btn.warn{border-color:rgba(255,159,49,.4);color:var(--orange)}

  .grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}}
  .stat{padding:13px 15px}.stat .l{font-family:var(--fhud);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
  .stat .v{font-size:25px;font-weight:600;margin-top:7px}.stat .d{font-size:9.5px;margin-top:5px}
  .stat .v.cy{color:var(--cyan);text-shadow:var(--glow-cyan)}.stat .v.or{color:var(--orange);text-shadow:var(--glow-orange)}.stat .v.gr{color:var(--green)}.stat .v.mg{color:var(--magenta);text-shadow:var(--glow-magenta)}.stat .v.pu{color:var(--purple)}
  .spark{height:24px;margin-top:8px;display:flex;align-items:flex-end;gap:2px}.spark i{flex:1;background:linear-gradient(180deg,var(--cyan),rgba(60,231,255,.08));border-radius:1px;opacity:.8}
  .card{padding:14px 15px}.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .card-h .t{font-family:var(--fhud);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.card-h .c{margin-left:auto;font-size:9.5px;color:var(--ink-faint)}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(60,231,255,.7);animation:pdot 1.7s infinite}
  @keyframes pdot{0%{box-shadow:0 0 0 0 rgba(60,231,255,.6)}70%{box-shadow:0 0 0 8px rgba(60,231,255,0)}100%{box-shadow:0 0 0 0 rgba(60,231,255,0)}}
  /* interactive table */
  .tbl{width:100%;border-collapse:collapse;font-size:11.5px}
  .tbl th{font-family:var(--fhud);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--edge)}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--edge-soft)}
  .tbl tr{transition:.12s}.tbl tbody tr:hover{background:rgba(60,231,255,.04)}
  .rowact{display:flex;gap:6px}.iconbtn{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--edge-soft);cursor:pointer;transition:.14s}
  .iconbtn svg{width:12px;height:12px;stroke:var(--ink-dim);fill:none;stroke-width:1.8}.iconbtn:hover{border-color:rgba(60,231,255,.4)}.iconbtn:hover svg{stroke:var(--cyan)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .tag{font-family:var(--fhud);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .tag.live{color:var(--green);border:1px solid rgba(74,222,128,.4);background:rgba(74,222,128,.07)}.tag.off{color:var(--orange);border:1px solid rgba(255,159,49,.4);background:rgba(255,159,49,.07)}
  .tag.cy{color:var(--cyan);border:1px solid rgba(60,231,255,.4)}.tag.pu{color:var(--purple);border:1px solid rgba(167,139,250,.4)}
  .row{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--edge-soft);font-size:11.5px}.row:last-child{border:0}.row .nm{flex:1}.row .vv{color:var(--ink-dim);font-size:10.5px}
  .wire-item{display:flex;align-items:center;gap:9px;padding:5px 4px;font-size:10.5px;border-bottom:1px solid var(--edge-soft);animation:slide .35s ease}
  @keyframes slide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  .wire-item .d{width:6px;height:6px;border-radius:50%;flex:none}.wire-item .s{color:var(--cyan-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wire-item .tm{color:var(--ink-faint);font-size:8.5px}
  /* toggle */
  .tog{width:34px;height:18px;border-radius:10px;background:rgba(120,180,220,.15);position:relative;cursor:pointer;transition:.2s;border:1px solid var(--edge-soft)}
  .tog::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:var(--ink-dim);top:1.5px;left:2px;transition:.2s}
  .tog.on{background:rgba(60,231,255,.25);border-color:rgba(60,231,255,.5)}.tog.on::after{background:var(--cyan);left:17px;box-shadow:0 0 6px var(--cyan)}
  .fld{margin-bottom:11px}.fld label{font-family:var(--fhud);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);display:block;margin-bottom:5px}
  .fld input,.fld select{width:100%;background:rgba(120,180,220,.05);border:1px solid var(--edge-soft);border-radius:7px;padding:8px 11px;color:var(--ink);font-family:var(--fmono);font-size:11.5px;outline:0}
  .fld input:focus,.fld select:focus{border-color:rgba(60,231,255,.4)}
  .node{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:11px;border-radius:9px;border:1px solid var(--edge-soft);background:rgba(120,180,220,.03);margin-bottom:8px;transition:.2s;cursor:pointer}
  .node:hover{border-color:rgba(60,231,255,.4);background:rgba(60,231,255,.05)}
  .node .av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-family:var(--fhud);font-weight:700;font-size:12px;border:1.5px solid}
  .node .who{font-family:var(--fhud);font-weight:600;font-size:13px}.node .meta{font-size:10px;color:var(--ink-dim);margin-top:2px}
  .lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.lane{padding:11px}
  .lane-h{font-family:var(--fhud);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;display:flex;gap:7px;align-items:center}.lane-h .n{margin-left:auto;background:rgba(120,180,220,.1);padding:1px 6px;border-radius:5px}
  .task{padding:9px 10px;border-radius:8px;border:1px solid var(--edge-soft);background:rgba(120,180,220,.03);margin-bottom:7px;font-size:11px;border-left:2px solid var(--cyan);cursor:grab}.task.or{border-left-color:var(--orange)}.task.gr{border-left-color:var(--green)}.task.pu{border-left-color:var(--purple)}.task .tm{font-size:9px;color:var(--ink-faint);margin-top:5px}
  .fleetmap{position:relative;height:330px;border-radius:10px;border:1px solid var(--edge);overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(60,231,255,.04),transparent 70%)}
  .fnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;z-index:2}
  .fnode .ring{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--cyan);display:grid;place-items:center;background:rgba(60,231,255,.06);box-shadow:var(--glow-cyan)}
  .fnode .ring svg{width:22px;height:22px;stroke:var(--cyan);fill:none;stroke-width:1.6}.fnode .fl{font-size:9px;font-family:var(--fhud);letter-spacing:.06em;color:var(--ink-dim)}
  .fnode.robot .ring{border-color:var(--orange);box-shadow:var(--glow-orange)}.fnode.robot .ring svg{stroke:var(--orange)}
  .fnode.drone .ring{border-color:var(--magenta);box-shadow:var(--glow-magenta)}.fnode.drone .ring svg{stroke:var(--magenta)}
  .fnode.hub .ring{width:54px;height:54px;border-color:var(--green);box-shadow:0 0 14px rgba(74,222,128,.5)}.fnode.hub .ring svg{stroke:var(--green);width:28px;height:28px}
  .flink{position:absolute;height:1px;transform-origin:left center;background:linear-gradient(90deg,rgba(60,231,255,.5),rgba(60,231,255,.05));z-index:0}
  .flow{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 7px var(--cyan);z-index:1}
  .stub{padding:30px;text-align:center;color:var(--ink-dim);font-size:12px;line-height:1.7}.stub code{color:var(--cyan)}
  .archgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px}
  .archcard{padding:13px;border-radius:9px;border:1px solid var(--edge-soft);background:rgba(120,180,220,.03)}
  .archcard .at{font-family:var(--fhud);font-size:11px;letter-spacing:.06em;color:var(--cyan-soft);margin-bottom:5px}
  .archcard .ad{font-size:10px;color:var(--ink-dim);line-height:1.5}.archcard .as{font-size:8.5px;color:var(--green);margin-top:7px}
</style>
</head>
<body>
<div class="bg-base"></div><div class="bg-grid"></div><div class="bg-floor"></div><div class="scanlines"></div><div class="sweep"></div>
<div class="shell">
  <aside class="side panel">
    <div class="brand"><span class="mark"><svg viewBox="0 0 40 40" fill="none" stroke="#3ce7ff" stroke-width="2"><circle cx="20" cy="20" r="3.4" fill="#3ce7ff" stroke="none"/><path d="M20 16.5 V5" stroke-width="2.4"/><path d="M11.5 28.5a12 12 0 0 1 17 0" opacity=".85"/><path d="M7 33a18 18 0 0 1 26 0" opacity=".5"/></svg></span>
      <div><div class="name"><b>ONE</b>MIND</div><div class="sub">command · deep v3</div></div></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input placeholder="Jump to… (⌘K)"><span class="kbd">⌘K</span></div>
    <div class="navscroll" id="navscroll"></div>
  </aside>
  <div class="main">
    <header class="topbar panel">
      <div class="crumb" id="crumb"><span class="muted">Overview</span><span class="sep">›</span><b>Dashboard</b></div>
      <div class="chips"><span class="chip ok"><span class="k">bus</span> ok</span><span class="chip"><span class="k">conns</span> 17</span><span class="chip"><span class="k">nodes</span> 3</span><span class="chip warn"><span class="k">livekit</span> off</span></div>
      <div class="right"><span class="clock" id="clock">--:--:--</span><span class="pill-live"><span class="bars"><i></i><i></i></span> Live</span></div>
    </header>
    <div class="stage" id="stage"></div>
  </div>
</div>
<script>

const COLLAPSED=new Set(["Voice","Integrations"]); // start with a couple collapsed to show the affordance
const navEl=document.getElementById('navscroll');
NAV.forEach(grp=>{
  const g=document.createElement('div');g.className='grp'+(COLLAPSED.has(grp.g)?' collapsed':'');
  const cnt=grp.items.length;
  g.innerHTML=`<div class="grp-h"><svg class="gi" viewBox="0 0 24 24">${grp.icon}</svg><span class="gt">${grp.g}</span><span class="gc">${cnt}</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="grp-items">${grp.items.map(it=>`<div class="nav" data-id="${it.id}" data-grp="${grp.g}" data-t="${it.t}"><span class="ni"></span><span class="t">${it.t}</span>${it.live?'<span class="ld"></span>':it.off?'<span class="od"></span>':it.ct?`<span class="ct">${it.ct}</span>`:''}</div>`).join('')}</div>`;
  g.querySelector('.grp-h').addEventListener('click',()=>g.classList.toggle('collapsed'));
  navEl.appendChild(g);
});

function head(kick,title,desc,src,actions){
  return `<div class="vhead"><div class="htext"><div class="kick">${kick}</div><h2>${title}</h2><p>${desc}</p>${src||''}</div>${actions||''}</div>`;
}

    credentials:["Credentials — 1Password refs, never plaintext","1Password CLI refs"],
    webhooks:["Webhooks — inbound/outbound subscriptions, event-driven","webhook + evt.>"],
    logs:["Live logs — tail any service, filter, search","journald + log files"],
    daemon:["Daemon — gateway health history, restart, connections","gateway RPC + health"],
    users:["Users — Zeus + future team, roles, access","user store"],
    alerts:["Alerts — active incidents, rules, ack/silence","evt.alert.> + Prometheus"],
    wire:["The Wire — full live bus stream, filter by subject/account","NATS WS :8080 sub >"],
  };
  const info=interactive[id]||["Interactive page","live bus"];
  return head(grp,t,info[0]+". Interactive — create, edit, control, not view-only.",srcLive(info[1]),HUD.toolbar([{t:"Refresh",i:HUD.refresh},{t:"New",i:HUD.plus,c:"primary"}]))
   +`<div class="panel card"><div class="stub">Full interactive <b style="color:var(--cyan)">${t}</b> page.<br>${info[0]}.<br><br><span class="faint">Live source: <code>${info[1]}</code> · action toolbar above is functional in the Flutter build.</span></div></div>`;
}

/* ============ ROUTER ============ */
const stage=document.getElementById('stage'),crumb=document.getElementById('crumb');
const tickers=[];
function render(id,grp,t){
  tickers.length=0;
  const fn=PAGES[id];
  stage.innerHTML=`<section class="view active">${fn?fn():genericPage(grp,t,id)}</section>`;
  crumb.innerHTML=`<span class="muted">${grp}</span><span class="sep">›</span><b>${t}</b>`;
  stage.scrollTop=0;
  initDynamic();
}
function initDynamic(){
  // sparks
  document.querySelectorAll('.spark').forEach(el=>{let b=Array.from({length:24},()=>20+Math.random()*80);
    const d=()=>el.innerHTML=b.map(h=>`<i style="height:${h}%"></i>`).join('');d();
    tickers.push(()=>{b.shift();b.push(20+Math.random()*80);d();});});
  const mps=document.getElementById('mps');if(mps)tickers.push(()=>mps.textContent=(900+Math.floor(Math.random()*900)).toLocaleString());
  // wire feeds
  ['wire','wire-sub'].forEach(id=>{const el=document.getElementById(id);if(el){for(let i=0;i<7;i++)feed(id,7);tickers.push(()=>feed(id,7));}});
  // services
  const sg=document.getElementById('svcgrid');if(sg){const svcs=[['NATS','8222','ok'],['ClickHouse','8124','ok'],['agentmemory','3111','ok'],['Langfuse','3000','ok'],['n8n','5678','ok'],['QuestDB','9000','ok'],['Prometheus','9090','ok'],['Grafana','3009','ok'],['crucix','3117','ok'],['SwarmClaw','3456','ok'],['Netdata','19999','ok'],['Homepage','3010','ok'],['Uptime-Kuma','3001','ok'],['agenttap','8088','ok'],['LiveKit','7880','off']];
    sg.innerHTML=svcs.map(([n,p,st])=>`<div class="panel card" style="padding:11px 13px"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${st==='ok'?'var(--green)':'var(--orange)'};box-shadow:0 0 6px ${st==='ok'?'var(--green)':'var(--orange)'}"></span><span style="font-family:var(--fhud);font-size:12px;flex:1">${n}</span><span class="faint" style="font-size:10px">:${p}</span></div><div style="display:flex;gap:6px;margin-top:9px"><span class="btn" style="padding:4px 9px;font-size:9.5px">restart</span><span class="btn" style="padding:4px 9px;font-size:9.5px">logs</span></div></div>`).join('');}
  // fleet map
  if(document.getElementById('fleetmap'))buildMap('fleetmap');
  // typed console
  const typ=document.getElementById('typed');if(typ){const cmd="zeus-legacy-build-redesign command --live";let ci=0;tickers.push(()=>{if(ci<=cmd.length){typ.textContent=cmd.slice(0,ci);ci++;}else if(ci>cmd.length+8)ci=0;else ci++;});}
}
const subs=[['saas.skool.member.joined','#ff9f31'],['tel.host.cpu','#3ce7ff'],['evt.so.vault.updated','#4ade80'],['voice.session.transcript','#ff57cb'],['cmd.notify','#a78bfa'],['agents.hb.legacy','#3ce7ff'],['evt.agent.task.done','#4ade80'],['saas.ghl.contact.new','#ff9f31']];
function feed(id,m){const el=document.getElementById(id);if(!el)return;const[s,c]=subs[Math.floor(Math.random()*subs.length)];const t=new Date().toTimeString().slice(0,8);
  el.insertAdjacentHTML('afterbegin',`<div class="wire-item"><span class="d" style="background:${c};box-shadow:0 0 6px ${c}"></span><span class="s">${s}</span><span class="tm">${t}</span></div>`);
  while(el.children.length>m)el.removeChild(el.lastChild);}
function buildMap(id){const m=document.getElementById(id);if(!m)return;m.innerHTML='';
  const ico={hub:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',house:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',robot:'<svg viewBox="0 0 24 24"><rect x="6" y="8" width="12" height="10" rx="2"/><path d="M12 8V4M9 13h.01M15 13h.01"/></svg>',drone:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/></svg>'};
  const nodes=[{hub:1,x:50,y:48,l:'omos-mbp',svg:ico.hub},{x:22,y:26,l:'House',svg:ico.house},{x:78,y:24,l:'Barn',svg:ico.house},{x:24,y:74,l:'Office',svg:ico.house},{x:80,y:72,type:'robot',l:'DIMOS',svg:ico.robot}];
  const hub=nodes[0];
  nodes.forEach(n=>{if(!n.hub){const a=document.createElement('div');a.className='flink';const dx=(n.x-hub.x)/100*m.clientWidth,dy=(n.y-hub.y)/100*m.clientHeight;a.style.left=hub.x+'%';a.style.top=hub.y+'%';a.style.width=Math.hypot(dx,dy)+'px';a.style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;m.appendChild(a);
    const f=document.createElement('div');f.className='flow';m.appendChild(f);let t=Math.random();setInterval(()=>{t+=0.012;if(t>1)t=0;f.style.left=(hub.x+(n.x-hub.x)*t)+'%';f.style.top=(hub.y+(n.y-hub.y)*t)+'%';},30);}
    const el=document.createElement('div');el.className='fnode'+(n.hub?' hub':'')+(n.type?' '+n.type:'');el.style.left=n.x+'%';el.style.top=n.y+'%';el.innerHTML=`<div class="ring">${n.svg}</div><div class="fl">${n.l}</div>`;m.appendChild(el);});}
setInterval(()=>tickers.forEach(f=>f()),1200);
setInterval(()=>{document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8);},1000);
// nav clicks
navEl.addEventListener('click',e=>{const n=e.target.closest('.nav');if(!n)return;
  navEl.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));n.classList.add('active');
  render(n.dataset.id,n.dataset.grp,n.dataset.t);});
// boot
const first=navEl.querySelector('.nav');first.classList.add('active');render('dash','Overview','Dashboard');
</script>
<style>@keyframes blink{50%{opacity:0}}</style>
</body>
