version: "3.9"

services:
  soil-sensors:
    build: .
    command: python run_sensors.py
    environment:
      NATS_URL: nats://nats:4222
      HOMESTEAD_ID: greenwich
      FIELD_COUNT: "4"
      SENSOR_INTERVAL: "3"
    depends_on: [nats]
    restart: unless-stopped

  land-agent:
    build: .
    command: python run_agent.py
    environment:
      NATS_URL: nats://nats:4222
      HOMESTEAD_ID: greenwich
      MOISTURE_THRESHOLD: "30"
    depends_on: [nats]
    restart: unless-stopped

  mavlink-bridge:
    build: .
    command: python run_mavlink.py
    environment:
      NATS_URL: nats://nats:4222
      HOMESTEAD_ID: greenwich
      MAVLINK_ADDRESS: "udp://:14540"
    network_mode: host   # MAVLink UDP needs host networking
    restart: unless-stopped

  clickhouse-writer:
    build: .
    command: python run_clickhouse.py
    environment:
      NATS_URL: nats://nats:4222
      HOMESTEAD_ID: greenwich
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-100.74.182.117}
      CLICKHOUSE_PORT: "9001"
      CLICKHOUSE_DB: onemind
    depends_on: [nats]
    restart: unless-stopped

  nats:
    image: nats:latest
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

networks:
  default:
    name: rads-net
