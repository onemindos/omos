apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  replicas: 1
  selector:
    matchLabels: { app: onepassword-connect }
  template:
    metadata:
      labels: { app: onepassword-connect }
    spec:
      initContainers:
        - name: wait-for-sync
          image: busybox
          command: ["sh", "-c", "sleep 5"]
      containers:
        - name: connect-sync
          image: 1password/connect-sync:latest
          volumeMounts:
            - name: credentials
              mountPath: /home/opuser/.op/1password-credentials.json
              subPath: 1password-credentials.json
              readOnly: true
            - name: data
              mountPath: /home/opuser/.op/data
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
        - name: connect-api
          image: 1password/connect-api:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: credentials
              mountPath: /home/opuser/.op/1password-credentials.json
              subPath: 1password-credentials.json
              readOnly: true
            - name: data
              mountPath: /home/opuser/.op/data
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /heartbeat, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: credentials
          secret:
            secretName: onepassword-connect-credentials
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  selector: { app: onepassword-connect }
  ports:
    - port: 8080
      targetPort: 8080
