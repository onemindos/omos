# ClusterSecretStore — 1Password via Connect Server pod (in-cluster)
# Connect pod managed by Helm chart: helm release 'onepassword-connect' in external-secrets ns
# Connect URL: http://onepassword-connect.external-secrets.svc.cluster.local:8080
#
# ExternalSecret key format (Connect provider):
#   remoteRef.key:      exact item title in 1Password
#   remoteRef.property: field label, or "section.field" for section-scoped fields
#
# Secrets (out-of-band, never committed):
#   op-credentials                — 1password-credentials.json (Helm chart default name)
#   onepassword-connect-token     — Connect JWT token
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets.svc.cluster.local:8080
      vaults:
        "00-24 SO (Sovereign Operations)": 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets
            key: token
