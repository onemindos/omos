# ClusterSecretStore — 1Password via SDK (service account token)
# Vault: 00-24 SO (Sovereign Operations) — ID: aaeyris5z44pdqspk277u2oppi
#
# ExternalSecret key format (op:// URI):
#   op://<vault-id>/<item-id>/<section>/<field>
#   op://<vault-id>/<item-id>/<field>        (root-level field, no section)
#
# NOTE: ESO v2.7.0 has a bug where the key validator blocks op:// URIs (/ and : chars).
# Tracking: https://github.com/external-secrets/external-secrets/issues/4072
# Workaround: use dataFrom.extract with just the item ID until ESO v2.8 ships.
# When fixed, keys should look like:
#   key: "op://aaeyris5z44pdqspk277u2oppi/<item-id>/<section>/<field>"
#
# Secret: onepassword-service-account in external-secrets namespace (out-of-band)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: "aaeyris5z44pdqspk277u2oppi"
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
