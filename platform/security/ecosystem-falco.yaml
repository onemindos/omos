apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.2.0
    helm:
      releaseName: falco
      valueFiles:
      - $values/platform/ecosystem/values/falco.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
