apiVersion: v1
kind: ResourceQuota
metadata:
  name: trivy-pilot-budget
  namespace: trivy-system
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 2Gi
    limits.cpu: '3'
    limits.memory: 5Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 10Gi
    pods: '4'
    count/jobs.batch: '5'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-pilot
  namespace: trivy-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API (observed port 443), public registries and vulnerability DB.
    # No HTTP registries, node sockets or host mounts are required.
    # HTTPS is intentionally not an FQDN allowlist; see the runbook's limitations.
    - ports:
        - protocol: TCP
          port: 443
