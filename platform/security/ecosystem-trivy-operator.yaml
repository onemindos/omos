apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts
      chart: trivy-operator
      targetRevision: 0.37.0
      helm:
        releaseName: trivy-operator
        valueFiles:
          - $values/platform/ecosystem/values/trivy-operator.yaml
    - repoURL: https://github.com/onemindos/omos.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
