# Existing shared namespaces: label ownership only; controllers remain in their
# existing Applications. These namespaces must never be pruned or deleted by Argo.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
  labels:
    onemind.io/layer: guard
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
