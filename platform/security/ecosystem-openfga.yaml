apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-openfga
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://openfga.github.io/helm-charts
    chart: openfga
    targetRevision: 0.3.16
    helm:
      releaseName: openfga
      valueFiles:
      - $values/platform/ecosystem/values/openfga.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: onemind-core
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
