# The auth callout serves only over NATS (outbound). No pod may connect to it; kubelet probes
# from the pod's own node are admitted by Cilium on DOKS (as platform/policy/network-policy.yaml).
# Egress stays open: NATS (namespace nats, allowed for onemind-core by nats-clients) and the
# Authentik JWKS (namespace auth, service platform-auth-helm-authentik-server, port 80).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-callout-ingress
  namespace: onemind-core
spec:
  podSelector:
    matchLabels:
      app: auth-callout
  policyTypes: [Ingress]
