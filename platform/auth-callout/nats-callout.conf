# NATS config additions for the auth callout (FEATURES J2). Not applied by Argo (excluded in
# platform/argocd/platform-auth-callout.yaml): it is merged into the nats-config ConfigMap by
# the owner, after the A19 stage A1 accounts are live (platform/nats/IDENTITIES.md, PR #562)
# and the auth-callout Deployment is Ready. README.md has the order, checks and rollback.
#
# The two public keys are generated by the owner (README.md step 1); their seeds go only into
# the SealedSecret auth-callout-keys. Public keys are not secrets.
#
# Server behaviour this relies on (nats-server v2.14.2, the live version; source
# server/auth.go processClientOrLeafAuthentication and server/auth_callout.go, and the
# services/auth-callout integration tests on an in-process 2.14.2):
#   - a password login that matches a configured user in an account NOT listed in
#     allowed_accounts keeps its result and never reaches the callout (all service users);
#   - an unknown login (an OIDC token, a wrong password) is sent to the callout;
#   - users in auth_users (the callout itself) are never called out;
#   - leafs that authenticate through leafnodes { authorization { users } } (today, stage A1)
#     never reach the callout; leafs that authenticate as account users (stage A2) always do,
#     and are refused (proposal J2-P1);
#   - in config mode the callout's user JWT `aud` names the account the client is placed in
#     (CLIENT), and its `name` becomes the user name in Nats-Request-Info.

# 1. Add to `accounts { ... }`:
AUTH {
  users: [
    { user: auth-callout, password: "__AUTH_CALLOUT_PW__",  # bcrypt hash in the live config
      allowed_connection_types: [STANDARD],
      permissions: {
        publish: { deny: [">"] }
        subscribe: { allow: ["$SYS.REQ.USER.AUTH"] }
        allow_responses: { max: 1, expires: "5s" }
      } }
  ]
}

# 2. Add at the top level (next to `accounts`):
authorization {
  auth_callout {
    issuer: "__CALLOUT_ISSUER_PUBLIC_KEY__"   # A... (account nkey public key)
    xkey: "__CALLOUT_XKEY_PUBLIC_KEY__"       # X... (curve public key; requests and replies encrypted)
    auth_users: [ auth-callout ]
    account: AUTH
    # Only users already bound to AUTH would be re-checked by the callout (none besides the
    # callout user, which auth_users skips). An empty list would send EVERY password user,
    # in every account, to the callout.
    allowed_accounts: [ AUTH ]
  }
}
