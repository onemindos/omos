# Read-only role for AI operators (PLATFORM-ROADMAP.md, phase 2g): every `:view` action in
# OpenChoreo v1.3.1 except secret values and references. It grants no create, update,
# delete, deploy or build-trigger action. Bound to the `ai-operator` Authentik service
# account in ai-operator-read-binding.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: ai-operator-read
spec:
  actions:
    - alerts:view
    - auditlogs:view
    - authzrole:view
    - authzrolebinding:view
    - clusterauthzrole:view
    - clusterauthzrolebinding:view
    - clustercomponenttype:view
    - clusterdataplane:view
    - clusterobservabilityplane:view
    - clusterprojecttype:view
    - clusterresourcetype:view
    - clustertrait:view
    - clusterworkflow:view
    - clusterworkflowplane:view
    - component:view
    - componentrelease:view
    - componenttype:view
    - dataplane:view
    - deliveryinsights:view
    - deploymentpipeline:view
    - environment:view
    - events:view
    - finops:view
    - finopsreport:view
    - incidents:view
    - logs:view
    - metrics:view
    - namespace:view
    - observabilityalertsnotificationchannel:view
    - observabilityplane:view
    - platformlogs:view
    - project:view
    - projectrelease:view
    - projectreleasebinding:view
    - projecttype:view
    - rcareport:view
    - releasebinding:view
    - resource:view
    - resourcerelease:view
    - resourcereleasebinding:view
    - resourcetype:view
    - traces:view
    - trait:view
    - wirelogs:view
    - workflow:view
    - workflowplane:view
    - workflowrun:view
    - workload:view
