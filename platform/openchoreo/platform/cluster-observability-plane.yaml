# Merge after the observability plane is healthy; pin its own agent CA, not the data-plane CA.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterObservabilityPlane
metadata:
  name: default
spec:
  planeID: default
  clusterAgent:
    clientCA:
      secretKeyRef:
        name: cluster-agent-tls
        namespace: openchoreo-observability-plane
        key: ca.crt
  # Console clients call this URL directly; keep it browser-reachable and authenticated.
  observerURL: https://onemind-observer.tail717ba0.ts.net
