# ClusterObservabilityPlane registration (OpenChoreo install guide v1.3.x, PLATFORM-ROADMAP.md phase 5).
# Links the default ClusterDataPlane to the observability plane deployed by
# platform-openchoreo-observability. The plane's in-cluster observer, FinOps and RCA
# agents reach the existing Prometheus, OpenSearch, Tempo and OpenCost backends.
# No plaintext credentials are included here; the data-plane CA is read from the
# secret created by the openchoreo-data-plane Helm release.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterObservabilityPlane
metadata:
  name: observability
spec:
  planeID: observability
  clusterAgent:
    clientCA:
      secretKeyRef:
        name: cluster-agent-tls
        namespace: openchoreo-data-plane
        key: ca.crt
  observerURL: http://observer.openchoreo-observability-plane.svc.cluster.local:8080
  finOpsAgentURL: http://opencost.opencost.svc.cluster.local:9003
