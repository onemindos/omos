# Binds the read-only role to the `ai-operator` Authentik service account
# (platform/ecosystem/resources/ai-operator-identity.yaml). The `user` subject type matches
# the token's `sub` claim (openchoreoApi.config.security.subjects in oc-control.yaml).
# This `sub` is Authentik's hashed id for the account, read from the identity Job log on
# 2026-10-18; it changes only if the account is deleted and recreated.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: ai-operator-read-binding
spec:
  effect: allow
  entitlement:
    claim: sub
    value: 871446cc889dcc8d7c6d59565328bb44543419b05732d1c1f46de212b098d551
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: ai-operator-read
