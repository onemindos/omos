# Authorization retained for the OneMind portal after Phase 6 console retirement. The `user` subject type matches the
# token's `sub` claim (oc-control.yaml), so both bindings use Authentik's hashed user ids.
#
# - backstage-catalog: the portal's reused catalog-sync service account. Read-only role.
#   `sub` from the identity Job log (platform/ecosystem/resources/ai-operator-identity.yaml).
# - akadmin: the registered human operator, the only Authentik user allowed to sign in to
#   the application interactively. The same `sub` as the portal's catalog user
#   (platform/backstage/catalog/org.yaml): hashed_user_id does not depend on the provider.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: console-catalog-reader-binding
spec:
  effect: allow
  entitlement:
    claim: sub
    value: 081df23177ecb37e8f556634db29f30e6a3df6273881ad9995aa52df722a29e7
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: backstage-catalog-reader
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: operator-admin-binding
spec:
  effect: allow
  entitlement:
    claim: sub
    value: f73e10d872325ed63330a138782f12d3e8252e00a05466e2f0180bcc885a42c4
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: admin
