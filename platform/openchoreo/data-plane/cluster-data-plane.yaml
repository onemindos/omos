# Install guide v1.3.x step 5, "Register the Data Plane".
# - clientCA: the agent's own self-signed CA from Secret cluster-agent-tls (ca.crt),
#   public certificate only. Re-read it if that certificate is ever reissued.
# - Domain: the guide's nip.io pattern on the gateway's LoadBalancer IP. Here that IP is
#   the Tailscale address of the onemind-private gateway, so apps resolve to the tailnet
#   only. HTTP only until gateway TLS is enabled.
