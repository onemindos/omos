# Generated with verified upstream occ v1.3.1 from the app/type/trait inputs.
# Health-probe trait snapshot matches the installed default; no shared trait changes.
# yamllint disable rule:line-length
apiVersion: openchoreo.dev/v1alpha1
kind: ComponentRelease
metadata:
  name: maputnik-v1
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  componentProfile:
    traits:
    - instanceName: gateway
      kind: ClusterTrait
      name: cilium-gateway-ingress
      parameters:
        port: 8888
    - instanceName: health
      kind: ClusterTrait
      name: health-probes
      parameters:
        liveness:
          enabled: true
          failureThreshold: 3
          handler:
            httpGet:
              path: /
              port: 8888
          periodSeconds: 30
          timeoutSeconds: 3
        readiness:
          enabled: true
          handler:
            httpGet:
              path: /
              port: 8888
          periodSeconds: 10
          timeoutSeconds: 3
        startup:
          enabled: true
          failureThreshold: 24
          handler:
            httpGet:
              path: /
              port: 8888
          periodSeconds: 5
          timeoutSeconds: 3
  componentType:
    kind: ClusterComponentType
    name: deployment/onemind-service
    spec:
      allowedTraits:
      - kind: ClusterTrait
        name: cilium-gateway-ingress
      - kind: ClusterTrait
        name: health-probes
      - kind: ClusterTrait
        name: horizontal-pod-autoscaler
      - kind: ClusterTrait
        name: observability-alert-rule
      - kind: ClusterTrait
        name: persistent-volume-claim
      - kind: ClusterTrait
        name: vertical-pod-autoscaler
      allowedWorkflows:
      - kind: ClusterWorkflow
        name: paketo-buildpacks-builder
      - kind: ClusterWorkflow
        name: gcp-buildpacks-builder
      - kind: ClusterWorkflow
        name: dockerfile-builder
      - kind: ClusterWorkflow
        name: ballerina-buildpack-builder
      environmentConfigs:
        openAPIV3Schema:
          $defs:
            ResourceQuantity:
              default: {}
              properties:
                cpu:
                  default: 50m
                  type: string
                memory:
                  default: 128Mi
                  type: string
              type: object
            ResourceRequirements:
              default: {}
              properties:
                limits:
                  $ref: '#/$defs/ResourceQuantity'
                requests:
                  $ref: '#/$defs/ResourceQuantity'
              type: object
          properties:
            imagePullPolicy:
              default: IfNotPresent
              enum:
              - Always
              - IfNotPresent
              - Never
              type: string
            replicas:
              default: 1
              minimum: 0
              type: integer
            resources:
              $ref: '#/$defs/ResourceRequirements'
            strategy:
              default: RollingUpdate
              description: Use Recreate when the component mounts a ReadWriteOnce volume.
              enum:
              - RollingUpdate
              - Recreate
              type: string
          type: object
      resources:
      - id: deployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            labels: ${metadata.labels}
            name: ${metadata.name}
            namespace: ${metadata.namespace}
          spec:
            replicas: ${environmentConfigs.replicas}
            selector:
              matchLabels: ${metadata.podSelectors}
            strategy:
              type: ${environmentConfigs.strategy}
            template:
              metadata:
                labels: ${metadata.podSelectors}
              spec:
                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                    - preference:
                        matchExpressions:
                        - key: onemind.io/compute-role
                          operator: In
                          values:
                          - ecosystem
                      weight: 100
                containers:
                - args: '${has(workload.container.args) ? workload.container.args : oc_omit()}

                    '
                  command: '${has(workload.container.command) ? workload.container.command : oc_omit()}

                    '
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  name: main
                  resources:
                    limits:
                      cpu: ${environmentConfigs.resources.limits.cpu}
                      memory: ${environmentConfigs.resources.limits.memory}
                    requests:
                      cpu: ${environmentConfigs.resources.requests.cpu}
                      memory: ${environmentConfigs.resources.requests.memory}
                  volumeMounts: ${configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts()}
                volumes: ${configurations.toVolumes() + dependencies.toVolumes()}
      - id: service
        includeWhen: ${size(workload.endpoints) > 0}
        template:
          apiVersion: v1
          kind: Service
          metadata:
            labels: ${metadata.labels}
            name: ${metadata.componentName}
            namespace: ${metadata.namespace}
          spec:
            ports: ${workload.toServicePorts()}
            selector: ${metadata.podSelectors}
            type: ClusterIP
      - forEach: ${workload.endpoints.transformMap(name, ep, "external" in ep.visibility && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
        id: httproute-external
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility": "external"})}'
            name: ${oc_generate_name(metadata.componentName, endpoint.key)}
            namespace: ${metadata.namespace}
          spec:
            hostnames: "${[gateway.ingress.external.?http, gateway.ingress.external.?https]\n  .filter(g, g.hasValue()).map(g, g.value().host).distinct()\n  .map(h, metadata.environmentName\
              \ + \"-\" + metadata.componentNamespace + \".\" + h)}\n"
            parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
            rules:
            - backendRefs:
              - name: ${metadata.componentName}
                port: ${endpoint.value.port}
              filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                    type: ReplacePrefixMatch
              matches:
              - path:
                  type: PathPrefix
                  value: /${metadata.componentName}-${endpoint.key}
        var: endpoint
      - forEach: ${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
        id: httproute-internal
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility": "internal"})}'
            name: ${oc_generate_name(metadata.componentName, endpoint.key, "internal")}
            namespace: ${metadata.namespace}
          spec:
            hostnames: "${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]\n  .filter(g, g.hasValue()).map(g, g.value().host).distinct()\n  .map(h, metadata.environmentName\
              \ + \"-\" + metadata.componentNamespace + \".\" + h)}\n"
            parentRefs:
            - name: ${gateway.ingress.internal.name}
              namespace: ${gateway.ingress.internal.namespace}
            rules:
            - backendRefs:
              - name: ${metadata.componentName}
                port: ${endpoint.value.port}
              filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                    type: ReplacePrefixMatch
              matches:
              - path:
                  type: PathPrefix
                  value: /${metadata.componentName}-${endpoint.key}
        var: endpoint
      - forEach: ${configurations.toConfigEnvsByContainer()}
        id: env-config
        template:
          apiVersion: v1
          data: '${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}

            '
          kind: ConfigMap
          metadata:
            name: ${envConfig.resourceName}
            namespace: ${metadata.namespace}
        var: envConfig
      - forEach: ${configurations.toConfigFileList()}
        id: file-config
        template:
          apiVersion: v1
          data:
            ${config.name}: '${config.value}

              '
          kind: ConfigMap
          metadata:
            name: ${config.resourceName}
            namespace: ${metadata.namespace}
        var: config
      - forEach: ${configurations.toSecretEnvsByContainer()}
        id: secret-env-external
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${secretEnv.resourceName}
            namespace: ${metadata.namespace}
          spec:
            data: "${secretEnv.envs.map(secret, {\n  \"secretKey\": secret.name,\n  \"remoteRef\": {\n    \"key\": secret.remoteRef.key,\n    ?\"property\": secret.remoteRef.?property\n\
              \  }\n})}\n"
            refreshInterval: 15s
            secretStoreRef:
              kind: ClusterSecretStore
              name: ${dataplane.secretStore}
            target:
              creationPolicy: Owner
              name: ${secretEnv.resourceName}
        var: secretEnv
      - forEach: ${configurations.toSecretFileList()}
        id: secret-file-external
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${file.resourceName}
            namespace: ${metadata.namespace}
          spec:
            data:
            - remoteRef:
                key: ${file.remoteRef.key}
                property: '${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}

                  '
              secretKey: ${file.name}
            refreshInterval: 15s
            secretStoreRef:
              kind: ClusterSecretStore
              name: ${dataplane.secretStore}
            target:
              creationPolicy: Owner
              name: ${file.resourceName}
        var: file
      validations:
      - message: Service components must have at least one endpoint. Use 'deployment/worker' for components without endpoints.
        rule: ${size(workload.endpoints) > 0}
      - message: Endpoints with 'external' visibility require gateway.ingress.external to be configured on the Environment or DataPlane.
        rule: "${workload.endpoints.exists(name, ep, \"external\" in ep.visibility)\n  ? has(gateway.ingress) && has(gateway.ingress.external)\n  : true}"
      - message: Endpoints with 'internal' visibility require gateway.ingress.internal to be configured on the Environment or DataPlane.
        rule: "${workload.endpoints.exists(name, ep, \"internal\" in ep.visibility)\n  ? has(gateway.ingress) && has(gateway.ingress.internal)\n  : true}"
      workloadType: deployment
  owner:
    componentName: maputnik
    projectName: onetak
  traits:
  - kind: ClusterTrait
    name: cilium-gateway-ingress
    spec:
      creates:
      - targetPlane: dataplane
        template:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          metadata:
            name: ${oc_generate_name(metadata.componentName, "cilium-gateway")}
            namespace: ${metadata.namespace}
          spec:
            endpointSelector:
              matchLabels: ${metadata.podSelectors}
            ingress:
            - fromEntities:
              - ingress
              toPorts:
              - ports:
                - port: ${string(parameters.port)}
                  protocol: TCP
      parameters:
        openAPIV3Schema:
          properties:
            port:
              default: 8080
              maximum: 65535
              minimum: 1
              type: integer
          type: object
  - kind: ClusterTrait
    name: health-probes
    spec:
      environmentConfigs:
        openAPIV3Schema:
          properties:
            enabled:
              default: true
              description: Master switch for this environment. When disabled, none of the probes are configured here.
              type: boolean
              x-openchoreo-backstage-portal:
                ui:widget: checkbox
          type: object
      parameters:
        openAPIV3Schema:
          $defs:
            Handler:
              description: Select the type of probe to use and configure its parameters
              oneOf:
              - maxProperties: 0
                title: None
                type: object
              - properties:
                  httpGet:
                    properties:
                      path:
                        default: /
                        title: Path
                        type: string
                      port:
                        maximum: 65535
                        minimum: 1
                        title: Port
                        type: integer
                    title: ''
                    type: object
                required:
                - httpGet
                title: HTTP GET
              - properties:
                  tcpSocket:
                    properties:
                      port:
                        maximum: 65535
                        minimum: 1
                        title: Port
                        type: integer
                    title: ''
                    type: object
                required:
                - tcpSocket
                title: TCP socket
              - properties:
                  grpc:
                    properties:
                      port:
                        maximum: 65535
                        minimum: 1
                        title: Port
                        type: integer
                      service:
                        description: Optional name of the service to check. When unset, the overall gRPC health is used.
                        title: Service
                        type: string
                    title: ''
                    type: object
                required:
                - grpc
                title: gRPC
              - properties:
                  exec:
                    properties:
                      command:
                        description: Command to run inside the container. A zero exit code means healthy.
                        items:
                          type: string
                        title: Command
                        type: array
                    title: ''
                    type: object
                required:
                - exec
                title: Exec
              title: Handler
              x-openchoreo-backstage-portal:
                ui:options:
                  hideError: true
          properties:
            containerName:
              default: main
              description: Name of the container the probes are attached to. Defaults to 'main'.
              title: Container name
              type: string
            liveness:
              default: {}
              description: Restarts the container when it stops being healthy.
              properties:
                enabled:
                  default: false
                  title: Enabled
                  type: boolean
                  x-openchoreo-backstage-portal:
                    ui:widget: checkbox
                failureThreshold:
                  default: 3
                  minimum: 1
                  title: Failure threshold
                  type: integer
                handler:
                  $ref: '#/$defs/Handler'
                initialDelaySeconds:
                  default: 0
                  description: Seconds to wait after the container starts before the first probe.
                  minimum: 0
                  title: Initial delay seconds
                  type: integer
                periodSeconds:
                  default: 10
                  minimum: 1
                  title: Period seconds
                  type: integer
                timeoutSeconds:
                  default: 1
                  minimum: 1
                  title: Timeout seconds
                  type: integer
              title: Liveness probe
              type: object
              x-openchoreo-backstage-portal:
                ui:order:
                - enabled
                - handler
                - initialDelaySeconds
                - periodSeconds
                - timeoutSeconds
                - failureThreshold
            readiness:
              default: {}
              description: Removes the pod from service endpoints while it is not ready to receive traffic.
              properties:
                enabled:
                  default: false
                  title: Enabled
                  type: boolean
                  x-openchoreo-backstage-portal:
                    ui:widget: checkbox
                failureThreshold:
                  default: 3
                  minimum: 1
                  title: Failure threshold
                  type: integer
                handler:
                  $ref: '#/$defs/Handler'
                initialDelaySeconds:
                  default: 0
                  description: Seconds to wait after the container starts before the first probe.
                  minimum: 0
                  title: Initial delay seconds
                  type: integer
                periodSeconds:
                  default: 10
                  minimum: 1
                  title: Period seconds
                  type: integer
                successThreshold:
                  default: 1
                  description: Consecutive successes before the pod is considered ready.
                  minimum: 1
                  title: Success threshold
                  type: integer
                timeoutSeconds:
                  default: 1
                  minimum: 1
                  title: Timeout seconds
                  type: integer
              title: Readiness probe
              type: object
              x-openchoreo-backstage-portal:
                ui:order:
                - enabled
                - handler
                - initialDelaySeconds
                - periodSeconds
                - timeoutSeconds
                - failureThreshold
                - successThreshold
            startup:
              default: {}
              description: Holds off the liveness and readiness probes until the container has finished starting.
              properties:
                enabled:
                  default: false
                  title: Enabled
                  type: boolean
                  x-openchoreo-backstage-portal:
                    ui:widget: checkbox
                failureThreshold:
                  default: 30
                  minimum: 1
                  title: Failure threshold
                  type: integer
                handler:
                  $ref: '#/$defs/Handler'
                initialDelaySeconds:
                  default: 0
                  description: Seconds to wait after the container starts before the first probe.
                  minimum: 0
                  title: Initial delay seconds
                  type: integer
                periodSeconds:
                  default: 10
                  minimum: 1
                  title: Period seconds
                  type: integer
                timeoutSeconds:
                  default: 1
                  minimum: 1
                  title: Timeout seconds
                  type: integer
              title: Startup probe
              type: object
              x-openchoreo-backstage-portal:
                ui:order:
                - enabled
                - handler
                - initialDelaySeconds
                - periodSeconds
                - timeoutSeconds
                - failureThreshold
          type: object
          x-openchoreo-backstage-portal:
            ui:order:
            - containerName
            - liveness
            - readiness
            - startup
      patches:
      - operations:
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe
          value: ${parameters.liveness.handler}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/initialDelaySeconds
          value: ${parameters.liveness.initialDelaySeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/periodSeconds
          value: ${parameters.liveness.periodSeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/timeoutSeconds
          value: ${parameters.liveness.timeoutSeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/livenessProbe/failureThreshold
          value: ${parameters.liveness.failureThreshold}
        target:
          group: apps
          kind: Deployment
          version: v1
          where: ${environmentConfigs.enabled && parameters.liveness.enabled}
        targetPlane: dataplane
      - operations:
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe
          value: ${parameters.readiness.handler}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/initialDelaySeconds
          value: ${parameters.readiness.initialDelaySeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/periodSeconds
          value: ${parameters.readiness.periodSeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/timeoutSeconds
          value: ${parameters.readiness.timeoutSeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/failureThreshold
          value: ${parameters.readiness.failureThreshold}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/readinessProbe/successThreshold
          value: ${parameters.readiness.successThreshold}
        target:
          group: apps
          kind: Deployment
          version: v1
          where: ${environmentConfigs.enabled && parameters.readiness.enabled}
        targetPlane: dataplane
      - operations:
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe
          value: ${parameters.startup.handler}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/initialDelaySeconds
          value: ${parameters.startup.initialDelaySeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/periodSeconds
          value: ${parameters.startup.periodSeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/timeoutSeconds
          value: ${parameters.startup.timeoutSeconds}
        - op: add
          path: /spec/template/spec/containers/[?(@.name=='${parameters.containerName}')]/startupProbe/failureThreshold
          value: ${parameters.startup.failureThreshold}
        target:
          group: apps
          kind: Deployment
          version: v1
          where: ${environmentConfigs.enabled && parameters.startup.enabled}
        targetPlane: dataplane
      validations:
      - message: When the liveness probe is enabled, its handler must specify exactly one action (httpGet, tcpSocket, gRPC, or Exec) with a port between 1 and 65535, or a non-empty command
          for Exec.
        rule: ${!parameters.liveness.enabled || (has(parameters.liveness.handler) && size([has(parameters.liveness.handler.httpGet), has(parameters.liveness.handler.tcpSocket), has(parameters.liveness.handler.grpc),
          has(parameters.liveness.handler.exec)].filter(x, x)) == 1 && (!has(parameters.liveness.handler.httpGet) || (has(parameters.liveness.handler.httpGet.port) && parameters.liveness.handler.httpGet.port
          >= 1 && parameters.liveness.handler.httpGet.port <= 65535)) && (!has(parameters.liveness.handler.tcpSocket) || (has(parameters.liveness.handler.tcpSocket.port) && parameters.liveness.handler.tcpSocket.port
          >= 1 && parameters.liveness.handler.tcpSocket.port <= 65535)) && (!has(parameters.liveness.handler.grpc) || (has(parameters.liveness.handler.grpc.port) && parameters.liveness.handler.grpc.port
          >= 1 && parameters.liveness.handler.grpc.port <= 65535)) && (!has(parameters.liveness.handler.exec) || size(parameters.liveness.handler.exec.command) > 0))}
      - message: When the readiness probe is enabled, its handler must specify exactly one action (httpGet, tcpSocket, gRPC, or Exec) with a port between 1 and 65535, or a non-empty
          command for Exec.
        rule: ${!parameters.readiness.enabled || (has(parameters.readiness.handler) && size([has(parameters.readiness.handler.httpGet), has(parameters.readiness.handler.tcpSocket), has(parameters.readiness.handler.grpc),
          has(parameters.readiness.handler.exec)].filter(x, x)) == 1 && (!has(parameters.readiness.handler.httpGet) || (has(parameters.readiness.handler.httpGet.port) && parameters.readiness.handler.httpGet.port
          >= 1 && parameters.readiness.handler.httpGet.port <= 65535)) && (!has(parameters.readiness.handler.tcpSocket) || (has(parameters.readiness.handler.tcpSocket.port) && parameters.readiness.handler.tcpSocket.port
          >= 1 && parameters.readiness.handler.tcpSocket.port <= 65535)) && (!has(parameters.readiness.handler.grpc) || (has(parameters.readiness.handler.grpc.port) && parameters.readiness.handler.grpc.port
          >= 1 && parameters.readiness.handler.grpc.port <= 65535)) && (!has(parameters.readiness.handler.exec) || size(parameters.readiness.handler.exec.command) > 0))}
      - message: When the startup probe is enabled, its handler must specify exactly one action (httpGet, tcpSocket, gRPC, or Exec) with a port between 1 and 65535, or a non-empty command
          for Exec.
        rule: ${!parameters.startup.enabled || (has(parameters.startup.handler) && size([has(parameters.startup.handler.httpGet), has(parameters.startup.handler.tcpSocket), has(parameters.startup.handler.grpc),
          has(parameters.startup.handler.exec)].filter(x, x)) == 1 && (!has(parameters.startup.handler.httpGet) || (has(parameters.startup.handler.httpGet.port) && parameters.startup.handler.httpGet.port
          >= 1 && parameters.startup.handler.httpGet.port <= 65535)) && (!has(parameters.startup.handler.tcpSocket) || (has(parameters.startup.handler.tcpSocket.port) && parameters.startup.handler.tcpSocket.port
          >= 1 && parameters.startup.handler.tcpSocket.port <= 65535)) && (!has(parameters.startup.handler.grpc) || (has(parameters.startup.handler.grpc.port) && parameters.startup.handler.grpc.port
          >= 1 && parameters.startup.handler.grpc.port <= 65535)) && (!has(parameters.startup.handler.exec) || size(parameters.startup.handler.exec.command) > 0))}
  workload:
    container:
      image: docker.io/maputnik/editor@sha256:35d3074330b01a55b14cd29c7a0168f09728afabc673b7d262eb70546eed7d75
    endpoints:
      http:
        basePath: /
        port: 8888
        type: HTTP
        visibility:
        - external
