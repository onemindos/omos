apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: stac-browser-development
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  owner:
    componentName: stac-browser
    projectName: onetak
  environment: development
  releaseName: stac-browser-v5
  componentTypeEnvironmentConfigs:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
