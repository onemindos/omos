apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: stac-browser
  namespace: default
spec:
  owner:
    projectName: onetak
  # Releases and bindings are reviewed in Git; the controller must not advance them.
  autoDeploy: false
  componentType:
    kind: ClusterComponentType
    name: deployment/onemind-service
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: stac-browser
  namespace: default
spec:
  owner:
    componentName: stac-browser
    projectName: onetak
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
      # Preserve the public prefix: STAC Browser serves its assets and router here.
      basePath: /stac-browser-http
  container:
    image: ghcr.io/radiantearth/stac-browser@sha256:e6d92b6ba593201b558219d0591fc83820b7f86a316d3fe565a27ad996fc7f63
    env:
      - key: SB_pathPrefix
        value: /stac-browser-http/
      - key: SB_catalogTitle
        value: OneTAK — Imagery Catalog
      # The SPA runs on the user's device, which cannot resolve Kubernetes DNS.
      - key: SB_catalogUrl
        value: http://development-default.apps.openchoreo.100-110-185-30.nip.io/stac-browser-http/catalog/
    files:
      - key: default.conf.template
        mountPath: /etc/nginx/conf.d
        value: |
          # Search POST is read-only; catalog writes are rejected before proxying.
          map "$request_method:$uri" $stac_read_allowed {
              default 0;
              ~^GET: 1;
              ~^HEAD: 1;
              "POST:/stac-browser-http/catalog/search" 1;
          }
          server {
              listen 8080;
              server_name localhost;
              absolute_redirect off;
              ${STAC_PREFIX_REDIRECT}
              location ${STAC_PATH_PREFIX} {
                  alias /usr/share/nginx/html/;
                  index index.html;
                  try_files $uri $uri/ ${STAC_PATH_PREFIX}index.html;
              }
              # Same-origin, read-only catalog access. Rewrite only the upstream
              # base URL, leaving external asset URLs and other JSON untouched.
              location /stac-browser-http/catalog/ {
                  if ($stac_read_allowed = 0) { return 405; }
                  proxy_pass http://stac-api.onetak.svc.cluster.local:8082/;
                  proxy_set_header Host stac-api.onetak.svc.cluster.local:8082;
                  proxy_set_header Accept-Encoding "";
                  sub_filter_types application/json application/geo+json;
                  sub_filter_once off;
                  sub_filter 'http://stac-api.onetak.svc.cluster.local:8082/'
                      'http://$http_host/stac-browser-http/catalog/';
              }
          }
