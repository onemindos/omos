# Same project and binding contract as samples/getting-started/all.yaml at v1.3.1.
# Bindings create empty runtime namespaces; no existing workloads move in this step.
apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: onetak
  namespace: default
  annotations:
    openchoreo.dev/display-name: OneTAK
    openchoreo.dev/description: Geospatial applications; STAC Browser is the phase-3 pilot.
spec:
  deploymentPipelineRef:
    name: default
  type:
    kind: ClusterProjectType
    name: default
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: onetak-development
  namespace: default
spec:
  owner:
    projectName: onetak
  environment: development
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: onetak-staging
  namespace: default
spec:
  owner:
    projectName: onetak
  environment: staging
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: onetak-production
  namespace: default
spec:
  owner:
    projectName: onetak
  environment: production
