# The ClusterSecretStore every OpenChoreo plane uses. It must be named `default`
# (install guide v1.3.x step 1; secret-management guide, "Alternative Backends").
#
# Backend: ESO's Kubernetes provider instead of the guide's dev-mode OpenBao. Values
# live as Secrets in the `openchoreo-secrets` namespace and enter Git as SealedSecrets,
# the repository's existing secrets pattern. Read-only: no PushSecret permissions.
apiVersion: v1
kind: Namespace
metadata:
  name: openchoreo-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store
  namespace: openchoreo-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-read
  namespace: openchoreo-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-read
  namespace: openchoreo-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-store-read
subjects:
  - kind: ServiceAccount
    name: eso-store
    namespace: openchoreo-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      remoteNamespace: openchoreo-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: openchoreo-secrets
      auth:
        serviceAccount:
          name: eso-store
          namespace: openchoreo-secrets
