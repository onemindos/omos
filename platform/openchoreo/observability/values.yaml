# openchoreo-observability-plane 1.3.1 (PLATFORM-ROADMAP.md phase 5).
# Wire the plane to the existing observability stack; do not install duplicate backends.
observabilityPlane:
  metrics:
    enabled: true
    prometheus:
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  logs:
    enabled: true
    opensearch:
      url: http://opensearch-cluster-master.onemind-search.svc.cluster.local:9200
  traces:
    enabled: true
    tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
  finops:
    enabled: true
    opencost:
      url: http://opencost.opencost.svc.cluster.local:9003
