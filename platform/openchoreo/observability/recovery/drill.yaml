apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observer-restore-20261019
  namespace: openchoreo-observability-plane
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: observer-restore-20261019
  namespace: openchoreo-observability-plane
spec:
  trigger:
    manual: phase5-20261019
  restic:
    repository: observer-alerts-restic
    copyMethod: Direct
    destinationPVC: observer-restore-20261019
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    cleanupCachePVC: true
    moverServiceAccount: platform-volume-backup
    moverPodLabels:
      app: platform-volume-backup
    moverAffinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: doks.digitalocean.com/node-pool
              operator: In
              values:
              - onemind-ecosystem-cpu
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observer-restore-20261019
  namespace: openchoreo-observability-plane
spec:
  podSelector:
    matchLabels:
      onemind.io/restore-test: observer-restore-20261019
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: batch/v1
kind: Job
metadata:
  name: observer-restore-20261019
  namespace: openchoreo-observability-plane
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 960
  template:
    metadata:
      labels:
        onemind.io/restore-test: observer-restore-20261019
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - onemind-ecosystem-cpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: verify
        image: python:3.12.12-alpine3.22
        command:
        - python
        - -B
        - -c
        - "import pathlib, sqlite3, time, json\nfor attempt in range(180):\n    files=list(pathlib.Path('/restore').rglob('*.db'))\n\
          \    for file in files:\n        try:\n            conn=sqlite3.connect('file:'+str(file)+'?mode=ro',\
          \ uri=True)\n            result=conn.execute('PRAGMA integrity_check').fetchone()[0]\n\
          \            tables=[r[0] for r in conn.execute(\"SELECT name FROM sqlite_master\
          \ WHERE type='table'\")]\n            conn.close()\n            if result=='ok'\
          \ and {'alert_entries','incident_entries'} <= set(tables):\n           \
          \     print(json.dumps({'sqliteIntegrity':result,'tables':sorted(tables),'source':'isolated-restic-restore'}),flush=True)\n\
          \                raise SystemExit(0)\n        except sqlite3.Error:\n  \
          \          pass\n    time.sleep(5)\nraise SystemExit('Restore did not yield\
          \ a readable alert/incident database')\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: restore
          mountPath: /restore
          readOnly: true
      volumes:
      - name: restore
        persistentVolumeClaim:
          claimName: observer-restore-20261019
          readOnly: true
