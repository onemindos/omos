apiVersion: v1
kind: ConfigMap
metadata:
  name: openchoreo-observability-bootstrap
  namespace: openchoreo-observability-plane
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
data:
  bootstrap.py: |
    import base64
    import json
    import ssl
    from pathlib import Path
    from urllib.error import HTTPError
    from urllib.request import Request, urlopen

    sa = Path('/var/run/secrets/kubernetes.io/serviceaccount')
    root = 'https://kubernetes.default.svc/api/v1/namespaces/'
    headers = {'Authorization': 'Bearer ' + (sa / 'token').read_text()}
    context = ssl.create_default_context(cafile=str(sa / 'ca.crt'))


    def request(method, url, data=None, allow_missing=False):
        body = json.dumps(data).encode() if data is not None else None
        h = dict(headers, **{'Content-Type': 'application/merge-patch+json' if method == 'PATCH' else 'application/json'})
        try:
            with urlopen(Request(url, data=body, headers=h, method=method), context=context, timeout=30) as response:
                return json.load(response)
        except HTTPError as error:
            if allow_missing and error.code == 404:
                return None
            raise RuntimeError('Kubernetes API returned status ' + str(error.code)) from None


    def read(namespace, name):
        return request('GET', root + namespace + '/secrets/' + name)['data']


    def ensure(namespace, name, data):
        url = root + namespace + '/secrets'
        desired = {key: base64.b64encode(value.encode()).decode() for key, value in data.items()}
        current = request('GET', url + '/' + name, allow_missing=True)
        if current is None:
            request('POST', url, {'apiVersion': 'v1', 'kind': 'Secret', 'type': 'Opaque',
                    'metadata': {'name': name, 'namespace': namespace,
                                 'labels': {'app.kubernetes.io/part-of': 'openchoreo-observability'}},
                    'data': desired})
        elif any(current.get('data', {}).get(k) != v for k, v in desired.items()):
            request('PATCH', url + '/' + name, {'data': desired})
        print('Prepared ' + namespace + '/' + name)


    console = read('openchoreo-control-plane', 'backstage-secrets')
    search = read('onemind-search', 'opensearch-auth')
    secret = base64.b64decode(console['service-client-secret']).decode()
    password = base64.b64decode(search['password']).decode()
    ensure('openchoreo-observability-plane', 'observer-secret', {'UID_RESOLVER_OAUTH_CLIENT_SECRET': secret})
    credentials = {'username': 'admin', 'password': password}
    ensure('openchoreo-observability-plane', 'opensearch-admin-credentials', credentials)
    ensure('monitoring', 'openchoreo-opensearch', credentials)
    backup = {k: base64.b64decode(v).decode() for k, v in read('monitoring', 'volume-0a77d3a320c8-restic').items()}
    # A separate restic repository; never point the observer source at Loki's repository.
    backup['RESTIC_REPOSITORY'] = backup['RESTIC_REPOSITORY'].rsplit('/', 1)[0] + '/openchoreo-observer-alerts'
    ensure('openchoreo-observability-plane', 'observer-alerts-restic', backup)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openchoreo-observability-bootstrap
  namespace: openchoreo-observability-plane
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    spec:
      serviceAccountName: openchoreo-observability-bootstrap
      restartPolicy: Never
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - onemind-ecosystem-cpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: python:3.12.12-alpine3.22
        command:
        - python
        - -B
        - /app/bootstrap.py
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: script
          mountPath: /app
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: openchoreo-observability-bootstrap
