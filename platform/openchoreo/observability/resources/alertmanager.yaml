# Forward only OpenChoreo-generated metric alerts to the official adapter.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: openchoreo
  namespace: monitoring
spec:
  route:
    receiver: openchoreo
    matchers:
    - name: openchoreo_alert
      value: 'true'
      matchType: '='
    continue: true
  receivers:
  - name: openchoreo
    webhookConfigs:
    - url: http://metrics-adapter.openchoreo-observability-plane.svc.cluster.local:9099/api/v1alpha1/alerts/webhook
      sendResolved: false
