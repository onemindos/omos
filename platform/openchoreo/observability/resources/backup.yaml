apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-volume-backup
  namespace: openchoreo-observability-plane
automountServiceAccountToken: false
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: observer-alerts
  namespace: openchoreo-observability-plane
  annotations:
    onemind.dev/source-pvc: observer-alerts-data
spec:
  sourcePVC: observer-alerts-data
  paused: false
  trigger:
    schedule: 50 4 * * *
  restic:
    repository: observer-alerts-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: do-block-storage
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
      yearly: 1
    moverServiceAccount: platform-volume-backup
    moverPodLabels:
      app: platform-volume-backup
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
