# Upstream 0.6.0 setup hooks with a non-wrapping Basic-auth compatibility fix.
apiVersion: batch/v1
kind: Job
metadata:
  name: onemind-opensearch-setup-logs
  namespace: openchoreo-observability-plane
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - name: opensearch-setup
        env:
        - name: OPENSEARCH_ADDRESS
          value: https://opensearch:9200
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: opensearch-admin-credentials
              key: username
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-admin-credentials
              key: password
        - name: OBSERVER_ALERTING_WEBHOOK_URL
          value: http://observer-internal.openchoreo-observability-plane:8081/api/v1alpha1/alerts/webhook
        - name: CONTAINER_LOGS_MIN_INDEX_AGE
          value: 30d
        - name: K8S_EVENTS_MIN_INDEX_AGE
          value: 30d
        - name: AUDIT_LOGS_MIN_INDEX_AGE
          value: 365d
        - name: AUDIT_LOGS_INDEX_PREFIX
          value: audit-logs-
        image: ghcr.io/openchoreo/observability-logs-opensearch-setup:0.6.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 50Mi
            cpu: 50m
          limits:
            memory: 75Mi
            cpu: 75m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
          runAsGroup: 10500
          runAsUser: 10500
        command:
        - /bin/bash
        - -euo
        - pipefail
        - -c
        args:
        - '# Upstream 0.6.0 wraps Basic auth at 76 columns; never alter the credential.

          source <(sed ''s/| base64)/| base64 -w 0)/'' /setup-opensearch.sh)

          '
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  activeDeadlineSeconds: 600
  backoffLimit: 2
---
