apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observer
  namespace: openchoreo-observability-plane
  annotations:
    tailscale.com/hostname: onemind-observer
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: observer
      port:
        number: 8080
  tls:
  - hosts:
    - onemind-observer
