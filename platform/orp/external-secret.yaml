apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orp-nats-creds
  namespace: orp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: orp-nats-creds
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: orp-nats-creds
        property: username
    - secretKey: password
      remoteRef:
        key: orp-nats-creds
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orp-bridge-key
  namespace: orp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: orp-bridge-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: orp-bridge-key
        property: api_key
