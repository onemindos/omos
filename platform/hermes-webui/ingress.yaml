apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  namespace: hermes
  annotations:
    tailscale.com/hostname: hermes
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hermes-webui
      port:
        number: 8787
  tls:
    - hosts:
        - hermes
