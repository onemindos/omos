apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-webui
spec:
  # Scaled to 0 — WebUI now runs as a sidecar in the hermes-legacy pod
  # (shared RWO PVC). The hermes-webui Service selector now points at legacy.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-webui
    spec:
      imagePullSecrets:
        - name: onemind-hub
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-webui-data
      initContainers:
        - name: init-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1024:1024 /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: hermes-env
            - secretRef:
                name: hermes-webui-auth
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WEBUI_HOST
              value: 0.0.0.0
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /opt/data/webui
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /opt/data/workspace
            - name: HERMES_WEBUI_SERVER_CWD
              value: /opt/data
            - name: HERMES_API_URL
              value: "http://hermes-dashboard.hermes.svc.cluster.local:9119"
            - name: HERMES_WEBUI_SKIP_ONBOARDING
              value: "1"
            - name: HERMES_WEBUI_SSE_CHUNKED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-webui-data
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-webui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-webui
  annotations:
    description: Routes to the hermes-webui sidecar running inside the hermes-legacy pod
spec:
  type: ClusterIP
  selector:
    # WebUI runs as a sidecar in the hermes-legacy pod (shared RWO PVC).
    # Selecting by legacy pod labels routes :8787 to that sidecar container.
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
  ports:
    - name: http
      port: 8787
      targetPort: webui
