apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-webui-auth
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-webui-auth
    creationPolicy: Owner
  data:
    - secretKey: HERMES_WEBUI_PASSWORD
      remoteRef:
        key: hermes-webui-auth
        property: HERMES_WEBUI_PASSWORD
