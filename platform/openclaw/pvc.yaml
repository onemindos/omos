# Mirrors the live openclaw/openclaw-home-pvc (50Gi). volumeName is bound by the cluster and intentionally omitted.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-home-pvc
  namespace: openclaw
  labels:
    app: openclaw
    onemind.os/component: openclaw-gateway
    onemind.os/managed-by: kustomize
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: do-block-storage
