# OpenClaw gateway, mirrored from the live openclaw/openclaw Deployment (2026-10-10). Live wins.
# Secrets come from Secret/openclaw-secrets (managed out of band, never in Git).
# The rollout-restart annotation on the pod template is deliberately not mirrored (see ../../docs/STACK.md GitOps gaps).
# yamllint disable rule:line-length
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
    onemind.os/component: openclaw-gateway
    onemind.os/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
      onemind.os/component: openclaw-gateway
      onemind.os/managed-by: kustomize
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: openclaw
        onemind.os/component: openclaw-gateway
        onemind.os/managed-by: kustomize
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openclaw
                  onemind.os/component: openclaw-gateway
                  onemind.os/managed-by: kustomize
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - /app/dist/index.js
        - gateway
        - run
        env:
        - name: HOME
          value: /home/node
        - name: NPM_CONFIG_CACHE
          value: /home/node/.npm-cache
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: DO_INFERENCE_TOKEN
              name: openclaw-secrets
              optional: true
        - name: DO_INFERENCE_TOKEN
          valueFrom:
            secretKeyRef:
              key: DO_INFERENCE_TOKEN
              name: openclaw-secrets
        - name: OPENCLAW_CONFIG_DIR
          value: /home/node/.openclaw
        - name: NODE_ENV
          value: production
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: ANTHROPIC_API_KEY
              name: openclaw-secrets
              optional: true
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              key: GEMINI_API_KEY
              name: openclaw-secrets
              optional: true
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENROUTER_API_KEY
              name: openclaw-secrets
              optional: true
        image: ghcr.io/openclaw/openclaw:2026.9.6-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - node
            - -e
            - 'require(''http'').get(''http://127.0.0.1:18789/healthz'', r => { let b = ''''; r.on(''data'', d => b += d); r.on(''end'', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on(''error'', () => process.exit(1))'
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: gateway
        ports:
        - containerPort: 18789
          name: gateway
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - 'require(''http'').get(''http://127.0.0.1:18789/readyz'', r => { let b = ''''; r.on(''data'', d => b += d); r.on(''end'', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ready === true ? 0 : 1); } catch { process.exit(1); } }); }).on(''error'', () => process.exit(1))'
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          exec:
            command:
            - node
            - -e
            - 'require(''http'').get(''http://127.0.0.1:18789/readyz'', r => { let b = ''''; r.on(''data'', d => b += d); r.on(''end'', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ready === true ? 0 : 1); } catch { process.exit(1); } }); }).on(''error'', () => process.exit(1))'
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /home/node/.cache
          name: cache-volume
        - mountPath: /home/node/.npm-cache
          name: npm-cache
        - mountPath: /home/node/.openclaw
          name: openclaw-home
        - mountPath: /tmp
          name: tmp-volume
      initContainers:
      - command:
        - sh
        - -c
        - |
          # Seed-if-missing: the PVC copy owns config after first boot so edits made
          # through OpenClaw (onboard, channels add, doctor --fix, Control UI) survive
          # restarts. ConfigMap edits need an explicit reseed (see docs/install/kubernetes.md).
          [ -f /home/node/.openclaw/openclaw.json ] || cp /config/openclaw.json /home/node/.openclaw/openclaw.json
          mkdir -p /home/node/.openclaw/workspace
          [ -f /home/node/.openclaw/workspace/AGENTS.md ] || cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
        image: busybox:1.38
        imagePullPolicy: IfNotPresent
        name: init-config
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        volumeMounts:
        - mountPath: /home/node/.openclaw
          name: openclaw-home
        - mountPath: /config
          name: config
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: cache-volume
      - emptyDir: {}
        name: npm-cache
      - name: openclaw-home
        persistentVolumeClaim:
          claimName: openclaw-home-pvc
      - configMap:
          defaultMode: 420
          name: openclaw-config
        name: config
      - emptyDir: {}
        name: tmp-volume
