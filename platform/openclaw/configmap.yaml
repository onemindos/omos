# Mirrors the live openclaw/openclaw-config ConfigMap. apiKey is an env placeholder, not a credential.
# The init container only seeds these files into the PVC when missing, so edits here do not overwrite the live copy.
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app: openclaw
    onemind.os/component: openclaw-gateway
    onemind.os/managed-by: kustomize
data:
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.

    Before proposing or building a custom system, feature, workflow, tool, integration, or automation, do a brief check for open-source projects, maintained libraries, existing OpenClaw plugins, or free platforms that already solve it well enough. Prefer those when adequate. Build custom only when existing options are unsuitable, too expensive, unmaintained, unsafe, non-compliant, or the user explicitly asks for custom. Avoid paid-service recommendations unless the user explicitly approves spend. Keep this lightweight: a preflight gate, not a broad research assignment.
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"lan\",\n    \"port\": 18789,\n    \"publicOrigin\": \"https://openclaw.tail717ba0.ts.net\",\n    \"auth\": {\n      \"mode\": \"token\"\n    },\n    \"controlUi\": {\n      \"enabled\": true,\n      \"allowedOrigins\": [\"https://openclaw.tail717ba0.ts.net\"]\n    },\n    \"trustedProxies\": [\"10.109.0.0/16\"],\n    \"nodes\": {\n      \"pairing\": {\n        \"autoApproveLocal\": true\n      }\n    }\n  },\n  \"agents\": {\n    \"defaults\": {\n      \"workspace\": \"/home/node/.openclaw/workspace\",\n      \"model\": { \"primary\": \"do-inference/nemotron-3-ultra-550b\" }\n    },\n    \"entries\": {\n      \"legacy-gateway\": {\n        \"name\": \"Legacy \u2014 OneMind Gateway\",\n        \"workspace\": \"/home/node/.openclaw/workspace\",\n        \"model\": { \"primary\": \"do-inference/nemotron-3-ultra-550b\" }\n      }\n    }\n  },\n  \"models\": {\n    \"mode\": \"merge\",\n    \"providers\": {\n   \
    \   \"do-inference\": {\n        \"baseUrl\": \"https://inference.do-ai.run/v1\",\n        \"apiKey\": \"${DO_INFERENCE_TOKEN}\",\n        \"api\": \"openai-completions\",\n        \"models\": [\n          { \"id\": \"nemotron-3-ultra-550b\", \"name\": \"Nemotron 3 Ultra 550B\", \"contextWindow\": 131072, \"input\": [\"text\", \"image\"] },\n          { \"id\": \"meta-llama-3.3-70b-instruct\", \"name\": \"Llama 3.3 70B Instruct\", \"contextWindow\": 128000, \"input\": [\"text\"] },\n          { \"id\": \"meta-llama-3.1-405b-instruct\", \"name\": \"Llama 3.1 405B Instruct\", \"contextWindow\": 128000, \"input\": [\"text\"] },\n          { \"id\": \"mistral-nemo-instruct-2407\", \"name\": \"Mistral Nemo Instruct\", \"contextWindow\": 128000, \"input\": [\"text\"] }\n        ]\n      }\n    }\n  },\n  \"cron\": { \"enabled\": true }\n}"
