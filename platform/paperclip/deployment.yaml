apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
spec:
  selector: {app: paperclip}
  ports: [{name: http, port: 3100, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: paperclip}
  template:
    metadata:
      labels: {app: paperclip}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: doks.digitalocean.com/node-pool, operator: In, values: [onemind-ecosystem-cpu]}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:2026.1012.0@sha256:1661b3dd3fdf7a9b59542d1ced464c3faf9dc8309798b4d15a9923ed32795307
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          ports: [{name: http, containerPort: 3100}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: paperclip-secrets, key: DATABASE_URL}}}
            - {name: BETTER_AUTH_SECRET, valueFrom: {secretKeyRef: {name: paperclip-secrets, key: BETTER_AUTH_SECRET}}}
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              valueFrom:
                secretKeyRef: {name: paperclip-secrets, key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
            - name: PAPERCLIP_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: paperclip-secrets, key: PAPERCLIP_SECRETS_MASTER_KEY}
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: '3100'}
            - {name: SERVE_UI, value: 'true'}
            - {name: PAPERCLIP_HOME, value: /paperclip}
            - {name: PAPERCLIP_DEPLOYMENT_MODE, value: authenticated}
            - {name: PAPERCLIP_DEPLOYMENT_EXPOSURE, value: private}
            - {name: PAPERCLIP_PUBLIC_URL, value: 'https://paperclip.tail717ba0.ts.net'}
            - {name: PAPERCLIP_AUTH_PUBLIC_BASE_URL, value: 'https://paperclip.tail717ba0.ts.net'}
            # Local agent callbacks stay inside the namespace rather than hairpinning through Tailscale.
            - {name: PAPERCLIP_API_URL, value: 'http://paperclip.paperclip.svc.cluster.local:3100'}
            - {name: PAPERCLIP_ALLOWED_HOSTNAMES, value: 'paperclip.tail717ba0.ts.net,paperclip.paperclip.svc.cluster.local'}
            - {name: PAPERCLIP_MIGRATION_AUTO_APPLY, value: 'true'}
            - {name: PAPERCLIP_DB_BACKUP_ENABLED, value: 'false'}
            - {name: HEARTBEAT_SCHEDULER_ENABLED, value: 'false'}
            # CA bundle contains only this application's public CA certificate.
            - {name: NODE_EXTRA_CA_CERTS, value: /run/hermes-gateway-ca/ca.crt}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: paperclip.tail717ba0.ts.net}]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: paperclip.tail717ba0.ts.net}]
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: paperclip.tail717ba0.ts.net}]
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - {name: paperclip-data, mountPath: /paperclip}
            - {name: tmp, mountPath: /tmp}
            - {name: hermes-gateway-ca, mountPath: /run/hermes-gateway-ca, readOnly: true}
      volumes:
        - name: paperclip-data
          persistentVolumeClaim: {claimName: paperclip-data}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: hermes-gateway-ca
          secret:
            secretName: hermes-gateway-ca
            # Transport can be staged without taking Paperclip's UI offline.
            # Missing trust fails closed when the HTTPS adapter connects.
            optional: true
            items:
              - {key: ca.crt, path: ca.crt}
