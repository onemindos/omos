apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-paperclip
  namespace: paperclip
spec:
  schedule: 0 6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: platform-backup
            backup-kind: postgres
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/onemindos/platform-backup@sha256:de795f12b6295d0db5cbe803c11cc4db38678670f4ec8cf7951484a090a7f863
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - secretRef:
                name: platform-backup-credentials
            env:
            - name: BACKUP_KIND
              value: postgres
            - name: BACKUP_PREFIX
              value: backups/postgres-paperclip
            - name: S3_REGION
              value: nyc3
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: paperclip
            - name: PGDATABASE
              value: paperclip
            - name: PGCONNECT_TIMEOUT
              value: '15'
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: PAPERCLIP_DB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 8Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 8Gi
          - name: restore-data
            emptyDir:
              sizeLimit: 10Gi
          initContainers:
          - name: restore-postgres
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
            restartPolicy: Always
            args:
            - postgres
            - -c
            - listen_addresses=127.0.0.1
            - -p
            - '15432'
            env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /restore/data
            securityContext:
              runAsUser: 70
              runAsGroup: 70
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            startupProbe:
              exec:
                command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - '15432'
                - -U
                - postgres
              periodSeconds: 5
              failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 10Gi
            volumeMounts:
            - name: restore-data
              mountPath: /restore
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                    - onemind-ecosystem-cpu
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-volume-backup
  namespace: paperclip
automountServiceAccountToken: false
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: paperclip-data
  namespace: paperclip
  annotations:
    onemind.dev/source-pvc: paperclip-data
spec:
  sourcePVC: paperclip-data
  paused: false
  trigger:
    schedule: 0 12 * * *
  restic:
    repository: paperclip-data-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: do-block-storage
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
      yearly: 1
    moverServiceAccount: platform-volume-backup
    moverPodLabels:
      app: platform-volume-backup
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: paperclip-postgres
  namespace: paperclip
  annotations:
    onemind.dev/source-pvc: data-postgres-0
spec:
  sourcePVC: data-postgres-0
  paused: false
  trigger:
    schedule: 20 12 * * *
  restic:
    repository: data-postgres-0-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: do-block-storage
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
      yearly: 1
    moverServiceAccount: platform-volume-backup
    moverPodLabels:
      app: platform-volume-backup
    moverSecurityContext:
      runAsUser: 70
      runAsGroup: 70
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
