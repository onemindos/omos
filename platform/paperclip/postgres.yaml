apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-paperclip.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres --set=app_password="$PAPERCLIP_DB_PASSWORD" <<'SQL'
    CREATE ROLE paperclip LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
    CREATE DATABASE paperclip OWNER paperclip;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app: paperclip-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: paperclip-postgres}
  template:
    metadata:
      labels: {app: paperclip-postgres}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: doks.digitalocean.com/node-pool, operator: In, values: [onemind-ecosystem-cpu]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: paperclip-secrets, key: POSTGRES_ADMIN_PASSWORD}}}
            - {name: PAPERCLIP_DB_PASSWORD, valueFrom: {secretKeyRef: {name: paperclip-secrets, key: PAPERCLIP_DB_PASSWORD}}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: do-block-storage-retain
        resources:
          requests: {storage: 10Gi}
