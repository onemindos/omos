# Real-domain ingress on onemindos.dev (certs via Cloudflare DNS-01).
# Runs alongside the nip.io ingresses during transition; nip.io removed once verified.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-onemindos
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["grafana.onemindos.dev"]
      secretName: grafana-onemindos-tls
  rules:
    - host: grafana.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-onemindos
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["argocd.onemindos.dev"]
      secretName: argocd-onemindos-tls
  rules:
    - host: argocd.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
