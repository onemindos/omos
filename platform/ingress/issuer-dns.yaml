# Let's Encrypt issuer using Cloudflare DNS-01 (works whether the record is
# proxied/orange or DNS-only/grey — unlike HTTP-01, which breaks when proxied).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: zeus@zeusdelacruz.com
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
