apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucix
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crucix
  template:
    metadata:
      labels:
        app: crucix
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: crucix
          image: ghcr.io/onemindos/crucix:latest
          ports:
            - containerPort: 3117
          env:
            - name: PORT
              value: "3117"
            - name: REFRESH_INTERVAL_MINUTES
              value: "15"
          volumeMounts:
            - name: runs-data
              mountPath: /app/runs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3117
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: runs-data
          persistentVolumeClaim:
            claimName: crucix-runs-data
---
apiVersion: v1
kind: Service
metadata:
  name: crucix
  namespace: intel
spec:
  selector:
    app: crucix
  ports:
    - port: 3117
      targetPort: 3117
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crucix-runs-data
  namespace: intel
spec:
  storageClassName: do-block-storage-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
