apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osiris
  namespace: intel
  annotations:
    tailscale.com/hostname: osiris
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: osiris-cache
                port:
                  number: 8080
