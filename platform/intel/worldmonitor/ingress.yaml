apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worldmonitor
  namespace: intel
  annotations:
    tailscale.com/hostname: worldmonitor
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor
                port:
                  number: 8080
