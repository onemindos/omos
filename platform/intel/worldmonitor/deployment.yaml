apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor-redis
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldmonitor-redis
  template:
    metadata:
      labels:
        app: worldmonitor-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: worldmonitor-redis-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor-redis-rest
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldmonitor-redis-rest
  template:
    metadata:
      labels:
        app: worldmonitor-redis-rest
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: redis-rest
          image: ghcr.io/onemindos/worldmonitor-redis-rest:latest
          ports:
            - containerPort: 80
          env:
            - name: SRH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: REDIS_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: REDIS_PASSWORD
            - name: SRH_CONNECTION_STRING
              value: "redis://:$(REDIS_PASSWORD)@worldmonitor-redis:6379"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor-ais-relay
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldmonitor-ais-relay
  template:
    metadata:
      labels:
        app: worldmonitor-ais-relay
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: ais-relay
          image: ghcr.io/onemindos/worldmonitor-relay:latest
          ports:
            - containerPort: 3004
          env:
            - name: AISSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: AISSTREAM_API_KEY
            - name: RELAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: RELAY_SHARED_SECRET
            - name: UPSTASH_REDIS_REST_URL
              value: "http://worldmonitor-redis-rest:80"
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: REDIS_TOKEN
            - name: UPSTASH_ALLOW_INSECURE_HTTP
              value: "true"
            - name: PORT
              value: "3004"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldmonitor
  template:
    metadata:
      labels:
        app: worldmonitor
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: worldmonitor
          image: ghcr.io/onemindos/worldmonitor:latest
          ports:
            - containerPort: 8080
          env:
            - name: UPSTASH_REDIS_REST_URL
              value: "http://worldmonitor-redis-rest:80"
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: REDIS_TOKEN
            - name: LOCAL_API_PORT
              value: "46123"
            - name: LOCAL_API_MODE
              value: "docker"
            - name: LOCAL_API_CLOUD_FALLBACK
              value: "false"
            - name: WS_RELAY_URL
              value: "http://worldmonitor-ais-relay:3004"
            - name: AISSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: AISSTREAM_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor-redis
  namespace: intel
spec:
  selector:
    app: worldmonitor-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor-redis-rest
  namespace: intel
spec:
  selector:
    app: worldmonitor-redis-rest
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor-ais-relay
  namespace: intel
spec:
  selector:
    app: worldmonitor-ais-relay
  ports:
    - port: 3004
      targetPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor
  namespace: intel
spec:
  selector:
    app: worldmonitor
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worldmonitor-redis-data
  namespace: intel
spec:
  storageClassName: do-block-storage-retain
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
