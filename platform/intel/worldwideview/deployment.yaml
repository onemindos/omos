apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldwideview-db
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldwideview-db
  template:
    metadata:
      labels:
        app: worldwideview-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: worldwideview
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "worldwideview"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: worldwideview-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldwideview
  namespace: intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worldwideview
  template:
    metadata:
      labels:
        app: worldwideview
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: worldwideview
          image: ghcr.io/onemindos/worldwideview:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: worldwideview-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@worldwideview-db:5432/worldwideview?schema=public"
            - name: NEXT_PUBLIC_WWV_EDITION
              value: "local"
            - name: PROXY_HOST_ALLOWLIST
              value: "*"
          volumeMounts:
            - name: wwv-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: wwv-data
          persistentVolumeClaim:
            claimName: worldwideview-data
---
apiVersion: v1
kind: Service
metadata:
  name: worldwideview-db
  namespace: intel
spec:
  selector:
    app: worldwideview-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: worldwideview
  namespace: intel
spec:
  selector:
    app: worldwideview
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worldwideview-postgres-data
  namespace: intel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worldwideview-data
  namespace: intel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
