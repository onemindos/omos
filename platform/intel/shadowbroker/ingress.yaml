apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadowbroker
  namespace: intel
  annotations:
    tailscale.com/hostname: shadowbroker
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shadowbroker-frontend
                port:
                  number: 3000
