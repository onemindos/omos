apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-legacy
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
spec:
  # The hub's MAIN Hermes = Legacy. Registers on the fabric as its own
  # first-class agent: agents.prompt.hermes.zeus.legacy. The Mac runs a
  # SEPARATE Hermes (distinct identity); the fabric interconnects them — this
  # is NOT one identity with two queue-grouped bodies.
  # replicas stays 1: RWO PVC + single-holder self-modification.
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC — never two pods on one volume
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      onemind.io/agent: legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        onemind.io/agent: legacy
    spec:
      imagePullSecrets:
        - name: ghcr
      initContainers:
        # ---- Copy agent Python source ----
        # Seeds hermes-agent-src emptyDir from the hermes-legacy image so the
        # webui can import hermes Python APIs directly via PYTHONPATH.
        - name: copy-agent-src
          image: ghcr.io/onemindos/hermes-legacy:v3
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              cp -a /opt/hermes/agent /agent-src/ && \
              cp -a /opt/hermes/hermes_constants.py /agent-src/ && \
              cp -a /opt/hermes/hermes_cli /agent-src/ 2>/dev/null || true && \
              echo done
          volumeMounts:
            - name: hermes-agent-src
              mountPath: /agent-src
        # ---- Pre-seed webui /app ----
        # hermeswebui_init.bash does `cp -a /apptoo /app` which fails with
        # "preserving times: Operation not permitted" on a fresh emptyDir, causing
        # a one-time crash on every pod start. Pre-seeding here with `cp -r`
        # (no -a, no timestamp preservation) means the startup script sees a
        # non-empty /app and skips re-seeding entirely.
        - name: seed-webui-app
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "cp -r /apptoo/. /app/ 2>/dev/null; echo done"]
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: webui-app
              mountPath: /app
      containers:
        # ---- Legacy (Hermes) ----
        # Talks PLAINTEXT to the in-pod leaf on localhost:4222 — identical to the
        # Mac setup. All TLS/auth to the cluster bus lives in the sidecar, so we
        # never depend on Hermes's internal TLS/CA handling.
        # NOTE: `hermes gateway run` is CHAT-ONLY and does NOT register on NATS.
        # The NATS agent-host (hermes_nats_host.py, baked into hermes-legacy) is
        # what registers agents.prompt.hermes.zeus.legacy — see omos-core/services/agents.
        - name: hermes
          image: ghcr.io/onemindos/hermes-legacy:v3   # Hermes base + NATS plugin + Legacy persona (mother)
          imagePullPolicy: Always
          # No custom args — s6 supervisor runs the gateway. The nats-platform
          # plugin (enabled in config.yaml, seeded by cont-init) registers
          # agents.prompt.hermes.zeus.legacy and routes prompts through Hermes's
          # full pipeline (SOUL.md persona, tools, memory).
          args: ["gateway", "run", "--replace"]
          envFrom:
            - secretRef:
                name: hermes-env          # full ~/.hermes/.env (providers, HERMES_NATS_*). See SECRETS.md
            - secretRef:
                name: hermes-dashboard-auth   # HERMES_DASHBOARD_BASIC_AUTH_USERNAME + _PASSWORD
          env:
            - name: NATS_URL
              value: "nats://localhost:4222"   # → the leaf sidecar (plaintext, in-pod only)
            - name: HERMES_NATS_SESSION_NAME
              value: "legacy"
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # AWS Bedrock creds (currently reused from .env; rotate later → hermes-aws)
            # Uncomment once the rotated secret exists:
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom: { secretKeyRef: { name: hermes-aws, key: AWS_ACCESS_KEY_ID } }
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom: { secretKeyRef: { name: hermes-aws, key: AWS_SECRET_ACCESS_KEY } }
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { memory: "3Gi" }
        # ---- Gateway probe sidecar ----
        # Exposes an unauthenticated /health/detailed on :8642 for hermes-webui.
        # The webui probes HERMES_API_URL + /health/detailed to detect the gateway;
        # the dashboard (/api/status) returns gateway_state but is auth-gated.
        # This sidecar bridges the two: reads /api/status from localhost:9119 and
        # re-serves it at /health/detailed with no auth required.
        - name: gateway-probe
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 - <<'EOF'
              import http.server, urllib.request, json
              class H(http.server.BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_GET(self):
                      try:
                          with urllib.request.urlopen("http://localhost:9119/api/status", timeout=3) as r:
                              body = r.read()
                      except Exception as e:
                          body = json.dumps({"gateway_state": "unknown", "error": str(e)}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              http.server.HTTPServer(("0.0.0.0", 8642), H).serve_forever()
              EOF
          ports:
            - { name: gateway-probe, containerPort: 8642 }
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { memory: "64Mi" }
        # ---- NATS leaf sidecar ----
        # nats-server running as a leaf into the cluster ONEMIND account over TLS.
        # Exposes a local plaintext client listener on :4222 for Hermes only.
        - name: nats-leaf
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/leaf.conf"]
          ports:
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - name: leaf-conf
              mountPath: /etc/nats
              readOnly: true
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "128Mi" }
        # ---- Hermes WebUI sidecar ----
        # Co-located with Legacy to share the /opt/data PVC (RWO block storage).
        # Gateway is on localhost:9119 — no cross-pod routing needed.
        # hermes-webui Service selector updated to legacy pod labels.
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          ports:
            - { name: webui, containerPort: 8787 }
          envFrom:
            - secretRef:
                name: hermes-env
            - secretRef:
                name: hermes-webui-auth
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /opt/data/webui
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /opt/data/workspace
            - name: HERMES_WEBUI_SERVER_CWD
              value: /opt/data
            - name: HERMES_API_URL
              value: "http://localhost:9119"
            - name: HERMES_WEBUI_SKIP_ONBOARDING
              value: "1"
            - name: HERMES_WEBUI_SSE_CHUNKED
              value: "1"
            - name: PYTHONPATH
              value: /opt/hermes-agent
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: webui-app
              mountPath: /app
            - name: hermes-agent-src
              mountPath: /opt/hermes-agent
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
          startupProbe:
            httpGet: { path: /health, port: webui }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: webui }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: webui }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: leaf-conf
          secret:
            secretName: hermes-leaf-conf   # leaf.conf w/ leaf_tak creds — out-of-band. See SECRETS.md
        - name: nats-ca
          secret:
            secretName: hermes-nats-ca      # cluster NATS CA (ca.crt)
        - name: webui-app
          emptyDir: {}
        - name: hermes-agent-src
          emptyDir: {}
