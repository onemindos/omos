apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-legacy
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
spec:
  # The hub's MAIN Hermes = Legacy. Registers on the fabric as its own
  # first-class agent: agents.prompt.hermes.zeus.legacy. The Mac runs a
  # SEPARATE Hermes (distinct identity); the fabric interconnects them — this
  # is NOT one identity with two queue-grouped bodies.
  # replicas stays 1: RWO PVC + single-holder self-modification.
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC — never two pods on one volume
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      onemind.io/agent: legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        onemind.io/agent: legacy
    spec:
      imagePullSecrets:
        - name: ghcr
      initContainers:
        # ---- Copy agent Python source + full venv ----
        # Seeds hermes-agent-src AND hermes-venv emptyDirs from the hermes-legacy
        # image. The webui container sets HERMES_WEBUI_PYTHON to use the gateway's
        # venv python (Python 3.13 + all hermes deps) instead of its own venv
        # (Python 3.12 missing dotenv, httpx, requests, etc).
        # This avoids dep conflicts between hermes-agent and hermes-webui venvs.
        - name: copy-agent-src
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "Copying hermes source..."
              cp -a /opt/hermes/. /agent-src/
              echo "Copying hermes venv..."
              cp -a /opt/hermes/.venv/. /hermes-venv/
              echo "Fixing ownership for webui user (10000)..."
              chown -R 10000:10000 /agent-src /hermes-venv
              echo "done: $(ls /agent-src | wc -l) source items, $(ls /hermes-venv/bin | wc -l) venv bins"
          volumeMounts:
            - name: hermes-agent-src
              mountPath: /agent-src
            - name: hermes-venv
              mountPath: /hermes-venv
        # ---- Install gateway-only deps missing from the public Nous image ----
        # nousresearch/hermes-agent:latest ships without nats-py, nkeys,
        # synadia-ai-agents, and synadia-ai-agent-service — all required for
        # the NATS and TAK gateway platforms. This initContainer installs them
        # into a shared emptyDir (/gateway-deps) using the system uv that ships
        # in the Nous image. The hermes container mounts the same volume and
        # sets PYTHONPATH to include it, so the packages are available at runtime
        # on every pod restart without any custom image build.
        - name: install-gateway-deps
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "Installing NATS/TAK gateway deps into /gateway-deps..."
              uv pip install \
                --python /opt/hermes/.venv/bin/python3 \
                --target /gateway-deps \
                nats-py nkeys synadia-ai-agents synadia-ai-agent-service
              echo "Done: $(ls /gateway-deps | wc -l) packages installed"
          volumeMounts:
            - name: gateway-deps
              mountPath: /gateway-deps
        # ---- Pre-seed webui /app ----
        # hermeswebui_init.bash does `cp -a /apptoo /app` which fails with
        # "preserving times: Operation not permitted" on a fresh emptyDir, causing
        # a one-time crash on every pod start. Pre-seeding here with `cp -r`
        # (no -a, no timestamp preservation) means the startup script sees a
        # non-empty /app and skips re-seeding entirely.
        - name: seed-webui-app
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "cp -r /apptoo/. /app/ 2>/dev/null; echo done"]
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: webui-app
              mountPath: /app
        # ---- Install hermes-agent deps into webui venv ----
        # ghcr.io/nesquena/hermes-webui ships with its own /app/venv (Python 3.12)
        # that is missing hermes-agent's runtime deps (python-dotenv, tenacity,
        # httpx, etc.). The webui uses HERMES_WEBUI_AGENT_DIR=/opt/hermes
        # (seeded by copy-agent-src) and attempts to import run_agent.AIAgent at
        # startup — this fails with "No module named 'dotenv'" unless the agent's
        # deps are installed into /app/venv.
        # This initContainer runs pip install -e on the copied agent source,
        # pulling all missing deps into /app/venv so AIAgent imports cleanly
        # on every pod start without any manual intervention.
        # install-webui-agent-deps: REMOVED — the webui's own /hermeswebui_init.bash
        # handles the editable install when hermes-agent-src is mounted at /opt/hermes
        # (the path its _agent_paths array searches). No init container needed.
      containers:
        # ---- Legacy (Hermes) ----
        # Talks PLAINTEXT to the in-pod leaf on localhost:4222 — identical to the
        # Mac setup. All TLS/auth to the cluster bus lives in the sidecar, so we
        # never depend on Hermes's internal TLS/CA handling.
        # NOTE: `hermes gateway run` is CHAT-ONLY and does NOT register on NATS.
        # The NATS agent-host (hermes_nats_host.py, baked into hermes-legacy) is
        # what registers agents.prompt.hermes.zeus.legacy — see omos-core/services/agents.
        - name: hermes
          image: nousresearch/hermes-agent:latest   # Official Nous image — pinned to v2026.8.3
          imagePullPolicy: Always
          # No custom args — s6 supervisor runs the gateway. The nats-platform
          # plugin (enabled in config.yaml, seeded by cont-init) registers
          # agents.prompt.hermes.zeus.legacy and routes prompts through Hermes's
          # full pipeline (SOUL.md persona, tools, memory).
          args: ["gateway", "run", "--replace"]
          envFrom:
            - secretRef:
                name: hermes-env          # full ~/.hermes/.env (providers, HERMES_NATS_*). See SECRETS.md
            - secretRef:
                name: hermes-dashboard-auth   # HERMES_DASHBOARD_BASIC_AUTH_USERNAME + _PASSWORD
          env:
            - name: NATS_URL
              value: "nats://localhost:4222"   # → the leaf sidecar (plaintext, in-pod only)
            - name: HERMES_NATS_SESSION_NAME
              value: "legacy"
            - name: PYTHONPATH
              value: "/gateway-deps"
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # AWS Bedrock creds (currently reused from .env; rotate later → hermes-aws)
            # Uncomment once the rotated secret exists:
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom: { secretKeyRef: { name: hermes-aws, key: AWS_ACCESS_KEY_ID } }
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom: { secretKeyRef: { name: hermes-aws, key: AWS_SECRET_ACCESS_KEY } }
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: gateway-deps
              mountPath: /gateway-deps
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { memory: "3Gi" }
        # ---- Gateway probe sidecar ----
        # Exposes an unauthenticated /health/detailed on :8642 for hermes-webui.
        # The webui probes HERMES_API_URL + /health/detailed to detect the gateway;
        # the dashboard (/api/status) returns gateway_state but is auth-gated.
        # This sidecar bridges the two: reads /api/status from localhost:9119 and
        # re-serves it at /health/detailed with no auth required.
        - name: gateway-probe
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 - <<'EOF'
              import http.server, urllib.request, json
              class H(http.server.BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_GET(self):
                      try:
                          with urllib.request.urlopen("http://localhost:9119/api/status", timeout=3) as r:
                              body = r.read()
                      except Exception as e:
                          body = json.dumps({"gateway_state": "unknown", "error": str(e)}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              http.server.HTTPServer(("0.0.0.0", 8642), H).serve_forever()
              EOF
          ports:
            - { name: gateway-probe, containerPort: 8642 }
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { memory: "64Mi" }
        # ---- NATS leaf sidecar ----
        # nats-server running as a leaf into the cluster ONEMIND account over TLS.
        # Exposes a local plaintext client listener on :4222 for Hermes only.
        - name: nats-leaf
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/leaf.conf"]
          ports:
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - name: leaf-conf
              mountPath: /etc/nats
              readOnly: true
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "128Mi" }
        # ---- Hermes WebUI sidecar ----
        # Co-located with Legacy to share the /opt/data PVC (RWO block storage).
        # Gateway is on localhost:9119 — no cross-pod routing needed.
        # hermes-webui Service selector updated to legacy pod labels.
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          ports:
            - { name: webui, containerPort: 8787 }
          envFrom:
            - secretRef:
                name: hermes-env
            - secretRef:
                name: hermes-webui-auth
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /opt/data/webui
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /opt/data/workspace
            - name: HERMES_WEBUI_SERVER_CWD
              value: /opt/data
            - name: HERMES_API_URL
              value: "http://localhost:9119"
            - name: HERMES_WEBUI_SKIP_ONBOARDING
              value: "1"
            - name: HERMES_WEBUI_SSE_CHUNKED
              value: "1"
            - name: HERMES_WEBUI_AGENT_DIR
              value: /opt/hermes
            - name: HERMES_WEBUI_AUTO_INSTALL
              value: "1"
            - name: HERMES_WEBUI_PYTHON
              value: /opt/hermes-venv/bin/python
            - name: PYTHONPATH
              value: /opt/hermes
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: webui-app
              mountPath: /app
            - name: hermes-agent-src
              mountPath: /opt/hermes
            - name: hermes-venv
              mountPath: /opt/hermes-venv
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { memory: "512Mi" }
          startupProbe:
            httpGet: { path: /health, port: webui }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: webui }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: webui }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: leaf-conf
          secret:
            secretName: hermes-leaf-conf   # leaf.conf w/ leaf_tak creds — out-of-band. See SECRETS.md
        - name: nats-ca
          secret:
            secretName: hermes-nats-ca      # cluster NATS CA (ca.crt)
        - name: webui-app
          emptyDir: {}
        - name: hermes-agent-src
          emptyDir: {}
        - name: hermes-venv
          emptyDir: {}
        - name: gateway-deps
          emptyDir: {}
