apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dashboard-auth
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-dashboard-auth
    creationPolicy: Owner
  data:
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes-dashboard-auth
        property: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes-dashboard-auth
        property: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-env
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hermes-env
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-leaf-conf
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-leaf-conf
    creationPolicy: Owner
  data:
    - secretKey: leaf.conf
      remoteRef:
        key: hermes-leaf-conf
        property: leaf.conf
    - secretKey: ca.crt
      remoteRef:
        key: hermes-leaf-conf
        property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-nats-ca
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-nats-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: hermes-nats-ca
        property: ca.crt
