---
# tak-agent: TAK ↔ Legacy AI bridge
#
# Three jobs in one lightweight Python process:
#   1. GeoChat listener — watches tak.cot.> for chat CoT addressed to callsign
#      "Legacy"; routes each message to agents.prompt.hermes.zeus.legacy on NATS.
#   2. SA mirror — subscribes ent.*.*.state and maintains an in-memory SA picture;
#      publishes a compact summary to svc.tak.sa on request (NATS RPC).
#   3. TAK RPC service — exposes svc.tak.* endpoints so Legacy can:
#        svc.tak.inject_cot   — publish raw CoT XML to tak.cot.inject
#        svc.tak.chat         — inject a GeoChat CoT from callsign "Legacy"
#        svc.tak.mission.list — list missions via CloudTAK /api/marti/mission
#        svc.tak.mission.create — create a mission
#        svc.tak.mission.add_cot — attach CoT to a mission
#        svc.tak.sa           — return current SA picture (all tracked entities)
#
# Auth: uses omos-nats-creds (same as tak-projector) + CLOUDTAK_TOKEN env var
# (a CloudTAK profile API token for the admin user — create once via CloudTAK UI
# Settings → Tokens → New Token, store in cloudtak-secrets).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: tak-agent
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tak-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tak-agent
      annotations:
        omos/script-hash: "ef5992013381ae96"
    spec:
      containers:
        - name: tak-agent
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install nats-py aiohttp --quiet
              exec python3 /scripts/tak_agent.py
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: CLOUDTAK_URL
              value: "http://cloudtak-api.cloudtak.svc.cluster.local:5000"
            - name: CLOUDTAK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudtak-agent-token
                  key: token
            - name: LEGACY_SUBJECT
              value: "agents.prompt.hermes.zeus.legacy"
            - name: TAK_CALLSIGN
              value: "Legacy"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: script
          configMap:
            name: tak-agent-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tak-agent-script
  namespace: hermes
data:
  tak_agent.py: |
    #!/usr/bin/env python3
    """
    tak-agent: TAK <-> Legacy AI bridge

    Subjects served:
      Subscribed:
        tak.cot.>          — all CoT out of TAK (cot-tap output)
        ent.*.*.state      — ORP fused entity state (SA picture)

      NATS micro services (request/reply):
        svc.tak.sa              — return current SA picture JSON
        svc.tak.inject_cot      — inject raw CoT XML into TAK
        svc.tak.chat            — send GeoChat as "Legacy" callsign
        svc.tak.mission.list    — list missions from CloudTAK
        svc.tak.mission.create  — create a mission in CloudTAK
        svc.tak.mission.add_cot — attach CoT to a mission

      Publishes:
        agents.prompt.hermes.zeus.legacy — incoming TAK chat for Legacy
    """
    import asyncio
    import json
    import logging
    import os
    import xml.etree.ElementTree as ET
    from datetime import datetime, timezone, timedelta
    from typing import Any
    import uuid

    import aiohttp
    import nats
    from nats.aio.client import Client as NATS

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [tak-agent] %(levelname)s %(message)s",
    )
    log = logging.getLogger("tak-agent")

    NATS_URL      = os.environ["NATS_URL"]
    NATS_USER     = os.environ["NATS_USER"]
    NATS_PASSWORD = os.environ["NATS_PASSWORD"]
    CLOUDTAK_URL  = os.environ["CLOUDTAK_URL"]
    CLOUDTAK_TOKEN = os.environ.get("CLOUDTAK_TOKEN", "")
    LEGACY_SUBJECT = os.environ.get("LEGACY_SUBJECT", "agents.prompt.hermes.zeus.legacy")
    TAK_CALLSIGN   = os.environ.get("TAK_CALLSIGN", "Legacy")
    LEGACY_UID     = "Legacy-AI-OneMind"  # stable UID — prevents duplicates in TAK

    # In-memory SA picture: uid -> entity dict
    sa_picture: dict[str, dict] = {}

    # ── CoT helpers ──────────────────────────────────────────────────────────

    def _now_stale(minutes: int = 5) -> tuple[str, str]:
        now = datetime.now(timezone.utc)
        stale = now + timedelta(minutes=minutes)
        fmt = "%Y-%m-%dT%H:%M:%S.%fZ"
        return now.strftime(fmt), stale.strftime(fmt)

    def build_geochat_cot(
        message: str,
        to_callsign: str = "All Chat Rooms",
        to_uid: str = "",
    ) -> str:
        """Build a GeoChat CoT XML from Legacy callsign.

        to_uid: actual TAK UID of the recipient (e.g. ANDROID-CloudTAK-admin).
                When provided, TAK routes directly to that EUD. Fallback to callsign.
        """
        now, stale = _now_stale(1)
        uid = f"Legacy-chat-{uuid.uuid4().hex[:8]}"
        # Use recipient's UID for chatroom/id if known — TAK routes by UID, not callsign
        recipient_id = to_uid if to_uid else to_callsign
        cot = f"""<event version="2.0" uid="{uid}" type="b-t-f" time="{now}" start="{now}" stale="{stale}" how="h-g-i-g-o">
      <point lat="0" lon="0" hae="0" ce="9999999" le="9999999"/>
      <detail>
        <__chat parent="RootContactGroup" groupOwner="false" messageId="{uid}" chatroom="{to_callsign}" id="{recipient_id}" senderCallsign="{TAK_CALLSIGN}">
          <chatgrp uid0="{LEGACY_UID}" uid1="{recipient_id}" id="{recipient_id}"/>
        </__chat>
        <link uid="{LEGACY_UID}" type="a-f-G-U-C" relation="p-p"/>
        <remarks source="BAO.F.ATAK.{LEGACY_UID}" to="{recipient_id}" time="{now}">{message}</remarks>
        <__serverdestination destinations="All Streaming"/>
      </detail>
    </event>"""
        return cot

    def build_marker_cot(
        uid: str,
        callsign: str,
        lat: float,
        lon: float,
        cot_type: str = "a-f-G-U-C",
        remarks: str = "",
    ) -> str:
        """Build a SA marker CoT XML."""
        now, stale = _now_stale(30)
        remarks_el = f"<remarks>{remarks}</remarks>" if remarks else ""
        return f"""<event version="2.0" uid="{uid}" type="{cot_type}" time="{now}" start="{now}" stale="{stale}" how="m-g">
      <point lat="{lat}" lon="{lon}" hae="0" ce="10" le="10"/>
      <detail>
        <contact callsign="{callsign}" endpoint="*:-1:stcp"/>
        <uid Droid="{callsign}"/>
        <takv platform="OneMind-AI" version="1.0" device="Legacy AI" os="Linux"/>
        <__group name="Cyan" role="Team Member"/>
        {remarks_el}
      </detail>
    </event>"""

    def build_legacy_presence_cot() -> str:
        """SA presence beacon for Legacy — keeps it alive as a TAK contact."""
        return build_marker_cot(
            uid=LEGACY_UID,
            callsign=TAK_CALLSIGN,
            lat=0.0,
            lon=0.0,
            cot_type="a-f-G-U-C",
            remarks="OneMind AI — chat with me!",
        )

    # ── CoT parser ───────────────────────────────────────────────────────────

    def parse_geochat(xml_str: str) -> dict | None:
        """Return {from, to, message, sender_uid} if this CoT is a GeoChat, else None."""
        try:
            root = ET.fromstring(xml_str)
            detail = root.find("detail")
            if detail is None:
                return None
            chat = detail.find("__chat")
            if chat is None:
                return None
            remarks = detail.find("remarks")
            message = remarks.text.strip() if remarks is not None and remarks.text else ""
            # Extract sender UID from <chatgrp uid0="..."> — needed for reply routing
            chatgrp = chat.find("chatgrp")
            sender_uid = chatgrp.attrib.get("uid0", "") if chatgrp is not None else ""
            return {
                "from": chat.attrib.get("senderCallsign", "unknown"),
                "to": chat.attrib.get("chatroom", ""),
                "message": message,
                "uid": root.attrib.get("uid", ""),
                "sender_uid": sender_uid,
            }
        except Exception:
            return None

    def parse_sa_entity(xml_str: str) -> dict | None:
        """Extract minimal SA entity from CoT."""
        try:
            root = ET.fromstring(xml_str)
            point = root.find("point")
            if point is None:
                return None
            detail = root.find("detail") or ET.Element("detail")
            contact = detail.find("contact")
            callsign = contact.attrib.get("callsign", "") if contact is not None else ""
            return {
                "uid": root.attrib.get("uid", ""),
                "type": root.attrib.get("type", ""),
                "callsign": callsign,
                "lat": float(point.attrib.get("lat", 0)),
                "lon": float(point.attrib.get("lon", 0)),
                "time": root.attrib.get("time", ""),
                "stale": root.attrib.get("stale", ""),
            }
        except Exception:
            return None

    # ── CloudTAK HTTP helpers ────────────────────────────────────────────────

    async def tak_get(session: aiohttp.ClientSession, path: str) -> Any:
        headers = {"Authorization": f"Bearer {CLOUDTAK_TOKEN}"}
        async with session.get(f"{CLOUDTAK_URL}{path}", headers=headers, ssl=False) as r:
            r.raise_for_status()
            return await r.json()

    async def tak_post(session: aiohttp.ClientSession, path: str, body: Any) -> Any:
        headers = {
            "Authorization": f"Bearer {CLOUDTAK_TOKEN}",
            "Content-Type": "application/json",
        }
        async with session.post(f"{CLOUDTAK_URL}{path}", headers=headers, json=body, ssl=False) as r:
            r.raise_for_status()
            return await r.json()

    # ── NATS micro service handlers ──────────────────────────────────────────

    def _ok(data: Any) -> bytes:
        return json.dumps({"ok": True, "data": data}).encode()

    def _err(msg: str) -> bytes:
        return json.dumps({"ok": False, "error": msg}).encode()

    async def handle_sa(msg, _session):
        """Return current SA picture."""
        await msg.respond(_ok(list(sa_picture.values())))

    async def handle_inject_cot(msg, _nc):
        """Inject raw CoT XML — body: {"cot": "<event .../>"}"""
        try:
            body = json.loads(msg.data.decode())
            cot_xml = body.get("cot", "")
            if not cot_xml:
                await msg.respond(_err("missing cot field"))
                return
            await _nc.publish("tak.cot.inject", cot_xml.encode())
            await msg.respond(_ok("injected"))
        except Exception as e:
            await msg.respond(_err(str(e)))

    async def handle_chat(msg, _nc):
        """Send a GeoChat message as Legacy. body: {"message": "...", "to": "All Chat Rooms"}"""
        try:
            body = json.loads(msg.data.decode())
            message = body.get("message", "")
            to = body.get("to", "All Chat Rooms")
            if not message:
                await msg.respond(_err("missing message"))
                return
            cot_xml = build_geochat_cot(message, to)
            await _nc.publish("tak.cot.inject", cot_xml.encode())
            await msg.respond(_ok("sent"))
        except Exception as e:
            await msg.respond(_err(str(e)))

    async def handle_mission_list(msg, session):
        """List missions from CloudTAK."""
        try:
            result = await tak_get(session, "/api/marti/mission?subscription=true")
            await msg.respond(_ok(result))
        except Exception as e:
            await msg.respond(_err(str(e)))

    async def handle_mission_create(msg, session):
        """Create a mission. body: {"name": "...", "description": "...", "group": ["__ANON__"]}"""
        try:
            body = json.loads(msg.data.decode())
            name = body.get("name", f"mission-{uuid.uuid4().hex[:6]}")
            result = await tak_post(session, "/api/marti/mission", {
                "name": name,
                "description": body.get("description", ""),
                "group": body.get("group", ["__ANON__"]),
                "defaultRole": body.get("defaultRole", "MISSION_SUBSCRIBER"),
            })
            await msg.respond(_ok(result))
        except Exception as e:
            await msg.respond(_err(str(e)))

    async def handle_mission_add_cot(msg, session):
        """Add a CoT entity to a mission. body: {"mission": "name", "cot": "<event .../>"}"""
        try:
            body = json.loads(msg.data.decode())
            mission_name = body.get("mission", "")
            cot_xml = body.get("cot", "")
            if not mission_name or not cot_xml:
                await msg.respond(_err("missing mission or cot"))
                return
            # PUT /api/marti/missions/:name/upload accepts CoT XML
            headers = {
                "Authorization": f"Bearer {CLOUDTAK_TOKEN}",
                "Content-Type": "application/xml",
            }
            async with session.put(
                f"{CLOUDTAK_URL}/api/marti/missions/{mission_name}/upload",
                headers=headers,
                data=cot_xml.encode(),
                ssl=False,
            ) as r:
                r.raise_for_status()
                result = await r.json()
            await msg.respond(_ok(result))
        except Exception as e:
            await msg.respond(_err(str(e)))

    # ── Main ─────────────────────────────────────────────────────────────────

    async def main():
        import ssl as _ssl
        tls_ctx = _ssl.create_default_context()
        tls_ctx.check_hostname = False
        tls_ctx.verify_mode = _ssl.CERT_NONE
        nc: NATS = await nats.connect(
            servers=[NATS_URL],
            user=NATS_USER,
            password=NATS_PASSWORD,
            name="tak-agent",
            tls=tls_ctx,
        )
        log.info("Connected to NATS")

        http_session = aiohttp.ClientSession()

        # ── 1. GeoChat listener on tak.cot.> ─────────────────────────────
        async def on_tak_cot(msg):
            try:
                xml_str = msg.data.decode(errors="replace")
                chat = parse_geochat(xml_str)
                if chat:
                    to_field = chat["to"].lower()
                    addressed = TAK_CALLSIGN.lower() in to_field
                    broadcast = to_field in ("all chat rooms", "allchatrooms", "all chat", "geochat")
                    # Skip self-echo
                    is_self = chat["from"].lower() == TAK_CALLSIGN.lower()
                if chat and (addressed or broadcast) and not is_self:
                    sender = chat["from"]
                    sender_uid = chat.get("sender_uid", "")
                    prompt = f"[TAK GeoChat from {sender}]: {chat['message']}"
                    log.info("GeoChat → Legacy: %s (uid=%s, room=%s)", prompt[:120], sender_uid, chat["to"])

                    # Use request/reply so Legacy can stream its response back
                    # Collect all response chunks and re-inject as GeoChat
                    async def _relay_response(sender=sender, sender_uid=sender_uid):
                        response_text = ""
                        try:
                            inbox = nc.new_inbox()
                            chunks = []
                            done = asyncio.Event()

                            async def _on_chunk(m):
                                if not m.data:  # zero-byte terminator = end of stream
                                    done.set()
                                    return
                                try:
                                    chunk = json.loads(m.data)
                                    if chunk.get("type") == "response":
                                        d = chunk.get("data", "")
                                        text = d if isinstance(d, str) else d.get("text", "")
                                        chunks.append(text)
                                except Exception:
                                    pass

                            sub = await nc.subscribe(inbox, cb=_on_chunk)
                            await nc.publish(LEGACY_SUBJECT, prompt.encode(), reply=inbox)

                            try:
                                await asyncio.wait_for(done.wait(), timeout=60)
                            except asyncio.TimeoutError:
                                log.warning("Legacy response timed out")
                            finally:
                                await sub.unsubscribe()

                            response_text = "".join(chunks).strip()
                        except Exception as e:
                            log.warning("Legacy relay error: %s", e)
                            response_text = f"[Legacy error: {e}]"

                        if response_text:
                            log.info("Legacy → TAK (uid=%s callsign=%s): %s", sender_uid, sender, response_text[:120])
                            cot_xml = build_geochat_cot(
                                response_text,
                                to_callsign=sender,
                                to_uid=sender_uid,
                            )
                            await nc.publish("tak.cot.inject", cot_xml.encode())

                    asyncio.create_task(_relay_response())

                # Also update SA picture from any SA CoT
                entity = parse_sa_entity(xml_str)
                if entity and entity["uid"]:
                    sa_picture[entity["uid"]] = entity
            except Exception as e:
                log.warning("on_tak_cot error: %s", e)

        await nc.subscribe("tak.cot.>", cb=on_tak_cot)
        log.info("Subscribed tak.cot.>")

        # ── 2. Entity state mirror from ORP ───────────────────────────────
        async def on_entity_state(msg):
            try:
                state = json.loads(msg.data.decode())
                uid = state.get("entity_id") or state.get("id") or msg.subject
                sa_picture[uid] = {
                    "uid": uid,
                    "type": state.get("entity_type", "unknown"),
                    "callsign": state.get("callsign") or state.get("name") or uid,
                    "lat": state.get("lat") or state.get("latitude") or 0,
                    "lon": state.get("lon") or state.get("longitude") or 0,
                    "time": state.get("timestamp") or state.get("time") or "",
                    "source": "orp",
                    "properties": state,
                }
            except Exception as e:
                log.warning("on_entity_state error: %s", e)

        await nc.subscribe("ent.*.*.state", cb=on_entity_state)
        log.info("Subscribed ent.*.*.state (SA mirror)")

        # ── 3. NATS micro services ────────────────────────────────────────
        async def _sa(m):            await handle_sa(m, http_session)
        async def _inject(m):        await handle_inject_cot(m, nc)
        async def _chat(m):          await handle_chat(m, nc)
        async def _mission_list(m):  await handle_mission_list(m, http_session)
        async def _mission_create(m): await handle_mission_create(m, http_session)
        async def _mission_add(m):   await handle_mission_add_cot(m, http_session)

        svc_handlers = {
            "svc.tak.sa":               _sa,
            "svc.tak.inject_cot":       _inject,
            "svc.tak.chat":             _chat,
            "svc.tak.mission.list":     _mission_list,
            "svc.tak.mission.create":   _mission_create,
            "svc.tak.mission.add_cot":  _mission_add,
        }
        for subject, handler in svc_handlers.items():
            await nc.subscribe(subject, cb=handler)
            log.info("Service: %s", subject)

        log.info("tak-agent ready — callsign='%s' forwarding to '%s'", TAK_CALLSIGN, LEGACY_SUBJECT)

        # ── 4. Periodic presence beacon — keeps Legacy alive in TAK contact lists
        async def _presence_loop():
            while True:
                try:
                    beacon = build_legacy_presence_cot()
                    await nc.publish("tak.cot.inject", beacon.encode())
                    log.debug("Presence beacon sent (uid=%s)", LEGACY_UID)
                except Exception as e:
                    log.warning("Presence beacon error: %s", e)
                await asyncio.sleep(30)

        asyncio.create_task(_presence_loop())
        log.info("Presence beacon started (30s interval, uid=%s)", LEGACY_UID)

        # Keep alive
        try:
            while True:
                await asyncio.sleep(30)
                log.debug("SA picture: %d entities", len(sa_picture))
        except asyncio.CancelledError:
            pass
        finally:
            await http_session.close()
            await nc.close()

    if __name__ == "__main__":
        asyncio.run(main())
