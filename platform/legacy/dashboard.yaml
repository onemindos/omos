apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
  ports:
    - name: http
      port: 9119
      targetPort: 9119
    - name: gateway-probe
      port: 8642
      targetPort: 8642
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: hermes
  annotations:
    tailscale.com/hostname: hermes-agent
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hermes-dashboard
      port:
        number: 9119
  tls:
    - hosts:
        - hermes-agent
