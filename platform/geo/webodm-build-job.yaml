apiVersion: v1
kind: ConfigMap
metadata:
  name: webodm-build-context
  namespace: geo
data:
  # Kaniko will clone from GitHub directly — no local build context needed
  clone-and-build.sh: |
    #!/bin/sh
    git clone --depth=1 https://github.com/OpenDroneMap/WebODM.git /workspace/WebODM
---
apiVersion: batch/v1
kind: Job
metadata:
  name: webodm-kaniko-build
  namespace: geo
  labels:
    app: webodm-build
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: git-clone
          image: alpine/git:latest
          command: ["git", "clone", "--depth=1",
                    "https://github.com/OpenDroneMap/WebODM.git",
                    "/workspace"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:debug
          args:
            - "--context=/workspace"
            - "--dockerfile=/workspace/Dockerfile"
            - "--destination=ghcr.io/onemindos/webodm:latest"
            - "--cache=false"
            - "--snapshot-mode=redo"
            - "--ignore-path=/proc"
            - "--ignore-path=/sys"
            - "--log-format=text"
          env:
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker
          resources:
            requests:
              cpu: "1"
              memory: 1500Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
        - name: docker-config
          secret:
            secretName: ghcr-push-secret
            items:
              - key: .dockerconfigjson
                path: config.json
