# =============================================================================
# farmOS — Farm Brain
# Crop/livestock/harvest/plan records. JSON:API at /api
# DB: geo-db (TimescaleDB/PostGIS)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmos
  namespace: geo
  labels:
    app: farmos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: farmos
  template:
    metadata:
      labels:
        app: farmos
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ['sh', '-c', 'until pg_isready -h geo-db -U geo; do echo waiting for geo-db; sleep 2; done']
      containers:
        - name: farmos
          image: farmos/farmos:3.x
          ports:
            - containerPort: 80
          env:
            - name: FARMOS_DB_HOST
              value: "geo-db"
            - name: FARMOS_DB_PORT
              value: "5432"
            - name: FARMOS_DB_NAME
              value: "farmos"
            - name: FARMOS_DB_USER
              value: "geo"
            - name: FARMOS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: farmos-data
              mountPath: /var/www/html/sites/default/files
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: farmos-data
          persistentVolumeClaim:
            claimName: farmos-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: farmos-data
  namespace: geo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: farmos
  namespace: geo
spec:
  selector:
    app: farmos
  ports:
    - port: 80
      targetPort: 80
