# =============================================================================
# Geo Stack — External Secrets (1Password via ESO)
# Create these items in 1Password vault "00-24 SO" before applying:
#
# Item: geo-db-secret
#   POSTGRES_PASSWORD = <strong password>
#
# Item: geo-services-secret
#   GEOSERVER_ADMIN_PASSWORD = <strong password>
#   NOMINATIM_PASSWORD = <strong password>
#   SUPERSET_SECRET_KEY = <32-char random string>
#   SUPERSET_ADMIN_PASSWORD = <strong password>
#
# Item: geo-minio-secret
#   MINIO_ACCESS_KEY = (from cloudtak-secrets MINIO_ROOT_USER)
#   MINIO_SECRET_KEY = (from cloudtak-secrets MINIO_ROOT_PASSWORD)
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geo-db-secret
  namespace: geo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: geo-db-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: geo-db-secret
        property: password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: geo-db-secret
        property: username
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geo-services-secret
  namespace: geo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: geo-services-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: geo-services-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geo-minio-secret
  namespace: geo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: geo-minio-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: geo-minio-secret
