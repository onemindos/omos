# =============================================================================
# Geo Stack — Tailscale Ingresses
# All services accessible at *.tail717ba0.ts.net — no public exposure
# Pattern: ingressClassName: tailscale + tailscale.com/hostname annotation
# =============================================================================

# farmOS — Farm Brain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: farmos
  namespace: geo
  annotations:
    tailscale.com/hostname: "farmos"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: farmos
      port:
        number: 80
  tls:
    - hosts: ["farmos"]
---
