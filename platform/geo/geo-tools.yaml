# =============================================================================
# pg_tileserv — Zero-Config PostGIS → Vector Tiles
# 18MB Go binary. Every PostGIS table = instant tile endpoint. No config needed.
# Sensor locations, field bounds, TAK tracks auto-served from geo-db
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-tileserv
  namespace: geo
  labels:
    app: pg-tileserv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-tileserv
  template:
    metadata:
      labels:
        app: pg-tileserv
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ['sh', '-c', 'until pg_isready -h geo-db -U geo; do sleep 2; done']
      containers:
        - name: pg-tileserv
          image: pramsey/pg_tileserv:latest
          ports:
            - containerPort: 7800
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://geo:$(POSTGRES_PASSWORD)@geo-db.geo.svc.cluster.local:5432/geo"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /index.json
              port: 7800
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pg-tileserv
  namespace: geo
spec:
  selector:
    app: pg-tileserv
  ports:
    - port: 7800
      targetPort: 7800
---
# =============================================================================
# pg_featureserv — PostGIS → OGC Features REST API
# Query farm features (fields, fences, sensors) as GeoJSON
# Complements pg_tileserv — same family, different protocol
# =============================================================================
apiVersion: apps/v1
