  template:
    metadata:
      labels:
        app: pg-featureserv
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ['sh', '-c', 'until pg_isready -h geo-db -U geo; do sleep 2; done']
      containers:
        - name: pg-featureserv
          image: pramsey/pg_featureserv:latest
          ports:
            - containerPort: 9000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://geo:$(POSTGRES_PASSWORD)@geo-db.geo.svc.cluster.local:5432/geo"
          resources:
            requests:
