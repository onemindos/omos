# =============================================================================
# Grafana — Dashboards + Alerting
# Native TimescaleDB, PostgreSQL, ClickHouse datasources
# Homestead sensor telemetry, GPS tracks, farmOS data, NATS event analytics
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: geo
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-services-secret
                  key: GEOSERVER_ADMIN_PASSWORD
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.tail717ba0.ts.net"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
            - name: GF_DATABASE_TYPE
              value: "postgres"
            - name: GF_DATABASE_HOST
              value: "geo-db.geo.svc.cluster.local:5432"
            - name: GF_DATABASE_NAME
              value: "grafana"
            - name: GF_DATABASE_USER
              value: "geo"
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: GF_DATABASE_SSL_MODE
              value: "disable"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-worldmap-panel,grafana-clock-panel,marcusolsson-static-datasource,grafana-clickhouse-datasource"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: geo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: geo
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
