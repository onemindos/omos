# =============================================================================
# OpenAerialMap — Visual Drone Orthophoto Browser
# Browse/serve all your drone orthophotos on an interactive map
# MinIO (cloudtak namespace) as S3-compatible backend
# Using v1 (stable Docker Compose-compatible) — v2 eoAPI when ready
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oam-api
  namespace: geo
  labels:
    app: oam-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oam-api
  template:
    metadata:
      labels:
        app: oam-api
    spec:
      containers:
        - name: oam-api
          # OAM v2 — STAC-based imagery catalog (GHCR, published from hotosm/OpenAerialMap CI)
          image: ghcr.io/hotosm/openaerialmap/stac-api:main
          ports:
            - containerPort: 4000
          env:
            - name: POSTGRES_USER
              value: "geo"
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST_READER
              value: "geo-db.geo.svc.cluster.local"
            - name: POSTGRES_HOST_WRITER
              value: "geo-db.geo.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DBNAME
              value: "oam"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "4000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oam-api
  namespace: geo
spec:
  selector:
    app: oam-api
  ports:
    - port: 4000
      targetPort: 4000
---
# OAM needs MongoDB as catalog store
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oam-mongo
  namespace: geo
  labels:
    app: oam-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oam-mongo
  template:
    metadata:
      labels:
        app: oam-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: oam-mongo-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oam-mongo-data
  namespace: geo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oam-mongo
  namespace: geo
spec:
  selector:
    app: oam-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
# =============================================================================
# Grafana — Dashboards + Alerting
# Native TimescaleDB, PostgreSQL, ClickHouse datasources
# Homestead sensor telemetry, GPS tracks, farmOS data, NATS event analytics
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: geo
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-services-secret
                  key: GEOSERVER_ADMIN_PASSWORD
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.tail717ba0.ts.net"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
            - name: GF_DATABASE_TYPE
              value: "postgres"
            - name: GF_DATABASE_HOST
              value: "geo-db.geo.svc.cluster.local:5432"
            - name: GF_DATABASE_NAME
              value: "grafana"
            - name: GF_DATABASE_USER
              value: "geo"
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: GF_DATABASE_SSL_MODE
              value: "disable"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-worldmap-panel,grafana-clock-panel,marcusolsson-static-datasource,grafana-clickhouse-datasource"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: geo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: geo
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
