apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus-site
  namespace: zeus-site
  labels:
    app: zeus-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeus-site
  template:
    metadata:
      labels:
        app: zeus-site
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: zeus-site
          image: ghcr.io/onemindos/zeus-site:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: PAYLOAD_PUSH_SCHEMA
              value: "true"
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: zeus-site-secrets
                  key: DATABASE_URI
            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: zeus-site-secrets
                  key: PAYLOAD_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zeus-site
  namespace: zeus-site
spec:
  selector:
    app: zeus-site
  ports:
    - port: 3000
      targetPort: 3000
