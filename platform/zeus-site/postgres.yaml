apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zeus-site-postgres-pvc
  namespace: zeus-site
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeus-site-postgres
  namespace: zeus-site
spec:
  replicas: 1
  # RWO volume: a rolling update across nodes deadlocks on Multi-Attach (seen 2026-10-10).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zeus-site-postgres
  template:
    metadata:
      labels:
        app: zeus-site-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: zeus_site
            - name: POSTGRES_USER
              value: zeus_site
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zeus-site-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: zeus-site-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zeus-site-postgres
  namespace: zeus-site
spec:
  selector:
    app: zeus-site-postgres
  ports:
    - port: 5432
      targetPort: 5432
