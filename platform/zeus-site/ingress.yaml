apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeus-site-ingress
  namespace: zeus-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - zeusdelacruz.com
        - www.zeusdelacruz.com
      secretName: zeusdelacruz-tls
  rules:
    - host: zeusdelacruz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeus-site
                port:
                  number: 3000
    - host: www.zeusdelacruz.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeus-site
                port:
                  number: 3000
