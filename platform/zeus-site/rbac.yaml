apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeus-site-deployer
  namespace: zeus-site
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeus-site-deployer
  namespace: zeus-site
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeus-site-deployer
  namespace: zeus-site
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeus-site-deployer
subjects:
  - kind: ServiceAccount
    name: zeus-site-deployer
    namespace: zeus-site
