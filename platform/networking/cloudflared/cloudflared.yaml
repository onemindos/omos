# Cloudflare Tunnel connector (remotely-managed tunnel, token mode).
#
# Outbound-only: cloudflared dials Cloudflare on 7844 (QUIC/UDP, falls back to
# HTTP/2 over TCP), so no inbound port, public IP or cloud load balancer is needed.
# That is what lets the same manifests run unchanged behind NAT on a home server.
#
# Public hostname -> origin routes are NOT in this file. For a remotely-managed
# tunnel they live in Cloudflare (Zero Trust -> Networks -> Tunnels -> Public
# hostnames). Every route points at ingress-nginx so existing Ingress objects keep
# working unchanged:
#   https://ingress-nginx-controller.ingress-nginx.svc.cluster.local:443
#   (No TLS Verify = on, Origin Server Name = the public hostname)
# See docs/networking/NETWORKING.md for the full table and cut-over runbook.
#
# INERT BY DEFAULT: replicas is 0. The Deployment references Secret
# `cloudflared-tunnel-token` (key `token`) in namespace `cloudflare`, which the
# operator creates by hand. With replicas 0 nothing starts, nothing dials Cloudflare
# and Argo reports Healthy. Activation is a one-line PR (replicas: 2) AFTER the
# Secret exists. This is deliberately not an optional secretKeyRef: a missing
# secret would crash-loop and leave Argo Degraded.
#
# Coexists with the legacy standby in platform/core/cloudflared.yaml (different
# names/labels, also scaled to 0). The legacy file is removed in the cut-over PR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-tunnel
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared-tunnel
    app.kubernetes.io/part-of: omos-networking
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared-tunnel
    app.kubernetes.io/part-of: omos-networking
spec:
  # Inert until Secret cloudflared-tunnel-token exists. Flip to 2 to activate.
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-tunnel
        app.kubernetes.io/part-of: omos-networking
    spec:
      serviceAccountName: cloudflared-tunnel
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes so one node loss does not drop the tunnel.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared-tunnel
      containers:
        - name: cloudflared
          # 2026.10.0 multi-arch index (amd64 + arm64, so it also runs on a home ARM box).
          # Digest verified against Docker Hub on 2026-10-09.
          image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --grace-period
            - 30s
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
# maxUnavailable (not minAvailable) so a drain is never blocked while the
# Deployment is at 0 replicas, and with 2 replicas it still evicts one at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-tunnel
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflared-tunnel
    app.kubernetes.io/part-of: omos-networking
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-tunnel
