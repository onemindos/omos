apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redpanda-console
  namespace: observe
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: redpanda-console
      port:
        number: 8080
  tls:
    - hosts:
        - redpanda-console
