# Defaults proxy resource sizing for resources labeled for this ProxyClass.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-default
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
