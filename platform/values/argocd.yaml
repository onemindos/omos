# ArgoCD — resource requests/limits for DO upgrade compliance
# Pass via: helm upgrade -f ./values/argocd.yaml
controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi

# ArgoCD init container "copyutil" also flagged
copyutil:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
