# ArgoCD — resource requests/limits for DO upgrade compliance, plus sign-in through Authentik
# Argo CD is still a Helm CLI release. Apply with:
#   helm upgrade argocd argo/argo-cd --version 10.1.2 -n argocd -f platform/values/argocd.yaml
# platform/argocd/platform-argocd.yaml defines the Application that will manage it (manual sync only).
# Order and steps: docs/gitops/ARGOCD-SELF-MANAGEMENT.md. After adoption, never run helm upgrade again.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 1900Mi  # observed ~1570Mi, +20% (2026-11-07)
    limits:
      memory: 2560Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 200Mi  # observed ~165Mi, +20%
    limits:
      memory: 512Mi

# ApplicationSet controller off (no ApplicationSets exist; owner-approved 2026-11-07). The chart has no
# `enabled` switch, so replicas: 0 keeps the Deployment at 0 and Argo CD sync keeps it there. Set it back
# to 1 before creating any ApplicationSet.
applicationSet:
  replicas: 0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Dex is not used: nothing configured dex.config, and Argo CD signs in to Authentik directly (configs.cm oidc.config).
dex:
  enabled: false

# Notifications controller stays on: the alerts work (separate change) points it at the alert channel.
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 70Mi  # observed ~56Mi, +20%
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 90Mi  # observed ~73Mi, +20%
    limits:
      memory: 256Mi

# ArgoCD init container "copyutil" also flagged
copyutil:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

configs:
  cm:
    # Tailscale hostname of the argocd Ingress (platform/backstage: Ingress argocd, ingressClassName tailscale).
    url: https://argocd.tail717ba0.ts.net
    # Break-glass local admin. KEEP until SSO login is proven; remove in a separate follow-up PR.
    admin.enabled: "true"
    # Read-only API identity for the onemind-mcp hub (platform/hermes/mcp). apiKey: bearer tokens
    # only (generated out of band, held in the onemind-mcp-auth SealedSecret). Role role:mcp-read below.
    # `login` is listed only so the token can be issued; no password is kept, so nobody can sign in.
    accounts.mcp-read: apiKey, login
    accounts.mcp-read.enabled: "true"
    # Tool gateway identity for Legacy (platform/tool-gateway, target argocd): apiKey only, token generated by the owner in the keys session.
    # Read-only permissions below: no sync, no action, no delete (the MCP backend also runs MCP_READ_ONLY).
    accounts.legacy: apiKey
    accounts.legacy.enabled: "true"
    # Authentik provider/application `argocd` is created by platform/ecosystem/resources/argocd-authentik-provider.yaml.
    # clientSecret is read from Secret argocd/argocd-oidc-authentik (SealedSecret in platform/ecosystem/resources/secrets/).
    oidc.config: |
      name: Authentik
      issuer: https://auth.onemindos.dev/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-oidc-authentik:client-secret
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  rbac:
    # Same as today: no default role, so a signed-in user outside a mapped group sees nothing.
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin
      # onemind-mcp: application status only. Narrower than role:readonly (no logs, repositories, clusters or projects).
      p, role:mcp-read, applications, get, */*, allow
      g, mcp-read, role:mcp-read
      # tool gateway (account legacy): read applications, their logs, projects and clusters. No sync, action or delete.
      p, role:legacy, applications, get, */*, allow
      p, role:legacy, logs, get, */*, allow
      p, role:legacy, projects, get, *, allow
      p, role:legacy, clusters, get, *, allow
      g, legacy, role:legacy
    scopes: "[groups]"
