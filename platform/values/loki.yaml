# Loki — log store. Single-binary, filesystem storage (single-node; scales to
# object storage later). Loki 3.x ingests OTLP natively at /otlp/v1/logs.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 336h   # 14d

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi
    # No storageClassName: the live PVC uses the cluster default (do-block-storage) and
    # StatefulSet volumeClaimTemplates are immutable. Expanded to 50Gi on the PVC itself.
  resources:
    # Request matches real use (7-day peak 1.19 GiB; it was 512Mi).
    requests:
      cpu: 100m
      memory: 1536Mi
    limits:
      memory: 2Gi

# Disable the scalable-mode components and external deps we don't need.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
gateway:
  enabled: true
  nginxConfig:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
