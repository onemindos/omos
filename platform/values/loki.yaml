# Loki — log store. Single-binary, filesystem storage (single-node; scales to
# object storage later). Loki 3.x ingests OTLP natively at /otlp/v1/logs.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 744h   # 31d

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

# Disable the scalable-mode components and external deps we don't need.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
gateway:
  enabled: true
