# OTel pipeline: logs go to Loki, traces to Tempo. (The OpenSearch exporters for OpenChoreo were removed.)
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  exporters:
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers:
        - otlp
        exporters:
        - otlp/tempo
      logs:
        exporters:
        - otlphttp/loki
    extensions:
    - health_check
  processors:
    k8sattributes:
      extract:
        labels:
        - tag_name: openchoreo.dev/component-uid
          key: openchoreo.dev/component-uid
          from: pod
        - tag_name: openchoreo.dev/project-uid
          key: openchoreo.dev/project-uid
          from: pod
        - tag_name: openchoreo.dev/environment-uid
          key: openchoreo.dev/environment-uid
          from: pod
        - tag_name: openchoreo.dev/namespace
          key: openchoreo.dev/namespace
          from: pod
        - tag_name: openchoreo.dev/component
          key: openchoreo.dev/component
          from: pod
        - tag_name: openchoreo.dev/project
          key: openchoreo.dev/project
          from: pod
        - tag_name: openchoreo.dev/environment
          key: openchoreo.dev/environment
          from: pod
        - tag_name: target
          key: target
          from: pod
        - tag_name: version
          key: version
          from: pod
        - tag_name: version_id
          key: version_id
          from: pod
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
