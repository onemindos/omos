# OTel pipeline: logs go to Loki. Traces have no backend (Tempo removed 2026-11-03).
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  exporters:
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
  service:
    pipelines:
      traces: null # drop the chart's default traces pipeline (debug exporter): no trace backend
      logs:
        exporters:
        - otlphttp/loki
    extensions:
    - health_check
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
