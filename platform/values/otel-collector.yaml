# OTel pipeline: logs go to Loki, traces to Tempo.
mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  exporters:
    otlphttp/loki:
      endpoint: http://loki-gateway.monitoring.svc.cluster.local/otlp
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers:
        - otlp
        exporters:
        - otlp/tempo
      logs:
        exporters:
        - otlphttp/loki
    extensions:
    - health_check
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
