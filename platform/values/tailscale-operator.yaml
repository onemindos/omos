# Tailscale K8s Operator, deployed values (Helm release "tailscale-operator", managed by Argo CD).
#
# OAuth credentials are deliberately NOT set here. The operator Deployment mounts the
# pre-existing Secret "operator-oauth" (namespace tailscale), which is owned by the
# SealedSecret of the same name. With oauth.clientId unset the chart does not render its own
# operator-oauth Secret, so Argo CD can never overwrite the real credential with an empty
# client_secret. The Deployment is byte-for-byte the same either way (it always references
# secretName operator-oauth). Never put oauth.clientId/clientSecret in this file.
# autoApprovers are set in platform/core/policy.hujson (GitOps ACLs).
apiServerProxyConfig:
  mode: "true"

operator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

proxy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
