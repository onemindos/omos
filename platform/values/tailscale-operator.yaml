# Tailscale K8s Operator — deployed values
# IMPORTANT: clientSecret is a real credential — stored here for reference ONLY.
# On a fresh deploy, inject from 1Password: op read "op://00-24 SO/tailscale-oauth/credential"
# oauth.clientId and oauth.clientSecret are the Tailscale OAuth client for the operator.
# autoApprovers are set in platform/tailscale/policy.hujson (GitOps ACLs).
apiServerProxyConfig:
  mode: "true"
oauth:
  clientId: kUqyevoBNS11CNTRL
  # clientSecret: <inject from 1Password — DO NOT commit real value>

operator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

proxy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
