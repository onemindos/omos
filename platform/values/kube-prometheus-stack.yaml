# kube-prometheus-stack — resource requests/limits for DO upgrade compliance
# Argo-owned release: monitoring-kube-prometheus-stack.
prometheus:
  prometheusSpec:
    # Rebalance the 2Gi request off hub-core; keep fallback capacity available.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: doks.digitalocean.com/node-pool
                  operator: In
                  values: [onemind-ecosystem-cpu]
    resources:
      # Request matches real use (7-day peak 1.73 GiB; it was 512Mi); limit raised so the peak is not 86% of it.
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 3Gi
    # Keep metrics on a volume: until 2026-10-17 the database was on temporary storage, so every restart
    # erased the history (retention is 10d). retentionSize keeps the data inside the volume.
    retention: 10d
    retentionSize: 17GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: do-block-storage
          resources:
            requests:
              storage: 20Gi
    # Pick up PrometheusRule CRs from all namespaces
    ruleSelector: {}
    ruleNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  # Base Alertmanager config: the chart defaults, restated so live routing is readable here, plus
  # Telegram for critical and warning alerts. AlertmanagerConfig CRs are merged in ahead of these
  # routes with `continue: true`, so they never stop an alert from reaching Telegram. Telegram is
  # configured here, not in an AlertmanagerConfig, because that CRD only takes the chat ID as a
  # literal integer; here the token and chat ID are both files from a Secret, never in Git.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      # A critical alert mutes the warning/info alert of the same name in the same namespace.
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      # Alerts no child route matches (severity info or none) end here.
      receiver: 'null'
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # The always-firing heartbeat and the inhibitor placeholder are never notified.
        - receiver: 'null'
          matchers:
            - 'alertname =~ "Watchdog|InfoInhibitor"'
        # One message per alert name and namespace. Warnings repeat every 12h, critical every 4h.
        - receiver: telegram
          matchers:
            - 'severity =~ "critical|warning"'
          group_by: ['alertname', 'namespace']
          routes:
            - receiver: telegram
              matchers:
                - 'severity = critical'
              repeat_interval: 4h
    receivers:
      - name: 'null'
      - name: telegram
        telegram_configs:
          # Both files are read when a message is sent, from Secret monitoring/alertmanager-telegram
          # (SealedSecret platform/monitoring/alertmanager-telegram.sealedsecret.yaml, keys bot-token
          # and chat-id), mounted by alertmanagerSpec.volumes below.
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
            send_resolved: true
            parse_mode: HTML
            # Kept short on purpose: in HTML mode a message over Telegram's 4096-character limit is
            # replaced by an error line, so at most 8 alerts are listed. Never write "$(" here: the
            # config reloader expands $(VAR) references before Alertmanager reads the file.
            message: |-
              {{- $alerts := .Alerts.Firing }}{{ if eq .Status "resolved" }}{{ $alerts = .Alerts.Resolved }}{{ end -}}
              <b>{{ .Status | toUpper }}{{ if eq .Status "firing" }} {{ len .Alerts.Firing }}{{ end }}</b> {{ .CommonLabels.alertname }} [{{ .CommonLabels.severity }}]
              {{- with .CommonLabels.namespace }} {{ . }}{{ end }}
              {{- if and (eq .Status "firing") .Alerts.Resolved }} (+{{ len .Alerts.Resolved }} resolved){{ end }}
              {{- range $i, $a := $alerts }}{{ if lt $i 8 }}
              - {{ with $a.Annotations.description }}{{ . }}{{ else }}{{ $a.Annotations.summary }}{{ end }}
              {{- end }}{{ end }}
              {{- if gt (len $alerts) 8 }}
              (first 8 of {{ len $alerts }}){{ end }}
              {{- with .CommonAnnotations.runbook_url }}
              <a href="{{ . }}">Runbook</a>{{ end }}
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Pick up AlertmanagerConfig CRs; with no namespace selector the operator only
    # reads Alertmanager's own namespace (monitoring). Matches the live release.
    alertmanagerConfigSelector: {}
    # AlertmanagerConfig routes are not given a namespace matcher. Kept from the OpenChoreo
    # `openchoreo` config, now removed; routes added later (platform/monitoring/pending/)
    # use `continue: true` and are unaffected.
    alertmanagerConfigMatcherStrategy:
      type: None
    # Telegram credential files for config.receivers above. optional: true keeps Alertmanager starting
    # when the Secret is missing (only Telegram sends fail); `secrets:` would block the pod instead.
    volumes:
      - name: alertmanager-telegram
        secret:
          secretName: alertmanager-telegram
          optional: true
          defaultMode: 288  # 0440: root and the pod's fsGroup (2000) can read
    volumeMounts:
      - name: alertmanager-telegram
        mountPath: /etc/alertmanager/secrets/alertmanager-telegram
        readOnly: true

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeExporter:
  enabled: true

grafana:
  # Legacy Helm field ownership retains emptyDir/rollingUpdate under SSA.
  # Replace this fully rendered Deployment only; never Force/delete its PVC.
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  # Existing seed/remote restore passed before this RWO Recreate cutover.
  deploymentStrategy: {type: Recreate}
  persistence:
    enabled: true
    type: pvc
    existingClaim: grafana-data
  initChownData:
    enabled: false
  podLabels:
    onemind.io/grafana-persistent: "true"
  extraInitContainers:
    - name: require-verified-state
      image: docker.io/grafana/grafana:13.1.0
      command: [sh, -ec]
      args:
        - >-
          test -s /var/lib/grafana/grafana.db &&
          grep -q '"restoreVerified": true' /var/lib/grafana/.onemind-grafana-seed.json
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - {name: storage, mountPath: /var/lib/grafana, readOnly: true}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values: [onemind-ecosystem-cpu]
  # Use the existing admin Secret. Without this the chart generates a random
  # password on every render, so Argo would change the Grafana password each sync.
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  sidecar:
    dashboards:
      # Only annotated ConfigMaps enter named folders; existing root boards stay put.
      folderAnnotation: onemind.io/grafana-folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        memory: 128Mi

prometheusOperator:
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 2m
        memory: 64Mi
      limits:
        memory: 128Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# DOKS owns these control-plane endpoints; Cilium replaces kube-proxy.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
