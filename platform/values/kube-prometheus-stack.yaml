# kube-prometheus-stack — resource requests/limits for DO upgrade compliance
# Pass via: helm upgrade -f ./values/kube-prometheus-stack.yaml
prometheus:
  prometheusSpec:
    resources:
      # Request matches real use (7-day peak 1.73 GiB; it was 512Mi); limit raised so the peak is not 86% of it.
      requests:
        cpu: 200m
        memory: 2Gi
      limits:
        memory: 3Gi
    # Keep metrics on a volume: until 2026-10-17 the database was on temporary storage, so every restart
    # erased the history (retention is 10d). retentionSize keeps the data inside the volume.
    retention: 10d
    retentionSize: 17GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: do-block-storage
          resources:
            requests:
              storage: 20Gi
    # Pick up PrometheusRule CRs from all namespaces
    ruleSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Pick up AlertmanagerConfig CRs; with no namespace selector the operator only
    # reads Alertmanager's own namespace (monitoring). Matches the live release.
    alertmanagerConfigSelector: {}

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeExporter:
  enabled: true

grafana:
  # Use the existing admin Secret. Without this the chart generates a random
  # password on every render, so Argo would change the Grafana password each sync.
  admin:
    existingSecret: monitoring-grafana
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# DOKS owns these control-plane endpoints; Cilium replaces kube-proxy.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
