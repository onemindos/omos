# kube-prometheus-stack — resource requests/limits for DO upgrade compliance
# Pass via: helm upgrade -f ./values/kube-prometheus-stack.yaml
prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    # Pick up PrometheusRule CRs from all namespaces
    ruleSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Pick up AlertmanagerConfig CRs from the monitoring namespace
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector:
      matchNames:
        - monitoring

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeExporter:
  enabled: true

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
