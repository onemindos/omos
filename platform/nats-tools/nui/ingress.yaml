# NUI -- tailnet only: https://nui.tail717ba0.ts.net, behind the Authentik proxy outpost nui-auth (auth-outpost.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nui
  namespace: nats
  annotations:
    tailscale.com/proxy-group: ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: nui-auth
      port:
        number: 9000
  tls:
    - hosts:
        - nui
