# NUI -- tailnet only: https://nui.tail717ba0.ts.net (see deployment.yaml for the access model).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nui
  namespace: nats
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: nui
      port:
        number: 31311
  tls:
    - hosts:
        - nui
