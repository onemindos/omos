# NUI: the official NATS web UI (https://github.com/nats-nui/nui), replacing HeyNATS, NATS UI
# (gastbob40) and NATS Dashboard (mdawar). Tailnet only: https://nui.tail717ba0.ts.net
#
# - NUI has no login of its own and its API returns the stored connection credentials. It is gated by
#   an Authentik proxy outpost (auth-outpost.yaml; admins only) on top of the tailnet ACL (group:admins).
#   Only the outpost (and the portal health probe) may reach port 31311. Never expose NUI directly.
# - The one connection (`nats`, user `onemind`) is imported at start from a NATS CLI context file
#   in the SealedSecret nui-nats-context, mounted at /clicontexts (--nats-cli-contexts).
# - /db is an emptyDir on purpose (no PVC, volume slots are scarce). Anything created in the UI
#   (extra connections, subscriptions, metrics sources) is lost on restart; the imported
#   connection comes back every time.
# - NUI only applies the context's `ca` when the context also has a client cert and key, which
#   this bus does not use. SSL_CERT_FILE adds the private NATS CA to Go's trusted roots instead.
# - The image is public; the tag is 0.10.0 (no leading v) and the digest is the multi-arch index.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nui
  namespace: nats
  labels:
    app.kubernetes.io/name: nui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: db
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nats-ca
          secret:
            secretName: nats-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: contexts
          secret:
            secretName: nui-nats-context
            defaultMode: 0440
      containers:
        - name: nui
          # ghcr.io/nats-nui/nui:0.10.0
          image: ghcr.io/nats-nui/nui@sha256:879b64b2f2fa4c3298681ed0bebfbcfd80cae281ff787a10c404bbd62160d18a
          imagePullPolicy: IfNotPresent
          args:
            - --nats-cli-contexts=/clicontexts
          ports:
            - name: http
              containerPort: 31311
          env:
            - name: SSL_CERT_FILE
              value: /etc/nats-ca/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db
              mountPath: /db
            - name: tmp
              mountPath: /tmp
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
            - name: contexts
              mountPath: /clicontexts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nui
  namespace: nats
  labels:
    app.kubernetes.io/name: nui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nui
  ports:
    - name: http
      port: 31311
      targetPort: http
