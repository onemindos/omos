apiVersion: apps/v1
kind: Deployment
metadata:
  name: nui
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: nui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nui
    spec:
      containers:
        - name: nui
          image: ghcr.io/nats-nui/nui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 31311
          volumeMounts:
            - name: nui-data
              mountPath: /db
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: nui-data
          persistentVolumeClaim:
            claimName: nui-data
---
apiVersion: v1
kind: Service
metadata:
  name: nui
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: nui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nui
  ports:
    - name: http
      port: 31311
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nui-data
  namespace: nats-tools
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
