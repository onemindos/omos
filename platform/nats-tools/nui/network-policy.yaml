# NUI: reachable only through the Authentik outpost nui-auth (and the portal health probe), and may only talk to the NATS servers
# (client port 4222 only) and cluster DNS. kubelet probes are admitted by Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nui
  namespace: nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nui-auth
        # Portal health card (plugin-onemind-common-backend/src/health.ts) probes /health.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
      ports:
        - protocol: TCP
          port: 31311
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
              app.kubernetes.io/instance: nats
              app.kubernetes.io/name: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
