apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenttap
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: agenttap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agenttap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenttap
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: agenttap
          image: ghcr.io/onemindos/agenttap:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: NATS_WS_URL
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: onemind-user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: onemind-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agenttap
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: agenttap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agenttap
  ports:
    - name: http
      port: 8080
      targetPort: http
