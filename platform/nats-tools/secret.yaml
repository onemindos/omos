# NATS credentials for all nats-tools deployments.
# Pulled from 1Password via the in-cluster Connect server.
#
# 1Password item to create (vault: "00-24 SO (Sovereign Operations)"):
#   Title:              nats-tools-creds
#   SYS_USER:           sys
#   SYS_PASSWORD:       <value from platform/nats/creds.secret.env>
#   ONEMIND_USER:       onemind
#   ONEMIND_PASSWORD:   <value from platform/nats/creds.secret.env>
#   NATS_WS_URL:        ws://nats.nats.svc.cluster.local:8080
#   NATS_MONITORING_URL: http://nats.nats.svc.cluster.local:8222
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-creds
  namespace: nats-tools
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nats-creds
    creationPolicy: Owner
  data:
    - secretKey: SYS_USER
      remoteRef:
        key: nats-tools-creds
        property: SYS_USER
    - secretKey: SYS_PASSWORD
      remoteRef:
        key: nats-tools-creds
        property: SYS_PASSWORD
    - secretKey: ONEMIND_USER
      remoteRef:
        key: nats-tools-creds
        property: ONEMIND_USER
    - secretKey: ONEMIND_PASSWORD
      remoteRef:
        key: nats-tools-creds
        property: ONEMIND_PASSWORD
    - secretKey: NATS_WS_URL
      remoteRef:
        key: nats-tools-creds
        property: NATS_WS_URL
    - secretKey: NATS_MONITORING_URL
      remoteRef:
        key: nats-tools-creds
        property: NATS_MONITORING_URL
