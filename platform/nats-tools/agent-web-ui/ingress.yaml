apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-web-ui
  namespace: nats-tools
  annotations:
    tailscale.com/hostname: agent-web-ui
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: agent-web-ui
      port:
        number: 3300
  tls:
    - hosts:
        - agent-web-ui
