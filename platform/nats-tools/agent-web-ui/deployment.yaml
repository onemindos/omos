apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-web-ui
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: agent-web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-web-ui
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: agent-web-ui
          image: ghcr.io/onemindos/agent-web-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3300
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: onemind-user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: onemind-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agent-web-ui
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: agent-web-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-web-ui
  ports:
    - name: http
      port: 3300
      targetPort: http
