apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heynats
  namespace: nats-tools
  annotations:
    tailscale.com/hostname: heynats
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: heynats
      port:
        number: 5000
  tls:
    - hosts:
        - heynats
