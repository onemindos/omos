apiVersion: apps/v1
kind: Deployment
metadata:
  name: heynats
  namespace: nats
  labels:
    app.kubernetes.io/name: heynats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heynats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heynats
    spec:
      imagePullSecrets:
        - name: ghcr
      volumes:
        - name: nats-ca
          secret:
            secretName: nats-ca
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: heynats
          image: ghcr.io/onemindos/heynats:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            # The bus requires TLS with the private NATS CA. Go reads trusted roots from
            # SSL_CERT_FILE, so point it at the NATS CA; without this HeyNATS fails with
            # "x509: certificate signed by unknown authority".
            - name: SSL_CERT_FILE
              value: /etc/nats-ca/ca.crt
          volumeMounts:
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: heynats
  namespace: nats
  labels:
    app.kubernetes.io/name: heynats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heynats
  ports:
    - name: http
      port: 5000
      targetPort: http
