apiVersion: apps/v1
kind: Deployment
metadata:
  name: heynats
  namespace: nats
  labels:
    app.kubernetes.io/name: heynats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heynats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heynats
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: heynats
          image: ghcr.io/onemindos/heynats:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: heynats
  namespace: nats
  labels:
    app.kubernetes.io/name: heynats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heynats
  ports:
    - name: http
      port: 5000
      targetPort: http
