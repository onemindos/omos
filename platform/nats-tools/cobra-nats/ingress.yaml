apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cobra-nats
  namespace: nats-tools
  annotations:
    tailscale.com/hostname: cobra-nats
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: cobra-nats
      port:
        number: 3000
  tls:
    - hosts:
        - cobra-nats
