apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobra-nats
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: cobra-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cobra-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cobra-nats
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: cobra-nats
          image: ghcr.io/onemindos/cobra-nats:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cobra-nats
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: cobra-nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cobra-nats
  ports:
    - name: http
      port: 3000
      targetPort: http
