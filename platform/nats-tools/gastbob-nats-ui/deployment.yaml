apiVersion: apps/v1
kind: Deployment
metadata:
  name: gastbob-nats-ui
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: gastbob-nats-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gastbob-nats-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gastbob-nats-ui
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: gastbob-nats-ui
          image: ghcr.io/onemindos/gastbob-nats-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gastbob-nats-ui
  namespace: nats-tools
  labels:
    app.kubernetes.io/name: gastbob-nats-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gastbob-nats-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
