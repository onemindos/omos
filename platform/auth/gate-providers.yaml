# Authentik proxy providers for the gate outpost. One outpost ("gate-outpost", type proxy, one token) fronts several tailnet apps.
# It runs as a small replica in each gated app's namespace (a Tailscale Ingress backend must be a Service in the Ingress's own
# namespace; the operator refuses ExternalName). Example: platform/kube/headlamp/gate-outpost.yaml. Each app has:
#   - a proxy provider (mode proxy): external https://<host>.tail717ba0.ts.net, internal = the app's in-cluster Service
#   - an application bound to the group "authentik Admins" only
# The outpost routes by Host header. To gate another app: add a row to APPS, add the replica to the app's namespace, allow it in
# the app's NetworkPolicy, then (separate PR) point the app's tailscale Ingress backend at the replica Service, in place.
# Safe to re-run: existing objects are updated or left alone, nothing is deleted.
apiVersion: batch/v1
kind: Job
metadata:
  name: gate-authentik-providers-v1
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: bootstrap
          image: ghcr.io/onemindos/onemind-core@sha256:667f9836cda15e3aadd51c6186eb80839946a0d1c76fc26fcb367e81cbc6ff9a
          command: [python, -c]
          args:
            - |
              import os, httpx
              base = "http://platform-auth-helm-authentik-server.auth.svc.cluster.local/api/v3/"
              headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"]}
              DOMAIN = ".tail717ba0.ts.net"
              # slug, display name, tailnet host, internal URL, description
              APPS = [
                  ("gate-headlamp", "Headlamp", "kube", "http://headlamp.headlamp.svc.cluster.local:4466",
                   "Kubernetes web UI"),
                  ("gate-opencost", "OpenCost", "opencost", "http://opencost.opencost.svc.cluster.local:9090",
                   "Cluster cost UI"),
                  ("gate-stac-browser", "STAC Browser", "stac-browser", "http://stac-browser.stac.svc.cluster.local:8080",
                   "STAC catalog browser"),
                  ("gate-gatus", "Gatus", "status", "http://gatus.gatus.svc.cluster.local:8080",
                   "Status page"),
                  ("gate-hubble", "Hubble UI", "hubble", "http://hubble-ui.kube-system.svc.cluster.local:80",
                   "Cilium network flow UI"),
                  ("gate-agent-console", "Agent Console", "agent-console", "http://agent-console.agent-fabric.svc.cluster.local:3300",
                   "Agent fabric console"),
                  ("gate-agent-tap", "Agent Tap", "agent-tap", "http://agent-tap.agent-fabric.svc.cluster.local:8088",
                   "Agent fabric traffic view"),
              ]
              with httpx.Client(headers=headers, timeout=30) as client:
                  def request(method, path, body=None):
                      response = client.request(method, base + path, json=body)
                      if not response.is_success:
                          raise RuntimeError("Identity API " + method + " " + path.split("?")[0] +
                                             " failed with status " + str(response.status_code))
                      return response.json() if response.content else {}

                  flows = {f["slug"]: f["pk"] for f in request("GET", "flows/instances/?page_size=200")["results"]}
                  for slug in ("default-provider-authorization-implicit-consent", "default-provider-invalidation-flow"):
                      if slug not in flows:
                          raise RuntimeError("Flow not found: " + slug)
                  groups = request("GET", "core/groups/?name=authentik%20Admins")["results"]
                  if not groups:
                      raise RuntimeError("Group 'authentik Admins' not found")
                  admins = groups[0]["pk"]

                  provider_pks = []
                  for slug, title, host, internal, description in APPS:
                      external = "https://" + host + DOMAIN
                      name = "Gate " + title
                      providers = request("GET", "providers/proxy/?page_size=200")["results"]
                      provider = next((p for p in providers if p["name"] == name), None)
                      body = {
                          "name": name,
                          "authorization_flow": flows["default-provider-authorization-implicit-consent"],
                          "invalidation_flow": flows["default-provider-invalidation-flow"],
                          "mode": "proxy",
                          "external_host": external,
                          "internal_host": internal,
                          "internal_host_ssl_validation": True,
                          "access_token_validity": "hours=8",
                      }
                      if provider:
                          provider = request("PATCH", "providers/proxy/" + str(provider["pk"]) + "/", body)
                          print("Updated proxy provider " + name)
                      else:
                          provider = request("POST", "providers/proxy/", body)
                          print("Created proxy provider " + name)
                      provider_pks.append(provider["pk"])

                      apps = request("GET", "core/applications/?page_size=200")["results"]
                      app = next((a for a in apps if a["slug"] == slug), None)
                      if not app:
                          app = request("POST", "core/applications/", {
                              "name": title + " (gate)", "slug": slug, "provider": provider["pk"],
                              "policy_engine_mode": "any", "meta_launch_url": external,
                              "meta_description": description,
                          })
                          print("Created application " + slug)
                      bindings = request("GET", "policies/bindings/?target=" + app["pk"])["results"]
                      if not any(b.get("group") == admins for b in bindings):
                          request("POST", "policies/bindings/", {
                              "target": app["pk"], "group": admins,
                              "order": 0, "enabled": True, "negate": False, "timeout": 30,
                          })
                          print("Bound " + slug + " to authentik Admins")

                  outposts = request("GET", "outposts/instances/?page_size=200")["results"]
                  outpost = next((o for o in outposts if o["name"] == "gate-outpost"), None)
                  if outpost:
                      wanted = sorted(set(outpost["providers"]) | set(provider_pks))
                      if wanted != sorted(outpost["providers"]):
                          request("PATCH", "outposts/instances/" + outpost["pk"] + "/", {"providers": wanted})
                          print("Updated providers of outpost gate-outpost")
                      else:
                          print("Outpost gate-outpost already has these providers")
                  else:
                      request("POST", "outposts/instances/", {
                          "name": "gate-outpost",
                          "type": "proxy",
                          "providers": provider_pks,
                          "config": {"authentik_host": "https://auth.onemindos.dev/",
                                     "authentik_host_browser": "https://auth.onemindos.dev/",
                                     "log_level": "info"},
                      })
                      print("Created outpost gate-outpost")
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
