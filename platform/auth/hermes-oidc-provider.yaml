# Authentik OAuth2/OpenID provider for the built-in Hermes dashboard login (self_hosted dashboard-auth plugin:
# authorization code + PKCE, public client, no secret). One client serves both Hermes UIs (dashboard and web app);
# each uses its own /auth/callback. Access is limited here, in Authentik, to the "authentik Admins" group:
# Hermes does not check groups itself. Issuer for Hermes: https://auth.onemindos.dev/application/o/hermes/
# Nothing changes in Hermes until its env is set (separate held PR) and the pod is restarted by the owner.
# Safe to re-run: existing objects are updated or left alone, nothing is deleted.
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-authentik-oidc-v1
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: ghcr.io/onemindos/onemind-core@sha256:667f9836cda15e3aadd51c6186eb80839946a0d1c76fc26fcb367e81cbc6ff9a
          command: [python, -c]
          args:
            - |
              import os, httpx

              base = "http://platform-auth-helm-authentik-server.auth.svc.cluster.local/api/v3/"
              slug = "hermes"
              client_id = "onemind-hermes"
              hosts = ["https://onemind-hermes.tail717ba0.ts.net", "https://onemind-hermes-web.tail717ba0.ts.net"]
              headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"]}
              with httpx.Client(headers=headers, timeout=30) as client:
                  def request(method, path, body=None, missing_ok=False):
                      response = client.request(method, base + path, json=body)
                      if missing_ok and response.status_code == 404:
                          return None
                      if not response.is_success:
                          raise RuntimeError("Identity API " + method + " " + path.split("?")[0]
                                             + " failed with status " + str(response.status_code))
                      return response.json() if response.content else {}

                  def listed(path):
                      page = request("GET", path + ("&" if "?" in path else "?") + "page_size=200")
                      if page.get("pagination", {}).get("next"):
                          raise RuntimeError("Identity inventory exceeds one page; refusing partial reconciliation")
                      return page["results"]

                  groups = listed("core/groups/?name=authentik%20Admins")
                  if len(groups) != 1:
                      raise RuntimeError("Group 'authentik Admins' not found")
                  admins = groups[0]["pk"]
                  providers = listed("providers/oauth2/")
                  originals = [p for p in providers if p["client_id"] == "onemind-backstage"]
                  if len(originals) != 1 or not originals[0].get("signing_key"):
                      raise RuntimeError("The established OneMind OIDC template/signing key is unavailable")
                  original = originals[0]
                  matches = [p for p in providers if p["client_id"] == client_id]
                  if len(matches) > 1:
                      raise RuntimeError("Duplicate Hermes OIDC providers require review")
                  body = {k: original[k] for k in ["authorization_flow", "invalidation_flow", "signing_key",
                                                  "property_mappings", "sub_mode", "issuer_mode", "access_token_validity"]}
                  body.update(name="OneMind Hermes", client_type="public", client_id=client_id,
                              include_claims_in_id_token=True,
                              grant_types=["authorization_code", "refresh_token"],
                              redirect_uris=[{"matching_mode": "strict", "url": h + "/auth/callback",
                                              "redirect_uri_type": "authorization"} for h in hosts])
                  provider = (request("PATCH", "providers/oauth2/" + str(matches[0]["pk"]) + "/", body)
                              if matches else request("POST", "providers/oauth2/", body))
                  existing = request("GET", "core/applications/" + slug + "/", missing_ok=True)
                  app_body = {"name": "Hermes", "slug": slug, "provider": provider["pk"],
                              "policy_engine_mode": "any", "meta_launch_url": hosts[0],
                              "meta_description": "Hermes dashboard and web app (built-in login)"}
                  app = (request("PATCH", "core/applications/" + slug + "/", app_body) if existing
                         else request("POST", "core/applications/", app_body))
                  bindings = listed("policies/bindings/?target=" + app["pk"])
                  if any(b.get("group") != admins or b.get("user") or b.get("policy") or not b["enabled"]
                         or b.get("negate", False) for b in bindings):
                      raise RuntimeError("Unexpected Hermes application bindings; refusing to widen access")
                  if not bindings:
                      request("POST", "policies/bindings/", {"target": app["pk"], "group": admins,
                                                             "enabled": True, "negate": False, "order": 0, "timeout": 30})
                  verified = listed("policies/bindings/?target=" + app["pk"])
                  if len(verified) != 1 or verified[0].get("group") != admins or not verified[0]["enabled"]:
                      raise RuntimeError("Hermes admins-group application binding was not verified")
              print("Hermes OIDC provider ready (public client, PKCE) for the authentik Admins group only")
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
