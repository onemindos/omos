# agenttap "The Stream": browser visualizer for agent protocol traffic. This image only
# contains agentweb, which renders an NDJSON stream from stdin; showing live traffic needs
# the image rebuilt with the agenttap binary (agenttap -view json | agentweb). Follow-up,
# blocked on the broken build-nats-tools.yml workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-tap
  namespace: agent-fabric
  labels:
    app.kubernetes.io/name: agent-tap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-tap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-tap
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: agent-tap
          # Same image the old nats/agenttap ran, pinned by digest.
          image: ghcr.io/onemindos/agenttap@sha256:e391204ada836cf66b3e2238c5e0f84b234e979eb9f891b5252da317b4e953c3
          command: ["./agentweb", "-addr", "0.0.0.0:8088"]
          ports:
            - name: http
              containerPort: 8088
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agent-tap
  namespace: agent-fabric
spec:
  selector:
    app.kubernetes.io/name: agent-tap
  ports:
    - name: http
      port: 8088
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-tap
  namespace: agent-fabric
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: agent-tap
      port:
        number: 8088
  tls:
    - hosts:
        - agent-tap
