worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  # map is lazy and available during the TLS handshake. A rewrite-phase `set`
  # runs only after handshake and would resolve the certificate directory empty.
  # SNI never becomes a path: all names map to this one fixed Secret mount.
  map $ssl_server_name $tls_dir {
    default /etc/hermes-paperclip-tls;
  }
  # No request, bearer, query string or response-body logs.
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 2m;
  server {
    listen 8643 ssl;
    server_name hermes-paperclip-api.hermes.svc.cluster.local;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # Variable paths reload renewed leaf material without restarting Hermes.
    ssl_certificate $tls_dir/tls.crt;
    ssl_certificate_key $tls_dir/tls.key;
    ssl_certificate_cache max=2 inactive=10m valid=1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Hermes-Session-Key $http_x_hermes_session_key;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    location = /health {
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8642;
    }
    location = /v1/capabilities {
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8642;
    }
    location = /v1/runs {
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:8642;
    }
    location ~ ^/v1/runs/[A-Za-z0-9_-]+(?:/events)?$ {
      limit_except GET { deny all; }
      proxy_pass http://127.0.0.1:8642;
    }
    location ~ ^/v1/runs/[A-Za-z0-9_-]+/stop$ {
      limit_except POST { deny all; }
      proxy_pass http://127.0.0.1:8642;
    }
    location / { return 404; }
  }
}
