apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-legacy
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
spec:
  # The hub's MAIN Hermes = Legacy. Registers on the fabric as its own
  # first-class agent: agents.prompt.hermes.zeus.legacy. The Mac runs a
  # SEPARATE Hermes (distinct identity); the fabric interconnects them — this
  # is NOT one identity with two queue-grouped bodies.
  # replicas stays 1: RWO PVC + single-holder self-modification.
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC — never two pods on one volume
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      onemind.io/agent: legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        onemind.io/agent: legacy
    spec:
      serviceAccountName: hermes-observer
      # The observer identity belongs only to Hermes, not its TLS/NATS sidecars.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      imagePullSecrets:
        - name: ghcr
      initContainers:
        - name: merge-litellm-provider
          image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          imagePullPolicy: Always
          command: ["/opt/hermes/.venv/bin/python3", "/run/config/litellm_provider_config.py", "/opt/data/config.yaml"]
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {memory: "64Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: HERMES_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-litellm
                  key: HERMES_LITELLM_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: litellm-provider-config
              mountPath: /run/config
              readOnly: true
        - name: merge-onemind-mcp
          # Same immutable image observed in the running Legacy pod during preflight.
          image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
          command: ["/opt/hermes/.venv/bin/python3", "/run/onemind-mcp/onemind_mcp_config.py", "/opt/data/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "128Mi"}
          env:
            - name: ONEMIND_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: onemind-mcp-auth
                  key: token
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: onemind-mcp-config
              mountPath: /run/onemind-mcp
              readOnly: true
        # ---- Install gateway-only deps missing from the public Nous image ----
        # nousresearch/hermes-agent:v2026.9.24 ships without nats-py, nkeys,
        # synadia-ai-agents, and synadia-ai-agent-service — all required for
        # the NATS and TAK gateway platforms. This initContainer installs them
        # into a shared emptyDir (/gateway-deps) using the system uv that ships
        # in the Nous image. The hermes container mounts the same volume and
        # sets PYTHONPATH to include it, so the packages are available at runtime
        # on every pod restart without any custom image build.
        - name: install-gateway-deps
          image: nousresearch/hermes-agent:v2026.9.24
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          command:
            - sh
            - -c
            - |
              echo "Installing NATS/TAK gateway deps into /gateway-deps..."
              uv pip install \
                --python /opt/hermes/.venv/bin/python3 \
                --target /gateway-deps \
                nats-py nkeys synadia-ai-agents synadia-ai-agent-service
              echo "Done: $(ls /gateway-deps | wc -l) packages installed"
              echo "Patching nats-platform plugin approval imports..."
              ADAPTER=/opt/data/plugins/nats-platform/adapter.py
              if [ -f "$ADAPTER" ] && grep -q "set_current_session_key," "$ADAPTER"; then
                python3 /tmp/patch_nats_platform.py && echo "nats-platform patched" || echo "patch failed"
              else
                echo "nats-platform: skipped (not found or already patched)"
              fi
          volumeMounts:
            - name: gateway-deps
              mountPath: /gateway-deps
            - name: nats-platform-patch
              mountPath: /tmp/patch_nats_platform.py
              subPath: patch.py
      containers:
        # ---- Legacy (Hermes) ----
        # Talks PLAINTEXT to the in-pod leaf on localhost:4222 — identical to the
        # Mac setup. All TLS/auth to the cluster bus lives in the sidecar, so we
        # never depend on Hermes's internal TLS/CA handling.
        # NOTE: `hermes gateway run` is CHAT-ONLY and does NOT register on NATS.
        # The NATS agent-host (hermes_nats_host.py, baked into hermes-legacy) is
        # what registers agents.prompt.hermes.zeus.legacy — see omos-core/services/agents.
        - name: hermes
          image: nousresearch/hermes-agent:v2026.9.24   # Official Nous image — pinned to v2026.9.24
          imagePullPolicy: Always
          # No custom args — s6 supervisor runs the gateway. The nats-platform
          # plugin (enabled in config.yaml, seeded by cont-init) registers
          # agents.prompt.hermes.zeus.legacy and routes prompts through Hermes's
          # full pipeline (SOUL.md persona, tools, memory).
          args: ["gateway", "run", "--replace"]
          envFrom:
            - secretRef:
                name: hermes-env          # full ~/.hermes/.env (providers, HERMES_NATS_*). See SECRETS.md
            - secretRef:
                name: hermes-dashboard-auth   # HERMES_DASHBOARD_BASIC_AUTH_USERNAME + _PASSWORD
          env:
            - name: ONEMIND_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: onemind-mcp-auth
                  key: token
            - name: NATS_URL
              value: "nats://localhost:4222"   # → the leaf sidecar (plaintext, in-pod only)
            - name: HERMES_NATS_SESSION_NAME
              value: "legacy"
            - name: PYTHONPATH
              value: "/gateway-deps"
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-litellm
                  key: HERMES_LITELLM_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: gateway-deps
              mountPath: /gateway-deps
            - name: litellm-provider-config
              mountPath: /run/config
              readOnly: true
            - name: paperclip-agent
              mountPath: /run/paperclip
              readOnly: true
            - name: cluster-observer
              mountPath: /run/cluster-observer
              readOnly: true
            - name: cluster-observer-identity
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          # 2026-10-19: 7-day observed working-set maximum ~1.44Gi; 2Gi request with 5Gi headroom.
          resources:
            requests: {cpu: "500m", memory: "2Gi"}
            limits: {cpu: "4", memory: "5Gi"}
        # HTTPS transport only. Hermes retains all API bearer authorization.
        - name: paperclip-api-tls
          image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
          command: [nginx, -c, /etc/hermes-paperclip-nginx/nginx.conf, -g, 'daemon off;']
          ports:
            - {name: paperclip-tls, containerPort: 8643}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            # Kubelet's HTTPS probe verifies the listener and native API route.
            # The separate Paperclip acceptance check verifies CA and SAN trust.
            httpGet: {scheme: HTTPS, path: /health, port: paperclip-tls}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: paperclip-tls}
            periodSeconds: 20
          volumeMounts:
            - {name: paperclip-api-nginx, mountPath: /etc/hermes-paperclip-nginx, readOnly: true}
            - {name: paperclip-api-tls, mountPath: /etc/hermes-paperclip-tls, readOnly: true}
            - {name: paperclip-api-tmp, mountPath: /tmp}
        # ---- NATS leaf sidecar ----
        # nats-server running as a leaf into the cluster ONEMIND account over TLS.
        # Exposes a local plaintext client listener on :4222 for Hermes only.
        - name: nats-leaf
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/leaf.conf"]
          ports:
            - {name: monitor, containerPort: 8222}
          volumeMounts:
            - name: leaf-conf
              mountPath: /etc/nats
              readOnly: true
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {memory: "128Mi"}
      volumes:
        - name: cluster-observer-identity
          projected:
            defaultMode: 0444
            sources:
              # Omit audience to select the API server's default audience.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        - name: cluster-observer
          configMap:
            name: hermes-cluster-observer
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: leaf-conf
          secret:
            secretName: hermes-leaf-conf   # leaf.conf w/ leaf_tak creds — out-of-band. See SECRETS.md
        - name: nats-ca
          secret:
            secretName: hermes-nats-ca      # cluster NATS CA (ca.crt)
        - name: gateway-deps
          emptyDir: {}
        - name: nats-platform-patch
          configMap:
            name: nats-platform-patch
        - name: litellm-provider-config
          configMap:
            name: hermes-litellm-provider
        - name: onemind-mcp-config
          configMap:
            name: hermes-onemind-mcp-config
        - name: paperclip-api-nginx
          configMap:
            name: hermes-paperclip-api-nginx
        - name: paperclip-api-tls
          secret:
            secretName: hermes-paperclip-api-tls
        - name: paperclip-api-tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: paperclip-agent
          secret:
            secretName: paperclip-agent
            optional: true
            # s6 drops the gateway to UID/GID 10000; root:root 0440 is unreadable.
            # This mount exists only in Hermes, never its sidecars. Avoid fsGroup,
            # which could recursively change ownership of the existing data PVC.
            defaultMode: 0444
            items:
              - {key: credentials.json, path: credentials.json}
