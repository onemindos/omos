apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Hermes writable state under /opt/data (sessions, skills cache, logs).
      # Bump if the working set grows; DO block storage is resizable.
      storage: 10Gi
  # DOKS default block-storage class.
  storageClassName: do-block-storage-retain
