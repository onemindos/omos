apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-platform-patch
  namespace: hermes
data:
  patch.py: |
    import pathlib, sys
    p = pathlib.Path("/opt/data/plugins/nats-platform/adapter.py")
    if not p.exists():
        print("adapter.py not found — skipping"); sys.exit(0)
    txt = p.read_text()
    old = (
        "        from tools.approval import (\n"
        "            register_gateway_notify,\n"
        "            unregister_gateway_notify,\n"
        "            set_current_session_key,\n"
        "            reset_current_session_key,\n"
        "        )"
    )
    new = (
        "        from tools.approval import (\n"
        "            register_gateway_notify,\n"
        "            unregister_gateway_notify,\n"
        "        )\n"
        "        from tools.approval_context import (\n"
        "            set_current_session_key,\n"
        "            reset_current_session_key,\n"
        "        )"
    )
    if old in txt:
        p.write_text(txt.replace(old, new))
        print("nats-platform adapter.py patched: tools.approval_context imports applied")
    else:
        print("nats-platform: pattern not found (already patched or different version)")
