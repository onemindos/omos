apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - cluster-observer.yaml
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - dashboard.yaml
  - egress.yaml
  - network-policy.yaml
  - paperclip-api.yaml
  - paperclip-agent.sealedsecret.yaml
  - provider-config-pre-paperclip.sealedsecret.yaml
  - provider-config-backup.sealedsecret.yaml

configMapGenerator:
  - name: hermes-cluster-observer
    files:
      - report.py=cluster_observer.py
  - name: hermes-paperclip-api-nginx
    files:
      - nginx.conf=paperclip-api-nginx.conf
  - name: hermes-litellm-provider
    files:
      - litellm_provider_config.py
  - name: hermes-onemind-mcp-config
    files:
      - onemind_mcp_config.py
# Secrets are managed by Sealed Secrets — SealedSecret YAMLs in platform/hermes/bridge/.
# Reconcile through platform-legacy; do not apply this directory by hand.
