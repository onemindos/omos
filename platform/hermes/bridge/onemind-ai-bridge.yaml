---
# onemind-ai-bridge — HTTP→NATS bridge for the CloudTAK AI plugin
#
# CloudTAK plugins run in the browser and can only make HTTP requests.
# This pod exposes a tiny HTTP API that the AI panel posts to, then relays
# the message over NATS RPC to tak-agent → Legacy AI.
#
# Endpoints:
#   POST /chat   { "message": "..." } → { "response": "..." }
#   GET  /health → 200 OK
#
# Secrets: omos-nats-creds (same as tak-agent)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: onemind-ai-bridge
  namespace: hermes
  labels:
    app.kubernetes.io/name: onemind-ai-bridge
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onemind-ai-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onemind-ai-bridge
    spec:
      containers:
        - name: bridge
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install nats-py aiohttp --quiet
              exec python3 /scripts/bridge.py
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: LEGACY_SUBJECT
              value: "agents.prompt.hermes.zeus.legacy"
            - name: PORT
              value: "8080"
            - name: TIMEOUT_SEC
              value: "30"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: script
          configMap:
            name: onemind-ai-bridge-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onemind-ai-bridge-script
  namespace: hermes
data:
  bridge.py: |
    #!/usr/bin/env python3
    """
    OneMind AI Bridge — HTTP + WebSocket ↔ NATS RPC relay.

    WebSocket /ws  { kind: "prompt", id, text, callsign }
      → streams response back as { kind: "chunk", id, text } tokens
      → closes with { kind: "done", id }
      Supports { kind: "cancel", id } to abort an in-flight request.

    POST /chat     { "message": "...", "callsign": "..." }
      → synchronous HTTP fallback (same NATS RPC path)
      → returns { "response": "..." }

    GET /health → 200 OK
    """
    import asyncio, json, logging, os, ssl
    from aiohttp import web
    import nats

    LOG = logging.getLogger("ai-bridge")
    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")

    NATS_URL       = os.getenv("NATS_URL", "nats://localhost:4222")
    NATS_USER      = os.getenv("NATS_USER", "")
    NATS_PASSWORD  = os.getenv("NATS_PASSWORD", "")
    LEGACY_SUBJECT = os.getenv("LEGACY_SUBJECT", "agents.prompt.hermes.zeus.legacy")
    PORT           = int(os.getenv("PORT", "8080"))
    TIMEOUT_SEC    = float(os.getenv("TIMEOUT_SEC", "30"))

    # Track in-flight WebSocket prompts for cancel support
    active_tasks: dict[str, asyncio.Task] = {}

    nc = None

    async def get_nc():
        global nc
        if nc is None or nc.is_closed:
            tls_ctx = ssl.create_default_context()
            tls_ctx.check_hostname = False
            tls_ctx.verify_mode = ssl.CERT_NONE
            nc = await nats.connect(
                servers=NATS_URL,
                user=NATS_USER,
                password=NATS_PASSWORD,
                tls=tls_ctx,
                connect_timeout=5,
                reconnect_time_wait=2,
            )
            LOG.info(f"NATS connected: {NATS_URL}")
        return nc

    async def nats_ask(message: str, callsign: str) -> str:
        conn = await get_nc()
        prompt = f"[CloudTAK from {callsign}]: {message}"
        inbox = conn.new_inbox()
        chunks: list[str] = []
        done = asyncio.Event()

        async def on_chunk(m):
            if not m.data:
                done.set()
                return
            try:
                d = json.loads(m.data)
                if d.get("type") == "response":
                    text = d.get("data", "")
                    if isinstance(text, dict):
                        text = text.get("text", "")
                    chunks.append(str(text))
            except Exception:
                pass

        sub = await conn.subscribe(inbox, cb=on_chunk)
        try:
            await conn.publish(LEGACY_SUBJECT, prompt.encode(), reply=inbox)
            await asyncio.wait_for(done.wait(), timeout=TIMEOUT_SEC)
        finally:
            await sub.unsubscribe()

        return "".join(chunks).strip() or "(no response from Legacy)"

    def word_chunks(text: str):
        """Split response into word-level chunks for streaming effect."""
        buf = ""
        for ch in text:
            buf += ch
            if ch in (" ", "\n") and buf.strip():
                yield buf
                buf = ""
        if buf:
            yield buf

    async def ws_prompt(ws: web.WebSocketResponse, prompt_id: str, text: str, callsign: str):
        conn = await get_nc()
        prompt = f"[CloudTAK from {callsign}]: {text}"
        inbox = conn.new_inbox()
        done = asyncio.Event()

        async def on_chunk(m):
            if not m.data:
                done.set()
                return
            try:
                d = json.loads(m.data)
                if d.get("type") == "response" and not ws.closed:
                    chunk_text = d.get("data", "")
                    if isinstance(chunk_text, dict):
                        chunk_text = chunk_text.get("text", "")
                    if chunk_text:
                        await ws.send_json({"kind": "chunk", "id": prompt_id, "text": str(chunk_text)})
            except Exception:
                pass

        sub = await conn.subscribe(inbox, cb=on_chunk)
        try:
            await conn.publish(LEGACY_SUBJECT, prompt.encode(), reply=inbox)
            await asyncio.wait_for(done.wait(), timeout=TIMEOUT_SEC)
            if not ws.closed:
                await ws.send_json({"kind": "done", "id": prompt_id})
        except asyncio.TimeoutError:
            if not ws.closed:
                await ws.send_json({"kind": "done", "id": prompt_id, "text": "\n[Legacy timed out]"})
        except asyncio.CancelledError:
            if not ws.closed:
                await ws.send_json({"kind": "done", "id": prompt_id})
        except Exception as e:
            LOG.error(f"ws prompt error: {e}")
            if not ws.closed:
                await ws.send_json({"kind": "error", "id": prompt_id, "message": str(e)})
        finally:
            await sub.unsubscribe()
            active_tasks.pop(prompt_id, None)

    async def handle_ws(request: web.Request) -> web.WebSocketResponse:
        ws = web.WebSocketResponse()
        await ws.prepare(request)
        LOG.info("WebSocket client connected")

        async for msg in ws:
            if msg.type == web.WSMsgType.TEXT:
                try:
                    data = json.loads(msg.data)
                except Exception:
                    continue

                kind = data.get("kind")
                if kind == "prompt":
                    prompt_id = data.get("id", "unknown")
                    text      = data.get("text", "").strip()
                    callsign  = data.get("callsign", "Operator")
                    if text:
                        task = asyncio.create_task(ws_prompt(ws, prompt_id, text, callsign))
                        active_tasks[prompt_id] = task
                elif kind == "cancel":
                    prompt_id = data.get("id")
                    task = active_tasks.pop(prompt_id, None)
                    if task:
                        task.cancel()
            elif msg.type in (web.WSMsgType.ERROR, web.WSMsgType.CLOSE):
                break

        LOG.info("WebSocket client disconnected")
        return ws

    async def handle_chat(request: web.Request) -> web.Response:
        try:
            body = await request.json()
        except Exception:
            return web.json_response({"error": "invalid JSON"}, status=400)

        message  = body.get("message", "").strip()
        callsign = body.get("callsign", "Operator")
        if not message:
            return web.json_response({"error": "message required"}, status=400)

        try:
            response = await nats_ask(message, callsign)
            LOG.info(f"http chat: {callsign}: {message[:60]} → {response[:60]}")
            return web.json_response({"response": response})
        except nats.errors.NoRespondersError:
            return web.json_response(
                {"response": "Legacy is not available — tak-agent may be offline."},
                status=503,
            )
        except asyncio.TimeoutError:
            return web.json_response({"response": "Legacy timed out. Try again."}, status=504)
        except Exception as e:
            LOG.error(f"bridge error: {e}")
            return web.json_response({"error": str(e)}, status=500)

    async def handle_health(request: web.Request) -> web.Response:
        try:
            conn = await get_nc()
            return web.json_response({"status": "ok", "nats": not conn.is_closed})
        except Exception as e:
            return web.json_response({"status": "error", "detail": str(e)}, status=503)

    async def main():
        await get_nc()
        app = web.Application()
        app.router.add_get("/ws",      handle_ws)
        app.router.add_post("/chat",   handle_chat)
        app.router.add_get("/health",  handle_health)
        runner = web.AppRunner(app)
        await runner.setup()
        site = web.TCPSite(runner, "0.0.0.0", PORT)
        await site.start()
        LOG.info(f"OneMind AI Bridge listening on :{PORT}")
        await asyncio.Event().wait()

    asyncio.run(main())
---
apiVersion: v1
kind: Service
metadata:
  name: onemind-ai-bridge
  namespace: hermes
spec:
  selector:
    app.kubernetes.io/name: onemind-ai-bridge
  ports:
    - port: 8080
      targetPort: 8080
