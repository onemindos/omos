apiVersion: v1
kind: Service
metadata:
  name: onemind-hermes
  namespace: hermes
spec:
  selector:
    app.kubernetes.io/name: onemind-hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onemind-hermes
  namespace: hermes
  annotations:
    tailscale.com/hostname: onemind-hermes
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: onemind-hermes
      port:
        number: 9119
  tls:
    - hosts:
        - onemind-hermes
