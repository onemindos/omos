apiVersion: v1
kind: Service
metadata:
  name: onemind-hermes
  namespace: hermes
spec:
  selector:
    app.kubernetes.io/name: onemind-hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
    - name: webapp
      port: 9120
      targetPort: webapp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onemind-hermes
  namespace: hermes
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: onemind-hermes
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: onemind-hermes
      port:
        number: 9119
  tls:
    - hosts:
        - onemind-hermes
---
# The Webapp (Hermes Desktop in a browser tab): tailnet only, own hostname. Sign-in is the dashboard login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onemind-hermes-web
  namespace: hermes
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: onemind-hermes-web
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: onemind-hermes
      port:
        number: 9120
  tls:
    - hosts:
        - onemind-hermes-web
