apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onemind-hermes-data
  namespace: hermes
  labels:
    app.kubernetes.io/name: onemind-hermes
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 25Gi
