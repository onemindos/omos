  # Destructive and physical tools (gateway /execute route, gated by execute-gate: the owner types `execute <id>` or
  # `override <id>` in the Matrix room `approvals`). HELD: mcp/apply.sh skips it until run with `--include execute`,
  # after the live verification in docs/operations/tool-gateway.md ("Execute gate"). trust: untrusted makes Hermes ask
  # first for every tool that is not readOnly (gateway tools carry no hints, so every call asks).
  execute:
    url: http://agentgateway.tool-gateway.svc.cluster.local:8080/execute/mcp
    headers:
      Authorization: Bearer ${ONEMIND_GATEWAY_KEY}
    trust: untrusted
    lazy: true
