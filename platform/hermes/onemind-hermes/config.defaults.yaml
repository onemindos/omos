# onemind-hermes initial configuration (agent persona: Legacy, single soul).
# Copied once into the empty PVC by the init container; later edits made through
# Hermes win. No Legacy state, custom plugins, jobs or connectors.
# Every key below was checked against Hermes v0.22.5 (/opt/hermes); see README.md.
# Select/authenticate the model from the instance before using chat.
# The agent's name is Legacy. Hermes has no agent-name key: the persona is SOUL.md
# (seed/onemind-hermes/), and the id advertised on the API server's /v1/models comes
# from API_SERVER_MODEL_NAME below (a top-level scalar, bridged to the env at startup).
API_SERVER_MODEL_NAME: Legacy

model:
  provider: openai-codex
  default: gpt-6.1-sol

# Spread turns across every signed-in openai-codex credential instead of
# draining the first one (fill_first, the default) into its daily token cap.
credential_pool_strategies:
  openai-codex: least_used

# Used only when the primary route fails. Needs OLLAMA_API_KEY in the runtime
# environment, which is not provisioned yet: until it is, the fallback is skipped.
fallback_providers:
  - provider: ollama-cloud
    model: glm-5.3

agent:
  # Global suppression list, applied last and at tool granularity. Use `yuanbao`
  # (the yb_* platform tools), not `hermes-yuanbao`: that composite contains
  # terminal, file, web, skills, delegation and kanban tools and would strip them.
  disabled_toolsets:
    - computer_use
    - browser
    - discord
    - discord_admin
    - yuanbao
    - feishu_doc
    - feishu_drive
    - x_search
    - video_gen

# The terminal backend stays `local`: the pod itself is the sandbox (no
# service-account token, NetworkPolicy, no privilege escalation). Docker, SSH,
# Modal and Daytona backends are unavailable or external here.
approvals:
  mode: manual            # dangerous commands wait for a human, not the LLM judge (default: smart)
  timeout: 300
  cron_mode: deny         # scheduled jobs never run flagged commands
  single_query_mode: deny
  unattended_mode: deny   # API-server/webhook sessions never run flagged commands

security:
  redact_secrets: true
  allow_private_urls: false

skills:
  # Reviewed OneMind skills from platform/hermes/skills/, copied here after deploy
  # (see platform/hermes/skills/README.md). Read-only to Hermes; local skills win.
  external_dirs:
    - /opt/data/onemind-skills
  # Bundled skills that do not fit a headless cloud agent (reasons in skills/README.md).
  disabled:
    - apple-notes
    - apple-reminders
    - findmy
    - imessage
    - ascii-video
    - baoyu-infographic
    - manim-video
    - p5js
    - popular-web-designs
    - songwriting-and-ai-music
    - design-md
    - claude-design
    - gif-search
    - songsee
    - xurl
    - himalaya
    - obsidian
    - airtable
    - box
    - teams-meeting-pipeline
    - product-price-monitor
    - competitor-news-monitor
    - llm-wiki
    - inspecting-hermes-desktop-dom
    - computer-use

plugins:
  enabled: []

# Chat channels, moved from Legacy (same bot identities). The Telegram bot token and
# the Matrix access token are NOT here: they come from the onemind-hermes-runtime
# SealedSecret (TELEGRAM_BOT_TOKEN, MATRIX_ACCESS_TOKEN), and their presence enables
# each platform. Top-level scalars below are exported by Hermes to the matching env
# vars when the container env does not already set them (gateway/run.py
# _bridge_config_to_env). Unknown senders get nothing: the allowlists are the only
# way in, and the pairing flow is suppressed when an allowlist is set.
# Only one instance may poll a Telegram bot (a second one gets 409 Conflict), so
# Legacy has telegram and matrix disabled.
GATEWAY_ALLOW_ALL_USERS: 'false'
TELEGRAM_ALLOW_ALL_USERS: 'false'
TELEGRAM_ALLOWED_USERS: '8297858681'      # Zeus only
TELEGRAM_HOME_CHANNEL: '8297858681'       # Zeus's DM
MATRIX_ALLOW_ALL_USERS: 'false'
MATRIX_ALLOWED_USERS: '@zeus:onemindos.dev'   # Zeus only; invites from others are refused
# In-cluster Synapse Service, not the public hostname (matrix.onemindos.dev is going
# tailnet-only). NetworkPolicy egress: network.yaml. E2EE stays off, as on Legacy.
MATRIX_HOMESERVER: http://synapse.matrix.svc.cluster.local:8008
MATRIX_USER_ID: '@legacy:onemindos.dev'
# MATRIX_REQUIRE_MENTION keeps its default (true): rooms need an @-mention, DMs do not.
# OneMind tools come from the agentgateway tool gateway (platform/tool-gateway, design
# docs/architecture/onemind-tool-gateway.md): one MCP server per route, tools named
# <target>_<tool>. Each route lists only the classified read and write tools; destructive
# and physical tools are on /execute, which is not deployed, so it is not listed here.
# ONEMIND_GATEWAY_KEY comes from the onemind-gateway-client SealedSecret (deployment.yaml).
# Every route runs apiKey.mode strict: without the Authorization header it answers 401.
# Keep gateway.multiplex_profiles off: with it on, ${VAR} in headers is not filled from
# container env (Legacy's 401). Keys checked against v0.22.5 tools/mcp_tool_*.py: url,
# headers (${VAR} rendered from env), lazy, trust, timeout, connect_timeout. Unset: lazy
# (connect at start, so tool counts are known) and trust (default full).
mcp_servers:
  ops:
    url: http://agentgateway.tool-gateway.svc.cluster.local:8080/ops/mcp
    headers:
      Authorization: Bearer ${ONEMIND_GATEWAY_KEY}
  data:
    url: http://agentgateway.tool-gateway.svc.cluster.local:8080/data/mcp
    headers:
      Authorization: Bearer ${ONEMIND_GATEWAY_KEY}
  tak:
    url: http://agentgateway.tool-gateway.svc.cluster.local:8080/tak/mcp
    headers:
      Authorization: Bearer ${ONEMIND_GATEWAY_KEY}
