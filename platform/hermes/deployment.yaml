apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-legacy
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    onemind.io/agent: legacy
spec:
  # Single cloud body of Legacy — the always-on PRIMARY. The Mac Hermes is a
  # second body on the SAME agent subject (agents.prompt.legacy.zeus); NATS
  # queue-group HA routes each prompt to whichever body is alive/nearest.
  # replicas stays 1: horizontal scale of the same identity is fine for
  # answering, but self-modification must be single-holder (JetStream KV lease).
  replicas: 1
  strategy:
    type: Recreate            # RWO PVC — never two pods on one volume
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      onemind.io/agent: legacy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        onemind.io/agent: legacy
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        # ---- Legacy (Hermes) ----
        # Talks PLAINTEXT to the in-pod leaf on localhost:4222 — identical to the
        # Mac setup. All TLS/auth to the cluster bus lives in the sidecar, so we
        # never depend on Hermes's internal TLS/CA handling. The synadia_ai SDK
        # (bundled in Hermes) registers this as the `agents` micro service.
        - name: hermes
          image: ghcr.io/onemindos/hermes:legacy-v1   # DOCR was at its 5-repo cap; Hermes on ghcr (free)
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: hermes-env          # full ~/.hermes/.env (providers, HERMES_NATS_*). See SECRETS.md
          env:
            - name: NATS_URL
              value: "nats://localhost:4222"   # → the leaf sidecar (plaintext, in-pod only)
            # AWS Bedrock creds (currently reused from .env; rotate later → hermes-aws)
            # Uncomment once the rotated secret exists:
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom: { secretKeyRef: { name: hermes-aws, key: AWS_ACCESS_KEY_ID } }
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom: { secretKeyRef: { name: hermes-aws, key: AWS_SECRET_ACCESS_KEY } }
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { memory: "3Gi" }
        # ---- NATS leaf sidecar ----
        # nats-server running as a leaf into the cluster ONEMIND account over TLS.
        # Exposes a local plaintext client listener on :4222 for Hermes only.
        - name: nats-leaf
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/leaf.conf"]
          ports:
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - name: leaf-conf
              mountPath: /etc/nats
              readOnly: true
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "128Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: leaf-conf
          secret:
            secretName: hermes-leaf-conf   # leaf.conf w/ leaf_tak creds — out-of-band. See SECRETS.md
        - name: nats-ca
          secret:
            secretName: hermes-nats-ca      # cluster NATS CA (ca.crt)
