apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-fresh-data
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-fresh
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 25Gi
