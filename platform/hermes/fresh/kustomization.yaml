apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - network.yaml
  - backup.yaml
  - runtime.sealedsecret.yaml
  - backup.sealedsecret.yaml
configMapGenerator:
  - name: hermes-fresh-defaults
    files:
      - config.yaml=config.defaults.yaml
