apiVersion: v1
kind: Service
metadata:
  name: hermes-fresh
  namespace: hermes
spec:
  selector:
    app.kubernetes.io/name: hermes-fresh
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-fresh
  namespace: hermes
  annotations:
    tailscale.com/hostname: hermes-fresh
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hermes-fresh
      port:
        number: 9119
  tls:
    - hosts:
        - hermes-fresh
