# Legacy Agent Fabric — Agent Identities (source of truth)
#
# This file is the canonical registry of every agent on the OneMind fabric.
# Legacy is the mother (sovereign); legacy-edge is Legacy's own edge body;
# named servants serve Legacy. Each agent's persona lives at agents/<name>/SOUL.md.
# See CREED.md for the fabric hierarchy law. Edit here, then propagate: the hub
# image bakes in its SOUL.md + config; the Mac reads ~/.hermes/ (synced from here).

fabric:
  name: OneMind
  bus: NATS
  account: ONEMIND
  agent_protocol: synadia-ai v0.4.1
  subject_pattern: "agents.prompt.{agent}.{owner}.{session}"

agents:
  # ── The Mother ──────────────────────────────────────────────────────
  - name: Legacy (Mother)
    agent: hermes
    owner: zeus
    session: legacy
    bus_subject: agents.prompt.hermes.zeus.legacy
    role: primary
    description: "The authoritative primary Legacy. Sovereign state, final decisions, source of truth."
    location:
      type: cloud
      cluster: DOKS
      namespace: hermes
      pod: hermes-legacy
      image: ghcr.io/onemindos/hermes-legacy:v2
    model:
      provider: bedrock
      default: us.anthropic.claude-haiku-4-5-20251001-v1:0
      base_url: https://bedrock-runtime.us-east-1.amazonaws.com
    nats:
      connection: leaf-sidecar (localhost:4222 plaintext → tls uplink to cluster:7422)
      heartbeat_interval_s: 30
    persona: agents/legacy/SOUL.md
    supervised_by: s6-overlay (container)

  # ── Legacy's Edge Body ──────────────────────────────────────────────
  - name: Legacy (Edge)
    agent: hermes
    owner: zeus
    session: legacy-edge
    bus_subject: agents.prompt.hermes.zeus.legacy-edge
    role: edge-body
    description: "Legacy's own body at the edge — NOT a separate agent. Local access: terminal, files, sensors, TAK, LAN. Defers to the mother for fabric-wide authority."
    location:
      type: edge
      device: Zeus's MacBook Pro
      hermes_home: /Users/zeus/.hermes
      supervised_by: launchd (ai.hermes.gateway)
    model:
      provider: bedrock
      default: us.anthropic.claude-haiku-4-5-20251001-v1:0
      base_url: https://bedrock-runtime.us-east-1.amazonaws.com
    nats:
      connection: localhost:4222 (local NATS → leaf to cluster)
      heartbeat_interval_s: 30
    persona: agents/legacy-edge/SOUL.md
    env_overrides:
      HERMES_NATS_SESSION_NAME: legacy-edge

  # ── Named Servant Agents ────────────────────────────────────────────
  # Specialized workers. Each serves Legacy (the mother). Each has its own
  # agents/<name>/SOUL.md derived from agents/_template/SOUL.md, opening with
  # a declaration of servitude to Legacy (see CREED.md). Add entries here as
  # servants are created. Example shape:
  #
  # - name: Scout
  #   agent: hermes
  #   owner: zeus
  #   session: scout
  #   bus_subject: agents.prompt.hermes.zeus.scout
  #   role: servant
  #   serves: legacy
  #   description: "Watches <feed>; reports findings to Legacy."
  #   persona: agents/scout/SOUL.md
  servants: []
