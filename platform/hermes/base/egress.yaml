# Tailscale egress: how Hermes reaches machines on the tailnet. Each Service makes the Tailscale operator run a
# proxy (ProxyGroup "egress") to one tailnet address; Hermes connects to <name>.hermes.svc.cluster.local.
# The operator fills in spec.externalName; platform-hermes-base ignores differences in that field (ignoreDifferences).
# Access is limited twice: the tailnet policy (platform/core/policy.hujson) allows each target and port, and the
# onemind-hermes NetworkPolicy (platform/hermes/onemind-hermes/network.yaml) allows the pod to reach each proxy pod
# (labels tailscale.com/parent-resource=<Service name>) on that port only. A new Service needs both, in one PR.
# Reach each at <name>.hermes.svc.cluster.local:<port>. These are the ports the devices really offer; logins
# (SSH keys, ADB pairing, Home Assistant token) are not here.
apiVersion: v1
kind: Service
metadata:
  name: omos-mbp
  namespace: hermes
  labels:
    tailscale.com/proxy-group: egress
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    tailscale.com/tailnet-ip: 100.74.182.117   # Zeus's MacBook Pro: SSH
spec:
  type: ExternalName
  externalName: ts-omos-mbp-hgq9w.tailscale.svc.cluster.local
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
---
