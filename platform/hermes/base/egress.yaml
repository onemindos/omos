# Tailscale egress: how Hermes reaches machines on the tailnet. Each Service makes the Tailscale operator run a
# proxy (ProxyGroup "egress") to one tailnet address; Hermes connects to <name>.hermes.svc.cluster.local.
# The operator fills in spec.externalName; platform-legacy ignores differences in that field so the two never fight.
# Access is also limited by the tailnet policy (platform/core/policy.hujson): each target and port must be allowed there.
apiVersion: v1
kind: Service
metadata:
  name: omos-mbp
  namespace: hermes
  labels:
    tailscale.com/proxy-group: egress
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    tailscale.com/tailnet-ip: 100.74.182.117   # Zeus's MacBook Pro: SSH
spec:
  type: ExternalName
  externalName: ts-omos-mbp-hgq9w.tailscale.svc.cluster.local
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22
---
apiVersion: v1
