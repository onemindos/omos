  namespace: hermes
  labels:
    tailscale.com/proxy-group: egress
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    tailscale.com/tailnet-ip: 100.121.191.94   # S24 Ultra: Termux SSH
spec:
  type: ExternalName
  externalName: ts-omos-s24-44l4v.tailscale.svc.cluster.local
