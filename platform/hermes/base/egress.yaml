  namespace: hermes
  labels:
    tailscale.com/proxy-group: egress
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    tailscale.com/tailnet-ip: 100.64.25.12     # Home Assistant: REST API (box offline since about 2026-09-19)
spec:
  type: ExternalName
  externalName: ts-omos-ha-edge-rlv6k.tailscale.svc.cluster.local
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123
