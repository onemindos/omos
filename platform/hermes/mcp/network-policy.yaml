# Egress ports are destination pod ports, after Service targetPort translation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onemind-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onemind-mcp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
      podSelector:
        matchLabels:
          app.kubernetes.io/name: hermes
          onemind.io/agent: legacy
    ports:
    - protocol: TCP
      port: 8000
  # LiteLLM MCP gateway (platform/hermes/mcp/HUB.md); its egress is unrestricted.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-ai
      podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
          app.kubernetes.io/instance: litellm
    ports:
    - protocol: TCP
      port: 8000
  # Tool gateway (platform/tool-gateway), target `onemind`; replaces the LiteLLM rule in Phase 6.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tool-gateway
      podSelector:
        matchLabels:
          app.kubernetes.io/name: agentgateway-standalone
          app.kubernetes.io/instance: agentgateway
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nats
    ports:
    - protocol: TCP
      port: 8222
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: stac
      podSelector:
        matchLabels:
          app.kubernetes.io/name: stac
          app.kubernetes.io/component: api
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-ai
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ollama
    ports:
    - protocol: TCP
      port: 11434
  # Tile38 command API (adapter tile38; reads, plus SET when allow_writes).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onetak
      podSelector:
        matchLabels:
          app: tile38
    ports:
    - protocol: TCP
      port: 9851
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: opencost
    ports:
    - protocol: TCP
      port: 9003
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9093
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
          app.kubernetes.io/component: gateway
    ports:
    - protocol: TCP
      port: 8080
  # Owner-approved read-only apps (2026-10-29): Tempo and Grafana in monitoring.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: tempo
    ports:
    - protocol: TCP
      port: 3200
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - protocol: TCP
      port: 3000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-ai
      podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
          app.kubernetes.io/instance: litellm
    ports:
    - protocol: TCP
      port: 4000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: backstage
      podSelector:
        matchLabels:
          app: backstage
    ports:
    - protocol: TCP
      port: 7007
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onetak
      podSelector:
        matchLabels:
          app: onetak-media
    ports:
    - protocol: TCP
      port: 4000
  # Prepared for n8n and Karakeep (disabled until the owner seals their API keys).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: n8n
      podSelector:
        matchLabels:
          app: n8n
    ports:
    - protocol: TCP
      port: 5678
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: karakeep
      podSelector:
        matchLabels:
          app.kubernetes.io/name: karakeep
          app.kubernetes.io/component: web
    ports:
    - protocol: TCP
      port: 3000
