apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onemind-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onemind-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          # Only Legacy; the separately isolated fresh Hermes is not a client.
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
              onemind.io/agent: legacy
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
      ports:
        - protocol: TCP
          port: 8222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
