apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - auth.sealedsecret.yaml
  - registry.sealedsecret.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
configMapGenerator:
  - name: onemind-mcp-apps
    files:
      - apps.yaml
