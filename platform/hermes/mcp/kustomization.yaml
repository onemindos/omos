apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - auth.sealedsecret.yaml
  - registry.sealedsecret.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - pdb.yaml
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
configMapGenerator:
  - name: onemind-mcp-apps
    files:
      - apps.yaml
  # Public certificate of the Argo CD server (self-signed, expires 2027-07-04; renew this file when
  # argocd-secret tls.crt is regenerated), pinned by the argocd app's ca_file.
  - name: onemind-mcp-ca
    files:
      - argocd-server.pem
# Copy this directory into your GitOps repo; pin an immutable image before sync.
