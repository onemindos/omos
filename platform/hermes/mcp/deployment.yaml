apiVersion: apps/v1
kind: Deployment
metadata:
  name: onemind-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: onemind-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onemind-mcp
    spec:
      imagePullSecrets:
        - name: onemind-mcp-registry
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values: [onemind-ecosystem-cpu]
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/onemindos/onemind-mcp@sha256:80fa67bc138006bd1efc0dc849504910b4068667036d880cba9d0c71afb762cc
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ONEMIND_APPS_FILE
              value: /etc/onemind/apps.yaml
            - name: ONEMIND_ALLOWED_HOSTS
              value: onemind-mcp.hermes.svc.cluster.local:8000,onemind-mcp.hermes.svc:8000,127.0.0.1:8000
            - name: ONEMIND_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: onemind-mcp-auth
                  key: token
            - name: NATS_MONITOR_URL
              value: http://nats-0.nats-headless.nats.svc.cluster.local:8222
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
            - name: STAC_URL
              value: http://stac-api.stac.svc.cluster.local:8080
            - name: OLLAMA_URL
              value: http://onemind-cpu-model.onemind-ai.svc.cluster.local:11434
            - name: ALERTMANAGER_URL
              value: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
            - name: LOKI_URL
              value: http://loki-gateway.monitoring.svc.cluster.local
            - name: OPENCOST_URL
              value: http://opencost.opencost.svc.cluster.local:9003
            - name: MEDIAMTX_URL
              value: http://onetak-media.onetak.svc.cluster.local:4000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: apps
              mountPath: /etc/onemind
              readOnly: true
      volumes:
        - name: apps
          configMap:
            name: onemind-mcp-apps
