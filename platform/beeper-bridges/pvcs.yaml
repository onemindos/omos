apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beeper-whatsapp-data
  labels:
    app.kubernetes.io/name: beeper-whatsapp
    app.kubernetes.io/part-of: beeper-bridges
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '-1'
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
