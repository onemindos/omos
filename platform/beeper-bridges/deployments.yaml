apiVersion: apps/v1
kind: Deployment
metadata:
  name: beeper-whatsapp
  labels:
    app.kubernetes.io/name: beeper-whatsapp
    app.kubernetes.io/part-of: beeper-bridges
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beeper-whatsapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beeper-whatsapp
        app.kubernetes.io/part-of: beeper-bridges
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values: [onemind-ecosystem-cpu]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-connector
          image: ghcr.io/beeper/bridge-manager@sha256:845d44be8a9cdaa88f0ff795fdbcc29aef8831bedbb00f60ba0e108d8479c1be
          command: [/bin/bash, /opt/beeper-runtime/fetch-bridge.sh]
          env:
            - {name: BRIDGE_TYPE, value: whatsapp}
            - {name: BEEPER_DATA_DIR, value: /data}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runtime-scripts, mountPath: /opt/beeper-runtime, readOnly: true}
            - {name: artifact-lock, mountPath: /etc/beeper-artifacts, readOnly: true}
      containers:
        - name: bridge
          image: ghcr.io/beeper/bridge-manager@sha256:845d44be8a9cdaa88f0ff795fdbcc29aef8831bedbb00f60ba0e108d8479c1be
          command: [/bin/bash, /opt/beeper-runtime/run-bridge.sh]
          env:
            - {name: BRIDGE_TYPE, value: whatsapp}
            - {name: BRIDGE_NAME, value: sh-onemind-whatsapp}
            - {name: BEEPER_DATA_DIR, value: /data}
            - {name: BEEPER_RUNTIME_DIR, value: /run/beeper}
            - {name: BEEPER_TOKEN_FILE, value: /var/run/beeper-auth/MATRIX_ACCESS_TOKEN}
            - {name: BBCTL_DATA_HOME, value: /data}
            - {name: XDG_CONFIG_HOME, value: /data/config}
            - {name: XDG_CACHE_HOME, value: /data/cache}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          # These report connector process readiness, not remote-account login.
          startupProbe:
            exec:
              command: [curl, --fail, --silent, --max-time, '2', --output, /dev/null, 'http://127.0.0.1:4000/_matrix/mau/live']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [curl, --fail, --silent, --max-time, '2', --output, /dev/null, 'http://127.0.0.1:4000/_matrix/mau/ready']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [curl, --fail, --silent, --max-time, '2', --output, /dev/null, 'http://127.0.0.1:4000/_matrix/mau/live']
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runtime, mountPath: /run/beeper}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime-scripts, mountPath: /opt/beeper-runtime, readOnly: true}
            - {name: auth, mountPath: /var/run/beeper-auth, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beeper-whatsapp-data
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: runtime-scripts
          configMap:
            name: beeper-bridge-runtime
            defaultMode: 0555
        - name: artifact-lock
          configMap:
            name: beeper-bridge-artifacts
            defaultMode: 0444
        - name: auth
          secret:
            secretName: beeper-bridge-auth
            defaultMode: 0440
            items:
              - key: MATRIX_ACCESS_TOKEN
                path: MATRIX_ACCESS_TOKEN
---
