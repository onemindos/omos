              command: [curl, --fail, --silent, --max-time, '2', --output, /dev/null, 'http://127.0.0.1:4000/_matrix/mau/live']
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runtime, mountPath: /run/beeper}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime-scripts, mountPath: /opt/beeper-runtime, readOnly: true}
            - {name: auth, mountPath: /var/run/beeper-auth, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beeper-twitter-data
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: runtime-scripts
          configMap:
            name: beeper-bridge-runtime
            defaultMode: 0555
        - name: artifact-lock
          configMap:
            name: beeper-bridge-artifacts
            defaultMode: 0444
        - name: auth
          secret:
            secretName: beeper-bridge-auth
            defaultMode: 0440
            items:
              - key: MATRIX_ACCESS_TOKEN
                path: MATRIX_ACCESS_TOKEN
