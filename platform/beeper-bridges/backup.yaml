# Whole-volume snapshots include bridge SQLite databases and WAL/session state.
# These are crash-consistent backups; verify database recovery and remote login
# after an isolated restore. Temporary mover/cache claims explicitly use Delete storage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-volume-backup
  namespace: beeper-bridges
automountServiceAccountToken: false
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: beeper-whatsapp-data
  namespace: beeper-bridges
  annotations:
    onemind.dev/source-pvc: beeper-whatsapp-data
    argocd.argoproj.io/sync-wave: '3'
spec:
  sourcePVC: beeper-whatsapp-data
  paused: false
  trigger:
    schedule: 0 14 * * *
  restic:
    repository: beeper-whatsapp-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: do-block-storage
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
      yearly: 1
    moverServiceAccount: platform-volume-backup
    moverPodLabels:
      app: platform-volume-backup
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
