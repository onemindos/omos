apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onemind-core-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: onemind-core
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: onemind-core-bootstrap
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dapr-system
        - podSelector:
            matchLabels:
              app: onemind-core
      ports:
        - protocol: TCP
          port: 50002
