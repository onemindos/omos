apiVersion: v1
kind: ServiceAccount
metadata:
  name: onemind-core
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onemind-core
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: onemind-core
  template:
    metadata:
      labels:
        app: onemind-core
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: onemind-core
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: http
        dapr.io/enable-app-health-check: "true"
        dapr.io/app-health-check-path: /health
        dapr.io/sidecar-cpu-request: 100m
        dapr.io/sidecar-cpu-limit: "1"
        dapr.io/sidecar-memory-request: 256Mi
        dapr.io/sidecar-memory-limit: 1Gi
    spec:
      serviceAccountName: onemind-core
      imagePullSecrets:
        - name: ghcr
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onemind-core
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: core-runtime
          env:
            - name: NATS_CA_FILE
              value: /etc/nats-trust/ca.crt
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: nats-trust
              mountPath: /etc/nats-trust
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: nats-trust
          configMap:
            name: onemind-nats-trust
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: onemind-core
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: onemind-core
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: onemind-core
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: onemind-core
