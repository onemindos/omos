apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-assistant
  namespace: openchoreo-control-plane
  labels:
    helm.sh/chart: openchoreo-control-plane-1.3.1
    app.kubernetes.io/name: openchoreo-control-plane
    app.kubernetes.io/instance: oc-control
    app.kubernetes.io/version: v1.3.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: openchoreo
    app.kubernetes.io/component: portal-assistant
spec:
  parentRefs:
  - name: gateway-default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1alpha1/portal-assistant/chat
    timeouts:
      backendRequest: 450s
    backendRefs:
    - name: portal-assistant
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1alpha1/portal-assistant/warmup
    backendRefs:
    - name: portal-assistant
      port: 8080
