apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-opensearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
  - repoURL: https://opensearch-project.github.io/helm-charts
    chart: opensearch
    targetRevision: 3.9.0
    helm:
      releaseName: opensearch
      valueFiles:
      - $values/platform/ecosystem/values/opensearch.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: onemind-search
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
