# External Secrets Operator, an OpenChoreo prerequisite (install guide v1.3.x, step 1).
# Same chart and version as the guide: oci://ghcr.io/external-secrets/charts/external-secrets 2.0.1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: default
  sources:
  - repoURL: ghcr.io/external-secrets/charts
    chart: external-secrets
    targetRevision: 2.0.1
    helm:
      releaseName: external-secrets
      valueFiles:
      - $values/platform/ecosystem/values/external-secrets.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
