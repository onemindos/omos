apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-ollama
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  sources:
  - repoURL: https://otwld.github.io/ollama-helm/
    chart: ollama
    targetRevision: 1.86.0
    helm:
      releaseName: ollama
      valueFiles:
      - $values/platform/ecosystem/values/ollama.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: onemind-ai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
