apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-litellm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: 1.104.2
    helm:
      releaseName: litellm
      valueFiles:
      - $values/platform/ecosystem/values/litellm.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: onemind-ai
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
