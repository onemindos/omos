# OpenCost UI — opencost.tail717ba0.ts.net (tailnet only, same pattern as Headlamp and Grafana).
# Cost per namespace and per workload, read from the in-cluster Prometheus.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencost
  namespace: opencost
  annotations:
    tailscale.com/hostname: opencost
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: opencost
      port:
        number: 9090
  tls:
    - hosts:
        - opencost
