# OpenCost UI — opencost.tail717ba0.ts.net (tailnet only, same pattern as Headlamp and Grafana).
# Behind the Authentik gate (opencost-gate-outpost.yaml, admins only). Rollback: point the backend back at Service opencost:9090, in place.
# Cost per namespace and per workload, read from the in-cluster Prometheus.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencost
  namespace: opencost
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: opencost
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gate-outpost
      port:
        number: 9000
  tls:
    - hosts:
        - opencost
