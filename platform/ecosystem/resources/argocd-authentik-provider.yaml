# Authentik side of "Argo CD signs in through Authentik directly".
# Same pattern as auth-provider-bootstrap.yaml (Authentik has no blueprints in this repo): a Sync hook that
# calls the Authentik API and is safe to run on every sync. It creates, if missing:
#   - the `groups` scope mapping (claim `groups` = the user's Authentik group names)
#   - the group `argocd-admins` (the owner `akadmin` is added) and an Argo CD access binding to it
#   - the confidential OAuth2 provider + application `argocd`, issuer https://auth.onemindos.dev/application/o/argocd/
# The client secret is ARGOCD_CLIENT_SECRET in the SealedSecret auth/onemind-platform-oidc. The same value is
# sealed for Argo CD as argocd/argocd-oidc-authentik (key client-secret), see secrets/.
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-authentik-oidc-v1
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: provider
          image: ghcr.io/onemindos/onemind-core@sha256:667f9836cda15e3aadd51c6186eb80839946a0d1c76fc26fcb367e81cbc6ff9a
          command: [python, -c]
          args:
            - |
              import os, httpx
              base = "http://platform-auth-helm-authentik-server.auth.svc.cluster.local/api/v3/"
              headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"]}
              argocd_url = "https://argocd.tail717ba0.ts.net"
              with httpx.Client(headers=headers, timeout=30) as client:
                  def request(method, path, body=None):
                      response = client.request(method, base + path, json=body)
                      if not response.is_success:
                          raise RuntimeError("Identity API failed with status " + str(response.status_code))
                      return response.json() if response.content else {}
                  providers = request("GET", "providers/oauth2/?page_size=100")["results"]
                  original = next(p for p in providers if p["client_id"] == "onemind-backstage")
                  owner = next(u["pk"] for u in request("GET", "core/users/?username=akadmin")["results"] if u["username"] == "akadmin")

                  mapping_body = {"name": "OneMind groups", "scope_name": "groups",
                                  "expression": "return {\"groups\": [group.name for group in request.user.ak_groups.all()]}"}
                  mappings = [m for m in request("GET", "propertymappings/provider/scope/?page_size=100")["results"] if m["name"] == "OneMind groups"]
                  if mappings:
                      mapping = request("PATCH", "propertymappings/provider/scope/" + mappings[0]["pk"] + "/", mapping_body)
                  else:
                      mapping = request("POST", "propertymappings/provider/scope/", mapping_body)

                  groups = [g for g in request("GET", "core/groups/?name=argocd-admins")["results"] if g["name"] == "argocd-admins"]
                  group = groups[0] if groups else request("POST", "core/groups/", {"name": "argocd-admins"})
                  request("POST", "core/groups/" + group["pk"] + "/add_user/", {"pk": owner})

                  body = {k: original[k] for k in ["authorization_flow", "invalidation_flow", "signing_key", "sub_mode", "issuer_mode", "access_token_validity"]}
                  body.update(name="OneMind Argo CD", client_type="confidential", client_id="argocd",
                      client_secret=os.environ["ARGOCD_CLIENT_SECRET"], include_claims_in_id_token=True,
                      property_mappings=sorted(set(original["property_mappings"]) | {mapping["pk"]}),
                      redirect_uris=[{"matching_mode": "strict", "url": u, "redirect_uri_type": "authorization"} for u in
                                     [argocd_url + "/auth/callback", argocd_url + "/pkce/verify", "http://localhost:8085/auth/callback"]])
                  matches = [p for p in providers if p["client_id"] == "argocd"]
                  provider = request("PATCH", "providers/oauth2/" + str(matches[0]["pk"]) + "/", body) if matches else request("POST", "providers/oauth2/", body)
                  apps = request("GET", "core/applications/?slug=argocd")["results"]
                  app_body = {"name": "Argo CD", "slug": "argocd", "provider": provider["pk"], "policy_engine_mode": "all",
                              "meta_launch_url": argocd_url}
                  app = request("PATCH", "core/applications/argocd/", app_body) if apps else request("POST", "core/applications/", app_body)
                  bindings = request("GET", "policies/bindings/?target=" + app["pk"])["results"]
                  if not any(b.get("group") == group["pk"] for b in bindings):
                      request("POST", "policies/bindings/", {"target": app["pk"], "group": group["pk"], "enabled": True, "order": 0})
                  print("Argo CD OAuth provider ready: issuer path /application/o/argocd/, admin group argocd-admins")
          envFrom:
            - secretRef:
                name: onemind-platform-oidc
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
