# n8n (namespace n8n) reaches the shared onemind-data cluster. NetworkPolicies are additive, so this adds
# the one workload without editing the postgres-ingress policy in postgres-network.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-n8n
  namespace: onemind-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: onemind-data
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: n8n
      podSelector:
        matchLabels:
          app: n8n
    ports:
    - protocol: TCP
      port: 5432
