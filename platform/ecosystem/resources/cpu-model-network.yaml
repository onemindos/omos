apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpu-model-gateway-only
  namespace: onemind-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ollama
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
    ports:
    - protocol: TCP
      port: 11434
  # OneMind MCP exposes only reviewed inventory GETs; no inference/download tools.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
      podSelector:
        matchLabels:
          app.kubernetes.io/name: onemind-mcp
    ports:
    - protocol: TCP
      port: 11434
