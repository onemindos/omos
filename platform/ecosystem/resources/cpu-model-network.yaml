apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpu-model-gateway-only
  namespace: onemind-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ollama
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: litellm
    ports:
    - protocol: TCP
      port: 11434
