# Retained recovery assets from the retired OpenSearch/OpenChoreo services.
# No application workload is restored. Preserve data and encryption material until
# a separately reviewed retirement disposes of the recovery copies.
apiVersion: v1
kind: Namespace
metadata:
  name: onemind-search
  labels:
    kubernetes.io/metadata.name: onemind-search
    onemind.io/ecosystem: cpu
    onemind.io/site: cloud
    onemind.io/layer: data
    onemind.io/lifecycle: retained-recovery
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    volsync.backube/privileged-movers: 'true'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
spec:
  finalizers:
  - kubernetes
---
apiVersion: v1
kind: Namespace
metadata:
  name: openchoreo-observability-plane
  labels:
    kubernetes.io/metadata.name: openchoreo-observability-plane
    onemind.io/layer: system
    onemind.io/lifecycle: retained-recovery
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    volsync.backube/privileged-movers: 'true'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
spec:
  finalizers:
  - kubernetes
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr
  namespace: onemind-search
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
  labels:
    onemind.io/lifecycle: retained-recovery
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr
      namespace: onemind-search
    type: kubernetes.io/dockerconfigjson
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opensearch-auth
  namespace: onemind-search
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
  labels:
    onemind.io/lifecycle: retained-recovery
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: opensearch-auth
      namespace: onemind-search
    type: Opaque
