# onemind-core, onemind-ai and velero are labelled in platform/security/shared-namespaces.yaml, because
# other Applications create them with CreateNamespace=true (see the comment there).
apiVersion: v1
kind: Namespace
metadata:
  name: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  labels:
    onemind.io/site: cloud
    onemind.io/ecosystem: cpu
    onemind.io/layer: make-sense
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# `default` is the cluster's built-in namespace. It was defined by the (now removed)
# platform-openchoreo-defaults Application, which also set openchoreo.dev/control-plane;
# only the layer label lives on. ServerSideApply manages just this label and Delete=false
# means Argo CD never deletes the namespace, even if this Application were ever removed.
apiVersion: v1
kind: Namespace
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false
  labels:
    onemind.io/layer: system
