apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfga-clients
  namespace: onemind-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfga
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [onemind-core, backstage]
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
