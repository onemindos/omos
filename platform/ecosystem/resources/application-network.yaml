apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-clients
  namespace: onemind-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [onemind-ai, onemind-core, kagent, backstage, openchoreo-control-plane, openchoreo-observability-plane]
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-tools-clients
  namespace: kagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-tools
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [kagent, onemind-core, backstage, hermes, openclaw]
      ports:
        - protocol: TCP
          port: 8084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfga-clients
  namespace: onemind-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfga
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [onemind-core, backstage]
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
