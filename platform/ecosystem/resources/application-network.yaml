apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-clients
  namespace: onemind-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [onemind-ai, onemind-core, backstage]
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
              onemind.io/agent: legacy
      ports:
        - protocol: TCP
          port: 4000
    # onemind-hermes: models and the MCP gateway (/mcp), platform/hermes/mcp/HUB.md.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: onemind-hermes
      ports:
        - protocol: TCP
          port: 4000
    # onemind-mcp: model list (read-only virtual key limited to /v1/models), platform/hermes/mcp.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: onemind-mcp
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfga-clients
  namespace: onemind-core
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfga
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [onemind-core, backstage]
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
