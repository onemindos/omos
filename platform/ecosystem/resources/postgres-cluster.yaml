apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: onemind-data
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  instances: 3
  # Rolling updates move the primary to a replica (switchover) instead of restarting it in place.
  primaryUpdateMethod: switchover
  imagePullSecrets:
  - name: ghcr
  storage:
    size: 10Gi
    storageClass: do-block-storage-retain
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 4Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    # Prefer the ecosystem pool but do not require it, so instances can run on a core node if the pool shrinks.
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: onemind.io/compute-role
            operator: In
            values:
            - ecosystem
  bootstrap:
    initdb:
      database: onemind
      owner: onemind
      secret:
        name: db-onemind
  managed:
    roles:
    - name: onemind
      ensure: present
      login: true
      superuser: false
      createdb: false
      passwordSecret:
        name: db-onemind
    - name: openfga
      ensure: present
      login: true
      superuser: false
      createdb: false
      passwordSecret:
        name: db-openfga
    - name: langfuse
      ensure: present
      login: true
      superuser: false
      createdb: false
      passwordSecret:
        name: db-langfuse
    - name: onemind_ingestion
      ensure: present
      login: true
      superuser: false
      createdb: false
      passwordSecret:
        name: db-onemind-ingestion
    - name: stac
      ensure: present
      login: true
      superuser: false
      createdb: false
      # pgstac creates its own pgstac_admin, pgstac_ingest and pgstac_read roles on first install.
      createrole: true
      # Declare the memberships pgstac granted, so the operator stops trying to revoke them (UPDATE_MEMBERSHIPS error).
      inRoles:
      - pgstac_admin
      - pgstac_ingest
      - pgstac_read
      passwordSecret:
        name: db-stac
    - name: cloudtak
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      passwordSecret:
        name: db-cloudtak
    - name: takml
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      passwordSecret:
        name: db-takml
    # Backstage portal: pluginDivisionMode is database, so it creates its own backstage_plugin_* databases.
    - name: backstage
      ensure: present
      login: true
      superuser: false
      createdb: true
      createrole: false
      passwordSecret:
        name: db-backstage
    - name: n8n
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      passwordSecret:
        name: db-n8n
    - name: thingsboard
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      passwordSecret:
        name: db-thingsboard
    # Authentik (SSO) database, moved from authentik-postgres on 2026-11-08 (bulk-pg-consolidate).
    - name: authentik
      ensure: present
      login: true
      superuser: false
      createdb: false
      createrole: false
      passwordSecret:
        name: db-authentik
  postgresql:
    shared_preload_libraries:
    - age
    # TimescaleDB 2.26.4 ships in the PG17 image; the extension is created per database where it is used.
    - timescaledb
    parameters:
      max_connections: '300'
      shared_buffers: 256MB
      # No phone-home telemetry from the TimescaleDB extension.
      timescaledb.telemetry_level: 'off'
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: onemind-backups
      # pg_upgrade resets the system ID and timeline: a new server name keeps the PG17 archive apart from the PG16 one
      # (the PG16 archive stays under cnpg/onemind-data/onemind-data for rollback and old restores).
      serverName: onemind-data-pg17
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: onemind-postgres
    major: 17
