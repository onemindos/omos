metadata:
  name: onemind-dapr-workflows
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  name: dapr_workflows
  owner: dapr_workflows
  cluster:
    name: onemind-data
  databaseReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: onemind-litellm
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  name: litellm
  owner: litellm
  cluster:
    name: onemind-data
  databaseReclaimPolicy: retain
  # LiteLLM retired 2026-11-06: drop the database. `ensure: absent` makes CNPG run DROP DATABASE;
  # deleting this CR instead would keep the database (retain policy, and the Application has prune: false).
  # A follow-up PR removes this entry once the database is confirmed gone.
  ensure: absent
---
