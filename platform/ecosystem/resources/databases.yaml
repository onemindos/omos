apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: onemind-onemind
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  name: onemind
  owner: onemind
  cluster:
    name: onemind-data
  databaseReclaimPolicy: retain
  extensions:
  - name: postgis
    ensure: present
  - name: vector
    ensure: present
  - name: age
    ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: onemind-openfga
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
