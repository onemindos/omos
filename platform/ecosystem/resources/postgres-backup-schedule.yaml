apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: onemind-data-daily
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  schedule: 0 0 6 * * *
  immediate: true
  backupOwnerReference: self
  cluster:
    name: onemind-data
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
