# Supplies defaults for containers in tailscale that omit requests or limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-resources
  namespace: tailscale
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
