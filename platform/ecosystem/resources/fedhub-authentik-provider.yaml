# Authentik side of "FedHub signs in through Authentik" (admin UI at https://fedhub.tail717ba0.ts.net).
# Same pattern as argocd-authentik-provider.yaml: a Sync hook that calls the Authentik API and is safe to run on every
# sync. For each object it looks the existing one up first and updates it; it creates only what is missing, so a
# `fedhub` provider that already exists in Authentik is adopted (matched by client_id `fedhub` or its name), not duplicated:
#   - the `groups` scope mapping "OneMind groups" (shared with Argo CD; found by name, created if missing)
#   - the group `fedhub-admins` (the owner `akadmin` is added) and an application access binding to it
#   - the confidential OAuth2 provider + application `fedhub`, issuer https://auth.onemindos.dev/application/o/fedhub/,
#     client id `fedhub`, strict redirect URI https://fedhub.tail717ba0.ts.net:9443/login/redirect (FedHub's OAuth port)
# The client secret is FEDHUB_CLIENT_SECRET in the SealedSecret auth/onemind-platform-oidc. The same value is sealed
# for FedHub as takserver/fedhub-oidc-secret (key keycloakSecret), see platform/takserver/fedhub/fedhub-oidc.sealedsecret.yaml.
# Sync-wave 3 runs it after the Argo CD job (wave 2) so the two never race to create the shared scope mapping.
#
# Lookups never rely on list filters: Authentik's `?slug=` filter on core/applications returned results for a slug that
# does not exist, which made the first version PATCH core/applications/fedhub/ and fail with 404 (BackoffLimitExceeded).
# The application is now fetched by its slug path and created on 404. Failed pods are kept (restartPolicy Never) and the
# Job is removed after a day, so `kubectl -n auth logs` still works after a failure; error messages carry the API's reply.
apiVersion: batch/v1
kind: Job
metadata:
  name: fedhub-authentik-oidc-v1
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: provider
          image: ghcr.io/onemindos/onemind-core@sha256:667f9836cda15e3aadd51c6186eb80839946a0d1c76fc26fcb367e81cbc6ff9a
          command: [python, -c]
          args:
            - |
              import os, httpx
              base = "http://platform-auth-helm-authentik-server.auth.svc.cluster.local/api/v3/"
              headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"]}
              fedhub_url = "https://fedhub.tail717ba0.ts.net"
              provider_name = "OneMind FedHub"
              with httpx.Client(headers=headers, timeout=30) as client:
                  secret = os.environ["FEDHUB_CLIENT_SECRET"]
                  def request(method, path, body=None, missing_ok=False):
                      response = client.request(method, base + path, json=body)
                      if missing_ok and response.status_code == 404:
                          return None
                      if not response.is_success:
                          raise RuntimeError("Identity API " + method + " " + path.split("?")[0] + " failed with status " +
                                             str(response.status_code) + ": " + response.text.replace(secret, "***")[:300])
                      return response.json() if response.content else {}
                  providers = request("GET", "providers/oauth2/?page_size=100")["results"]
                  original = next(p for p in providers if p["client_id"] == "onemind-backstage")
                  owner = next(u["pk"] for u in request("GET", "core/users/?username=akadmin")["results"] if u["username"] == "akadmin")

                  mapping_body = {"name": "OneMind groups", "scope_name": "groups",
                                  "expression": "return {\"groups\": [group.name for group in request.user.ak_groups.all()]}"}
                  mappings = [m for m in request("GET", "propertymappings/provider/scope/?page_size=100")["results"] if m["name"] == "OneMind groups"]
                  if mappings:
                      mapping = request("PATCH", "propertymappings/provider/scope/" + mappings[0]["pk"] + "/", mapping_body)
                      print("scope mapping 'OneMind groups': updated")
                  else:
                      mapping = request("POST", "propertymappings/provider/scope/", mapping_body)
                      print("scope mapping 'OneMind groups': created")

                  groups = [g for g in request("GET", "core/groups/?name=fedhub-admins")["results"] if g["name"] == "fedhub-admins"]
                  group = groups[0] if groups else request("POST", "core/groups/", {"name": "fedhub-admins"})
                  request("POST", "core/groups/" + group["pk"] + "/add_user/", {"pk": owner})
                  print("group 'fedhub-admins': " + ("existing" if groups else "created") + ", akadmin is a member")

                  matches = [p for p in providers if p["client_id"] == "fedhub" or p["name"] == provider_name]
                  if len(matches) > 1:
                      raise RuntimeError("More than one provider matches client id fedhub or the name " + provider_name)
                  existing = matches[0] if matches else None
                  flows = {k: (existing or original)[k] for k in ["authorization_flow", "invalidation_flow", "signing_key", "sub_mode", "issuer_mode", "access_token_validity"]}
                  body = dict(flows)
                  body.update(name=provider_name, client_type="confidential", client_id="fedhub",
                      client_secret=secret, include_claims_in_id_token=True,
                      property_mappings=sorted(set((existing or original)["property_mappings"]) | set(original["property_mappings"]) | {mapping["pk"]}),
                      redirect_uris=[{"matching_mode": "strict", "url": fedhub_url + ":9443/login/redirect", "redirect_uri_type": "authorization"}])
                  if existing:
                      provider = request("PATCH", "providers/oauth2/" + str(existing["pk"]) + "/", body)
                      print("provider 'fedhub': updated existing pk " + str(existing["pk"]) + ", no duplicate created")
                  else:
                      provider = request("POST", "providers/oauth2/", body)
                      print("provider 'fedhub': created pk " + str(provider["pk"]))

                  existing_app = request("GET", "core/applications/fedhub/", missing_ok=True)
                  app_body = {"name": "FedHub", "slug": "fedhub", "provider": provider["pk"], "policy_engine_mode": "all",
                              "meta_launch_url": fedhub_url + ":9100"}
                  if existing_app:
                      app = request("PATCH", "core/applications/fedhub/", app_body)
                  else:
                      app = request("POST", "core/applications/", app_body)
                  print("application 'fedhub': " + ("updated" if existing_app else "created"))
                  bindings = [b for b in request("GET", "policies/bindings/?page_size=200&target=" + app["pk"])["results"]
                              if b.get("target") == app["pk"]]
                  if any(b.get("group") == group["pk"] for b in bindings):
                      print("access binding fedhub-admins -> application fedhub: already present")
                  else:
                      request("POST", "policies/bindings/", {"target": app["pk"], "group": group["pk"], "enabled": True, "order": 0})
                      print("access binding fedhub-admins -> application fedhub: created")
                  print("FedHub OAuth provider ready: issuer path /application/o/fedhub/, client id fedhub, admin group fedhub-admins")
          envFrom:
            - secretRef:
                name: onemind-platform-oidc
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
