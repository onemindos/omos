apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: onemind-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: onemind-data
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-data
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-core
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-ai
    ports:
    - protocol: TCP
      port: 5432
  # CNPG instance managers also need peer status/failsafe access during recovery.
  # A podSelector without a namespaceSelector is confined to this namespace.
  - from:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: onemind-data
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9187
