apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: onemind-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: onemind-data
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-data
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-core
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: onemind-ai
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kagent
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9187
