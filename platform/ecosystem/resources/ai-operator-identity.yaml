# Read-only identity for AI operators (Claude Code, Codex) to reach the OpenChoreo MCP
# server (PLATFORM-ROADMAP.md, phase 2g).
#
# An Authentik service account `ai-operator` is allowed on the `onemind-openchoreo`
# application. Its app password is stored in the Secret auth/ai-operator-openchoreo (never
# in Git) and read once on the admin Mac by scripts/ai-operator/setup.sh. A token is minted
# from it per session with grant_type=client_credentials against the same provider, so its
# audience matches the OpenChoreo API (`onemind-openchoreo`).
# What the identity may do in OpenChoreo is decided by the ClusterAuthzRole
# `ai-operator-read` (platform/openchoreo/platform) and its binding.
#
# The same Job also prepares the built-in OpenChoreo console (phase 2f): a second service
# account `backstage-catalog` for its catalog sync, the Secret openchoreo-control-plane/
# backstage-secrets the console chart reads, and the grant types the provider needs for
# browser login. Secrets are generated here and never enter Git.
#
# Idempotent: re-running keeps the same accounts, tokens and Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator-identity
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-operator-identity
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ai-operator-openchoreo]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-operator-identity
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-operator-identity
subjects:
  - kind: ServiceAccount
    name: ai-operator-identity
    namespace: auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-operator-identity
  namespace: openchoreo-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [backstage-secrets]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-operator-identity
  namespace: openchoreo-control-plane
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-operator-identity
subjects:
  - kind: ServiceAccount
    name: ai-operator-identity
    namespace: auth
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-operator-identity-v1
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    # Keep the finished Job so its log (token claims, lifetime) stays readable; the next
    # sync replaces it. The log never contains the password or a token.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: ai-operator-identity
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: identity
          image: ghcr.io/onemindos/onemind-core@sha256:667f9836cda15e3aadd51c6186eb80839946a0d1c76fc26fcb367e81cbc6ff9a
          command: [python, -c]
          args:
            - |
              import base64, json, os, secrets, httpx
              APP = "onemind-openchoreo"
              base = "http://platform-auth-helm-authentik-server.auth.svc.cluster.local"
              api = base + "/api/v3/"
              headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"]}
              GRANTS = ["authorization_code", "refresh_token", "client_credentials"]
              CONSOLE_NS = "openchoreo-control-plane"

              def ak(client, method, path, body=None, ok=(200, 201, 204)):
                  r = client.request(method, api + path, json=body)
                  if r.status_code not in ok:
                      raise RuntimeError("Identity API " + method + " " + path.split("?")[0] + " failed with status " + str(r.status_code))
                  return r.json() if r.content else {}

              def ensure_account(c, app, username, display, token_id, description, order):
                  users = ak(c, "GET", "core/users/?username=" + username)["results"]
                  user = users[0] if users else ak(c, "POST", "core/users/", {
                      "username": username, "name": display, "type": "service_account",
                      "path": "goauthentik.io/service-accounts", "is_active": True})
                  bindings = ak(c, "GET", "policies/bindings/?target=" + app["pk"])["results"]
                  if not any(b.get("user") == user["pk"] for b in bindings):
                      ak(c, "POST", "policies/bindings/", {"target": app["pk"], "user": user["pk"], "enabled": True, "order": order})
                  if not ak(c, "GET", "core/tokens/?identifier=" + token_id)["results"]:
                      ak(c, "POST", "core/tokens/", {"identifier": token_id, "intent": "app_password", "user": user["pk"],
                                                     "expiring": False, "description": description})
                  return ak(c, "GET", "core/tokens/" + token_id + "/view_key/")["key"]

              with httpx.Client(headers=headers, timeout=30) as c:
                  # The token endpoint only accepts grant types the provider lists. Keep what is there and
                  # add what OpenChoreo needs: browser login (authorization_code, refresh_token) and the
                  # service accounts (client_credentials).
                  provider = ak(c, "GET", "providers/oauth2/?client_id=" + APP)["results"][0]
                  grants = provider.get("grant_types") or []
                  print("provider grant_types: " + json.dumps(grants))
                  wanted = grants + [g for g in GRANTS if g not in grants]
                  if wanted != grants:
                      ak(c, "PATCH", "providers/oauth2/" + str(provider["pk"]) + "/", {"grant_types": wanted})
                      print("provider grant_types now: " + json.dumps(wanted))
                  apps = ak(c, "GET", "core/applications/?slug=" + APP)["results"]
                  if not apps:
                      raise RuntimeError("application " + APP + " not found")
                  app = apps[0]
                  ai_password = ensure_account(c, app, "ai-operator", "AI operator (read-only)",
                                               "ai-operator-openchoreo", "AI operator, OpenChoreo MCP (read-only)", 1)
                  cat_password = ensure_account(c, app, "backstage-catalog", "OpenChoreo console catalog sync",
                                                "backstage-catalog-openchoreo", "OpenChoreo console catalog sync (read-only)", 2)
                  provider_secret = ak(c, "GET", "providers/oauth2/" + str(provider["pk"]) + "/")["client_secret"]

              sa = "/var/run/secrets/kubernetes.io/serviceaccount/"
              kheaders = {"Authorization": "Bearer " + open(sa + "token").read()}

              def put_secret(k, ns, name, data, create_labels=None):
                  url = "https://kubernetes.default.svc/api/v1/namespaces/" + ns + "/secrets"
                  cur = k.get(url + "/" + name)
                  if cur.status_code == 404:
                      body = {"apiVersion": "v1", "kind": "Secret", "type": "Opaque", "stringData": data,
                              "metadata": {"name": name, "namespace": ns, "labels": create_labels or {}}}
                      k.post(url, json=body).raise_for_status()
                      return "created"
                  cur.raise_for_status()
                  have = {key: base64.b64decode(v).decode() for key, v in cur.json().get("data", {}).items()}
                  want = {key: val for key, val in data.items() if have.get(key) != val}
                  if not want:
                      return "current"
                  k.patch(url + "/" + name, json={"stringData": want},
                          headers={"Content-Type": "application/merge-patch+json"}).raise_for_status()
                  return "updated"

              with httpx.Client(headers=kheaders, verify=sa + "ca.crt", timeout=30) as k:
                  print("Secret auth/ai-operator-openchoreo " + put_secret(
                      k, "auth", "ai-operator-openchoreo", {"username": "ai-operator", "password": ai_password},
                      {"app.kubernetes.io/part-of": "onemind-ai-operator"}))
                  # Built-in console secrets. backend-secret is generated once and kept.
                  existing = k.get("https://kubernetes.default.svc/api/v1/namespaces/" + CONSOLE_NS + "/secrets/backstage-secrets")
                  backend = secrets.token_urlsafe(48)
                  if existing.status_code == 200:
                      backend = base64.b64decode(existing.json().get("data", {}).get("backend-secret", "")).decode() or backend
                  console = {
                      "backend-secret": backend,
                      "client-secret": provider_secret,
                      "service-client-secret": base64.b64encode(("backstage-catalog:" + cat_password).encode()).decode(),
                      "jenkins-api-key": "placeholder-not-in-use",
                  }
                  print("Secret " + CONSOLE_NS + "/backstage-secrets " + put_secret(
                      k, CONSOLE_NS, "backstage-secrets", console, {"app.kubernetes.io/part-of": "openchoreo-console"}))

              def mint(label, data):
                  # Prints only claims, never a token.
                  try:
                      r = httpx.post(base + "/application/o/token/", timeout=30, data=data)
                      if r.status_code != 200:
                          print("WARN " + label + " token request failed: status " + str(r.status_code) + " " + r.text[:200])
                          return
                      part = r.json()["access_token"].split(".")[1]
                      claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
                      keep = ["sub", "aud", "client_id", "azp", "preferred_username", "groups"]
                      print(label + " TOKEN_CLAIMS " + json.dumps({key: claims.get(key) for key in keep}))
                      print(label + " TOKEN_LIFETIME_SECONDS " + str(claims["exp"] - claims["iat"]))
                  except Exception as e:
                      print("WARN " + label + " token check failed: " + type(e).__name__)

              scope = "openid profile email"
              mint("ai-operator", {"grant_type": "client_credentials", "client_id": APP, "username": "ai-operator",
                                   "password": ai_password, "scope": scope})
              mint("backstage-catalog(user+password)", {"grant_type": "client_credentials", "client_id": APP,
                                                        "username": "backstage-catalog", "password": cat_password, "scope": scope})
              # The console sends client_id + client_secret; Authentik accepts base64("user:token") as the secret.
              mint("backstage-catalog(client_secret)", {"grant_type": "client_credentials", "client_id": APP,
                                                        "client_secret": console["service-client-secret"], "scope": scope})
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: AUTHENTIK_BOOTSTRAP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
