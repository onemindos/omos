backstage:
  enabled: false
security:
  enabled: true
  oidc:
    issuer: https://onemind-auth.tail717ba0.ts.net/application/o/onemind-openchoreo/
    wellKnownEndpoint: https://onemind-auth.tail717ba0.ts.net/application/o/onemind-openchoreo/.well-known/openid-configuration
    jwksUrl: http://platform-auth-helm-authentik-server.auth.svc.cluster.local/application/o/onemind-openchoreo/jwks/
    authorizationUrl: https://onemind-auth.tail717ba0.ts.net/application/o/authorize/
    tokenUrl: https://onemind-auth.tail717ba0.ts.net/application/o/token/
    externalClients:
    - name: OneMind
      client_id: onemind-openchoreo
      scopes:
      - openid
      - profile
      - email
  jwt:
    audience: onemind-openchoreo
  authz:
    enabled: true
controllerManager:
  nodeSelector: &id001
    onemind.io/compute-role: ecosystem
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: '2'
      memory: 1Gi
openchoreoApi:
  nodeSelector: *id001
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: '2'
      memory: 1Gi
  config:
    server:
      # Advertised in the OAuth protected-resource metadata and links; was the chart's
      # placeholder api.openchoreo.invalid.
      publicUrl: http://onemind-openchoreo-api.tail717ba0.ts.net
    security:
      subjects:
        user:
          mechanisms:
            jwt:
              readable_id_claim: sub
              entitlement:
                claim: sub
                display_name: Registered operator
  http:
    hostnames:
    - onemind-openchoreo-api.tail717ba0.ts.net
clusterGateway:
  nodeSelector: *id001
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: '2'
      memory: 1Gi
gateway:
  gatewayClassName: onemind-private
  # The Cilium gateway Service is a Tailscale LoadBalancer. This annotation (propagated
  # from the Gateway to its Service) names the tailnet device after the API hostname, so
  # onemind-openchoreo-api.tail717ba0.ts.net resolves on the tailnet and matches the HTTPRoute.
  infrastructure:
    annotations:
      tailscale.com/hostname: onemind-openchoreo-api
  tls:
    enabled: false
    hostname: onemind-openchoreo-api.tail717ba0.ts.net
eventForwarder:
  nodeSelector: *id001
  config:
    webhooks:
      endpoints:
      - url: http://backstage.backstage.svc.cluster.local:7007/api/events/http/openchoreo
portalAssistant:
  enabled: true
  http:
    enabled: false
  nodeSelector: *id001
  llm:
    secretName: openchoreo-assistant
    modelName: openai:onemind-chat
    baseUrl: http://litellm.onemind-ai.svc.cluster.local:4000/v1
  config:
    observerApiUrl: http://observer.openchoreo-observability-plane.svc.cluster.local:8080
  cors:
    allowedOrigins:
    - https://onemind-preview.tail717ba0.ts.net
    - https://homepage.tail717ba0.ts.net
