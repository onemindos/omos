fullnameOverride: onemind-cpu-model
image:
  tag: 0.40.1
ollama:
  gpu:
    enabled: false
  models:
    pull:
    # bge-m3: multilingual (100+ languages), 8192-token context, 1024-dim, ~1.2 GB.
    # qwen3:1.7b: Q4_K_M, ~1.4 GB; cheap tasks and offline fallback.
    # Pulling is additive: removing a name here does NOT delete it from the PVC.
    - bge-m3
    - qwen3:1.7b
persistentVolume:
  enabled: true
  storageClass: do-block-storage-retain
  size: 20Gi
resources:
  # Sized to the loaded model, one at a time (OLLAMA_MAX_LOADED_MODELS=1):
  # qwen3:1.7b ~1.4 GB weights + ~0.5 GB KV cache (q8_0, 8k ctx) + runtime ~0.2 GB.
  # bge-m3 ~1.2 GB weights + activations. Request is the steady-state reservation;
  # the limit leaves headroom for page cache of the mmapped weights during a model swap.
  requests:
    cpu: 250m
    memory: 1536Mi
  limits:
    cpu: '6'
    memory: 3Gi
nodeSelector:
  onemind.io/compute-role: ecosystem
extraEnv:
- name: OLLAMA_NUM_PARALLEL
  value: '1'
- name: OLLAMA_CONTEXT_LENGTH
  value: '8192'
- name: OLLAMA_KEEP_ALIVE
  value: 5m
- name: OLLAMA_MAX_LOADED_MODELS
  value: '1'
- name: OLLAMA_FLASH_ATTENTION
  value: '1'
- name: OLLAMA_KV_CACHE_TYPE
  value: q8_0
