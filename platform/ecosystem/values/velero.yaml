podAnnotations:
  onemind.dev/backup-credential-revision: '20261009'
nodeSelector:
  onemind.io/compute-role: ecosystem
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 1Gi
credentials:
  useSecret: true
  existingSecret: velero-credentials
initContainers:
- name: velero-plugin-for-aws
  image: velero/velero-plugin-for-aws:v1.14.4
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
  volumeMounts:
  - mountPath: /target
    name: plugins
snapshotsEnabled: false
# Off: nothing uses file-system backup (defaultVolumesToFsBackup false, snapshotVolumes false), so the node-agent DaemonSet
# only costs memory on every node. Turn it back on (true) for a migration or volume-restore test.
deployNodeAgent: false
nodeAgent:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 256Mi}
configuration:
  backupStorageLocation:
  - name: default
    provider: aws
    bucket: onemind-backups
    prefix: velero/cloud
    default: true
    config:
      region: nyc3
      s3ForcePathStyle: 'true'
      s3Url: https://nyc3.digitaloceanspaces.com
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: false
  features: EnableCSI
schedules:
  onemind-platform:
    schedule: 0 6 * * *
    template:
      ttl: 720h
      # Kubernetes objects of every app namespace (no volume data). New namespaces are included automatically.
      excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - default
      - velero
      snapshotVolumes: false
      defaultVolumesToFsBackup: false
