global:
  ha:
    enabled: false
  mtls:
    enabled: true
dapr_operator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
  affinity: &id001
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: doks.digitalocean.com/node-pool
            operator: In
            values: [onemind-ecosystem-cpu]
dapr_placement:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 1Gi
  affinity: *id001
dapr_scheduler:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
  cluster:
    storageSize: 5Gi
    storageClassName: do-block-storage-retain
dapr_sentry:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 1Gi
  affinity: *id001
dapr_sidecar_injector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 1Gi
  affinity: *id001
