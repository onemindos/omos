replicaCount: 1
fullnameOverride: openfga
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: doks.digitalocean.com/node-pool
          operator: In
          values:
          - onemind-ecosystem-cpu
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 1Gi
postgresql:
  enabled: false
datastore:
  engine: postgres
  uriSecret: openfga-db
  migrationType: initContainer
authn:
  method: preshared
  preshared:
    keysSecret: openfga-auth
playground:
  enabled: false
