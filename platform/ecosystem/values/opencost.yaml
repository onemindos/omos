nodeSelector:
  onemind.io/compute-role: ecosystem
opencost:
  exporter:
    defaultClusterId: onemind-cloud
    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        cpu: '1'
        memory: 1Gi
  ui:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  prometheus:
    internal:
      enabled: false
    external:
      enabled: true
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  metrics:
    # kube-state-metrics already owns these series; do not emit duplicates.
    kubeStateMetrics:
      emitKsmV1Metrics: false
      emitKsmV1MetricsOnly: false
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  mcp:
    enabled: true
