resources:
  operator:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
  metricServer:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 1Gi
  webhooks:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 1Gi
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: doks.digitalocean.com/node-pool
          operator: In
          values:
          - onemind-ecosystem-cpu
prometheus:
  metricServer:
    enabled: true
    podMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  operator:
    enabled: true
    podMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
