replicaCount: 1
fullnameOverride: litellm
nodeSelector:
  onemind.io/compute-role: ecosystem
image:
  tag: v1.104.2@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
masterkeySecretName: litellm-auth
masterkeySecretKey: master-key
db:
  useExisting: true
  deployStandalone: false
  endpoint: onemind-data-rw.onemind-data.svc.cluster.local
  database: litellm
  secret:
    name: litellm-db
    usernameKey: username
    passwordKey: password
  url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=require
redis:
  enabled: false
environmentSecrets:
- litellm-providers
proxy_config:
  model_list:
  - model_name: onemind-chat
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: http://onemind-cpu-model.onemind-ai.svc.cluster.local:11434
      num_ctx: 8192
      extra_body:
        think: false
  - model_name: onemind-fast
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: http://onemind-cpu-model.onemind-ai.svc.cluster.local:11434
      num_ctx: 8192
      extra_body:
        think: false
  # Hermes cloud route; credentials stay in the existing litellm-providers Secret.
  - model_name: hermes-agent
    model_info:
      supports_function_calling: true
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          only: [Anthropic]
          allow_fallbacks: false
  # Local models served by ecosystem-ollama (CPU, in-cluster). Call these by name
  # from Hermes / OneMind Core through LiteLLM; do not talk to Ollama directly.
  - model_name: local-tools
    model_info:
      supports_function_calling: true
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: http://onemind-cpu-model.onemind-ai.svc.cluster.local:11434
      num_ctx: 8192
      extra_body:
        think: false
  - model_name: local-embed
    model_info:
      mode: embedding
    litellm_params:
      model: ollama/bge-m3
      api_base: http://onemind-cpu-model.onemind-ai.svc.cluster.local:11434
  # MCP gateway (platform/hermes/mcp/HUB.md). Servers are declared here (GitOps), not in the
  # UI/DB. A non-admin key reaches a server only through object_permission.mcp_servers (or a
  # team/access-group grant); keep allow_all_keys false so new and existing keys get nothing
  # by default. Admin keys (master key, proxy_admin) still see every server.
  mcp_servers:
    # Server names must not contain "-" (MCP_TOOL_PREFIX_SEPARATOR); tools appear as onemind-<tool>.
    onemind:
      # Pinned so object_permission grants keep matching if url/auth fields change.
      server_id: onemind
      description: OneMind read-only cluster app adapters (services/onemind-mcp, platform/hermes/mcp)
      # Host:port must stay in onemind-mcp's ONEMIND_ALLOWED_HOSTS.
      url: http://onemind-mcp.hermes.svc.cluster.local:8000/mcp
      transport: http
      auth_type: bearer_token
      # Optional env from Secret litellm-mcp-upstreams (extraEnvVars below). Unset → no upstream
      # auth → onemind-mcp answers 401; the proxy itself keeps serving models.
      auth_value: os.environ/ONEMIND_MCP_TOKEN
      allow_all_keys: false
      available_on_public_internet: false
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    store_model_in_db: true
    # A key without its own mcp_servers list does not inherit its team's MCP servers.
    require_key_mcp_access_defined: true
  router_settings:
    fallbacks:
    - hermes-agent: [local-tools]
  litellm_settings:
    drop_params: true
    set_verbose: false
    # /metrics is only reachable in-cluster (ClusterIP); Prometheus scrapes it
    # without a key. With auth on, every scrape 401'd (TargetDown + log noise).
    require_auth_for_metrics_endpoint: false
    # /metrics is only mounted when the prometheus callback is enabled
    # (proxy_server.py: "prometheus" in success_callback -> _mount_metrics_endpoint).
    success_callback:
    - prometheus
serviceMonitor:
  enabled: true
  labels:
    release: monitoring
envVars:
  DATABASE_CONNECTION_POOL_LIMIT: '10'
# Upstream MCP credentials. optional: a missing Secret must not block proxy rollouts.
extraEnvVars:
- name: ONEMIND_MCP_TOKEN
  valueFrom:
    secretKeyRef:
      name: litellm-mcp-upstreams
      key: ONEMIND_MCP_TOKEN
      optional: true
migrationJob:
  hooks:
    helm:
      enabled: false
    # Run migrations as an Argo CD PreSync hook so the completed Job is not
    # tracked as live state (it kept the app OutOfSync and was re-created).
    argocd:
      enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
