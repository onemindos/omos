# No legacy policies exist to migrate on this initial Argo-managed installation.
# The Helm migration hook rewrites CRDs and removes Argo tracking annotations.
crds:
  migration:
    enabled: false
admissionController:
  replicas: 1
  nodeSelector: &id001
    onemind.io/compute-role: ecosystem
  container:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
backgroundController:
  replicas: 1
  nodeSelector: *id001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
cleanupController:
  replicas: 1
  nodeSelector: *id001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
reportsController:
  replicas: 1
  nodeSelector: *id001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
features:
  policyExceptions:
    enabled: false
