global:
  spire:
    clusterName: onemind-cloud
    trustDomain: onemind.local
    namespaces:
      create: false
      system:
        name: spire-system
        create: false
      server:
        name: spire-system
        create: false
spire-server:
  replicaCount: 1
  nodeSelector:
    onemind.io/compute-role: ecosystem
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  dataStore:
    sql:
      databaseType: sqlite3
  persistence:
    size: 5Gi
    storageClass: do-block-storage-retain
spire-agent:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
spiffe-oidc-discovery-provider:
  enabled: false
tornjak-frontend:
  enabled: false
spike-keeper:
  enabled: false
spike-nexus:
  enabled: false
spike-pilot:
  enabled: false
