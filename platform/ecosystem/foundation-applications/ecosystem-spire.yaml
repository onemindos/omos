apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-spire
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
    onemind.io/application-namespace: spire-system
spec:
  project: default
  sources:
  - repoURL: https://spiffe.github.io/helm-charts-hardened
    chart: spire
    targetRevision: 0.30.3
    helm:
      releaseName: spire
      valueFiles:
      - $values/platform/ecosystem/values/spire.yaml
      namespace: spire-system
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
