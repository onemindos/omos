apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-dapr
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  sources:
  - repoURL: https://dapr.github.io/helm-charts
    chart: dapr
    targetRevision: 1.18.5
    helm:
      releaseName: dapr
      valueFiles:
      - $values/platform/ecosystem/values/dapr.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dapr-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      annotations:
        volsync.backube/privileged-movers: 'true'
