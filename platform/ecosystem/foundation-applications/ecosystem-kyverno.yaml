apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    onemind.io/application-namespace: kyverno
spec:
  project: default
  sources:
  - repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      releaseName: kyverno
      valueFiles:
      - $values/platform/ecosystem/values/kyverno.yaml
      namespace: kyverno
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
