# Per-leaf NATS leafnode metrics, used by prometheus-rules-nats-leafnodes.yaml.
#
# nats-surveyor only exports an aggregate leaf count per account and server
# (nats_core_account_leaf_count); neither the deployed v0.9.11 nor v0.9.12 has a leafz
# option. prometheus-nats-exporter -leafz reads /leafz on the hub's monitor port (8222) and
# exports one gnatsd_leafz_info series per connected leaf, labelled with the server name the
# leaf presents (name="hermes-legacy-leaf", name="zeus-mac", ...).
#
# A hub server lists only the leaves connected to it, so each pod is polled by its
# nats-headless DNS name; the nats-monitor Service would answer from one random pod. The
# "nats-N," prefix becomes the server_id label. If the StatefulSet grows, add a line and
# raise the 3 in NATSLeafzHubUnreadable. The monitor port is read-only plain HTTP, so no
# credentials are involved.
---
apiVersion: v1
kind: Service
metadata:
  name: nats-leafz-exporter
  namespace: nats
  labels:
    app.kubernetes.io/name: nats-leafz-exporter
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats-leafz-exporter
    app.kubernetes.io/component: metrics
  ports:
    - name: metrics
      port: 7777
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-leafz-exporter
  namespace: nats
  labels:
    app.kubernetes.io/name: nats-leafz-exporter
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-leafz-exporter
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-leafz-exporter
        app.kubernetes.io/component: metrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: natsio/prometheus-nats-exporter:0.20.3@sha256:4b8ddc1c86fec360b5cd3d5e1fbc6fb52bdafd5805bba3901cc52926538af255
          imagePullPolicy: IfNotPresent
          args:
            - -leafz
            - -port=7777
            - -addr=0.0.0.0
            - nats-0,http://nats-0.nats-headless.nats.svc.cluster.local:8222
            - nats-1,http://nats-1.nats-headless.nats.svc.cluster.local:8222
            - nats-2,http://nats-2.nats-headless.nats.svc.cluster.local:8222
          ports:
            - name: metrics
              containerPort: 7777
          # Every /metrics request polls the three hub servers synchronously, so the probes
          # check the socket only: a slow hub server shows up as a failed scrape (and
          # NATSLeafzExporterDown), not as a restarted exporter.
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
# kube-prometheus-stack selects ServiceMonitors labelled release: monitoring.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nats-leafz-exporter
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/name: nats-leafz-exporter
spec:
  namespaceSelector:
    matchNames:
      - nats
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-leafz-exporter
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
