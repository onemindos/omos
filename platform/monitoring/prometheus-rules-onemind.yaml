apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: onemind-k8s-health
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    # ─── NATS Bus ────────────────────────────────────────────────────────────
    - name: onemind.nats
      interval: 30s
      rules:
        - alert: NATSQuorumLost
          expr: kube_statefulset_status_replicas_available{namespace="nats",statefulset="nats"} < 2
          for: 2m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "NATS quorum lost — fewer than 2/3 replicas available"
            description: "NATS HA cluster has {{ $value }} available replicas. Raft quorum may be broken. Bus operations will fail."

        - alert: NATSDown
          expr: kube_statefulset_status_replicas_available{namespace="nats",statefulset="nats"} == 0
          for: 1m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "NATS cluster is completely down"
            description: "NATS has 0 available replicas. The entire OneMind bus is dark."

        # Bus-flow alerts (surveyor metrics). Baseline 2026-10-10: COT ≈ 12.8k msgs/h,
        # no non-KV consumer has exceeded 0 pending in 7 days.
        - alert: TAKCoTFlowStopped
          expr: max(increase(nats_stream_last_seq{job="nats-surveyor",stream="COT"}[15m])) == 0
          for: 5m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "No CoT messages reached the COT stream for 20 minutes"
            description: "TAK → NatsBridgePlugin → NATS flow is broken or TAK has no traffic. Check takserver-messaging, tak-nats-leaf and the plugin."

        - alert: NATSConsumerBacklogGrowing
          expr: |
            max by (stream, consumer_name) (nats_consumer_num_pending{job="nats-surveyor", stream!~"KV_.*|OBJ_.*"}) > 1000
            and
            max by (stream, consumer_name) (delta(nats_consumer_num_pending{job="nats-surveyor", stream!~"KV_.*|OBJ_.*"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "Consumer {{ $labels.consumer_name }} on {{ $labels.stream }} is falling behind"
            description: "{{ $value }} messages pending and still growing for 30m. The service reading this stream is slow or stuck."

        - alert: NATSSurveyorDown
          expr: absent(up{job="nats-surveyor"} == 1)
          for: 10m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "NATS metrics are not being collected"
            description: "nats-surveyor is not scraped, so every bus-flow alert above is blind."

    # ─── AI Brain ────────────────────────────────────────────────────────────
    - name: onemind.hermes
      interval: 30s
      rules:
        - alert: HermesDown
          expr: kube_deployment_status_replicas_available{namespace="hermes",deployment="hermes-legacy"} == 0
          for: 2m
          labels:
            severity: warning
            service: hermes
          annotations:
            summary: "Hermes AI agent is down"
            description: "hermes-legacy deployment has no available replicas. AI brain is offline."

        - alert: OneMindMCPDown
          expr: kube_deployment_status_replicas_available{namespace="hermes",deployment="onemind-mcp"} == 0
          for: 10m
          labels:
            severity: warning
            service: hermes
          annotations:
            summary: "OneMind MCP is down"
            description: "onemind-mcp has had no available replicas for 10m. Legacy loses all its internal app tools (NATS, Prometheus, Loki and others). Runbook: docs/operations/onemind-mcp.md"

    # ─── TAK / CloudTAK ──────────────────────────────────────────────────────
    - name: onemind.cloudtak
      interval: 30s
      rules:
        - alert: CloudTAKAPIDown
          expr: kube_deployment_status_replicas_available{namespace="cloudtak",deployment="cloudtak-api"} == 0
          for: 2m
          labels:
            severity: warning
            service: cloudtak
          annotations:
            summary: "CloudTAK API is down"
            description: "cloudtak-api has no available replicas. TAK picture sharing is offline."

    # ─── Pod health (all namespaces) ─────────────────────────────────────────
    - name: onemind.pods
      interval: 60s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace=~"nats|hermes|cloudtak|orp|omos|intel|takserver|clickhouse"
            }[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} restarted {{ $value | printf \"%.0f\" }} times in the last 15 minutes."

        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              namespace=~"nats|hermes|cloudtak|orp|omos|intel|takserver|clickhouse",
              reason="OOMKilled"
            } == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} OOMKilled"
            description: "Container {{ $labels.container }} was OOMKilled. Check memory limits."

    # ─── Nodes ───────────────────────────────────────────────────────────────
    - name: onemind.nodes
      interval: 60s
      rules:
        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} has memory pressure"
            description: "DOKS node {{ $labels.node }} is under memory pressure. Pods may be evicted."

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} has disk pressure"
            description: "DOKS node {{ $labels.node }} is under disk pressure."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: "DOKS node {{ $labels.node }} has been NotReady for 2+ minutes."

    # ─── Storage ─────────────────────────────────────────────────────────────
    - name: onemind.storage
      interval: 60s
      rules:
        - alert: PVCFillingUp
          expr: |
            kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes < 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 85%+ full"
            description: "Only {{ $value | humanizePercentage }} free. ClickHouse or Hermes state volume may be at risk."
