apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: onemind-k8s-health
  namespace: monitoring
  labels:
    release: monitoring
    app: kube-prometheus-stack
spec:
  groups:
    # ─── NATS Bus ────────────────────────────────────────────────────────────
    - name: onemind.nats
      interval: 30s
      rules:
        - alert: NATSQuorumLost
          expr: kube_statefulset_status_replicas_available{namespace="nats",statefulset="nats"} < 2
          for: 2m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "NATS quorum lost — fewer than 2/3 replicas available"
            description: "NATS HA cluster has {{ $value }} available replicas. Raft quorum may be broken. Bus operations will fail."

        - alert: NATSDown
          expr: kube_statefulset_status_replicas_available{namespace="nats",statefulset="nats"} == 0
          for: 1m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "NATS cluster is completely down"
            description: "NATS has 0 available replicas. The entire OneMind bus is dark."

        # Bus-flow alerts (surveyor metrics). Baseline 2026-10-10: COT ≈ 12.8k msgs/h,
        # no non-KV consumer has exceeded 0 pending in 7 days.
        - alert: TAKCoTFlowStopped
          expr: max(increase(nats_stream_last_seq{job="nats-surveyor",stream="COT"}[15m])) == 0
          for: 5m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "No CoT messages reached the COT stream for 20 minutes"
            description: "TAK → NatsBridgePlugin → NATS flow is broken or TAK has no traffic. Check takserver-messaging, tak-nats-leaf and the plugin."

        - alert: NATSConsumerBacklogGrowing
          expr: |
            max by (stream, consumer_name) (nats_consumer_num_pending{job="nats-surveyor", stream!~"KV_.*|OBJ_.*"}) > 1000
            and
            max by (stream, consumer_name) (delta(nats_consumer_num_pending{job="nats-surveyor", stream!~"KV_.*|OBJ_.*"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "Consumer {{ $labels.consumer_name }} on {{ $labels.stream }} is falling behind"
            description: "{{ $value }} messages pending and still growing for 30m. The service reading this stream is slow or stuck."

        - alert: NATSSurveyorDown
          expr: absent(up{job="nats-surveyor"} == 1)
          for: 10m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "NATS metrics are not being collected"
            description: "nats-surveyor is not scraped, so every bus-flow alert above is blind."

        # JetStream file storage vs the server's max_file_store (45Gi on 49Gi PVCs).
        # A full store rejects every JetStream publish. Baseline 2026-10-27: 10.4% on all
        # three servers (5.04 GB of 48.3 GB).
        - alert: NATSJetStreamStorageHigh
          expr: |
            max by (server_name) (
              nats_core_jetstream_filestore_used_bytes{job="nats-surveyor"}
              / nats_core_jetstream_server_max_storage{job="nats-surveyor"}
            ) > 0.70
          for: 15m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "JetStream storage on {{ $labels.server_name }} is above 70% of max_file_store"
            description: "{{ $value | humanizePercentage }} of the JetStream file store is used. Check stream sizes (COT is the largest) and retention before it reaches 85%."

        - alert: NATSJetStreamStorageCritical
          expr: |
            max by (server_name) (
              nats_core_jetstream_filestore_used_bytes{job="nats-surveyor"}
              / nats_core_jetstream_server_max_storage{job="nats-surveyor"}
            ) > 0.85
          for: 5m
          labels:
            severity: critical
            service: nats
          annotations:
            summary: "JetStream storage on {{ $labels.server_name }} is above 85% of max_file_store"
            description: "{{ $value | humanizePercentage }} of the JetStream file store is used. At 100% the server rejects JetStream writes and the bus stops persisting messages."

        # nats_core_slow_consumer_count is the server's cumulative slow-consumer counter
        # (increase() handles resets on pod restart). Baseline 2026-10-27: 0 on all servers.
        - alert: NATSSlowConsumers
          expr: max by (server_name) (increase(nats_core_slow_consumer_count{job="nats-surveyor"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "NATS server {{ $labels.server_name }} is disconnecting slow consumers"
            description: "{{ $value | printf \"%.0f\" }} slow-consumer events in the last 10 minutes. A client cannot keep up and the server is dropping its messages or connection."

        # Full mesh of 3 servers: each server routes to its 2 peers. NATS 2.10+ opens
        # several connections per peer (route pooling), so nats_core_route_count is 8 on
        # every server when the mesh is complete (verified live 2026-10-27), not 2.
        # Losing one peer drops a server to 4. Alert below the verified baseline.
        - alert: NATSRouteCountLow
          expr: min by (server_name) (nats_core_route_count{job="nats-surveyor", server_cluster="nats"}) < 8
          for: 5m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "NATS server {{ $labels.server_name }} has {{ $value }} cluster routes (expected 8)"
            description: "The 3-node cluster mesh is incomplete: a peer is unreachable or a route is flapping. JetStream replication and Raft quorum depend on these routes."

        # CMD uses discard: old with maxBytes 512 MiB (platform/nats/streams/cmd.yaml), so a
        # full stream deletes its oldest command records. Under discard: new it would refuse to
        # store new ones, yet core subscribers still receive them (A22-P2). 429496729 = 80% of
        # 536870912. Keep this number in step with cmd.yaml. Baseline 2026-10-29: 166 bytes.
        - alert: NATSCmdStreamNearFull
          expr: max(nats_stream_total_bytes{job="nats-surveyor", stream="CMD"}) > 429496729
          for: 5m
          labels:
            severity: warning
            service: nats
          annotations:
            summary: "CMD stream is above 80% of its 512 MiB cap"
            description: >-
              CMD holds {{ $value | humanize1024 }}B. At 512 MiB it deletes the oldest command records
              (discard: old); a full stream never stops commands being delivered. Raise maxBytes in
              cmd.yaml or archive the audit trail before records older than 365 days are lost.

    # ─── AI Brain ────────────────────────────────────────────────────────────
    - name: onemind.hermes
      interval: 30s
      rules:
        - alert: HermesDown
          expr: kube_deployment_status_replicas_available{namespace="hermes",deployment="hermes-legacy"} == 0
          for: 2m
          labels:
            severity: warning
            service: hermes
          annotations:
            summary: "Hermes AI agent is down"
            description: "hermes-legacy deployment has no available replicas. AI brain is offline."

        - alert: OneMindMCPDown
          expr: kube_deployment_status_replicas_available{namespace="hermes",deployment="onemind-mcp"} == 0
          for: 10m
          labels:
            severity: warning
            service: hermes
          annotations:
            summary: "OneMind MCP is down"
            description: "onemind-mcp has had no available replicas for 10m. Legacy loses all its internal app tools (NATS, Prometheus, Loki and others). Runbook: docs/operations/onemind-mcp.md"

    # ─── TAK / CloudTAK ──────────────────────────────────────────────────────
    - name: onemind.cloudtak
      interval: 30s
      rules:
        - alert: CloudTAKAPIDown
          expr: kube_deployment_status_replicas_available{namespace="cloudtak",deployment="cloudtak-api"} == 0
          for: 2m
          labels:
            severity: warning
            service: cloudtak
          annotations:
            summary: "CloudTAK API is down"
            description: "cloudtak-api has no available replicas. TAK picture sharing is offline."

    # ─── TAK ML ──────────────────────────────────────────────────────────────
    - name: onemind.takml
      interval: 30s
      rules:
        - alert: TakmlServerDown
          expr: kube_deployment_status_replicas_available{namespace="takml",deployment="takml-server"} == 0
          for: 10m
          labels:
            severity: warning
            service: takml
          annotations:
            summary: "TAK ML server is down"
            description: "takml-server has had no available replicas for 10 minutes. TAK ML model execution is offline."

    # ─── Pod health (all namespaces) ─────────────────────────────────────────
    - name: onemind.pods
      interval: 60s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace=~"nats|hermes|cloudtak|orp|omos|intel|takserver|clickhouse|takml"
            }[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} restarted {{ $value | printf \"%.0f\" }} times in the last 15 minutes."

        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              namespace=~"nats|hermes|cloudtak|orp|omos|intel|takserver|clickhouse|takml",
              reason="OOMKilled"
            } == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} OOMKilled"
            description: "Container {{ $labels.container }} was OOMKilled. Check memory limits."

    # ─── Nodes ───────────────────────────────────────────────────────────────
    - name: onemind.nodes
      interval: 60s
      rules:
        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} has memory pressure"
            description: "DOKS node {{ $labels.node }} is under memory pressure. Pods may be evicted."

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} has disk pressure"
            description: "DOKS node {{ $labels.node }} is under disk pressure."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: "DOKS node {{ $labels.node }} has been NotReady for 2+ minutes."

    # ─── Storage ─────────────────────────────────────────────────────────────
    - name: onemind.storage
      interval: 60s
      rules:
        - alert: PVCFillingUp
          expr: |
            kubelet_volume_stats_available_bytes
              / kubelet_volume_stats_capacity_bytes < 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 85%+ full"
            description: "Only {{ $value | humanizePercentage }} free. ClickHouse or Hermes state volume may be at risk."
