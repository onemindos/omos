# One generic workload dashboard for every OneMind app (flagship F5).
# Provisioned by the existing Grafana sidecar (label grafana_dashboard, folder annotation) exactly like
# grafana-dashboards-onemind-services.yaml. App pages link here with ?var-namespace=...&var-workload=...,
# generated from catalog/workload-map.yaml by services/onemind-portal/scripts/curate-coverage.cjs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-onemind-workload
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    onemind.io/grafana-folder: /tmp/dashboards/OneMind
data:
  onemind-workload.json: |
    {
      "uid": "onemind-workload",
      "title": "OneMind / Workload",
      "description": "Generic workload view. Pick namespace and workload; every OneMind app page links here with its own variables. Observed Kubernetes telemetry only: pod health is not application correctness, data freshness or alert coverage.",
      "tags": [
        "onemind-service",
        "onemind-workload"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "namespace"
            },
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "workload",
            "label": "Workload",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\"}, workload)",
              "refId": "workload"
            },
            "definition": "label_values(namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\"}, workload)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Ready pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{namespace=~\"$namespace\",condition=\"true\"} * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"})",
              "legendFormat": "ready",
              "range": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Pods not ready",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{namespace=~\"$namespace\",condition=\"false\"} * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"}) or vector(0)",
              "legendFormat": "not ready",
              "range": true
            }
          ],
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Restarts (last hour, current pods)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]) * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"}) or vector(0)",
              "legendFormat": "restarts",
              "range": true
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Firing alerts in namespace",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",namespace=~\"$namespace\"}) or vector(0)",
              "legendFormat": "firing",
              "range": true
            }
          ],
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "description": "Prometheus alerts carrying a namespace label. Alerts without one are not counted."
        },
        {
          "id": 5,
          "title": "CPU usage by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"} * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"})",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Memory working set by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\",container!=\"\",image!=\"\"} * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"})",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Network receive by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\"}[5m]) * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"})",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Network transmit by pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\"}[5m]) * on(namespace,pod) group_left(workload) namespace_workload_pod:kube_pod_owner:relabel{namespace=~\"$namespace\",workload=~\"$workload\"})",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        }
      ],
      "links": [
        {
          "title": "Live Ops",
          "url": "/today",
          "type": "link",
          "targetBlank": false
        }
      ]
    }
