# Authentik side of "Grafana signs in through Authentik" (same pattern as the Argo CD and Karakeep
# providers: a Sync hook that calls the Authentik API with AUTHENTIK_BOOTSTRAP_TOKEN, safe to re-run).
# Creates or updates the confidential OAuth2 provider + application `grafana`, issuer
# https://auth.onemindos.dev/application/o/grafana/, and binds the application to the group
# `authentik Admins` only (the job fails if that group is missing or if it finds any other binding,
# so it never widens access). The client secret comes from the SealedSecret
# auth/grafana-oidc-bootstrap (grafana-oidc.sealedsecret.yaml); the same value is sealed for Grafana
# as monitoring/grafana-oidc. Grafana keeps its local admin login as the break-glass path.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-authentik-oidc-v1
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provider
        image: ghcr.io/onemindos/onemind-core@sha256:667f9836cda15e3aadd51c6186eb80839946a0d1c76fc26fcb367e81cbc6ff9a
        command: [python, -c]
        args:
        - |
          import json, os, httpx

          base = "http://platform-auth-helm-authentik-server.auth.svc.cluster.local/api/v3/"
          slug = "grafana"
          launch = "https://grafana.tail717ba0.ts.net"
          headers = {"Authorization": "Bearer " + os.environ["AUTH_TOKEN"]}
          with httpx.Client(headers=headers, timeout=30) as client:
              def request(method, path, body=None, missing_ok=False):
                  response = client.request(method, base + path, json=body)
                  if missing_ok and response.status_code == 404:
                      return None
                  if not response.is_success:
                      # Identity API bodies may echo submitted credentials.
                      raise RuntimeError("Identity API " + method + " " + path.split("?")[0]
                                         + " failed with status " + str(response.status_code))
                  return response.json() if response.content else {}

              def listed(path):
                  page = request("GET", path + ("&" if "?" in path else "?") + "page_size=200")
                  if page.get("pagination", {}).get("next"):
                      raise RuntimeError("Identity inventory exceeds one page; refusing partial reconciliation")
                  return page["results"]

              groups = [g for g in listed("core/groups/?name=authentik%20Admins") if g["name"] == "authentik Admins"]
              if len(groups) != 1:
                  raise RuntimeError("Group 'authentik Admins' not found")
              admins = groups[0]["pk"]

              providers = listed("providers/oauth2/")
              originals = [p for p in providers if p["client_id"] == "onemind-backstage"]
              if len(originals) != 1 or not originals[0].get("signing_key"):
                  raise RuntimeError("The established OneMind OIDC template/signing key is unavailable")
              original = originals[0]

              # `groups` scope: claim groups = names of the user's Authentik groups (shared with Argo CD).
              mapping_body = {"name": "OneMind groups", "scope_name": "groups",
                              "expression": "return {\"groups\": [group.name for group in request.user.ak_groups.all()]}"}
              mappings = [m for m in listed("propertymappings/provider/scope/") if m["name"] == "OneMind groups"]
              mapping = (request("PATCH", "propertymappings/provider/scope/" + mappings[0]["pk"] + "/", mapping_body)
                         if mappings else request("POST", "propertymappings/provider/scope/", mapping_body))

              matches = [p for p in providers if p["client_id"] == slug]
              if len(matches) > 1:
                  raise RuntimeError("Duplicate Grafana OIDC providers require review")
              body = {k: original[k] for k in ["authorization_flow", "invalidation_flow", "signing_key",
                                              "sub_mode", "issuer_mode", "access_token_validity"]}
              body.update(name="OneMind Grafana", client_type="confidential", client_id=slug,
                          client_secret=os.environ["OAUTH_CLIENT_SECRET"], include_claims_in_id_token=True,
                          property_mappings=sorted(set(original["property_mappings"]) | {mapping["pk"]}),
                          grant_types=["authorization_code", "refresh_token"],
                          redirect_uris=[{"matching_mode": "strict", "url": launch + "/login/generic_oauth",
                                          "redirect_uri_type": "authorization"}])
              provider = (request("PATCH", "providers/oauth2/" + str(matches[0]["pk"]) + "/", body)
                          if matches else request("POST", "providers/oauth2/", body))
              existing = request("GET", "core/applications/" + slug + "/", missing_ok=True)
              app_body = {"name": "Grafana", "slug": slug, "provider": provider["pk"],
                          "policy_engine_mode": "all", "meta_launch_url": launch}
              app = (request("PATCH", "core/applications/" + slug + "/", app_body) if existing
                     else request("POST", "core/applications/", app_body))
              bindings = listed("policies/bindings/?target=" + app["pk"])
              if any(b.get("group") != admins or b.get("user") or b.get("policy") or not b["enabled"]
                     or b.get("negate", False) for b in bindings):
                  raise RuntimeError("Unexpected Grafana application bindings; refusing to widen access")
              if not bindings:
                  request("POST", "policies/bindings/", {"target": app["pk"], "group": admins,
                                                         "enabled": True, "negate": False, "order": 0})
              verified = listed("policies/bindings/?target=" + app["pk"])
              if len(verified) != 1 or verified[0].get("group") != admins or not verified[0]["enabled"]:
                  raise RuntimeError("Grafana authentik Admins application binding was not verified")
          print("Grafana OIDC ready: issuer path /application/o/grafana/, restricted to authentik Admins")
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_BOOTSTRAP_TOKEN
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-oidc-bootstrap
              key: OAUTH_CLIENT_SECRET
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
