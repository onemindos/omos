# Grafana single sign-on with Authentik. The same fresh client secret is sealed twice:
# auth/grafana-oidc-bootstrap (read by grafana-authentik-provider.yaml) and monitoring/grafana-oidc
# (read by Grafana as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: grafana-oidc-bootstrap
  namespace: auth
spec:
  encryptedData:
    OAUTH_CLIENT_SECRET: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: grafana-oidc-bootstrap
      namespace: auth
    type: Opaque

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: grafana-oidc
  namespace: monitoring
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: grafana-oidc
      namespace: monitoring
    type: Opaque
