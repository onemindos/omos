apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ds-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasources.yaml: |
    apiVersion: 1
    # Tempo was removed 2026-11-03. Grafana does not drop a provisioned data
    # source when its file disappears, so delete it explicitly. Safe to remove
    # this block once the Tempo entry is gone from Grafana.
    deleteDatasources:
      - name: Tempo
        orgId: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
