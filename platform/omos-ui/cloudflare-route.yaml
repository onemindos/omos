apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudtak-root-route
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudtak
    app.kubernetes.io/part-of: cloudflare-tunnel
  annotations:
    description: "Root domain onemindos.dev → CloudTAK (replaced omos-ui)"
data:
  tunnel: "66bbea70-5300-4e4e-96fa-e5bc4d767b61"
  comment: "OneMind hub tunnel — root domain"
  hostname: "onemindos.dev"
  service: "http://cloudtak-api.cloudtak.svc.cluster.local:5000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-ws-route
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: nats-ws
    app.kubernetes.io/part-of: cloudflare-tunnel
  annotations:
    description: "NATS WebSocket route — browser SPA connects via wss://ws.onemindos.dev"
data:
  tunnel: "66bbea70-5300-4e4e-96fa-e5bc4d767b61"
  comment: "OneMind hub tunnel"
  hostname: "ws.onemindos.dev"
  service: "http://nats.nats.svc.cluster.local:8080"
