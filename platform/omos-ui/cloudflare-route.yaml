apiVersion: v1
kind: ConfigMap
metadata:
  name: omos-ui-route
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: omos-ui
    app.kubernetes.io/part-of: cloudflare-tunnel
  annotations:
    description: "Desired Cloudflare public hostname mapping for OneMind OS web ops center"
data:
  tunnel: "66bbea70-5300-4e4e-96fa-e5bc4d767b61"
  comment: "OneMind hub tunnel"
  hostname: "onemindos.dev"
  service: "http://omos-ui.omos.svc.cluster.local:80"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-ws-route
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: nats-ws
    app.kubernetes.io/part-of: cloudflare-tunnel
  annotations:
    description: "NATS WebSocket route — browser SPA connects via wss://ws.onemindos.dev"
data:
  tunnel: "66bbea70-5300-4e4e-96fa-e5bc4d767b61"
  comment: "OneMind hub tunnel"
  hostname: "ws.onemindos.dev"
  service: "http://nats.nats.svc.cluster.local:8080"
