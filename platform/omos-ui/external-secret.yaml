apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
  namespace: omos
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf \"%s:%s\" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: omos-ghcr-pat
        property: username
    - secretKey: token
      remoteRef:
        key: omos-ghcr-pat
        property: token
