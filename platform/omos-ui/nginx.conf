server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ─── Authentik Forward Auth subrequest endpoint ──────────────────────────
    # nginx sends a HEAD to /outpost.goauthentik.io/auth/nginx; Authentik
    # returns 200 (pass) or 401 (redirect to login). On 401 nginx returns the
    # Authentik-provided redirect headers directly to the browser.
    location /outpost.goauthentik.io {
        proxy_pass http://authentik-server.authentik.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host auth.onemindos.dev;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ─── ATOC — CloudTAK, Forward Auth protected ─────────────────────────────
    location /atoc/ {
        # Forward Auth check — 401 bounces to Authentik login
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @authentik_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        proxy_set_header X-Authentik-Username $authentik_username;

        proxy_pass http://cloudtak-api.cloudtak.svc.cluster.local:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host cloudtak.onemindos.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header X-Frame-Options;
        sub_filter 'https://cloudtak.onemindos.dev/' '/atoc/';
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
    }

    # ─── ATLAS — WWV globe, Forward Auth protected ───────────────────────────
    location /atlas/ {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @authentik_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://wwv.wwv.svc.cluster.local:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host wwv.onemindos.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        sub_filter 'https://wwv.onemindos.dev/' '/atlas/';
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript;
    }

    # ─── Authentik sign-in redirect ──────────────────────────────────────────
    location @authentik_signin {
        internal;
        return 302 https://auth.onemindos.dev/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }

    # ─── SPA — all other routes fall back to index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
