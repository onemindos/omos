apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-ui
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-ui
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omos-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omos-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: omos-ui
          image: ghcr.io/onemindos/omos-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: omos-ui
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-ui
    app.kubernetes.io/part-of: omos-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omos-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
