# https://portal.tail717ba0.ts.net -> the canonical portal host, same path and query.
# Backstage serves one origin (PORTAL_URL in deployment.yaml), so this alias redirects
# instead of serving the portal. Keep the target equal to PORTAL_URL.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  # No request or query-string logs.
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    # Kubelet probes only.
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    # 302, not 301/308: browsers do not cache it, so the canonical host can later move
    # to portal without a cached permanent redirect sending users in a loop.
    location / {
      return 302 https://onemind-preview.tail717ba0.ts.net$request_uri;
    }
  }
}
