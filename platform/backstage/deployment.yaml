apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      imagePullSecrets:
      - name: ghcr
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backstage
        image: ghcr.io/onemindos/onemind-portal@sha256:7b090aad76984307457a5f38515b05742685d0256dece9467b664f3fe964fb26
        command:
        - node
        args:
        - packages/backend
        - --config
        - app-config.yaml
        - --config
        - app-config.production.yaml
        - --config
        - /app/app-config.cluster.yaml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 7007
        envFrom:
        - secretRef: {name: backstage-zoho, optional: true}
        - secretRef: {name: backstage-plugin-integrations}
        env:
        - name: MCP_TOKEN
          valueFrom:
            secretKeyRef: {name: backstage-mcp, key: MCP_TOKEN}
        - name: PORTAL_URL
          value: https://onemind-preview.tail717ba0.ts.net
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: POSTGRES_PASSWORD
        - name: AUTH_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_SESSION_SECRET
        - name: AUTH_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_OIDC_CLIENT_ID
        - name: AUTH_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_OIDC_CLIENT_SECRET
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /.backstage/health/v1/liveness
            port: http
          periodSeconds: 15
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: catalog
          mountPath: /app/catalog
          readOnly: true
        - name: cluster-config
          mountPath: /app/app-config.cluster.yaml
          subPath: app-config.cluster.yaml
          readOnly: true
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - setTimeout(() => {}, 5000)
      volumes:
      - name: catalog
        configMap:
          name: backstage-catalog
      - name: cluster-config
        configMap:
          name: backstage-cluster-config
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: backstage
              topologyKey: kubernetes.io/hostname
  minReadySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  selector:
    app: backstage
  ports:
  - name: http
    port: 7007
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onemind-preview
  namespace: backstage
  annotations:
    tailscale.com/hostname: onemind-preview
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: backstage
      port:
        number: 7007
  tls:
  - hosts:
    - onemind-preview
