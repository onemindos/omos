apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      imagePullSecrets:
      - name: ghcr
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backstage
        image: ghcr.io/onemindos/onemind-portal@sha256:b752f97d22cf3af57ce6a1d3d9f98f8665c6a7bfad12acac8a9c94b7800c176e
        command:
        - node
        args:
        - packages/backend
        - --config
        - app-config.yaml
        - --config
        - app-config.production.yaml
        - --config
        - /app/app-config.cluster.yaml
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 7007
        envFrom:
        # ONEMIND_ALERT_WEBHOOK_TOKEN for the Alertmanager receiver (platform/monitoring/alertmanagerconfig-onemind-backstage.yaml).
        - secretRef:
            name: onemind-alert-webhook
            optional: true
        - secretRef:
            name: backstage-zoho
            optional: true
        - secretRef:
            name: backstage-billing
            optional: true
        - secretRef:
            name: backstage-plugin-integrations
        - secretRef:
            name: onemind-core-gateway
        - secretRef:
            name: onemind-fga-client
        env:
        - name: GRAFANA_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-grafana
              key: GRAFANA_TOKEN
        - name: MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-mcp
              key: MCP_TOKEN
        - name: ONEMIND_MCP_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-mcp
              key: ONEMIND_MCP_HUB_TOKEN
        # Read-only Authentik token for the org sync (authentik.orgSync, off by default). Optional:
        # the owner seals backstage-authentik-catalog; until then the variable is simply absent.
        - name: AUTHENTIK_CATALOG_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-authentik-catalog
              key: AUTHENTIK_CATALOG_TOKEN
              optional: true
        # Read-only DigitalOcean token (F6, docs/operations/digitalocean.md). Optional: until the owner
        # seals backstage-digitalocean the page shows "Not connected". The same token feeds the /today
        # cost card (DO_BILLING_READ_TOKEN, billing:read).
        - name: DIGITALOCEAN_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-digitalocean
              key: DIGITALOCEAN_TOKEN
              optional: true
        - name: DO_BILLING_READ_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-digitalocean
              key: DIGITALOCEAN_TOKEN
              optional: true
        # Ops Center live bridge (plugins/plugin-onemind-livebridge-backend): read-only NATS subscriber.
        # Optional: without the secret the bridge reports NATS as disabled and the portal starts normally.
        - name: NATS_USER
          valueFrom:
            secretKeyRef:
              name: portal-nats-creds
              key: NATS_USER
              optional: true
        - name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portal-nats-creds
              key: NATS_PASSWORD
              optional: true
        - name: PORTAL_URL
          value: https://portal.tail717ba0.ts.net
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: POSTGRES_PASSWORD
        - name: AUTH_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_SESSION_SECRET
        - name: AUTH_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_OIDC_CLIENT_ID
        - name: AUTH_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-secrets
              key: AUTH_OIDC_CLIENT_SECRET
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /.backstage/health/v1/liveness
            port: http
          periodSeconds: 15
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: catalog
          mountPath: /app/catalog
          readOnly: true
        - name: catalog-plugins
          mountPath: /app/catalog-plugins
          readOnly: true
        - name: cluster-config
          mountPath: /app/app-config.cluster.yaml
          subPath: app-config.cluster.yaml
          readOnly: true
        - name: onemind-fga-context
          mountPath: /etc/onemind-fga
          readOnly: true
        # CA of the in-cluster NATS (cert-manager nats-ca, CN onemind-nats-ca) for the live bridge.
        - name: nats-ca
          mountPath: /etc/nats-ca
          readOnly: true
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - setTimeout(() => {}, 5000)
      volumes:
      - name: catalog
        configMap:
          name: backstage-catalog
      - name: catalog-plugins
        configMap:
          name: backstage-catalog-plugins
      - name: cluster-config
        configMap:
          name: backstage-cluster-config
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: onemind-fga-context
        configMap:
          name: onemind-fga-context
      - name: nats-ca
        secret:
          secretName: portal-nats-ca
          optional: true
      terminationGracePeriodSeconds: 45
      affinity:
        # Required, not preferred: hub-core is memory-saturated, so the portal runs only
        # on the autoscaled ecosystem pool. PostgreSQL (RWO volume) is not moved.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - onemind-ecosystem-cpu
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: backstage
              topologyKey: kubernetes.io/hostname
  minReadySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
spec:
  selector:
    app: backstage
  ports:
  - name: http
    port: 7007
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: backstage
  annotations:
    tailscale.com/hostname: portal
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: backstage
      port:
        number: 7007
  tls:
  - hosts:
    - portal
