kubernetes:
  objectTypes:
    - pods
    - services
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs
    - ingresses
    - horizontalpodautoscalers
    - limitranges
    - resourcequotas
search:
  collators:
    techdocs:
      schedule:
        frequency: {minutes: 1}
        timeout: {seconds: 50}
        initialDelay: {seconds: 30}

backend:
  csp:
    frame-src: ["'self'", "https://grafana.tail717ba0.ts.net"]
    connect-src: ["'self'", 'https://api.github.com', 'https://onemind-observer.tail717ba0.ts.net']
    img-src: ["'self'", 'data:', 'https://avatars.githubusercontent.com']
  database:
    knexConfig:
      pool:
        min: 0
        max: 3
        idleTimeoutMillis: 10000
      acquireConnectionTimeout: 30000
  auth:
    externalAccess:
      - type: static
        options:
          token: ${MCP_TOKEN}
          subject: onemind-readonly-ai
        accessRestrictions:
          - plugin: mcp-actions
          - plugin: catalog
          - plugin: onemind

argocd:
  baseUrl: https://argocd.tail717ba0.ts.net
  appLocatorMethods:
    - type: config
      instances:
        - name: onemind-cloud
          url: https://argocd.tail717ba0.ts.net
          token: ${ARGOCD_READONLY_TOKEN}

proxy:
  endpoints:
    '/grafana/api':
      target: http://monitoring-grafana.monitoring.svc.cluster.local
      credentials: require
      allowedMethods: [GET, HEAD]
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

auth:
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        # Authorization for integrations only; Authentik remains the sign-in provider.

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${AUTH_GITHUB_CLIENT_ID}
          clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          allowedInstallationOwners: [onemindos]

# Internal read-only observation; no public webhook or extra producer token.
onemind:
  operationalEvents:
    enabled: true

# Required shared bus: retry startup races instead of falling back to local-only delivery.
events:
  useEventBus: always
  http:
    topics: []

# OpenChoreo 1.3.1 prefixes group:default/ in the catalog provider.
openchoreo:
  defaultOwner: onemind-admins
