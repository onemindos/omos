kubernetes:
  objectTypes:
    - pods
    - services
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs
    - ingresses
    - horizontalpodautoscalers
    - limitranges
    - resourcequotas
search:
  collators:
    techdocs:
      schedule:
        frequency: {minutes: 1}
        timeout: {seconds: 50}
        initialDelay: {seconds: 30}

backend:
  auth:
    externalAccess:
      - type: static
        options:
          token: ${MCP_TOKEN}
          subject: onemind-readonly-ai
        accessRestrictions:
          - plugin: mcp-actions
          - plugin: catalog
          - plugin: onemind
