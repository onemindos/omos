kubernetes:
  objectTypes:
    - pods
    - services
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs
    - ingresses
    - horizontalpodautoscalers
    - limitranges
    - resourcequotas
search:
  collators:
    # TechDocs are packaged in the image and only change with a new digest; a rollout
    # restarts the pods, so initialDelay re-indexes each release. adr, announcements and
    # software-catalog keep their module defaults (every 10 minutes).
    techdocs:
      schedule:
        frequency: {minutes: 15}
        timeout: {minutes: 5}
        initialDelay: {seconds: 30}

backend:
  csp:
    frame-src: ["'self'", "https://grafana.tail717ba0.ts.net"]
    connect-src: ["'self'", 'https://api.github.com']
    img-src: ["'self'", 'data:', 'https://avatars.githubusercontent.com']
  database:
    knexConfig:
      pool:
        min: 0
        max: 3
        idleTimeoutMillis: 10000
      acquireConnectionTimeout: 30000
  auth:
    externalAccess:
      - type: static
        options:
          token: ${MCP_TOKEN}
          subject: onemind-readonly-ai
        accessRestrictions:
          - plugin: mcp-actions
          - plugin: catalog
          - plugin: onemind

catalog:
  # Arrays replace the image defaults. Domain admits the OneMind / SO / LE / HP / GE Domains
  # from catalog/apps.yaml; every other kind stays as in app-config.yaml.
  rules:
    - allow: [Component, System, API, Resource, Location, Domain]
  # GitHub discovery (catalog-backend-module-github; images without it ignore this block). Reuses
  # the read-only GitHub App under integrations.github: no new credential and no webhook ingress.
  # Scope: omos only. The App installation selects only omos, and Backstage will not read another
  # onemindos repository with it (a descriptor there would fail every cycle), so widen
  # filters.repository only together with that selection. A repository is registered only when
  # its main branch has /catalog-info.yaml; forks and archived repositories stay excluded. Keep
  # the path literal: a wildcard also matches the Scaffolder skeletons. The rules above apply to
  # discovered entities. Rollback: delete this block.
  providers:
    github:
      onemindos:
        organization: onemindos
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
          repository: '^omos$'
          allowForks: false
        validateLocationsExist: true
        schedule:
          frequency: {minutes: 30}
          timeout: {minutes: 3}

argocd:
  baseUrl: https://argocd.tail717ba0.ts.net
  appLocatorMethods:
    - type: config
      instances:
        - name: onemind-cloud
          url: https://argocd.tail717ba0.ts.net
          token: ${ARGOCD_READONLY_TOKEN}

proxy:
  endpoints:
    '/grafana/api':
      target: http://monitoring-grafana.monitoring.svc.cluster.local
      credentials: require
      allowedMethods: [GET, HEAD]
      headers:
        Authorization: Bearer ${GRAFANA_TOKEN}

auth:
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        # Authorization for integrations only; Authentik remains the sign-in provider.

integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${AUTH_GITHUB_CLIENT_ID}
          clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          allowedInstallationOwners: [onemindos]

# Internal read-only observation; no public webhook or extra producer token.
onemind:
  operationalEvents:
    enabled: true
  # Objects merge across config layers, so only the flags that differ from the image
  # defaults are listed. The SO/LE/HP/GE Domains and pillar labels are live in the catalog;
  # this shows the sidebar Pillars group and the home tiles. Rollback: set it to false
  # (or delete the line) and let Argo sync; no image build needed.
  features:
    pillars: true
  # Live Kubernetes inventory (docs/catalog/live-inventory.md): publishes workloads that
  # catalog/cluster.yaml does not define yet and flags vanished ones for review. Reviewed
  # entities are never replaced. Rollback: set enabled to false (or delete the block).
  inventory:
    live:
      enabled: true

# Authentik users and groups as catalog Users/Groups (docs/catalog/authentik-org-sync.md).
# OFF: Authentik is never called and nothing is published; the module only removes entities it
# published earlier. The token below resolves to nothing until the owner seals
# backstage-authentik-catalog (AUTHENTIK_CATALOG_TOKEN, a service account that may only view users
# and groups). To enable, follow the doc's "Turning it on": bind the portal group(s) to the
# onemind-backstage application in Authentik and confirm that a non-member is refused, create the
# required stale-sync alert, list the groups in userGroups (only they and the groups below them are
# published, never a superuser group), then set enabled: true and update
# scripts/tests/test_gitops_portal_org_sync.py. The first sync comes at the task's next scheduled
# run, within 10 minutes (about 20 during the rollout), not after initialDelaySeconds. Users and
# Groups in catalog/org.yaml, including onemind-admins, stay Git-owned. Rollback: set enabled to
# false; new pods remove the synced entities at startup and every run of the sync's task removes
# them again, so the catalog is clear within 10 minutes (or frequencySeconds, if set higher) of
# the last old pod's last run.
authentik:
  baseUrl: http://platform-auth-helm-authentik-server.auth.svc.cluster.local
  token: ${AUTHENTIK_CATALOG_TOKEN}
  orgSync:
    enabled: false
    userGroups: []

# Required shared bus: retry startup races instead of falling back to local-only delivery.
events:
  useEventBus: always
  http:
    topics: []

# Arrays replace rather than merge across config layers. Retain every host
# extension; tests enforce parity with app-config.yaml before this opt-in filter.
# Native Grafana alerts are not Prometheus-rule coverage: require an explicit
# reviewed label selector instead of showing an empty "Alerts" card by default.
app:
  extensions:
    - theme:app/light: false
    - theme:app/dark: false
    - app-root-element:announcements/banner: false
    - nav-item:announcements
    - page:tech-radar:
        config:
          pageTitle: OneMind Technology Radar
          subtitle: Git-owned technology choices; this is not a live health report
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock:
        config:
          clockConfigs:
            - label: New York
              timeZone: America/New_York
            - label: UTC
              timeZone: UTC
          customTimeFormat:
            hour12: false
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: /today
              label: Today
              icon: dashboard
            - url: /systems
              label: Systems
              icon: kind:system
            - url: /docs
              label: Runbooks
              icon: docs
            - url: /assistant
              label: Assistant
              icon: chat
            - url: /offline
              label: Offline knowledge
              icon: docs
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: OneMindDirectory
              column: 0
              row: 2
              width: 8
              height: 22
              deletable: false
            - component: HomePageWorldClock
              column: 8
              row: 2
              width: 4
              height: 4
            - component: HomePageToolkit
              column: 8
              row: 6
              width: 4
              height: 5
            - component: HomePageStarredEntities
              column: 8
              row: 11
              width: 4
              height: 5
            - component: HomePageRecentlyVisited
              column: 8
              row: 16
              width: 4
              height: 8
    - entity-card:grafana/alerts:
        config:
          filter:
            metadata.annotations.grafana/alert-label-selector:
              $exists: true
