apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  annotations:
    volsync.backube/privileged-movers: "true"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onemind-auth
  namespace: auth
  annotations:
    tailscale.com/hostname: onemind-auth
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: platform-auth-helm-authentik-server
      port:
        number: 80
  tls:
    - hosts: [onemind-auth]
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-mesh
  namespace: backstage
  annotations:
    tailscale.com/tailnet-fqdn: onemind-auth.tail717ba0.ts.net
    tailscale.com/proxy-group: egress
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-mesh
  namespace: backstage
  annotations:
    tailscale.com/tailnet-fqdn: argocd.tail717ba0.ts.net
    tailscale.com/proxy-group: egress
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP
