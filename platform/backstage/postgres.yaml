apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-postgres-init
  namespace: backstage
data:
  01-backstage.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres --set=app_password="$BACKSTAGE_DB_PASSWORD" <<'SQL'
    CREATE ROLE backstage LOGIN NOSUPERUSER NOCREATEROLE CREATEDB PASSWORD :'app_password';
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backstage-postgres
  namespace: backstage
  labels:
    app: backstage-postgres
spec:
  serviceName: backstage-postgres
  replicas: 1
  selector:
    matchLabels: {app: backstage-postgres}
  template:
    metadata:
      labels: {app: backstage-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: backstage-secrets, key: POSTGRES_ADMIN_PASSWORD}
            - name: BACKSTAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: backstage-secrets, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            exec: {command: [pg_isready, -U, postgres]}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 10
      volumes:
        - name: init
          configMap: {name: backstage-postgres-init, defaultMode: 0555}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: do-block-storage-retain
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  selector: {app: backstage-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: backstage
spec:
  podSelector:
    matchLabels: {app: backstage-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: backstage}
      ports: [{port: 5432, protocol: TCP}]
