apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
data:
  onemind-auth.override: |
    rewrite stop {
      name exact onemind-auth.tail717ba0.ts.net authentik-mesh.backstage.svc.cluster.local
      answer auto
    }
    rewrite stop {
      name exact argocd.tail717ba0.ts.net argocd-mesh.backstage.svc.cluster.local
      answer auto
    }
