apiVersion: batch/v1
kind: CronJob
metadata:
  name: backstage-backup
  namespace: backstage
spec:
  # Superseded by verified all-plugin-db backup-postgres-backstage.
  suspend: true
  schedule: '15 7 * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app: backstage-backup}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets: [{name: ghcr}]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              image: ghcr.io/onemindos/backstage-backup@sha256:5c1c98afc74674acbec405c211b1421d48ebc4522d36f15e133c83b076fae644
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              envFrom:
                - secretRef: {name: backstage-backup}
              env:
                - {name: PGHOST, value: backstage-postgres}
                - {name: PGUSER, value: backstage}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: backstage-secrets, key: POSTGRES_PASSWORD}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: '1', memory: 1Gi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: 1Gi}
