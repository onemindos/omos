# Candidate has no PostgreSQL configuration or production database credential.
app:
  baseUrl: https://onemind-portal-candidate.tail717ba0.ts.net
backend:
  csp:
    connect-src: ["'self'", 'https://onemind-observer.tail717ba0.ts.net']
  baseUrl: https://onemind-portal-candidate.tail717ba0.ts.net
  listen:
    host: 0.0.0.0
    port: 7007
  cors:
    origin: https://onemind-portal-candidate.tail717ba0.ts.net
    credentials: true
  database:
    client: better-sqlite3
    connection:
      filename: ':memory:'
  auth:
    externalAccess:
      - type: static
        options:
          token: ${MCP_TOKEN}
          subject: onemind-readonly-ai
        accessRestrictions:
          - plugin: mcp-actions
          - plugin: catalog
          - plugin: onemind
catalog:
  locations:
    - type: file
      target: /app/templates/service-registration/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/app-onboarding/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/deployment-change/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/templates/recovery-preparation/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: /app/catalog/apps.yaml
    - type: file
      target: /app/catalog/cluster.yaml
    - type: file
      target: /app/catalog/org.yaml
      rules:
        - allow: [User, Group]

# The 1.3.1 provider adds group:default/ itself; use the group name, not a ref.
openchoreo:
  defaultOwner: onemind-admins
