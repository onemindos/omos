apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-candidate
  namespace: backstage
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backstage-candidate
  template:
    metadata:
      labels:
        app: backstage-candidate
    spec:
      serviceAccountName: backstage
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: ghcr.io/onemindos/onemind-portal@sha256:9dccd17aaabefe53e61c8e99bf8db79b510837db40e009fdfce2237cbfe953a4
          command: [node]
          args:
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - /app/app-config.candidate.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: openchoreo-oidc
            - secretRef:
                name: openchoreo-catalog
          env:
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_SESSION_SECRET
            - name: AUTH_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_OIDC_CLIENT_ID
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secrets
                  key: AUTH_OIDC_CLIENT_SECRET
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-mcp
                  key: MCP_TOKEN
          ports:
            - name: http
              containerPort: 7007
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/app-config.candidate.yaml
              subPath: app-config.candidate.yaml
              readOnly: true
            - name: catalog
              mountPath: /app/catalog
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: config
          configMap:
            name: backstage-candidate-config
        - name: catalog
          configMap:
            name: backstage-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-candidate
  namespace: backstage
spec:
  selector:
    app: backstage-candidate
  ports:
    - name: http
      port: 7007
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onemind-portal-candidate
  namespace: backstage
  annotations:
    tailscale.com/hostname: onemind-portal-candidate
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: backstage-candidate
      port:
        number: 7007
  tls:
    - hosts: [onemind-portal-candidate]
