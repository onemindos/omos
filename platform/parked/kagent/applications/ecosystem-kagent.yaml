apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecosystem-kagent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  sources:
  - repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: 0.10.3
    helm:
      releaseName: kagent
      valueFiles:
      - $values/platform/ecosystem/values/kagent.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
