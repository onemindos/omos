apiVersion: v1
kind: Namespace
metadata:
  name: synadia-bridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synadia-bridge
  namespace: synadia-bridge
  labels:
    app.kubernetes.io/name: synadia-bridge
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synadia-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synadia-bridge
    spec:
      imagePullSecrets:
        - name: ghcr-onemindos
      containers:
        - name: synadia-bridge
          image: ghcr.io/onemindos/synadia-bridge:latest
          ports:
            - containerPort: 3300
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  # omos-nats-creds is namespace-scoped; must be created in this namespace.
                  # See install.sh — copy or recreate from 1Password (omos-nats-secrets).
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: PORT
              value: "3300"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: synadia-bridge
  namespace: synadia-bridge
spec:
  selector:
    app.kubernetes.io/name: synadia-bridge
  ports:
    - port: 3300
      targetPort: 3300
