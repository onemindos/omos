apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-keeper
  namespace: ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-keeper
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "persistentvolumes", "nodes", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-keeper
subjects:
  - kind: ServiceAccount
    name: health-keeper
    namespace: ops
roleRef:
  kind: ClusterRole
  name: health-keeper
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-keeper-script
  namespace: ops
data:
  run.py: |
    import json, os, ssl, urllib.request

    TOKEN = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
    URL   = os.environ['KUBERNETES_URL']
    CTX   = ssl.create_default_context()
    CTX.load_verify_locations('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')

    def api(path, method='GET'):
        req = urllib.request.Request(URL+path, method=method)
        req.add_header('Authorization', 'Bearer '+TOKEN)
        with urllib.request.urlopen(req, context=CTX, timeout=10) as f:
            return json.load(f)

    report = {"kind": "health-report", "findings": []}
    def emit(subject, payload):
        report['findings'].append({"subject": subject, **payload})

    # 1. Observe pods. Never delete Pending/Failed pods: controllers own their
    # lifecycle, and failure evidence is required for diagnosis and backup recovery.
    try:
        pods = api('/api/v1/pods')['items']
        for p in pods:
            status = p.get('status', {})
            phase = status.get('phase', 'Unknown')
            reasons = [status.get('reason', '')]
            for c in status.get('containerStatuses', []):
                reasons.append(c.get('state', {}).get('waiting', {}).get('reason', ''))
                reasons.append(c.get('state', {}).get('terminated', {}).get('reason', ''))
            reasons = sorted({reason for reason in reasons if reason})
            ready = next((c.get('status') for c in status.get('conditions', [])
                          if c.get('type') == 'Ready'), None)
            if phase not in ('Running', 'Succeeded') or (phase == 'Running' and ready != 'True'):
                emit('ops.health.escalate', {"action": "pod-unhealthy",
                     "pod": p['metadata']['name'], "ns": p['metadata']['namespace'],
                     "phase": phase, "reasons": reasons, "ready": ready})
    except Exception as e:
        emit('ops.health.escalate', {"action":"pod-scan-failed","err":str(e)})

    # 2. Released PVs -> audit + escalate (Zeus rule: never delete without go-ahead)
    try:
        pvs = api('/api/v1/persistentvolumes')['items']
        released = [(p['metadata']['name'], p['spec'].get('claimRef',{}).get('namespace','')+'/'+p['spec'].get('claimRef',{}).get('name',''))
                    for p in pvs if p['status']['phase']=='Released']
        if released:
            emit('ops.health.escalate', {"action":"released-pv-detected", "count":len(released), "list":released})
    except Exception as e:
        emit('ops.health.escalate', {"action":"pv-scan-failed","err":str(e)})

    # 3. node summary
    try:
        nodes = api('/api/v1/nodes')['items']
        for n in nodes:
            emit('ops.health.cluster', {"node":n['metadata']['name'], "unschedulable":n['spec'].get('unschedulable',False)})
    except:
        pass

    print(json.dumps(report, indent=2))
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-keeper
  namespace: ops
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: health-keeper
        spec:
          serviceAccountName: health-keeper
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: health-keeper
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              env:
                - name: KUBERNETES_URL
                  value: "https://kubernetes.default.svc"
              command: ["python", "/app/run.py"]
              volumeMounts:
                - name: script
                  mountPath: /app
          volumes:
            - name: script
              configMap:
                name: health-keeper-script
                items:
                  - key: run.py
                    path: run.py
