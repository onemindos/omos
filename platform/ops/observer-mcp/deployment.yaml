# Read-only HTTP MCP for OneMind observability. It talks directly to the cluster's
# Prometheus, Loki, Tempo and Alertmanager APIs; OpenCost cost series are exposed
# through Prometheus. It has no RBAC, Secrets or write access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observer-mcp
  namespace: ops
  labels:
    app: observer-mcp
data:
  server.py: |
    import json
    import os
    import time
    import urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    PROTOCOL_VERSION = "2025-06-18"
    SERVER_VERSION = "1.0.0"
    PROMETHEUS_URL = os.environ.get("PROMETHEUS_URL", "http://monitoring-kube-prometheus-prometheus.monitoring:9090")
    LOKI_URL = os.environ.get("LOKI_URL", "http://loki-gateway.monitoring:80")
    TEMPO_URL = os.environ.get("TEMPO_URL", "http://tempo.monitoring:3100")
    ALERTMANAGER_URL = os.environ.get("ALERTMANAGER_URL", "http://monitoring-kube-prometheus-alertmanager.monitoring:9093")
    MAX_RESULT_BYTES = int(os.environ.get("MAX_RESULT_BYTES", "131072"))


    class HTTPFailure(Exception):
        pass


    def http_json(base_url, path, params=None, timeout=10):
        url = base_url + path
        if params:
            url += "?" + urllib.parse.urlencode({key: value for key, value in params.items() if value is not None})
        try:
            with urllib.request.urlopen(url, timeout=timeout) as response:
                body = response.read(MAX_RESULT_BYTES + 1)
            if len(body) > MAX_RESULT_BYTES:
                raise HTTPFailure("upstream result exceeded result limit")
            return json.loads(body)
        except (OSError, ValueError, json.JSONDecodeError) as exc:
            raise HTTPFailure(str(exc)) from exc


    def now_minus(minutes):
        return int(time.time() * 1_000_000_000) - minutes * 60 * 1_000_000_000


    def trim(items, limit):
        requested = int(limit or 20)
        return items[: min(requested, 200)]


    def query_metrics(promql, limit=25):
        data = http_json(PROMETHEUS_URL, "/api/v1/query", {"query": promql})
        if data.get("status") != "success":
            raise HTTPFailure(f"Prometheus error: {data.get('errorType')}: {data.get('error')}")
        result = (data.get("data") or {}).get("result") or []
        records = []
        for item in trim(result, limit):
            metric = item.get("metric")
            value = item.get("value") or [None, None]
            labels = {key: value for key, value in metric.items() if key not in ("__name__",)}
            records.append({"metric": metric.get("__name__"), "labels": labels, "timestamp": value[0], "value": value[1]})
        return {"count": len(result), "returned": len(records), "series": records}


    def query_costs(namespace=None, promql=None, limit=50):
        query = promql
        if not query:
            selector = f'{{namespace="{namespace}"}}' if namespace else ""
            query = "sum by (namespace) (node_total_hourly_cost" + selector + ")"
        return query_metrics(query, limit)


    def build_log_query(namespace=None, selector=None, text=None):
        matchers = selector or ""
        if namespace:
            namespace_matcher = f'namespace="{namespace}"'
            matchers = namespace_matcher if not matchers else "{" + matchers.strip("{}") + ", " + namespace_matcher + "}"
        if not matchers:
            raise HTTPFailure("a namespace or selector is required")
        if text:
            return matchers + f' |= {json.dumps(text)}'
        return matchers


    def query_logs(namespace=None, selector=None, text=None, since=1440, limit=100):
        since = 1440 if since is None else since
        query = build_log_query(namespace, selector, text)
        params = {"query": query, "limit": limit, "start": now_minus(since), "end": int(time.time() * 1_000_000_000), "direction": "backward"}
        data = http_json(LOKI_URL, "/loki/api/v1/query_range", params)
        if data.get("status") != "success":
            raise HTTPFailure(f"Loki error: {data.get('error')}")
        streams = ((data.get("data") or {}).get("result") or [])
        records = []
        for stream in streams:
            labels = stream.get("stream") or {}
            for timestamp, line in trim(stream.get("values") or [], limit):
                records.append({"timestamp": timestamp, "labels": labels, "message": line[:4096]})
        return {"query": query, "count": len(records), "returned": len(records), "logs": records}


    def query_traces(service=None, tags=None, since=60, limit=20):
        since = 60 if since is None else since
        if not service:
            raise HTTPFailure("service is required")
        query = f"service.name={service}"
        if tags:
            query += " " + urllib.parse.quote(tags)
        data = http_json(TEMPO_URL, "/api/search", {"q": query, "since": since, "limit": limit})
        traces = data.get("traces") or []
        return {"query": query, "count": len(traces), "returned": len(traces), "traces": traces}


    def query_alerts(label=None):
        data = http_json(ALERTMANAGER_URL, "/api/v2/alerts", {"active": "true"})
        if label:
            data = [item for item in data if label in ((item.get("labels") or {}).get("alertname"), (item.get("labels") or {}).get("job"), (item.get("labels") or {}).get("service"))]
        return {"active_labels": [item.get("labels") for item in data], "annotations": [item.get("annotations") for item in data], "startsAt": [item.get("startsAt") for item in data]}


    def search_incidents(text="incident", namespace=None, since=1440, limit=50):
        since = 1440 if since is None else since
        matchers = f'namespace="{namespace}"' if namespace else 'namespace=~".+"'
        return query_logs(selector=matchers, text=text, since=since, limit=limit)


    TOOLS = {
        "query_metrics": {
            "description": "Run a read-only Prometheus instant query (PromQL).",
            "inputSchema": {"type": "object", "properties": {"promql": {"type": "string"}, "limit": {"type": "integer", "default": 25}}, "required": ["promql"]},
        },
        "query_logs": {
            "description": "Query recent Loki logs by namespace and optional substring.",
            "inputSchema": {"type": "object", "properties": {"namespace": {"type": "string"},
                "selector": {"type": "string"}, "text": {"type": "string"}, "since": {"type": "integer", "default": 1440},
                "limit": {"type": "integer", "default": 100}}},
        },
        "query_traces": {
            "description": "Search recent Tempo traces by service name.",
            "inputSchema": {"type": "object", "properties": {"service": {"type": "string"}, "tags": {"type": "string"},
                "since": {"type": "integer", "default": 60}, "limit": {"type": "integer", "default": 20}}, "required": ["service"]},
        },
        "get_alerts": {
            "description": "List currently active Alertmanager alerts.",
            "inputSchema": {"type": "object", "properties": {"label": {"type": "string"}}},
        },
        "search_incidents": {
            "description": "Search recent logs for incident/error keywords.",
            "inputSchema": {"type": "object", "properties": {"text": {"type": "string", "default": "error"},
                "namespace": {"type": "string"}, "since": {"type": "integer", "default": 1440},
                "limit": {"type": "integer", "default": 50}}},
        },
        "query_costs": {
            "description": "Query OpenCost cost and allocation metrics through Prometheus.",
            "inputSchema": {"type": "object", "properties": {"namespace": {"type": "string"}, "promql": {"type": "string"}, "limit": {"type": "integer", "default": 50}}},
        },
    }


    def call_tool(name, arguments):
        arguments = arguments or {}
        if name == "query_metrics":
            return query_metrics(arguments.get("promql"), arguments.get("limit"))
        if name == "query_logs":
            return query_logs(arguments.get("namespace"), arguments.get("selector"), arguments.get("text"), arguments.get("since"), arguments.get("limit"))
        if name == "query_traces":
            return query_traces(arguments.get("service"), arguments.get("tags"), arguments.get("since"), arguments.get("limit"))
        if name == "get_alerts":
            return query_alerts(arguments.get("label"))
        if name == "search_incidents":
            return search_incidents(arguments.get("text", "error"), arguments.get("namespace"), arguments.get("since"), arguments.get("limit"))
        if name == "query_costs":
            return query_costs(arguments.get("namespace"), arguments.get("promql"), arguments.get("limit"))
        raise ValueError(f"unknown tool: {name}")


    class Handler(BaseHTTPRequestHandler):
        server_version = "OneMindObserverMCP/" + SERVER_VERSION

        def send_json(self, status, payload, headers=None):
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            for key, value in (headers or {}).items():
                self.send_header(key, value)
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.send_json(200, {"status": "ok", "tools": len(TOOLS)})
                return
            self.send_json(405, {"error": "GET is not supported; send JSON-RPC POST requests to /mcp"})

        def do_POST(self):
            if self.path != "/mcp":
                self.send_json(404, {"error": "not found"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                request = json.loads(self.rfile.read(length))
            except (OSError, ValueError) as exc:
                self.send_json(400, {"jsonrpc": "2.0", "id": None, "error": {"code": -32700, "message": "parse error: " + str(exc)}})
                return
            method = request.get("method")
            request_id = request.get("id")
            if method == "initialize":
                result = {"protocolVersion": PROTOCOL_VERSION, "capabilities": {"tools": {}}, "serverInfo": {"name": "onemind-observer-mcp", "version": SERVER_VERSION}}
                self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "result": result}, {"Mcp-Session-Id": "stateless"})
                return
            if request_id is None:
                self.send_json(202, {})
                return
            try:
                if method == "ping":
                    result = {}
                elif method == "tools/list":
                    result = {"tools": [{"name": key, **value} for key, value in TOOLS.items()]}
                elif method == "tools/call":
                    params = request.get("params") or {}
                    result = {"content": [{"type": "text", "text": json.dumps(call_tool(params.get("name"), params.get("arguments")), ensure_ascii=False)}], "isError": False}
                else:
                    raise ValueError(f"unknown method: {method}")
                self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "result": result})
            except Exception as exc:
                self.send_json(200, {"jsonrpc": "2.0", "id": request_id, "result": {"content": [{"type": "text", "text": str(exc)}], "isError": True}})


    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "8000"))), Handler)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observer-mcp
  namespace: ops
  labels:
    app: observer-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observer-mcp
  template:
    metadata:
      labels:
        app: observer-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer-mcp
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: PORT
              value: "8000"
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090
            - name: LOKI_URL
              value: http://loki-gateway.monitoring:80
            - name: TEMPO_URL
              value: http://tempo.monitoring:3100
            - name: ALERTMANAGER_URL
              value: http://monitoring-kube-prometheus-alertmanager.monitoring:9093
          command:
            - python
            - /app/server.py
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: observer-mcp
            items:
              - key: server.py
                path: server.py
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
