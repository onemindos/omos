apiVersion: v1
kind: Service
metadata:
  name: observer-mcp
  namespace: ops
  labels:
    app: observer-mcp
spec:
  selector:
    app: observer-mcp
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
# Tailnet-only MCP endpoint: https://observer-mcp.tail717ba0.ts.net/mcp
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observer-mcp
  namespace: ops
  annotations:
    tailscale.com/hostname: observer-mcp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: observer-mcp
      port:
        number: 80
  tls:
    - hosts:
        - observer-mcp
