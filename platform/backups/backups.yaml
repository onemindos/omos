# OneMind Cluster Backups — added 2026-09-09
# Nightly CronJobs for all stateful services with no previous backup coverage.
# Target: DO Spaces bucket onemind-backups (nyc3)
# Credentials: backup-s3-creds Secret (per-namespace) + SealedSecrets for GitOps
#
# Services covered:
#   1. takserver-postgresql (TAK CoT database)        02:00 UTC
#   2. geo-db PostGIS (geo/routing data)              02:30 UTC
#   3. ClickHouse onemind (events/time-series)        03:00 UTC
#   4. NATS JetStream snapshot                        03:30 UTC
# ─────────────────────────────────────────────────────────────────────────────
# NOTE: backup-s3-creds Secrets below contain plaintext credentials.
# These should be converted to SealedSecrets before committing to git.
# Credentials stored in 1P: "DO Spaces Backup Key (onemind-backups)"
# ─────────────────────────────────────────────────────────────────────────────

