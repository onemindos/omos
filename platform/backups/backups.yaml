# ─── 1. TAK PostgreSQL ────────────────────────────────────────────────────────
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-takserver-postgres
  namespace: takserver
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: docker.io/library/postgres:15
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 512Mi}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: takserver-postgresql
                      key: postgres-password
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: SECRET_KEY
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  DATE=$(date +%Y-%m-%d)
                  DUMP_FILE="/tmp/tak-cot-${DATE}.sql.gz"
                  echo "[$(date)] Dumping takserver postgres..."
                  pg_dump -h takserver-postgresql -U postgres cot | gzip > "$DUMP_FILE"
                  SIZE=$(du -h "$DUMP_FILE" | cut -f1)
                  echo "[$(date)] Dump complete: $SIZE — uploading..."
                  S3_KEY="backups/takserver-postgres/${DATE}/cot.sql.gz"
                  DATE_HDR=$(date -R)
                  CT="application/gzip"
                  SIG_STR="PUT\n\n${CT}\n${DATE_HDR}\n/onemind-backups/${S3_KEY}"
                  SIG=$(printf "$SIG_STR" | openssl sha1 -hmac "$S3_SECRET_KEY" -binary | base64)
                  HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                    -H "Date: ${DATE_HDR}" -H "Content-Type: ${CT}" \
                    -H "Authorization: AWS ${S3_ACCESS_KEY}:${SIG}" \
                    --data-binary "@${DUMP_FILE}" \
                    "https://onemind-backups.nyc3.digitaloceanspaces.com/${S3_KEY}")
                  if [ "$HTTP" = "200" ]; then
                    echo "[$(date)] SUCCESS: s3://onemind-backups/${S3_KEY} ($SIZE)"
                  else
                    echo "[$(date)] FAILED: HTTP $HTTP" && exit 1
                  fi

# ─── 2. Geo PostGIS ───────────────────────────────────────────────────────────
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-geo-postgres
  namespace: geo
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: docker.io/postgis/postgis:15-3.4
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 512Mi}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: geo-db-secret
                      key: POSTGRES_PASSWORD
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: geo-db-secret
                      key: POSTGRES_USER
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: SECRET_KEY
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  DATE=$(date +%Y-%m-%d)
                  DUMP_FILE="/tmp/geo-db-${DATE}.sql.gz"
                  echo "[$(date)] Dumping geo-db postgres..."
                  pg_dump -h geo-db -U "$PGUSER" | gzip > "$DUMP_FILE"
                  SIZE=$(du -h "$DUMP_FILE" | cut -f1)
                  S3_KEY="backups/geo-postgres/${DATE}/geo-db.sql.gz"
                  DATE_HDR=$(date -R)
                  CT="application/gzip"
                  SIG_STR="PUT\n\n${CT}\n${DATE_HDR}\n/onemind-backups/${S3_KEY}"
                  SIG=$(printf "$SIG_STR" | openssl sha1 -hmac "$S3_SECRET_KEY" -binary | base64)
                  HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                    -H "Date: ${DATE_HDR}" -H "Content-Type: ${CT}" \
                    -H "Authorization: AWS ${S3_ACCESS_KEY}:${SIG}" \
                    --data-binary "@${DUMP_FILE}" \
                    "https://onemind-backups.nyc3.digitaloceanspaces.com/${S3_KEY}")
                  [ "$HTTP" = "200" ] && echo "SUCCESS: $S3_KEY ($SIZE)" || { echo "FAILED: HTTP $HTTP"; exit 1; }

# ─── 3. ClickHouse ────────────────────────────────────────────────────────────
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-clickhouse
  namespace: clickhouse
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ch-backup
              image: docker.io/clickhouse/clickhouse-server:24.8
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits: {memory: 1Gi}
              env:
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: SECRET_KEY
                - name: CH_USER
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-backup-creds
                      key: CH_USER
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-backup-creds
                      key: CH_PASSWORD
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  DATE=$(date +%Y-%m-%d)
                  echo "[$(date)] Running ClickHouse backup to S3..."
                  clickhouse-client \
                    --host chi-onemind-onemind-0-0.clickhouse \
                    --port 9000 \
                    --user "${CH_USER}" \
                    --password "${CH_PASSWORD}" \
                    --query "BACKUP DATABASE onemind TO S3('https://nyc3.digitaloceanspaces.com/onemind-backups/backups/clickhouse/${DATE}/', '${S3_ACCESS_KEY}', '${S3_SECRET_KEY}')"
                  echo "[$(date)] ClickHouse backup complete: backups/clickhouse/${DATE}/"

# ─── 4. NATS JetStream snapshot ───────────────────────────────────────────────
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-nats-streams
  namespace: nats
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nats-backup
              image: docker.io/natsio/nats-box:0.14.5
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 256Mi}
              env:
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-s3-creds
                      key: SECRET_KEY
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE=$(date +%Y-%m-%d)
                  BACKUP_DIR="/tmp/nats-backup-${DATE}"
                  mkdir -p "$BACKUP_DIR"
                  echo "[$(date)] Snapshotting NATS JetStream streams..."
                  # List and backup each stream
                  nats --server nats://nats:4222 stream ls --names 2>/dev/null | while read STREAM; do
                    [ -z "$STREAM" ] && continue
                    echo "  Backing up stream: $STREAM"
                    nats --server nats://nats:4222 stream backup "$STREAM" "${BACKUP_DIR}/${STREAM}" 2>/dev/null || \
                      echo "  WARNING: backup failed for $STREAM"
                  done
                  # Tar + upload
                  tar -czf "/tmp/nats-streams-${DATE}.tar.gz" -C /tmp "nats-backup-${DATE}/"
                  SIZE=$(du -h "/tmp/nats-streams-${DATE}.tar.gz" | cut -f1)
                  S3_KEY="backups/nats-streams/${DATE}/streams.tar.gz"
                  DATE_HDR=$(date -R)
                  CT="application/gzip"
                  SIG_STR="PUT\n\n${CT}\n${DATE_HDR}\n/onemind-backups/${S3_KEY}"
                  SIG=$(printf "$SIG_STR" | openssl sha1 -hmac "$S3_SECRET_KEY" -binary | base64)
                  HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                    -H "Date: ${DATE_HDR}" -H "Content-Type: ${CT}" \
                    -H "Authorization: AWS ${S3_ACCESS_KEY}:${SIG}" \
                    --data-binary "@/tmp/nats-streams-${DATE}.tar.gz" \
                    "https://onemind-backups.nyc3.digitaloceanspaces.com/${S3_KEY}")
                  [ "$HTTP" = "200" ] && echo "SUCCESS: $S3_KEY ($SIZE)" || { echo "FAILED: HTTP $HTTP"; exit 1; }
