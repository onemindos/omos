apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-takserver-postgres
  namespace: takserver
spec:
  schedule: 0 2 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: platform-backup
            backup-kind: postgres
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/onemindos/platform-backup@sha256:236250e0cb4165cb94ec7b22ab926ad4307ad435a430e5ef867acce93b6d8d30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - secretRef:
                name: platform-backup-credentials
            env:
            - name: BACKUP_KIND
              value: postgres
            - name: BACKUP_PREFIX
              value: backups/takserver-postgres
            - name: S3_REGION
              value: nyc3
            - name: PGHOST
              value: takserver-postgresql
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: cot
            - name: PGCONNECT_TIMEOUT
              value: '15'
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: takserver-postgresql
                  key: postgres-password
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 8Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 40Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 40Gi
          - name: restore-data
            emptyDir:
              sizeLimit: 20Gi
          initContainers:
          - name: restore-postgis
            image: postgis/postgis:15-3.4@sha256:3f4a5d48e0be9580ed70ed618cd039ce57bbb2dd113053d3836e28513f1f87cd
            restartPolicy: Always
            args:
            - postgres
            - -c
            - listen_addresses=127.0.0.1
            - -p
            - '15432'
            env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /restore/data
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            startupProbe:
              exec:
                command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - '15432'
                - -U
                - postgres
              periodSeconds: 5
              failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 12Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 20Gi
            volumeMounts:
            - name: restore-data
              mountPath: /restore
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-clickhouse
  namespace: clickhouse
spec:
  schedule: 0 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: ch-backup
            image: docker.io/clickhouse/clickhouse-server:24.8
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
            env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-s3-creds
                  key: ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-s3-creds
                  key: SECRET_KEY
            - name: CH_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-backup-creds
                  key: CH_USER
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-backup-creds
                  key: CH_PASSWORD
            command:
            - /bin/bash
            - -c
            - "set -e\nDATE=$(date +%Y-%m-%d)\necho \"[$(date)] Running ClickHouse\
              \ backup to S3...\"\nclickhouse-client \\\n  --host chi-onemind-onemind-0-0.clickhouse\
              \ \\\n  --port 9000 \\\n  --user \"${CH_USER}\" \\\n  --password \"\
              ${CH_PASSWORD}\" \\\n  --query \"BACKUP DATABASE onemind TO S3('https://nyc3.digitaloceanspaces.com/onemind-backups/backups/clickhouse/${DATE}/',\
              \ '${S3_ACCESS_KEY}', '${S3_SECRET_KEY}')\"\necho \"[$(date)] ClickHouse\
              \ backup complete: backups/clickhouse/${DATE}/\"\n"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-nats-streams
  namespace: nats
spec:
  schedule: 30 3 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: platform-backup
            backup-kind: nats
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/onemindos/platform-backup@sha256:236250e0cb4165cb94ec7b22ab926ad4307ad435a430e5ef867acce93b6d8d30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - secretRef:
                name: platform-backup-credentials
            env:
            - name: BACKUP_KIND
              value: nats
            - name: BACKUP_PREFIX
              value: backups/nats-onemind
            - name: S3_REGION
              value: nyc3
            - name: NATS_URL
              value: tls://nats.nats.svc.cluster.local:4222
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: onemind-user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-creds
                  key: onemind-password
            - name: NATS_CA
              value: /nats-ca/ca.crt
            - name: NATS_TIMEOUT
              value: 10m
            - name: GOMEMLIMIT
              value: 768MiB
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 8Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 40Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nats-ca
              mountPath: /nats-ca
              readOnly: true
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 40Gi
          - name: nats-ca
            secret:
              secretName: nats-server-tls
              items:
              - key: ca.crt
                path: ca.crt
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
  suspend: false
