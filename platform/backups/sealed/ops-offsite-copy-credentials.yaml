# ============================================================================
# PLACEHOLDER - NOT REAL ENCRYPTED DATA - DO NOT RELY ON THIS FOR RESTORES
# ============================================================================
# This SealedSecret exists only so that `sealed/ops-offsite-copy-credentials.yaml`
# is already listed in platform/backups/kustomization.yaml: every Git-side wiring
# for `backup-offsite-copy` (namespace `ops`) is done except the real credentials.
#
# The four values below are human-readable marker text, not kubeseal output
# (real SealedSecret values are ~400+ char base64 blobs starting with "Ag").
# The sealed-secrets controller CANNOT unseal them: if this file were applied
# as-is, the controller reports an unseal error and creates NO Secret, so the
# CronJob stays without credentials and runs nothing (it is `suspend: true`).
#
# Owner action (REMAINING-STEPS.md / OFFSITE-COPY.md step 4): overwrite THIS
# file with the output of:
#   kubectl create secret generic offsite-copy-credentials -n ops \
#     --from-file=RCLONE_CONFIG_SRC_ACCESS_KEY_ID=./src-id ... -o json \
#     | kubeseal --cert /tmp/pub-cert.pem --format yaml --scope namespace-wide \
#     > platform/backups/sealed/ops-offsite-copy-credentials.yaml
# Then, in the same commit, set `suspend: false` on `backup-offsite-copy` and
# remove the onemind.io/backup-state / onemind.io/pending-reason annotations.
# ============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: offsite-copy-credentials
  namespace: ops
  annotations:
    # Scope matches the kubeseal command in OFFSITE-COPY.md step 4.
    sealedsecrets.bitnami.com/namespace-wide: 'true'
    # Marker for humans and tooling: this object is a staged placeholder.
    onemind.io/placeholder: 'pending real kubeseal output (REMAINING-STEPS.md)'
spec:
  encryptedData:
    # Marker text on purpose; see the header comment. Never paste plaintext
    # key material here - only overwritten-by-kubeseal output belongs in Git.
    RCLONE_CONFIG_SRC_ACCESS_KEY_ID: 'NOT REAL YET - owner runs kubeseal (step 4)'
    RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: 'NOT REAL YET - owner runs kubeseal (step 4)'
    RCLONE_CONFIG_DST_ACCESS_KEY_ID: 'NOT REAL YET - owner runs kubeseal (step 4)'
    RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: 'NOT REAL YET - owner runs kubeseal (step 4)'
  template:
    metadata:
      name: offsite-copy-credentials
      namespace: ops
    type: Opaque
