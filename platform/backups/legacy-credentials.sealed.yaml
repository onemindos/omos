kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: backup-s3-creds
  namespace: nats
spec:
  template:
    metadata:
      name: backup-s3-creds
      namespace: nats
      annotations:
        sealedsecrets.bitnami.com/managed: 'true'
    type: Opaque
  encryptedData:
    ACCESS_KEY: 
    BUCKET: 
    ENDPOINT: 
    SECRET_KEY: 
