# Retained recovery assets from the retired OpenSearch/OpenChoreo services.
# No application workload is restored. Preserve data and encryption material until
# a separately reviewed retirement disposes of the recovery copies.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: readiness-20261009-bf5e2b142d4b
  namespace: onemind-search
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
  labels:
    onemind.io/lifecycle: retained-recovery
spec:
  source:
    persistentVolumeClaimName: onemind-search-master-onemind-search-master-0
  volumeSnapshotClassName: onemind-backup-retain
