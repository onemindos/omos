apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres-auth
  namespace: auth
spec:
  schedule: 0 5 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: platform-backup
            backup-kind: postgres
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
          - name: ghcr
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: backup
            image: ghcr.io/onemindos/platform-backup@sha256:de795f12b6295d0db5cbe803c11cc4db38678670f4ec8cf7951484a090a7f863
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            envFrom:
            - secretRef:
                name: platform-backup-credentials
            env:
            - name: BACKUP_KIND
              value: postgres
            - name: BACKUP_PREFIX
              value: backups/postgres-auth
            - name: S3_REGION
              value: nyc3
            - name: PGHOST
              value: authentik-postgres
            - name: PGUSER
              value: authentik
            - name: PGDATABASE
              value: authentik
            - name: PGCONNECT_TIMEOUT
              value: '15'
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: POSTGRES_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 8Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 8Gi
          - name: restore-data
            emptyDir:
              sizeLimit: 10Gi
          initContainers:
          - name: restore-postgres
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
            restartPolicy: Always
            args:
            - postgres
            - -c
            - listen_addresses=127.0.0.1
            - -p
            - '15432'
            env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /restore/data
            securityContext:
              runAsUser: 70
              runAsGroup: 70
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            startupProbe:
              exec:
                command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - '15432'
                - -U
                - postgres
              periodSeconds: 5
              failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: '2'
                memory: 1Gi
                ephemeral-storage: 10Gi
            volumeMounts:
            - name: restore-data
              mountPath: /restore
  timeZone: Etc/UTC
  startingDeadlineSeconds: 3600
---
