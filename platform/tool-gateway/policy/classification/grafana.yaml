# Tool classification for target `grafana` (grafana/mcp-grafana 2.2.0, run with -disable-write): conservative read-only start.
# The 63 names of the server's own `tools/list` with -disable-write, read from the pinned image on 2026-11-04, minus five that are NOT
# exposed even though the server marks them read-only: grafana_api_request (a generic API passthrough), alerting_manage_routing,
# get_panel_image and render_grafana_app (image output), validate_provisioning_file. They stay unlisted (hidden everywhere).
# Writes (annotations, dashboards, silences) are off in the backend; to turn them on remove -disable-write in the backend Deployment, then run
#   python scripts/gateway/classify_tools.py --target grafana --url <port-forwarded mcp-grafana /mcp> --key-env <none> --write
# review the proposals, and put delete_* into destructive.
