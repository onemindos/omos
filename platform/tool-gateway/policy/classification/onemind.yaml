# Tool classification for gateway target 'onemind'. Reviewed in Git; unlisted = destructive (hidden).
# Schema and rules: scripts/gateway/classification.py. Refresh: scripts/gateway/classify_tools.py.
target: onemind
read:
- alertmanager_alerts
- apps_describe
- apps_list
- argocd_application
- argocd_applications
- backstage_entities
- backstage_entity
- grafana_dashboards
- litellm_models
- loki_query
- mediamtx_paths
- nats_jetstream_stats
- nats_server_stats
- ollama_models
- ollama_running_models
- opencost_allocation
- prometheus_query
- stac_collections
- stac_search
- tempo_trace
- tile38_get
- tile38_keys
- tile38_nearby
- tile38_scan
- tile38_server
- tile38_within
# Read only by construction, except tile38 (adapter services/onemind-mcp/onemind_mcp/adapters/tile38.py).
# tile38_set_point is registered only when the app has allow_writes; the two destructive tools only with allow_destructive,
# which stays off until the execute gate (Phase 4) exists.
write:
- tile38_set_point
destructive:
- tile38_delete_object
- tile38_drop_collection
physical: []
