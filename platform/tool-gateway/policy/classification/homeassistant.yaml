# Tool classification for target `homeassistant` (HA Assist API over MCP): conservative start, worst case by name because argument guards
# do not work in v1.7.0. GetLiveContext only reads state. Every Hass* intent tool (HassTurnOn, HassTurnOff, HassLightSet, HassOpenCover,
# HassLockLock, ...) can reach a lock, door, garage or alarm depending on the entity it is given, so all of them are physical: the owner types
# `override <id>` for each call. Relax per tool after the first live `tools/list` and an exposure review (design section 3.1).
target: homeassistant
read:
- GetLiveContext
write: []
destructive: []
physical:
- Hass*
