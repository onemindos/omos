# Tool classification for target `github` (github-mcp-server v2.1.0, remote /mcp/readonly): conservative read-only start.
# The read list is every tool whose readOnlyHint is true in pkg/github/__toolsnaps__ at v2.1.0 (2026-11-04), minus feature-flagged tools
# (*_ff_*), ui_get, and the secret-scanning tools (get_secret_scanning_alert, list_secret_scanning_alerts return secret material).
# Writes are not offered by the /readonly endpoint. Named destructive/physical-style tools are listed so they can only appear on /execute.
# After the token exists, verify the remote's real list: classify_tools.py --target github --url ... (see docs/operations/tool-gateway.md).
target: github
read:
- actions_get
- actions_list
- get_code_quality_finding
- get_code_scanning_alert
- get_commit
- get_dependabot_alert
- get_discussion
- get_discussion_comments
- get_file_blame
- get_file_contents
- get_gist
- get_global_security_advisory
- get_job_logs
- get_label
- get_latest_release
- get_me
- get_notification_details
- get_release_by_tag
- get_repository_tree
- get_tag
- get_team_members
- get_teams
- issue_read
- list_branches
- list_code_scanning_alerts
- list_commits
- list_dependabot_alerts
- list_discussion_categories
- list_discussions
- list_gists
- list_global_security_advisories
- list_issue_types
- list_issues
- list_label
- list_notifications
- list_org_repository_security_advisories
- list_pull_requests
- list_releases
- list_repository_collaborators
- list_repository_security_advisories
- list_starred_repositories
- list_tags
- projects_get
- projects_list
- pull_request_read
- repository_ruleset_read
- search_code
- search_commits
- search_issues
- search_orgs
- search_pull_requests
- search_repositories
- search_users
