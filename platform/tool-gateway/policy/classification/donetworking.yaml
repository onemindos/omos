# Tool classification for target `donetworking` (DigitalOcean hosted MCP, v1.6.5): conservative read-only start.
# Names come from the tool registrations in pkg/registry at v1.6.5 (2026-11-04). Not exposed on purpose: doks-get-kubeconfig and
# doks-get-credentials (they return cluster credentials), every create/update tool. The remote list is not verified until the token exists:
#   python scripts/gateway/classify_tools.py --target donetworking --url https://<service>.mcp.digitalocean.com/mcp --key-env DO_TOKEN
target: donetworking
read:
- domain-get
- domain-list
- domain-record-get
- domain-record-list
- firewall-get
- firewall-list
write: []
destructive:
- domain-delete
- domain-record-delete
- firewall-delete
- firewall-remove-rules
physical: []
