# Tool classification for target `doapps` (DigitalOcean hosted MCP, v1.6.5): conservative read-only start.
# Names come from the tool registrations in pkg/registry at v1.6.5 (2026-11-04). Not exposed on purpose: doks-get-kubeconfig and
# doks-get-credentials (they return cluster credentials), every create/update tool. The remote list is not verified until the token exists:
#   python scripts/gateway/classify_tools.py --target doapps --url https://<service>.mcp.digitalocean.com/mcp --key-env DO_TOKEN
target: doapps
read:
- apps-get-deployment-status
- apps-get-info
- apps-get-logs
- apps-list
write: []
destructive:
- apps-delete
physical: []
