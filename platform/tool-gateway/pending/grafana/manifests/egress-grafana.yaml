# Gateway egress to the mcp-grafana backend.
# Activated (moved to manifests/) by scripts/gateway/keys-session.sh when gateway-target-grafana is sealed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-egress-grafana
  namespace: tool-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: agentgateway
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mcp-grafana
    ports:
    - {protocol: TCP, port: 8000}
