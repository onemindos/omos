# Gateway egress to n8n (instance-level MCP server on :5678).
# Activated (moved to manifests/) by scripts/gateway/keys-session.sh when gateway-target-n8n is sealed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-egress-n8n
  namespace: tool-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: agentgateway
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: n8n
      podSelector:
        matchLabels:
          app: n8n
    ports:
    - {protocol: TCP, port: 5678}
