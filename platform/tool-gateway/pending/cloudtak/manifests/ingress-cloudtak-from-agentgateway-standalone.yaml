# cloudtak-api admits the tool gateway pod on :5000.
# NetworkPolicies are additive: this adds one allowed source and does not change the existing policies in cloudtak.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tool-gateway-agentgateway-standalone
  namespace: cloudtak
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: cloudtak
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tool-gateway
      podSelector:
        matchLabels:
          app.kubernetes.io/name: agentgateway-standalone
    ports:
    - {protocol: TCP, port: 5000}
