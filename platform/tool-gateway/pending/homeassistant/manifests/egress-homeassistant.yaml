# Gateway egress to Home Assistant through the tailnet egress proxy (as onemind-hermes does).
# Activated (moved to manifests/) by scripts/gateway/keys-session.sh when gateway-target-homeassistant is sealed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-egress-homeassistant
  namespace: tool-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: agentgateway
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
      podSelector:
        matchLabels:
          tailscale.com/parent-resource: omos-ha-edge
          tailscale.com/parent-resource-ns: hermes
          tailscale.com/parent-resource-type: svc
    ports:
    - {protocol: TCP, port: 8123}
