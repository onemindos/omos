# mcp-argocd: ingress from the gateway only, egress to DNS and the argocd API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-argocd
  namespace: tool-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-argocd
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: agentgateway-standalone
          app.kubernetes.io/instance: agentgateway
    ports:
    - {protocol: TCP, port: 3000}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
      podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server
    ports:
    - {protocol: TCP, port: 8080}
