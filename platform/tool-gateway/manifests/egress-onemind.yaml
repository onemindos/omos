# Gateway egress to target `onemind` (the existing adapters). Needs the matching ingress rule in
# platform/hermes/mcp/network-policy.yaml. Egress ports are destination pod ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-egress-onemind
  namespace: tool-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: agentgateway
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
      podSelector:
        matchLabels:
          app.kubernetes.io/name: onemind-mcp
    ports:
    - {protocol: TCP, port: 8000}
