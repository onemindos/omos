# Kubernetes MCP server behind the tool gateway (target `kubernetes`, group `ops`). Own Deployment, not a sidecar: it holds a ServiceAccount
# with write verbs that the gateway pod must not have. No credential of its own to reach it; the NetworkPolicy (network.yaml) lets only the
# gateway pod connect. Image: containers/kubernetes-mcp-server v0.1.1, multi-arch index digest resolved 2026-10-30
# (ghcr.io and quay.io/containers/kubernetes_mcp_server carry the same digest).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubernetes
  namespace: tool-gateway
  labels:
    app.kubernetes.io/name: mcp-kubernetes
    app.kubernetes.io/part-of: tool-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-kubernetes
        app.kubernetes.io/part-of: tool-gateway
    spec:
      serviceAccountName: k8s-operator
      automountServiceAccountToken: true # the API credential this server exists to use
      nodeSelector:
        onemind.io/compute-role: ecosystem
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: mcp-kubernetes
        image: ghcr.io/containers/kubernetes-mcp-server:v0.1.1@sha256:d616331a99184d42f7471eac5ae257192e7065bb684ad115cc95c2e76cfbc2d1
        imagePullPolicy: IfNotPresent
        args: [--config, /etc/kubernetes-mcp-server/config.toml]
        ports:
        - {name: mcp, containerPort: 8080, protocol: TCP}
        - {name: metrics, containerPort: 9090, protocol: TCP}
        readinessProbe:
          httpGet: {path: /healthz, port: mcp}
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: mcp}
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          # Idle footprint is a few tens of MiB; list calls are capped at 4 MiB per API response (max_backend_response_bytes).
          # Re-measure after the first week of use.
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: config, mountPath: /etc/kubernetes-mcp-server, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: config
        configMap:
          name: mcp-kubernetes-config
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-kubernetes
  namespace: tool-gateway
  labels:
    app.kubernetes.io/name: mcp-kubernetes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-kubernetes
  ports:
  - {name: mcp, port: 8080, targetPort: mcp, protocol: TCP}
