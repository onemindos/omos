# Official ClickHouse MCP server (ClickHouse/mcp-clickhouse 0.7.0) for gateway target `clickhouse`.
# Read-only twice: CLICKHOUSE_ALLOW_WRITE_ACCESS stays unset (readonly=1 per query) and the ClickHouse user
# legacy_ro has profile readonly=1 (platform/data/clickhouse/clickhouse.yaml). The MCP endpoint needs the
# bearer in Secret gateway-target-clickhouse, which the gateway sends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-clickhouse
  namespace: tool-gateway
  labels:
    app.kubernetes.io/name: mcp-clickhouse
    app.kubernetes.io/part-of: tool-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-clickhouse
        app.kubernetes.io/part-of: tool-gateway
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        onemind.io/compute-role: ecosystem
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: mcp-clickhouse
        # 0.7.0 multi-arch index digest, resolved 2026-10-30.
        image: ghcr.io/clickhouse/mcp-clickhouse:0.7.0@sha256:4102cb2db1431646b692fe281ac2925291df4a843d2954e9ac980677c9585c31
        imagePullPolicy: IfNotPresent
        ports:
        - {name: mcp, containerPort: 8000}
        env:
        - {name: HOME, value: /tmp}
        - {name: CLICKHOUSE_HOST, value: clickhouse-onemind.clickhouse.svc.cluster.local}
        - {name: CLICKHOUSE_PORT, value: "8123"}
        - {name: CLICKHOUSE_SECURE, value: "false"}
        - {name: CLICKHOUSE_VERIFY, value: "false"}
        - {name: CLICKHOUSE_USER, value: legacy_ro}
        - name: CLICKHOUSE_PASSWORD
          valueFrom: {secretKeyRef: {name: mcp-clickhouse-credentials, key: password}}
        - name: CLICKHOUSE_MCP_AUTH_TOKEN
          valueFrom: {secretKeyRef: {name: gateway-target-clickhouse, key: token}}
        - {name: CLICKHOUSE_MCP_SERVER_TRANSPORT, value: http}
        - {name: CLICKHOUSE_MCP_BIND_HOST, value: 0.0.0.0}
        - {name: CLICKHOUSE_MCP_BIND_PORT, value: "8000"}
        # The gateway sends the Host header without the port.
        - name: CLICKHOUSE_MCP_ALLOWED_HOSTS
          value: mcp-clickhouse.tool-gateway.svc.cluster.local,mcp-clickhouse.tool-gateway.svc.cluster.local:8000
        - {name: CLICKHOUSE_MCP_QUERY_TIMEOUT, value: "30"}
        - {name: CLICKHOUSE_MCP_MAX_WORKERS, value: "4"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        readinessProbe:
          httpGet: {path: /health, port: mcp}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: mcp}
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 500m, memory: 384Mi}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-clickhouse
  namespace: tool-gateway
  labels:
    app.kubernetes.io/name: mcp-clickhouse
spec:
  selector:
    app.kubernetes.io/name: mcp-clickhouse
  ports:
  - {name: mcp, port: 8000, targetPort: mcp}
