# Gateway egress to target `clickhouse` (Deployment mcp-clickhouse in this namespace; its ingress rule is in backends/clickhouse/network.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-egress-clickhouse
  namespace: tool-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentgateway-standalone
      app.kubernetes.io/instance: agentgateway
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mcp-clickhouse
    ports:
    - {protocol: TCP, port: 8000}
