            mbpsMaxBW:
              type: number
              format: double
              description: Transmission bandwidth limit, in Mbps
            mbpsReceiveRate:
              type: number
              format: double
              description: Current receiving bandwidth, in Mbps
            mbpsSendRate:
              type: number
              format: double
              description: Current transmission bandwidth, in Mbps
            msRTT:
              type: number
              format: double
              description: Smoothed round-trip time (SRTT), an exponentially-weighted moving average (EWMA) of an endpoint's RTT
                samples, in milliseconds
            msReceiveBuf:
              type: integer
              format: uint64
              description: The timespan (msec) of acknowledged packets in the receiver's buffer
            msReceiveTsbPdDelay:
              type: integer
              format: uint64
              description: Timestamp-based Packet Delivery Delay value set on the socket via SRTO_RCVLATENCY or SRTO_LATENCY
            msSendBuf:
              type: integer
              format: uint64
              description: The timespan (msec) of packets in the sender's buffer (unacknowledged packets)
            msSendTsbPdDelay:
              type: integer
              format: uint64
              description: Timestamp-based Packet Delivery Delay value of the peer
            outboundFramesDiscarded:
              type: integer
              format: uint64
            packetsFlightSize:
              type: integer
              format: uint64
              description: The number of packets in flight
            packetsFlowWindow:
              type: integer
              format: uint64
              description: The maximum number of packets that can be "in flight"
            packetsReceiveBuf:
              type: integer
              format: uint64
              description: The number of acknowledged packets in receiver's buffer
            packetsReceived:
              type: integer
              format: uint64
              description: The total number of received DATA packets, including retransmitted packets
            packetsReceivedACK:
              type: integer
              format: uint64
              description: The total number of received ACK (Acknowledgement) control packets
            packetsReceivedAvgBelatedTime:
              type: integer
              format: uint64
              description: Accumulated difference between the current time and the time-to-play of a packet that is received late
            packetsReceivedBelated:
              type: integer
              format: uint64
            packetsReceivedDrop:
              type: integer
              format: uint64
              description: The total number of dropped by the SRT receiver and, as a result, not delivered to the upstream application
                DATA packets
            packetsReceivedKM:
              type: integer
              format: uint64
              description: The total number of received KM (Key Material) control packets
            packetsReceivedLoss:
              type: integer
              format: uint64
              description: The total number of SRT DATA packets detected as presently missing (either reordered or lost) at the
                receiver side
            packetsReceivedLossRate:
              type: number
              format: double
              description: Percentage of retransmitted data vs. received data
            packetsReceivedNAK:
              type: integer
              format: uint64
              description: The total number of received NAK (Negative Acknowledgement) control packets
            packetsReceivedRetrans:
              type: integer
              format: uint64
              description: The total number of retransmitted packets registered at the receiver side
            packetsReceivedUndecrypt:
              type: integer
              format: uint64
              description: The total number of packets that failed to be decrypted at the receiver side
            packetsReceivedUnique:
              type: integer
              format: uint64
              description: The total number of unique original, retransmitted or recovered by the packet filter DATA packets received
                in time, decrypted without errors and, as a result, scheduled for delivery to the upstream application by the
                SRT receiver.
            packetsReorderTolerance:
              type: integer
              format: uint64
              description: Instant value of the packet reorder tolerance
            packetsRetrans:
              type: integer
              format: uint64
              description: The total number of retransmitted packets sent by the SRT sender
            packetsSendBuf:
              type: integer
              format: uint64
              description: The number of packets in the sender's buffer that are already scheduled for sending or even possibly
                sent, but not yet acknowledged
            packetsSendDrop:
              type: integer
              format: uint64
              description: The total number of dropped by the SRT sender DATA packets that have no chance to be delivered in time
            packetsSendLoss:
              type: integer
              format: uint64
              description: The total number of data packets considered or reported as lost at the sender side. Does not correspond
                to the packets detected as lost at the receiver side.
            packetsSendLossRate:
              type: number
              format: double
              description: Percentage of resent data vs. sent data
            packetsSent:
              type: integer
              format: uint64
              description: The total number of sent DATA packets, including retransmitted packets
            packetsSentACK:
              type: integer
              format: uint64
              description: The total number of sent ACK (Acknowledgement) control packets
            packetsSentKM:
              type: integer
              format: uint64
              description: The total number of sent KM (Key Material) control packets
            packetsSentNAK:
              type: integer
              format: uint64
              description: The total number of sent NAK (Negative Acknowledgement) control packets
            packetsSentUnique:
              type: integer
              format: uint64
              description: The total number of unique DATA packets sent by the SRT sender
            path:
              type: string
            query:
              type: string
            remoteAddr:
              type: string
            state:
