            bytesRetrans:
              type: integer
              format: uint64
              description: Same as packetsRetrans, but expressed in bytes, including payload and all the headers (IP, TCP, SRT)
            bytesSendBuf:
              type: integer
              format: uint64
              description: Instantaneous (current) value of packetsSndBuf, but expressed in bytes, including payload and all headers
                (IP, TCP, SRT)
            bytesSendDrop:
              type: integer
              format: uint64
              description: Same as packetsSendDrop, but expressed in bytes, including payload and all the headers (IP, TCP, SRT)
            bytesSent:
              type: integer
              format: uint64
              description: Same as packetsSent, but expressed in bytes, including payload and all the headers (IP, TCP, SRT)
            bytesSentUnique:
              type: integer
              format: uint64
              description: Same as packetsSentUnique, but expressed in bytes, including payload and all the headers (IP, TCP,
                SRT)
