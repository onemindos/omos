# Inputs of scripts/gateway/render_gateway_config.py (output: values.generated.yaml).
# Design: docs/architecture/onemind-tool-gateway.md. Runbook: docs/operations/tool-gateway.md.
port: 8080
# A route with no live target answers initialize with a 500, so a group that has nothing to expose borrows this target
# to answer with an empty tool list; the route's deny-all rule hides and denies every tool of it. Must be a live target.
anchor: onemind
# One entry per client. The key itself lives in Secret `secret` (SealedSecret in manifests/).
clients:
  hermes:
    env: GATEWAY_KEY_HERMES
    secret: gateway-clients
    key: hermes
# One MCP endpoint per group. kind: group (default) exposes the read and write tools of its targets; deferred is
# deny-all with no targets (off until asked for); execute is deny-all until the Phase 4 gate wires extAuthz and
# carries every target that has destructive or physical tools (derived, never listed in a fragment).
groups:
  ops:
    path: /ops/mcp
    clients: [hermes]
    prefixMode: always # tools appear as <target>_<tool>
    failureMode: failOpen # a dead target must not fail initialize for the whole group
  dev:
    path: /dev/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
  cloud:
    path: /cloud/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
  data:
    path: /data/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
  tak:
    path: /tak/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
  home:
    path: /home/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
  work:
    path: /work/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
  identity:
    kind: deferred
    path: /identity/mcp
    clients: [hermes]
  execute:
    kind: execute
    path: /execute/mcp
    clients: [hermes]
    prefixMode: always
    failureMode: failOpen
