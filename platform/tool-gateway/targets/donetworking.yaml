# DigitalOcean hosted MCP endpoint `networking` (networking; digitalocean-labs/mcp-digitalocean v1.6.5). No pod.
# One Personal Access Token for all DigitalOcean targets (Secret gateway-target-digitalocean, key token): custom scopes, read plus
# chosen create/update, NO delete scopes, so a mistaken classification still cannot delete.
name: donetworking
groups: [cloud]
enabled_by: [gateway-target-digitalocean]
env:
  TARGET_DONETWORKING_TOKEN: {secret: gateway-target-digitalocean, key: token}
target:
  mcp:
    host: https://networking.mcp.digitalocean.com/mcp
  policies:
    backendAuth:
      key: "${TARGET_DONETWORKING_TOKEN}"
