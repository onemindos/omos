# Login for the stac database role on onemind-data. Generated at random and sealed in the PR that added STAC;
# nobody has seen the value. The same password is sealed for the role itself in
# platform/ecosystem/resources/secrets/onemind-data--db-stac.json. To rotate, reseal both and restart the stac pods.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: stac-db
  namespace: stac
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: stac-db
      namespace: stac
    type: Opaque
