# Installs the pinned pgstac schema in the stac database during an explicit Argo CD sync (wave 1:
# after the namespace, secret, config and NetworkPolicies of wave 0, before the Deployments of wave 2).
#
# The compatibility wrapper preserves pypgstac's complete bootstrap transaction, changing one expression
# shape that otherwise triggers the pinned AGE library's known #2256 crash. It is checksum/version guarded
# and refuses unreviewed upgrade scripts. Re-running an already-current database remains idempotent.
# Any version upgrade needs a reviewed compatibility wrapper and a fresh recoverable backup first.
#
# The database and the `stac` role come from platform/ecosystem/resources (Database CR and managed role); that
# Application runs in wave 4 and this one in wave 5. The loop waits for the database if CNPG is still creating it.
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-pgstac-migrate
  namespace: stac
  labels:
    app.kubernetes.io/name: stac
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: stac
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  # A failed migration must be investigated before another attempt on shared Postgres.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stac
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: stac
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/stac-utils/pgstac-pypgstac:v0.9.12@sha256:672faad776b55afe15fadb27589c390c4fc93de5bc73e8889d2c29a600c5dba4
          command: [bash, -ceu]
          args:
            - |
              until psql -qtAc 'select 1' >/dev/null 2>&1; do
                echo "waiting for database ${PGDATABASE} on ${PGHOST}"
                sleep 5
              done
              python3 /scripts/migrate-compat.py migrate
              # Keep each Collection's extent current as Items are added. pgstac ships this off.
              psql -v ON_ERROR_STOP=1 -qc "INSERT INTO pgstac.pgstac_settings (name, value) VALUES ('update_collection_extent', 'true') ON CONFLICT (name) DO UPDATE SET value = EXCLUDED.value"
              echo "pgstac schema version: $(pypgstac version)"
          envFrom:
            - configMapRef:
                name: stac-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: stac-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: stac-db
                  key: password
            # pgstac creates three roles (pgstac_admin, pgstac_ingest, pgstac_read) and then SETs ROLE to them.
            # PostgreSQL 16 gives a CREATEROLE user only ADMIN on the roles it creates, not the right to SET ROLE
            # to them; this makes the creating role a member with SET and INHERIT, as in PostgreSQL 15.
            - name: PGOPTIONS
              value: -c createrole_self_grant=set,inherit
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migration-compat
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: migration-compat
          configMap:
            name: stac-migration-compat
            defaultMode: 292
