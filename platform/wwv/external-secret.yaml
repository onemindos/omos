apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wwv-env
  namespace: wwv
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: wwv-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: wwv-env
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wwv-pg-credentials
  namespace: wwv
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: wwv-pg-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: wwv-pg-credentials
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: wwv-pg-credentials
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: wwv-pg-credentials
        property: POSTGRES_DB
