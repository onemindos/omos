# Existing mesh OIDC route is owned by platform-backstage; no public HTTPS egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: librechat-allowed-paths
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: librechat-pilot
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
    ports:
    - protocol: TCP
      port: 3080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
      podSelector:
        matchLabels:
          app.kubernetes.io/name: hermes
          onemind.io/agent: legacy
    ports:
    - protocol: TCP
      port: 8642
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
      podSelector:
        matchLabels:
          tailscale.com/parent-resource: egress
          tailscale.com/parent-resource-type: proxygroup
    ports:
    - protocol: TCP
      port: 443
  - to:
    - podSelector:
        matchLabels:
          onemind.io/librechat-database: 'true'
    ports:
    - protocol: TCP
      port: 27017
