apiVersion: v1
kind: Namespace
metadata:
  name: livekit
  labels:
    app.kubernetes.io/name: livekit
    onemind.io/layer: make-sense
    # Host networking is required by the upstream SFU deployment model.
    # The container itself remains non-root, unprivileged and capability-free.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
