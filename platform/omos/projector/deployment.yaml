# omos-tak-projector-gated (FEATURES A6): follows ENT and projects to TAK only the entities that
# pass every gate of onemind-xr docs/contracts/cot-projection.md section 3: alive and located,
# a CoT type row, never a person, a person-class track or an RF station, not already on TAK,
# indicators.egress_tak, the marking gate (CLEAR/GREEN; AMBER only to TAK_RELEASE_GROUPS; RED
# never), and the relevance tier (own sim-* asset, tasked or targeted in KV mission-state,
# pinned place/zone/structure, starred, or inside an active AOI from KV geofences). It caps
# the projected set (MAX_PROJECTED) and the rate (MAX_RATE_PER_SEC), sends a removal when an
# entity stops passing, and logs and refuses strike/engage CoT arriving from TAK (SL1).
# Applied only by the platform-omos-projector Application (manual sync). platform-omos does not
# read this directory (directory.recurse: false).
#
# It replaces the ent.*.*.state path of the legacy Python projector (platform/omos/
# tak-projector.yaml), which now leaves entities alone unless ENT_PROJECTION=true and keeps
# only its intel.> path. Sync prerequisites, in order
# (docs/proposals/2026-10-29-projector-aoi.md):
#   1. ENT is approved and reconciled (A4-P1) and platform-omos-entity runs. Without ENT the
#      projector falls back to a core subscription on ent.*.*.state and loses state on restart.
#   2. The owner accepts the KV geofences value shape the projector reads (A6-P2); until D1
#      writes zones, the bucket is empty and only own assets, tasked entities and pinned
#      content are projected.
#   3. The first build-tak-projector run on main pushed the image; then replace the tag below
#      with its digest (tag@sha256:...) from the workflow's image-digest artifact.
# Credentials: the existing omos-nats-creds SealedSecret (platform/omos/
# omos-nats-creds.sealedsecret.yaml, keys user/password); no new secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-tak-projector-gated
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-tak-projector-gated
    app.kubernetes.io/part-of: omos-platform
spec:
  # One replica: two would each send every CoT (TAK de-duplicates by uid, but the rate
  # ceiling would double).
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omos-tak-projector-gated
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omos-tak-projector-gated
        app.kubernetes.io/part-of: omos-platform
    spec:
      # Ecosystem pool, hard placement as platform/omos/entity/deployment.yaml and
      # platform/omos/layer/deployment.yaml do: hub-core is memory-saturated (cluster review
      # H1). The pool has no taints.
      nodeSelector:
        onemind.io/compute-role: ecosystem
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: projector
          # Pin digest after first CI build (.github/workflows/build-tak-projector.yml).
          image: ghcr.io/onemindos/omos-tak-projector:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            # cot-projection.md section 10; the values are the contract defaults for the hub.
            - name: PROJECTOR_TARGET
              value: "server"
            - name: PROJECTOR_INSTANCE
              value: "hub"
            - name: TAK_INJECT_SUBJECT
              value: "tak.cot.inject"
            - name: MIN_INTERVAL_SEC
              value: "5"
            - name: OWN_MIN_INTERVAL_SEC
              value: "1"
            - name: MAX_RATE_PER_SEC
              value: "50"
            - name: MAX_PROJECTED
              value: "500"
            - name: AOI_EXIT_GRACE_S
              value: "60"
            # Owner decision A6-P15: release AMBER and AMBER+STRICT entities marked releasable to
            # "homestead" (the entity.md example and the entity service's releasable_to default),
            # which covers own sim-* assets. Empty would project CLEAR and GREEN only.
            - name: TAK_RELEASE_GROUPS
              value: "homestead"
            - name: MAX_VERTICES
              value: "200"
            - name: ENT_STREAM
              value: "ENT"
            # svc.cot.send (services/projector/README.md): verified CLIENT users only, through
            # the share: true import of omos #562; never COT_SEND_ALLOW_UNVERIFIED here.
            # Off until owner proposal A6-P13 is applied: the legacy ONEMIND users (onemind,
            # leaf_tak) can forge Nats-Request-Info until #562 denies them publish on svc.cot.>.
            - name: COT_SEND_ENABLED
              value: "false"
            # Persistent kinds (marker/route/geofence/shape) belong to entity.create (A6-P6).
            - name: COT_SEND_PERSISTENT_KINDS
              value: "false"
            - name: COT_SEND_ACCOUNTS
              value: "CLIENT"
            - name: COT_SEND_RATE_PER_MIN
              value: "30"
            - name: COT_SEND_BURST
              value: "10"
            - name: COT_SEND_MAX_PER_SEC
              value: "10"
            - name: COT_SEND_CHAT_DEFAULT_TLP
              value: "CLEAR"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Memory holds the latest record of every ENT entity it has seen (estimate: 60,000
          # entities at about 1 to 2 KiB decoded, layer-snapshot.md section 1 counts) plus the
          # send queue, which is bounded by the entity count.
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
