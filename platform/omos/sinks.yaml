apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink-clickhouse
  namespace: omos
  labels:
    app.kubernetes.io/name: sink-clickhouse
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sink-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sink-clickhouse
        app.kubernetes.io/part-of: omos-platform
    spec:
      containers:
        - name: sink
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet nats-py && exec python3 /scripts/sink_clickhouse.py
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: CH_HOST
              value: "clickhouse-onemind.clickhouse.svc.cluster.local"
            - name: CH_PORT
              value: "8123"
            - name: CH_USER
              value: "onemind"
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-clickhouse-creds
                  key: CH_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
      volumes:
        - name: scripts
          configMap:
            name: omos-intel-scripts
---
# -----------------------------------------------------------------------------
# Sink: TAK Forwarder — intel.> → CoT XML → tak.cot.inject
# Consumes the INTEL JetStream (90d, durable=sink-tak) and publishes CoT to
# the TAK NatsBridgePlugin, which fans out to all TAK clients.
# Toggle: kubectl scale deploy/sink-tak -n omos --replicas=0
#         or publish cmd.etl.sink.tak.disable to NATS for soft pause.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink-tak
  namespace: omos
  labels:
    app.kubernetes.io/name: sink-tak
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sink-tak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sink-tak
        app.kubernetes.io/part-of: omos-platform
    spec:
      containers:
        - name: sink
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - pip install nats-py --quiet && exec python3 /scripts/sink_tak.py
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: scripts
          configMap:
            name: omos-intel-scripts
