# =============================================================================
# OMOS Feeds — Python-only feeds that require native libraries unavailable
# in Redpanda Connect (Wombat). All HTTP/WebSocket-based feeds have been
# migrated to platform/data/redpanda-connect/.
#
# Remaining:
#   feed-satellites — CelesTrak TLE + SGP4 orbital propagation (sgp4 library)
# =============================================================================

# -----------------------------------------------------------------------------
# Feed: Satellites — CelesTrak TLE + SGP4 (propagates every 30s)
# Groups: stations (ISS), military, starlink — toggle via CELESTRAK_GROUP
# SGP4 orbital mechanics requires the sgp4 Python library; not portable to Wombat.
# LEGACY (FEATURES A1): publishes CoT straight to tak.cot.inject. Its replacement,
# feed-satellites-grammar in platform/data/redpanda-connect, publishes raw TLEs on
# intel.space.celestrak.tle. `replicas` below is this feed's off switch: it goes to 0 only in
# Stage 2 of platform/data/redpanda-connect/CUTOVER.md, after the grammar pipeline has run.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-satellites
  namespace: omos
  labels:
    app.kubernetes.io/name: feed-satellites
    app.kubernetes.io/part-of: omos-feeds
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feed-satellites
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed-satellites
    spec:
      containers:
        - name: feed
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - pip install nats-py aiohttp sgp4 --quiet && exec python3 /scripts/feed_satellites.py
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: CELESTRAK_GROUP
              value: "stations"
            - name: PROPAGATE_INTERVAL
              value: "30"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: scripts
          configMap:
            name: omos-feed-scripts
