# omos-geofence-service (FEATURES D1, D6): applies policy-approved cmd.map.geofence.* commands
# to KV geofences (its only writer), publishes evt.map.geofence.{id}.{enter|exit} from
# ent.*.*.state, and raises alerts for geofence crossings, stale own assets and feed outages on
# evt.so.alert.{raised|updated|resolved}. Applied only by the platform-omos-geofence
# Application (manual sync). platform-omos does not read this directory (recurse: false).
#
# Sync prerequisites, in order (docs/proposals/2026-10-29-geofence-alert-service.md):
#   1. ENT exists (PR #552, owner proposal ONT-P1) and the entity service runs.
#   2. The owner rules D1-P1..D1-P3 (KV value, result events, alert subject); EVT already
#      stores evt.so.> and MISSION stores evt.map.>, so no stream CR change is needed.
#   3. The policy service (PR #554) gains the zone.create/update/remove catalogue entries
#      (D1-P4) and runs with its signing key; its public key is in configmap.yaml.
#   4. The first build-geofence-service run on main pushed the image; then replace the tag
#      below with its digest (tag@sha256:...) from the workflow's image-digest artifact.
# Credentials: the existing omos-nats-creds SealedSecret (keys user/password), as the entity
# service does; no new secret. Its own least-privilege NATS user `geofence` is specified for
# the A19 identities file (PR #562) in the proposal (D1-P6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-geofence-service
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-geofence-service
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1 # one writer of KV geofences and of the alert facts; Recreate avoids overlap
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omos-geofence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omos-geofence-service
        app.kubernetes.io/part-of: omos-platform
    spec:
      # Ecosystem pool, hard placement as the entity service and
      # platform/ecosystem/resources/authorization-context.yaml do: hub-core is
      # memory-saturated (cluster review H1). The pool has no taints.
      nodeSelector:
        onemind.io/compute-role: ecosystem
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: geofence-service
          # Pin digest after first CI build (.github/workflows/build-geofence-service.yml).
          image: ghcr.io/onemindos/omos-geofence-service:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: POLICY_KEYS_DIR
              value: /policy-keys
            - name: REQUIRE_SIGNATURE
              value: "true"
            - name: REQUIRE_APPROVAL
              value: "true"
            - name: ENT_MODE
              value: "jetstream"
            - name: RESTORE_LOOKBACK
              value: "720h"
            - name: FEED_SILENCE
              value: "90s"
            - name: ASSET_TYPES
              value: "drone,robot,vehicle"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "20m"
              memory: "48Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policy-keys
              mountPath: /policy-keys
              readOnly: true
      volumes:
        - name: policy-keys
          configMap:
            name: omos-geofence-policy-keys
