# omos-layer-service (FEATURES A5): follows ENT, writes layer manifests and density cells to
# KV world-state ({layer}.meta, {layer}.cells.z{z}) and site status to KV fleet-state ({site}),
# and serves svc.layer.list|meta|snapshot|watch|unwatch (onemind-xr contracts layer-snapshot.md
# and layer-delta.md; BUS-DESIGN D3, D7). It is the single writer of both buckets: one replica,
# Recreate, and a compare-and-set lease (key _lease.layer-service in world-state).
# Applied only by the platform-omos-layer Application (manual sync). platform-omos does not
# read this directory (directory.recurse: false).
#
# Sync prerequisites, in order (docs/proposals/2026-10-29-layer-service.md):
#   1. ENT is approved and reconciled (A4-P1, docs/proposals/2026-10-29-entity-service-ent-stream.md)
#      and platform-omos-entity runs. Without ENT the service reports every layer "down".
#   2. The owner ratifies the new purpose of world-state and fleet-state (A5-P1). Both buckets
#      already exist (platform/nats/streams/kv-world-state.yaml, kv-fleet-state.yaml) and have
#      never been written (last_seq 0, onemind-xr docs/research/omos-live-state.md section 5).
#   3. The first build-layer-service run on main pushed the image; then replace the tag below
#      with its digest (tag@sha256:...) from the workflow's image-digest artifact.
# Credentials: the existing omos-nats-creds SealedSecret (platform/omos/
# omos-nats-creds.sealedsecret.yaml, keys user/password); no new secret. A per-service NATS
# user is planned with the account split (BUS-DESIGN D6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: omos-layer-service-config
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-layer-service
    app.kubernetes.io/part-of: omos-platform
data:
  # Verified NATS identity (account/user from the server-set Nats-Request-Info header of a
  # `share: true` service import) to OneMind groups, for releasability (layer-snapshot.md
  # section 3.1). No secrets. Stage 1 has no CLIENT account yet, so every caller is in ONEMIND
  # and is treated as a trusted service; add CLIENT principals with the account split.
  principals.json: |
    {
      "own_account": "ONEMIND",
      "org_group": "onemind",
      "principals": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-layer-service
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-layer-service
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1 # single writer of world-state and fleet-state; the KV lease also guards any overlap
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omos-layer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omos-layer-service
        app.kubernetes.io/part-of: omos-platform
    spec:
      # Ecosystem pool, hard placement as platform/omos/entity/deployment.yaml and
      # platform/ecosystem/resources/authorization-context.yaml do: hub-core is
      # memory-saturated (cluster review H1). The pool has no taints.
      nodeSelector:
        onemind.io/compute-role: ecosystem
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: omos-layer-service-config
      containers:
        - name: layer-service
          # Pin digest after first CI build (.github/workflows/build-layer-service.yml).
          image: ghcr.io/onemindos/omos-layer-service:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SITE
              value: "hub"
            - name: LEASE_BUCKET
              value: "world-state"
            - name: PRINCIPALS_FILE
              value: "/config/principals.json"
            # Watch limits sized for the 512Mi limit below (services/layer/README.md).
            - name: MAX_WATCHES
              value: "200"
            - name: WATCH_MEM_BUDGET_MB
              value: "128"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Memory holds the latest render and full record of every ENT entity (estimate:
          # 60,000 entities at 2 to 4 KiB each, layer-snapshot.md section 1 counts) plus the
          # 5 minute replay ring and the watches: each entities-mode watch holds at most the
          # layer cap and all watches together at most WATCH_MEM_BUDGET_MB.
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
