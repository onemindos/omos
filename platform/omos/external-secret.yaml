apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omos-nats-creds
  namespace: omos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: omos-nats-creds
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: omos-nats-creds
        property: username
    - secretKey: password
      remoteRef:
        key: omos-nats-creds
        property: password
