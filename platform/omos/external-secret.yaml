apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omos-nats-creds
  namespace: omos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: omos-nats-creds
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: omos-nats-creds
        property: username
    - secretKey: password
      remoteRef:
        key: omos-nats-creds
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omos-feed-secrets
  namespace: omos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: omos-feed-secrets
    creationPolicy: Owner
  data:
    - secretKey: AISSTREAM_API_KEY
      remoteRef:
        key: omos-feed-secrets
        property: AISSTREAM_API_KEY
    - secretKey: OPENSKY_USERNAME
      remoteRef:
        key: omos-feed-secrets
        property: OPENSKY_USERNAME
    - secretKey: OPENSKY_PASSWORD
      remoteRef:
        key: omos-feed-secrets
        property: OPENSKY_PASSWORD
    - secretKey: ACLED_API_KEY
      remoteRef:
        key: omos-feed-secrets
        property: ACLED_API_KEY
    - secretKey: ACLED_EMAIL
      remoteRef:
        key: omos-feed-secrets
        property: ACLED_EMAIL
    - secretKey: FIRMS_API_KEY
      remoteRef:
        key: omos-feed-secrets
        property: FIRMS_API_KEY
---
apiVersion: external-secrets.io/v1
