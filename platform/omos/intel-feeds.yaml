---
# =============================================================================
# OMOS Intel Feeds — world intelligence data sources → NATS INTEL stream
#
# Each feed is a Deployment polling a public open-data API and publishing
# structured intel envelopes to the INTEL JetStream (intel.> subjects, 90d).
#
# Secrets required (all in omos namespace):
#   omos-nats-creds    — NATS user+password (already exists)
#
# All feed config (poll intervals, API keys, areas, filters) is read from
# the NATS KV bucket `feed-config` at runtime.
#
# Enable/disable per-feed via omos-ui Intel panel or:
#   nats kv put feed-config feed.{id}.enabled true
# =============================================================================

# -----------------------------------------------------------------------------
# Feed: NOAA Weather Alerts — NWS CAP alerts → intel.weather.noaa.alert.*
# Polls https://api.weather.gov/alerts/active per feed-config interval.
# Config keys: feed.noaa.poll_interval, feed.noaa.areas
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-intel-noaa
  namespace: omos
  labels:
    app.kubernetes.io/name: feed-intel-noaa
    app.kubernetes.io/part-of: omos-feeds-intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feed-intel-noaa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feed-intel-noaa
    spec:
      containers:
        - name: feed
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - pip install nats-py aiohttp --quiet && exec python3 /scripts/feed_intel_noaa.py
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: scripts
          configMap:
            name: omos-intel-scripts
---
