apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: face-id-deps
  namespace: omos
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: face-id-data
  namespace: omos
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
