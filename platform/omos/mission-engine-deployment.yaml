apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-mission-engine
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-mission-engine
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omos-mission-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omos-mission-engine
        app.kubernetes.io/part-of: omos-platform
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: omos-mission-engine
          image: ghcr.io/onemindos/omos-mission-engine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
          envFrom:
            - secretRef:
                name: mission-engine-env
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: omos-mission-engine
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-mission-engine
    app.kubernetes.io/part-of: omos-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omos-mission-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
