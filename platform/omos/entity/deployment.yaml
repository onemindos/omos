# omos-entity-service (FEATURES A4): fuses COT, TEL, WORLD, INTEL (and DET once it exists)
# into ent.{entity_type}.{entity_id}.state records in the ENT stream (entity.md contract).
# Applied only by the platform-omos-entity Application (manual sync). platform-omos does not
# read this directory (directory.recurse: false).
#
# Sync prerequisites, in order (docs/proposals/2026-10-29-entity-service-ent-stream.md):
#   1. Owner approves ENT and kv-entity-correlation and they are reconciled by NACK.
#   2. The first build-entity-service run on main pushed the image; then replace the tag below
#      with its digest (tag@sha256:...) from the workflow's image-digest artifact.
#   3. Set ENT_MSG_TTL to "true" only after NATS moves from 2.14.2 to 2.14.9 (stale-TTL fix).
# Credentials: the existing omos-nats-creds SealedSecret (platform/omos/
# omos-nats-creds.sealedsecret.yaml, keys user/password); no new secret. A per-service NATS
# user is planned with the account split (BUS-DESIGN D6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-entity-service
  namespace: omos
  labels:
    app.kubernetes.io/name: omos-entity-service
    app.kubernetes.io/part-of: omos-platform
spec:
  replicas: 1 # one active writer; the KV lease also guards any overlap
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omos-entity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omos-entity-service
        app.kubernetes.io/part-of: omos-platform
    spec:
      affinity:
        nodeAffinity: # ecosystem pool: hub-core is memory-saturated (cluster review H1)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values: [onemind-ecosystem-cpu]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: entity-service
          # Pin digest after first CI build (.github/workflows/build-entity-service.yml).
          image: ghcr.io/onemindos/omos-entity-service:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENT_MODE
              value: "jetstream"
            - name: ENT_MSG_TTL
              value: "false"
            - name: LEASE_BUCKET
              value: "entity-correlation"
            - name: START_LOOKBACK
              value: "10m"
            - name: SERVE_RPC
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
