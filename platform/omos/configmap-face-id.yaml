apiVersion: v1
kind: ConfigMap
metadata:
  name: face-id-code
  namespace: omos
data:
  worker.py: |
    """OneMind Face-ID Worker — RTSP → InsightFace detection+recognition → NATS."""
    import asyncio, json, os, time, logging, ssl, pickle
    from datetime import datetime, timezone
    import cv2
    import numpy as np
    import nats

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    logger = logging.getLogger("face-id")

    NATS_URL      = os.environ.get("NATS_URL", "nats://nats.nats.svc.cluster.local:4222")
    NATS_USER     = os.environ.get("NATS_USER", "onemind")
    NATS_PASS     = os.environ.get("NATS_PASSWORD", "")
    RTSP_URL      = os.environ.get("RTSP_URL", "rtsp://mediamtx.takserver.svc.cluster.local:8554/maccam")
    EMBEDDINGS    = os.environ.get("EMBEDDINGS_PATH", "/faces/embeddings.pkl")
    THRESHOLD     = float(os.environ.get("MATCH_THRESHOLD", "0.4"))
    INTERVAL      = float(os.environ.get("SAMPLE_INTERVAL", "1.0"))
    MODEL_HOME    = os.environ.get("INSIGHTFACE_HOME", "/faces/models")

    def cosine_dist(a, b):
        return 1 - float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))

    def load_enrolled():
        if not os.path.exists(EMBEDDINGS):
            logger.warning("No embeddings file — detection only (run enroll.py to register faces)")
            return {}
        with open(EMBEDDINGS, "rb") as f:
            db = pickle.load(f)
        total = sum(len(v) for v in db.values())
        logger.info(f"Loaded {len(db)} identities, {total} embeddings: {list(db.keys())}")
        return db

    def match(embedding, enrolled):
        best_name, best_dist = None, 1.0
        for name, refs in enrolled.items():
            for ref in refs:
                d = cosine_dist(embedding, ref)
                if d < best_dist:
                    best_dist, best_name = d, name
        if best_dist < THRESHOLD:
            return best_name, best_dist
        return None, best_dist

    async def run(nc, app, enrolled):
        logger.info(f"Connecting RTSP: {RTSP_URL}")
        while True:
            cap = cv2.VideoCapture(RTSP_URL)
            if not cap.isOpened():
                logger.warning("RTSP unavailable, retry 10s")
                await asyncio.sleep(10)
                continue
            logger.info("RTSP connected")
            fails = 0
            while True:
                ret, frame = cap.read()
                if not ret:
                    fails += 1
                    if fails > 10:
                        break
                    await asyncio.sleep(1)
                    continue
                fails = 0

                faces = app.get(frame)
                for face in faces:
                    name, dist = match(face.normed_embedding, enrolled)
                    ts = datetime.now(timezone.utc).isoformat()
                    payload = json.dumps({
                        "timestamp": ts,
                        "feed": "maccam",
                        "identity": name,
                        "distance": round(dist, 4),
                        "det_score": round(float(face.det_score), 4),
                        "bbox": [round(v, 1) for v in face.bbox.tolist()],
                    }).encode()

                    subj = f"det.face.known.{name}" if name else "det.face.unknown"
                    await nc.publish(subj, payload)

                    if name:
                        logger.info(f"Recognized: {name} (dist={dist:.3f} score={face.det_score:.2f})")
                        await nc.publish(f"evt.access.{name}.recognized", payload)

                await asyncio.sleep(INTERVAL)
            cap.release()
            await asyncio.sleep(5)

    async def main():
        logger.info("OneMind Face-ID starting")
        os.environ["INSIGHTFACE_HOME"] = MODEL_HOME
        os.makedirs(MODEL_HOME, exist_ok=True)

        from insightface.app import FaceAnalysis
        logger.info("Loading InsightFace buffalo_s (CPU)...")
        app = FaceAnalysis(name="buffalo_s", providers=["CPUExecutionProvider"])
        app.prepare(ctx_id=0, det_size=(640, 640))
        logger.info("InsightFace ready")

        enrolled = load_enrolled()

        opts = {"servers": [NATS_URL]}
        if NATS_USER: opts["user"] = NATS_USER
        if NATS_PASS: opts["password"] = NATS_PASS
        nc = await nats.connect(**opts)
        logger.info("NATS connected")

        await run(nc, app, enrolled)

    if __name__ == "__main__":
        asyncio.run(main())

  enroll.py: |
    """
    Enrollment script — run once via kubectl exec to register faces.

    Usage:
      1. Copy reference photos into the face-id-data PVC:
           kubectl cp /path/to/zeus1.jpg omos/<pod>:/faces/photos/zeus/zeus1.jpg
           kubectl cp /path/to/zeus2.jpg omos/<pod>:/faces/photos/zeus/zeus2.jpg
      2. kubectl exec -n omos <pod> -- python /app/enroll.py
      3. Worker reloads embeddings automatically on next restart (or SIGHUP).

    Directory layout expected in /faces/photos/:
      zeus/
        photo1.jpg
        photo2.jpg
      other_person/
        ...
    """
    import os, pickle, glob, logging
    import cv2

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(message)s")
    logger = logging.getLogger("enroll")

    PHOTOS_DIR     = "/faces/photos"
    EMBEDDINGS_PATH = "/faces/embeddings.pkl"
    MODEL_HOME     = os.environ.get("INSIGHTFACE_HOME", "/faces/models")

    os.environ["INSIGHTFACE_HOME"] = MODEL_HOME
    os.makedirs(MODEL_HOME, exist_ok=True)
    os.makedirs(PHOTOS_DIR, exist_ok=True)

    from insightface.app import FaceAnalysis
    app = FaceAnalysis(name="buffalo_s", providers=["CPUExecutionProvider"])
    app.prepare(ctx_id=0, det_size=(640, 640))

    enrolled = {}
    for identity in sorted(os.listdir(PHOTOS_DIR)):
        idir = os.path.join(PHOTOS_DIR, identity)
        if not os.path.isdir(idir):
            continue
        photos = glob.glob(f"{idir}/*.jpg") + glob.glob(f"{idir}/*.png") + glob.glob(f"{idir}/*.jpeg")
        if not photos:
            logger.warning(f"{identity}: no photos found")
            continue
        embeddings = []
        for p in sorted(photos):
            img = cv2.imread(p)
            if img is None:
                logger.warning(f"Cannot read {p}")
                continue
            faces = app.get(img)
            if not faces:
                logger.warning(f"No face in {p}")
                continue
            if len(faces) > 1:
                faces = sorted(faces, key=lambda f: (f.bbox[2]-f.bbox[0])*(f.bbox[3]-f.bbox[1]), reverse=True)
                logger.warning(f"Multiple faces in {p} — using largest")
            embeddings.append(faces[0].normed_embedding)
            logger.info(f"  {identity}/{os.path.basename(p)} → enrolled")
        if embeddings:
            enrolled[identity] = embeddings
            logger.info(f"{identity}: {len(embeddings)} embeddings registered")
        else:
            logger.warning(f"{identity}: 0 usable photos, skipping")

    with open(EMBEDDINGS_PATH, "wb") as f:
        pickle.dump(enrolled, f)
    logger.info(f"Saved to {EMBEDDINGS_PATH}: {list(enrolled.keys())}")
