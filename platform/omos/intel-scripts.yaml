  # feed_intel_usgs.py — USGS earthquake GeoJSON → intel.seismic.usgs.*
  #
  # Subject:  intel.seismic.usgs.{magnitude_bucket}.{clean_id}
  #           Buckets: m2plus (2.0-2.9), m3plus (3.0-3.9),
  #                    m4plus (4.0-4.9), m5plus (5.0+)
  # Payload:  intel envelope with type=earthquake, source=usgs
  # Dedup:    in-memory set on feature id + Nats-Msg-Id header
  # Config:   NATS KV bucket feed-config, keys feed.usgs.*
  # Status:   tel.feed.usgs.status published every 30s and after each poll
  # ---------------------------------------------------------------------------
  feed_intel_usgs.py: |
    #!/usr/bin/env python3
    import asyncio, json, logging, os, re, ssl, time
    from datetime import datetime, timezone
    import aiohttp, nats

    LOG = logging.getLogger("feed-intel-usgs")
    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")

    FEED_ID       = "usgs"
    NATS_URL      = os.getenv("NATS_URL", "nats://nats.nats.svc.cluster.local:4222")
    NATS_USER     = os.getenv("NATS_USER", "")
    NATS_PASSWORD = os.getenv("NATS_PASSWORD", "")

    USGS_URL        = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
    STATUS_INTERVAL = 30.0

    # ---------------------------------------------------------------------------
    # KV config watcher
    # ---------------------------------------------------------------------------
    async def watch_config(kv, config: dict, feed_id: str):
        try:
            watcher = await kv.watch(f"feed.{feed_id}.*", include_history=True)
            async for entry in watcher:
                if entry is None:
                    break
                key = entry.key.split(".")[-1]
                val = entry.value.decode() if entry.value else ""
                config[key] = val
                LOG.info(f"KV config update: feed.{feed_id}.{key}={val!r}")
        except Exception as e:
            LOG.error(f"KV watcher error: {e}")

    def get_config(config: dict) -> tuple[bool, int, float]:
        enabled       = config.get("enabled", "true").lower() != "false"
        poll_interval = int(config.get("poll_interval", "60") or "60")
        min_magnitude = float(config.get("min_magnitude", "2.5") or "2.5")
        return enabled, poll_interval, min_magnitude

    # ---------------------------------------------------------------------------
    # Status heartbeat
    # ---------------------------------------------------------------------------
    async def publish_status(nc, state: dict):
        payload = json.dumps({
            "feed_id":        FEED_ID,
            "enabled":        state["enabled"],
            "poll_interval":  state["poll_interval"],
            "last_poll_ts":   state["last_poll_ts"],
            "last_poll_msgs": state["last_poll_msgs"],
            "last_error":     state["last_error"],
            "total_msgs":     state["total_msgs"],
        }).encode()
        try:
            await nc.publish(f"tel.feed.{FEED_ID}.status", payload)
        except Exception as e:
            LOG.warning(f"Status publish error: {e}")

    # ---------------------------------------------------------------------------
    # Payload builders
    # ---------------------------------------------------------------------------
    def magnitude_bucket(mag: float) -> str:
        if mag >= 5.0: return "m5plus"
        if mag >= 4.0: return "m4plus"
        if mag >= 3.0: return "m3plus"
        return "m2plus"

    def clean_id(fid: str) -> str:
        return re.sub(r"[^a-zA-Z0-9_-]", "", fid)

    def now_iso() -> str:
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def ms_to_iso(ms) -> str:
        if ms is None:
            return now_iso()
        return datetime.fromtimestamp(ms / 1000.0, tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def build_payload(feat: dict) -> dict:
        props  = feat.get("properties", {})
        coords = feat["geometry"]["coordinates"]
        lon, lat, depth = coords[0], coords[1], coords[2]
        mag = props.get("mag") or 0.0
        return {
            "id":        feat["id"],
            "type":      "earthquake",
            "source":    "usgs",
            "lat":       round(lat, 6),
            "lon":       round(lon, 6),
            "timestamp": ms_to_iso(props.get("time")),
            "expires":   "",
            "properties": {
                "magnitude":      mag,
                "magnitude_type": props.get("magType", ""),
                "depth_km":       round(depth, 2),
                "place":          props.get("place", ""),
                "status":         props.get("status", ""),
                "tsunami":        bool(props.get("tsunami")),
                "felt":           props.get("felt"),
                "cdi":            props.get("cdi"),
                "mmi":            props.get("mmi"),
                "alert":          props.get("alert"),
                "sig":            props.get("sig"),
                "net":            props.get("net", ""),
                "url":            props.get("url", ""),
            },
            "geometry": {
                "type":        "Point",
                "coordinates": [round(lon, 6), round(lat, 6)],
            },
        }

    # ---------------------------------------------------------------------------
    # Poll
    # ---------------------------------------------------------------------------
    async def poll(session: aiohttp.ClientSession, js, seen: set, min_magnitude: float) -> int:
        try:
            async with session.get(
                USGS_URL,
                headers={"User-Agent": "omos-feed-intel-usgs/1.0"},
                timeout=aiohttp.ClientTimeout(total=20),
            ) as r:
                if r.status != 200:
                    LOG.warning(f"USGS HTTP {r.status}")
                    return 0
                data = await r.json(content_type=None)
        except Exception as e:
            LOG.error(f"USGS fetch error: {e}")
            return 0

        published = 0
        for feat in data.get("features", []):
            fid = feat.get("id", "")
            if not fid or fid in seen:
                continue
            props = feat.get("properties", {})
            mag   = props.get("mag")
            if mag is None or mag < min_magnitude:
                continue
            if not feat.get("geometry") or not feat["geometry"].get("coordinates"):
                continue
            bucket  = magnitude_bucket(mag)
            cid     = clean_id(fid)
            subject = f"intel.seismic.usgs.{bucket}.{cid}"
            payload = build_payload(feat)
            try:
                hdrs = {"Nats-Msg-Id": fid}
                await js.publish(subject, json.dumps(payload).encode(), headers=hdrs)
                seen.add(fid)
                published += 1
                LOG.debug(f"Published {subject} mag={mag}")
            except Exception as e:
                LOG.error(f"NATS publish error {subject}: {e}")
        if published:
            LOG.info(f"USGS: published {published} new events (total seen={len(seen)})")
        return published

    # ---------------------------------------------------------------------------
    # Main
    # ---------------------------------------------------------------------------
    async def main():
        tls_ctx = ssl.create_default_context()
        tls_ctx.check_hostname = False
        tls_ctx.verify_mode = ssl.CERT_NONE
        nc = await nats.connect(
            servers=NATS_URL, user=NATS_USER, password=NATS_PASSWORD,
            max_reconnect_attempts=-1, reconnect_time_wait=5, name="feed-intel-usgs",
            tls=tls_ctx,
        )
        js = nc.jetstream()
        LOG.info("NATS connected — JetStream ready")

        kv = await js.key_value("feed-config")
        config: dict = {}
        asyncio.ensure_future(watch_config(kv, config, FEED_ID))
        await asyncio.sleep(0.5)

        state = {
            "enabled":        True,
            "poll_interval":  60,
            "last_poll_ts":   "",
            "last_poll_msgs": 0,
            "last_error":     "",
            "total_msgs":     0,
        }

        seen: set[str] = set()
        last_status_at = time.monotonic()

        async with aiohttp.ClientSession() as session:
            while True:
                enabled, poll_interval, min_magnitude = get_config(config)
                state["enabled"]       = enabled
                state["poll_interval"] = poll_interval

                now_mono = time.monotonic()
                if now_mono - last_status_at >= STATUS_INTERVAL:
                    await publish_status(nc, state)
                    last_status_at = now_mono

                if not enabled:
                    await asyncio.sleep(min(poll_interval, 10))
                    continue

                state["last_error"] = ""
                try:
                    n = await poll(session, js, seen, min_magnitude)
                    state["last_poll_msgs"] = n
                    state["total_msgs"]    += n
                    state["last_poll_ts"]   = now_iso()
                except Exception as e:
                    state["last_error"] = str(e)
                    LOG.error(f"Poll error: {e}")

                await publish_status(nc, state)
                last_status_at = time.monotonic()
                await asyncio.sleep(poll_interval)

    asyncio.run(main())

  # ---------------------------------------------------------------------------
  # feed_intel_acled.py — ACLED conflict events → intel.conflict.acled.*
  #
  # Subject:  intel.conflict.acled.{iso3_lower}.{event_type_slug}
  # Payload:  intel envelope with type=conflict_event, source=acled
  # Dedup:    in-memory set on data_id + Nats-Msg-Id header
  # Config:   NATS KV bucket feed-config, keys feed.acled.*
  #           api_key + email required; feed disabled (skips poll) if missing
  # Status:   tel.feed.acled.status published every 30s and after each poll
  # ---------------------------------------------------------------------------
  feed_intel_acled.py: |
    #!/usr/bin/env python3
    import asyncio, json, logging, os, re, ssl, time
    from datetime import datetime, timezone, timedelta
    import aiohttp, nats

    LOG = logging.getLogger("feed-intel-acled")
    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")

    FEED_ID       = "acled"
    NATS_URL      = os.getenv("NATS_URL", "nats://nats.nats.svc.cluster.local:4222")
    NATS_USER     = os.getenv("NATS_USER", "")
    NATS_PASSWORD = os.getenv("NATS_PASSWORD", "")

    ACLED_URL       = "https://api.acleddata.com/acled/read"
    ACLED_LOOKBACK  = 7  # days — not configurable via KV, keep fixed
    STATUS_INTERVAL = 30.0

    # ---------------------------------------------------------------------------
    # KV config watcher
    # ---------------------------------------------------------------------------
    async def watch_config(kv, config: dict, feed_id: str):
        try:
            watcher = await kv.watch(f"feed.{feed_id}.*", include_history=True)
            async for entry in watcher:
                if entry is None:
                    break
                key = entry.key.split(".")[-1]
                val = entry.value.decode() if entry.value else ""
                config[key] = val
                LOG.info(f"KV config update: feed.{feed_id}.{key}={val!r}")
        except Exception as e:
            LOG.error(f"KV watcher error: {e}")

    def get_config(config: dict) -> tuple[bool, int, str, str, str]:
        enabled       = config.get("enabled", "true").lower() != "false"
        poll_interval = int(config.get("poll_interval", "3600") or "3600")
        api_key       = config.get("api_key", "")
        email         = config.get("email", "")
        countries     = config.get("countries", "")
        return enabled, poll_interval, api_key, email, countries

    # ---------------------------------------------------------------------------
    # Status heartbeat
    # ---------------------------------------------------------------------------
    async def publish_status(nc, state: dict):
        payload = json.dumps({
            "feed_id":        FEED_ID,
            "enabled":        state["enabled"],
            "poll_interval":  state["poll_interval"],
            "last_poll_ts":   state["last_poll_ts"],
            "last_poll_msgs": state["last_poll_msgs"],
            "last_error":     state["last_error"],
            "total_msgs":     state["total_msgs"],
        }).encode()
        try:
            await nc.publish(f"tel.feed.{FEED_ID}.status", payload)
        except Exception as e:
            LOG.warning(f"Status publish error: {e}")

    def now_iso() -> str:
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def slugify(text: str) -> str:
        return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")

    def build_payload(row: dict) -> dict:
        try:
            lat = float(row.get("latitude", 0) or 0)
            lon = float(row.get("longitude", 0) or 0)
        except (ValueError, TypeError):
            lat, lon = 0.0, 0.0
        event_date = row.get("event_date", "")
        timestamp  = f"{event_date}T00:00:00Z" if event_date else now_iso()
        return {
            "id":        str(row.get("data_id", "")),
            "type":      "conflict_event",
            "source":    "acled",
            "lat":       round(lat, 6),
            "lon":       round(lon, 6),
            "timestamp": timestamp,
            "expires":   "",
            "properties": {
                "event_type":     row.get("event_type", ""),
                "sub_event_type": row.get("sub_event_type", ""),
                "actor1":         row.get("actor1", ""),
                "actor2":         row.get("actor2", ""),
                "country":        row.get("country", ""),
                "iso3":           row.get("iso3", ""),
                "location":       row.get("location", ""),
                "admin1":         row.get("admin1", ""),
                "admin2":         row.get("admin2", ""),
                "fatalities":     int(row.get("fatalities", 0) or 0),
                "notes":          (row.get("notes") or "")[:500],
                "source":         row.get("source", ""),
                "source_scale":   row.get("source_scale", ""),
            },
            "geometry": {
                "type":        "Point",
                "coordinates": [round(lon, 6), round(lat, 6)],
            },
        }

    # ---------------------------------------------------------------------------
    # Poll
    # ---------------------------------------------------------------------------
    async def poll(session: aiohttp.ClientSession, js, seen: set,
                   api_key: str, email: str, countries: str) -> int:
        today     = datetime.now(timezone.utc).date()
        from_date = (today - timedelta(days=ACLED_LOOKBACK)).isoformat()
        params: dict[str, str] = {
            "key":              api_key,
            "email":            email,
            "event_date":       from_date,
            "event_date_where": ">=",
            "limit":            "5000",
            "fields": (
                "data_id|event_date|event_type|sub_event_type|actor1|actor2"
                "|country|iso3|location|admin1|admin2|latitude|longitude"
                "|fatalities|notes|source|source_scale"
            ),
        }
        if countries:
            params["iso3"]       = countries
            params["iso3_where"] = "IN"
        try:
            async with session.get(
                ACLED_URL,
                params=params,
                headers={"User-Agent": "omos-feed-intel-acled/1.0"},
                timeout=aiohttp.ClientTimeout(total=60),
            ) as r:
                if r.status != 200:
                    LOG.warning(f"ACLED HTTP {r.status}")
                    return 0
                data = await r.json(content_type=None)
        except Exception as e:
            LOG.error(f"ACLED fetch error: {e}")
            return 0

        rows      = data.get("data") or []
        published = 0
        for row in rows:
            data_id = str(row.get("data_id", ""))
            if not data_id or data_id in seen:
                continue
            iso3       = (row.get("iso3") or "XXX").lower()
            event_type = row.get("event_type", "event")
            subject    = f"intel.conflict.acled.{iso3}.{slugify(event_type)}"
            payload    = build_payload(row)
            try:
                hdrs = {"Nats-Msg-Id": f"acled-{data_id}"}
                await js.publish(subject, json.dumps(payload).encode(), headers=hdrs)
                seen.add(data_id)
                published += 1
            except Exception as e:
                LOG.error(f"NATS publish error {subject}: {e}")
        if published:
            LOG.info(f"ACLED: published {published} new events (total seen={len(seen)})")
        return published

    # ---------------------------------------------------------------------------
    # Main
    # ---------------------------------------------------------------------------
    async def main():
        tls_ctx = ssl.create_default_context()
        tls_ctx.check_hostname = False
        tls_ctx.verify_mode = ssl.CERT_NONE
        nc = await nats.connect(
            servers=NATS_URL, user=NATS_USER, password=NATS_PASSWORD,
            max_reconnect_attempts=-1, reconnect_time_wait=5, name="feed-intel-acled",
            tls=tls_ctx,
        )
        js = nc.jetstream()
        LOG.info("NATS connected — JetStream ready")

        kv = await js.key_value("feed-config")
        config: dict = {}
        asyncio.ensure_future(watch_config(kv, config, FEED_ID))
        await asyncio.sleep(0.5)

        state = {
            "enabled":        True,
            "poll_interval":  3600,
            "last_poll_ts":   "",
            "last_poll_msgs": 0,
            "last_error":     "",
            "total_msgs":     0,
        }

        seen: set[str] = set()
        last_status_at = time.monotonic()

        async with aiohttp.ClientSession() as session:
            while True:
                enabled, poll_interval, api_key, email, countries = get_config(config)
                state["enabled"]       = enabled
                state["poll_interval"] = poll_interval

                now_mono = time.monotonic()
                if now_mono - last_status_at >= STATUS_INTERVAL:
                    await publish_status(nc, state)
                    last_status_at = now_mono

                # Skip poll if disabled or credentials missing
                if not enabled or not api_key or not email:
                    if not api_key or not email:
                        LOG.debug("ACLED api_key/email not set in KV — skipping poll")
                    await asyncio.sleep(min(poll_interval, 30))
                    continue

                state["last_error"] = ""
                try:
                    n = await poll(session, js, seen, api_key, email, countries)
                    state["last_poll_msgs"] = n
                    state["total_msgs"]    += n
                    state["last_poll_ts"]   = now_iso()
                except Exception as e:
                    state["last_error"] = str(e)
                    LOG.error(f"Poll error: {e}")

                await publish_status(nc, state)
                last_status_at = time.monotonic()
                await asyncio.sleep(poll_interval)

    asyncio.run(main())

  # ---------------------------------------------------------------------------
  # feed_intel_firms.py — NASA FIRMS active fire detections → intel.fire.nasa.firms.*
  #
  # Subject:  intel.fire.nasa.firms.{region}  (region = area slugified)
  # Payload:  intel envelope with type=wildfire, source=nasa_firms
  # Dedup:    in-memory set keyed by SHA-1(lat:lon:acq_date:acq_time)
  #           + Nats-Msg-Id header
  # Config:   NATS KV bucket feed-config, keys feed.firms.*
  #           api_key required; feed skips poll if missing
  # Status:   tel.feed.firms.status published every 30s and after each poll
  # ---------------------------------------------------------------------------
  feed_intel_firms.py: |
    #!/usr/bin/env python3
    import asyncio, csv, hashlib, io, json, logging, os, re, ssl, time
    from datetime import datetime, timezone
    import aiohttp, nats

    LOG = logging.getLogger("feed-intel-firms")
    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(name)s %(message)s")

    FEED_ID       = "firms"
    NATS_URL      = os.getenv("NATS_URL", "nats://nats.nats.svc.cluster.local:4222")
    NATS_USER     = os.getenv("NATS_USER", "")
    NATS_PASSWORD = os.getenv("NATS_PASSWORD", "")

    FIRMS_URL_TMPL  = (
        "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
        "/{key}/VIIRS_SNPP_NRT/{area}/{days}"
    )
    STATUS_INTERVAL = 30.0

    # ---------------------------------------------------------------------------
    # KV config watcher
    # ---------------------------------------------------------------------------
    async def watch_config(kv, config: dict, feed_id: str):
        try:
            watcher = await kv.watch(f"feed.{feed_id}.*", include_history=True)
            async for entry in watcher:
                if entry is None:
                    break
                key = entry.key.split(".")[-1]
                val = entry.value.decode() if entry.value else ""
                config[key] = val
                LOG.info(f"KV config update: feed.{feed_id}.{key}={val!r}")
        except Exception as e:
            LOG.error(f"KV watcher error: {e}")

    def get_config(config: dict) -> tuple[bool, int, str, str, int]:
        enabled       = config.get("enabled", "true").lower() != "false"
        poll_interval = int(config.get("poll_interval", "600") or "600")
        api_key       = config.get("api_key", "")
        area          = config.get("area", "world") or "world"
        days          = int(config.get("days", "1") or "1")
        return enabled, poll_interval, api_key, area, days

    # ---------------------------------------------------------------------------
    # Status heartbeat
    # ---------------------------------------------------------------------------
    async def publish_status(nc, state: dict):
        payload = json.dumps({
            "feed_id":        FEED_ID,
            "enabled":        state["enabled"],
            "poll_interval":  state["poll_interval"],
            "last_poll_ts":   state["last_poll_ts"],
            "last_poll_msgs": state["last_poll_msgs"],
            "last_error":     state["last_error"],
            "total_msgs":     state["total_msgs"],
        }).encode()
        try:
            await nc.publish(f"tel.feed.{FEED_ID}.status", payload)
        except Exception as e:
            LOG.warning(f"Status publish error: {e}")

    def slugify(text: str) -> str:
        return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")

    def now_iso() -> str:
        return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

    def row_dedup_key(row: dict) -> str:
        raw = f"{row.get('latitude','')}:{row.get('longitude','')}:{row.get('acq_date','')}:{row.get('acq_time','')}"
        return hashlib.sha1(raw.encode()).hexdigest()

    def row_timestamp(row: dict) -> str:
        date = row.get("acq_date", "")
        t    = row.get("acq_time", "")
        if date and t:
            try:
                hhmm = t.zfill(4)
                return f"{date}T{hhmm[:2]}:{hhmm[2:]}:00Z"
            except Exception:
                pass
        return now_iso()

    def _float(val):
        if val is None or val == "":
            return None
        try:
            return float(val)
        except (ValueError, TypeError):
            return None

    def build_payload(row: dict, lat: float, lon: float, dedup_key: str) -> dict:
        return {
            "id":        dedup_key,
            "type":      "wildfire",
            "source":    "nasa_firms",
            "lat":       round(lat, 6),
            "lon":       round(lon, 6),
            "timestamp": row_timestamp(row),
            "expires":   "",
            "properties": {
                "brightness":    _float(row.get("bright_ti4")),
                "brightness_t5": _float(row.get("bright_ti5")),
                "frp":           _float(row.get("frp")),
                "confidence":    row.get("confidence", ""),
                "satellite":     row.get("satellite", ""),
                "instrument":    row.get("instrument", "VIIRS"),
                "scan":          _float(row.get("scan")),
                "track":         _float(row.get("track")),
                "acq_date":      row.get("acq_date", ""),
                "acq_time":      row.get("acq_time", ""),
                "version":       row.get("version", ""),
                "daynight":      row.get("daynight", ""),
            },
            "geometry": {
                "type":        "Point",
                "coordinates": [round(lon, 6), round(lat, 6)],
            },
        }

    # ---------------------------------------------------------------------------
    # Poll
    # ---------------------------------------------------------------------------
    async def poll(session: aiohttp.ClientSession, js, seen: set,
                   api_key: str, area: str, days: int, subject: str) -> int:
        url = FIRMS_URL_TMPL.format(key=api_key, area=area, days=days)
        try:
            async with session.get(
                url,
                headers={"User-Agent": "omos-feed-intel-firms/1.0"},
                timeout=aiohttp.ClientTimeout(total=60),
            ) as r:
                if r.status == 400:
                    LOG.error("FIRMS HTTP 400 — check API key or area parameter")
                    return 0
                if r.status != 200:
                    LOG.warning(f"FIRMS HTTP {r.status}")
                    return 0
                body = await r.text()
        except Exception as e:
            LOG.error(f"FIRMS fetch error: {e}")
            return 0

        try:
            reader = csv.DictReader(io.StringIO(body))
            rows   = list(reader)
        except Exception as e:
            LOG.error(f"FIRMS CSV parse error: {e}")
            return 0

        published = 0
        for row in rows:
            try:
                lat = float(row.get("latitude", 0) or 0)
                lon = float(row.get("longitude", 0) or 0)
            except (ValueError, TypeError):
                continue
            dedup_key = row_dedup_key(row)
            if dedup_key in seen:
                continue
            payload = build_payload(row, lat, lon, dedup_key)
            try:
                hdrs = {"Nats-Msg-Id": dedup_key}
                await js.publish(subject, json.dumps(payload).encode(), headers=hdrs)
                seen.add(dedup_key)
                published += 1
            except Exception as e:
                LOG.error(f"NATS publish error {subject}: {e}")
        if published:
            LOG.info(f"FIRMS: published {published} new fire detections area={area} (total seen={len(seen)})")
        return published

    # ---------------------------------------------------------------------------
    # Main
    # ---------------------------------------------------------------------------
    async def main():
        tls_ctx = ssl.create_default_context()
        tls_ctx.check_hostname = False
        tls_ctx.verify_mode = ssl.CERT_NONE
        nc = await nats.connect(
            servers=NATS_URL, user=NATS_USER, password=NATS_PASSWORD,
            max_reconnect_attempts=-1, reconnect_time_wait=5, name="feed-intel-firms",
            tls=tls_ctx,
        )
        js = nc.jetstream()
        LOG.info("NATS connected — JetStream ready")

        kv = await js.key_value("feed-config")
        config: dict = {}
        asyncio.ensure_future(watch_config(kv, config, FEED_ID))
        await asyncio.sleep(0.5)

        state = {
            "enabled":        True,
            "poll_interval":  600,
            "last_poll_ts":   "",
            "last_poll_msgs": 0,
            "last_error":     "",
            "total_msgs":     0,
        }

        seen: set[str] = set()
        last_status_at = time.monotonic()

        async with aiohttp.ClientSession() as session:
            while True:
                enabled, poll_interval, api_key, area, days = get_config(config)
                state["enabled"]       = enabled
                state["poll_interval"] = poll_interval

                now_mono = time.monotonic()
                if now_mono - last_status_at >= STATUS_INTERVAL:
                    await publish_status(nc, state)
                    last_status_at = now_mono

                # Skip poll if disabled or API key missing
                if not enabled or not api_key:
                    if not api_key:
                        LOG.debug("FIRMS api_key not set in KV — skipping poll")
                    await asyncio.sleep(min(poll_interval, 30))
                    continue

                region  = slugify(area)
                subject = f"intel.fire.nasa.firms.{region}"

                state["last_error"] = ""
                try:
                    n = await poll(session, js, seen, api_key, area, days, subject)
                    state["last_poll_msgs"] = n
                    state["total_msgs"]    += n
                    state["last_poll_ts"]   = now_iso()
                except Exception as e:
                    state["last_error"] = str(e)
                    LOG.error(f"Poll error: {e}")

                await publish_status(nc, state)
                last_status_at = time.monotonic()
                await asyncio.sleep(poll_interval)

    asyncio.run(main())
