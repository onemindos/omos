# NATS HA cluster — SANITIZED TEMPLATE (committed for reference).
# Real values live in values.secret.yaml (gitignored) with generated passwords.
# Regenerate: openssl rand -base64 24 | tr -d '/+=' | head -c 28
config:
  cluster:
    enabled: true
    replicas: 3
    routeURLs:
      useFQDN: true            # FQDN routes match the wildcard TLS SAN
    tls:
      enabled: true
      secretName: nats-server-tls
  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        size: 20Gi
  nats:
    tls:
      enabled: true
      secretName: nats-server-tls
  # Leafnode listener — foundation of the OneMind edge fabric (TAK bridge, Mac,
  # edge sites, robots all connect as leafs). Chart exposes 7422 on the Service +
  # mounts the wildcard cert. Leaf users bind directly into the ONEMIND account.
  #
  # advertise: force reconnects to use the Tailscale LB IP only. Without this,
  # the hub broadcasts its internal ClusterIP (10.109.x.x) as an alternate route.
  # Edge nodes (omos-ha, omos-mbp) can't reach that IP → 2s i/o timeout on every
  # hub restart → WS errors on the bridge. Pinning to Tailscale IP eliminates this.
  leafnodes:
    enabled: true
    port: 7422
    tls:
      enabled: true
      secretName: nats-server-tls
    merge:
      no_advertise: true
      authorization:
        users:
          - user: leaf_tak
            password: "__LEAF_TAK_PW__"
            account: ONEMIND
  merge:
    system_account: SYS
    accounts:
      SYS:
        users:
          - user: sys
            password: "__SYS_PW__"
          - user: monitor
            password: "__MONITOR_PW__"
        exports:
          - service: "$SYS.REQ.>"
            accounts: [ONEMIND]
      ONEMIND:
        jetstream:              # limits map reliably enables JS (bare string is not honored)
          max_mem: -1
          max_file: -1
          max_streams: -1
          max_consumers: -1
        users:
          - user: onemind
            password: "__ONEMIND_PW__"
        imports:
          - service:
              subject: "$SYS.REQ.>"
              account: SYS

tlsCA:
  enabled: true
  secretName: nats-server-tls
  key: ca.crt

natsBox:
  enabled: true
