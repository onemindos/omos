apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: voice
  namespace: nats
  annotations:
    description: "Voice sessions \u2014 transcripts, audio refs, intent routing"
spec:
  name: VOICE
  subjects:
    - "voice.>"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 720h
  duplicateWindow: 2m
  preventDelete: true
