# PROPOSAL (owner approval required): ENT, the latest-entity-state stream.
# Excluded from the platform-nats-streams Application (see its `exclude`) until the owner
# approves docs/proposals/2026-10-29-entity-service-ent-stream.md (ONT-P1 / BUS-DESIGN D2).
# To activate: remove "ent.yaml" from that exclude list in the same PR as the approval.
#
# One message per subject (`ent.{entity_type}.{entity_id}.state`, locked grammar), Direct Get,
# per-message TTL (`Nats-TTL`) with delete markers, 2 min Nats-Msg-Id window for
# `{entity_id}:{seq}`, 7 d backstop, 1 GiB cap (BUS-DESIGN section 4.1).
# NACK 0.23.0 (chart 0.34.0, live) serves these fields in the v1beta2 Stream CRD (checked
# read-only on 2026-10-29). Per-message TTL should not be relied on before the server moves
# from 2.14.2 to 2.14.9 (stale-TTL fix in 2.14.8; nats-platform.md R9).
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: ent
  namespace: nats
  annotations:
    description: "OneMind fused entity state, latest per entity (one msg per subject, per-message TTL)"
spec:
  name: ENT
  subjects:
    - "ent.*.*.state"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 168h
  maxBytes: 1073741824
  maxMsgsPerSubject: 1
  duplicateWindow: 2m
  allowDirect: true
  allowMsgTtl: true
  subjectDeleteMarkerTtl: 15m
  preventDelete: true
