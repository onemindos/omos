apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: cot
  namespace: nats
  annotations:
    description: "TAK/CoT \u2014 ATAK position reports, bridge feeds, Constellation"
spec:
  name: COT
  subjects:
    - "tak.cot.>"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 720h
  duplicateWindow: 2m
