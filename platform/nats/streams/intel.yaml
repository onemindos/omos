apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: intel
  namespace: nats
  annotations:
    description: "Curated world intelligence \u2014 distilled alerts, geofence events, watch-zone triggers"
spec:
  name: INTEL
  subjects:
    - "intel.>"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 2160h
  maxBytes: 1073741824
  duplicateWindow: 1h
  preventDelete: true
