apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: tel
  namespace: nats
  annotations:
    description: "Telemetry \u2014 fleet assets: drones, robots, edge nodes, IoT, industrial, satellites"
spec:
  name: TEL
  subjects:
    - "tel.fleet.>"
    - "tel.drone.>"
    - "tel.robot.>"
    - "tel.edge.>"
    - "tel.iot.>"
    - "tel.industrial.>"
    - "tel.sat.>"
    # Feed freshness heartbeats (tel.feed.{source}.status; BUS-DESIGN BUS-P1, omos-ingest).
    - "tel.feed.>"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 72h
  maxBytes: 4294967296
  maxMsgsPerSubject: 2000
  allowDirect: true
  duplicateWindow: 2m
  preventDelete: true
