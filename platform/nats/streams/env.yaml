apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: env
  namespace: nats
  annotations:
    description: "Environmental + biometric telemetry \u2014 soil, weather, water, HRV, presence"
spec:
  name: ENV
  subjects:
    - "tel.nature.>"
    - "tel.bio.>"
    - "tel.weather.>"
    - "tel.soil.>"
    - "tel.water.>"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 720h
  duplicateWindow: 2m
