apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: cmd
  namespace: nats
  annotations:
    description: "Commands \u2014 every instruction to any actor (drones, robots, nodes, agents)"
spec:
  name: CMD
  subjects:
    - "cmd.>"
  storage: file
  replicas: 3
  retention: limits
  discard: old
  maxAge: 720h
  duplicateWindow: 2m
