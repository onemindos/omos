apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: cmd
  namespace: nats
  annotations:
    description: "Commands \u2014 every instruction to any actor (drones, robots, nodes, agents)"
spec:
  name: CMD
  subjects:
    - "cmd.>"
  storage: file
  replicas: 3
  retention: limits
  # discard: new (not old): a full CMD refuses the publish, so the policy service fails
  # closed and no command goes out without its audit record (BUS-DESIGN 4.1, run rule 6).
  # Alert NATSCmdStreamNearFull fires at 80% of maxBytes (prometheus-rules-onemind.yaml).
  discard: new
  maxAge: 8760h
  maxBytes: 536870912
  duplicateWindow: 2m
  preventDelete: true
