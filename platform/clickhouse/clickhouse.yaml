apiVersion: "clickhouse.altinity.com/v1"
kind: ClickHouseInstallation
metadata:
  name: onemind
  namespace: clickhouse
spec:
  configuration:
    clusters:
      - name: onemind
        templates:
          podTemplate: default
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      onemind/password: "onemind2026"
      onemind/networks/ip: "::/0"
      onemind/profile: default
      onemind/quota: default
    settings:
      max_connections: 100
      keep_alive_timeout: 3
  templates:
    volumeClaimTemplates:
      - name: data-storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: do-block-storage-retain
    podTemplates:
      - name: default
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.8
              volumeMounts:
                - name: data-storage
                  mountPath: /var/lib/clickhouse
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "3Gi"
                  cpu: "1000m"
