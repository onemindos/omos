# SealedSecret with real payloads, sealed 2026-11-09 against the cluster key via
# the owner Mac bridge (Live restic + S3 credentials; recovery file confirmed stale).
# Pattern: platform/karakeep/backup-data.sealedsecret.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: home-assistant-config-restic
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_DEFAULT_REGION: 
    AWS_SECRET_ACCESS_KEY: 
    RESTIC_PASSWORD: 
    RESTIC_REPOSITORY: 
  template:
    metadata:
      name: home-assistant-config-restic
      namespace: home-assistant
    type: Opaque
