# Tailnet-only. The Tailscale ingress proxy forwards WebSocket upgrades
# (/api/websocket) without extra annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: ha
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: home-assistant
      port:
        number: 8123
  tls:
  - hosts:
    - ha
