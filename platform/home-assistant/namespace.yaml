apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    onemind.io/layer: make-sense
    # Home Assistant's official image runs as root (s6-overlay), which the
    # restricted profile forbids. Baseline allows root but still blocks
    # privileged, hostPath, hostNetwork and added capabilities.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '-2'
