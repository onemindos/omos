apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '-1'
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
