apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-credentials
  namespace: cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-credentials
        property: api-token
    - secretKey: global-api-key
      remoteRef:
        key: cloudflare-api-credentials
        property: global-api-key
    - secretKey: email
      remoteRef:
        key: cloudflare-api-credentials
        property: email
