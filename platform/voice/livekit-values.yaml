# LiveKit Server — DOKS deployment values
# helm install livekit livekit/livekit-server -n voice --create-namespace -f livekit-values.yaml
livekit:
  port: 7880
  log_level: info
  rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    use_external_ip: true
  keys:
    # inject from 1Password: op://00-24 SO/livekit-api/key
    # onemind_key: <secret>
  redis:
    # Required for multi-node. Single node: leave empty.
    address: ""
loadBalancer:
  type: do
  # clusterIssuer: letsencrypt-dns
