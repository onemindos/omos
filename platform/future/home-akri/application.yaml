# Future home target only; no active Argo parent and no automated sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-akri
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://project-akri.github.io/akri
    chart: akri
    targetRevision: 0.14.0
    helm:
      releaseName: home-akri
  destination:
    name: onemind-home
    namespace: akri
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
