# Future home target only. No active parent references this Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-envoy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: 1.9.2
    helm:
      releaseName: home-envoy
      valuesObject:
        deployment:
          replicas: 1
  destination:
    name: onemind-home
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
