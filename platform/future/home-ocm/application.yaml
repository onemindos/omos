# Future home target only; no active Argo parent and no automated sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-ocm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-cluster-management.io/helm-charts
    chart: cluster-manager
    targetRevision: 1.3.1
    helm:
      releaseName: home-ocm
  destination:
    name: onemind-home
    namespace: open-cluster-management
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
