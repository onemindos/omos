{{- range $key, $component := .Values.components }}
{{- if $component.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $component.name }}-config
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ required "Set the home storageClass before activation" $.Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ $component.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $component.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $component.name }}
        app.kubernetes.io/part-of: onemind-home
    spec:
      automountServiceAccountToken: false
      hostNetwork: {{ $component.hostNetwork }}
      {{- if $component.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      containers:
        - name: {{ $component.name }}
          image: {{ required "An adapter image is required when enabled" $component.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $component.port }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
          volumeMounts:
            - name: config
              mountPath: {{ $component.configPath }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ $component.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $component.name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
{{- end }}
{{- end }}
