# Future home target only. Components remain disabled until a site overlay enables them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-physical
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/future/home-physical/chart
  destination:
    name: onemind-home
    namespace: onemind-home
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
