apiVersion: v1
kind: ServiceAccount
metadata:
  name: onemind-local-chat
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onemind-models
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onemind-local-chat
  labels:
    app.kubernetes.io/name: onemind-local-chat
    app.kubernetes.io/part-of: onemind-ai
spec:
  replicas: 0 # Future home GPU runtime; no activation on today's cloud cluster.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: onemind-local-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onemind-local-chat
        app.kubernetes.io/part-of: onemind-ai
    spec:
      serviceAccountName: onemind-local-chat
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        onemind.io/compute-role: inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          # Verified upstream v0.31.0 multi-platform image digest, 2026-10-08.
          image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - /models/Qwen3-8B
            - --served-model-name
            - onemind-local-chat
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.85"
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onemind-local-chat-auth
                  key: api-key
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/huggingface
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: scratch
              mountPath: /tmp
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: onemind-models
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onemind-local-chat
  labels:
    app.kubernetes.io/name: onemind-local-chat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onemind-local-chat
  ports:
    - name: http
      port: 8000
      targetPort: http
