apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onemind-local-chat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: onemind-local-chat
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: onemind-ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 8000
  egress: [] # Preloaded models and local caches; runtime needs no WAN access.
