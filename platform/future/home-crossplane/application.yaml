# Future home target only. No active parent references this Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-crossplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.4.2
    helm:
      releaseName: home-crossplane
      valuesObject:
        replicas: 1
        resourcesCrossplane:
          requests:
            cpu: 100m
            memory: 256Mi
  destination:
    name: onemind-home
    namespace: crossplane-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
