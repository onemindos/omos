# DELIBERATE FAILURE. This endpoint points at a Service that does not exist, so it is always red. It proves
# that a failing check shows red in Gatus and on the app page, and that GatusEndpointDown fires.
# To remove it once you have seen the alert: delete this file, delete its line from kustomization.yaml
# (configMapGenerator files), commit, and sync platform-gatus.
endpoints:
  - name: test-deliberate-failure
    group: synthetic
    url: "http://test-deliberate-failure.gatus.svc.cluster.local:8080/"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
