# Adds Authentik as an identity provider ("authentik") in OpenRemote's own Keycloak, master realm.
# Sync hook (wave 3, after Keycloak is up). It signs in to the Keycloak admin API with the existing admin credentials
# (secret openremote-env, read by the Job only), then creates or updates the provider and a "sign in with Authentik" button
# appears on the Keycloak login page. Keycloak keeps its own admin login (break-glass); nothing else is changed.
# Federated users are created in the master realm with NO roles: the admin grants roles to the first Authentik user.
apiVersion: batch/v1
kind: Job
metadata:
  name: openremote-idp-config-v1
  namespace: openremote
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '3'
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: idp-config
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
        doks.digitalocean.com/node-pool: onemind-ecosystem-cpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: idp-config
          image: python:3.13.11-alpine@sha256:2f607129b1b915a949320bf0c4831a73d1c1b1be663c2b1d8c93aa35a5f44a95
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: ADMIN_USER
              value: admin
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openremote-env
                  key: ADMIN_PASSWORD
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openremote-oidc
                  key: OAUTH_CLIENT_SECRET
          command: [python, -c]
          args:
            - |
              import json, os, urllib.error, urllib.parse, urllib.request

              base = "http://keycloak:8080/auth"
              issuer = "https://auth.onemindos.dev/application/o/onemind-openremote/"

              def call(method, url, body=None, headers=None, form=None):
                  data = None
                  hdr = dict(headers or {})
                  if form is not None:
                      data = urllib.parse.urlencode(form).encode()
                  elif body is not None:
                      data = json.dumps(body).encode()
                      hdr["Content-Type"] = "application/json"
                  req = urllib.request.Request(url, data=data, method=method, headers=hdr)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          raw = r.read()
                          return r.status, (json.loads(raw) if raw else {})
                  except urllib.error.HTTPError as e:
                      # Bodies can echo submitted credentials: report the status only.
                      return e.code, {}

              status, tok = call("POST", base + "/realms/master/protocol/openid-connect/token", form={
                  "grant_type": "password", "client_id": "admin-cli",
                  "username": os.environ["ADMIN_USER"], "password": os.environ["ADMIN_PASSWORD"]})
              if status != 200:
                  raise SystemExit("Keycloak admin sign-in failed with status " + str(status))
              auth = {"Authorization": "Bearer " + tok["access_token"]}
              idp = {
                  "alias": "authentik", "displayName": "OneMind (Authentik)", "providerId": "oidc",
                  "enabled": True, "trustEmail": False, "storeToken": False, "linkOnly": False,
                  "firstBrokerLoginFlowAlias": "first broker login",
                  "config": {
                      "issuer": issuer,
                      "authorizationUrl": "https://auth.onemindos.dev/application/o/authorize/",
                      "tokenUrl": "https://auth.onemindos.dev/application/o/token/",
                      "userInfoUrl": "https://auth.onemindos.dev/application/o/userinfo/",
                      "jwksUrl": issuer + "jwks/", "useJwksUrl": "true", "validateSignature": "true",
                      "clientId": "onemind-openremote", "clientSecret": os.environ["OAUTH_CLIENT_SECRET"],
                      "clientAuthMethod": "client_secret_post", "defaultScope": "openid email profile",
                      "pkceEnabled": "true", "pkceMethod": "S256", "syncMode": "IMPORT",
                      "backchannelSupported": "false"}}
              url = base + "/admin/realms/master/identity-provider/instances"
              status, _ = call("GET", url + "/authentik", headers=auth)
              if status == 200:
                  status, _ = call("PUT", url + "/authentik", body=idp, headers=auth)
                  action = "updated"
              elif status == 404:
                  status, _ = call("POST", url, body=idp, headers=auth)
                  action = "created"
              else:
                  raise SystemExit("Keycloak identity provider lookup failed with status " + str(status))
              if status not in (200, 201, 204):
                  raise SystemExit("Keycloak identity provider write failed with status " + str(status))
              print("Authentik identity provider " + action + " in the master realm")
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
