apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openremote
  annotations:
    tailscale.com/hostname: openremote
    argocd.argoproj.io/sync-wave: '4'
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: proxy
      port:
        number: 8080
  tls:
    - hosts:
        - openremote
