apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: karakeep
spec:
  replicas: 0
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
        app.kubernetes.io/name: karakeep
        app.kubernetes.io/component: chrome
    spec:
      containers:
      - name: chrome
        image: ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa
        args:
        - --disable-gpu
        - --disable-dev-shm-usage
        - --hide-scrollbars
        - --disable-blink-features=AutomationControlled
        - --window-size=1440,900
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        ports:
        - name: http
          containerPort: 9222
        startupProbe:
          httpGet:
            path: /json/version
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /json/version
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /json/version
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - onemind-ecosystem-cpu
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
  strategy:
    type: Recreate
