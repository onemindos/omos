apiVersion: v1
kind: ConfigMap
metadata:
  name: takml-server-config
  namespace: takml
data:
  application.properties: |
    server.port=8234
    logging.level.org.springframework.web=WARN
    logging.level.com.bbn=INFO
    security.require-ssl=false
    server.ssl.enabled=false
    server.api.key.enabled=true
    springdoc.api-docs.path=/v3/api-docs
    springdoc.swagger-ui.path=/swagger-ui.html
    spring.datasource.url=jdbc:postgresql://takml-db.takml.svc.cluster.local:5432/takml_server
    spring.datasource.username=takml
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
    spring.servlet.multipart.max-file-size=1GB
    spring.servlet.multipart.max-request-size=1GB
    tak.addr=takserver-api-service.takserver.svc.cluster.local
    tak.port=8443
    tak.client_store=/certs/takserver.jks
    # Template: __TAK_STORE_PASS__ is replaced by the render-config init container (deployment.yaml) with the
    # key `store-password` of the sealed Secret takml-tak-client, and the result is written to an in-memory
    # emptyDir mounted at /config. The application reads its own properties file, so a Spring placeholder would
    # not be safe here. Step 3 of the CA/keystore rotation (2026-10-29); the stores are in the same Secret.
    # See docs/operations/tak-ca-password-rotation-step1-2026-10-29.md
    tak.client_store.password=__TAK_STORE_PASS__
    tak.trust_store=/certs/truststore-root.jks
    tak.trust_store.password=__TAK_STORE_PASS__
    takfs.mission_name=takml_takfs_sync_mission
    takfs.takserver.file_limit_size.mb=500
    takfs.segmented_file_upload_timeout_millis=10000
    mx_plugins=com.bbn.takml_server.model_execution.mx_plugins.OnnxMxPlugin,com.bbn.takml_server.model_execution.mx_plugins.PytorchMxPlugin
    models_directory=/models/example_models
