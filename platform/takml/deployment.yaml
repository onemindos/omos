# ─── takml-db ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takml-db
  namespace: takml
  labels:
    app: takml-db
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC — a rolling update deadlocks waiting for the volume
  selector:
    matchLabels:
      app: takml-db
  template:
    metadata:
      labels:
        app: takml-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: takml_server
            - name: POSTGRES_USER
              value: takml
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: takml-db-creds
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: takml-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: takml-db
  namespace: takml
spec:
  selector:
    app: takml-db
  ports:
    - port: 5432
      targetPort: 5432
---
# ─── takml-server ────────────────────────────────────────────────────────────
# NOTE: JAR is loaded from the takml-server-jar PVC.
# On first deploy after a cluster wipe, copy the JAR into the PVC:
#   kubectl run jar-loader --image=busybox --restart=Never -n takml \
#     --overrides='{"spec":{"volumes":[{"name":"jar","persistentVolumeClaim":{"claimName":"takml-server-jar"}}],
#       "containers":[{"name":"jar-loader","image":"busybox","command":["sleep","3600"],"volumeMounts":[{"mountPath":"/jar","name":"jar"}]}]}}'
#   kubectl cp platform/takserver/server/takml_server-2.1.jar takml/jar-loader:/jar/
#   kubectl delete pod jar-loader -n takml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takml-server
  namespace: takml
  labels:
    app: takml-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: takml-server
  template:
    metadata:
      labels:
        app: takml-server
    spec:
      # takml-models is ReadWriteOnce and also mounted by takml-vision-worker, so both
      # pods must share a node. Follow the worker instead of naming a node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: takml-vision-worker
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: check-jar
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /jar/takml_server-2.1.jar ]; then
                echo "JAR not found — copy takml_server-2.1.jar to the takml-server-jar PVC first"
                exit 1
              fi
              echo "JAR present: $(du -sh /jar/takml_server-2.1.jar)"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: jar
              mountPath: /jar
      containers:
        - name: takml-server
          image: eclipse-temurin:21-jre-jammy
          command:
            - java
            - -Dsun.net.client.defaultConnectTimeout=30000
            - -Dsun.net.client.defaultReadTimeout=60000
            - -Djdk.httpclient.connectionPoolSize=5
            - -jar
            - /jar/takml_server-2.1.jar
            - --models_directory=/models/example_models
            - --mx_plugins=com.bbn.takml_server.model_execution.mx_plugins.OnnxMxPlugin,com.bbn.takml_server.model_execution.mx_plugins.PytorchMxPlugin
            - --spring.datasource.url=jdbc:postgresql://takml-db.takml.svc.cluster.local:5432/takml_server
            - --spring.datasource.username=takml
            - --tak.addr=takserver-api-service.takserver.svc.cluster.local
            - --server.ssl.enabled=false
            - --security.require-ssl=false
            - --server.api.key.enabled=true
            - --server.api.key_path=/apikey
            - --server.api.key.param_name=x-api-key
            - --logging.level.com.bbn=DEBUG
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: takml-db-creds
                  key: password
            - name: TAKSERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tak-keystores-copy
                  key: cert-password
                  optional: true
          ports:
            - name: http
              containerPort: 8234
          # 2026-09-28: requests/limits adjusted to actual pod usage (92% node imbalance)
          # Measured usage: 508Mi.
          resources:
            requests:
              cpu: 500m
              memory: 305Mi        # ~60% of measured usage
            limits:
              cpu: "2"
              memory: 640Mi        # ~usage + ~26% headroom
          startupProbe:
            tcpSocket:
              port: 8234
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 30
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8234
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: jar
              mountPath: /jar
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: models
              mountPath: /models
            - name: apikey
              mountPath: /apikey
              readOnly: true
      volumes:
        - name: jar
          persistentVolumeClaim:
            claimName: takml-server-jar
        - name: config
          configMap:
            name: takml-server-config
        - name: certs
          secret:
            secretName: tak-keystores-copy
            optional: true
        - name: models
          persistentVolumeClaim:
            claimName: takml-models
        - name: apikey
          secret:
            secretName: takml-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: takml-server
  namespace: takml
  labels:
    app: takml-server
spec:
  selector:
    app: takml-server
  ports:
    - name: http
      port: 8234
      targetPort: 8234
---
# ─── takml-vision-worker ─────────────────────────────────────────────────────
# Pulls RTSP streams from onetak-media (MediaMTX), runs YOLOv5s (VisDrone model),
# publishes detections to NATS: fabric.vision.{feed_id}.detect
# 2026-09-30: containerized — image ghcr.io/onemindos/takml-vision:1 (code baked in,
# no pip-at-boot). Source: platform/takml/vision/ (Dockerfile + worker.py),
# built by .github/workflows/build-takml-vision.yml. Strategy Recreate —
# single-replica RWO PVCs (models) deadlock under RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takml-vision-worker
  namespace: takml
  labels:
    app: takml-vision-worker
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC — old pod must die before new pod attaches
  selector:
    matchLabels:
      app: takml-vision-worker
  template:
    metadata:
      labels:
        app: takml-vision-worker
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: vision-worker
          image: ghcr.io/onemindos/takml-vision@sha256:0aa83e2148ab0553c92b578d7b422f84726a76170d91eb146bbacdd03d1cfa0b
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: tls://nats.nats.svc.cluster.local:4222
            - name: NATS_USER
              value: onemind
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: takml-nats-creds
                  key: password
            - name: NATS_CA
              value: /etc/nats-ca/ca.crt
            - name: MODEL_PATH
              value: /models/visdrone.torchscript
            - name: CONFIDENCE_THRESHOLD
              value: "0.45"
            - name: SAMPLE_INTERVAL
              value: "2.0"
            - name: FEEDS
              # feeds served by onetak-media (MediaMTX). Streams auto-register on publish.
              value: '{"drone1":"rtsp://onetak-media.onetak.svc.cluster.local:8554/drone1","takcam":"rtsp://onetak-media.onetak.svc.cluster.local:8554/takcam","helmcam":"rtsp://onetak-media.onetak.svc.cluster.local:8554/helmcam","maccam":"rtsp://onetak-media.onetak.svc.cluster.local:8554/maccam"}'  # yamllint disable-line rule:line-length
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: nats-ca
              mountPath: /etc/nats-ca
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: takml-models
        - name: nats-ca
          secret:
            secretName: nats-ca
            items:
              - key: ca.crt
                path: ca.crt
