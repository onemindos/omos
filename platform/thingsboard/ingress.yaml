apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thingsboard
  namespace: thingsboard
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: thingsboard
    argocd.argoproj.io/sync-wave: '4'
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: thingsboard
      port:
        number: 8080
  tls:
    - hosts:
        - thingsboard
