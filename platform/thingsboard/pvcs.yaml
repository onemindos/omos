apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 10Gi
