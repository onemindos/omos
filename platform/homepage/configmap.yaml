            siteMonitor: https://clickhouse.tail717ba0.ts.net

    # ════════════════════════════════════════════════════════
    # DATA & STORAGE
    # ════════════════════════════════════════════════════════
    - Data & Storage:
        - MinIO:
            icon: minio.png
