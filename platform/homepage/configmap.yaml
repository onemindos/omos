apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  # ─── Global Settings ───────────────────────────────────────────────
  settings.yaml: |
    ---
    title: OneMind OS
    description: The nervous system of the homestead — sovereign, local-first intelligence fabric
    theme: dark
    color: red
    headerStyle: boxed
    cardBlur: md
    statusStyle: dot
    target: _blank
    hideVersion: true
    useEqualHeights: true
    fiveColumns: true
    fullWidth: true
    showStats: true
    language: en
    background:
      image: https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=2560
      blur: sm
      opacity: 20
      brightness: 60
    layout:
      Infrastructure:
        style: row
        columns: 4
      AI & Agents:
        style: row
        columns: 4
      Communication:
        style: row
        columns: 3
      Tactical:
        style: row
        columns: 4
      Intelligence:
        style: row
        columns: 4
      Data & Storage:
        style: row
        columns: 3
      Observability:
        style: row
        columns: 3
      Geospatial:
        style: row
        columns: 4
      External:
        style: row
        columns: 2
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
    providers:
      openweathermap: openweathermapapi
      weatherapi: weatherapiapi

  # ─── Kubernetes — disabled
  kubernetes.yaml: ""

  # ─── Docker — disabled
  docker.yaml: ""

  # ─── Bookmarks — disabled
  bookmarks.yaml: ""

  # ─── Widgets ────────────────────────────────────────────────────────
  widgets.yaml: ""
  
  # ─── Service Groups ─────────────────────────────────────────────────
  services.yaml: |
    ---
    # ════════════════════════════════════════════════════════════════
    # INFRASTRUCTURE
    # ════════════════════════════════════════════════════════════════
    - Infrastructure:
        - ArgoCD:
            icon: si-argo
            href: https://argocd.tail717ba0.ts.net
            description: GitOps continuous deployment
            widget:
              type: argocd
              url: https://argocd.tail717ba0.ts.net
        - Kubernetes Dashboard:
            icon: si-kubernetes
            href: https://k8s-dashboard.tail717ba0.ts.net
            description: Cluster management UI
        - Headlamp:
            icon: si-kubernetes
            href: https://headlamp.tail717ba0.ts.net
            description: Modern K8s dashboard
        - Tailscale:
            icon: si-tailscale
            href: https://login.tailscale.com/admin/machines
            description: Mesh VPN — all devices

    # ════════════════════════════════════════════════════════════════
    # AI & AGENTS
    # ════════════════════════════════════════════════════════════════
    - AI & Agents:
        - Hermes Web UI:
            icon: mdi-brain
            href: https://hermes-agent.tail717ba0.ts.net
            description: Legacy chat interface
        - Agent Web UI:
            icon: mdi-robot
            href: https://agent-web-ui-1.tail717ba0.ts.net
            description: NATS agent browser
        - Agent Monitor:
            icon: mdi-pulse
            href: https://agenttap-1.tail717ba0.ts.net
            description: Real-time agent TUI
        - OpenClaw:
            icon: mdi-paw
            href: https://openclaw.tail717ba0.ts.net
            description: Agent orchestration

    # ════════════════════════════════════════════════════════════════
    # COMMUNICATION
    # ════════════════════════════════════════════════════════════════
    - Communication:
        - Element Chat:
            icon: si-element
            href: https://element.onemindos.com
            description: Matrix chat client
        - HeyNATS:
            icon: mdi-chat-processing
            href: https://heynats-1.tail717ba0.ts.net
            description: NATS pub/sub debugger

    # ════════════════════════════════════════════════════════════════
    # TACTICAL
    # ════════════════════════════════════════════════════════════════
    - Tactical:
        - OneTAK:
            icon: mdi-target
            href: https://onetak.onemindos.dev
            description: Cloud TAK — common operational picture
        - TAK Server:
            icon: mdi-server-security
            href: https://tak.onemindos.dev:8446
            description: TAK 5.8 hardened server
        - TAK Portal:
            icon: mdi-account-key
            href: https://enroll.onemindos.dev
            description: Device enrollment
        - FedHub:
            icon: mdi-hubspot
            href: https://fedhub.onemindos.dev
            description: Federation hub
        - TAK-ML:
            icon: mdi-image-filter-vintage
            description: Vision pipeline — TAK ML

    # ════════════════════════════════════════════════════════════════
    # INTELLIGENCE
    # ════════════════════════════════════════════════════════════════
    - Intelligence:
        - NATS Dashboard:
            icon: mdi-chart-bell-curve
            href: https://nats-dashboard-1.tail717ba0.ts.net
            description: NATS stream monitor
        - NATS UI:
            icon: mdi-console
            href: https://nats-ui-1.tail717ba0.ts.net
            description: JetStream browser
        - NATS Surveyor:
            icon: mdi-chart-scatter-plot
            description: Metrics endpoint
        - Redpanda Connect:
            icon: mdi-pipe
            description: Data pipelines

    # ════════════════════════════════════════════════════════════════
    # DATA & STORAGE
    # ════════════════════════════════════════════════════════════════
    - Data & Storage:
        - ClickHouse:
            icon: si-clickhouse
            description: 10-year event time machine
            widget:
              type: clickhouse
              url: http://clickhouse-onemind.clickhouse.svc.cluster.local:8123
              database: onemind
        - MinIO:
            icon: si-minio
            description: Object storage
        - PostGIS:
            icon: si-postgresql
            description: Spatial database

    # ════════════════════════════════════════════════════════════════
    # OBSERVABILITY
    # ════════════════════════════════════════════════════════════════
    - Observability:
        - Grafana:
            icon: si-grafana
            href: https://grafana.tail717ba0.ts.net
            description: Dashboards & alerts
            widget:
              type: grafana
              url: https://grafana.tail717ba0.ts.net
        - Hubble:
            icon: mdi-magnify-scan
            href: https://hubble.tail717ba0.ts.net
            description: Network observability

    # ════════════════════════════════════════════════════════════════
    # GEOSPATIAL
    # ════════════════════════════════════════════════════════════════
    - Geospatial:
        - TileServer GL:
            icon: mdi-map
            href: https://tileserver.onemindos.dev
            description: Vector tile server
        - Valhalla:
            icon: si-valhalla
            href: https://valhalla.onemindos.dev
            description: Routing engine
        - Overpass:
            icon: mdi-database-search
            href: https://overpass.onemindos.dev
            description: OSM query API
        - Maputnik:
            icon: mdi-palette-swatch
            href: https://maputnik.onemindos.dev
            description: Map style editor
        - Martin:
            icon: mdi-server-plus
            description: PG tile server
        - pg_featureserv:
            icon: mdi-feature-search
            description: OGC Features API
        - STAC API:
            icon: mdi-image-multiple
            description: SpatioTemporal Asset Catalog
        - STAC Browser:
            icon: mdi-image-search
            description: STAC catalog browser
        - Nominatim:
            icon: mdi-map-marker
            description: Geocoding
        - Tile38:
            icon: mdi-fencing
            description: Real-time geofencing
        - WebODM:
            icon: mdi-drone
            description: Drone imagery processing

    # ════════════════════════════════════════════════════════════════
    # EXTERNAL
    # ════════════════════════════════════════════════════════════════
    - External:
        - Zeus Delacruz:
            icon: mdi-web
            href: https://zeusdelacruz.com
            description: Personal brand site
        - OneMind OS:
            icon: mdi-infinity
            href: https://onemindos.dev
            description: Main platform

  # ─── Custom CSS ────────────────────────────────────────────────────
  custom.css: |
    /* ═══════════════════════════════════════════════
       OneMind OS — Black / White / Red theme
       Targets Homepage v1.x Tailwind theme-* classes
    ═══════════════════════════════════════════════ */

    /* ── Pure black background ── */
    body, #__next, main {
      background-color: #000000 !important;
    }

    /* ── Cards: near-black with red border glow ── */
    .bg-theme-800,
    .dark\:bg-theme-800 {
      background-color: #0a0a0a !important;
      border: 1px solid rgba(220, 38, 38, 0.18) !important;
      border-radius: 12px !important;
      transition: box-shadow 0.25s ease, border-color 0.25s ease !important;
    }
    .bg-theme-800:hover,
    .dark\:bg-theme-800:hover {
      border-color: rgba(220, 38, 38, 0.5) !important;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.12) !important;
    }

    /* ── Section group headers: red + uppercase ── */
    .text-theme-800,
    .dark\:text-theme-200 {
      color: #ffffff !important;
    }
    .text-theme-700,
    .dark\:text-theme-300 {
      color: #e5e5e5 !important;
    }

    /* ── Group title row ── */
    h2, h3 {
      color: #dc2626 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      font-size: 0.7rem !important;
      font-weight: 800 !important;
      border-bottom: 1px solid rgba(220, 38, 38, 0.25) !important;
      padding-bottom: 6px !important;
      margin-bottom: 10px !important;
    }

    /* ── Header bar ── */
    header, #page-header {
      background-color: #050505 !important;
      border-bottom: 1px solid rgba(220, 38, 38, 0.3) !important;
    }

    /* ── Header title ── */
    header h1, #page-header h1 {
      color: #ffffff !important;
      font-weight: 900 !important;
      letter-spacing: 0.04em !important;
    }

    /* ── Borders ── */
    .border-theme-800,
    .dark\:border-theme-200\/50 {
      border-color: rgba(220, 38, 38, 0.2) !important;
    }
    .border-slate-700 {
      border-color: rgba(220, 38, 38, 0.2) !important;
    }

    /* ── Service name text ── */
    .service-title, [class*="service"] span, a span {
      color: #ffffff !important;
    }

    /* ── Description text ── */
    .text-sm, .text-xs {
      color: #a3a3a3 !important;
    }

    /* ── Pill / badge ── */
    .bg-theme-50, .dark\:bg-theme-60 {
      background-color: rgba(220, 38, 38, 0.12) !important;
      color: #ff6666 !important;
    }

    /* ── Icons: red tint on hover ── */
    li:hover img, li:hover svg {
      filter: drop-shadow(0 0 5px rgba(220, 38, 38, 0.45)) !important;
    }

    /* ── Search / quicklaunch ── */
    input[type="text"], input[type="search"] {
      background-color: #111111 !important;
      border: 1px solid rgba(220, 38, 38, 0.3) !important;
      color: #ffffff !important;
      border-radius: 10px !important;
    }
    input[type="text"]:focus, input[type="search"]:focus {
      border-color: #dc2626 !important;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2) !important;
      outline: none !important;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ef4444; }

  custom.js: |
    // OneMind OS — Legacy Control Panel
    console.log("%c🔴 OneMind Control Panel • Legacy is watching","color:#dc2626;font-size:16px;");
