apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  # ─── Global Settings ───────────────────────────────────────────────────────
  settings.yaml: |
    ---
    title: OneMind OS
    description: Sovereign intelligence fabric
    theme: dark
    color: red
    headerStyle: clean
    cardBlur: sm
    statusStyle: dot
    target: _blank
    hideVersion: true
    useEqualHeights: true
    fullWidth: true
    iconStyle: theme
    language: en
    layout:
      Infrastructure:
        style: row
        columns: 4
        icon: mdi-server-network
      AI & Agents:
        style: row
        columns: 4
        icon: mdi-brain
      Communication:
        style: row
        columns: 3
        icon: mdi-chat
      Tactical:
        style: row
        columns: 4
        icon: mdi-crosshairs-gps
      Intelligence:
        style: row
        columns: 4
        icon: mdi-chart-line
      Data & Storage:
        style: row
        columns: 3
        icon: mdi-database
      Observability:
        style: row
        columns: 3
        icon: mdi-eye
      Geospatial:
        style: row
        columns: 4
        icon: mdi-map
      External:
        style: row
        columns: 2
        icon: mdi-web
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      provider: google

  # ─── Kubernetes — cluster mode for auto-discovery ──────────────────────────
  kubernetes.yaml: |
    mode: cluster

  # ─── Docker — disabled ─────────────────────────────────────────────────────
  docker.yaml: |
    ---

  # ─── Bookmarks ─────────────────────────────────────────────────────────────
  bookmarks.yaml: |
    ---
    - Quick Links:
        - GitHub:
            icon: si-github
            href: https://github.com/onemindos
            description: OneMind repos
        - DigitalOcean:
            icon: si-digitalocean
            href: https://cloud.digitalocean.com
            description: DOKS cluster
        - Cloudflare:
            icon: si-cloudflare
            href: https://dash.cloudflare.com
            description: DNS & edge
        - Tailscale Admin:
            icon: si-tailscale
            href: https://login.tailscale.com/admin
            description: Mesh VPN admin

  # ─── Info Widgets ──────────────────────────────────────────────────────────
  widgets.yaml: |
    ---
    - logo:
        icon: https://onemindos.dev/favicon.ico
    - greeting:
        text_size: xl
        text: "OneMind OS"
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "DOKS"
        nodes:
          show: false
    - search:
        provider: google
        target: _blank
        placeholder: Search...

  # ─── Services ──────────────────────────────────────────────────────────────
  services.yaml: |
    ---
    # ════════════════════════════════════════════════════════
    # INFRASTRUCTURE
    # ════════════════════════════════════════════════════════
    - Infrastructure:
        - ArgoCD:
            icon: argocd.png
            href: https://argocd.tail717ba0.ts.net
            description: GitOps CD
            siteMonitor: https://argocd.tail717ba0.ts.net
            widget:
              type: argocd
              url: https://argocd.tail717ba0.ts.net
              key: ""
        - Kubernetes Dashboard:
            icon: kubernetes.png
            href: https://k8s-dashboard.tail717ba0.ts.net
            description: Cluster UI
            siteMonitor: https://k8s-dashboard.tail717ba0.ts.net
        - Tailscale:
            icon: tailscale.png
            href: https://login.tailscale.com/admin/machines
            description: Mesh VPN

    # ════════════════════════════════════════════════════════
    # AI & AGENTS
    # ════════════════════════════════════════════════════════
    - AI & Agents:
        - Hermes (Legacy):
            icon: mdi-brain-FFFFFF
            href: https://hermes-agent.tail717ba0.ts.net
            description: Legacy AI — cloud
            siteMonitor: https://hermes-agent.tail717ba0.ts.net
        - Agent Web UI:
            icon: mdi-robot-FFFFFF
            href: https://agent-web-ui-1.tail717ba0.ts.net
            description: NATS agent browser
            siteMonitor: https://agent-web-ui-1.tail717ba0.ts.net
        - OpenClaw:
            icon: mdi-paw-FFFFFF
            href: https://openclaw.tail717ba0.ts.net
            description: Agent orchestration
            siteMonitor: https://openclaw.tail717ba0.ts.net
        - NATS Dashboard:
            icon: mdi-chart-bell-curve-FFFFFF
            href: https://nats-dashboard-1.tail717ba0.ts.net
            description: NATS stream monitor
            siteMonitor: https://nats-dashboard-1.tail717ba0.ts.net

    # ════════════════════════════════════════════════════════
    # COMMUNICATION
    # ════════════════════════════════════════════════════════
    - Communication:
        - Element Chat:
            icon: element.png
            href: https://element.onemindos.com
            description: Matrix E2EE chat
            siteMonitor: https://element.onemindos.com
        - Matrix Synapse:
            icon: matrix-light.png
            href: https://matrix.onemindos.com
            description: Homeserver
            siteMonitor: https://matrix.onemindos.com
        - HeyNATS:
            icon: mdi-chat-processing-FFFFFF
            href: https://heynats-1.tail717ba0.ts.net
            description: NATS pub/sub debugger

    # ════════════════════════════════════════════════════════
    # TACTICAL
    # ════════════════════════════════════════════════════════
    - Tactical:
        - CloudTAK:
            icon: mdi-target-account-FFFFFF
            href: https://atoc.onemindos.dev
            description: Cloud TAK — COP
            siteMonitor: https://atoc.onemindos.dev
        - TAK Server:
            icon: mdi-server-security-FFFFFF
            href: https://tak.onemindos.dev:8446
            description: TAK 5.8 hardened
            siteMonitor: https://152.42.155.95:8446
        - OneTAK:
            icon: mdi-crosshairs-gps-FFFFFF
            href: https://onetak.onemindos.dev
            description: OneMind TAK platform
        - FedHub:
            icon: mdi-hub-FFFFFF
            href: https://fedhub.onemindos.dev
            description: TAK federation hub

    # ════════════════════════════════════════════════════════
    # INTELLIGENCE
    # ════════════════════════════════════════════════════════
    - Intelligence:
        - Grafana:
            icon: grafana.png
            href: https://grafana.tail717ba0.ts.net
            description: Dashboards & alerts
            siteMonitor: https://grafana.tail717ba0.ts.net
            widget:
              type: grafana
              url: https://grafana.tail717ba0.ts.net
              username: admin
              password: ""
        - NATS UI:
            icon: mdi-console-FFFFFF
            href: https://nats-ui-1.tail717ba0.ts.net
            description: JetStream browser
            siteMonitor: https://nats-ui-1.tail717ba0.ts.net
        - Agent Monitor:
            icon: mdi-pulse-FFFFFF
            href: https://agenttap-1.tail717ba0.ts.net
            description: Real-time agent TUI
        - ClickHouse:
            icon: clickhouse.png
            href: https://clickhouse.tail717ba0.ts.net
            description: 10-year event DB

    # ════════════════════════════════════════════════════════
    # DATA & STORAGE
    # ════════════════════════════════════════════════════════
    - Data & Storage:
        - MinIO:
            icon: minio.png
            href: https://minio.tail717ba0.ts.net
            description: Object storage
            siteMonitor: https://minio.tail717ba0.ts.net
        - PostGIS:
            icon: postgresql.png
            href: https://pgadmin.tail717ba0.ts.net
            description: Spatial database
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.tail717ba0.ts.net
            description: Distributed block storage
            siteMonitor: https://longhorn.tail717ba0.ts.net

    # ════════════════════════════════════════════════════════
    # OBSERVABILITY
    # ════════════════════════════════════════════════════════
    - Observability:
        - Hubble UI:
            icon: mdi-eye-network-FFFFFF
            href: https://hubble.tail717ba0.ts.net
            description: Cilium network flows
            siteMonitor: https://hubble.tail717ba0.ts.net
        - NATS Surveyor:
            icon: mdi-chart-scatter-plot-FFFFFF
            href: https://nats-surveyor-1.tail717ba0.ts.net
            description: NATS metrics
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.tail717ba0.ts.net
            description: Metrics scraper
            siteMonitor: https://prometheus.tail717ba0.ts.net

    # ════════════════════════════════════════════════════════
    # GEOSPATIAL
    # ════════════════════════════════════════════════════════
    - Geospatial:
        - TileServer GL:
            icon: mdi-map-FFFFFF
            href: https://tileserver.onemindos.dev
            description: Vector tiles
            siteMonitor: https://tileserver.onemindos.dev
        - Valhalla:
            icon: mdi-road-variant-FFFFFF
            href: https://valhalla.onemindos.dev
            description: Routing engine
        - Maputnik:
            icon: mdi-palette-swatch-FFFFFF
            href: https://maputnik.onemindos.dev
            description: Map style editor
        - WebODM:
            icon: mdi-drone-FFFFFF
            href: https://webodm.onemindos.dev
            description: Drone imagery

    # ════════════════════════════════════════════════════════
    # EXTERNAL
    # ════════════════════════════════════════════════════════
    - External:
        - Zeus Delacruz:
            icon: mdi-account-circle-FFFFFF
            href: https://zeusdelacruz.com
            description: Personal brand
            siteMonitor: https://zeusdelacruz.com
        - OneMind OS:
            icon: mdi-infinity-FFFFFF
            href: https://onemindos.dev
            description: Main platform
            siteMonitor: https://onemindos.dev

  # ─── Custom CSS ────────────────────────────────────────────────────────────
  custom.css: |
    /*
     * OneMind OS — Black / White / Red
     * Homepage uses Tailwind JIT — target element selectors, not utility classes
     */

    /* ── Background ── */
    body {
      background-color: #000 !important;
    }

    /* ── Header ── */
    #page-header {
      background: linear-gradient(180deg, #0d0d0d 0%, #000 100%) !important;
      border-bottom: 1px solid rgba(220,38,38,0.35) !important;
    }

    /* ── Title ── */
    #page-header h1 {
      background: linear-gradient(90deg, #fff 0%, #dc2626 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      font-weight: 900 !important;
      letter-spacing: 0.06em !important;
    }

    /* ── Page description ── */
    #page-header p {
      color: rgba(255,255,255,0.45) !important;
      font-size: 0.75rem !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
    }

    /* ── Service cards ── */
    #services li > a,
    #services li > div {
      background: rgba(10,10,10,0.95) !important;
      border: 1px solid rgba(255,255,255,0.06) !important;
      border-radius: 12px !important;
      transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
    }
    #services li > a:hover,
    #services li > div:hover {
      border-color: rgba(220,38,38,0.45) !important;
      box-shadow: 0 0 18px rgba(220,38,38,0.1), 0 4px 20px rgba(0,0,0,0.6) !important;
    }

    /* ── Group headers ── */
    #services h2,
    #bookmarks h2 {
      font-size: 0.65rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.15em !important;
      text-transform: uppercase !important;
      color: #dc2626 !important;
      border-bottom: 1px solid rgba(220,38,38,0.2) !important;
      padding-bottom: 4px !important;
    }

    /* ── Service name ── */
    #services .service-title,
    #services li span.text-sm {
      color: #fff !important;
      font-weight: 600 !important;
    }

    /* ── Service description ── */
    #services li span.text-xs {
      color: rgba(255,255,255,0.4) !important;
    }

    /* ── Widget stat values ── */
    #services .stat-value,
    #services [class*="stat"] {
      color: #fff !important;
    }

    /* ── Widget stat labels ── */
    #services .stat-label {
      color: rgba(255,255,255,0.45) !important;
      font-size: 0.65rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
    }

    /* ── Info widgets bar ── */
    #information-widgets {
      background: rgba(8,8,8,0.9) !important;
      border-bottom: 1px solid rgba(255,255,255,0.05) !important;
    }

    /* ── Bookmarks ── */
    #bookmarks a {
      background: rgba(10,10,10,0.95) !important;
      border: 1px solid rgba(255,255,255,0.06) !important;
      border-radius: 10px !important;
      color: rgba(255,255,255,0.8) !important;
      transition: all 0.2s ease !important;
    }
    #bookmarks a:hover {
      border-color: rgba(220,38,38,0.4) !important;
      color: #fff !important;
    }

    /* ── Quick launch ── */
    #quicklaunch input {
      background: rgba(15,15,15,0.9) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 10px !important;
      color: #fff !important;
    }
    #quicklaunch input:focus {
      border-color: #dc2626 !important;
      box-shadow: 0 0 0 2px rgba(220,38,38,0.15) !important;
    }

    /* ── Status dot — make green dots slightly red-tinted on success ── */
    .status-dot-green {
      box-shadow: 0 0 4px rgba(34,197,94,0.5) !important;
    }
    .status-dot-red {
      box-shadow: 0 0 6px rgba(220,38,38,0.7) !important;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #ef4444; }

    /* ── Icons white fill for mdi theme icons ── */
    img[src*="mdi-"] {
      filter: brightness(0) invert(1) !important;
    }

  custom.js: |
    // OneMind OS — Legacy
    console.log("%c🔴 OneMind OS | Legacy is watching", "color:#dc2626;font-weight:bold;font-size:14px;");
