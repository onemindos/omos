    # ════════════════════════════════════════════════════════
  # ─── Custom CSS ────────────────────────────────────────────────────────────
  custom.css: |
    /* The built-in Homepage theme toggle adds .light or .dark to #page_wrapper. */
    /* Swap the matching OneMind brain/circuit mark with Homepage's theme. */
    :root {
      color-scheme: light dark;
      --legacy-accent: #ff4d49;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #page_wrapper.dark .information-widget-logo img {
      content: url("/images/onemind-logo-dark.png");
    }

    #page_wrapper.light .information-widget-logo img {
      content: url("/images/onemind-logo-light.jpg");
      mix-blend-mode: multiply;
    }

    #page_wrapper.dark {
      --legacy-surface: rgba(5, 5, 5, 0.82);
      --legacy-surface-hover: rgba(12, 12, 12, 0.92);
      --legacy-outline: rgba(255, 255, 255, 0.16);
      --legacy-text: #fff;
      --legacy-muted: rgba(255, 255, 255, 0.72);
    }

    #page_wrapper.light {
      --legacy-surface: rgba(255, 255, 255, 0.88);
      --legacy-surface-hover: rgba(255, 255, 255, 0.96);
      --legacy-outline: rgba(0, 0, 0, 0.14);
      --legacy-text: #161616;
      --legacy-muted: rgba(22, 22, 22, 0.68);
    }

    #page_wrapper.dark #page_container {
      background-color: #000;
      background-image: url("/images/legacy-background-dark.webp");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    #page_wrapper.light #page_container {
      background-color: #fff;
      background-image: url("/images/legacy-background-light.webp");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    #theme {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 60;
      padding: 0.125rem 0.35rem;
      border: 1px solid var(--legacy-outline);
      border-radius: 999px;
      background: var(--legacy-surface);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(12px);
    }

    #theme svg {
      transition: color 160ms ease;
    }

    #theme svg:hover {
      color: var(--legacy-accent);
    }

    header {
      background: var(--legacy-surface);
      border-bottom: 1px solid var(--legacy-outline);
      backdrop-filter: blur(12px);
    }

    #services .service-card,
    #bookmarks .bookmark > a {
      border: 1px solid var(--legacy-outline);
      background-color: var(--legacy-surface) !important;
      color: var(--legacy-text);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    #services .service-card:hover,
    #bookmarks .bookmark > a:hover {
      border-color: var(--legacy-accent);
      background-color: var(--legacy-surface-hover) !important;
      transform: translateY(-2px);
    }

    #services h2,
    #bookmarks h2 {
      color: var(--legacy-text);
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    #services .service-description,
    #bookmarks .bookmark-description {
      color: var(--legacy-muted);
    }

    #page_wrapper input:focus,
    #page_wrapper select:focus {
      border-color: var(--legacy-accent);
      box-shadow: 0 0 0 2px rgba(255, 77, 73, 0.2);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--legacy-outline); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--legacy-accent); }

  custom.js: |
    // OneMind OS — Legacy
    console.log("%c🔴 OneMind OS | Legacy is watching", "color:#ff4d49;font-weight:bold;font-size:14px;");
