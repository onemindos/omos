apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  # ─── Global Settings ───────────────────────────────────────────────────────
  settings.yaml: |
    ---
    title: OneMind OS
    description: Sovereign intelligence fabric
    color: neutral
    headerStyle: clean
    cardBlur: sm
    statusStyle: dot
    target: _blank
    hideVersion: true
    useEqualHeights: true
    fullWidth: true
    iconStyle: theme
    language: en
    layout:
      Infrastructure:
        style: row
        columns: 4
        icon: mdi-server-network
      AI & Agents:
        style: row
        columns: 4
        icon: mdi-brain
      Communication:
        style: row
        columns: 3
        icon: mdi-chat
      Tactical:
        style: row
        columns: 4
        icon: mdi-crosshairs-gps
      Intelligence:
        style: row
        columns: 4
        icon: mdi-chart-line
      Data & Storage:
        style: row
        columns: 3
        icon: mdi-database
      Observability:
        style: row
        columns: 3
        icon: mdi-eye
      Geospatial:
        style: row
        columns: 4
        icon: mdi-map
      Zoho Apps:
        style: row
        columns: 2
        icon: mdi-apps
      Personal Tools:
        style: row
        columns: 3
        icon: mdi-account-cog
      Personal Finance:
        style: row
        columns: 3
        icon: mdi-bank
      External:
        style: row
        columns: 2
        icon: mdi-web
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      provider: google

  # ─── Kubernetes — cluster mode for auto-discovery ──────────────────────────
  kubernetes.yaml: |
    mode: cluster

  # ─── Docker — disabled ─────────────────────────────────────────────────────
  docker.yaml: |
    ---

  # ─── Bookmarks ─────────────────────────────────────────────────────────────
  bookmarks.yaml: |
    ---
    - Quick Links:
        - GitHub:
            - icon: si-github
              href: https://github.com/onemindos
              description: OneMind repos
        - DigitalOcean:
            - icon: si-digitalocean
              href: https://cloud.digitalocean.com
              description: DOKS cluster
        - Cloudflare:
            - icon: si-cloudflare
              href: https://dash.cloudflare.com/ce13703e0b76938c179ebc51e2945c7e/home
              description: DNS & edge
        - Tailscale Admin:
            - icon: si-tailscale
              href: https://login.tailscale.com/admin
              description: Mesh VPN admin
        - ArgoCD:
            - icon: argocd.png
              href: https://argocd.tail717ba0.ts.net
              description: GitOps deployments
        - Kubernetes Dashboard:
            - icon: kubernetes.png
              href: https://k8s-dashboard.tail717ba0.ts.net
              description: Cluster workloads
        - Grafana:
            - icon: grafana.png
              href: https://grafana.tail717ba0.ts.net
              description: Monitoring and alerts

  # ─── Info Widgets ──────────────────────────────────────────────────────────
  widgets.yaml: |
    ---
    - logo:
        icon: /images/onemind-logo-dark.png
    - greeting:
        text_size: xl
        text: "OneMind OS"
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "DOKS"
        nodes:
          show: false
    - search:
        provider: google
        target: _blank
        placeholder: Search...

