apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: omos-platform
data:
  settings.yaml: |
    title: One Mind OS
    description: Sovereign Operations Dashboard

    background:
      image: https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=1920&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 50

    theme: dark
    color: slate
    useEqualHeights: true
    headerStyle: clean

    layout:
      One Mind Command:
        style: row
        columns: 4
      Tactical Stack:
        style: row
        columns: 3
      Intelligence Bus:
        style: row
        columns: 3
      Legacy Agents:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 4
      Cloud Consoles:
        style: row
        columns: 5

    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      hideVisitURL: false
      provider: google

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /

    - search:
        provider: google
        target: _blank

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
          hourCycle: h23

    - openmeteo:
        label: Tampa, FL
        latitude: 27.9506
        longitude: -82.4572
        timezone: America/New_York
        units: imperial
        cache: 5

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    # No local Docker — all workloads in DOKS

  bookmarks.yaml: |
    - Identity & Brand:
      - Zeus Delacruz:
        - href: https://zeusdelacruz.com
          icon: mdi-account-star
      - OneMind OS:
        - href: https://weareonemind.com
          icon: mdi-rocket-launch
      - Webflow Dashboard:
        - href: https://webflow.com/dashboard?workspace=zeuss-workspace-594d0a
          icon: si-webflow
      - Skool Community:
        - href: https://www.skool.com
          icon: mdi-account-group

    - Operations:
      - GoHighLevel CRM:
        - href: https://app.gohighlevel.com
          icon: mdi-bullseye-arrow
      - Mercury Bank:
        - href: https://app.mercury.com/panorama
          icon: mdi-bank-outline
      - Composio Apps:
        - href: https://dashboard.composio.dev/onemind/~/connect/apps
          icon: mdi-connection
      - Hermes Session:
        - href: http://omos-mbp.tail717ba0.ts.net:8787
          icon: mdi-robot

    - Dev Tools:
      - GitHub OneMind Org:
        - href: https://github.com/onemindos
          icon: si-github
      - GitHub Enterprise:
        - href: https://github.com/enterprises/onemind
          icon: si-github
      - GitHub Zeus:
        - href: https://github.com/Zeus-Delacruz
          icon: si-github
      - Fastmail:
        - href: https://app.fastmail.com
          icon: mdi-email
      - Todoist:
        - href: https://app.todoist.com
          icon: si-todoist

  services.yaml: |
    - One Mind Command:
        - Grafana:
            href: http://monitoring-grafana.monitoring.svc.cluster.local:80
            description: Metrics & dashboards
            icon: si-grafana
            widget:
              type: grafana
              url: http://monitoring-grafana.monitoring.svc.cluster.local:80
              username: admin
              password: prom-operator

        - ArgoCD:
            href: http://argocd-server.argocd.svc.cluster.local:80
            description: GitOps deployments
            icon: si-argo
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local:80
              key: "{{ARGO_API_KEY}}"

        - Prometheus:
            href: http://prometheus-monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
            description: Metrics engine
            icon: si-prometheus
            widget:
              type: prometheus
              url: http://prometheus-monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

        - Uptime Kuma:
            href: http://146.190.143.195:3001
            description: Service uptime monitor
            icon: si-uptimekuma
            widget:
              type: uptimekuma
              url: http://146.190.143.195:3001
              slug: default

    - Tactical Stack:
        - TAK Server:
            href: https://152.42.155.95:8446
            description: Tactical awareness server
            icon: mdi-map-marker-radius
            ping: https://152.42.155.95:8446

        - Murmur Voice:
            href: http://146.190.143.195:64738
            description: Encrypted voice comms (64738)
            icon: mdi-microphone
            ping: http://146.190.143.195:64738

    - Intelligence Bus:
        - NATS Cluster:
            href: http://nats-headless.nats.svc.cluster.local:8222
            description: 3-node JetStream cluster
            icon: mdi-transit-connection-variant
            widget:
              type: customapi
              url: http://nats-headless.nats.svc.cluster.local:8222/varz
              mappings:
                - field: server_name
                  label: Server
                  format: text
                - field: connections
                  label: Connections
                  format: number
                - field: in_msgs
                  label: In Msgs
                  format: number
                - field: out_msgs
                  label: Out Msgs
                  format: number

        - NATS Surveyor:
            href: http://nats-surveyor.nats.svc.cluster.local:7777
            description: NATS observability
            icon: mdi-binoculars
            ping: http://nats-surveyor.nats.svc.cluster.local:7777

        - ClickHouse:
            href: http://chi-onemind-onemind-0-0.clickhouse.svc.cluster.local:8123/play
            description: OLAP analytics database
            icon: si-clickhouse
            ping: http://chi-onemind-onemind-0-0.clickhouse.svc.cluster.local:8123

    - Legacy Agents:
        - Hermes Legacy:
            href: http://hermes-legacy.hermes.svc.cluster.local
            description: Hermes AI agent (legacy)
            icon: mdi-robot
            ping: http://hermes-legacy.hermes.svc.cluster.local

        - Hermes WebUI:
            href: https://hermes-webui.onemindos.dev
            description: Hermes AI web interface
            icon: mdi-robot-outline
            ping: https://hermes-webui.onemindos.dev

    - Infrastructure:
        - cert-manager:
            href: http://cert-manager.cert-manager.svc.cluster.local:9402
            description: TLS certificate automation
            icon: mdi-certificate-outline
            ping: http://cert-manager.cert-manager.svc.cluster.local:9402

        - ingress-nginx:
            href: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
            description: HTTP ingress controller
            icon: si-nginx
            ping: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80

        - Tailscale Operator:
            href: http://operator.tailscale.svc.cluster.local
            description: Mesh VPN operator
            icon: si-tailscale
            ping: http://operator.tailscale.svc.cluster.local

        - Cloudflared:
            href: http://cloudflared.cloudflare.svc.cluster.local:2000/ready
            description: Cloudflare tunnel connector
            icon: si-cloudflare
            ping: http://cloudflared.cloudflare.svc.cluster.local:2000

    - Cloud Consoles:
        - AWS Console:
            href: https://us-east-1.console.aws.amazon.com/console/
            description: Amazon Web Services
            icon: si-amazonaws

        - Synadia NGS:
            href: https://app.ngs.global
            description: Global NATS network
            icon: mdi-cloud-braces

        - Tailscale Admin:
            href: https://login.tailscale.com/admin/machines
            description: Mesh VPN admin panel
            icon: si-tailscale

        - Cloudflare:
            href: https://dash.cloudflare.com
            description: CDN & DNS management
            icon: si-cloudflare

        - DigitalOcean:
            href: https://cloud.digitalocean.com
            description: DOKS cluster host
            icon: si-digitalocean
