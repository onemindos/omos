apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
    onemind.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      initContainers:
        - name: copy-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              cp /tmp/config-map/* /tmp/config-writable/
              mkdir -p /tmp/config-writable/logs
              chmod -R 777 /tmp/config-writable/
              echo "Config copied to writable volume"
          volumeMounts:
            - name: config-map
              mountPath: /tmp/config-map
            - name: config
              mountPath: /tmp/config-writable
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.0.2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.tail717ba0.ts.net,localhost,127.0.0.1,$(POD_IP)"
            - name: HOMEPAGE_VAR_TITLE
              value: "OneMind OS"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: images
              mountPath: /app/public/images
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://localhost:3000/api/healthcheck
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://localhost:3000/api/healthcheck
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config-map
          configMap:
            name: homepage-config
        - name: config
          emptyDir: {}
        - name: images
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
      name: http
