apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - ingress.yaml
configMapGenerator:
  - name: homepage-assets
    namespace: homepage
    files:
      - assets/legacy-background-dark.jpg
      - assets/legacy-background-light.jpg
      - assets/onemind-logo-dark.png
      - assets/onemind-logo-light.jpg
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
