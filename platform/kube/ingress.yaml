# Headlamp — headlamp.tail717ba0.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: kube
  annotations:
    tailscale.com/hostname: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp
      port:
        number: 4466
  tls:
    - hosts:
        - headlamp
---
# Kubernetes Dashboard — k8s-dashboard.tail717ba0.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard
  namespace: kube
  annotations:
    tailscale.com/hostname: k8s-dashboard
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kubernetes-dashboard
      port:
        number: 9090
  tls:
    - hosts:
        - k8s-dashboard
