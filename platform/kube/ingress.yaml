# Headlamp — headlamp.tail717ba0.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: kube
  annotations:
    tailscale.com/hostname: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp
      port:
        number: 4466
  tls:
    - hosts:
        - headlamp
