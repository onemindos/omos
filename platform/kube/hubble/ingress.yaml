# Hubble UI -- tailnet only: https://hubble.tail717ba0.ts.net. The Ingress was hand-applied; this file adopts it into Git with exactly
# its live name, hostname and TLS host (nothing is recreated, so no new certificate). Prune=false: even if this file is removed from
# Git, Argo CD must never delete it (each recreate issues a new Let's Encrypt certificate; 5 per name per week).
# The Hubble UI itself is DOKS-managed Cilium and is not touched; only this Ingress and the gate-outpost replica next to it are ours.
# Rollback of the gate: point the backend back at Service hubble-ui, port 80, in place.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: hubble
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hubble-ui
      port:
        number: 80
  tls:
    - hosts:
        - hubble
