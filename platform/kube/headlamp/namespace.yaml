# Headlamp moved here from `kube` (2026-11-08). `kube` keeps only the ai-operator ServiceAccount and token.
# platform-kube ships this Namespace itself (recursive directory source), so it is labelled in the same sync.
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    onemind.io/layer: guard
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
