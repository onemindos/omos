# Headlamp -- headlamp.tail717ba0.ts.net, behind the Authentik gate outpost (gate-outpost.yaml): sign-in first, admins only.
# Rollback: point the backend back at Service headlamp, port 4466, and restore the Tailscale proxy rule in network.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gate-outpost
      port:
        number: 9000
  tls:
    - hosts:
        - headlamp
