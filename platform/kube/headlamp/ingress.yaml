# Headlamp -- kube.tail717ba0.ts.net (temporary, 2026-11-09), straight to Headlamp for now (the gate in gate-outpost.yaml is deployed but not in the path; see docs).
# Why kube: Let's Encrypt allows 5 certificates per name per week, and headlamp.tail717ba0.ts.net
# used all 5 when its address was recreated on 2026-11-08 (blocked until 2026-11-10 00:31 UTC).
# Switch back to headlamp after that date only if wanted; each switch costs one certificate.
# Rollback: point the backend back at Service headlamp, port 4466, and restore the Tailscale proxy rule in network.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: kube
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp
      port:
        number: 4466
  tls:
    - hosts:
        - kube
