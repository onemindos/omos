# Headlamp -- kube.tail717ba0.ts.net (temporary, 2026-11-09), behind the Authentik gate (gate-outpost.yaml, admins only).
# Why kube: Let's Encrypt allows 5 certificates per name per week, and headlamp.tail717ba0.ts.net
# used all 5 when its address was recreated on 2026-11-08 (blocked until 2026-11-10 00:31 UTC).
# Switch back to headlamp after that date only if wanted; each switch costs one certificate.
# Rollback: point the backend back at Service headlamp, port 4466 (in place; never delete or recreate this Ingress). network.yaml already admits the Tailscale proxies to Headlamp.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: kube
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gate-outpost
      port:
        number: 9000
  tls:
    - hosts:
        - kube
