# Headlamp -- headlamp.tail717ba0.ts.net, straight to Headlamp for now (the gate in gate-outpost.yaml is deployed but not in the path; see docs).
# Rollback: point the backend back at Service headlamp, port 4466, and restore the Tailscale proxy rule in network.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp
      port:
        number: 4466
  tls:
    - hosts:
        - headlamp
