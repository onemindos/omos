# Ingress to the headlamp namespace: deny by default, then only the paths Headlamp needs. Cilium enforces these.
# Egress is unchanged: Headlamp's backend sends every user request on to the Kubernetes API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Headlamp only from the shared Authentik gate outpost (gate-outpost in auth, platform/auth/gate-outpost.yaml). Its tailnet
# Ingress now lives in auth and points at the outpost, so the tailnet ACL in platform/core/policy.hujson still decides who
# reaches the gate and Authentik decides who gets through. The Tailscale proxies and other pods are refused.
# Rollback: restore ingress.yaml, delete gate-headlamp in auth, and re-add the Tailscale proxy rule that was here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-from-gate
  namespace: headlamp
spec:
  podSelector:
    matchLabels:
      app: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gate-outpost
      ports:
        - protocol: TCP
          port: 4466
---
# The portal's status check: an unauthenticated GET of http://headlamp.headlamp.svc:4466/ from the Backstage backend
# (services/onemind-portal/plugins/plugin-onemind-common-backend/src/health.ts). Without it the check shows unknown.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-from-portal
  namespace: headlamp
spec:
  podSelector:
    matchLabels:
      app: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
          podSelector:
            matchLabels:
              app: backstage
      ports:
        - protocol: TCP
          port: 4466
