# Ingress to the headlamp namespace: deny by default, then only the paths Headlamp needs. Cilium enforces these.
# Egress is unchanged: Headlamp's backend sends every user request on to the Kubernetes API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Headlamp from its own Tailscale ingress proxy (StatefulSet ts-headlamp-* in tailscale), so the tailnet ACL in
# platform/core/policy.hujson decides who reaches it. Other Tailscale proxies and in-cluster pods are refused.
# If this Ingress moves to a ProxyGroup (tailscale.com/proxy-group), its proxy pods are relabelled
# parent-resource-type=proxygroup: update this selector in the same change or tailnet access is cut.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-from-tailscale
  namespace: headlamp
spec:
  podSelector:
    matchLabels:
      app: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: headlamp
              tailscale.com/parent-resource-ns: headlamp
              tailscale.com/parent-resource-type: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: ingress
              tailscale.com/parent-resource-type: proxygroup
      ports:
        - protocol: TCP
          port: 4466
---
# The portal's status check: an unauthenticated GET of http://headlamp.headlamp.svc:4466/ from the Backstage backend
# (services/onemind-portal/plugins/plugin-onemind-common-backend/src/health.ts). Without it the check shows unknown.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-from-portal
  namespace: headlamp
spec:
  podSelector:
    matchLabels:
      app: headlamp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
          podSelector:
            matchLabels:
              app: backstage
      ports:
        - protocol: TCP
          port: 4466
