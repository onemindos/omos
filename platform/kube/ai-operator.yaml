# Read-only identity for AI operators (Claude Code, Codex) running on the admin Mac.
# See docs/operations/ai-operator-access.md and PLATFORM-ROADMAP.md (phase 1).
#
# - Built-in `view` covers namespaced workloads, pods/log, events and the CRDs
#   that aggregate to it (Argo Rollouts, cert-manager, Kyverno). It excludes Secrets.
# - `ai-operator-read` adds get/list/watch on the platform CRDs that do not aggregate
#   to `view`. These API groups hold no Secret kinds. No write, exec or port-forward.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-operator
  namespace: kube
  labels:
    app.kubernetes.io/name: ai-operator
---
# Long-lived token, filled in by the cluster. The manifest itself holds no credential.
apiVersion: v1
kind: Secret
metadata:
  name: ai-operator-token
  namespace: kube
  annotations:
    kubernetes.io/service-account.name: ai-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-operator-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments, csidrivers]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups:
      - argoproj.io
      - openchoreo.dev
      - postgresql.cnpg.io
      - barmancloud.cnpg.io
      - jetstream.nats.io
      - gateway.networking.k8s.io
      - monitoring.coreos.com
      - keda.sh
      - eventing.keda.sh
      - velero.io
      - volsync.backube
      - snapshot.storage.k8s.io
      - tailscale.com
      - cilium.io
      - dapr.io
      - clickhouse.altinity.com
      - clickhouse-keeper.altinity.com
      - wgpolicyk8s.io
      - reports.kyverno.io
      - policies.kyverno.io
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-operator-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: ai-operator
    namespace: kube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-operator-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-operator-read
subjects:
  - kind: ServiceAccount
    name: ai-operator
    namespace: kube
