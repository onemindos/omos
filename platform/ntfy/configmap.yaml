apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: '0'
data:
  server.yml: |
    base-url: https://ntfy.tail717ba0.ts.net
    listen-http: ':8080'
    behind-proxy: true
    web-root: app

    cache-file: /var/lib/ntfy/cache.db
    cache-duration: 24h

    attachment-cache-dir: /var/lib/ntfy/attachments
    attachment-total-size-limit: 1G
    attachment-file-size-limit: 15M
    attachment-expiry-duration: 24h

    # Private by default. Users, tokens and their topic permissions are all
    # provisioned from the ntfy-auth Secret (NTFY_AUTH_USERS, NTFY_AUTH_TOKENS,
    # NTFY_AUTH_ACCESS). ntfy refuses to start if an ACL names a user that does
    # not exist, so the ACL lives with the users, not here.
    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all
    enable-login: true
