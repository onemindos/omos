apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: '0'
data:
  server.yml: |
    base-url: https://ntfy.tail717ba0.ts.net
    listen-http: ':8080'
    behind-proxy: true
    web-root: app

    cache-file: /var/lib/ntfy/cache.db
    cache-duration: 12h

    attachment-cache-dir: /var/lib/ntfy/attachments
    attachment-total-size-limit: 1G
    attachment-file-size-limit: 15M
    attachment-expiry-duration: 24h

    # Private by default. Users and publisher tokens are provisioned from the
    # ntfy-auth Secret through NTFY_AUTH_USERS / NTFY_AUTH_TOKENS (ntfy 2.14+).
    # The ACL below holds no secrets: publishers get write-only access.
    # The admin role reads and writes every topic.
    auth-file: /var/lib/ntfy/user.db
    auth-default-access: deny-all
    enable-login: true
    auth-access:
    - home-assistant:home-alerts:wo
    - home-assistant:cameras:wo
    - alertmanager:cluster:wo
    - hermes:hermes:wo
