apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      # Never restart — if the runner crashes, K8s replaces the pod and it re-registers.
      restartPolicy: Always
      containers:
        - name: runner
          image: myoung34/github-runner:latest
          imagePullPolicy: Always
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: ACCESS_TOKEN
            - name: RUNNER_SCOPE
              value: "org"
            - name: ORG_NAME
              value: "onemindos"
            - name: LABELS
              value: "self-hosted,linux,amd64"
            - name: RUNNER_WORKDIR
              value: "/tmp/runner/work"
            - name: EPHEMERAL
              value: "false"
            - name: DISABLE_AUTO_UPDATE
              value: "false"
            # Talk to the DinD sidecar
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: work
              mountPath: /tmp/runner/work

        # Docker-in-Docker sidecar — provides the Docker daemon for builds
        - name: dind
          image: docker:dind
          args: ["--tls=false"]
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: work
              mountPath: /tmp/runner/work
            - name: docker-storage
              mountPath: /var/lib/docker

      volumes:
        - name: work
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
---
# Secret scaffold — seal and commit.
# kubectl create secret generic github-runner-secret -n github-runner \
#   --from-literal=ACCESS_TOKEN=<ghp_token_with_manage_runners_scope> \
