apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: matrix

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: synapse-config
        namespace: matrix
      data:
        homeserver.yaml: |
          server_name: "matrix.onemindos.com"
          pid_file: /data/homeserver.pid
          
          listeners:
            - port: 8008
              tls: false
              type: http
              x_forwarded: true
              bind_addresses: ['::']
              resources:
                - names: [client, federation]
                  compress: true
          
          database:
            name: psycopg2
            txn_limit: 10000
            args:
              user: synapse
              password: ${POSTGRES_PASSWORD}
              database: synapse
              host: postgres.matrix.svc.cluster.local
              port: 5432
              cp_min: 10
              cp_max: 50
          
          redis:
            enabled: true
            host: redis.matrix.svc.cluster.local
            port: 6379
            password: ${REDIS_PASSWORD}
          
          media_store_path: /data/media
          max_upload_size: 200M
          
          enable_registration: false
          enable_registration_without_verification: false
          
          report_stats: false
          
          signing_key_path: "/data/signing.key"
          
          trusted_key_servers:
            - server_name: "matrix.org"
          
          client_well_known:
            "m.homeserver":
              base_url: "https://matrix.onemindos.com"
            "m.identity_server":
              base_url: "https://vector.im"
          
          log_config: "/data/log.config"
          
          use_presence: true
          presence:
            enabled: true
          
          # Worker configuration for scaling
          worker_replication: false
          worker_app: synapse.app.homeserver
    target:
      kind: ConfigMap
      name: synapse-config

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: synapse
        namespace: matrix
      spec:
        template:
          spec:
            containers:
              - name: synapse
                resources:
                  requests:
                    memory: "2Gi"
                    cpu: "1000m"
                  limits:
                    memory: "8Gi"
                    cpu: "4000m"
    target:
      kind: Deployment
      name: synapse

  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: element-web-config
        namespace: matrix
      data:
        config.json: |
          {
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://matrix.onemindos.com",
                "server_name": "onemindos.com"
              },
              "m.identity_server": {
                "base_url": "https://vector.im"
              }
            },
            "disable_custom_urls": false,
            "disable_guests": true,
            "disable_3pid_login": true,
            "brand": "OneMind OS",
            "branding": {
              "welcome_background_url": "https://onemindos.com/welcome.jpg",
              "auth_header_logo_url": "https://onemindos.com/logo.png",
              "auth_footer_links": [
                "https://onemindos.com",
                "https://community.onemindos.com"
              ]
            },
            "integrations_ui_url": "https://scalar.vector.im/",
            "integrations_rest_url": "https://scalar.vector.im/api",
            "integrations_widgets_urls": [
              "https://scalar.vector.im/_matrix/integrations/v1",
              "https://scalar.vector.im/_matrix/integrations/v1",
              "https://scalar.vector.im/appswidgets",
              "https://scalar.vector.im/appswidgets"
            ],
            "bug_report_endpoint_url": "https://github.com/onemindos/matrix/issues",
            "default_country_code": "US",
            "show_labs_settings": true,
            "features": {
              "feature_new_spaces": "labs",
              "feature_threaded_conversations": "labs",
              "feature_relation_aggregation": "labs"
            },
            "default_theme": "dark",
            "themes": ["light", "dark"]
          }
    target:
      kind: ConfigMap
      name: element-web-config

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: element-web
        namespace: matrix
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: element-web

  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: matrix-secrets
        namespace: matrix
      stringData:
        postgres-password: "FROM_1PASSWORD_MATRIX_POSTGRES"
        redis-password: "FROM_1PASSWORD_MATRIX_REDIS"
        synapse-registration-secret: "FROM_1PASSWORD_SYNAPSE_REGISTRATION"
        synapse-signing-key: "FROM_1PASSWORD_SYNAPSE_SIGNING_KEY"
        mautrix-telegram-login-secret: "FROM_1PASSWORD_MAUTRIX_TELEGRAM_LOGIN"
        telegram-api-id: "FROM_1PASSWORD_TELEGRAM_API_ID"
        telegram-api-hash: "FROM_1PASSWORD_TELEGRAM_API_HASH"
        telegram-bot-token: "FROM_1PASSWORD_TELEGRAM_BOT_TOKEN"
        matrix-bot-access-token: "FROM_1PASSWORD_MATRIX_BOT_TOKEN"
        matrix-bot-device-id: "FROM_1PASSWORD_MATRIX_BOT_DEVICE_ID"
    target:
      kind: Secret
      name: matrix-secrets

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mautrix-telegram
        namespace: matrix
      spec:
        template:
          spec:
            containers:
              - name: mautrix-telegram
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "250m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
    target:
      kind: Deployment
      name: mautrix-telegram

commonLabels:
  onemind.os/component: matrix
  onemind.os/managed-by: kustomize
  onemind.os/environment: production