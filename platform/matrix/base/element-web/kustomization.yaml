apiVersion: v1
kind: ConfigMap
metadata:
  name: element-web-config
  namespace: matrix
  labels:
    onemind.os/component: matrix-element-web
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.onemindos.com",
          "server_name": "onemindos.com"
        },
        "m.identity_server": {
          "base_url": "https://vector.im"
        }
      },
      "disable_custom_urls": false,
      "disable_guests": true,
      "disable_3pid_login": true,
      "brand": "OneMind OS",
      "branding": {
        "welcome_background_url": "/welcome.jpg",
        "auth_header_logo_url": "/logo.png",
        "auth_footer_links": [
          "https://onemindos.com"
        ]
      },
      "integrations_ui_url": "https://scalar.vector.im/",
      "integrations_rest_url": "https://scalar.vector.im/api",
      "integrations_widgets_urls": [
        "https://scalar.vector.im/_matrix/integrations/v1",
        "https://scalar.vector.im/_matrix/integrations/v1",
        "https://scalar.vector.im/appswidgets",
        "https://scalar.vector.im/appswidgets"
      ],
      "bug_report_endpoint_url": "https://github.com/onemindos/matrix/issues",
      "default_country_code": "US",
      "show_labs_settings": true,
      "features": {
        "feature_new_spaces": "labs",
        "feature_threaded_conversations": "labs",
        "feature_relation_aggregation": "labs"
      },
      "default_theme": "dark",
      "themes": [
        "light",
        "dark"
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: matrix
  labels:
    app: element-web
    onemind.os/component: matrix-element-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: element-web
  template:
    metadata:
      labels:
        app: element-web
        onemind.os/component: matrix-element-web
    spec:
      containers:
        - name: element-web
          image: docker.io/vectorim/element-web:v1.11.70
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: element-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  namespace: matrix
  labels:
    app: element-web
    onemind.os/component: matrix-element-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: element-web