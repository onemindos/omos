apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
  namespace: matrix
  labels:
    onemind.os/component: matrix-synapse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: do-block-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix
  labels:
    onemind.os/component: matrix-synapse
data:
  homeserver.yaml: |
    server_name: "matrix.onemindos.com"
    pid_file: /data/homeserver.pid
    
    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        bind_addresses: ['::']
        resources:
          - names: [client, federation]
            compress: true
    
    database:
      name: psycopg2
      txn_limit: 10000
      args:
        user: synapse
        password: ${POSTGRES_PASSWORD}
        database: synapse
        host: postgres.matrix.svc.cluster.local
        port: 5432
        cp_min: 5
        cp_max: 20
    
    redis:
      enabled: true
      host: redis.matrix.svc.cluster.local
      port: 6379
      password: ${REDIS_PASSWORD}
    
    # Media storage
    media_store_path: /data/media
    max_upload_size: 100M
    
    # Federation
    federation_domain_whitelist: []
    federation_metrics_domains: []
    
    # Registration
    enable_registration: false
    enable_registration_without_verification: false
    
    # Email (configure later)
    email:
      enabled: false
    
    # Telemetry
    report_stats: false
    
    # Signing key (generated on first run)
    signing_key_path: "/data/signing.key"
    
    # Trusted key servers
    trusted_key_servers:
      - server_name: "matrix.org"
    
    # Client well-known
    client_well_known:
      "m.homeserver":
        base_url: "https://matrix.onemindos.com"
      "m.identity_server":
        base_url: "https://vector.im"
    
    # Logging
    log_config: "/data/log.config"
    
    # Workers (for scaling later)
    use_presence: true
    presence:
      enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
  labels:
    app: synapse
    onemind.os/component: matrix-synapse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
        onemind.os/component: matrix-synapse
    spec:
      securityContext:
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
      containers:
        - name: synapse
          image: docker.io/matrixdotorg/synapse:v1.106.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
              name: http
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /data/homeserver.yaml
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-secrets
                  key: postgres-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-secrets
                  key: redis-password
            - name: SYNAPSE_REPORT_STATS
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synapse-data
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
  labels:
    app: synapse
    onemind.os/component: matrix-synapse
spec:
  type: ClusterIP
  ports:
    - port: 8008
      targetPort: 8008
      name: http
  selector:
    app: synapse