# Matrix is tailnet-only (2026-10-29). Replaces the public nginx Ingresses matrix-ingress and matrix-wellknown
# (matrix.onemindos.dev, element.onemindos.dev, onemindos.dev/.well-known/matrix). Federation is off, no remote
# server was ever in the DB, and there is no well-known delegation: clients are pointed at the tailnet URL directly.
# Tailscale operator Ingresses (same pattern as vaultwarden/n8n): matrix.tail717ba0.ts.net and element.tail717ba0.ts.net.
# server_name stays "onemindos.dev" (user IDs @user:onemindos.dev); only the URL clients reach it at changes.
# In-cluster clients (Hermes) keep using the ClusterIP Service synapse.matrix.svc.cluster.local:8008.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapse-tailnet
  namespace: matrix
  annotations:
    tailscale.com/hostname: matrix
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: synapse
      port:
        number: 8008
  tls:
    - hosts:
        - matrix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: element-tailnet
  namespace: matrix
  annotations:
    tailscale.com/hostname: element
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: element-web
      port:
        number: 80
  tls:
    - hosts:
        - element
