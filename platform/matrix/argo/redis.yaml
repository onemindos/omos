# Matrix Redis, mirrored from the live matrix/redis objects (2026-10-10). Live wins over the old base.
# REDIS_PASSWORD comes from Secret/matrix-secrets (managed out of band, not in Git).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: matrix
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      protocol: TCP
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: matrix
spec:
  replicas: 1
  serviceName: redis
  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: redis
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      initContainers:
        - name: init-data-dir
          image: busybox
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - mkdir -p /data/redis-data && chown -R 999:999 /data/redis-data
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --dir
            - /data/redis-data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matrix-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: do-block-storage
        volumeMode: Filesystem
