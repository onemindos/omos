# Read-only pod access in the hermes namespace for the dedicated runner github-runner-hermes
# (platform/core/github-runner-hermes.yaml, label onemind-hermes-readonly).
#
# Kept after the old hermes-legacy instance was retired (2026-11): the runner Deployment uses this ServiceAccount, and
# the preflight job of .github/workflows/onemind-mcp.yml runs `kubectl exec` into the onemind-hermes pod with it.
# The hermes-identity-export workflow that originally needed it was removed (the nightly `config-export` cron of
# onemind-hermes replaces it). `pods/exec` cannot be limited to one command, so this role can read anything in the
# namespace's pods: keep it bound only to this ServiceAccount, and narrow or delete it with the runner.
# The names still say "identity-export" because renaming a ServiceAccount means re-creating the runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-identity-export
  namespace: github-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-identity-export
  namespace: hermes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-identity-export
  namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-identity-export
subjects:
  - kind: ServiceAccount
    name: hermes-identity-export
    namespace: github-runner
