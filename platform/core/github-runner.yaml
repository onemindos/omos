apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
  labels:
    app: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      automountServiceAccountToken: false
      containers:
        - name: runner
          # myoung34/github-runner 2.338.2 (runner 2.338.2, published 2026-10-26, multi-arch index digest).
          # Replaces the 2.338.0 image: GitHub forced a self-update to 2.338.2, which exits and deregisters
          # the runner, and the restarted container (still 2.338.0) looped. See BUILD-RUNNER.md.
          # Under the usual two-week age rule this tag is too new, but the previous image cannot receive jobs.
          image: docker.io/myoung34/github-runner:2.338.2@sha256:7cc183492366138ace1c9c74296fd2c6240916d98178696c38bc78e6d5810ee8
          imagePullPolicy: Always
          env:
            # Presence enables --disableupdate (entrypoint tests -n, not the value). The in-container
            # self-update is lost on restart and deregisters the runner mid-job; bump the image instead.
            - name: DISABLE_AUTO_UPDATE
              value: "true"
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: ACCESS_TOKEN
            - name: RUNNER_SCOPE
              value: org
            - name: ORG_NAME
              value: onemindos
            - name: LABELS
              value: self-hosted,linux,amd64,zeus-v2
            - name: RUNNER_WORKDIR
              value: /tmp/runner/work
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: work
              mountPath: /tmp/runner/work
        - name: dind
          image: docker.io/library/docker@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --host=tcp://127.0.0.1:2375
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: work
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
