apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
  labels:
    app: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: docker.io/myoung34/github-runner@sha256:dcacf6645a732142f5eb817df7f87bde7cc5df2238595b78f5e1e5f6731e25f3
          imagePullPolicy: Always
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: ACCESS_TOKEN
            - name: RUNNER_SCOPE
              value: org
            - name: ORG_NAME
              value: onemindos
            - name: LABELS
              value: self-hosted,linux,amd64,zeus-v2
            - name: RUNNER_WORKDIR
              value: /tmp/runner/work
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: work
              mountPath: /tmp/runner/work
        - name: dind
          image: docker.io/library/docker@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --host=tcp://127.0.0.1:2375
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: work
          emptyDir: {}
        - name: docker-storage
          emptyDir: {}
