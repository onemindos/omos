apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config-v2
  namespace: cloudflare
data:
  config.yaml: |
    tunnel: 66bbea70-5300-4e4e-96fa-e5bc4d767b61
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Routing is handled by ingress-nginx (143.244.220.155).
      # DNS records for onemindos.dev and subdomains point to the LB IP.
      # Tunnel is kept scaled to 0; activate only if LB path is unavailable.
      - service: http_status:404
