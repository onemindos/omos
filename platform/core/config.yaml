apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config-v2
  namespace: cloudflare
data:
  config.yaml: |
    tunnel: 66bbea70-5300-4e4e-96fa-e5bc4d767b61
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # ── OneTAK ────────────────────────────────────────────────────────────
      - hostname: onemindos.dev
        service: http://onetak-api.onetak.svc.cluster.local:5000
      - hostname: tiles.onemindos.dev
        service: http://onetak-tiles.onetak.svc.cluster.local:5002
      - hostname: media.onemindos.dev
        service: http://onetak-media.onetak.svc.cluster.local:9997
      # ── Core infra ────────────────────────────────────────────────────────
      - hostname: grafana.onemindos.dev
        service: http://monitoring-grafana.monitoring.svc.cluster.local:80
      - hostname: argocd.onemindos.dev
        service: https://argocd-server.argocd.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: hermes.onemindos.dev
        service: http://hermes-webui.hermes.svc.cluster.local:8787
      # ── NATS WebSocket (browser SPA) ─────────────────────────────────────
      - hostname: ws.onemindos.dev
        service: http://nats.nats.svc.cluster.local:8080
      # ── CesiumJS 3D Globe (God's Eye) ────────────────────────────────────
      - hostname: globe.onemindos.dev
        service: http://tak-webview-cesium.takserver.svc.cluster.local:80
      # ── Catch-all ────────────────────────────────────────────────────────
      - service: http_status:404
