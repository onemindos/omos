# Sealed Secrets controller — replaces ESO + 1Password Connect.
# Encrypts secrets client-side with the cluster public key (kubeseal).
# Encrypted SealedSecret YAMLs are safe to commit to git.
#
# To re-seal a secret after rotation:
#   kubeseal --fetch-cert --controller-name=sealed-secrets-controller \
#     --controller-namespace=kube-system > pub-cert.pem
#   kubectl create secret generic <name> -n <ns> --from-literal=key=value \
#     --dry-run=client -o json \
#     | kubeseal --cert pub-cert.pem --format yaml --scope namespace-wide \
#     > platform/<ns>/<name>.sealedsecret.yaml
#
# Source: https://github.com/bitnami/sealed-secrets/releases/tag/v0.38.4
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/version: v0.38.4
spec:
  selector:
    matchLabels:
      name: sealed-secrets-controller
  template:
    metadata:
      labels:
        name: sealed-secrets-controller
    spec:
      serviceAccountName: sealed-secrets-controller
      containers:
        - name: sealed-secrets-controller
          image: ghcr.io/bitnami/sealed-secrets-controller:v0.38.4
          command:
            - controller
          args:
            - --update-status
            - --key-prefix=sealed-secrets-key
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
