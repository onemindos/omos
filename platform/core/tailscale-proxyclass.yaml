# Defaults proxy resource sizing for resources labeled for this ProxyClass.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-default
spec:
  statefulSet:
    pod:
      tailscaleInitContainer:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      tailscaleContainer:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
