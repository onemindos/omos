apiVersion: "clickhouse.altinity.com/v1"
kind: ClickHouseInstallation
metadata:
  name: onemind
  namespace: clickhouse
spec:
  configuration:
    files:
      # Retention for system log tables that ship without a TTL (they grew to ~5.8 GiB on a 20 Gi volume; asynchronous_metric_log alone
      # reached 4.3 billion rows). query_log, part_log and trace_log keep the operator's 30-day TTL. Table settings are applied at server
      # start: ClickHouse renames a table whose definition changed to <name>_N and creates a new one with the TTL. The renamed *_N
      # tables are old data; dropping them is an owner decision.
      config.d/90-system-log-ttl.xml: |
        <clickhouse>
          <asynchronous_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></asynchronous_metric_log>
          <metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></metric_log>
          <text_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></text_log>
          <error_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></error_log>
          <query_metric_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_metric_log>
          <query_views_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></query_views_log>
          <background_schedule_pool_log><ttl>event_date + INTERVAL 7 DAY DELETE</ttl></background_schedule_pool_log>
          <backup_log><ttl>event_date + INTERVAL 30 DAY DELETE</ttl></backup_log>
        </clickhouse>
    clusters:
      - name: onemind
        templates:
          podTemplate: default
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      # SHA-256 of a random password (rotated 2026-11-07, the old one was in Git history). The password is sealed in
      # omos/omos-clickhouse-creds, clickhouse/clickhouse-backup-creds and monitoring/grafana-clickhouse-datasource. A hash for the
      # same no-restart reason as legacy_ro below.
      onemind/password_sha256_hex: "e6c79e5b8465e20eb5c130acc6086fe5378c9adc14f04bbfa41acefe5d298a29"
      onemind/networks/ip: "::/0"
      onemind/profile: default
      onemind/quota: default
      # Tool gateway (platform/tool-gateway, target `clickhouse`): read-only by profile; password hash only (the password is sealed in tool-gateway).
      # SHA-256 of the password sealed in tool-gateway/mcp-clickhouse-credentials. A hash (not valueFrom.secretKeyRef) on purpose:
      # a secret ref adds a container env var, which makes the operator roll the StatefulSet and restart ClickHouse.
      legacy_ro/password_sha256_hex: "76f2582c4ba571557c1a8de564157c065c208f7ff4ab0ba9b3614b6a2ce163c7"
      legacy_ro/networks/ip: "10.0.0.0/8"
      legacy_ro/profile: legacy_ro
      legacy_ro/quota: default
      # Langfuse (platform/ecosystem/values/langfuse.yaml): owns only the `langfuse` database. SHA-256 of the password sealed in
      # onemind-ai/langfuse-auth (key clickhouse-password); a hash for the same no-restart reason as legacy_ro above.
      # The grant includes CREATE DATABASE, which the Langfuse PreSync Job uses to create the (empty) database.
      langfuse/password_sha256_hex: "b5d35516710ad1985687d7c6444b235ad3c334c4c69d10cec1e8d2fad621b490"
      langfuse/networks/ip: "10.0.0.0/8"
      langfuse/profile: langfuse
      langfuse/quota: default
      # Langfuse v4 reads system tables: system.parts (partition listing for the observations table) and system.query_log
      # (its v3-to-v4 API usage report, which filters on its own log_comment tags). Only the columns it selects are granted.
      langfuse/grants/query:
        - "GRANT ALL ON langfuse.*"
        - "GRANT SELECT(partition, partition_id, table, database, active) ON system.parts"
        - "GRANT SELECT(type, event_date, event_time, event_time_microseconds, log_comment) ON system.query_log"
    profiles:
      # Caps one Langfuse query below the 3 GiB pod limit so it cannot OOM the shared server.
      langfuse/max_memory_usage: 2000000000
      langfuse/max_execution_time: 300
      legacy_ro/readonly: 1
      legacy_ro/max_execution_time: 30
      legacy_ro/max_memory_usage: 1000000000
      legacy_ro/max_result_rows: 100000
      legacy_ro/result_overflow_mode: break
    settings:
      max_connections: 100
      keep_alive_timeout: 3
  templates:
    volumeClaimTemplates:
      - name: data-storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: do-block-storage-retain
    podTemplates:
      - name: default
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: doks.digitalocean.com/node-pool
                        operator: In
                        values:
                          - onemind-ecosystem-cpu
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
              volumeMounts:
                - name: data-storage
                  mountPath: /var/lib/clickhouse
              resources:
                # Request sized to real use: 7-day peak 2.6 GiB against a 512Mi request, which made it an eviction target.
                requests:
                  memory: "2Gi"
                  cpu: "250m"
                limits:
                  memory: "3Gi"
                  cpu: "1000m"
