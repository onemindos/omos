# =============================================================================
# Redpanda Connect (Wombat) — declarative data feed engine → NATS → TAK
#
# Runs in streams mode: each pipeline file named in a Deployment's args runs as an
# independent stream. The ConfigMap holds every pipeline; pipelines/ holds reference copies
# (kept identical by scripts/tests/test_gitops_feed_grammar.py; Argo excludes them).
#
# Pipelines, and which pod runs them:
#   feed-mta.yaml                LEGACY  MTA trains → CoT on tak.cot.inject. Runs in this pod.
#   feed-mta-grammar.yaml        A1      MTA trains → evt.world.rail.{id}. redpanda-connect-grammar.
#   feed-satellites-grammar.yaml A1      CelesTrak TLE → intel.space.celestrak.tle. redpanda-connect-grammar.
#   feed-ships.yaml              OFF     AIS → CoT. Both stay off: they return only through
#   feed-aircraft.yaml           OFF     OpenSky → CoT. omos-ingest with an AOI box and quota (A1, A0).
# feed-hazards.yaml was removed (A1): it duplicated the USGS and NWS collectors in feed-intel.
#
# FEED SWITCH (decision 0004 #18: the old pipeline stays until the new one is proven):
#   the grammar pipelines run in deployment-grammar.yaml, whose replicas (0 as merged) turn them
#   on; the legacy CoT outputs go off by setting this Deployment's replicas and feed-satellites'
#   replicas (platform/omos/feeds.yaml) to 0. Order, checks and rollback: CUTOVER.md.
#   scripts/tests/test_gitops_feed_grammar.py fails if a legacy output goes off first.
#
# Secrets required in omos namespace:
#   omos-nats-creds   — NATS_USER, NATS_PASSWORD
#   omos-feed-secrets — AISSTREAM_API_KEY (ships), OPENSKY_USERNAME/PASSWORD (aircraft, optional)
#
# Proto schemas live in platform/redpanda-connect/gtfs-realtime.proto.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-connect-pipelines
  namespace: omos
data:
  feed-mta.yaml: |
    input:
      generate:
        interval: "30s"
        mapping: 'root = ""'

    pipeline:
      processors:
        - branch:
            request_map: 'root = ""'
            processors:
              - http:
                  url: "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/mnr%2Fgtfs-mnr"
                  verb: GET
                  timeout: "10s"
                  headers:
                    User-Agent: "OMOS-FeedEngine/1.0"
              - protobuf:
                  operator: to_json
                  message: "transit_realtime.FeedMessage"
                  import_paths: ["/proto/"]
              - mapping: |
                  root = this.entity.filter(e -> e.exists("vehicle") && e.vehicle.exists("position")).map_each(e -> {
                    "uid": "MTA-MNR-%s".format(e.vehicle.trip.trip_id.or(e.id)),
                    "callsign": "MNR-%s".format(e.vehicle.trip.route_id.or(e.vehicle.trip.trip_id.or("?"))),
                    "lat": e.vehicle.position.latitude,
                    "lon": e.vehicle.position.longitude,
                    "speed": e.vehicle.position.speed.or(0),
                    "course": e.vehicle.position.bearing.or(0),
                    "remarks": "MTA Metro-North route:%s trip:%s".format(e.vehicle.trip.route_id.or("?"), e.vehicle.trip.trip_id.or("?")),
                    "feed": "MNR"
                  })
            result_map: 'root.mnr = this'

        - branch:
            request_map: 'root = ""'
            processors:
              - http:
                  url: "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/lirr%2Fgtfs-lirr"
                  verb: GET
                  timeout: "10s"
                  headers:
                    User-Agent: "OMOS-FeedEngine/1.0"
              - protobuf:
                  operator: to_json
                  message: "transit_realtime.FeedMessage"
                  import_paths: ["/proto/"]
              - mapping: |
                  root = this.entity.filter(e -> e.exists("vehicle") && e.vehicle.exists("position")).map_each(e -> {
                    "uid": "MTA-LIRR-%s".format(e.vehicle.trip.trip_id.or(e.id)),
                    "callsign": "LIRR-%s".format(e.vehicle.trip.route_id.or(e.vehicle.trip.trip_id.or("?"))),
                    "lat": e.vehicle.position.latitude,
                    "lon": e.vehicle.position.longitude,
                    "speed": e.vehicle.position.speed.or(0),
                    "course": e.vehicle.position.bearing.or(0),
                    "remarks": "MTA LIRR route:%s trip:%s".format(e.vehicle.trip.route_id.or("?"), e.vehicle.trip.trip_id.or("?")),
                    "feed": "LIRR"
                  })
            result_map: 'root.lirr = this'

        - mapping: |
            root = this.mnr.or([]).concat(this.lirr.or([]))

        - unarchive:
            format: json_array

        - mapping: |
            root = if this.lat == 0 || this.lon == 0 { deleted() } else { this }

        - mapping: |
            let ts = now().format_timestamp("2006-01-02T15:04:05.000Z")
            let stale = (now().ts_unix() + 120).ts_format("2006-01-02T15:04:05.000Z")
            let cs = this.callsign.replace_all("&", "&amp;").replace_all("<", "&lt;").replace_all("\"", "&quot;")
            root = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n<event version=\"2.0\" type=\"a-n-G-E-V-C-R\" uid=\"" + this.uid + "\" how=\"m-g\" time=\"" + $ts + "\" start=\"" + $ts + "\" stale=\"" + $stale + "\"><point lat=\"" + this.lat.string() + "\" lon=\"" + this.lon.string() + "\" hae=\"0\" ce=\"50\" le=\"50\"/><detail><contact callsign=\"" + $cs + "\"/><track speed=\"" + this.speed.string() + "\" course=\"" + this.course.string() + "\"/><remarks>" + this.remarks + "</remarks><marti><dest mission=\"Land\"/></marti></detail></event>"

    output:
      nats:
        urls: ["nats://nats.nats.svc.cluster.local:4222"]
        subject: "tak.cot.inject"
        auth:
          user: "${NATS_USER}"
          password: "${NATS_PASSWORD}"
        tls:
          enabled: true
          skip_cert_verify: true
  feed-mta-grammar.yaml: |
    # feed-mta-grammar — MTA Metro-North + LIRR GTFS-RT vehicle positions as raw observations.
    #
    # Replaces feed-mta.yaml (CoT XML on tak.cot.inject). Publishes, per train, the doctrine §9.2
    # geo envelope on evt.world.rail.{id} (stream WORLD, acked JetStream publish, Nats-Msg-Id
    # dedup). The entity service turns these into ent.*.*.state and the projector turns entities
    # into CoT; this pipeline never publishes CoT. Subject class `rail` is owner proposal BUS-P6
    # (docs/proposals/2026-10-29-feed-grammar-cutover.md, A1-P1).
    #
    # Also publishes:
    #   tel.feed.mta.status     one freshness record per poll (core NATS; TEL adds tel.feed.> later)
    #   evt.sys.mta.rejected    a vehicle with a position outside WGS-84 or at 0,0 (BUS-P9)
    #
    # Runs only in the redpanda-connect-grammar Deployment (deployment-grammar.yaml), whose
    # replicas are the on/off switch. Cut-over order: platform/data/redpanda-connect/CUTOVER.md.
    # Every ${VAR:default} below has the cluster value as its default; the overrides exist so
    # test/replay.sh can run this exact file against a local nats-server and recorded fixtures.
    input:
      generate:
        interval: "${MTA_POLL_INTERVAL:30s}"
        mapping: 'root = ""'

    pipeline:
      processors:
        - mapping: 'root = {"errors": []}'

        - branch:
            request_map: 'root = ""'
            processors:
              - http:
                  url: "${MTA_BASE_URL:https://api-endpoint.mta.info}/Dataservice/mtagtfsfeeds/mnr%2Fgtfs-mnr"
                  verb: GET
                  timeout: "10s"
                  headers:
                    User-Agent: "OMOS-FeedEngine/1.0"
              - protobuf:
                  operator: to_json
                  message: "transit_realtime.FeedMessage"
                  import_paths: ["${MTA_PROTO_DIR:/proto/}"]
              - mapping: |
                  root = this.entity.or([]).filter(e -> e.exists("vehicle.position")).map_each(e -> e.merge({"_feed": "mnr"}))
            result_map: 'root.mnr = this'
        - catch:
            - mapping: 'root.errors = this.errors.or([]).append("mnr: " + error())'

        - branch:
            request_map: 'root = ""'
            processors:
              - http:
                  url: "${MTA_BASE_URL:https://api-endpoint.mta.info}/Dataservice/mtagtfsfeeds/lirr%2Fgtfs-lirr"
                  verb: GET
                  timeout: "10s"
                  headers:
                    User-Agent: "OMOS-FeedEngine/1.0"
              - protobuf:
                  operator: to_json
                  message: "transit_realtime.FeedMessage"
                  import_paths: ["${MTA_PROTO_DIR:/proto/}"]
              - mapping: |
                  root = this.entity.or([]).filter(e -> e.exists("vehicle.position")).map_each(e -> e.merge({"_feed": "lirr"}))
            result_map: 'root.lirr = this'
        - catch:
            - mapping: 'root.errors = this.errors.or([]).append("lirr: " + error())'

        # One element per train (kind obs or rejected) plus one status element.
        # protobuf to_json field names differ by engine version (camelCase in 4.115, snake_case in
        # older builds), so every GTFS field is read under both spellings.
        - mapping: |
            map rail {
              let v = this.vehicle
              let tu = this.tripUpdate.or(this.trip_update).or({})
              let trip = $v.trip.tripId.or($v.trip.trip_id).or($tu.trip.tripId).or($tu.trip.trip_id).or(this.id).string()
              let route = $v.trip.routeId.or($v.trip.route_id).or($tu.trip.routeId).or($tu.trip.route_id).or("").string()
              let feed = this._feed
              let token = $trip.lowercase().re_replace_all("[^a-z0-9_-]", "_")
              let uid = "mta-" + $feed + "-" + $token
              let lat = $v.position.latitude.or(0).number()
              let lon = $v.position.longitude.or(0).number()
              let ts = $v.timestamp.or(0).number()
              let t = if $ts > 0 { ($ts * 1000).round().int64() } else { now().ts_unix() * 1000 }
              let label = if $feed == "mnr" { "MNR" } else { "LIRR" }
              let ok = $lat != 0 && $lon != 0 && $lat >= -90 && $lat <= 90 && $lon >= -180 && $lon <= 180
              root = if $ok {
                {
                  "kind": "obs",
                  "id": $uid,
                  "msg_id": "mta:%s:%s:%d".format($feed, $token, $t),
                  "body": {
                    "uid": $uid,
                    "type": "ground.rail",
                    "lat": $lat,
                    "lon": $lon,
                    "hae": 0,
                    "course": $v.position.bearing.or(-1).number(),
                    "speed": $v.position.speed.or(-1).number(),
                    "callsign": "%s-%s".format($label, if $route != "" { $route } else { $trip }),
                    "stale": 120,
                    "t": $t,
                    "meta": {
                      "agency": "MTA",
                      "feed": $label,
                      "trip_id": $trip,
                      "route_id": $route,
                      "vehicle_id": $v.vehicle.id.or("").string(),
                      "vehicle_label": $v.vehicle.label.or("").string(),
                      "stop_id": $v.stopId.or($v.stop_id).or("").string(),
                      "current_status": $v.currentStatus.or($v.current_status).or("").string(),
                      "start_date": $v.trip.startDate.or($v.trip.start_date).or($tu.trip.startDate).or($tu.trip.start_date).or("").string()
                    }
                  }
                }
              } else {
                {
                  "kind": "rejected",
                  "id": $uid,
                  "msg_id": "mta-rejected:%s:%s:%d".format($feed, $token, now().ts_unix_nano()),
                  "body": {
                    "source": "mta",
                    "reason": "position outside WGS-84 or at 0,0 (lat %v, lon %v)".format($lat, $lon),
                    "raw": this.without("_feed").string().slice(0, 4096),
                    "rawBytes": this.without("_feed").string().length()
                  }
                }
              }
            }
            let errs = this.errors.or([])
            let recs = this.mnr.or([]).concat(this.lirr.or([])).map_each(e -> e.apply("rail"))
            let now = now().ts_format("2006-01-02T15:04:05.000Z", "UTC")
            let failed = $errs.length() >= 2
            root = $recs.append({
              "kind": "status",
              "id": "mta",
              "msg_id": "",
              "body": {
                "source": "mta",
                "kind": "rest_poll",
                "collector": "redpanda-connect",
                "instance": hostname(),
                "leader": true,
                "fetchedAt": if $failed { null } else { $now },
                "count": $recs.length(),
                "published": $recs.filter(r -> r.kind == "obs").length(),
                "rejected": $recs.filter(r -> r.kind == "rejected").length(),
                "feeds": {"mnr": this.mnr.or([]).length(), "lirr": this.lirr.or([]).length()},
                "lastError": if $errs.length() > 0 { $errs.join("; ").slice(0, 300) } else { null },
                "errorAt": if $errs.length() > 0 { $now } else { null },
                "staleAfterSec": 120,
                "stale": $failed,
                "at": $now
              }
            })

        # A mapping failure must not vanish: publish it as a stale status instead.
        - catch:
            - mapping: |
                let now = now().ts_format("2006-01-02T15:04:05.000Z", "UTC")
                root = [{"kind": "status", "msg_id": "", "body": {
                  "source": "mta", "kind": "rest_poll", "collector": "redpanda-connect",
                  "instance": hostname(), "leader": true, "fetchedAt": null,
                  "count": 0, "published": 0, "rejected": 0,
                  "lastError": ("mapping: " + error()).slice(0, 300), "errorAt": $now,
                  "staleAfterSec": 120, "stale": true, "at": $now
                }}]

        - unarchive:
            format: json_array

        - mapping: |
            meta feed_kind = this.kind
            meta rail_id = this.id
            meta msg_id = this.msg_id
            root = this.body

    output:
      switch:
        cases:
          - check: '@feed_kind == "status"'
            output:
              nats:
                urls: ["${NATS_URL:nats://nats.nats.svc.cluster.local:4222}"]
                subject: "tel.feed.mta.status"
                auth:
                  user: "${NATS_USER}"
                  password: "${NATS_PASSWORD}"
                tls:
                  enabled: ${NATS_TLS_ENABLED:true}
                  skip_cert_verify: true
          - check: '@feed_kind == "rejected"'
            output:
              nats_jetstream:
                urls: ["${NATS_URL:nats://nats.nats.svc.cluster.local:4222}"]
                subject: "evt.sys.mta.rejected"
                headers:
                  Nats-Msg-Id: '${! @msg_id }'
                auth:
                  user: "${NATS_USER}"
                  password: "${NATS_PASSWORD}"
                tls:
                  enabled: ${NATS_TLS_ENABLED:true}
                  skip_cert_verify: true
          - check: '@feed_kind == "obs"'
            output:
              nats_jetstream:
                urls: ["${NATS_URL:nats://nats.nats.svc.cluster.local:4222}"]
                subject: 'evt.world.rail.${! @rail_id }'
                headers:
                  Nats-Msg-Id: '${! @msg_id }'
                auth:
                  user: "${NATS_USER}"
                  password: "${NATS_PASSWORD}"
                tls:
                  enabled: ${NATS_TLS_ENABLED:true}
                  skip_cert_verify: true
  feed-satellites-grammar.yaml: |
    # feed-satellites-grammar — CelesTrak two-line element sets as raw observations.
    #
    # Replaces the CoT output of the feed-satellites Deployment (platform/omos/feeds.yaml), which
    # propagates SGP4 in Python and core-publishes CoT XML to tak.cot.inject. This pipeline
    # publishes the source data itself: one record per satellite on intel.space.celestrak.tle
    # (stream INTEL, acked JetStream publish, Nats-Msg-Id tle:{norad}:{epoch}), as BUS-DESIGN §3.1
    # and the ingestion migration plan step 7 specify. Propagating positions is the entity
    # service's job (FEATURES A12), not the collector's. Until A12 exists the legacy
    # feed-satellites keeps running (CUTOVER.md); see owner proposal A1-P2.
    #
    # Also publishes:
    #   tel.feed.celestrak.status    one freshness record per fetch (core NATS)
    #   evt.sys.celestrak.rejected   a TLE with a bad checksum, length or mismatched NORAD id (BUS-P9)
    #
    # Politeness: CelesTrak asks clients not to download the same GP data more than once every
    # two hours; the default interval is 4 h, the same as the legacy script's TLE refresh.
    # Runs only in the redpanda-connect-grammar Deployment (deployment-grammar.yaml).
    input:
      generate:
        interval: "${CELESTRAK_POLL_INTERVAL:4h}"
        mapping: 'root = ""'

    pipeline:
      processors:
        - mapping: 'root = {"errors": []}'

        - branch:
            request_map: 'root = ""'
            processors:
              - http:
                  url: "${CELESTRAK_BASE_URL:https://celestrak.org}/NORAD/elements/gp.php?GROUP=${CELESTRAK_GROUP:stations}&FORMAT=tle"
                  verb: GET
                  timeout: "30s"
                  headers:
                    User-Agent: "omos-feed-sats/1.0"
            result_map: 'root.text = content().string()'
        - catch:
            - mapping: 'root.errors = this.errors.or([]).append(error())'

        - mapping: |
            map tle_ok {
              let digits = this.slice(0, 68).split("").map_each(c -> if c == "-" { 1 } else if c.re_match("^[0-9]$") { c.number() } else { 0 })
              root = this.length() == 69 && $digits.sum() % 10 == this.slice(68, 69).number().catch(-1)
            }
            map tle {
              let l0 = this.l0
              let l1 = this.l1
              let l2 = this.l2
              let norad = $l1.slice(2, 7).trim()
              let epoch = $l1.slice(18, 32).trim()
              let yy = $l1.slice(18, 20).number().catch(0)
              let year = if $yy < 57 { 2000 + $yy } else { 1900 + $yy }
              let jan1 = "%d-01-01T00:00:00Z".format($year.int64()).ts_parse("2006-01-02T15:04:05Z").ts_unix()
              let epoch_ms = (($jan1 + ($l1.slice(20, 32).number().catch(1) - 1) * 86400) * 1000).round().int64()
              let reason = if !$l1.apply("tle_ok") {
                "line 1 length or checksum invalid"
              } else if !$l2.apply("tle_ok") {
                "line 2 length or checksum invalid"
              } else if $l2.slice(2, 7).trim() != $norad {
                "NORAD id differs between line 1 and line 2"
              } else { "" }
              root = if $reason == "" {
                {
                  "kind": "obs",
                  "msg_id": "tle:%s:%s".format($norad, $epoch),
                  "body": {
                    "id": "celestrak-" + $norad,
                    "type": "tle",
                    "source": "celestrak",
                    "lat": null,
                    "lon": null,
                    "timestamp": ($epoch_ms / 1000).ts_format("2006-01-02T15:04:05.000Z", "UTC"),
                    "properties": {
                      "norad_id": $norad,
                      "name": if $l0 != "" { $l0 } else { "NORAD " + $norad },
                      "group": "${CELESTRAK_GROUP:stations}",
                      "classification": $l1.slice(7, 8),
                      "intl_designator": $l1.slice(9, 17).trim(),
                      "epoch": $epoch,
                      "epoch_ms": $epoch_ms,
                      "line1": $l1,
                      "line2": $l2
                    }
                  }
                }
              } else {
                {
                  "kind": "rejected",
                  "msg_id": "tle-rejected:%s:%d".format($norad, now().ts_unix_nano()),
                  "body": {
                    "source": "celestrak",
                    "reason": $reason,
                    "raw": [$l0, $l1, $l2].join("\n").slice(0, 4096),
                    "rawBytes": [$l0, $l1, $l2].join("\n").length()
                  }
                }
              }
            }
            let errs = this.errors.or([])
            let lines = this.text.or("").split("\n").map_each(l -> l.trim()).filter(l -> l != "")
            let n = $lines.length()
            let starts = if $n > 1 { range(0, $n - 1).filter(i -> $lines.index(i).has_prefix("1 ") && $lines.index(i + 1).has_prefix("2 ")) } else { [] }
            let recs = $starts.map_each(i -> {
              "l0": if i > 0 && !$lines.index(i - 1).has_prefix("1 ") && !$lines.index(i - 1).has_prefix("2 ") { $lines.index(i - 1) } else { "" },
              "l1": $lines.index(i),
              "l2": $lines.index(i + 1)
            }.apply("tle"))
            let now = now().ts_format("2006-01-02T15:04:05.000Z", "UTC")
            let failed = $errs.length() > 0
            root = $recs.append({
              "kind": "status",
              "msg_id": "",
              "body": {
                "source": "celestrak",
                "kind": "file",
                "collector": "redpanda-connect",
                "instance": hostname(),
                "leader": true,
                "fetchedAt": if $failed { null } else { $now },
                "count": $recs.length(),
                "published": $recs.filter(r -> r.kind == "obs").length(),
                "rejected": $recs.filter(r -> r.kind == "rejected").length(),
                "lastError": if $failed { $errs.join("; ").slice(0, 300) } else { null },
                "errorAt": if $failed { $now } else { null },
                "staleAfterSec": 43200,
                "stale": $failed,
                "at": $now
              }
            })

        # A mapping failure must not vanish: publish it as a stale status instead.
        - catch:
            - mapping: |
                let now = now().ts_format("2006-01-02T15:04:05.000Z", "UTC")
                root = [{"kind": "status", "msg_id": "", "body": {
                  "source": "celestrak", "kind": "file", "collector": "redpanda-connect",
                  "instance": hostname(), "leader": true, "fetchedAt": null,
                  "count": 0, "published": 0, "rejected": 0,
                  "lastError": ("mapping: " + error()).slice(0, 300), "errorAt": $now,
                  "staleAfterSec": 43200, "stale": true, "at": $now
                }}]

        - unarchive:
            format: json_array

        - mapping: |
            meta feed_kind = this.kind
            meta msg_id = this.msg_id
            root = this.body

    output:
      switch:
        cases:
          - check: '@feed_kind == "status"'
            output:
              nats:
                urls: ["${NATS_URL:nats://nats.nats.svc.cluster.local:4222}"]
                subject: "tel.feed.celestrak.status"
                auth:
                  user: "${NATS_USER}"
                  password: "${NATS_PASSWORD}"
                tls:
                  enabled: ${NATS_TLS_ENABLED:true}
                  skip_cert_verify: true
          - check: '@feed_kind == "rejected"'
            output:
              nats_jetstream:
                urls: ["${NATS_URL:nats://nats.nats.svc.cluster.local:4222}"]
                subject: "evt.sys.celestrak.rejected"
                headers:
                  Nats-Msg-Id: '${! @msg_id }'
                auth:
                  user: "${NATS_USER}"
                  password: "${NATS_PASSWORD}"
                tls:
                  enabled: ${NATS_TLS_ENABLED:true}
                  skip_cert_verify: true
          - check: '@feed_kind == "obs"'
            output:
              nats_jetstream:
                urls: ["${NATS_URL:nats://nats.nats.svc.cluster.local:4222}"]
                subject: "intel.space.celestrak.tle"
                headers:
                  Nats-Msg-Id: '${! @msg_id }'
                auth:
                  user: "${NATS_USER}"
                  password: "${NATS_PASSWORD}"
                tls:
                  enabled: ${NATS_TLS_ENABLED:true}
                  skip_cert_verify: true
  feed-ships.yaml: |
    input:
      websocket:
        url: "wss://stream.aisstream.io/v0/stream"
        open_message: '{"APIKey": "${AISSTREAM_API_KEY}", "BoundingBoxes": [[[-90, -180], [90, 180]]]}'
        open_message_type: text
        tls:
          enabled: true

    pipeline:
      processors:
        - mapping: |
            let md = this.MetaData.or({})
            let mmsi = $md.MMSI.or($md.UserID)
            let lat = $md.latitude.or($md.Latitude)
            let lon = $md.longitude.or($md.Longitude)
            root = if $mmsi == null || $lat == null || $lon == null { deleted() } else {
              let pr = this.Message.or({})
              let pos = $pr.PositionReport.or($pr.StandardClassBPositionReport.or({}))
              let sog = $pos.Sog.or(0)
              let cog = $pos.Cog.or(0)
              let sdata = $pr.ShipStaticData.or({})
              let ship_name = $sdata.Name.or($md.ShipName.or("")).string().trim()
              let cs = if $ship_name == "" { $mmsi.string() } else { $ship_name.slice(0, 32).replace_all("&", "&amp;").replace_all("<", "&lt;").replace_all("\"", "&quot;") }
              let stype = $sdata.Type.Code.or("").string()
              {
                "uid": "AIS-" + $mmsi.string(),
                "callsign": $cs,
                "lat": $lat,
                "lon": $lon,
                "sog": $sog,
                "cog": $cog,
                "mmsi": $mmsi,
                "stype": $stype
              }
            }

        - mapping: |
            let ts = now().format_timestamp("2006-01-02T15:04:05.000Z")
            let stale = (now().ts_unix() + 300).ts_format("2006-01-02T15:04:05.000Z")
            root = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n<event version=\"2.0\" type=\"a-f-S-X-M\" uid=\"" + this.uid + "\" how=\"m-g\" time=\"" + $ts + "\" start=\"" + $ts + "\" stale=\"" + $stale + "\"><point lat=\"" + this.lat.string() + "\" lon=\"" + this.lon.string() + "\" hae=\"-10000\" ce=\"9999999.0\" le=\"9999999.0\"/><detail><contact callsign=\"" + this.callsign + "\"/><track speed=\"" + this.sog.string() + "\" course=\"" + this.cog.string() + "\"/><status readiness=\"false\"/><remarks>MMSI:" + this.mmsi.string() + " " + this.stype + "</remarks><marti><dest mission=\"Sea\"/></marti></detail></event>"

    output:
      nats:
        urls: ["nats://nats.nats.svc.cluster.local:4222"]
        subject: "tak.cot.inject"
        auth:
          user: "${NATS_USER}"
          password: "${NATS_PASSWORD}"
        tls:
          enabled: true
          skip_cert_verify: true
  feed-aircraft.yaml: |
    input:
      generate:
        interval: "15s"
        mapping: 'root = ""'

    pipeline:
      processors:
        - branch:
            request_map: 'root = ""'
            processors:
              - http:
                  url: "https://opensky-network.org/api/states/all"
                  verb: GET
                  timeout: "20s"
                  headers:
                    User-Agent: "omos-feed-aircraft/1.0"
              - mapping: |
                  root = this.states.or([]).map_each(s ->
                    let lon = s.index(5)
                    let lat = s.index(6)
                    if $lon == null || $lat == null { deleted() } else {
                      let icao24 = s.index(0).or("").string()
                      let raw_cs = s.index(1).or("").string().trim()
                      let callsign = if $raw_cs == "" { $icao24.uppercase() } else { $raw_cs.replace_all("&", "&amp;").replace_all("<", "&lt;").replace_all("\"", "&quot;") }
                      let alt = s.index(7).or(0)
                      let spd_kt = s.index(9).or(0) * 1.94384
                      let trk = s.index(10).or(0)
                      let country = s.index(2).or("").string().replace_all("&", "&amp;").replace_all("<", "&lt;")
                      {
                        "uid": "ADSB-" + $icao24.uppercase(),
                        "callsign": $callsign,
                        "lat": $lat,
                        "lon": $lon,
                        "alt": $alt,
                        "spd_kt": $spd_kt,
                        "trk": $trk,
                        "icao24": $icao24,
                        "country": $country
                      }
                    }
                  )
            result_map: 'root = this'

        - unarchive:
            format: json_array

        - mapping: |
            let ts = now().format_timestamp("2006-01-02T15:04:05.000Z")
            let stale = (now().ts_unix() + 90).ts_format("2006-01-02T15:04:05.000Z")
            root = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n<event version=\"2.0\" type=\"a-f-A-M-F-Q\" uid=\"" + this.uid + "\" how=\"m-g\" time=\"" + $ts + "\" start=\"" + $ts + "\" stale=\"" + $stale + "\"><point lat=\"" + this.lat.string() + "\" lon=\"" + this.lon.string() + "\" hae=\"" + this.alt.string() + "\" ce=\"9999999.0\" le=\"9999999.0\"/><detail><contact callsign=\"" + this.callsign + "\"/><track speed=\"" + this.spd_kt.format_number(1) + "\" course=\"" + this.trk.string() + "\"/><status readiness=\"false\"/><remarks>ICAO:" + this.icao24 + " " + this.country + "</remarks><marti><dest mission=\"Air\"/></marti></detail></event>"

    output:
      nats:
        urls: ["nats://nats.nats.svc.cluster.local:4222"]
        subject: "tak.cot.inject"
        auth:
          user: "${NATS_USER}"
          password: "${NATS_PASSWORD}"
        tls:
          enabled: true
          skip_cert_verify: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-connect-proto
  namespace: omos
data:
  gtfs-realtime.proto: |
    syntax = "proto2";
    package transit_realtime;

    message FeedMessage {
      required FeedHeader header = 1;
      repeated FeedEntity entity = 2;
    }
    message FeedHeader {
      required string gtfs_realtime_version = 1;
      optional Incrementality incrementality = 2 [default = FULL_DATASET];
      optional uint64 timestamp = 3;
      enum Incrementality {
        FULL_DATASET = 0;
        DIFFERENTIAL = 1;
      }
    }
    message FeedEntity {
      required string id = 1;
      optional bool is_deleted = 2 [default = false];
      optional TripUpdate trip_update = 3;
      optional VehiclePosition vehicle = 4;
      optional Alert alert = 5;
    }
    message TripUpdate {
      optional TripDescriptor trip = 1;
      optional VehicleDescriptor vehicle = 3;
      repeated StopTimeUpdate stop_time_update = 2;
      optional uint64 timestamp = 4;
      message StopTimeUpdate {
        optional uint32 stop_sequence = 1;
        optional string stop_id = 4;
        optional StopTimeEvent arrival = 2;
        optional StopTimeEvent departure = 3;
        enum ScheduleRelationship {
          SCHEDULED = 0;
          SKIPPED = 1;
          NO_DATA = 2;
        }
        optional ScheduleRelationship schedule_relationship = 5 [default = SCHEDULED];
      }
      message StopTimeEvent {
        optional int32 delay = 1;
        optional int64 time = 2;
        optional int32 uncertainty = 3;
      }
      enum ScheduleRelationship {
        SCHEDULED = 0;
        ADDED = 1;
        UNSCHEDULED = 2;
        CANCELED = 3;
      }
      optional ScheduleRelationship schedule_relationship = 5 [default = SCHEDULED];
    }
    message VehiclePosition {
      optional TripDescriptor trip = 1;
      optional VehicleDescriptor vehicle = 8;
      optional Position position = 2;
      optional uint32 current_stop_sequence = 3;
      optional string stop_id = 7;
      optional VehicleStopStatus current_status = 4 [default = IN_TRANSIT_TO];
      optional uint64 timestamp = 5;
      optional CongestionLevel congestion_level = 6;
      optional OccupancyStatus occupancy_status = 9;
      enum VehicleStopStatus {
        INCOMING_AT = 0;
        STOPPED_AT = 1;
        IN_TRANSIT_TO = 2;
      }
      enum CongestionLevel {
        UNKNOWN_CONGESTION_LEVEL = 0;
        RUNNING_SMOOTHLY = 1;
        STOP_AND_GO = 2;
        CONGESTION = 3;
        SEVERE_CONGESTION = 4;
      }
      enum OccupancyStatus {
        EMPTY = 0;
        MANY_SEATS_AVAILABLE = 1;
        FEW_SEATS_AVAILABLE = 2;
        STANDING_ROOM_ONLY = 3;
        CRUSHED_STANDING_ROOM_ONLY = 4;
        FULL = 5;
        NOT_ACCEPTING_PASSENGERS = 6;
      }
    }
    message Alert {
      repeated TimeRange active_period = 1;
      repeated EntitySelector informed_entity = 5;
      optional Cause cause = 6 [default = UNKNOWN_CAUSE];
      optional Effect effect = 7 [default = UNKNOWN_EFFECT];
      optional TranslatedString url = 8;
      optional TranslatedString header_text = 10;
      optional TranslatedString description_text = 11;
      enum Cause {
        UNKNOWN_CAUSE = 1;
        OTHER_CAUSE = 2;
        TECHNICAL_PROBLEM = 3;
        STRIKE = 4;
        DEMONSTRATION = 5;
        ACCIDENT = 6;
        HOLIDAY = 7;
        WEATHER = 8;
        MAINTENANCE = 9;
        CONSTRUCTION = 10;
        POLICE_ACTIVITY = 11;
        MEDICAL_EMERGENCY = 12;
      }
      enum Effect {
        NO_SERVICE = 1;
        REDUCED_SERVICE = 2;
        SIGNIFICANT_DELAYS = 3;
        DETOUR = 4;
        ADDITIONAL_SERVICE = 5;
        MODIFIED_SERVICE = 6;
        OTHER_EFFECT = 7;
        UNKNOWN_EFFECT = 8;
        STOP_MOVED = 9;
      }
    }
    message TimeRange {
      optional uint64 start = 1;
      optional uint64 end = 2;
    }
    message Position {
      required float latitude = 1;
      required float longitude = 2;
      optional float bearing = 3;
      optional double odometer = 4;
      optional float speed = 5;
    }
    message TripDescriptor {
      optional string trip_id = 1;
      optional string route_id = 5;
      optional uint32 direction_id = 6;
      optional string start_time = 2;
      optional string start_date = 3;
      enum ScheduleRelationship {
        SCHEDULED = 0;
        ADDED = 1;
        UNSCHEDULED = 2;
        CANCELED = 3;
      }
      optional ScheduleRelationship schedule_relationship = 4;
    }
    message VehicleDescriptor {
      optional string id = 1;
      optional string label = 2;
      optional string license_plate = 3;
    }
    message EntitySelector {
      optional string agency_id = 1;
      optional string route_id = 2;
      optional int32 route_type = 3;
      optional TripDescriptor trip = 4;
      optional string stop_id = 5;
    }
    message TranslatedString {
      repeated Translation translation = 1;
      message Translation {
        required string text = 1;
        optional string language = 2;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-connect
  namespace: omos
  labels:
    app.kubernetes.io/name: redpanda-connect
    app.kubernetes.io/part-of: omos-feeds
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-connect
        app.kubernetes.io/part-of: omos-feeds
    spec:
      containers:
        - name: connect
          image: redpandadata/connect@sha256:b462939a6d7c265df7d6584925a5070beabaf5bc84d35180219e247f438b64ac
          args: ["streams", "--chilled", "/config/pipelines/feed-mta.yaml"]
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: user
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-nats-creds
                  key: password
            - name: AISSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omos-feed-secrets
                  key: AISSTREAM_API_KEY
                  optional: true
            - name: OPENSKY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: omos-feed-secrets
                  key: OPENSKY_USERNAME
                  optional: true
            - name: OPENSKY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omos-feed-secrets
                  key: OPENSKY_PASSWORD
                  optional: true
          ports:
            - name: api
              containerPort: 4195
          readinessProbe:
            httpGet:
              path: /ready
              port: 4195
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 4195
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: pipelines
              mountPath: /config/pipelines
            - name: proto
              mountPath: /proto/gtfs-realtime.proto
              subPath: gtfs-realtime.proto
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: pipelines
          configMap:
            name: redpanda-connect-pipelines
        - name: proto
          configMap:
            name: redpanda-connect-proto
            items:
              - key: gtfs-realtime.proto
                path: gtfs-realtime.proto
