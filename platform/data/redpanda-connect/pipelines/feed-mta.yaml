# feed-mta.yaml — MTA Metro-North + LIRR GTFS-realtime vehicle positions → CoT → tak.cot.inject
#
# Noise control: a train is published only when its position (rounded to 4 decimals,
# ~11 m) changes. An unchanged train is re-sent as a heartbeat once the cache entry
# expires (ttl 300s, so every 5 to 5.5 minutes with the 30s poll). CoT stale is 600s,
# longer than the heartbeat, so a parked train does not drop off TAK.
# The MTA feeds carry no speed or bearing, so the CoT <track> element is omitted.

cache_resources:
  - label: mta_last_position
    memory:
      default_ttl: 300s
      compaction_interval: 30s

input:
  generate:
    interval: "30s"
    mapping: 'root = ""'

pipeline:
  processors:
    - branch:
        request_map: 'root = ""'
        processors:
          - http:
              url: "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/mnr%2Fgtfs-mnr"
              verb: GET
              timeout: "10s"
              headers:
                User-Agent: "OMOS-FeedEngine/1.0"
          - protobuf:
              operator: to_json
              message: "transit_realtime.FeedMessage"
              import_paths: ["/proto/"]
          - mapping: |
              # GTFS-rt JSON from the protobuf processor is lowerCamelCase (tripId,
              # routeId, ...). The MTA vehicle entity carries only trip_id; route_id
              # lives on the matching trip_update, so build a tripId -> routeId lookup.
              map train {
                let trip = this.vehicle.trip.tripId.or("?")
                let route = this.vehicle.trip.routeId.or(this.tripUpdate.trip.routeId.or(this.routes.get($trip).or("?")))
                let label = this.vehicle.vehicle.label.or(this.vehicle.vehicle.id.or($trip))
                root = {
                  "uid": "MTA-MNR-" + this.id.or($trip),
                  "callsign": "MNR-" + $label,
                  "lat": this.vehicle.position.latitude,
                  "lon": this.vehicle.position.longitude,
                  "remarks": "MTA Metro-North route:" + $route + " trip:" + $trip + " status:" + this.vehicle.currentStatus.or("?") + " stop:" + this.vehicle.stopId.or("?"),
                  "feed": "MNR"
                }
              }
              let routes = this.entity.filter(e -> e.exists("tripUpdate") && e.tripUpdate.exists("trip")).fold({}, item -> item.tally.merge({ item.value.tripUpdate.trip.tripId.or("?"): item.value.tripUpdate.trip.routeId.or("?") }))
              root = this.entity.filter(e -> e.exists("vehicle") && e.vehicle.exists("position")).map_each(e -> e.merge({"routes": $routes}).apply("train"))
        result_map: 'root.mnr = this'

    - branch:
        request_map: 'root = ""'
        processors:
          - http:
              url: "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/lirr%2Fgtfs-lirr"
              verb: GET
              timeout: "10s"
              headers:
                User-Agent: "OMOS-FeedEngine/1.0"
          - protobuf:
              operator: to_json
              message: "transit_realtime.FeedMessage"
              import_paths: ["/proto/"]
          - mapping: |
              # GTFS-rt JSON from the protobuf processor is lowerCamelCase (tripId,
              # routeId, ...). The MTA vehicle entity carries only trip_id; route_id
              # lives on the matching trip_update, so build a tripId -> routeId lookup.
              map train {
                let trip = this.vehicle.trip.tripId.or("?")
                let route = this.vehicle.trip.routeId.or(this.tripUpdate.trip.routeId.or(this.routes.get($trip).or("?")))
                let label = this.vehicle.vehicle.label.or(this.vehicle.vehicle.id.or($trip))
                root = {
                  "uid": "MTA-LIRR-" + this.id.or($trip),
                  "callsign": "LIRR-" + $label,
                  "lat": this.vehicle.position.latitude,
                  "lon": this.vehicle.position.longitude,
                  "remarks": "MTA LIRR route:" + $route + " trip:" + $trip + " status:" + this.vehicle.currentStatus.or("?") + " stop:" + this.vehicle.stopId.or("?"),
                  "feed": "LIRR"
                }
              }
              let routes = this.entity.filter(e -> e.exists("tripUpdate") && e.tripUpdate.exists("trip")).fold({}, item -> item.tally.merge({ item.value.tripUpdate.trip.tripId.or("?"): item.value.tripUpdate.trip.routeId.or("?") }))
              root = this.entity.filter(e -> e.exists("vehicle") && e.vehicle.exists("position")).map_each(e -> e.merge({"routes": $routes}).apply("train"))
        result_map: 'root.lirr = this'

    - mapping: |
        root = this.mnr.or([]).concat(this.lirr.or([]))

    - unarchive:
        format: json_array

    - mapping: |
        root = if this.lat == 0 || this.lon == 0 { deleted() } else { this }

    - dedupe:
        cache: mta_last_position
        key: '${! this.uid }|${! (this.lat * 10000).round() }|${! (this.lon * 10000).round() }'
        drop_on_err: false

    - mapping: |
        let ts = now().format_timestamp("2006-01-02T15:04:05.000Z")
        let stale = (now().ts_unix() + 600).ts_format("2006-01-02T15:04:05.000Z")
        let cs = this.callsign.replace_all("&", "&amp;").replace_all("<", "&lt;").replace_all("\"", "&quot;")
        root = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\" ?>\n<event version=\"2.0\" type=\"a-n-G-E-V-C-R\" uid=\"" + this.uid + "\" how=\"m-g\" time=\"" + $ts + "\" start=\"" + $ts + "\" stale=\"" + $stale + "\"><point lat=\"" + this.lat.string() + "\" lon=\"" + this.lon.string() + "\" hae=\"0\" ce=\"50\" le=\"50\"/><detail><contact callsign=\"" + $cs + "\"/><remarks>" + this.remarks + "</remarks><marti><dest mission=\"Land\"/></marti></detail></event>"

output:
  nats:
    urls: ["nats://nats.nats.svc.cluster.local:4222"]
    subject: "tak.cot.inject"
    auth:
      user: "${NATS_USER}"
      password: "${NATS_PASSWORD}"
    tls:
      enabled: true
      skip_cert_verify: true
