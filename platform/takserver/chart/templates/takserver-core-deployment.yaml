apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-messaging
spec:
  selector:
      matchLabels:
        app: takserver-messaging
  replicas: {{ .Values.takserver.messaging.replicas }}
  template:
    metadata:
      labels:
        app: takserver-messaging
    spec:
      serviceAccountName: takserver-ignite
      initContainers:
        - name: copy-coreconfig
          image: busybox:1.36
          command: ['cp', '/tmp/cm/CoreConfig.xml', '/tak-conf/CoreConfig.xml']
          volumeMounts:
            - name: core-config-cm
              mountPath: /tmp/cm/CoreConfig.xml
              subPath: CoreConfig.xml
            - name: tak-conf
              mountPath: /tak-conf
      containers:
        - name: takserver-messaging
          image: "{{ .Values.takserver.messaging.image.repository }}:{{ .Values.takserver.messaging.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          env:
            - name: MAX_HEAP_PERCENT
              value: "75.0"
            - name: "spring_profiles_active"
              value: "k8cluster"
            - name: POSTGRES_HOST
              value: "{{ .Values.global.postgresql.host }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.global.postgresql.port }}"
          resources:
            requests:
              cpu: "{{ .Values.takserver.messaging.resources.requests.cpu }}"
              memory: "{{ .Values.takserver.messaging.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.takserver.api.resources.limits.cpu }}"
              memory: "{{ .Values.takserver.api.resources.limits.memory }}"
          ports:
            - containerPort: 8089
              name: tls-8089
            - containerPort: 9000
              name: fedv1-9000
            - containerPort: 9001
              name: fedv2-9001
          readinessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 80
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 480
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: config #The name(key) value must match pod volumes name(key) value
              mountPath: /certs-configmap/
            - name: tak-ignite-config
              mountPath: /opt/tak/TAKIgniteConfig.xml
              subPath: TAKIgniteConfig.xml
            - name: tak-conf
              mountPath: /opt/tak/conf/CoreConfig.xml
              subPath: CoreConfig.xml
      volumes:
        - name: config
{{- if .Values.takserver.messaging.enrollmentSignerSecret }}
          # Messaging now reconciles in platform-takserver. Preserve this projection
          # in any explicitly reviewed future Helm/core ownership transition.
          projected:
            defaultMode: 420
            sources:
              - configMap:
                  name: "{{ .Values.certConfigMapName }}"
              - secret:
                  name: "{{ .Values.takserver.messaging.enrollmentSignerSecret }}"
                  items:
                    - key: ca-signing.jks
                      path: ca-signing.jks
                      mode: 256
{{- else }}
          configMap:
            name: "{{ .Values.certConfigMapName }}"
{{- end }}
        - name: tak-ignite-config
          configMap:
            name: "{{ .Values.takIgniteConfigMapName }}"
        - name: core-config-cm
          configMap:
            name: "{{ .Values.coreConfigMapName }}"
        - name: tak-conf
          emptyDir: {}

      imagePullSecrets:
        - name: "{{ .Values.imagePullSecret }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-api
spec:
  selector:
      matchLabels:
        app: takserver-api
  replicas: {{ .Values.takserver.api.replicas }}
  template:
    metadata:
      labels:
        app: takserver-api
    spec:
      serviceAccountName: takserver-ignite
      containers:
        - name: takserver-api
          image: "{{ .Values.takserver.api.image.repository }}:{{ .Values.takserver.api.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          env:
            - name: MAX_HEAP_PERCENT
              value: "75.0"
            - name: POSTGRES_HOST
              value: "{{ .Values.global.postgresql.host }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.global.postgresql.port }}"
          resources:
            requests:
              cpu: "{{ .Values.takserver.api.resources.requests.cpu }}"
              memory: "{{ .Values.takserver.api.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.takserver.api.resources.limits.cpu }}"
              memory: "{{ .Values.takserver.api.resources.limits.memory }}"
          ports:
            - containerPort: 8443
              name: http-8443
            - containerPort: 8444
              name: fed-8444
            - containerPort: 8446
              name: certs-8446
            - containerPort: 8080
              name: unsecure-8446
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: config #The name(key) value must match pod volumes name(key) value
              mountPath: /certs-configmap/
            - name: tak-ignite-config
              mountPath: /opt/tak/TAKIgniteConfig.xml
              subPath: TAKIgniteConfig.xml
      volumes:
        - name: config
          configMap:
            name: "{{ .Values.certConfigMapName }}"
        - name: tak-ignite-config
          configMap:
            name: "{{ .Values.takIgniteConfigMapName }}"

      imagePullSecrets:
        - name: "{{ .Values.imagePullSecret }}"
---
