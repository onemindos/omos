apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-nats-box
  namespace: takserver
  labels:
    app.kubernetes.io/component: nats-box
    app.kubernetes.io/instance: takserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nats
    app.kubernetes.io/version: 2.9.21
    helm.sh/chart: nats-1.0.1
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: nats-box
      app.kubernetes.io/instance: takserver
      app.kubernetes.io/name: nats
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nats-box
        app.kubernetes.io/instance: takserver
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: nats
        app.kubernetes.io/version: 2.9.21
        helm.sh/chart: nats-1.0.1
    spec:
      containers:
      - args:
        - trap true INT TERM; sleep infinity & wait
        command:
        - sh
        - -ec
        - "work_dir=\"$(pwd)\"\nmkdir -p \"$XDG_CONFIG_HOME/nats\"\ncd \"$XDG_CONFIG_HOME/nats\"\
          \nif ! [ -s context ]; then\n  ln -s /etc/nats-contexts context\nfi\nif\
          \ ! [ -f context.txt ]; then\n  echo -n \"default\" > context.txt\nfi\n\
          cd \"$work_dir\"\nexec sh -ec \"$0\"\n"
        image: natsio/nats-box:0.13.8
        imagePullPolicy: IfNotPresent
        name: nats-box
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/nats-contexts
          name: contexts
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: contexts
        secret:
          defaultMode: 420
          secretName: takserver-nats-box-contexts
