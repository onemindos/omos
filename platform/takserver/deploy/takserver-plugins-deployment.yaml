apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-plugins
  namespace: takserver
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  selector:
    matchLabels:
      app: takserver-plugins
  replicas: 1
  template:
    metadata:
      labels:
        app: takserver-plugins
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - onemind-hub-core-v2
      serviceAccountName: takserver-ignite
      containers:
      - name: takserver-plugins
        image: ghcr.io/onemindos/takserver-base@sha256:f4824fba65a23efa9ebf946040509591b90823ab2b118b1e272c6cf55337d694
        imagePullPolicy: Always
        env:
        - name: spring_profiles_active
          value: k8cluster
        - name: PLUGIN_MANAGER_MAX_HEAP
          value: '1024'
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        livenessProbe:
          tcpSocket:
            port: 10800
          initialDelaySeconds: 600
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /certs-configmap/
        - name: tak-ignite-config
          mountPath: /TAKIgniteConfig.xml
        startupProbe:
          tcpSocket:
            port: 10800
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 10800
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: config
        projected:
          defaultMode: 420
          sources:
          - configMap:
              name: cert-migration
              items:
              - key: admin-trusted.pem
                path: admin-trusted.pem
              - key: admin.csr
                path: admin.csr
              - key: admin.jks
                path: admin.jks
              - key: admin.key
                path: admin.key
              - key: admin.p12
                path: admin.p12
              - key: admin.pem
                path: admin.pem
              - key: ca-trusted.pem
                path: ca-trusted.pem
              - key: ca.crl
                path: ca.crl
              - key: ca.pem
                path: ca.pem
              - key: config-takserver.cfg
                path: config-takserver.cfg
              - key: crl_index.txt
                path: crl_index.txt
              - key: crl_index.txt.attr
                path: crl_index.txt.attr
              - key: root-ca-trusted.pem
                path: root-ca-trusted.pem
              - key: root-ca.pem
                path: root-ca.pem
              - key: takserver-trusted.pem
                path: takserver-trusted.pem
              - key: takserver.csr
                path: takserver.csr
              - key: takserver.key
                path: takserver.key
              - key: takserver.p12
                path: takserver.p12
              - key: takserver.pem
                path: takserver.pem
              - key: truststore-root.p12
                path: truststore-root.p12
              - key: user-trusted.pem
                path: user-trusted.pem
              - key: user.csr
                path: user.csr
              - key: user.jks
                path: user.jks
              - key: user.key
                path: user.key
              - key: user.p12
                path: user.p12
              - key: user.pem
                path: user.pem
          - secret:
              name: tak-server-stores
              items:
              - key: takserver.jks
                path: takserver.jks
              - key: truststore-root.jks
                path: truststore-root.jks
              - key: fed-truststore.jks
                path: fed-truststore.jks
      - name: tak-ignite-config
        configMap:
          name: tak-ignite-config
      imagePullSecrets:
      - name: ghcr
