apiVersion: v1
kind: Service
metadata:
  name: takserver-api-service
  namespace: takserver
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: https-8443
    port: 8443
    protocol: TCP
    targetPort: 8443
  - name: https-8444
    port: 8444
    protocol: TCP
    targetPort: 8444
  - name: https-8446
    port: 8446
    protocol: TCP
    targetPort: 8446
  selector:
    app: takserver-api
  sessionAffinity: None
  type: ClusterIP
