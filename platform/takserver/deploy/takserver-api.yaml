apiVersion: apps/v1
kind: Deployment
metadata:
  name: takserver-api
  namespace: takserver
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '1'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: takserver-api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-09-13T00:51:39-04:00'
      labels:
        app: takserver-api
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - . /setenv.sh; cp /keystores/* /certs/files/ 2>/dev/null; cp /userauth-input/UserAuthenticationFile.xml
          /UserAuthenticationFile.xml 2>/dev/null; exec java -server -XX:+AlwaysPreTouch
          -XX:+UseG1GC -XX:+ScavengeBeforeFullGC -XX:+DisableExplicitGC -XX:MaxRAMPercentage=${MAX_HEAP_PERCENT}
          -Dspring.profiles.active=api,consolelog -Dkeystore.pkcs12.legacy -jar takserver.war
        env:
        - name: MAX_HEAP_PERCENT
          value: '75.0'
        - name: POSTGRES_HOST
          value: takserver-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        image: ghcr.io/onemindos/takserver-base:api-5.8-onemind
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 180
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 8443
          timeoutSeconds: 1
        name: takserver-api
        ports:
        - containerPort: 8443
          name: http-8443
          protocol: TCP
        - containerPort: 8444
          name: fed-8444
          protocol: TCP
        - containerPort: 8446
          name: certs-8446
          protocol: TCP
        - containerPort: 8080
          name: unsecure-8446
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8443
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 2560Mi
          requests:
            cpu: '1'
            memory: 1536Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /certs-configmap/
          name: config
        - mountPath: /keystores/
          name: tak-keystores
        - mountPath: /userauth-input/UserAuthenticationFile.xml
          name: tak-userauth
          subPath: UserAuthenticationFile.xml
        - mountPath: /opt/tak/TAKIgniteConfig.xml
          name: tak-ignite-config
          subPath: TAKIgniteConfig.xml
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: takserver-ignite
      serviceAccountName: takserver-ignite
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: cert-migration
        name: config
      - configMap:
          defaultMode: 420
          name: tak-ignite-config
        name: tak-ignite-config
      - name: tak-keystores
        secret:
          defaultMode: 420
          secretName: tak-keystores
      - configMap:
          defaultMode: 420
          name: tak-userauth
        name: tak-userauth
