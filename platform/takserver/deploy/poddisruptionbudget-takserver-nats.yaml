apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: takserver-nats
  namespace: takserver
  labels:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: takserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nats
    app.kubernetes.io/version: 2.9.21
    helm.sh/chart: nats-1.0.1
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nats
      app.kubernetes.io/instance: takserver
      app.kubernetes.io/name: nats
