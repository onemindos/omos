apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: takserver-ignite
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - endpoints
  verbs:
  - get
  - list
  - watch
