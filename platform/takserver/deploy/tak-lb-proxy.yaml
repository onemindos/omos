# OneMind TAK L4 TCP proxy. nginx `stream` mode does raw TCP proxying (NO TLS
# termination), so TAK mutual-TLS passes straight through to the api/messaging pods.
# It is reachable ONLY over the tailnet, through the `tak-tailnet` Service
# (tak-tailscale.yaml). The public DigitalOcean LoadBalancer Service `tak-external`
# (152.42.155.95) was removed; nothing in this cluster listens on a public TAK port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tak-lb-proxy-conf
  namespace: takserver
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 4096; }
    stream {
      # 8446 — certificate enrollment (api)
      upstream tak_enroll  { server takserver-api-service:8446; }
      # 8443 — WebTAK / Marti API (api)
      upstream tak_webtak  { server takserver-api-service:8443; }
      # 8089 — CoT streaming, mutual-TLS (messaging)
      upstream tak_cot     { server takserver-messaging-service:8089; }
      # 64738 — Mumble voice (murmur, TCP only)
      upstream murmur_v    { server murmur:64738; }

      server { listen 8446; proxy_pass tak_enroll; proxy_timeout 600s; }
      server { listen 8443; proxy_pass tak_webtak; proxy_timeout 600s; }
      server { listen 8089; proxy_pass tak_cot;    proxy_timeout 600s; }
      server { listen 64738; proxy_pass murmur_v;  proxy_timeout 600s; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-lb-proxy
  namespace: takserver
  labels: {app: tak-lb-proxy}
spec:
  replicas: 1
  selector: {matchLabels: {app: tak-lb-proxy}}
  template:
    metadata:
      labels: {app: tak-lb-proxy}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {containerPort: 8089}
            - {containerPort: 8443}
            - {containerPort: 8446}
            - {containerPort: 64738}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: conf
          configMap: {name: tak-lb-proxy-conf}
