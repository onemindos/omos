apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-configuration
  namespace: takserver
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
data:
  pg_hba.conf: 'postgres.conf: |-'
