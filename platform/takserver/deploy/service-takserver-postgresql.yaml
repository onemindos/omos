apiVersion: v1
kind: Service
metadata:
  name: takserver-postgresql
  namespace: takserver
  labels:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: takserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postgresql
    helm.sh/chart: postgresql-12.1.6
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: tcp-postgresql
    port: 5432
    protocol: TCP
    targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: takserver
    app.kubernetes.io/name: postgresql
  sessionAffinity: None
  type: ClusterIP
