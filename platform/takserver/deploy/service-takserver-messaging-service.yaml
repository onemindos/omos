apiVersion: v1
kind: Service
metadata:
  name: takserver-messaging-service
  namespace: takserver
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: streaming-8089
    port: 8089
    protocol: TCP
    targetPort: 8089
  - name: fed-9000
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: fed-9001
    port: 9001
    protocol: TCP
    targetPort: 9001
  selector:
    app: takserver-messaging
  sessionAffinity: None
  type: ClusterIP
