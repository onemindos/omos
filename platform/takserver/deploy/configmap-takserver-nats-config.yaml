apiVersion: v1
kind: ConfigMap
metadata:
  name: takserver-nats-config
  namespace: takserver
  labels:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: takserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nats
    app.kubernetes.io/version: 2.9.21
    helm.sh/chart: nats-1.0.1
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
data:
  nats.conf: "{\n  \"http_port\": 8222,\n  \"jetstream\": {\n    \"max_file_store\"\
    : 10Gi,\n    \"max_memory_store\": 0,\n    \"store_dir\": \"/data\"\n  },\n  \"\
    lame_duck_duration\": \"30s\",\n  \"lame_duck_grace_period\": \"10s\",\n  \"pid_file\"\
    : \"/var/run/nats/nats.pid\",\n  \"port\": 4222,\n  \"server_name\": $SERVER_NAME\n\
    }\n"
