# TAK Server on the tailnet -- the ONLY path to TAK (no public IP, no cloud LB).
#
# The Tailscale operator sees loadBalancerClass: tailscale and creates a tailnet node
# named `tak` (MagicDNS: tak.tail717ba0.ts.net, tailnet IP 100.119.127.43) that forwards
# the ports below to the tak-lb-proxy pods. The former public DigitalOcean LB Service
# `tak-external` (152.42.155.95) was removed; see docs/networking/NETWORKING.md.
#
# Why tak-lb-proxy and not the TAK pods directly: it is already the single L4 TCP
# passthrough in front of the api/messaging/murmur services (no TLS termination, so
# client-cert mTLS is untouched).
#
# Not exposed on purpose:
#   9101/9102  TAK federation. There are no federation partners; nothing serves these ports.
#   64738/UDP  Mumble voice; the proxy is TCP-only (stream). Mumble falls back to TCP.
#
# Certificate note: the TAK server certificate (CN=takserver) has SANs takserver,
# takserver-api-service, takserver-messaging-service, localhost, 152.42.155.95 and
# 10.109.1.202. It does not contain tak.tail717ba0.ts.net or 100.119.127.43. See
# docs/networking/NETWORKING.md section 5 before relying on hostname verification.
apiVersion: v1
kind: Service
metadata:
  name: tak-tailnet
  namespace: takserver
  labels:
    app.kubernetes.io/name: tak-tailnet
    app.kubernetes.io/part-of: omos-networking
  annotations:
    tailscale.com/hostname: "tak"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: tak-lb-proxy
  ports:
    - name: cot
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: webtak
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: enroll
      port: 8446
      targetPort: 8446
      protocol: TCP
    - name: mumble
      port: 64738
      targetPort: 64738
      protocol: TCP
