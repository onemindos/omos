apiVersion: v1
kind: ConfigMap
metadata:
  name: takserver-ignite-configmap
  namespace: takserver
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
data:
  ignite-config.xml: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<!--\n  Licensed\
    \ to the Apache Software Foundation (ASF) under one or more\n  contributor license\
    \ agreements.  See the NOTICE file distributed with\n  this work for additional\
    \ information regarding copyright ownership.\n  The ASF licenses this file to\
    \ You under the Apache License, Version 2.0\n  (the \"License\"); you may not\
    \ use this file except in compliance with\n  the License.  You may obtain a copy\
    \ of the License at\n\n       http://www.apache.org/licenses/LICENSE-2.0\n\n \
    \ Unless required by applicable law or agreed to in writing, software\n  distributed\
    \ under the License is distributed on an \"AS IS\" BASIS,\n  WITHOUT WARRANTIES\
    \ OR CONDITIONS OF ANY KIND, either express or implied.\n  See the License for\
    \ the specific language governing permissions and\n  limitations under the License.\n\
    -->\n\n<!--\n    Configuration example with Kubernetes IP finder and Ignite persistence\
    \ enabled.\n    WAL files and database files are stored in separate disk drives.\n\
    -->\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n       xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n       xsi:schemaLocation=\"\n  \
    \      http://www.springframework.org/schema/beans\n        http://www.springframework.org/schema/beans/spring-beans.xsd\"\
    >\n\n    <bean class=\"org.apache.ignite.configuration.IgniteConfiguration\">\n\
    \n        <property name=\"peerClassLoadingEnabled\" value=\"false\"/>\n\n   \
    \     <!-- Ignite Data Storage Configuration -->\n        <property name=\"dataStorageConfiguration\"\
    >\n            <bean class=\"org.apache.ignite.configuration.DataStorageConfiguration\"\
    >\n                \n            </bean>\n        </property>\n\n        <!--\
    \ Explicitly configure TCP discovery SPI to provide list of initial nodes. -->\n\
    \        <property name=\"discoverySpi\">\n            <bean class=\"org.apache.ignite.spi.discovery.tcp.TcpDiscoverySpi\"\
    >\n                <property name=\"ipFinder\">\n                    <!--\n  \
    \                      Enables Kubernetes IP finder and setting custom namespace\
    \ and service names.\n                    -->\n                    <bean class=\"\
    org.apache.ignite.spi.discovery.tcp.ipfinder.kubernetes.TcpDiscoveryKubernetesIpFinder\"\
    >\n                        <property name=\"namespace\" value=\"takserver\"/>\n\
    \                        <property name=\"serviceName\" value=\"takserver-ignite\"\
    />\n                    </bean>\n                </property>\n            </bean>\n\
    \        </property>\n    </bean>\n</beans>\n"
