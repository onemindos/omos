apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: takserver-ignite
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: takserver
    meta.helm.sh/release-namespace: takserver
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '0'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: takserver-ignite
subjects:
- kind: ServiceAccount
  name: takserver-ignite
  namespace: takserver
