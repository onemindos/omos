# FedHub ConfigMaps — broker and UI configuration.
# Mounted into the fedhub pod at /opt/tak/federation-hub/configs/.
# Step 2 (2026-10-29) rotated TAK Server's own stores only. FedHub loads its own copies from the sealed
# Secret fedhub-certs, which keep the stock password, so these values are unchanged. Rotate them together
# with a re-sealed fedhub-certs. See docs/operations/tak-ca-password-rotation-step1-2026-10-29.md
# Passwords in these configs (keystorePassword: atakatak) are the default JKS
# password generated by the TAK cert scripts — not user credentials.
# The fedhub-certs Secret (sealed) holds the actual JKS/PEM files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fedhub-broker-config
  namespace: takserver
  labels: {app: fedhub, component: broker}
data:
  federation-hub-broker.yml: |
    keystoreType: JKS
    keystoreFile: /opt/tak/federation-hub/certs/files/takserver.jks
    keystorePassword: atakatak

    truststoreType: JKS
    truststoreFile: /opt/tak/federation-hub/certs/files/fed-truststore.jks
    truststorePassword: atakatak

    keyManagerType: SunX509
    caFile: /opt/tak/federation-hub/certs/files/ca.pem

    v1Enabled: true
    v1Port: 9101
    v2Enabled: true
    v2Port: 9102
    maxMessageSizeBytes: 268435456
    clientTimeoutTime: 15
    clientRefreshTime: 5
    enableHealthCheck: true
    useCaGroups: true
    useEpoll: true
    tlsVersions:
      - TLSv1.2
      - TLSv1.3

    # MongoDB — only required for MFDT (Mission Federation Disruption Tolerance).
    # MFDT is disabled below. When enabling, create fedhub-mongodb-creds SealedSecret
    # and set dbUsername/dbPassword here (or inject via env substitution).
    dbHost: fedhub-mongodb
    dbPort: 27017
    dbConnectionTimeoutMS: 5000

    missionFederationDisruptionEnabled: false
    missionFederationDBRetentionDays: 7
    missionFederationRecencySeconds: 43200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fedhub-ui-config
  namespace: takserver
  labels: {app: fedhub, component: ui}
data:
  federation-hub-ui.yml: |
    port: 9100

    keystoreType: JKS
    keystoreFile: /opt/tak/federation-hub/certs/files/takserver.jks
    keystorePassword: atakatak
    keyAlias: takserver

    truststoreType: JKS
    truststoreFile: /opt/tak/federation-hub/certs/files/truststore-root.jks
    truststorePassword: atakatak

    authUsers: /opt/tak/federation-hub/authorized_users.yml
    prometheusEnable: false

    # Authentik OAuth. The Authentik side (provider, application `fedhub`, group `fedhub-admins`) is created by
    # platform/ecosystem/resources/fedhub-authentik-provider.yaml. keycloakSecret below is a token, not a value:
    # the copy-configs init container in fedhub.yaml replaces it with the key `keycloakSecret` of the sealed Secret
    # fedhub-oidc-secret. keycloakTlsCertFile is the ONLY trust anchor FedHub uses when it fetches the OIDC
    # discovery document (it does not fall back to the JVM trust store), so it must be the CA that signs
    # auth.onemindos.dev: the Google Trust Services root in ConfigMap fedhub-authentik-ca (below).
    allowOauth: true
    # OAuth runs on its own TLS port without a client certificate; the main port (9100) always requires one.
    oauthPort: 9443
    oauthPortTls: true
    keycloakServerName: OneMind Authentik
    keycloakTlsCertFile: /opt/tak/federation-hub/authentik-ca/ca.pem
    keycloakClientId: fedhub
    keycloakSecret: __FEDHUB_OIDC_SECRET__
    # The key really is spelled `keycloakrRedirectUri` (extra r): that is the field name in FedHub 5.8's
    # FederationHubUIConfig. The documented `keycloakRedirectUri` is silently ignored (the config class ignores unknown
    # keys), the value stays empty, and FederationHubUIServer then never starts the OAuth connector on `oauthPort`
    # (it requires allowOauth and every keycloak* field, including the redirect URI, to be non-empty).
    keycloakrRedirectUri: https://fedhub.tail717ba0.ts.net:9443/login/redirect
    keycloakConfigurationEndpoint: https://auth.onemindos.dev/application/o/fedhub/.well-known/openid-configuration
    keycloakClaimName: groups
    keycloakAdminClaimValue: fedhub-admins
---
# Public CA certificate (not a secret): GTS Root R4, the Google Trust Services root that signs the certificate
# chain served for auth.onemindos.dev (leaf -> WE1 -> GTS Root R4). SHA-256 fingerprint:
# 34:9D:FA:40:58:C5:E2:63:12:3B:39:8A:E7:95:57:3C:4E:13:13:C8:3F:E6:8F:93:55:6C:D5:E8:03:1B:3C:7D
