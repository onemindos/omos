# FedHub Admin UI -- tailnet only: https://fedhub.tail717ba0.ts.net
#
# Replaces the public nginx Ingress for fedhub.onemindos.dev (open to the internet, no
# IP or auth restriction). The Tailscale operator creates a tailnet node `fedhub` and
# terminates TLS with a tailnet certificate; it forwards plain HTTP to fedhub-ui:9100.
#
# The Authentik OIDC client `fedhub` must list the new redirect URI
# https://fedhub.tail717ba0.ts.net/login/redirect (see fedhub-config.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedhub-ingress
  namespace: takserver
  labels: {app: fedhub}
  annotations:
    tailscale.com/hostname: fedhub
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: fedhub-ui
      port:
        number: 9100
  tls:
    - hosts: [fedhub]
