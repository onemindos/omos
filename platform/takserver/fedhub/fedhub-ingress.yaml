# FedHub Admin UI Ingress — fedhub.onemindos.dev → fedhub-ui:9100
#
# DNS: Add A record fedhub.onemindos.dev → 143.244.220.155 (Cloudflare-proxied)
# before deploying, otherwise the Ingress will have no route to serve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedhub-ingress
  namespace: takserver
  labels: { app: fedhub }
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # FedHub UI is a Spring Boot WAR — increase body size for cert uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: fedhub.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fedhub-ui
                port: { number: 9100 }
