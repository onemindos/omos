# FedHub Admin UI -- tailnet only: https://fedhub.tail717ba0.ts.net
#
# Replaces the public nginx Ingress for fedhub.onemindos.dev (open to the internet, no
# IP or auth restriction). The Tailscale operator creates a tailnet node `fedhub` and
# terminates TLS with a tailnet certificate.
#
# fedhub-ui:9100 itself serves TLS (FedHub's Jetty, self-signed TAK cert). The operator (v1.98.x) proxies to
# the backend with plain HTTP unless the Ingress backend port is named `https` (or is 443), in which case it
# uses `https+insecure://`: TLS to the backend without verifying its certificate, which is what a self-signed
# cert needs. Service `appProtocol` is NOT read by the operator. So the Service port is named `https` and the
# backend below refers to it by that name. Same mechanism as the Argo CD Ingress (backend port 443).
#
# The Authentik OIDC client `fedhub` must list the new redirect URI
# https://fedhub.tail717ba0.ts.net/login/redirect (see fedhub-config.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedhub-ingress
  namespace: takserver
  labels: {app: fedhub}
  annotations:
    tailscale.com/hostname: fedhub
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: fedhub-ui
      port:
        name: https
  tls:
    - hosts: [fedhub]
