# MongoDB for FedHub MFDT (Mission Federation Disruption Tolerance).
#
# MFDT is currently DISABLED in fedhub-broker-config (missionFederationDisruptionEnabled: false).
# MongoDB is deployed and ready so enabling MFDT is a config-only change when needed.
#
# TO ENABLE MFDT:
#   1. Create fedhub-mongodb-creds SealedSecret (see command below)
#   2. Edit fedhub-broker-config: set missionFederationDisruptionEnabled: true
#      and add dbUsername/dbPassword fields matching the secret
#   3. Rollout restart: kubectl -n takserver rollout restart deploy/fedhub
#
# CREATE SEALED SECRET:
#   kubectl -n takserver create secret generic fedhub-mongodb-creds \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=root \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD='<strong-password>' \
#     --dry-run=client -o yaml | kubeseal -o yaml \
#     > platform/takserver/fedhub/fedhub-mongodb-creds.sealedsecret.yaml
#   Commit the .sealedsecret.yaml, NOT plaintext.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fedhub-mongodb-init
  namespace: takserver
  labels: {app: fedhub-mongodb}
data:
  init-fedhub.js: |
    db = db.getSiblingDB('martiDB');
    db.createUser({
      user: 'martiuser',
      pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
      roles: [{ role: 'readWrite', db: 'martiDB' }]
    });
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fedhub-mongodb
  namespace: takserver
  labels: {app: fedhub-mongodb}
spec:
  serviceName: fedhub-mongodb
  replicas: 1
  selector:
    matchLabels: {app: fedhub-mongodb}
  template:
    metadata:
      labels: {app: fedhub-mongodb}
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - {name: mongo, containerPort: 27017, protocol: TCP}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fedhub-mongodb-creds
                  key: MONGO_INITDB_ROOT_USERNAME
                  optional: true   # pod starts without MFDT creds; MFDT just won't auth
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fedhub-mongodb-creds
                  key: MONGO_INITDB_ROOT_PASSWORD
                  optional: true
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}  # was 500m; throttled ~34%
          volumeMounts:
            - {name: mongo-data, mountPath: /data/db}
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/init-fedhub.js
              subPath: init-fedhub.js
      volumes:
        - name: mongo-init
          configMap:
            name: fedhub-mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: fedhub-mongodb
  namespace: takserver
  labels: {app: fedhub-mongodb}
spec:
  selector: {app: fedhub-mongodb}
  clusterIP: None   # headless for StatefulSet stable DNS
  ports:
    - {name: mongo, port: 27017, targetPort: 27017, protocol: TCP}
