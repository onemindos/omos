# OneMind DOKS values for the TAK Server 5.8 cluster.
# Base chart: chart (TAK Product Center blueprint, vendored).
#
# DEPLOY INTO NAMESPACE `takserver` — non-negotiable. The Ignite Kubernetes IP
# finder hardcodes service `takserver-ignite` + namespace `takserver`
# (upstream issue #43). A different namespace = Ignite discovery fails.
#
#   helm upgrade --install takserver ./chart \
#     -n takserver --create-namespace \
#     -f values-onemind.yaml
#
# Images: built from takserver-docker-hardened-5.8-RELEASE-69 and pushed to GHCR.
# Build context = extracted distro root (tak/ directory). See services/takserver/build/stage.sh.

imagePullSecret: ghcr
certConfigMapName: cert-migration
coreConfigMapName: core-config
takIgniteConfigMapName: tak-ignite-config

takserver:
  ingress:
    enabled: false          # 8089 fronted by a DO TCP LoadBalancer; 8443/8446 via Cloudflare Tunnel
    api:
      cert: {annotations: {}, host: ""}
      federationTruststore: {annotations: {}, host: ""}
      https: {annotations: {}, host: ""}
    messaging:
      streaming: {annotations: {}, host: ""}
      fedv1: {annotations: {}, host: ""}
      fedv2: {annotations: {}, host: ""}

  config:                   # centralized config service (starts first)
    image: {repository: ghcr.io/onemindos/takserver-base, tag: "config-5.8-onemind"}
    replicas: 1
    resources: {requests: {cpu: 1, memory: 1Gi}, limits: {cpu: 1, memory: 1Gi}}

  # messaging = the device-load tier (CoT/TCP 8089). SCALE THIS as EUD count grows (HPA-ready).
  messaging:
    # This Deployment is reconciled by platform-takserver; coordinate core Helm
    # upgrades with that owner rather than independently replacing its live spec.
    enrollmentSignerSecret: tak-enrollment-signer
    image: {repository: ghcr.io/onemindos/takserver-base, tag: "messaging-5.8-onemind"}
    replicas: 1
    resources: {requests: {cpu: 1, memory: 1.5Gi}, limits: {cpu: 2, memory: 2Gi}}

  api:                      # Marti API / WebTAK / cert enrollment
    image: {repository: ghcr.io/onemindos/takserver-base, tag: "api-5.8-onemind"}
    replicas: 1
    resources: {requests: {cpu: 1, memory: 1.5Gi}, limits: {cpu: 2, memory: 2.5Gi}}

  # plugins tier: the tag below is the UPSTREAM build without the NatsBridgePlugin
  # (build-takserver.yml); the OneMind overlay with the plugin is plugins-5.8-onemind. The
  # running plugins Deployment is Argo-managed in deploy/takserver-plugins-deployment.yaml
  # (digest-pinned) and also lacks the plugin (A21 diagnosis, services/takserver/plugin-src/README.md).
  plugins:
    enabled: true
    image: {repository: ghcr.io/onemindos/takserver-base, tag: "plugins-upstream-5.8-onemind"}
    replicas: 1
    resources: {requests: {cpu: 1, memory: 1Gi}, limits: {cpu: 2, memory: 2Gi}}

  takserverDatabaseSetup:
    image: {repository: ghcr.io/onemindos/takserver-base, tag: "db-setup-5.8-onemind"}

  limits:
    persistentVolumeClaims: '5'
    requests: {storage: 50Gi}
    storage: {max: 50Gi, min: 1Gi}

# --- Database ---------------------------------------------------------------
# START simple: in-cluster PostGIS (self-contained first bring-up).
# SWITCH to DO Managed PostgreSQL for prod: set postgresql.enabled=false and point
# global.postgresql.host at the managed host (also update CoreConfig.xml Repository).
postgresql:
  enabled: true
  image: {registry: docker.io, repository: postgis/postgis, tag: 15-3.4}
  configurationConfigMap: postgres-configuration
  # Keep these budgets aligned with the adopted StatefulSet in deploy/.
  primary:
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
global:
  postgresql:
    host: takserver-postgresql
    port: "5432"
    auth: {postgresqlUsername: postgres, postgresqlPassword: postgres, postgresqlDatabase: cot}

# --- Ignite (distributed cache + K8s cluster discovery) ---------------------
ignite:
  image: {repository: ghcr.io/onemindos/takserver-base, tag: "ignite-5.8-onemind", pullPolicy: Always}
  # ghcr PAT rotated 2026-09-09 → 1P item "GHCR Pull PAT (k8s)"; all 6 ghcr secrets patched. Always restored.
  serviceAccount: {name: takserver-ignite}
  peerClassLoadingEnabled: false
  # 2026-09-09: requests added — pods ran requestless (680Mi each), hiding 1.3Gi
  # of real usage from the scheduler and overcommitting node memory.
  resources: {requests: {cpu: 250m, memory: 768Mi}, limits: {cpu: "2", memory: 1536Mi}}
  env:
    OPTION_LIBS: "ignite-kubernetes,ignite-rest-http,ignite-json,ignite-slf4j,ignite-urideploy,ignite-web,ignite-calcite"
    IGNITE_QUIET: "false"
    JVM_OPTS: >-
      -Djava.net.preferIPv4Stack=true
      --add-opens=java.base/jdk.internal.access=ALL-UNNAMED
      --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
      --add-opens=java.base/java.lang=ALL-UNNAMED
      --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
      --add-opens=java.base/java.io=ALL-UNNAMED
      --add-opens=java.base/java.net=ALL-UNNAMED
      --add-opens=java.base/java.nio=ALL-UNNAMED
      --add-opens=java.base/java.util=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
      --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED
      --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
      --add-opens=java.base/sun.util.calendar=ALL-UNNAMED
      --add-opens=java.base/sun.net.util=ALL-UNNAMED
      --add-opens=java.base/sun.reflect.generics.reflectiveObjects=ALL-UNNAMED
      --add-opens=java.management/com.sun.jmx.mbeanserver=ALL-UNNAMED
      --add-opens=jdk.internal.jvmstat/sun.jvmstat.monitor=ALL-UNNAMED
      --add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED

# --- NATS: TAK-INTERNAL bus between pods --- NOT the OneMind bus -------------
# This NATS is the cluster's own inter-pod messaging (JetStream). It is SEPARATE
# from the OneMind NATS that Zeus's bridge plugin connects to (see plugin config).
# 1 replica keeps the footprint small; use 3 (R3) for prod HA.
nats:
  image: {tag: 1.0.1}
  config:
    jetstream: {enabled: true}
    cluster: {enabled: false, replicas: 1}
  # 2026-09-09: requests added — ran requestless.
  container:
    merge:
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 512Mi}
  reloader:
    merge:
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
  natsBox:
    container:
      merge:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
