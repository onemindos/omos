apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: forgejo
        image: codeberg.org/forgejo/forgejo:15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: FORGEJO____APP_NAME
          value: "OneMind Forgejo \u2014 independent code mirror"
        - name: FORGEJO____RUN_MODE
          value: prod
        - name: FORGEJO__database__DB_TYPE
          value: sqlite3
        - name: FORGEJO__database__PATH
          value: /var/lib/gitea/data/forgejo.db
        - name: FORGEJO__server__ROOT_URL
          value: https://forgejo.tail717ba0.ts.net/
        - name: FORGEJO__server__DOMAIN
          value: forgejo.tail717ba0.ts.net
        - name: FORGEJO__server__HTTP_PORT
          value: '3000'
        - name: FORGEJO__server__DISABLE_SSH
          value: 'true'
        - name: FORGEJO__server__LFS_START_SERVER
          value: 'true'
        - name: FORGEJO__security__INSTALL_LOCK
          value: 'true'
        - name: FORGEJO__service__DISABLE_REGISTRATION
          value: 'true'
        - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
          value: 'true'
        - name: FORGEJO__service__ENABLE_NOTIFY_MAIL
          value: 'false'
        - name: FORGEJO__mailer__ENABLED
          value: 'false'
        - name: FORGEJO__actions__ENABLED
          value: 'false'
        - name: FORGEJO__packages__ENABLED
          value: 'false'
        - name: FORGEJO__repository__DEFAULT_PRIVATE
          value: private
        - name: FORGEJO__repository__FORCE_PRIVATE
          value: 'true'
        - name: FORGEJO__repository__DISABLE_HTTP_GIT
          value: 'false'
        - name: FORGEJO__repository__ENABLE_PUSH_CREATE_USER
          value: 'false'
        - name: FORGEJO__repository__ENABLE_PUSH_CREATE_ORG
          value: 'false'
        - name: FORGEJO__repository__DISABLED_REPO_UNITS
          value: repo.actions
        - name: FORGEJO__mirror__DEFAULT_INTERVAL
          value: 8h
        - name: FORGEJO__mirror__MIN_INTERVAL
          value: 1h
        - name: FORGEJO__migrations__ALLOWED_DOMAINS
          value: github.com,*.github.com
        - name: FORGEJO__migrations__ALLOW_LOCALNETWORKS
          value: 'false'
        - name: FORGEJO__webhook__ALLOWED_HOST_LIST
          value: ''
        - name: FORGEJO__log__MODE
          value: console
        - name: FORGEJO__log__LEVEL
          value: Info
        - name: GITEA_APP_INI
          value: /var/lib/gitea/custom/conf/app.ini
        - name: GITEA_CUSTOM
          value: /var/lib/gitea/custom
        - name: GITEA_WORK_DIR
          value: /var/lib/gitea
        envFrom:
        - secretRef:
            name: forgejo-keys
        volumeMounts:
        - name: data
          mountPath: /var/lib/gitea
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/healthz
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: http
          periodSeconds: 20
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: forgejo-data
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forgejo
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    tailscale.com/hostname: forgejo
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: forgejo
      port:
        number: 3000
  tls:
  - hosts:
    - forgejo
