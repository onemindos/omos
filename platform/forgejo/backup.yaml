apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-backup-coordinator
  namespace: forgejo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-volume-backup
  namespace: forgejo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-backup-coordinator
  namespace: forgejo
rules:
- apiGroups:
  - apps
  resources:
  - deployments/scale
  resourceNames:
  - forgejo
  verbs:
  - get
  - patch
- apiGroups:
  - volsync.backube
  resources:
  - replicationsources
  resourceNames:
  - forgejo-data
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-backup-coordinator
  namespace: forgejo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-backup-coordinator
subjects:
- kind: ServiceAccount
  name: forgejo-backup-coordinator
  namespace: forgejo
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  sourcePVC: forgejo-data
  paused: false
  trigger: {}
  restic:
    repository: forgejo-data-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: do-block-storage
    storageClassName: do-block-storage
    cacheStorageClassName: do-block-storage
    cacheCapacity: 1Gi
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 12
      yearly: 1
    moverServiceAccount: platform-volume-backup
    moverPodLabels:
      app: platform-volume-backup
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    moverResources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-coordinated-backup
  namespace: forgejo
spec:
  schedule: 20 15 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2280
      template:
        metadata:
          labels:
            app: forgejo-backup-coordinator
        spec:
          serviceAccountName: forgejo-backup-coordinator
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: coordinate
            image: python:3.13.11-alpine@sha256:2f607129b1b915a949320bf0c4831a73d1c1b1be663c2b1d8c93aa35a5f44a95
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            command:
            - python3
            - -B
            - /scripts/coordinated_backup.py
            resources:
              requests:
                cpu: 25m
                memory: 48Mi
              limits:
                cpu: 200m
                memory: 128Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          volumes:
          - name: scripts
            configMap:
              name: forgejo-backup-runtime
