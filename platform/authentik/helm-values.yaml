# Authentik 2025.x — OneMind OS IdP
# Shares cloudtak-postgis (PostgreSQL 17) — no Redis needed (removed 2025.4+)
# Secrets injected from ESO: authentik-env secret
#
# Required fields in 1Password item "authentik-env" (flat, no sections):
#   AUTHENTIK_SECRET_KEY      — 50+ char random string (openssl rand -base64 36)
#   AUTHENTIK_POSTGRESQL__PASSWORD  — password for authentik DB user
#   AUTHENTIK_EMAIL__PASSWORD — SMTP password if email is configured
#
# Bootstrap (run once):
#   kubectl exec -n cloudtak deploy/cloudtak-postgis -- \
#     psql -U postgres -c "CREATE USER authentik WITH PASSWORD '<pw>';"
#   kubectl exec -n cloudtak deploy/cloudtak-postgis -- \
#     psql -U postgres -c "CREATE DATABASE authentik OWNER authentik;"

authentik:
  secret_key:
    valueFrom:
      secretKeyRef:
        name: authentik-env
        key: AUTHENTIK_SECRET_KEY
  error_reporting:
    enabled: false
  disable_startup_analytics: true

postgresql:
  # Use existing CloudTAK PostgreSQL — no separate PG instance
  enabled: false

redis:
  # Not needed in Authentik 2025.4+
  enabled: false

server:
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "cloudtak-postgis.cloudtak.svc.cluster.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__USER
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_POSTGRESQL__PASSWORD
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_SECRET_KEY

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "cloudtak-postgis.cloudtak.svc.cluster.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__USER
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_POSTGRESQL__PASSWORD
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_SECRET_KEY

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
