# Authentik 2025.x — OneMind OS IdP
# Shares cloudtak-postgis (PostgreSQL 17) — no Redis needed (removed 2025.4+)
#
# Required fields in 1Password item "authentik-env" (flat, no sections):
#   AUTHENTIK_SECRET_KEY                — 50+ char random string
#   AUTHENTIK_POSTGRESQL__PASSWORD      — password for authentik DB user

authentik:
  # Do NOT set secret_key here — it conflicts with env var injection.
  # AUTHENTIK_SECRET_KEY is injected via server.env below.
  error_reporting:
    enabled: false
  disable_startup_analytics: true

postgresql:
  enabled: false

redis:
  # Not needed in Authentik 2025.4+
  enabled: false

server:
  env:
    - name: AUTHENTIK_WEB__FRAME_ANCESTORS
      value: "'self' https://onemindos.dev https://atoc.onemindos.dev"
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_SECRET_KEY
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "cloudtak-postgis.cloudtak.svc.cluster.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__USER
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_POSTGRESQL__PASSWORD

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_SECRET_KEY
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "cloudtak-postgis.cloudtak.svc.cluster.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__USER
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-env
          key: AUTHENTIK_POSTGRESQL__PASSWORD

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
