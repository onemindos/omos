apiVersion: v1
kind: Namespace
metadata:
  name: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/part-of: omos-platform
---
# Expose the embedded outpost proxy port (9300) separately.
# The main authentik-server Service only exposes 80/443 → 9000/9443.
# Forward Auth nginx subrequests must go to port 9300 where the proxy runs.
apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost
  namespace: authentik
spec:
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: authentik
    app.kubernetes.io/name: authentik
  ports:
    - name: outpost
      port: 9300
      targetPort: 9300
