apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtak-postgis
  namespace: cloudtak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudtak-postgis
  template:
    metadata:
      labels:
        app: cloudtak-postgis
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:17-3.4-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "gis"
            - name: POSTGRES_USER
              value: "docker"
            - name: POSTGRES_PASSWORD
              value: "docker"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: cloudtak-pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudtak-pgdata
  namespace: cloudtak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudtak-postgis
  namespace: cloudtak
spec:
  selector:
    app: cloudtak-postgis
  ports:
    - port: 5432
      targetPort: 5432
