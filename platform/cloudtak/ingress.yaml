apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtak-ingress
  namespace: cloudtak
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "cloudtak-api,onemind-ai-bridge"
spec:
  ingressClassName: nginx
  rules:
    - host: atoc.onemindos.dev
      http:
        paths:
          - path: /api/omos/ai
            pathType: Prefix
            backend:
              service:
                name: onemind-ai-bridge
                port:
                  number: 8080
          - path: /api/copilot
            pathType: Prefix
            backend:
              service:
                name: copilot-runtime
                port:
                  number: 4111
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-api
                port:
                  number: 5000
    - host: tiles.atoc.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-tiles
                port:
                  number: 5002
