apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtak-ingress
  namespace: cloudtak
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "cloudtak-api"
    # Only Cloudflare-proxied traffic accepted — blocks direct LB bypass
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
spec:
  ingressClassName: nginx
  rules:
    - host: onemindos.dev
      http:
        paths:
          - path: /api/copilot
            pathType: Prefix
            backend:
              service:
                name: copilot-runtime
                port:
                  number: 4111
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-api
                port:
                  number: 5000
    - host: atoc.onemindos.dev
      http:
        paths:
          - path: /api/copilot
            pathType: Prefix
            backend:
              service:
                name: copilot-runtime
                port:
                  number: 4111
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-api
                port:
                  number: 5000
    - host: tiles.atoc.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-tiles
                port:
                  number: 5002
    - host: tiles.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-tiles
                port:
                  number: 5002
