apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudtak-ingress
  namespace: cloudtak
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "cloudtak-api"
spec:
  ingressClassName: nginx
  rules:
    - host: cloudtak.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-api
                port:
                  number: 5000
    - host: tiles.cloudtak.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudtak-tiles
                port:
                  number: 5002
