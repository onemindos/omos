apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl-noaa-hazards
  namespace: cloudtak
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: python:3.12-slim
              command: ["python3", "/scripts/etl.py"]
              envFrom:
                - secretRef:
                    name: etl-noaa-hazards-secret
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: etl-noaa-hazards
