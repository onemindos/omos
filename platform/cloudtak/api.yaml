apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtak-api
  namespace: cloudtak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudtak-api
  template:
    metadata:
      labels:
        app: cloudtak-api
    spec:
      imagePullSecrets:
        - name: ghcr-onemindos
      containers:
        - name: api
          image: ghcr.io/onemindos/cloudtak-api:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex

              # --- Patch 1: index.js — align admin wsClients key to AdminConnConfig.id=0 ---
              sed -i "s/wsClients.get('admin')/wsClients.get('0')/g;
                      s/wsClients.set('admin',/wsClients.set('0',/g;
                      s/wsClients.delete('admin')/wsClients.delete('0')/g" \
                /home/etl/api/dist/index.js 2>/dev/null && \
                echo "patch1: index.js admin->0 applied" || \
                echo "patch1: sed failed (non-fatal)"

              # --- Patch 2: connection-pool.js — add AdminConnConfig CoT delivery path ---
              node -e "
              const fs = require('fs');
              const file = '/home/etl/api/dist/lib/connection-pool.js';
              let c = fs.readFileSync(file, 'utf8');
              const marker = '            if (conn instanceof MachineConnConfig && !this.config.nosinks) {';
              if (c.includes(marker) && !c.includes('instanceof AdminConnConfig')) {
                const adminBlock = '            if (conn instanceof AdminConnConfig) {\n' +
                  '                for (const [wsKey, clients] of (this.config.wsClients || new Map())) {\n' +
                  '                    if (String(wsKey) !== String(conn.id)) continue;\n' +
                  '                    for (const cot of cots) {\n' +
                  '                        CoTParser.to_geojson(cot).then(feat => {\n' +
                  '                            for (const client of clients) {\n' +
                  '                                client.ws.send(JSON.stringify(client.format === \"geojson\"\n' +
                  '                                    ? { type: \"cot\", connection: conn.id, data: feat }\n' +
                  '                                    : { type: \"cot\", connection: conn.id, data: cot.raw }));\n' +
                  '                            }\n' +
                  '                        }).catch(() => {});\n' +
                  '                    }\n' +
                  '                }\n' +
                  '            }\n';
                c = c.replace(marker, adminBlock + marker);
                fs.writeFileSync(file, c);
                console.log('patch2: connection-pool.js AdminConnConfig applied');
              } else if (c.includes('instanceof AdminConnConfig')) {
                console.log('patch2: already patched');
              } else {
                console.log('patch2: marker not found - skipping');
              }
              " 2>&1

              # --- Patch 3: login.js — extend session token from 16h to 30d ---
              sed -i "s/expiresIn: '16h'/expiresIn: '30d'/g" \
                /home/etl/api/dist/routes/login.js 2>/dev/null && \
                echo "patch3: token expiry 16h->30d applied" || \
                echo "patch3: sed failed (non-fatal)"

              # --- Patch 4: inject window.__ONEMIND_BRIDGE_URL__ into built HTML ---
              # Browser uses /onemind (same-origin path); nginx Patch 5 proxies to bridge pod.
              INJECT_SCRIPT="<script>window.__ONEMIND_BRIDGE_URL__='/onemind';</script>"
              # CloudTAK serves static files from api/web/dist/ (set in nginx.conf.js aliases)
              INDEX_HTML="/home/etl/api/web/dist/index.html"
              if [ -f "$INDEX_HTML" ]; then
                sed -i "s|</head>|${INJECT_SCRIPT}</head>|" "$INDEX_HTML" && \
                  echo "patch4: bridge URL injected into index.html" || \
                  echo "patch4: sed failed (non-fatal)"
              else
                echo "patch4: index.html not found at $INDEX_HTML (non-fatal)"
              fi

              # --- Replicate the original start script: generate nginx.conf, start nginx, start node ---
              cd /home/etl/api
              node nginx.conf.js > /etc/nginx/nginx.conf

              # --- Patch 5: inject /onemind proxy block into nginx.conf ---
              # Inserts before the /api location block so the browser plugin can reach
              # ws(s)://cloudtak.onemindos.dev/onemind/ws same-origin (no CORS needed).
              # Uses awk one-liner (single indented line) to stay inside YAML literal block.
              BRIDGE_URL="${CLOUDTAK_Config_onemind__bridge__url:-http://onemind-ai-bridge.hermes.svc.cluster.local:8080}"
              grep -q 'location /onemind/' /etc/nginx/nginx.conf && echo 'patch5: already patched' || \
                awk -v b="$BRIDGE_URL" '/^ +location ~ \^\/api/{printf "        location /onemind/ {\n            proxy_pass %s/;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_set_header Host $host;\n            proxy_read_timeout 60s;\n        }\n",b}{print}' \
                  /etc/nginx/nginx.conf > /tmp/nginx_patched.conf && \
                mv /tmp/nginx_patched.conf /etc/nginx/nginx.conf && \
                echo 'patch5: /onemind proxy injected'

              # --- Patch 6: allow framing from onemindos.dev + redirect /login to OIDC ---
              # Remove X-Frame-Options deny header and add CSP frame-ancestors so the
              # omos-ui iframe can embed CloudTAK. Also inject a /login location that
              # redirects straight to /api/login/oidc so users never see the native form.
              sed -i 's/add_header X-Frame-Options[^;]*;//g' /etc/nginx/nginx.conf 2>/dev/null || true
              grep -q 'location = /login' /etc/nginx/nginx.conf && echo 'patch6: already patched' || \
                awk '/^ +location ~ \^\/api/{printf "        location = /login {\n            return 302 /api/login/oidc;\n        }\n"}{print}' \
                  /etc/nginx/nginx.conf > /tmp/nginx_p6.conf && \
                mv /tmp/nginx_p6.conf /etc/nginx/nginx.conf && \
                echo 'patch6: /login->OIDC injected'

              nginx
              exec npm run prod
          ports:
            - containerPort: 5000
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: CLOUDTAK_Mode
              value: "docker-compose"
            # --- OneMind OS branding (sets login::name in CloudTAK settings DB) ---
            - name: CLOUDTAK_Config_login__name
              value: "OMOS ATOC"
            - name: CLOUDTAK_Config_server__name
              value: "OneMind OS"
            # --- AI bridge pod — Patch 5 nginx reverse-proxy uses this for /onemind/ location ---
            - name: CLOUDTAK_Config_onemind__bridge__url
              value: "http://onemind-ai-bridge.hermes.svc.cluster.local:8080"
            - name: EMBED_ORIGIN
              value: "https://onemindos.dev"
            # --- Authentik OIDC — single-sign-on with onemindos.dev shell ---
            # Users who land on cloudtak.onemindos.dev directly get OIDC login.
            # Users coming through /atoc/ (same-origin proxy) are pre-authed by
            # nginx Forward Auth and pass through transparently.
            - name: CLOUDTAK_Config_oidc__enabled
              value: "true"
            - name: CLOUDTAK_Config_oidc__discovery
              value: "https://auth.onemindos.dev/application/o/cloudtak/.well-known/openid-configuration"
            - name: CLOUDTAK_Config_oidc__client__id
              valueFrom:
                secretKeyRef:
                  name: cloudtak-secrets
                  key: OIDC_CLIENT_ID
            - name: CLOUDTAK_Config_oidc__client__secret
              valueFrom:
                secretKeyRef:
                  name: cloudtak-secrets
                  key: OIDC_CLIENT_SECRET
            - name: CLOUDTAK_Config_media_url
              value: "http://cloudtak-media:9997"
            - name: SigningSecret
              valueFrom:
                secretKeyRef:
                  name: cloudtak-secrets
                  key: SIGNING_SECRET
            - name: ASSET_BUCKET
              value: "cloudtak"
            - name: AWS_S3_Endpoint
              value: "http://cloudtak-minio:9000"
            - name: AWS_S3_AccessKeyId
              valueFrom:
                secretKeyRef:
                  name: cloudtak-secrets
                  key: AWS_S3_AccessKeyId
            - name: AWS_S3_SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: cloudtak-secrets
                  key: AWS_S3_SecretAccessKey
            - name: POSTGRES
              valueFrom:
                secretKeyRef:
                  name: cloudtak-secrets
                  key: POSTGRES
            - name: API_URL
              value: "https://cloudtak.onemindos.dev"
            - name: PMTILES_URL
              value: "https://tiles.cloudtak.onemindos.dev"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudtak-api
  namespace: cloudtak
spec:
  selector:
    app: cloudtak-api
  ports:
    - port: 5000
      targetPort: 5000
