apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudtak-secrets
  namespace: cloudtak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cloudtak-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cloudtak-secrets
