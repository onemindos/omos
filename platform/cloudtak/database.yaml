# Manual platform-cloudtak ownership: sync after shared CNPG health, current backup and the cloudtak role are verified.
# Isolated exact-image migration/startup evidence is recorded in README.md (2026-10-25).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: onemind-cloudtak
  namespace: onemind-data
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  name: cloudtak
  owner: cloudtak
  cluster:
    name: onemind-data
  databaseReclaimPolicy: retain
  extensions:
  - name: postgis
    ensure: present
