# Offline OSM query engine — find roads, bridges, buildings, trails in any AO
# Scaled to 0 by default; activate for mission planning or air-gapped ops.
# First start downloads North America PBF (~11GB) and indexes it (~100Gi).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overpass
  namespace: onetak
  labels:
    app: overpass
spec:
  replicas: 0
  selector:
    matchLabels:
      app: overpass
  template:
    metadata:
      labels:
        app: overpass
    spec:
      containers:
        - name: overpass
          image: wiktorn/overpass-api:latest
          ports:
            - containerPort: 80
          env:
            - name: OVERPASS_MODE
              value: "init"
            - name: OVERPASS_META
              value: "yes"
            - name: OVERPASS_PLANET_URL
              value: "https://download.geofabrik.de/north-america-latest.osm.pbf"
            - name: OVERPASS_DIFF_URL
              value: "https://download.geofabrik.de/north-america-updates/"
            - name: OVERPASS_RULES_LOAD
              value: "10"
            - name: OVERPASS_UPDATE_SLEEP
              value: "600"
          volumeMounts:
            - name: overpass-data
              mountPath: /db
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /api/interpreter?data=[out:json];node(1);out;
              port: 80
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 20
      volumes:
        - name: overpass-data
          persistentVolumeClaim:
            claimName: overpass-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overpass-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: overpass
  namespace: onetak
spec:
  selector:
    app: overpass
  ports:
    - port: 12345
      targetPort: 80
