# One-off metadata inspection for the phase-3 pilot. Remove after recording logs.
# All statements run in a read-only transaction; no catalog rows are read.
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-schema-inspect-20261018
  namespace: onetak
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: stac-schema-inspect
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inspect
          # Same digest as the existing STAC API's PostgreSQL client init container.
          image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - name: PGHOST
              value: onetak-geo-db.onetak.svc.cluster.local
            - name: PGDATABASE
              value: stac
            - name: PGUSER
              value: geo
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGOPTIONS
              value: -c default_transaction_read_only=on
          command:
            - sh
            - -ec
            - |
              psql -X -v ON_ERROR_STOP=1 <<'SQL'
              BEGIN READ ONLY;
              SELECT current_database(), current_user;
              SELECT name, setting FROM pg_settings
                WHERE name IN ('search_path', 'server_version', 'default_transaction_read_only')
                ORDER BY name;
              SELECT nspname FROM pg_namespace WHERE nspname = 'pgstac';
              SELECT n.nspname, p.proname, pg_get_function_identity_arguments(p.oid) AS arguments
                FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname IN ('pgstac', 'public')
                  AND p.proname IN ('search', 'collection_search', 'get_version')
                ORDER BY n.nspname, p.proname;
              SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'pgstac'
                ORDER BY tablename;
              SELECT extname, extversion FROM pg_extension ORDER BY extname;
              COMMIT;
              SQL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
