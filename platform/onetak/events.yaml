apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetak-events
  namespace: onetak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onetak-events
  template:
    metadata:
      labels:
        app: onetak-events
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: events
          image: ghcr.io/onemindos/onetak-events:latest
          env:
            - name: CLOUDTAK_Mode
              value: "docker-compose"
            - name: API_URL
              value: "http://onetak-api:5000"
            - name: SigningSecret
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: SIGNING_SECRET
            - name: ASSET_BUCKET
              value: "cloudtak"
            - name: AWS_S3_Endpoint
              value: "http://onetak-minio:9000"
            - name: AWS_S3_AccessKeyId
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: AWS_S3_AccessKeyId
            - name: AWS_S3_SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: AWS_S3_SecretAccessKey
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
