# Public ingress for geo analysis services accessed by OneTAK browser plugins.
# All routes are Cloudflare-proxied → ingress-nginx LB 143.244.220.155
#
# Add DNS A records (Cloudflare-proxied) pointing to 143.244.220.155:
#   valhalla.onemindos.dev
#   nominatim.onemindos.dev
#   overpass.onemindos.dev
#   tileserver.onemindos.dev
#   maputnik.onemindos.dev

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geo-services-ingress
  namespace: onetak
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
spec:
  ingressClassName: nginx
  rules:
    - host: valhalla.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: valhalla
                port:
                  number: 8002
    - host: nominatim.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nominatim
                port:
                  number: 8090
    - host: overpass.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: overpass
                port:
                  number: 12345
    - host: tileserver.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tileserver-gl
                port:
                  number: 8080
    - host: maputnik.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maputnik
                port:
                  number: 8088
