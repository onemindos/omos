apiVersion: apps/v1
kind: Deployment
metadata:
  name: martin
  namespace: onetak
  labels:
    app: martin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: martin
  template:
    metadata:
      labels:
        app: martin
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ['sh', '-c', 'until pg_isready -h onetak-geo-db -U geo; do sleep 2; done']
      containers:
        - name: martin
          image: ghcr.io/maplibre/martin:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onetak-tile-db-url
                  key: TILE_DB_URL
            - name: MARTIN_KEEP_ALIVE
              value: "75"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: martin
  namespace: onetak
spec:
  selector:
    app: martin
  ports:
    - port: 3000
      targetPort: 3000
