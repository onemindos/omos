apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetak-api
  namespace: onetak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onetak-api
  template:
    metadata:
      labels:
        app: onetak-api
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: api
          image: ghcr.io/onemindos/onetak-api:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: CLOUDTAK_Mode
              value: "docker-compose"
            - name: CLOUDTAK_Config_login__name
              value: "OMOS ATOC"
            - name: CLOUDTAK_Config_server__name
              value: "OneMind OS"
            - name: CLOUDTAK_Config_onemind__bridge__url
              value: "http://onemind-ai-bridge.hermes.svc.cluster.local:8080"
            - name: EMBED_ORIGIN
              value: "https://onemindos.dev"
            - name: CLOUDTAK_Config_oidc__enabled
              value: "false"
            - name: CLOUDTAK_Config_media_url
              value: "http://onetak-media:9997"
            - name: SigningSecret
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: SIGNING_SECRET
            - name: ASSET_BUCKET
              value: "cloudtak"
            - name: AWS_S3_Endpoint
              value: "http://onetak-minio:9000"
            - name: AWS_S3_AccessKeyId
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: AWS_S3_AccessKeyId
            - name: AWS_S3_SecretAccessKey
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: AWS_S3_SecretAccessKey
            - name: POSTGRES
              valueFrom:
                secretKeyRef:
                  name: onetak-postgres-creds
                  key: POSTGRES_DSN
            - name: API_URL
              value: "https://onemindos.dev"
            - name: PMTILES_URL
              value: "https://tiles.onemindos.dev"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onetak-api
  namespace: onetak
spec:
  selector:
    app: onetak-api
  ports:
    - port: 5000
      targetPort: 5000
