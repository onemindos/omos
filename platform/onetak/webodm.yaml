# WebODM — Drone photogrammetry pipeline: images → orthomosaic → GeoTIFF/KML
# All scaled to 0 by default. Activate for post-flight processing.
# Architecture: webodm-db (postgres) + broker (redis) + webodm (webapp+worker) + nodeodm (processor)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webodm-db
  namespace: onetak
  labels:
    app: webodm-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webodm-db
  template:
    metadata:
      labels:
        app: webodm-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      initContainers:
        - name: fix-perms
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sh", "-c", "mkdir -p /data/pgdata && chmod 700 /data/pgdata"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: webodm-db-data
              mountPath: /data
      containers:
        - name: webodm-db
          image: webodm/webodm_db@sha256:03f18ec0089325ec2b8975ba1781277bcdc212b6d86c9de33f6409d313e90430
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: webodm-db-data
              mountPath: /var/lib/postgresql/data
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: webodm-db-data
          persistentVolumeClaim:
            claimName: webodm-db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webodm-db-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webodm-db
  namespace: onetak
spec:
  selector:
    app: webodm-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webodm-broker
  namespace: onetak
  labels:
    app: webodm-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webodm-broker
  template:
    metadata:
      labels:
        app: webodm-broker
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: broker
          image: redis:7.0.10
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: onetak
spec:
  selector:
    app: webodm-broker
  ports:
    - port: 6379
      targetPort: 6379
---
# webapp + worker share a pod so both access the media PVC without RWO conflict
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webodm
  namespace: onetak
  labels:
    app: webodm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webodm
  template:
    metadata:
      labels:
        app: webodm
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: webapp
          image: webodm/webodm_webapp@sha256:875cf97ee3278d9dfc517feba862ebe83aae1ccf76c398de96e993402f181659
          command: ["/bin/bash", "-c"]
          args:
            - "service cron start && chmod +x /webodm/*.sh && /webodm/wait-for-postgres.sh webodm-db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh"
          ports:
            - containerPort: 8000
          env:
            - name: WO_DATABASE_HOST
              value: "webodm-db"
            - name: WO_PORT
              value: "8000"
            - name: WO_HOST
              value: "0.0.0.0"
            - name: WO_DEBUG
              value: "NO"
            - name: WO_BROKER
              value: "redis://broker:6379"
            - name: WO_DEFAULT_NODES
              value: "1"
            - name: WO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-secrets
                  key: SUPERSET_SECRET_KEY
          volumeMounts:
            - name: webodm-media
              mountPath: /webodm/app/media
          # 2026-09-28: request/limits + widened after final OOMKilled — rebatting following final-2 depleted on extraction
          # Measured usage (webapp+worker, total 1789Mi; webapp share ~894Mi). Final OOM was perkouting at 1024Mi.
          resources:
            requests:
              cpu: 50m
              memory: 768Mi        # ~90% of measured usage (894Mi)
            limits:
              cpu: "3"
              memory: 2Gi       # ~usage + 25% headroom
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 6
        - name: worker
          image: webodm/webodm_webapp@sha256:875cf97ee3278d9dfc517feba862ebe83aae1ccf76c398de96e993402f181659
          command: ["/bin/bash", "-c"]
          args:
            - "/webodm/wait-for-postgres.sh webodm-db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/wait-for-it.sh -t 0 localhost:8000 -- /webodm/worker.sh start"
          env:
            - name: WO_DATABASE_HOST
              value: "webodm-db"
            - name: WO_BROKER
              value: "redis://broker:6379"
            - name: WO_DEBUG
              value: "NO"
            - name: WO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-secrets
                  key: SUPERSET_SECRET_KEY
          volumeMounts:
            - name: webodm-media
              mountPath: /webodm/app/media
          # 2026-09-28: requests/limits adjusted to actual pod usage (92% node imbalance)
          # Measured usage (webapp+worker, total 1789Mi; worker share ~895Mi).
          resources:
            requests:
              cpu: 50m
              memory: 537Mi        # ~60% of measured usage (895Mi)
            limits:
              cpu: "4"
              memory: 1024Mi       # ~usage + ~14% headroom
      volumes:
        - name: webodm-media
          persistentVolumeClaim:
            claimName: webodm-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webodm-media
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webodm
  namespace: onetak
spec:
  selector:
    app: webodm
  ports:
    - port: 8000
      targetPort: 8000
---
# NodeODM — CPU-heavy photogrammetry worker; scale replicas up per concurrent flight
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeodm
  namespace: onetak
  labels:
    app: nodeodm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nodeodm
  template:
    metadata:
      labels:
        app: nodeodm
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: nodeodm
          image: opendronemap/nodeodm:3.6.2@sha256:fcd99eb23d8db194a7d1dc95f029f518283b3d6be32dd64422395f4e7af56720
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: nodeodm-data
              mountPath: /var/www/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /info
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: nodeodm-data
          persistentVolumeClaim:
            claimName: nodeodm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodeodm-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nodeodm
  namespace: onetak
spec:
  selector:
    app: nodeodm
  ports:
    - port: 3000
      targetPort: 3000
