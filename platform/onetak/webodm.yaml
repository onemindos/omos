# WebODM — Drone photogrammetry pipeline: images → orthomosaic → GeoTIFF/KML
# All scaled to 0 by default. Activate for post-flight processing.
# Architecture: webodm-db (postgres) + broker (redis) + webodm (webapp+worker) + nodeodm (processor)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webodm-db
  namespace: onetak
  labels:
    app: webodm-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webodm-db
  template:
    metadata:
      labels:
        app: webodm-db
    spec:
      initContainers:
        - name: fix-perms
          image: busybox
          command: ["sh", "-c", "mkdir -p /data/pgdata && chmod 700 /data/pgdata"]
          volumeMounts:
            - name: webodm-db-data
              mountPath: /data
      containers:
        - name: webodm-db
          image: webodm/webodm_db:latest
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: webodm-db-data
              mountPath: /var/lib/postgresql/data
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: webodm-db-data
          persistentVolumeClaim:
            claimName: webodm-db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webodm-db-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webodm-db
  namespace: onetak
spec:
  selector:
    app: webodm-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webodm-broker
  namespace: onetak
  labels:
    app: webodm-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webodm-broker
  template:
    metadata:
      labels:
        app: webodm-broker
    spec:
      containers:
        - name: broker
          image: redis:7.0.10
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: onetak
spec:
  selector:
    app: webodm-broker
  ports:
    - port: 6379
      targetPort: 6379
---
# webapp + worker share a pod so both access the media PVC without RWO conflict
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webodm
  namespace: onetak
  labels:
    app: webodm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webodm
  template:
    metadata:
      labels:
        app: webodm
    spec:
      containers:
        - name: webapp
          image: webodm/webodm_webapp:latest
          command: ["/bin/bash", "-c"]
          args:
            - "service cron start && chmod +x /webodm/*.sh && /webodm/wait-for-postgres.sh webodm-db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh"
          ports:
            - containerPort: 8000
          env:
            - name: WO_DATABASE_HOST
              value: "webodm-db"
            - name: WO_PORT
              value: "8000"
            - name: WO_HOST
              value: "0.0.0.0"
            - name: WO_DEBUG
              value: "NO"
            - name: WO_BROKER
              value: "redis://broker:6379"
            - name: WO_DEFAULT_NODES
              value: "1"
            - name: WO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-secrets
                  key: SUPERSET_SECRET_KEY
          volumeMounts:
            - name: webodm-media
              mountPath: /webodm/app/media
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 6
        - name: worker
          image: webodm/webodm_webapp:latest
          command: ["/bin/bash", "-c"]
          args:
            - "/webodm/wait-for-postgres.sh webodm-db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/wait-for-it.sh -t 0 localhost:8000 -- /webodm/worker.sh start"
          env:
            - name: WO_DATABASE_HOST
              value: "webodm-db"
            - name: WO_BROKER
              value: "redis://broker:6379"
            - name: WO_DEBUG
              value: "NO"
            - name: WO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-secrets
                  key: SUPERSET_SECRET_KEY
          volumeMounts:
            - name: webodm-media
              mountPath: /webodm/app/media
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: webodm-media
          persistentVolumeClaim:
            claimName: webodm-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webodm-media
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: webodm
  namespace: onetak
spec:
  selector:
    app: webodm
  ports:
    - port: 8000
      targetPort: 8000
---
# NodeODM — CPU-heavy photogrammetry worker; scale replicas up per concurrent flight
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeodm
  namespace: onetak
  labels:
    app: nodeodm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodeodm
  template:
    metadata:
      labels:
        app: nodeodm
    spec:
      containers:
        - name: nodeodm
          image: opendronemap/nodeodm:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: nodeodm-data
              mountPath: /var/www/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /info
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: nodeodm-data
          persistentVolumeClaim:
            claimName: nodeodm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodeodm-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nodeodm
  namespace: onetak
spec:
  selector:
    app: nodeodm
  ports:
    - port: 3000
      targetPort: 3000
