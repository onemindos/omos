apiVersion: apps/v1
kind: Deployment
metadata:
  name: tak-portal
  namespace: onetak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tak-portal
  template:
    metadata:
      labels:
        app: tak-portal
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: portal
          image: ghcr.io/onemindos/tak-portal@sha256:eaa1472927823165df82c715c9cd77da36c5d503f75c4172d1215c679fe27f6b
          ports:
            - containerPort: 8080
          env:
            - name: TAK_HOST
              value: "tak.tail717ba0.ts.net"
            - name: TAK_PORT
              value: "8089"
            - name: PORTAL_URL
              value: "https://enroll.tail717ba0.ts.net"
            - name: CA_CERT_PATH
              value: "/certs/ca.pem"
            - name: CA_KEY_PATH
              value: "/certs/ca.key"
            - name: CA_KEY_PASS
              value: ""
          volumeMounts:
            - name: ca-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ca-certs
          secret:
            secretName: tak-portal-ca-certs
---
apiVersion: v1
kind: Service
metadata:
  name: tak-portal
  namespace: onetak
spec:
  selector:
    app: tak-portal
  ports:
    - port: 8080
      targetPort: 8080
