apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetak-minio
  namespace: onetak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onetak-minio
  template:
    metadata:
      labels:
        app: onetak-minio
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: minio
          # docker.io/minio/minio no longer exists (404) and quay.io/minio requires auth.
          # bitnamilegacy ships the SAME MinIO release (2024-08-17), so on-disk data is
          # unchanged. It is unmaintained: replace in a follow-up (see PR description).
          image: docker.io/bitnamilegacy/minio:2024.8.17@sha256:7b75a4b796941a835b4ab5719e09eb4a621a4e78f6165058c55537fca660554d
          command: ["sh", "-c", "mkdir -p /data/cloudtak && exec minio server /data --console-address ':9002'"]
          # The bitnami image defaults to uid 1001; existing /data was written by the
          # upstream image as root.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - containerPort: 9000
            - containerPort: 9002
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_DEFAULT_BUCKETS
              value: "cloudtak"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onetak-minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onetak-minio-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onetak-minio
  namespace: onetak
spec:
  selector:
    app: onetak-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9002
      targetPort: 9002
