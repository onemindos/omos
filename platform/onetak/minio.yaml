apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetak-minio
  namespace: onetak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onetak-minio
  template:
    metadata:
      labels:
        app: onetak-minio
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-08-17T01-24-54Z
          command: ["sh", "-c", "mkdir -p /data/cloudtak && /usr/bin/minio server /data --console-address ':9002'"]
          ports:
            - containerPort: 9000
            - containerPort: 9002
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onetak-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_DEFAULT_BUCKETS
              value: "cloudtak"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onetak-minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onetak-minio-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onetak-minio
  namespace: onetak
spec:
  selector:
    app: onetak-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9002
      targetPort: 9002
