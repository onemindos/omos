# DRAFT (not merged until Zeus decides): canary releases for tak-portal with Argo Rollouts.
# The Rollout takes over the existing Deployment through workloadRef, so the Deployment
# template stays the single source of the pod spec. ingress-nginx splits traffic between
# the stable and canary Services, and the AnalysisTemplate aborts the release and rolls
# back automatically if the canary's 5xx ratio rises.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: tak-portal
  namespace: onetak
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tak-portal
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tak-portal
    scaleDown: progressively
  strategy:
    canary:
      stableService: tak-portal
      canaryService: tak-portal-canary
      trafficRouting:
        nginx:
          stableIngress: tak-portal-ingress
      analysis:
        templates:
          - templateName: tak-portal-error-rate
        startingStep: 1
      steps:
        - setWeight: 20
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 5m}
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: tak-portal-canary
  namespace: onetak
spec:
  selector:
    app: tak-portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tak-portal-error-rate
  namespace: onetak
spec:
  metrics:
    - name: canary-5xx-ratio
      interval: 1m
      failureLimit: 2
      # Abort if more than 5% of canary requests return 5xx. Needs ingress-nginx metrics
      # (enabled in platform/values/ingress-nginx.yaml in this PR).
      successCondition: len(result) == 0 || result[0] < 0.05
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(nginx_ingress_controller_requests{exported_namespace="onetak",canary!="",status=~"5.."}[2m]))
            /
            sum(rate(nginx_ingress_controller_requests{exported_namespace="onetak",canary!=""}[2m]))
