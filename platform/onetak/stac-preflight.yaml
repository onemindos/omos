# One-off read-only metadata preflight for the phase-3 STAC investigation.
# No application rows, mutations, retries, API tokens, or storage are involved.
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-preflight-20261018
  namespace: onetak
  labels:
    app: stac-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: stac-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          # Same pinned digest as the completed 2026-10-18 STAC inspection Job.
          image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - name: PGHOST
              value: onetak-geo-db.onetak.svc.cluster.local
            - name: PGUSER
              value: geo
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGOPTIONS
              value: -c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=3000
          command:
            - sh
            - -ec
            - |
              for stac_db in geo stac; do
                echo "### database=${stac_db}"
                psql -X -v ON_ERROR_STOP=1 --dbname="${stac_db}" <<'SQL'
                BEGIN READ ONLY;
                SELECT current_database() AS database,
                       current_user AS connected_role,
                       current_setting('server_version', true) AS server_version,
                       current_setting('default_transaction_read_only', true) AS default_read_only,
                       current_setting('transaction_read_only', true) AS transaction_read_only,
                       current_setting('search_path', true) AS search_path;
                SELECT datname,
                       pg_get_userbyid(datdba) AS owner,
                       pg_size_pretty(pg_database_size(datname)) AS size
                  FROM pg_database
                 WHERE datname IN ('geo', 'stac')
                 ORDER BY datname;
                SELECT rolname, rolsuper, rolcreatedb, rolcreaterole
                  FROM pg_roles
                 WHERE rolname IN ('geo', 'pgstac_admin', 'pgstac_read', 'pgstac_ingest')
                 ORDER BY rolname;
                WITH wanted(extname) AS (
                  VALUES ('postgis'), ('btree_gist'), ('pg_trgm'), ('unaccent')
                )
                SELECT w.extname,
                       e.extversion AS installed_version,
                       a.default_version AS available_default_version
                  FROM wanted w
                  LEFT JOIN pg_available_extensions a ON a.name = w.extname
                  LEFT JOIN pg_extension e ON e.extname = w.extname
                 ORDER BY w.extname;
                SELECT extname, extversion
                  FROM pg_extension
                 ORDER BY extname;
                SELECT n.nspname AS schema_name,
                       count(r.oid) AS relation_count
                  FROM pg_namespace n
                  LEFT JOIN pg_class r ON r.relnamespace = n.oid
                                     AND r.relkind IN ('r', 'p', 'v', 'm', 'f')
                 WHERE n.nspname NOT LIKE 'pg\_%'
                   AND n.nspname <> 'information_schema'
                 GROUP BY n.nspname
                 ORDER BY n.nspname;
                SELECT schemaname, tablename
                  FROM pg_tables
                 WHERE schemaname IN ('public', 'pgstac')
                 ORDER BY schemaname, tablename;
                SELECT n.nspname AS schema_name,
                       p.proname AS function_name,
                       pg_get_function_identity_arguments(p.oid) AS arguments,
                       pg_get_function_result(p.oid) AS result_type
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname IN ('pgstac', 'public')
                   AND p.proname IN ('search', 'collection_search', 'get_version')
                 ORDER BY n.nspname, p.proname, arguments;
                COMMIT;
              SQL
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
