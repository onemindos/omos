apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: onetak
  labels:
    app: valhalla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valhalla
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      initContainers:
        - name: download-pbf
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              if [ -f /custom_files/valhalla_tiles.tar ] || [ -f /custom_files/north-america.osm.pbf ]; then
                echo "PBF or tiles already present, skipping download.";
                exit 0;
              fi
              apk add --no-cache wget
              echo "Downloading North America PBF (~11GB)..."
              wget -q --show-progress -O /custom_files/north-america.osm.pbf https://download.geofabrik.de/north-america-latest.osm.pbf
              echo "Download complete: $(du -sh /custom_files/north-america.osm.pbf)"
          volumeMounts:
            - name: valhalla-data
              mountPath: /custom_files
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      containers:
        - name: valhalla
          image: valhalla/valhalla:run-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          command:
            - sh
            - -c
            - |
              set -e
              DATA=/custom_files
              if [ ! -f "$DATA/valhalla.json" ]; then
                echo "Building valhalla config..."
                valhalla_build_config \
                  --mjolnir-tile-dir "$DATA/valhalla_tiles" \
                  --mjolnir-tile-extract "$DATA/valhalla_tiles.tar" \
                  --mjolnir-timezone "$DATA/timezones.sqlite" \
                  --mjolnir-admin "$DATA/admins.sqlite" \
                  > "$DATA/valhalla.json"
              fi
              if [ ! -d "$DATA/valhalla_tiles" ] && [ ! -f "$DATA/valhalla_tiles.tar" ]; then
                echo "Building tiles from PBF (this takes several hours for North America)..."
                valhalla_build_tiles -c "$DATA/valhalla.json" "$DATA/north-america.osm.pbf"
                echo "Tile build complete."
              fi
              echo "Starting valhalla service..."
              exec valhalla_service "$DATA/valhalla.json" 1
          env:
            - name: server_threads
              value: "2"
          volumeMounts:
            - name: valhalla-data
              mountPath: /custom_files
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /status
              port: 8002
            initialDelaySeconds: 14400
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: valhalla-data
          persistentVolumeClaim:
            claimName: valhalla-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valhalla-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: onetak
spec:
  selector:
    app: valhalla
  ports:
    - port: 8002
      targetPort: 8002
