apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: onetak
  labels:
    app: valhalla
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valhalla
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      initContainers:
        - name: download-pbf
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              if [ -f /data/valhalla_tiles.tar ] || [ -f /data/north-america.osm.pbf ]; then
                echo "PBF or tiles already present, skipping download.";
                exit 0;
              fi
              apk add --no-cache wget
              echo "Downloading North America PBF (~11GB)..."
              wget -q --show-progress -O /data/north-america.osm.pbf https://download.geofabrik.de/north-america-latest.osm.pbf
              echo "Download complete: $(du -sh /data/north-america.osm.pbf)"
          volumeMounts:
            - name: valhalla-data
              mountPath: /custom_files
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      containers:
        - name: valhalla
          image: valhalla/valhalla:run-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: use_tiles_ignore_pbf
              value: "False"
            - name: build_admins
              value: "True"
            - name: build_time_zones
              value: "True"
            - name: server_threads
              value: "2"
          volumeMounts:
            - name: valhalla-data
              mountPath: /custom_files
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /status
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: valhalla-data
          persistentVolumeClaim:
            claimName: valhalla-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valhalla-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: onetak
spec:
  selector:
    app: valhalla
  ports:
    - port: 8002
      targetPort: 8002
