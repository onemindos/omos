apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetak-postgis
  namespace: onetak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onetak-postgis
  template:
    metadata:
      labels:
        app: onetak-postgis
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: postgis
          image: postgis/postgis:17-3.4-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "gis"
            - name: POSTGRES_USER
              value: "docker"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onetak-postgres-creds
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: onetak-pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onetak-pgdata
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onetak-postgis
  namespace: onetak
spec:
  selector:
    app: onetak-postgis
  ports:
    - port: 5432
      targetPort: 5432
