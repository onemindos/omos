# Map style editor — design TAK basemap styles (tactical dark, topo, field colors)
# Export style.json → use as MapLibre style in OneTAK UI
# Scaled to 0 by default; activate when designing map styles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maputnik
  namespace: onetak
  labels:
    app: maputnik
spec:
  replicas: 0
  selector:
    matchLabels:
      app: maputnik
  template:
    metadata:
      labels:
        app: maputnik
    spec:
      containers:
        - name: maputnik
          image: maputnik/editor:latest
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maputnik
  namespace: onetak
spec:
  selector:
    app: maputnik
  ports:
    - port: 8088
      targetPort: 8888
