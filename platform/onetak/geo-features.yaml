apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-featureserv
  namespace: onetak
  labels:
    app: pg-featureserv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-featureserv
  template:
    metadata:
      labels:
        app: pg-featureserv
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ['sh', '-c', 'until pg_isready -h onetak-geo-db -U geo; do sleep 2; done']
      containers:
        - name: pg-featureserv
          image: pramsey/pg_featureserv:latest
          ports:
            - containerPort: 9000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: onetak-tile-db-url
                  key: TILE_DB_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pg-featureserv
  namespace: onetak
spec:
  selector:
    app: pg-featureserv
  ports:
    - port: 9000
      targetPort: 9000
