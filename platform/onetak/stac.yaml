apiVersion: apps/v1
kind: Deployment
metadata:
  name: stac-api
  namespace: onetak
  labels:
    app: stac-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stac-api
  template:
    metadata:
      labels:
        app: stac-api
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ['sh', '-c', 'until pg_isready -h onetak-geo-db -U geo; do sleep 2; done']
      containers:
        - name: stac-api
          image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_USER
              value: "geo"
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST_READER
              value: "onetak-geo-db.onetak.svc.cluster.local"
            - name: POSTGRES_HOST_WRITER
              value: "onetak-geo-db.onetak.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DBNAME
              value: "stac"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8080"
            - name: RELOAD
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_mgmt/ping
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stac-api
  namespace: onetak
spec:
  selector:
    app: stac-api
  ports:
    - port: 8082
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stac-browser
  namespace: onetak
  labels:
    app: stac-browser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stac-browser
  template:
    metadata:
      labels:
        app: stac-browser
    spec:
      containers:
        - name: stac-browser
          image: ghcr.io/radiantearth/stac-browser:latest
          ports:
            - containerPort: 8080
          env:
            - name: CATALOG_URL
              value: "http://stac-api:8082"
            - name: STAC_BROWSER_TITLE
              value: "OneTAK — Imagery Catalog"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stac-browser
  namespace: onetak
spec:
  selector:
    app: stac-browser
  ports:
    - port: 8085
      targetPort: 8080
