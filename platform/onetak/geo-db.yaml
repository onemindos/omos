apiVersion: apps/v1
kind: Deployment
metadata:
  name: onetak-geo-db
  namespace: onetak
  labels:
    app: onetak-geo-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onetak-geo-db
  template:
    metadata:
      labels:
        app: onetak-geo-db
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: timescaledb
          image: timescale/timescaledb-ha:pg17-ts2.29-all
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "geo"
            - name: POSTGRES_USER
              value: "geo"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onetak-geo-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: PATRONI_SCOPE
              value: "onetak-geo-db"
            - name: PGBACKREST_STANZA
              value: ""
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "geo", "-d", "geo"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "geo", "-d", "geo"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: onetak-geo-db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onetak-geo-db-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: onetak-geo-db
  namespace: onetak
spec:
  selector:
    app: onetak-geo-db
  ports:
    - port: 5432
      targetPort: 5432
