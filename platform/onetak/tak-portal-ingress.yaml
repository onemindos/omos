apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tak-portal-ingress
  namespace: onetak
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: enroll.onemindos.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tak-portal
                port:
                  number: 8080
