# TAK Portal (device enrollment) -- tailnet only: https://enroll.tail717ba0.ts.net
#
# Replaces the public nginx Ingress for enroll.onemindos.dev (open to the internet, no
# auth). The Tailscale operator creates a tailnet node `enroll` and terminates TLS with a
# tailnet certificate; it forwards plain HTTP to tak-portal:8080. Enrollment QR codes
# point at PORTAL_URL (platform/onetak/tak-portal.yaml), so a phone must be on Tailscale
# to scan and download the package.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tak-portal-ingress
  namespace: onetak
  annotations:
    tailscale.com/hostname: enroll
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: tak-portal
      port:
        number: 8080
  tls:
    - hosts: [enroll]
