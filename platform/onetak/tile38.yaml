apiVersion: apps/v1
kind: Deployment
metadata:
  name: tile38
  namespace: onetak
  labels:
    app: tile38
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tile38
  template:
    metadata:
      labels:
        app: tile38
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: doks.digitalocean.com/node-pool
                    operator: In
                    values:
                      - onemind-ecosystem-cpu
      containers:
        - name: tile38
          image: tile38/tile38@sha256:5b61c6f3b32e508bf447b61b53320b3e524a6d9679782730fd8c930451b53e36
          ports:
            - containerPort: 9851
              name: tile38
          args:
            - tile38-server
            - -d
            - /data
            - -h
            - "0.0.0.0"
          env:
            - name: NATS_URL
              value: "nats://nats.nats.svc.cluster.local:4222"
          volumeMounts:
            - name: tile38-data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 9851
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tile38-data
          persistentVolumeClaim:
            claimName: tile38-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tile38-data
  namespace: onetak
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tile38
  namespace: onetak
spec:
  selector:
    app: tile38
  ports:
    - port: 9851
      targetPort: 9851
      name: tile38
