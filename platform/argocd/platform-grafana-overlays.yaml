# platform-grafana-overlays: Grafana datasource + dashboard ConfigMaps
#
# Covers: platform/grafana/
#   - grafana-datasources.yaml        (Loki + Tempo datasources)
#   - grafana-dashboards-nats.yaml    (NATS observability dashboard)
#   - grafana-dashboards-onemind-logs.yaml  (OneMind logs dashboard)
#
# These ConfigMaps are picked up by the Grafana sidecar for live provisioning.
# The Grafana Helm release (platform/values/) is NOT managed here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-grafana-overlays
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/grafana
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
