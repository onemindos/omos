# ─────────────────────────────────────────────────────────────────────────────
# LAYER 4 — OPS TOOLBOX                                          sync-wave: "4"
# ─────────────────────────────────────────────────────────────────────────────
# platform-nats-tools: NATS debug and monitoring UI toolbox
#
# Covers: platform/nats-tools/
#   nats-dashboard/  — NATS server metrics dashboard
#   nats-ui/         — NATS message browser
#   agent-web-ui/    — Agent interaction web UI
#   natscope/        — Subject traffic inspector
#   heynats/         — NATS CLI web wrapper
#   cobra-nats/      — NATS debug console
#   nui/             — NATS UI alternative
#   gastbob-nats-ui/ — Gastbob NATS dashboard
#
# These are ops/debug tools — not production data path services.
# All connect directly to nats.nats.svc.cluster.local:4222.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nats-tools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/nats-tools
    directory:
      recurse: true
      exclude: "*.secret*,*.env,Dockerfile"
  destination:
    server: https://kubernetes.default.svc
    namespace: nats-tools
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
