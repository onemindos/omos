# Owner-approved batch deployment; activate after sealing account credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-beeper-bridges
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/beeper-bridges
  destination:
    server: https://kubernetes.default.svc
    namespace: beeper-bridges
  # Deliberately manual: the approved batch still needs real sealed credentials.
  # app-of-apps owns this Application; no imperative workload bootstrap is used.
  syncPolicy:
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
