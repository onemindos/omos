# platform-observability: ClickHouse + observability overlays
#
# Covers:
#   platform/clickhouse/
#
# NOTE: Grafana, Loki, Tempo, and Prometheus stacks are managed via Helm
# (platform/values/loki.yaml, tempo.yaml, etc.) and are NOT managed here.
# This Application handles only post-Helm overlay manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/onemindos/omos-infra.git
      targetRevision: HEAD
      path: platform/clickhouse
      directory:
        recurse: false
        exclude: "*.sql,README.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: clickhouse.altinity.com
      kind: ClickHouseInstallation
      jsonPointers:
        - /status
