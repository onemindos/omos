apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openchoreo-logs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: ghcr.io/openchoreo/helm-charts
    chart: observability-logs-opensearch
    targetRevision: 0.6.0
    helm:
      releaseName: openchoreo-logs
      valueFiles:
      - $values/platform/openchoreo/observability/logs-values.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-observability-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - ServerSideApply=true
---
