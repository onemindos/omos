apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/forgejo
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
