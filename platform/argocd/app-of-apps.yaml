# App-of-Apps: syncs platform/argocd/ itself.
# Apply this once manually; it then manages all other Applications.
#
#   kubectl apply -f platform/argocd/app-of-apps.yaml
#
# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE — Layered sync waves (lower wave = deployed first)
#
#  Wave 0 │ CORE        platform-core            networking, certs, secrets, tunnel
#  Wave 1 │ BUS         platform-nats            NATS 3-node HA + streams
#         │ OPERATORS   platform-clickhouse-op   Altinity ClickHouse Operator
#  Wave 2 │ TAK         platform-onetak          OneTAK API/Events/Media/Tiles
#         │             platform-takserver       TAK Server overlay (LB, NATS leaf, config)
#         │             platform-takml           TAK ML vision pipeline (inference → CoT)
#         │ AUTH        platform-auth-infra      Authentik Postgres + Redis + ingress + secret
#  Wave 3 │ AI          platform-legacy          Hermes AI agent + copilot bridge
#         │ DATA        platform-observability   ClickHouse (Altinity)
#         │             platform-redpanda        Redpanda Connect pipelines
#         │ SERVICES    platform-omos            tak-projector, feeds, mission-engine
#         │ GEO         platform-geo             STAC, Tile38, geospatial stack
#         │ AUTH        platform-auth-helm       Authentik IdP (EUD enrollment, LDAP for TAK)
#  Wave 4 │ OPS         platform-nats-tools      NATS debug toolbox (agenttap, heynats, nats-dashboard)
#         │             platform-monitoring      Grafana, Prometheus, alerting
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/argocd
    directory:
      recurse: false
      exclude: "app-of-apps.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
