# App-of-Apps: syncs platform/argocd/ itself.
# Apply this once manually; it then manages all other Applications.
#
#   kubectl apply -f platform/argocd/app-of-apps.yaml
#
# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE — Layered sync waves (lower wave = deployed first)
#
#  Wave 0 │ CORE        platform-core            networking, certs, secrets, tunnel
#  Wave 1 │ BUS         platform-nats            NATS 3-node HA + streams
#         │ OPERATORS   platform-clickhouse-op   Altinity ClickHouse Operator
#  Wave 2 │ TAK         platform-cloudtak        CloudTAK API/Events/Media/Tiles
#         │             tak-server               TAK Server deploy overlays
#  Wave 3 │ AI          platform-hermes          Legacy/Hermes AI agent + bridge
#         │ DATA        platform-data            ClickHouse + Redpanda Connect
#         │ SERVICES    platform-omos            tak-projector, feeds, mission-engine
#         │ INTEL       platform-intel           OSINT services
#         │ GEO         platform-geo             STAC, Tile38, geospatial
#  Wave 4 │ OPS         platform-nats-tools      NATS debug toolbox
#         │             platform-monitoring      Grafana, alerting, surveyor
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/argocd
    directory:
      recurse: false
      exclude: "app-of-apps.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
