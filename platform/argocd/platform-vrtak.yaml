# VRTAK distribution server — nginx file server for native build downloads.
# Serves Win64 ZIP + Quest 3 APK from https://vrtak.onemindos.dev
#
# BEFORE FIRST USE — upload VRTAK builds to the PVC:
#   kubectl cp vrtak-win64.zip vrtak/vrtak-releases-<pod>:/srv/releases/latest/
#   kubectl cp vrtak-quest3.apk vrtak/vrtak-releases-<pod>:/srv/releases/latest/
# DNS: add A record vrtak.onemindos.dev → 143.244.220.155 in Cloudflare
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vrtak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/vrtak
  destination:
    server: https://kubernetes.default.svc
    namespace: vrtak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
