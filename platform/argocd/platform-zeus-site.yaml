apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-zeus-site
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/zeus-site
    directory:
      recurse: true
      exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
    namespace: zeus-site
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
