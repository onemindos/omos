apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-paperclip
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/paperclip
  destination:
    server: https://kubernetes.default.svc
    namespace: paperclip
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions: [CreateNamespace=true]
