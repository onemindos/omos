# tak-cluster: TAK Server 5.7 supplementary deploy manifests
#
# Covers: tak-cluster/deploy/
#
# This manages the overlay K8s resources (LB proxy, NATS leaf, ExternalSecret,
# ConfigMaps for TAK config). The TAK Server Helm chart itself is in
# tak-cluster/upstream/ and is managed via Helm, not here.
#
# Raw config files (CoreConfig.xml, TAKIgniteConfig.xml) are excluded — ArgoCD
# would try to apply them as K8s objects. They are mounted via ConfigMap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tak-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: tak-cluster/deploy
    directory:
      recurse: false
      exclude: "CoreConfig.xml,TAKIgniteConfig.xml"
  destination:
    server: https://kubernetes.default.svc
    namespace: takserver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/resources
