# platform-openclaw: OpenClaw gateway (Deployment, Service, ConfigMap, PVC, Tailscale Ingress).
#
# Adopted from the live cluster with no functional change; manifests mirror live (see docs/STACK.md).
# - The openclaw Namespace is owned by platform-volume-backups, so namespace.yaml is excluded here.
# - Secret/openclaw-secrets is managed out of band and is not in Git.
# - prune is off: adoption must never delete anything, including the 50Gi home PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openclaw
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/openclaw
    directory:
      recurse: false
      exclude: "{namespace.yaml,*.secret*,*.env}"
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
