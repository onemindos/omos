# Legacy's tool front door: agentgateway standalone (no controller, no CRDs). Design:
# docs/architecture/onemind-tool-gateway.md. Chart digest sha256:f8e74f989c6705e3e1aaaaabacf554d594e2a24867eb4097b216e019a88c14a6
# (helm pull of oci://cr.agentgateway.dev/charts/agentgateway-standalone v1.7.0, 2026-10-30).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tool-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  sources:
  - repoURL: cr.agentgateway.dev/charts
    chart: agentgateway-standalone
    targetRevision: v1.7.0
    helm:
      releaseName: agentgateway
      valueFiles:
      - $values/platform/tool-gateway/values.yaml
      - $values/platform/tool-gateway/values.generated.yaml
  # Namespace, NetworkPolicies, SealedSecrets and (Phase 3) the backend Deployments. Plain
  # manifests, recursed: a new file under manifests/ is picked up with no list to edit.
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/tool-gateway/manifests
    directory:
      recurse: true
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tool-gateway
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
