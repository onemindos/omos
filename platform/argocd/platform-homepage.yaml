apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/homepage
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
