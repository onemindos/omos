apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-hermes-fresh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/hermes/fresh
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
