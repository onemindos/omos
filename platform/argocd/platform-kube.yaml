apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kube
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: platform/kube
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
