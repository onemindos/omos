apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-volume-backups
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/backups/volsync
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    automated:
      # TEMPORARY (OpenClaw retirement): prune on so the openclaw namespace, backup source and policies
      # removed from platform/backups/volsync are deleted. Argo reported 0 resources needing pruning
      # before this change. Set back to false in the final retirement PR.
      prune: true
      selfHeal: true
