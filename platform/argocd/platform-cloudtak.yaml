# platform-cloudtak: fresh install of upstream CloudTAK (dfpc-coe/CloudTAK) as a TAK client, namespace cloudtak.
#
# Covers: platform/cloudtak/ (api, tiles, events, retention, config, Tailscale Ingresses, NetworkPolicies, sealed secrets).
# Wave 5. Keep the first rollout manual with zero retries while runtime acceptance is observed.
# Shared CNPG recovered and exact-image isolated migrations/startup passed 2026-10-25 (README.md).
# Sync shared managed role first, verify its password binding, then sync this app once under observation.
# Initial deployment was explicitly authorized by Zeus on 2026-10-25; no fresh authorization is needed.
#
# Shared services stay where they are: TAK Server (takserver), Tile38 and MediaMTX (onetak), Postgres (onemind-data).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cloudtak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/cloudtak
    directory:
      recurse: false
      exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudtak
  syncPolicy:
    # Re-enable automation only after the first rollout and TAK login acceptance have passed.
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 0
