# platform-cloudtak: fresh install of upstream CloudTAK (dfpc-coe/CloudTAK) as a TAK client, namespace cloudtak.
#
# Covers: platform/cloudtak/ (api, tiles, events, retention, config, Tailscale Ingresses, NetworkPolicies, sealed secrets).
# Wave 5. Manual while shared CNPG recovery and CloudTAK migration validation are pending.
# The Database CR is held by this Application; its managed role must be added by a separate reviewed change after recovery.
#
# Gates: shared CNPG recovery, isolated migration proof, reviewed role activation, sealed Spaces credentials,
# and an explicitly authorized manual sync (platform/cloudtak/README.md).
#
# Shared services stay where they are: TAK Server (takserver), Tile38 and MediaMTX (onetak), Postgres (onemind-data).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cloudtak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/cloudtak
    directory:
      recurse: false
      exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudtak
  syncPolicy:
    # Shared CNPG recovery and isolated exact-image migration proof are required before the first sync.
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 0
