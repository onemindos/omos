# ─────────────────────────────────────────────────────────────────────────────
# LAYER 1 — BUS / OPERATORS                                      sync-wave: "1"
# ─────────────────────────────────────────────────────────────────────────────
# platform-clickhouse-operator: Altinity ClickHouse Operator (kube-system)
#
# Manages ClickHouseInstallation CRDs. Must be live before wave-3 services
# (platform-observability) apply the onemind CHI resource.
#
# Previously installed imperatively — now GitOps-managed via Helm.
# Chart: altinity/altinity-clickhouse-operator
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-clickhouse-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://docs.altinity.com/clickhouse-operator/
    chart: altinity-clickhouse-operator
    targetRevision: "0.27.3"
    helm:
      values: |
        deployment:
          strategy:
            type: Recreate
        operator:
          # 2026-09-09: ran requestless (~74Mi). Give the scheduler real numbers.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        metrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  # 2026-09-09: removed ignoreDifferences on containers/0/resources —
  # resources now set properly via helm values (operator.requests/metrics.resources)
  # ServerSideApply: chart's CRD-anchor ConfigMaps exceed the 256Ki last-applied
  # annotation limit under client-side apply (SyncError) — SSA stores no such annotation.
