# ─────────────────────────────────────────────────────────────────────────────
# LAYER 1 — NETWORKING / CLOUDFLARE TUNNEL                       sync-wave: "1"
# ─────────────────────────────────────────────────────────────────────────────
# platform-cloudflared: cloudflared connector for the future public entry path
# (Cloudflare edge -> tunnel -> ingress-nginx ClusterIP). Plain manifests in
# platform/networking/cloudflared/ (see the header there for why not Helm).
#
# Ships INERT (replicas: 0). Needs Secret cloudflared-tunnel-token (key: token)
# in namespace cloudflare before replicas is raised. Runbook:
# docs/networking/NETWORKING.md
#
# The `cloudflare` namespace already exists (created by the core layer);
# CreateNamespace=true is a no-op there and keeps this Application self-sufficient
# on a fresh (home) cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/networking/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
