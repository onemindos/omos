apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: copilot-runtime
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:onemindos/omos-infra.git
    targetRevision: main
    path: platform/hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
