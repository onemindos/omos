apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openremote
  annotations:
    argocd.argoproj.io/sync-wave: '30'
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/openremote
  destination:
    server: https://kubernetes.default.svc
    namespace: openremote
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
