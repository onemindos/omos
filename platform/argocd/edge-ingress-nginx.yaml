# Adopts the hand-installed Helm release "ingress-nginx" (namespace ingress-nginx)
# into Argo CD. Chart version and releaseName match the live release exactly;
# values: platform/values/ingress-nginx.yaml.
# Adoption safety: prune is OFF (Argo will never delete anything it did not
# render) and there is deliberately no resources-finalizer, so deleting this
# Application can never cascade to the workloads. Never `helm upgrade` this
# release again: see docs/gitops/HELM-ADOPTION.md.
# The chart ships no CRDs. Its admission webhook certificate is created by the
# chart's admission Jobs (helm hooks, skipped if the Secret already exists) and the
# caBundle is injected by the patch Job, so there is no per-sync random material;
# the injected caBundle is ignored below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
  - repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valueFiles:
      - $values/platform/values/ingress-nginx.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
