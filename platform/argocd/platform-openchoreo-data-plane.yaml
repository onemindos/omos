# OpenChoreo data plane (install guide v1.3.x step 5, PLATFORM-ROADMAP.md phase 2c):
#   helm upgrade --install openchoreo-data-plane oci://ghcr.io/openchoreo/helm-charts/openchoreo-data-plane \
#     --version 1.3.1 --namespace openchoreo-data-plane --set gateway.tls.enabled=false
# Values: platform/openchoreo/data-plane/values.yaml. Plain manifests (the CA copy,
# later the ClusterDataPlane registration) come from the same directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openchoreo-data-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/openchoreo/helm-charts
      chart: openchoreo-data-plane
      targetRevision: 1.3.1
      helm:
        releaseName: openchoreo-data-plane
        valueFiles:
          - $values/platform/openchoreo/data-plane/values.yaml
    - repoURL: https://github.com/onemindos/omos.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/onemindos/omos.git
      targetRevision: main
      path: platform/openchoreo/data-plane
      directory:
        exclude: values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-data-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
