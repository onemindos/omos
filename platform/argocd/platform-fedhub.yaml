# FedHub 5.8 — multi-TAK federation hub.
# Manages platform/takserver/fedhub/ manifests: MongoDB StatefulSet, FedHub Deployment,
# Services (fedhub-ui, fedhub-fed; both ClusterIP), Tailscale Ingress (tailnet only).
#
# BEFORE FIRST SYNC — complete these manual steps or the Deployment will
# ImagePullBackOff / CrashLoop:
#   1. Build image:   bash services/takserver/build/build-fedhub.sh
#   2. Seal certs:    see platform/takserver/fedhub/fedhub.yaml header (kubeseal)
#   3. Seal Authentik: kubectl create secret generic fedhub-oidc-secret \
#                        --from-literal=keycloakSecret=<authentik-client-secret> \
#                        -n takserver --dry-run=client -o yaml | kubeseal -o yaml > \
#                        platform/takserver/fedhub/fedhub-oidc.sealedsecret.yaml
#   4. Commit fedhub-certs.sealedsecret.yaml + fedhub-oidc.sealedsecret.yaml
#   5. In Authentik, add redirect URI https://fedhub.tail717ba0.ts.net/login/redirect
#      to the `fedhub` OIDC client. No DNS record is needed: the admin UI is reachable only
#      on the tailnet at https://fedhub.tail717ba0.ts.net (Tailscale Ingress).
#
# Federation ports 9101/9102 are not exposed outside the cluster (no federation partners).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-fedhub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/takserver/fedhub
  destination:
    server: https://kubernetes.default.svc
    namespace: takserver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
