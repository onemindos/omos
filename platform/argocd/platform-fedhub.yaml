# FedHub 5.8 — multi-TAK federation hub.
# Manages tak-server/fedhub/ manifests: MongoDB StatefulSet, FedHub Deployment,
# Services (fedhub-ui, fedhub-fed), external LB (fedhub-fed-external), Ingress.
#
# BEFORE FIRST SYNC — complete these manual steps or the Deployment will
# ImagePullBackOff / CrashLoop:
#   1. Build image:   bash services/takserver/build/build-fedhub.sh
#   2. Seal certs:    see tak-server/fedhub/fedhub.yaml header (kubeseal)
#   3. Seal Authentik: kubectl create secret generic fedhub-oidc-secret \
#                        --from-literal=keycloakSecret=<authentik-client-secret> \
#                        -n takserver --dry-run=client -o yaml | kubeseal -o yaml > \
#                        tak-server/fedhub/fedhub-oidc.sealedsecret.yaml
#   4. Commit fedhub-certs.sealedsecret.yaml + fedhub-oidc.sealedsecret.yaml
#   5. Add DNS:  fedhub.onemindos.dev → 143.244.220.155  (Cloudflare)
#
# After deploy, connect TAK Server to FedHub:
#   WebTAK → Configuration → Federation → Create Outgoing → <fedhub-fed-external IP>:9102
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-fedhub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: tak-server/fedhub
  destination:
    server: https://kubernetes.default.svc
    namespace: takserver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
