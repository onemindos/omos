apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/n8n
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
  ignoreDifferences:
    # Temporary (database move, bulk-pg-consolidate): lets n8n be scaled to 0 for the dump window.
    - group: apps
      kind: Deployment
      namespace: n8n
      name: n8n
      jsonPointers: [/spec/replicas]
