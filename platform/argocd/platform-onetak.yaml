# ─────────────────────────────────────────────────────────────────────────────
# LAYER 2 — ONETAK PLATFORM                                     sync-wave: "2"
# ─────────────────────────────────────────────────────────────────────────────
# platform-onetak: OneTAK stack — the primary tactical UI
#
# Covers: platform/onetak/
#   api.yaml           — OneTAK API server (onemindos.dev)
#   events.yaml        — CoT event stream handler
#   media.yaml         — Media server (RTSP/HLS/SRT) for video wall
#   tiles.yaml         — PMTiles proxy (tiles.onemindos.dev)
#   ingress.yaml       — Internal ingress
#
# Image: ghcr.io/onemindos/cloudtak-api:latest
#
# Data flows into OneTAK via NATS → tak-projector → tak.cot.inject:
#   ClickHouse tracks → CoT track replays on map
#   ORP fused entities → CoT SA picture
#   Intel/OSINT detections → CoT alerts/overlays
#   Hermes AI → GeoChat messages + mission annotations
#   Geo tile layers → WMS/WMTS registered as OneTAK map overlays
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-onetak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/onetak
    directory:
      recurse: false
      exclude: "*.secret*,*.env,SECRETS-MIGRATION.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: onetak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/resources
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
