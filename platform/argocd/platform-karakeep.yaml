# User-authorized first start; app, identity bootstrap and backups reconcile together.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-karakeep
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/karakeep
  destination:
    server: https://kubernetes.default.svc
    namespace: karakeep
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - CreateNamespace=true
    - PruneLast=true
