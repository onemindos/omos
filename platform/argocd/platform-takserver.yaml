# ─────────────────────────────────────────────────────────────────────────────
# LAYER 2 — ONETAK PLATFORM                                     sync-wave: "2"
# ─────────────────────────────────────────────────────────────────────────────
# platform-takserver: TAK Server 5.8 supplementary deploy manifests
#
# Covers: tak-server/deploy/
#   mediamtx.yaml      — REMOVE: replaced by onetak-media
#   LB proxy, NATS leaf ExternalSecret, ConfigMaps for TAK server config.
#
# The TAK Server Helm chart is in tak-server/chart/ and is managed via
# Helm, not ArgoCD. This Application manages only the overlay K8s resources.
#
# NATS bridge plugin (NatsBridgePlugin) is the live CoT↔NATS wire:
#   tak.cot.inject  ← inbound CoT to inject into TAK (from tak-projector)
#   tak.cot.>       → outbound CoT from TAK EUDs (to NATS bus)
#
# Raw config files (CoreConfig.xml, TAKIgniteConfig.xml) are excluded —
# ArgoCD would try to apply them as K8s objects. Mounted via ConfigMap.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-takserver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos-infra.git
    targetRevision: HEAD
    path: tak-server/deploy
    directory:
      recurse: false
      exclude: "CoreConfig.xml,TAKIgniteConfig.xml"
  destination:
    server: https://kubernetes.default.svc
    namespace: takserver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/resources
