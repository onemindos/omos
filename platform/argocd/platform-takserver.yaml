# ─────────────────────────────────────────────────────────────────────────────
# LAYER 2 — ONETAK PLATFORM                                     sync-wave: "2"
# ─────────────────────────────────────────────────────────────────────────────
# platform-takserver: TAK Server 5.8 supplementary deploy manifests
#
# Covers: platform/takserver/deploy/
#   mediamtx.yaml      — REMOVE: replaced by onetak-media
#   LB proxy, NATS leaf ExternalSecret, ConfigMaps for TAK server config.
#
# The TAK Server Helm chart is in platform/takserver/chart/ and is managed via
# historical Helm revision34. Messaging/plugins, API/config, Ignite, PostgreSQL,
# internal NATS and retention are owned here. Whole-release Helm operations are
# frozen; supporting legacy Services/RBAC/configuration still need adoption.
#
# NATS bridge plugin (NatsBridgePlugin) is the live CoT↔NATS wire:
#   tak.cot.inject  ← inbound CoT to inject into TAK (from tak-projector)
#   tak.cot.>       → outbound CoT from TAK EUDs (to NATS bus)
#
# The raw TAKIgniteConfig.xml is excluded (a non-manifest file); CoreConfig lives in configmap-core-config-v2.yaml,
# a password-free template whose placeholders the init containers fill from Secrets.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-takserver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/takserver/deploy
    directory:
      recurse: false
      exclude: "TAKIgniteConfig.xml"
  destination:
    server: https://kubernetes.default.svc
    namespace: takserver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: tak-lb-proxy
      namespace: takserver
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
