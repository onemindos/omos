# ─────────────────────────────────────────────────────────────────────────────
# LAYER 2 — ONETAK PLATFORM                                     sync-wave: "2"
# ─────────────────────────────────────────────────────────────────────────────
# platform-takml: TAK ML vision pipeline
#
# Covers: platform/takml/
#   deployment.yaml         — takml-server, takml-db, takml-vision-worker
#   configmap-server.yaml   — server config
#   pvcs.yaml               — persistent storage
#   namespace.yaml          — takml namespace
#   *.sealedsecret.yaml     — DB, NATS and GHCR pull credentials
#
# takml-vision-worker runs 1 replica on CPU (YOLOv5s, image
# ghcr.io/onemindos/takml-vision, code baked in). It pulls the FEEDS RTSP paths
# from onetak-media and publishes detections to NATS.
#
# Pipeline:
#   onetak-media (RTSP) → takml-vision-worker (inference) → NATS → TAK Server
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-takml
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/takml
    directory:
      recurse: false
      exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
    namespace: takml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Container resources are not ignored: Git is the source of truth for them, and
  # ignoring them meant a resources-only change never triggered a sync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
