# ─────────────────────────────────────────────────────────────────────────────
# LAYER 3 — FEEDS / REDPANDA CONNECT (WOMBAT)                   sync-wave: "3"
# ─────────────────────────────────────────────────────────────────────────────
# platform-redpanda-connect: Wombat declarative feed engine → NATS → TAK
#
# Covers: platform/data/redpanda-connect/
#   deployment.yaml          — legacy Deployment + pipeline ConfigMap + proto ConfigMap
#   deployment-grammar.yaml  — redpanda-connect-grammar Deployment: the feed engine (controller + seeder)
#   feed-sources / feed-control .configmap.yaml — generated by scripts/gen_feed_sources.py
#   networkpolicy.yaml       — denies all ingress to both Redpanda Connect pods (streams API)
#
# Pipelines live in the ConfigMap; platform/data/redpanda-connect/pipelines/ holds reference copies.
# A pipeline runs only if a Deployment's args name it:
#   feed-mta.yaml                — legacy: MTA trains → tak.cot.inject (redpanda-connect)
#   feed-mta-grammar.yaml        — reference copy and replay-test input; MTA runs from platform/data/sources/mta-rail.yaml
#   feed-satellites-grammar.yaml — CelesTrak TLE; not started until it has a source manifest
#   feed-ships.yaml, feed-aircraft.yaml — off; return only through omos-ingest with an AOI and quota
# Cut-over order and rollback: platform/data/redpanda-connect/CUTOVER.md.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-redpanda-connect
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/data/redpanda-connect
    directory:
      recurse: false
      exclude: "*.proto,pipelines/"
  destination:
    server: https://kubernetes.default.svc
    namespace: feeds
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # feeds is labelled by platform-omos (platform/omos), a different Application in the same
    # wave. If this app creates feeds first, the Kyverno Enforce policy require-namespace-layer-label
    # denies an unlabelled namespace, so Argo creates it with the same labels as platform-omos.
    # feeds carries no argocd.argoproj.io/sync-options annotation, so the one Argo adds is harmless.
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: omos-platform
        onemind.io/layer: sense
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
