# Adopts the hand-installed Helm release "nack" (namespace nats) into Argo CD.
# Chart version and releaseName match the live release exactly;
# values: platform/nats/nack-values.yaml (identical to the live release values).
# Adoption safety: prune is OFF (Argo will never delete anything it did not
# render) and there is deliberately no resources-finalizer, so deleting this
# Application can never cascade to the workloads. Never `helm upgrade` this
# release again: see docs/gitops/HELM-ADOPTION.md.
# NOTE: jetstream.nats.url is null in the live release, exactly as in Git (the
# credentialed overlay was never applied), so the controller currently cannot
# reconcile streams. Adoption deliberately preserves that; fixing it must use an
# existing Secret, never a URL with an embedded password in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-nack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
  - repoURL: https://nats-io.github.io/k8s/helm/charts
    chart: nack
    targetRevision: 0.34.0
    helm:
      releaseName: nack
      valueFiles:
      - $values/platform/nats/nack-values.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
