# platform-legacy: Legacy AI (Hermes), Hermes Web UI, Synadia Bridge, hermes ai-bridge
#
# Covers:
#   platform/legacy/        (Hermes / Legacy AI agent — uses kustomization.yaml)
#   platform/hermes/        (onemind-ai-bridge HTTP→NATS)
#   platform/hermes-webui/  (Hermes web UI)
#   platform/synadia-bridge/ (Synadia cloud bridge)
#
# The legacy/ directory has a kustomization.yaml so ArgoCD uses Kustomize.
# hermes/, hermes-webui/, and synadia-bridge/ are plain directories.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-legacy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/onemindos/omos-infra.git
      targetRevision: HEAD
      path: platform/legacy
      # ArgoCD auto-detects kustomization.yaml and uses Kustomize
    - repoURL: https://github.com/onemindos/omos-infra.git
      targetRevision: HEAD
      path: platform/hermes
      directory:
        recurse: false
        exclude: "*.secret*,*.env"
    - repoURL: https://github.com/onemindos/omos-infra.git
      targetRevision: HEAD
      path: platform/hermes-webui
      directory:
        recurse: false
        exclude: "*.secret*,*.env"
    - repoURL: https://github.com/onemindos/omos-infra.git
      targetRevision: HEAD
      path: platform/synadia-bridge
      directory:
        recurse: false
        exclude: "Dockerfile,*.ts"
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/resources
        - /spec/template/spec/initContainers
