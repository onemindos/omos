# ─────────────────────────────────────────────────────────────────────────────
# LAYER 3 — AI BRAIN                                             sync-wave: "3"
# ─────────────────────────────────────────────────────────────────────────────
# platform-legacy: Legacy AI (Hermes) + OneMind AI Bridge
#
# Covers:
#   platform/hermes/agent/  — Hermes/Legacy AI agent (kustomization.yaml)
#   platform/hermes/bridge/ — legacy-only sealed secrets (hermes-env, hermes-leaf-conf, ghcr, cloudtak-agent-token)
#
# platform/hermes/mcp/ (Application platform-onemind-mcp) and platform/hermes/base/ (Application
# platform-hermes-base: Namespace hermes, egress Services, Secrets onemind-hermes mounts) were
# transferred out of this Application on 2026-11-01. Plan: platform/hermes/base/README.md.
#
# Integration with CloudTAK:
#   - Hermes publishes GeoChat via tak.cot.inject → appears in TAK comms panel
#   - Hermes subscribes to tak.cot.> for SA picture awareness
#   - onemind-ai-bridge exposes HTTP endpoint CloudTAK AI plugin calls
#   - cloudtak-agent-token secret authenticates Hermes to CloudTAK API
#
# agent/ has kustomization.yaml — ArgoCD auto-detects Kustomize.
# bridge/ is a plain directory.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-legacy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/onemindos/omos.git
      targetRevision: main
      path: platform/hermes/agent
      # ArgoCD auto-detects kustomization.yaml and uses Kustomize
    - repoURL: https://github.com/onemindos/omos.git
      targetRevision: main
      path: platform/hermes/bridge
      directory:
        recurse: false
        exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
    # The Tailscale operator owns spec.externalName on the egress Services (egress.yaml).
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/externalName
