# Security layer: Kyverno, Falco, OpenFGA and Trivy Applications plus their labelled
# namespaces, from platform/security/. Same safety model as the ecosystem parents:
# prune off and no resources-finalizer, so nothing is ever deleted by this parent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-security
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/security
    directory:
      recurse: false
      exclude: '*.md'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # Kyverno writes defaulted fields back into every ClusterPolicy, which showed the Application as
  # permanently OutOfSync. Ignore exactly those fields (read from the live objects), on ClusterPolicy only.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.rules[]?.skipBackgroundRequests
        - .spec.rules[]?.validate?.allowExistingViolations
