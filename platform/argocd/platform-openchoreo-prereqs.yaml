# OpenChoreo prerequisites owned by this repo (PLATFORM-ROADMAP.md, phase 2).
# The External Secrets operator itself is ecosystem-external-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openchoreo-prereqs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/openchoreo/prereqs
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
