# OpenChoreo observability plane (install guide v1.3.x, PLATFORM-ROADMAP.md phase 5).
# Helm installs the plane deployment; the ClusterObservabilityPlane registration in
# platform/openchoreo/platform wires modules to the existing Prometheus, OpenSearch and
# Tempo backends, plus OpenCost for FinOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openchoreo-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/openchoreo/helm-charts
      chart: openchoreo-observability-plane
      targetRevision: 1.3.1
      helm:
        releaseName: onemind-observability
        valueFiles:
          - $values/platform/openchoreo/observability/values.yaml
    - repoURL: https://github.com/onemindos/omos.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-observability-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
