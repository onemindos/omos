# ─────────────────────────────────────────────────────────────────────────────
# LAYER 4 — ALERTS                                               sync-wave: "4"
# ─────────────────────────────────────────────────────────────────────────────
# platform-monitoring: PrometheusRules + the Alertmanager Telegram SealedSecret
#
# Covers: platform/monitoring/
#   prometheus-rules-onemind.yaml            — OneMind K8s health alert rules
#   alertmanager-telegram.sealedsecret.yaml  — Telegram bot token and chat ID (keys bot-token,
#                                              chat-id), sealed by the owner as in CLAUDE.md
#
# The Telegram receiver and routing are in platform/values/kube-prometheus-stack.yaml
# (alertmanager.config); Alertmanager reads both values as files from that Secret.
#
# Helm values wired in platform/values/kube-prometheus-stack.yaml:
#   alertmanagerConfigSelector: {}   — picks up AlertmanagerConfig CRs
#   ruleSelector: {}                 — picks up PrometheusRule CRs from all ns
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/monitoring
    directory:
      recurse: true
      exclude: "*.secret*,*.env,Dockerfile,*.py,*.ini,README.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
