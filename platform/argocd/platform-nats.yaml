# ─────────────────────────────────────────────────────────────────────────────
# LAYER 1 — BUS                                                  sync-wave: "1"
# ─────────────────────────────────────────────────────────────────────────────
# platform-nats: NATS HA overlay manifests + NATS Surveyor metrics exporter
#
# Covers: platform/nats/       (TLS cert, Tailscale LB service, Stream CRDs)
#         platform/monitoring/ (Prometheus exporter, moved from nats-surveyor $SYS metrics)
#
# NOTE: The NATS HA cluster itself is deployed via Helm (nats/nats chart).
# NACK JetStream CRD controller is also Helm-managed.
# This Application manages only supplementary manifests.
#
# nats-surveyor spans two namespaces (nats + monitoring) — both are respected
# because each manifest has an explicit namespace field.
#
# Secret files (creds.secret.env, values.secret.yaml) are excluded — managed
# out-of-band, never committed to git.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/nats
    directory:
      recurse: false
      exclude: "*.secret*,*.env,values.template.yaml,nack-values.template.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
  syncPolicy:
    automated:
      # prune is OFF: this Application tracks the NATS StatefulSet (TIER-1). Removing
      # or renaming a file here must never delete a live bus object. The StatefulSet
      # also carries `argocd.argoproj.io/sync-options: Prune=false,Delete=false`,
      # because the resources-finalizer above would otherwise cascade-delete it when
      # this Application is deleted.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
