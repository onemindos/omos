apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nextcloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  sources:
  - repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: 9.4.1
    helm:
      releaseName: nextcloud
      valueFiles:
      - $values/platform/nextcloud/values.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
    path: platform/nextcloud/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
