apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ''
      kind: Service
      namespace: backstage
      name: authentik-mesh
      jsonPointers: [/spec/externalName]
    - group: ''
      kind: Service
      namespace: backstage
      name: argocd-mesh
      jsonPointers: [/spec/externalName]
    # Temporary (database move, bulk-pg-consolidate): lets the portal be scaled to 0 for the dump window.
    - group: apps
      kind: Deployment
      namespace: backstage
      name: backstage
      jsonPointers: [/spec/replicas]
