# Argo Rollouts: progressive delivery (canary / blue-green with automatic rollback).
# Lives with Argo CD (namespace argocd) as part of the GitOps delivery tooling.
# Nothing uses it yet (no Rollout objects); configuring canaries for tak-portal and
# Hermes is a separate PR. Moved from platform/ecosystem/foundation-applications/
# (namespace argo-rollouts) on 2026-10-17; same chart version and values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: default
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.6
    helm:
      releaseName: rollouts
      valueFiles:
      - $values/platform/values/argo-rollouts.yaml
  - repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
