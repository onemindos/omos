# platform-omos: omos-* services (tak-projector, feeds)
#
# Covers:
#   platform/omos/   (tak-projector, omos feeds)
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-omos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/onemindos/omos-infra.git
      targetRevision: HEAD
      path: platform/omos
      directory:
        recurse: false
        exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
    namespace: omos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/resources
