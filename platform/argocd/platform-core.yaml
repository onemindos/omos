# Wave 0 — CORE: sealed-secrets, ingress issuers, cloudflare tunnel, tailscale, github-runner
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/onemindos/omos.git
    targetRevision: main
    path: platform/core
    directory:
      recurse: true
      exclude: "*.secret*,*.env"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # Preserve operator restart timestamps only; resource budgets remain reconciled.
    - group: apps
      kind: Deployment
      name: sealed-secrets-controller
      namespace: kube-system
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
    - group: apps
      kind: Deployment
      name: github-runner
      namespace: github-runner
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
