apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mission-engine-env
  namespace: omos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: mission-engine-env
    creationPolicy: Owner
  data: []
