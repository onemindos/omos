# Retain class: deleting the claim keeps the DigitalOcean volume. Never recreate a live claim to change its class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: ${{ values.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,Replace=false,Force=false
    argocd.argoproj.io/sync-wave: '-1'
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: ${{ values.storage }}
  storageClassName: do-block-storage-retain
