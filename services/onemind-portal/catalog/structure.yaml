# OneMind catalog structure (reviewed source, not a Backstage location).
# Read by scripts/curate-structure.cjs, which materializes the Domains, Systems and new app Components into catalog/apps.yaml
# and re-parents every entity. Pillars are PROPOSED until Zeus approves docs/catalog/system-map.md.
# A pillar of "unclassified" means the pillar has not been reviewed; it is never guessed.
reviewStatus:
  status: proposed
  reviewer: Zeus Delacruz (approval pending, see docs/catalog/system-map.md)
  evidence: docs/catalog/system-map.md; platform/argocd Application list; catalog/apps.yaml; catalog/cluster.yaml
domains:
  - name: onemind
    title: OneMind
    pillar: none
    description: The OneMind mission catalog. Four pillar domains (SO, LE, HP, GE) sit under it; Systems whose pillar has not been reviewed sit here as Shared / Unclassified.
  - name: onemind-so
    title: SO — Sovereign Operations
    pillar: so
    description: Technical infrastructure, security, development, automation, agents, TAK, drones and robotics.
  - name: onemind-le
    title: LE — Legacy Evolution
    pillar: le
    description: Family, home and land, homestead, off-grid systems, heritage and community.
  - name: onemind-hp
    title: HP — Holistic Performance
    pillar: hp
    description: Personal health and performance, habits, learning, development and personal finance.
  - name: onemind-ge
    title: GE — Generational Empire
    pillar: ge
    description: Ventures, products, brand, business operations, partnerships and long-term enterprise.
systems:
  - name: infrastructure
    title: Platform core
    description: "Cluster foundations: networking and ingress, certificates, DNS, autoscaling, operators, Tailscale and Cloudflare, and the DigitalOcean account."
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: identity-access
    title: Identity & access
    description: Sign-in, authorization, workload identity, secrets management and admission/runtime policy.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: gitops-delivery
    title: GitOps & delivery
    description: Argo CD and Argo Rollouts, the container registry, the GitHub runner and source hosting.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: developer-platform
    title: Developer platform
    description: The Backstage portal, OpenChoreo control and data planes, cluster dashboards and runbooks.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: observability
    title: Observability
    description: Metrics, logs, traces, dashboards, alerting, cost and cluster-health tooling.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: data-storage
    title: Data & storage
    description: Databases and operators, object and block storage, search, backups and recovery.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: messaging-nats
    title: Messaging (NATS)
    description: The NATS bus, its UIs and tools, and the data pipelines that publish to or consume from it.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: tak-ecosystem
    title: TAK & field ops
    description: TAK Server and its plugins, OneTAK, FedHub, TAK-ML, voice and the TAK clients and references.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: geospatial
    title: Geospatial, drones & robotics
    description: Map, routing, geocoding and imagery services, drone software and firmware, and robotics platforms.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: ai-agents
    title: AI & agents
    description: Hermes (Legacy), agent consoles, model gateways and runtimes, model providers and workflow automation.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: repo-onemind
    title: Code repositories
    description: Source repositories in the onemindos GitHub organization. Hidden by default.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: onemind-mesh
    title: Mesh & devices
    description: Tailscale mesh endpoints (devices and service proxies). Discovery snapshot, not live health. Hidden by default.
    pillar: so
    review: proposed
    domain: domain:default/onemind-so
  - name: personal-finance
    title: Personal finance
    description: Personal banking, credit monitoring and credit-building tools.
    pillar: hp
    review: proposed
    domain: domain:default/onemind-hp
  - name: home-homestead
    title: Home & homestead
    description: Home automation and homestead/farm automation.
    pillar: le
    review: proposed
    domain: domain:default/onemind-le
  - name: business-operations
    title: Business operations
    description: Customer relationship, community and other business-operations platforms.
    pillar: ge
    review: proposed
    domain: domain:default/onemind-ge
  - name: intelligence
    title: Intelligence & feeds
    description: Intelligence feeds, monitors and the observational API. SO per Zeus (2026-10-21).
    pillar: so
    review: approved
    domain: domain:default/onemind-so
  - name: communication
    title: Communication
    description: "Messaging, mail and phone services, self-hosted and external: shared communications infrastructure. SO per Zeus (2026-10-21)."
    pillar: so
    review: approved
    domain: domain:default/onemind-so
  - name: productivity-saas
    title: Productivity & SaaS
    description: Zoho, Google Workspace, Notion, Dropbox and other hosted productivity services. Shared across pillars (Zeus, 2026-10-21).
    pillar: shared
    review: approved
    domain: domain:default/onemind
  - name: personal-tools
    title: Personal tools & devices
    description: Desktop applications, hardware vendors and personal devices. Shared across pillars (Zeus, 2026-10-21).
    pillar: shared
    review: approved
    domain: domain:default/onemind
  - name: social-media
    title: Brand & social media
    description: Social and brand accounts. GE per Zeus (2026-10-21).
    pillar: ge
    review: approved
    domain: domain:default/onemind-ge
  - name: reference-links
    title: Reference & community
    description: Foundations, standards bodies and community reference sites. Shared across pillars; hidden by default (Zeus, 2026-10-21).
    pillar: shared
    review: approved
    domain: domain:default/onemind
  - name: unassigned-workloads
    title: Unassigned workloads
    description: "Kubernetes workloads that no reviewed mapping assigns to an app yet. Nothing is hidden: new workloads land here until mapped."
    pillar: unclassified
    review: proposed
    domain: domain:default/onemind
apps:
  - name: platform-core
    title: Platform core manifests
    system: infrastructure
    description: Sealed Secrets controller, certificate issuers, standby Cloudflare tunnel config, GitHub runner and Tailscale policy (Argo application platform-core).
  - name: cert-manager
    title: cert-manager
    system: infrastructure
    description: Certificate management for the cluster.
  - name: ingress-nginx
    title: ingress-nginx
    system: infrastructure
    description: Public ingress controller.
  - name: external-dns
    title: ExternalDNS
    system: infrastructure
    description: Synchronizes DNS records for cluster ingresses.
  - name: cloudflared
    title: Cloudflare Tunnel (standby)
    system: infrastructure
    description: Cloudflare tunnel connector, kept as a cold standby.
  - name: tailscale-operator
    title: Tailscale operator and proxies
    system: infrastructure
    description: Tailscale Kubernetes operator and the per-service tailnet proxies it creates.
  - name: keda
    title: KEDA
    system: infrastructure
    description: Event-driven autoscaling.
  - name: dapr
    title: Dapr
    system: infrastructure
    description: Dapr control plane.
  - name: kubernetes-system
    title: Kubernetes system services
    system: infrastructure
    description: "DOKS-managed core services: CoreDNS, konnectivity agent and metrics-server. No Argo application."
  - name: onemind-core
    title: OneMind core services
    system: infrastructure
    description: OneMind core API and ingestion services (Argo application ecosystem-onemind-core).
  - name: authentik
    title: Authentik
    system: identity-access
    description: Identity provider (server, worker, Redis, PostgreSQL).
  - name: openfga
    title: OpenFGA
    system: identity-access
    description: Fine-grained authorization service.
  - name: spire
    title: SPIRE
    system: identity-access
    description: Workload identity (SPIFFE).
  - name: kyverno
    title: Kyverno
    system: identity-access
    description: Admission and background policy engine; also carries the platform-security Argo application (Kyverno, Falco, SPIRE and OpenFGA wiring).
  - name: falco
    title: Falco
    system: identity-access
    description: Runtime security detection (DaemonSet).
  - name: external-secrets
    title: External Secrets Operator
    system: identity-access
    description: Synchronizes secrets from external stores.
  - name: argo-rollouts
    title: Argo Rollouts
    system: gitops-delivery
    description: Progressive delivery controller.
  - name: harbor
    title: Harbor
    system: gitops-delivery
    description: In-cluster container registry with image scanning.
  - name: backstage
    title: Backstage portal
    system: developer-platform
    description: The OneMind developer portal and its PostgreSQL database.
  - name: openchoreo
    title: OpenChoreo
    system: developer-platform
    description: OpenChoreo control plane and data plane, defaults, projects and prerequisites.
  - name: openchoreo-observability
    title: OpenChoreo observability plane
    system: observability
    description: OpenChoreo observer, adapters and collectors for logs, traces, metrics, events and FinOps.
  - name: tempo
    title: Tempo
    system: observability
    description: Distributed tracing backend.
  - name: opentelemetry-collector
    title: OpenTelemetry Collector
    system: observability
    description: Telemetry collection (DaemonSet agent).
  - name: opencost
    title: OpenCost
    system: observability
    description: Kubernetes cost allocation.
  - name: health-keeper
    title: Cluster health observer
    system: observability
    description: Read-only five-minute cluster health observer (platform-ops).
  - name: cloudnative-pg
    title: CloudNativePG
    system: data-storage
    description: PostgreSQL operator and the Barman Cloud backup plugin.
  - name: opensearch
    title: OpenSearch
    system: data-storage
    description: Search and log store.
  - name: velero
    title: Velero
    system: data-storage
    description: Cluster backup and restore.
  - name: volsync
    title: VolSync
    system: data-storage
    description: Volume replication and backup controller.
  - name: nats
    title: NATS JetStream
    system: messaging-nats
    description: The authority message bus (3-node JetStream), the NACK controller and NATS tools.
  - name: redpanda-connect
    title: Redpanda Connect
    system: messaging-nats
    description: Stream processing between NATS and downstream sinks.
  - name: omos-data-pipeline
    title: OMOS data pipeline
    system: messaging-nats
    description: Feed, projector and sink services in the omos namespace.
  - name: takml
    title: TAK-ML
    system: tak-ecosystem
    description: TAK-ML server, database and vision worker.
  - name: geo-data-services
    title: OneTAK geospatial services
    system: geospatial
    description: Martin, Nominatim, Overpass, pg_featureserv, Tile38, STAC API/browser and the geo database.
  - name: n8n
    title: n8n
    system: ai-agents
    description: Workflow automation.
  - name: litellm
    title: LiteLLM
    system: ai-agents
    description: Model gateway.
