# Entities removed by the F2 restructure and where they went. Only Systems were removed; Components, APIs and Resources keep their refs.
# Backstage has no built-in entity redirect: this file is the reviewed record, checked by scripts/test-catalog-structure.cjs.
# A ref in catalog/ref-baseline.json that is neither in the catalog nor listed here fails the test.
redirects:
  - from: system:default/zoho-apps
    to: system:default/productivity-saas
    reason: Zoho is one of several hosted productivity suites; merged into Productivity & SaaS.
  - from: system:default/workspaces
    to: system:default/productivity-saas
    reason: "Mixed SaaS: GitHub moves to GitOps & delivery, Circle to Business operations, Composio to AI & agents, the rest to Productivity & SaaS."
  - from: system:default/external
    to: system:default/developer-platform
    reason: Duplicate launcher links ("external-*") and OneMind OS; each now sits with the service it points at.
  - from: system:default/cluster-agent-fabric
    to: system:default/ai-agents
    reason: Namespace grouping replaced by the app's System (AI & agents).
