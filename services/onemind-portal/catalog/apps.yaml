apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: nats-events
  title: NATS events (evt.>)
  description: Immutable facts on evt.{domain}.{entity}.{event}. JetStream
    captures them in the EVT, WORLD, GEO, MISSION and SYS streams.
  tags:
    - nats
    - asyncapi
    - events
  links:
    - url: https://github.com/onemindos/omos/blob/main/docs/NATS-DOCTRINE.md
      title: NATS doctrine (subject grammar)
      type: docs
    - url: https://github.com/onemindos/omos/tree/main/platform/nats/streams
      title: JetStream stream definitions
      type: source
    - url: https://github.com/onemindos/omos/blob/main/services/schemas/envelope/envelope.schema.json
      title: Event envelope schema
      type: schema
  annotations:
    onemind.io/contract-source: docs/NATS-DOCTRINE.md; platform/nats/streams/
    onemind.io/pillar-review: proposed
  labels:
    onemind.io/pillar: so
spec:
  type: asyncapi
  lifecycle: production
  owner: group:default/onemind-admins
  system: messaging-nats
  definition: |
    asyncapi: 2.6.0
    info:
      title: OneMind NATS events
      version: 1.0.0
      description: "Events are immutable facts (past tense), docs/NATS-DOCTRINE.md section 2. Domains are the pillars so, hp,
        le, ge plus sys; the deployed streams also capture task, cloud, bio, robot, drone, world (WORLD), tak (GEO:
        evt.tak.cot.>, evt.tak.status.>), mission and map (MISSION) and sys (SYS). Never publish a command as an event."
    defaultContentType: application/json
    servers:
      onemind-cloud:
        url: nats.nats.svc.cluster.local:4222
        protocol: nats
        description: In-cluster authority bus (3-node JetStream, namespace nats). Cloud workloads connect with credentials from
          Secrets; Hermes and edge nodes connect through a NATS leaf node.
    channels:
      evt.{domain}.{entity}.{event}:
        description: "Example: evt.so.task.created. Consumers filter with wildcards such as evt.so.> or evt.world.>."
        parameters:
          domain:
            description: Pillar (so, hp, le, ge) or sys, or a stream-defined domain (world, tak, mission, map, task, ...).
            schema:
              type: string
          entity:
            description: Entity type.
            schema:
              type: string
          event:
            description: Past-tense event name.
            schema:
              type: string
        publish:
          summary: Clients publish events.
          message: &a1
            $ref: "#/components/messages/envelope"
        subscribe:
          summary: Clients receive events.
          message: *a1
    components:
      messages:
        envelope:
          name: OneMindEventEnvelope
          title: OneMind event envelope v1
          contentType: application/json
          summary: "Canonical schema: services/schemas/envelope/envelope.schema.json (summarized here; the catalog ConfigMap does
            not carry the schema files)."
          payload:
            type: object
            required:
              - v
              - id
              - ts
              - type
              - source
              - subject
              - data
            additionalProperties: true
            properties:
              v:
                type: integer
                minimum: 1
                description: Envelope version.
              id:
                type: string
                format: uuid
                description: UUID v4 message id.
              ts:
                type: string
                format: date-time
                description: RFC3339 timestamp, millisecond precision.
              type:
                type: string
                description: Dotted type mirroring the subject grammar.
              source:
                type: string
                description: Actor id that emitted the message.
              subject:
                type: string
                description: NATS subject the message was published on.
              data:
                type: object
                additionalProperties: true
                description: Typed payload; schema depends on type.
              corr:
                type: string
                format: uuid
              causation:
                type: string
                format: uuid
              trace:
                type: string
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: nats-commands
  title: NATS commands (cmd.>)
  description: Imperatives on cmd.{domain}.{entity}.{action}; captured by the CMD
    stream. Commands may be rejected.
  tags:
    - nats
    - asyncapi
    - commands
  links:
    - url: https://github.com/onemindos/omos/blob/main/docs/NATS-DOCTRINE.md
      title: NATS doctrine (subject grammar)
      type: docs
    - url: https://github.com/onemindos/omos/tree/main/platform/nats/streams
      title: JetStream stream definitions
      type: source
    - url: https://github.com/onemindos/omos/blob/main/services/schemas/command/envelope.schema.json
      title: Command envelope schema
      type: schema
  annotations:
    onemind.io/contract-source: docs/NATS-DOCTRINE.md; platform/nats/streams/
    onemind.io/pillar-review: proposed
  labels:
    onemind.io/pillar: so
spec:
  type: asyncapi
  lifecycle: production
  owner: group:default/onemind-admins
  system: messaging-nats
  definition: |
    asyncapi: 2.6.0
    info:
      title: OneMind NATS commands
      version: 1.0.0
      description: Commands (imperatives), docs/NATS-DOCTRINE.md section 2 and the map/fleet/mission commands of section 9
        (cmd.map.>, cmd.fleet.>, cmd.mission.>). The CMD stream captures cmd.>.
    defaultContentType: application/json
    servers:
      onemind-cloud:
        url: nats.nats.svc.cluster.local:4222
        protocol: nats
        description: In-cluster authority bus (3-node JetStream, namespace nats). Cloud workloads connect with credentials from
          Secrets; Hermes and edge nodes connect through a NATS leaf node.
    channels:
      cmd.{domain}.{entity}.{action}:
        description: "Example: cmd.le.light.on, cmd.projector.disable."
        parameters:
          domain:
            description: Pillar, sys, or a section 9 domain (fleet, mission, map).
            schema:
              type: string
          entity:
            description: Target entity.
            schema:
              type: string
          action:
            description: Imperative verb.
            schema:
              type: string
        publish:
          summary: Clients publish commands.
          message: &a1
            $ref: "#/components/messages/command"
        subscribe:
          summary: Clients receive commands.
          message: *a1
    components:
      messages:
        command:
          name: OneMindCommandEnvelope
          title: OneMind command envelope v1
          contentType: application/json
          summary: "Canonical schema: services/schemas/command/envelope.schema.json (summarized here). Commands may be rejected;
            results are published as evt.command.* events."
          payload:
            type: object
            required:
              - v
              - id
              - ts
              - cmd
              - source
              - subject
              - data
            additionalProperties: true
            properties:
              v:
                type: integer
                minimum: 1
              id:
                type: string
                format: uuid
              ts:
                type: string
                format: date-time
              cmd:
                type: string
                pattern: ^cmd\.[a-z0-9_][a-z0-9_.\-$]*$
                description: Dotted command type mirroring the subject.
              source:
                type: string
                description: Actor id that issued the command.
              subject:
                type: string
              data:
                type: object
                additionalProperties: true
