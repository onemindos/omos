apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: nats-agent-protocol
  title: NATS agent fabric (agents.>)
  description: Synadia Agent Protocol v0.3 subjects
    agents.{verb}.{agent}.{owner}.{session} and $SRV discovery; the AGENTS
    stream captures heartbeats and status.
  tags:
    - nats
    - asyncapi
    - agents
  links:
    - url: https://github.com/onemindos/omos/blob/main/docs/NATS-DOCTRINE.md
      title: NATS doctrine (subject grammar)
      type: docs
    - url: https://github.com/onemindos/omos/tree/main/platform/nats/streams
      title: JetStream stream definitions
      type: source
  annotations:
    onemind.io/contract-source: docs/NATS-DOCTRINE.md; platform/nats/streams/
    onemind.io/pillar-review: proposed
  labels:
    onemind.io/pillar: so
spec:
  type: asyncapi
  lifecycle: production
  owner: group:default/onemind-admins
  system: messaging-nats
  definition: |
    asyncapi: 2.6.0
    info:
      title: OneMind NATS agent fabric
      version: 1.0.0
      description: "External standard: Synadia Agent Protocol v0.3 (verb-first), docs/NATS-DOCTRINE.md section 2. Callers MUST
        read endpoint subjects from $SRV.PING.agents / $SRV.INFO.agents (stall-timeout request-many), never hardcode a
        roster. Payloads follow the upstream protocol; no local schema."
    defaultContentType: application/json
    servers:
      onemind-cloud:
        url: nats.nats.svc.cluster.local:4222
        protocol: nats
        description: In-cluster authority bus (3-node JetStream, namespace nats). Cloud workloads connect with credentials from
          Secrets; Hermes and edge nodes connect through a NATS leaf node.
    channels:
      agents.{verb}.{agent}.{owner}.{session}:
        description: "Example: agents.prompt.hermes.zeus.legacy (Hermes Legacy prompt endpoint)."
        parameters:
          verb:
            description: prompt | hb | status | attachments
            schema:
              type: string
          agent:
            description: Agent framework (hermes, ...).
            schema:
              type: string
          owner:
            description: Owner (zeus).
            schema:
              type: string
          session:
            description: Session or instance (legacy, ...).
            schema:
              type: string
        publish:
          summary: Callers send prompts (request/reply) or agents publish hb/status.
          message:
            name: AgentProtocolMessage
            payload:
              type: object
              additionalProperties: true
        subscribe:
          summary: Agents serve prompt endpoints; observers receive hb/status.
          message:
            name: AgentProtocolMessage
            payload:
              type: object
              additionalProperties: true
      $SRV.PING.agents:
        description: NATS micro discovery of agent endpoints.
        publish:
          summary: Discovery sweep request.
          message:
            name: ServicePing
            payload:
              type: object
      $SRV.INFO.agents:
        description: NATS micro endpoint info for agents.
        publish:
          summary: Endpoint info request.
          message:
            name: ServiceInfo
            payload:
              type: object
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tak-cot-bridge
  title: TAK CoT bridge (tak.cot.>)
  description: "Cursor-on-Target between the OneMind bus and TAK Server through
    the NatsBridgePlugin: tak.cot.inject in, tak.cot.out (tak.cot.>) out. The
    COT stream captures tak.cot.>."
  tags:
    - nats
    - asyncapi
    - tak
    - cot
  links:
    - url: https://github.com/onemindos/omos/blob/main/services/takserver/plugin/tak.server.plugins.NatsBridgePlugin.yaml
      title: NatsBridgePlugin subject configuration
      type: source
    - url: https://github.com/onemindos/omos/blob/main/platform/nats/streams/cot.yaml
      title: COT stream
      type: source
  annotations:
    onemind.io/contract-source: docs/NATS-DOCTRINE.md; platform/nats/streams/
    onemind.io/pillar-review: proposed
  labels:
    onemind.io/pillar: so
spec:
  type: asyncapi
  lifecycle: production
  owner: group:default/onemind-admins
  system: tak-ecosystem
  definition: |
    asyncapi: 2.6.0
    info:
      title: TAK CoT bridge
      version: 1.0.0
      description: The NatsBridgePlugin in the takserver-plugins pod subscribes to tak.cot.inject and fans CoT out to TAK
        clients, and publishes CoT from TAK clients on tak.cot.out (natsConsumerSubject / natsProducerSubject in
        services/takserver/plugin/tak.server.plugins.NatsBridgePlugin.yaml). It reaches the bus through the tak-nats-leaf
        leaf node. Payload is CoT XML, not the JSON envelope.
    defaultContentType: application/json
    servers:
      onemind-cloud:
        url: nats.nats.svc.cluster.local:4222
        protocol: nats
        description: In-cluster authority bus (3-node JetStream, namespace nats). Cloud workloads connect with credentials from
          Secrets; Hermes and edge nodes connect through a NATS leaf node.
    channels:
      tak.cot.inject:
        description: CoT to inject into TAK (NatsBridgePlugin input).
        publish:
          summary: Producers (OMOS TAK projector and feeds, Redpanda Connect feeds) publish CoT events.
          message:
            $ref: "#/components/messages/cot"
        subscribe:
          summary: TAK Server NatsBridgePlugin consumes and fans out to TAK clients.
          message:
            $ref: "#/components/messages/cot"
      tak.cot.out:
        description: CoT from TAK clients (NatsBridgePlugin output, within tak.cot.>).
        subscribe:
          summary: Consumers receive CoT published by TAK Server.
          message:
            $ref: "#/components/messages/cot"
    components:
      messages:
        cot:
          name: CursorOnTarget
          title: Cursor-on-Target event
          contentType: application/xml
          payload:
            type: string
            description: CoT <event> XML document.
---
