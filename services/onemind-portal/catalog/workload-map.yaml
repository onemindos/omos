# Reviewed mapping of generated workloads and Argo CD applications to curated app Components.
# workloads: "<namespace>/<workload>" -> app ref. Workloads not listed land in system:default/unassigned-workloads.
# argoApplications: every Argo CD application -> exactly one app Component. The app carries the primary application in
#   argocd/app-name and lists all of them in onemind.io/argocd-apps; scripts/curate-structure.cjs generates a
#   Resource argocd-app-<name> (with its own argocd/app-name) for every other application, so each one is shown by the Argo CD plugin.
# primaryArgoApplication: app name -> the application its argocd/app-name shows, when the default choice is wrong.
# Checked by scripts/test-catalog-structure.cjs.
