# Reviewed exceptions to the F5 coverage contract (scripts/audit-catalog.cjs).
# An app listed here is allowed to lack one capability, for the stated reason. Add a line only after review;
# delete it once the annotation exists (a stale exception fails the audit). Capabilities:
#   argocd, kubernetes, grafana-dashboard, grafana-alerts, logs, runbook, source
exceptions:
  - app: component:default/nui
    capability: argocd
    reason: >-
      Deployed from platform/nats-tools by the Argo application platform-nats-tools, which the reviewed workload map
      attributes to the nats app (one Argo application maps to one app). It has no Argo application of its own.
  - app: component:default/nats-surveyor
    capability: argocd
    reason: >-
      Deployed from platform/monitoring by the Argo application platform-monitoring, which the reviewed workload map
      attributes to the grafana app. It has no Argo application of its own.
  - app: component:default/tileserver-gl
    capability: argocd
    reason: >-
      Deployed from platform/onetak by the Argo application platform-onetak, which the reviewed workload map
      attributes to the onetak app. It has no Argo application of its own.
  - app: component:default/webodm
    capability: argocd
    reason: >-
      Deployed from platform/onetak by the Argo application platform-onetak, which the reviewed workload map
      attributes to the onetak app. It has no Argo application of its own.
  - app: component:default/agent-monitor
    capability: argocd
    reason: >-
      Deployed from platform/hermes/agent-fabric by the Argo application platform-agent-fabric, which the reviewed
      workload map attributes to the agent-web-ui app. It has no Argo application of its own.
  - app: component:default/hubble-ui
    capability: argocd
    reason: "Cluster add-on in kube-system installed and managed by DigitalOcean Kubernetes, not by an Argo CD application in Git."
  - app: component:default/geo-data-services
    capability: argocd
    reason: >-
      Its workload (onetak/tile38) is applied by the platform-onetak Argo CD application, which catalog/workload-map.yaml
      maps to the onetak app; this app has no Argo CD application of its own.
  - app: component:default/clickhouse
    capability: kubernetes
    reason: >-
      Workloads span the clickhouse and kube-system namespaces and share no label key, so no single selector can
      scope them. Each workload entity has its own Kubernetes selector.
  - app: component:default/platform-core
    capability: kubernetes
    reason: >-
      Workloads span the github-runner and kube-system namespaces and share no label key, so no single selector can
      scope them. Each workload entity has its own Kubernetes selector.
  - app: component:default/platform-backup-recovery
    capability: kubernetes
    reason: >-
      No Deployment or StatefulSet is recorded for this app (it runs DaemonSets or CronJobs, which the inventory
      does not read yet), so no namespace or selector can be generated without guessing.
  - app: component:default/platform-backup-recovery
    capability: grafana-alerts
    reason: >-
      The Grafana alert selector is scoped by namespace, and no namespace is recorded for this app (no Deployment or
      StatefulSet in the inventory).
  - app: component:default/platform-backup-recovery
