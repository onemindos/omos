enableExperimentalRedirectFlow: true
app:
  title: OneMind OS
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    - theme:app/light: false
    - theme:app/dark: false
    - app-root-element:announcements/banner: false
    - nav-item:announcements
    - page:tech-radar:
        config:
          pageTitle: OneMind Technology Radar
          subtitle: Git-owned technology choices; this is not a live health report
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock:
        config:
          clockConfigs:
            - {label: New York, timeZone: America/New_York}
            - {label: UTC, timeZone: UTC}
          customTimeFormat: {hour12: false}
    - home-page-widget:home/toolkit:
        config:
          tools:
            - {url: /today, label: Today, icon: dashboard}
            - {url: /systems, label: Systems, icon: kind:system}
            - {url: /docs, label: Runbooks, icon: docs}
            - {url: /assistant, label: Assistant, icon: chat}
            - {url: /offline, label: Offline knowledge, icon: docs}
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: OneMindDirectory
              column: 0
              row: 2
              width: 8
              height: 22
              deletable: false
            - component: HomePageWorldClock
              column: 8
              row: 2
              width: 4
              height: 4
            - component: HomePageToolkit
              column: 8
              row: 6
              width: 4
              height: 5
            - component: HomePageStarredEntities
              column: 8
              row: 11
              width: 4
              height: 5
            - component: HomePageRecentlyVisited
              column: 8
              row: 16
              width: 4
              height: 8
organization:
  name: OneMind
backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'
  actions:
    pluginSources: [catalog, onemind]
    filter:
      include:
        - attributes: {readOnly: true}
      exclude:
        - attributes: {destructive: true}
auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # The only sign-in provider: Backstage's standard OIDC provider against the Authentik
    # application `onemind-backstage` (redirect URI <portal>/api/auth/oidc/handler/frame).
    oidc:
      production:
        metadataUrl: https://onemind-auth.tail717ba0.ts.net/application/o/onemind-backstage/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        additionalScopes: [offline_access]
  clientIdMetadataDocuments:
    enabled: true
permission:
  enabled: true
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Domain]
  locations:
    - type: file
      target: ../../templates/service-registration/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/service/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/app-onboarding/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/deployment-change/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../templates/recovery-preparation/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../catalog/apps.yaml
    - type: file
      target: ../../catalog/cluster.yaml
    - type: file
      target: ../../catalog/plugins.yaml
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [User, Group]
techdocs:
  builder: external
  publisher:
    type: local
    local:
      publishDirectory: /app/techdocs
mcpActions:
  name: OneMind operational context
  instructions: Treat catalog and runbooks as documented context. Use observation timestamps for live health. No deployment or mutation tools are exposed.
  tracing:
    capture:
      toolPayload: false
integrations:
  github:
    - host: github.com

notifications:
  retention: 90d
  # Lists every topic in each user's native Notifications settings from day one, so any of
  # them can be muted per person. Origins are the producing plugins (onemind = observer,
  # alert routing and daily digest; onemind-events = the authenticated event bridge).
  defaultSettings:
    channels:
      - id: Web
        origins:
          - id: plugin:onemind
            topics:
              - {id: alerts, enabled: true}
              - {id: deployments, enabled: true}
              - {id: backups, enabled: true}
              - {id: digest, enabled: true}
          - id: plugin:onemind-events
            topics:
              - {id: deployments, enabled: true}
              - {id: backups, enabled: true}
              - {id: agents, enabled: true}

# Empty until a dedicated read-only Argo token is provided. No fallback login.
argocd:
  appLocatorMethods: []

grafana:
  domain: https://grafana.tail717ba0.ts.net
  unifiedAlerting: true
  grafanaDashboardMaxPages: 1
  grafanaDashboardSearchLimit: 100

techInsights:
  factRetrievers:
    entityMetadataFactRetriever:
      cadence: '0 */6 * * *'
      lifecycle: {timeToLive: {weeks: 2}}
    entityOwnershipFactRetriever:
      cadence: '0 */6 * * *'
      lifecycle: {timeToLive: {weeks: 2}}
    techdocsFactRetriever:
      cadence: '0 */6 * * *'
      lifecycle: {timeToLive: {weeks: 2}}
  factChecker:
    checks:
      groupOwnerCheck:
        type: json-rules-engine
        name: Group ownership recorded
        description: Catalog metadata names a group owner; this does not certify recovery readiness.
        factIds: [entityOwnershipFactRetriever]
        rule:
          conditions:
            all:
              - fact: hasGroupOwner
                operator: equal
                value: true

      descriptiveMetadataCheck:
        type: json-rules-engine
        name: Service title and description recorded
        description: Metadata completeness only; not availability or recovery certification.
        factIds: [entityMetadataFactRetriever]
        rule:
          conditions:
            all:
              - {fact: hasTitle, operator: equal, value: true}
              - {fact: hasDescription, operator: equal, value: true}
      documentationReferenceCheck:
        type: json-rules-engine
        name: TechDocs reference recorded
        description: A documentation reference exists; this does not prove the runbook is current or recovery was tested.
        factIds: [techdocsFactRetriever]
        rule:
          conditions:
            any:
              - {fact: hasAnnotationBackstageIoTechdocsRef, operator: equal, value: true}
              - {fact: hasAnnotationBackstageIoTechdocsEntity, operator: equal, value: true}

# Internal Events bus only; do not create public webhook topic endpoints.
events:
  http:
    topics: []

onemind:
  # Sidebar and home sections for work that has not shipped yet. Flip each to
  # true in the PR that builds its target (see docs/roadmap/flagship).
  features:
    pillars: false      # F2: SO/LE/HP/GE Domain pages
    digitalocean: false # F6: /digitalocean
    retireApp: false    # F8: retire-app template
  alerts:
    # Bearer token Alertmanager presents at POST /api/events/http/alertmanager. OPTIONAL: when
    # the env var is absent the key is dropped, the route rejects every request (503) and the
    # portal starts normally. See docs/operations/notifications.md.
    webhookToken: ${ONEMIND_ALERT_WEBHOOK_TOKEN}
  inventory:
    # Live Kubernetes inventory (docs/catalog/live-inventory.md). OFF by default: catalog/cluster.yaml
    # stays the authoritative workload source until Zeus enables it. Enabling needs a backend restart.
    live:
      enabled: false
      # frequencySeconds: 120        # cluster observation cadence
      # removedRetentionHours: 24    # how long a removed workload stays flagged before it is dropped
      # excludedNamespaces: [kube-node-lease, kube-public]
      # excludedNamespacePatterns: ['dp-*']   # former OpenChoreo data-plane namespaces (removed); the exclusion is kept
