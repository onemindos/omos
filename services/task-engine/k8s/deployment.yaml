apiVersion: apps/v1
kind: Deployment
metadata:
  name: omos-task-engine
  namespace: onemind
  labels:
    app: omos-task-engine
    component: orchestration
    version: v4.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omos-task-engine
  template:
    metadata:
      labels:
        app: omos-task-engine
        version: v4.0.0
    spec:
      containers:
      - name: engine
        image: ghcr.io/onemindos/omos-task-engine:v4.0.0
        imagePullPolicy: Always
        env:
        - name: NATS_URL
          value: "nats://nats.onemind.svc.cluster.local:4222"
        - name: NATS_NAME
          value: "omos-task-engine"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "nats --server=$NATS_URL micro info omos-task-engine"
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "nats --server=$NATS_URL micro info omos-task-engine"
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: omos-task-engine
  namespace: onemind
  labels:
    app: omos-task-engine
spec:
  selector:
    app: omos-task-engine
  ports:
  - name: nats
    port: 4222
    targetPort: 4222
  clusterIP: None
---
# Horizontal scaling note: currently single-replica by design.
# The dispatch engine uses JetStream KV for coordination — adding
# replicas requires leader election or partition logic. The schedule
# loop (scheduleLoop) runs in-process and would need dedup across replicas.
# For now: single-replica, K8s handles restarts.
