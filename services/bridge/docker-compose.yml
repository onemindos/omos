version: "3.9"

services:
  nats:
    image: nats:latest
    container_name: omos-nats
    command: ["-js", "-m", "8222", "--name", "omos-dev"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring HTTP
      - "8080:8080"   # websocket (if enabled)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-box:
    image: natsio/nats-box:latest
    container_name: omos-nats-box
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      - NATS_URL=nats://nats:4222
    # Usage: docker compose exec nats-box nats sub "omos.>"

  # Optional: NATS surveyor for Prometheus metrics
  # surveyor:
  #   image: natsio/nats-surveyor:latest
  #   depends_on:
  #     nats:
  #       condition: service_healthy
  #   command: ["-s", "nats://nats:4222", "--count", "1"]
  #   ports:
  #     - "7777:7777"

networks:
  default:
    name: omos-bridge-dev
