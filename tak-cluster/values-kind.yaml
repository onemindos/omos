# OneMind local rehearsal values (kind cluster "tak", namespace "takserver")
# Local images loaded via `kind load`; IfNotPresent so kubelet never hits a registry.
imagePullSecret: reg-cred
imagePullPolicy: IfNotPresent
certConfigMapName: cert-migration
coreConfigMapName: core-config
takIgniteConfigMapName: tak-ignite-config

takserver:
  namespace: takserver
  ingress:
    enabled: false
  config:
    image:
      repository: takserver-config
      tag: 5.7-onemind
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: 1Gi }
      limits:   { cpu: "1",    memory: 1536Mi }
  messaging:
    image:
      repository: takserver-messaging
      tag: 5.7-onemind
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: 2Gi }
      limits:   { cpu: "2",    memory: 3Gi }
  api:
    image:
      repository: takserver-api
      tag: 5.7-onemind
    replicas: 1
    resources:
      requests: { cpu: "500m", memory: 2Gi }
      limits:   { cpu: "2",    memory: 3Gi }
  plugins:
    enabled: true
    image:
      repository: takserver-plugins
      tag: 5.7-onemind
    replicas: 1
    resources:
      requests: { cpu: "250m", memory: 1Gi }
      limits:   { cpu: "1",    memory: 1536Mi }
  takserverDatabaseSetup:
    image:
      repository: takserver-database-setup
      tag: 5.7-onemind
  limits:
    persistentVolumeClaims: '6'
    requests:
      storage: 20Gi
    storage:
      max: 10Gi
      min: 1Gi

global:
  postgresql:
    host: takserver-postgresql
    port: "5432"
    auth:
      postgresqlUsername: postgres
      postgresqlPassword: postgres
      postgresqlDatabase: cot
      username: postgres
      password: postgres
      database: cot

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgis/postgis
    tag: 15-3.4
  configurationConfigMap: postgres-configuration
  primary:
    resources:
      requests: { cpu: "250m", memory: 512Mi }

ignite:
  image:
    repository: docker-devtest-local.artifacts.tak.gov/takserver-cluster/takserver-ignite
    tag: 2.17.0
    pullPolicy: IfNotPresent
  serviceAccount:
    name: takserver-ignite

nats:
  image:
    tag: 1.0.1
  config:
    jetstream:
      enabled: true
    cluster:
      enabled: false
      auth:
        enabled: false
