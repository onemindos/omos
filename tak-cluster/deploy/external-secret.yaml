apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tak-nats-leaf
  namespace: takserver
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tak-nats-leaf
    creationPolicy: Owner
  data:
    - secretKey: leaf.conf
      remoteRef:
        key: tak-nats-leaf
        property: leaf.conf
    - secretKey: ca.crt
      remoteRef:
        key: tak-nats-leaf
        property: ca.crt
