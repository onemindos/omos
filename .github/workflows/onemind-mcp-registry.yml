name: Seal OneMind MCP registry credential
on:
  push:
    branches: [codex/onemind-mcp-registry]
    paths:
      - scripts/seal_onemind_mcp_registry.py
      - scripts/data/onemind-mcp-sealing.crt
      - .github/workflows/onemind-mcp-registry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - run: pip install PyYAML==6.0.3
      - name: Install checksum-verified kubeseal
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kubeseal.tgz" \
            https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.41.2/kubeseal-0.41.2-linux-amd64.tar.gz
          echo '666b5db6788ad1dedb56e2d97064e1cc3779aa77bbd6f4b56b62beeb1941ed79  '"$RUNNER_TEMP/kubeseal.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeseal.tgz" -C "$RUNNER_TEMP" kubeseal
      - name: Verify pull access and seal the credential
        env:
          ONEMIND_MCP_GHCR_PULL_TOKEN: ${{ secrets.ONEMIND_MCP_GHCR_PULL_TOKEN }}
          KUBESEAL: ${{ runner.temp }}/kubeseal
          SEALED_OUTPUT: ${{ runner.temp }}/registry.sealedsecret.yaml
        run: python scripts/seal_onemind_mcp_registry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onemind-mcp-registry-sealed
          path: ${{ runner.temp }}/registry.sealedsecret.yaml
          retention-days: 1
