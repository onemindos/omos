name: Build Platform Backup
on:
  push:
    branches: [main]
    paths: ['platform/backups/image/**', '.github/workflows/build-platform-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '15'
            postgres: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          - version: '16'
            postgres: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          - version: '17'
            postgres: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install boto3 cryptography 'moto[server]'
      - name: Test backup integrity and restore isolation
        run: python -m unittest discover -s platform/backups/image -p 'test_*.py'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: platform/backups/image
          build-args: POSTGRES_IMAGE=${{ matrix.postgres }}
          load: true
          tags: platform-backup:test
      - name: Test real PostgreSQL and NATS restores with synthetic data
        env:
          POSTGRES_TEST_IMAGE: ${{ matrix.postgres }}
        run: bash platform/backups/image/integration.sh platform-backup:test
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: platform/backups/image
          build-args: POSTGRES_IMAGE=${{ matrix.postgres }}
          push: true
          tags: ghcr.io/onemindos/platform-backup:postgres-${{ matrix.version }}-sha-${{ github.sha }}
      - name: Save image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > platform-backup-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: platform-backup-image-${{ matrix.version }}
          path: platform-backup-image-digest.txt
