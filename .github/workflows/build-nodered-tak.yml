name: Build Node-RED TAK image

on:
  pull_request:
    paths:
      - services/nodered-tak/**
      - .github/workflows/build-nodered-tak.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed image to GHCR (record digest before deployment)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/nodered-tak/package-lock.json
      - name: Locked dependencies and offline/auth smoke tests
        working-directory: services/nodered-tak
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/nodered-tak
          load: true
          push: false
          tags: onemind-nodered-tak:smoke
      - name: Container smoke test with an ephemeral key and password
        run: node services/nodered-tak/test/image-smoke.cjs
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR for an explicitly requested publication
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/nodered-tak
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/onemindos/nodered-tak:5.0.9-tak4.2.2-r1
            ghcr.io/onemindos/nodered-tak:sha-${{ github.sha }}
      - name: Record immutable activation reference
        if: steps.publish.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "ghcr.io/onemindos/nodered-tak@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
