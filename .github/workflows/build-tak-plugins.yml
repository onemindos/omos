name: Build TAK Plugins → GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tak-plugins.yml"
      - "tak-cluster/docker/Dockerfile.takserver-plugins.onemind"
      - "tak-cluster/plugin/**"

jobs:
  build-push:
    name: Build ghcr.io/onemindos/takserver-plugins:5.7-onemind
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout omos-infra
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer the NatsBridgePlugin on top of the existing plugins image.
      # ghcr.io/onemindos/takserver-plugins is public — no pull auth needed.
      # /lib → /usr/lib in the base image (Debian symlink), so COPY to lib/ puts
      # the JAR on the Spring loader.path (loader.path=file:lib/ in takserver-pm.jar).
      # conf/plugins/ is where PluginSystemConfiguration (PLUGIN_CONFIG_BASE) reads YAML.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tak-cluster/plugin
          push: true
          tags: ghcr.io/onemindos/takserver-plugins:5.7-onemind
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: tak-cluster/docker/Dockerfile.takserver-plugins-patch.onemind
