name: Build TAK Plugins → GHCR

on:
  workflow_dispatch:
  # NOTE: CI builds fail because GITHUB_TOKEN (org-scoped) cannot pull
  # ghcr.io/onemindos/takserver-plugins (owned by zeus personal account) even when public.
  # Build locally with:
  #   docker buildx build --platform linux/amd64 \
  #     -f tak-cluster/docker/Dockerfile.takserver-plugins-patch.onemind \
  #     -t ghcr.io/onemindos/takserver-plugins:5.7-onemind --push \
  #     tak-cluster/plugin
  # push:
  #   branches: [main]
  #   paths:
  #     - ".github/workflows/build-tak-plugins.yml"
  #     - "tak-cluster/docker/Dockerfile.takserver-plugins.onemind"
  #     - "tak-cluster/plugin/**"

jobs:
  build-push:
    name: Build ghcr.io/onemindos/takserver-plugins:5.7-onemind
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout omos-infra
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer the NatsBridgePlugin on top of the existing plugins image.
      # ghcr.io/onemindos/takserver-plugins is public but CI token gets 403 on pull
      # because the package is owned by zeus personal account not the org.
      # This step will fail in CI — use local docker buildx build instead (see above).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tak-cluster/plugin
          push: true
          tags: ghcr.io/onemindos/takserver-plugins:5.7-onemind
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: tak-cluster/docker/Dockerfile.takserver-plugins-patch.onemind
