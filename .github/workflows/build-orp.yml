name: Build ORP → GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-orp.yml"
      - "platform/orp/Dockerfile"

jobs:
  build-push:
    name: Build ghcr.io/onemindos/orp:latest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout omos-infra
        uses: actions/checkout@v4

      - name: Checkout ORP source (public repo — no token needed)
        uses: actions/checkout@v4
        with:
          repository: shieldofsteel/orp
          path: _orp_src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=50000000

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy patched Dockerfile into ORP source
        run: cp platform/orp/Dockerfile _orp_src/Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: _orp_src
          push: true
          tags: ghcr.io/onemindos/orp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
