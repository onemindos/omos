name: Build NATS Tools → GHCR

# Builds all NATS management UIs and agent observability tools from upstream
# source and pushes to ghcr.io/onemindos/<name>:latest.
#
# Images built:
#   nats-dashboard  — pre-wired to K8s cluster via sys user
#   nats-ui         — static nginx, manual connect
#   heynats         — Go + Vue, raw TCP NATS
#   nui             — Go + React, persistent KV store
#   natscope        — Go gRPC, full JetStream management
#   cobra-nats      — Next.js, KV / streams / object store
#   gastbob-nats-ui — React 19, lightweight
#   agenttap        — Wireshark for AI agents (M64GitHub upstream + onemindos patches)
#   agent-web-ui    — Synadia Agent Protocol browser client (synadia-ai upstream)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-nats-tools.yml"
      - "platform/nats-tools/**"
  workflow_dispatch:
    inputs:
      tool:
        description: "Build a single tool (leave empty to build all)"
        required: false
        default: ""

jobs:
  build:
    name: Build ${{ matrix.tool.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: nats-dashboard
            # Original work in onemindos org — not an upstream clone
            repo: https://github.com/onemindos/nats-dashboard.git
            dockerfile: Dockerfile
            context: .
          - name: nats-ui
            # Original work in onemindos org — not an upstream clone
            repo: https://github.com/onemindos/nats-ui.git
            dockerfile: docker/Dockerfile
            context: .
          - name: heynats
            repo: https://github.com/astergaze-solutions/heynats.git
            dockerfile: Dockerfile
            context: .
          - name: nui
            repo: https://github.com/nats-nui/nui.git
            dockerfile: Dockerfile
            context: .
            build_args: "VERSION=latest"
          - name: natscope
            repo: https://github.com/dmit-4884/natscope.git
            dockerfile: Dockerfile
            context: .
          - name: cobra-nats
            repo: https://github.com/maatini/cobra-nats.git
            dockerfile: Dockerfile
            context: .
          - name: gastbob-nats-ui
            repo: https://github.com/gastbob40/nats-ui.git
            dockerfile: docker/Dockerfile
            context: .
          - name: agenttap
            repo: https://github.com/onemindos/agenttap.git
            dockerfile: Dockerfile
            context: .
          - name: agent-web-ui
            # Lives inside synadia-ai/synadia-agents monorepo — no upstream Dockerfile,
            # omos-infra supplies one via platform/nats-tools/agent-web-ui/Dockerfile.
            # context is monorepo root so the local SDK file: dep resolves.
            repo: https://github.com/synadia-ai/synadia-agents.git
            dockerfile: examples/agent-web-ui/Dockerfile
            context: .

    steps:
      - name: Skip if not selected tool
        if: ${{ github.event.inputs.tool != '' && github.event.inputs.tool != matrix.tool.name }}
        run: echo "Skipping ${{ matrix.tool.name }}" && exit 0

      - name: Checkout omos-infra (for patched Dockerfiles)
        uses: actions/checkout@v4
        with:
          path: omos-infra

      - name: Clone upstream source
        run: git clone --depth 1 ${{ matrix.tool.repo }} src

      - name: Apply Dockerfile fixes
        # Copy patched Dockerfiles from omos-infra if they exist
        run: |
          FIXED_DOCKERFILE="omos-infra/platform/nats-tools/${{ matrix.tool.name }}/Dockerfile"
          if [ -f "$FIXED_DOCKERFILE" ]; then
            mkdir -p "src/$(dirname ${{ matrix.tool.dockerfile }})"
            cp "$FIXED_DOCKERFILE" "src/${{ matrix.tool.dockerfile }}"
            echo "Applied fixed Dockerfile for ${{ matrix.tool.name }}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.tool.context }}
          file: src/${{ matrix.tool.dockerfile }}
          push: true
          tags: ghcr.io/onemindos/${{ matrix.tool.name }}:latest
          build-args: ${{ matrix.tool.build_args }}
          cache-from: type=gha,scope=${{ matrix.tool.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tool.name }}
          platforms: linux/amd64,linux/arm64
