name: Build OneTAK → GHCR

# Builds ghcr.io/onemindos/onetak-{api,events,tiles}:latest from onemindos/OneTAK.
# Plugins live in-repo (api/web/plugins/onemind/) — no external clone needed.
#
# Triggers:
#   - Push to omos-infra main (workflow file changes)
#   - repository_dispatch from OneTAK repo (fork-updated)
#   - Manual workflow_dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-onetak.yml"
  repository_dispatch:
    types: [fork-updated]
  workflow_dispatch:

jobs:
  build-push:
    name: Build ghcr.io/onemindos/onetak-*:latest
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Clone OneTAK
        run: |
          rm -rf onetak
          git clone --depth 1 https://github.com/onemindos/OneTAK.git onetak
          echo "OneTAK cloned at $(git -C onetak rev-parse --short HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push OneTAK API image
        uses: docker/build-push-action@v6
        with:
          context: onetak/api
          file: onetak/api/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/onetak-api:latest
            ghcr.io/onemindos/onetak-api:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/onemindos/onetak-api:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/onetak-api:cache,mode=max
          platforms: linux/amd64

      - name: Build and push OneTAK Tiles image
        uses: docker/build-push-action@v6
        with:
          context: onetak
          file: onetak/tasks/pmtiles/Dockerfile.compose
          push: true
          tags: |
            ghcr.io/onemindos/onetak-tiles:latest
            ghcr.io/onemindos/onetak-tiles:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/onemindos/onetak-tiles:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/onetak-tiles:cache,mode=max
          platforms: linux/amd64

      - name: Build and push OneTAK Events image
        uses: docker/build-push-action@v6
        with:
          context: onetak
          file: onetak/tasks/events/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/onetak-events:latest
            ghcr.io/onemindos/onetak-events:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/onemindos/onetak-events:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/onetak-events:cache,mode=max
          platforms: linux/amd64

      - name: Record GitOps deployment boundary
        run: |
          echo 'Images published. Deploy only through a reviewed manifest digest PR and Argo sync.'
