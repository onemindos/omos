name: Build Intel Services → GHCR

# Builds all omos-intel droplet services from upstream source and pushes to GHCR.
# Images built:
#   worldmonitor         — main app (koala73/worldmonitor)
#   worldmonitor-relay   — AIS relay sidecar (koala73/worldmonitor, Dockerfile.relay)
#   worldmonitor-redis-rest — Redis REST proxy (koala73/worldmonitor, docker/Dockerfile.redis-rest)
#   osiris               — main app (simplifaisoul/osiris)
#   osiris-intel         — ontology engine (simplifaisoul/osiris, intel/Dockerfile)
#   worldwideview        — geo-intelligence app (silvertakana/worldwideview)
#   crucix               — OSINT intelligence engine (calesthio/Crucix)
#
# Note: shadowbroker uses upstream images directly (ghcr.io/bigbodycobain/shadowbroker-*)
# and is not built here.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-intel-services.yml"
      - "platform/intel/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Build a single service (leave empty to build all)"
        required: false
        default: ""

jobs:
  build:
    name: Build ${{ matrix.service.name }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: worldmonitor
            repo: https://github.com/koala73/worldmonitor.git
            dockerfile: Dockerfile
            context: .
          - name: worldmonitor-relay
            repo: https://github.com/koala73/worldmonitor.git
            dockerfile: Dockerfile.relay
            context: .
          - name: worldmonitor-redis-rest
            repo: https://github.com/koala73/worldmonitor.git
            dockerfile: docker/Dockerfile.redis-rest
            context: docker
          - name: osiris
            repo: https://github.com/simplifaisoul/osiris.git
            dockerfile: Dockerfile
            context: .
          - name: osiris-intel
            repo: https://github.com/simplifaisoul/osiris.git
            dockerfile: intel/Dockerfile
            context: intel
          - name: worldwideview
            repo: https://github.com/silvertakana/worldwideview.git
            dockerfile: Dockerfile
            context: .
            # arm64 Prisma generate fails under QEMU — cluster is amd64 only
            platforms: linux/amd64
          - name: crucix
            repo: https://github.com/calesthio/Crucix.git
            dockerfile: Dockerfile
            context: .

    steps:
      - name: Skip if not selected service
        if: ${{ github.event.inputs.service != '' && github.event.inputs.service != matrix.service.name }}
        run: echo "Skipping ${{ matrix.service.name }}" && exit 0

      - name: Checkout omos-infra (for patched Dockerfiles)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: omos-infra

      - name: Clone upstream source
        run: git clone --depth 1 ${{ matrix.service.repo }} src

      - name: Apply Dockerfile fixes
        run: |
          FIXED="omos-infra/platform/intel/${{ matrix.service.name }}/Dockerfile"
          if [ -f "$FIXED" ]; then
            mkdir -p "src/$(dirname ${{ matrix.service.dockerfile }})"
            cp "$FIXED" "src/${{ matrix.service.dockerfile }}"
            echo "Applied patched Dockerfile for ${{ matrix.service.name }}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/${{ matrix.service.context }}
          file: src/${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/onemindos/${{ matrix.service.name }}:latest
          cache-from: type=registry,ref=ghcr.io/onemindos/${{ matrix.service.name }}:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/${{ matrix.service.name }}:cache,mode=max
          platforms: ${{ matrix.service.platforms || 'linux/amd64,linux/arm64' }}
