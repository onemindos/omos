name: Build tak-client
# Tests the TAK Server client bridge (unit tests, the scripted TAK-stream peer, and
# integration against a disposable nats-server) on every PR that touches it, and on main
# builds ghcr.io/onemindos/omos-tak-client with the tags sha-<commit> and the version in
# services/bridge/bridges/tak-client/VERSION. The digest is uploaded as an artifact; pin it
# in platform/takserver/tak-client/deployment.yaml.
on:
  push:
    branches: [main]
    paths:
      - services/bridge/bridges/tak-client/**
      - .github/workflows/build-tak-client.yml
  pull_request:
    paths:
      - services/bridge/bridges/tak-client/**
      - .github/workflows/build-tak-client.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tak-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bridge/bridges/tak-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.4"
          cache: false
      - name: Install nats-server
        run: go install github.com/nats-io/nats-server/v2@v2.14.9
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: NATS_SERVER_BIN="$(go env GOPATH)/bin/nats-server" go test -race -count=1 -v ./...
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < services/bridge/bridges/tak-client/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: services/bridge/bridges/tak-client
          push: true
          tags: |
            ghcr.io/onemindos/omos-tak-client:sha-${{ github.sha }}
            ghcr.io/onemindos/omos-tak-client:${{ steps.version.outputs.version }}
          platforms: linux/amd64
          cache-from: type=gha,scope=omos-tak-client
          cache-to: type=gha,mode=max,scope=omos-tak-client
      - name: Record image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omos-tak-client-image
          path: image-digest.txt
