name: Build CloudTAK → GHCR

# Builds ghcr.io/onemindos/cloudtak-api:latest from upstream dfpc-coe/CloudTAK
# with the OneMind plugins loaded via WEB_PLUGINS at build time.
#
# Plugins (source of truth — standalone repos):
#   onemindos/omos-ai-plugin   — Legacy AI chat panel, bottom bar
#   onemindos/omos-nats-plugin — NATS fabric operator console
#
# Upstream CloudTAK Dockerfile runs: node bin/plugin.ts
# which git-clones each WEB_PLUGINS URL into api/web/plugins/<name>/
# then the Vite build picks them up via glob: ../plugins/*/index.ts
#
# Trigger this workflow manually or push to either plugin repo
# (each has a repository_dispatch webhook targeting omos-infra).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cloudtak.yml"
  repository_dispatch:
    types: [plugin-updated]
  workflow_dispatch:

jobs:
  build-push:
    name: Build ghcr.io/onemindos/cloudtak-api:latest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve latest CloudTAK release tag
        id: cloudtak_version
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/dfpc-coe/CloudTAK/releases/latest \
            | jq -r .tag_name)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "CloudTAK latest: ${TAG}"

      - name: Clone CloudTAK upstream at latest tag
        run: |
          git clone --depth 1 --branch "${{ steps.cloudtak_version.outputs.tag }}" \
            https://github.com/dfpc-coe/CloudTAK.git cloudtak-upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CloudTAK API image
        uses: docker/build-push-action@v6
        with:
          context: cloudtak-upstream/api
          file: cloudtak-upstream/api/Dockerfile
          push: true
          build-args: |
            WEB_PLUGINS=https://github.com/onemindos/omos-ai-plugin.git,https://github.com/onemindos/omos-nats-plugin.git
          tags: |
            ghcr.io/onemindos/cloudtak-api:latest
            ghcr.io/onemindos/cloudtak-api:${{ steps.cloudtak_version.outputs.tag }}-onemind
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
