name: Build OMOS (CloudTAK Fork) → GHCR

# Builds ghcr.io/onemindos/cloudtak-api:latest from our fork (Zeus-Delacruz/CloudTAK)
# with OneMind plugins cloned into the build context.
#
# Source: Zeus-Delacruz/CloudTAK (main branch) — our fork with OMOS additions
#
# Plugins (standalone repos, cloned at build time):
#   onemindos/cloudtak-plugin-legacy-ai — Legacy AI chat panel, bottom bar
#   onemindos/cloudtak-plugin-nats      — NATS fabric operator console
#
# The Dockerfile runs: node bin/plugin.ts
# which picks up plugins already in api/web/plugins/ (we pre-clone them here).
#
# Triggers:
#   - Push to omos-infra main (workflow file changes)
#   - repository_dispatch from plugin repos (plugin-updated)
#   - repository_dispatch from CloudTAK fork (fork-updated)
#   - Manual workflow_dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cloudtak.yml"
  repository_dispatch:
    types: [plugin-updated, fork-updated]
  workflow_dispatch:

jobs:
  build-push:
    name: Build ghcr.io/onemindos/cloudtak-api:latest
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Clone OMOS fork (Zeus-Delacruz/CloudTAK)
        run: |
          rm -rf omos
          git clone --depth 1 https://github.com/Zeus-Delacruz/CloudTAK.git omos
          echo "OMOS fork cloned at $(git -C omos rev-parse --short HEAD)"

      - name: Clone plugins into build context
        run: |
          PLUGINS_DIR=omos/api/web/plugins
          mkdir -p "$PLUGINS_DIR"

          git clone --depth 1 https://github.com/onemindos/cloudtak-plugin-legacy-ai.git \
            "$PLUGINS_DIR/cloudtak-plugin-legacy-ai"
          git clone --depth 1 https://github.com/onemindos/cloudtak-plugin-nats.git \
            "$PLUGINS_DIR/cloudtak-plugin-nats"

          # Inject plugin deps into package.json so Docker's npm install picks them up.
          # No npm ci / package-lock step needed — Dockerfile uses plain npm install.
          cd omos/api/web
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['nats.ws'] = pkg.dependencies['nats.ws'] || '^1.30.3';
            pkg.dependencies['lucide-vue-next'] = pkg.dependencies['lucide-vue-next'] || '^0.513.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 4));
            console.log('Plugin deps injected into package.json');
          "
          echo "Plugin context ready"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push OMOS API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: omos/api
          file: omos/api/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/cloudtak-api:latest
            ghcr.io/onemindos/cloudtak-api:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/onemindos/cloudtak-api:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/cloudtak-api:cache,mode=max
          platforms: linux/amd64

      - name: Build and push OMOS Tiles image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: omos
          file: omos/tasks/pmtiles/Dockerfile.compose
          push: true
          tags: |
            ghcr.io/onemindos/cloudtak-tiles:latest
            ghcr.io/onemindos/cloudtak-tiles:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/onemindos/cloudtak-tiles:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/cloudtak-tiles:cache,mode=max
          platforms: linux/amd64

      - name: Build and push OMOS Events image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: omos
          file: omos/tasks/events/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/cloudtak-events:latest
            ghcr.io/onemindos/cloudtak-events:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/onemindos/cloudtak-events:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/cloudtak-events:cache,mode=max
          platforms: linux/amd64

      - name: Record GitOps deployment boundary
        run: |
          echo 'Images published. Deploy only through a reviewed manifest digest PR and Argo sync.'
