name: Build CloudTAK → GHCR

# Builds ghcr.io/onemindos/cloudtak-api:latest from upstream dfpc-coe/CloudTAK
# with the OneMind AI plugin compiled in.
#
# Plugin source: platform/cloudtak/plugin-onemind-ai/ (this repo)
# Plugin destination: api/web/plugins/onemind-ai/ inside the upstream clone
#
# CloudTAK's main.ts glob-imports  ../plugins/*/index.ts  at Vite build time —
# dropping our plugin folder there is all it takes to compile it in.
# No WEB_PLUGINS build arg needed; plugin is baked via COPY in the Dockerfile.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cloudtak.yml"
      - "platform/cloudtak/plugin-onemind-ai/**"
  workflow_dispatch:

jobs:
  build-push:
    name: Build ghcr.io/onemindos/cloudtak-api:latest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout omos-infra
        uses: actions/checkout@v4

      - name: Resolve latest CloudTAK release tag
        id: cloudtak_version
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/dfpc-coe/CloudTAK/releases/latest \
            | jq -r .tag_name)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "CloudTAK latest: ${TAG}"

      - name: Clone CloudTAK upstream at latest tag
        run: |
          git clone --depth 1 --branch "${{ steps.cloudtak_version.outputs.tag }}" \
            https://github.com/dfpc-coe/CloudTAK.git cloudtak-upstream

      - name: Copy OneMind AI plugin into CloudTAK plugin directory
        # main.ts glob: ../plugins/*/index.ts — plugin dir must be api/web/plugins/<name>/
        run: |
          PLUGIN_DST=cloudtak-upstream/api/web/plugins/onemind-ai
          mkdir -p "$PLUGIN_DST"
          cp -r platform/cloudtak/plugin-onemind-ai/. "$PLUGIN_DST/"
          echo "==> Plugin files copied:"
          find "$PLUGIN_DST" -type f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CloudTAK API image
        uses: docker/build-push-action@v6
        with:
          # Context is the cloudtak-upstream/api dir (Dockerfile lives there)
          context: cloudtak-upstream/api
          file: cloudtak-upstream/api/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/cloudtak-api:latest
            ghcr.io/onemindos/cloudtak-api:${{ steps.cloudtak_version.outputs.tag }}-onemind
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
