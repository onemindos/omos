name: Build Backstage Backup
on:
  push:
    branches: [main, 'feat/onemind-backstage']
    paths: ['platform/backstage/backup-image/**', '.github/workflows/build-backstage-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: platform/backstage/backup-image
          push: true
          tags: ghcr.io/onemindos/backstage-backup:sha-${{ github.sha }}
      - run: printf '%s\n' '${{ steps.image.outputs.digest }}' > backup-image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backstage-backup-image
          path: backup-image-digest.txt
