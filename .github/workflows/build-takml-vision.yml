name: build takml-vision image

on:
  push:
    branches: [main]
    paths:
      - "platform/takml/vision/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/takml-vision

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: platform/takml/vision
          push: true
          # Immutable tag only (same sha-<commit> scheme as the other build-*.yml
          # workflows). platform/takml/deployment.yaml pins the image by digest;
          # nothing references the old mutable :1 / :latest tags.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
