name: build takml-vision image

on:
  push:
    branches: [main]
    paths:
      - "platform/takml/vision/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/takml-vision

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: platform/takml/vision
          push: true
          tags: |
            ${{ env.IMAGE }}:1
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
