name: Build OneMind Portal
on:
  push:
    branches: [main, 'feat/onemind-backstage', 'codex/onemind-portal-missions']
    paths:
      - apps/onemind-portal/**
      - .github/workflows/build-onemind-portal.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: onemind-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/onemind-portal
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      AUTH_SESSION_SECRET: build-only-not-a-runtime-secret
      AUTH_OIDC_CLIENT_ID: build-only
      AUTH_OIDC_CLIENT_SECRET: build-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install mkdocs-techdocs-core==1.7.1
      - name: Generate OneMind TechDocs
        run: bash scripts/build-techdocs.sh
      - run: yarn build:backend
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: apps/onemind-portal
          file: apps/onemind-portal/packages/backend/Dockerfile
          push: true
          tags: ghcr.io/onemindos/onemind-portal:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onemind-portal-image
          path: apps/onemind-portal/image-digest.txt
