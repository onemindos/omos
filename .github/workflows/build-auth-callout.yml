name: Build auth callout
# FEATURES J2: tests on every PR that touches the callout, the role map or the policy
# service's role handling; image to GHCR (ghcr.io/onemindos/auth-callout:sha-<commit>) on main.
# platform/auth-callout/deployment.yaml references the tag; pin its digest from this run's
# image-digest artifact.
on:
  push:
    branches: [main]
    paths:
      - services/auth-callout/**
      - platform/security/roles/**
      - platform/auth-callout/**
      - .github/workflows/build-auth-callout.yml
  pull_request:
    branches: [main]
    paths:
      - services/auth-callout/**
      - platform/security/roles/**
      - platform/auth-callout/**
      - .github/workflows/build-auth-callout.yml
permissions:
  contents: read
concurrency:
  group: auth-callout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/auth-callout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: services/auth-callout/go.mod
          cache-dependency-path: services/auth-callout/go.sum
      - run: go vet ./...
      # In-process nats-server v2.14.2 (the live version) with the auth_callout block,
      # a stand-in Authentik JWKS, WebSocket and leaf listeners. Keys are generated per run.
      - run: go test -race -count=1 ./...
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: services
          file: services/auth-callout/Dockerfile
          push: true
          tags: ghcr.io/onemindos/auth-callout:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=auth-callout
          cache-to: type=gha,mode=max,scope=auth-callout
      - name: Record image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-callout-image
          path: image-digest.txt
