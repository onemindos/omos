name: NATS identities tests

# Per-service NATS identities (FEATURES A19): the spec invariants and generated Helm values
# (scripts/nats_identities.py check), their unit tests, and the permission tests that run the
# rendered config on an in-process nats-server pinned to the live version
# (platform/nats/identities/permtest). Test-only passwords are generated per run in a temp
# directory; nothing here touches the cluster.

on:
  pull_request:
    paths:
      - ".github/workflows/test-nats-identities.yml"
      - "platform/nats/identities/**"
      - "platform/nats/values.identities.*.template.yaml"
      - "scripts/nats_identities.py"
      - "scripts/tests/test_nats_identities.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-nats-identities.yml"
      - "platform/nats/identities/**"
      - "platform/nats/values.identities.*.template.yaml"
      - "scripts/nats_identities.py"
      - "scripts/tests/test_nats_identities.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The self-hosted image does not ship a pinned Python with pip: install one per job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: Spec invariants and generated values are current
        run: python scripts/nats_identities.py check

      - name: Renderer unit tests
        run: python -m unittest scripts/tests/test_nats_identities.py -v

      # The zeus-v2 runner has a 1 GiB memory limit (platform/core/github-runner.yaml). Compiling the
      # embedded nats-server with default parallelism, or with -race, exhausted it on the first run
      # (runner container restarted). Build serially under a soft memory limit and run without
      # -race here; the -race run is done before merge (onemind-xr docs/evidence/M1/A19).
      - name: gofmt, go vet and permission tests
        working-directory: platform/nats/identities/permtest
        env:
          PYTHON: python
          GOFLAGS: -p=1
          GOMAXPROCS: "1"
          GOMEMLIMIT: 600MiB
          GOGC: "50"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/permtest.txt"; test "${PIPESTATUS[0]}" -eq 0
