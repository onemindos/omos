name: NATS identities tests

# Per-service NATS identities (FEATURES A19): the spec invariants and generated Helm values
# (scripts/nats_identities.py check) and their unit tests. Nothing here touches the cluster.
#
# The Go permission tests (platform/nats/identities/permtest: the rendered config on an
# in-process nats-server 2.14.2) are NOT run here: compiling nats-server OOM-killed the zeus-v2
# runner container (1 GiB limit, platform/core/github-runner.yaml) twice, even with -p=1. Run
# them before merging, as platform/nats/IDENTITIES.md "Tests" says; results are recorded in
# onemind-xr docs/evidence/M1/A19/.

on:
  pull_request:
    paths:
      - ".github/workflows/test-nats-identities.yml"
      - "platform/nats/identities/**"
      - "platform/nats/values.identities.*.template.yaml"
      - "scripts/nats_identities.py"
      - "scripts/tests/test_nats_identities.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-nats-identities.yml"
      - "platform/nats/identities/**"
      - "platform/nats/values.identities.*.template.yaml"
      - "scripts/nats_identities.py"
      - "scripts/tests/test_nats_identities.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The self-hosted image does not ship a pinned Python with pip: install one per job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Spec invariants and generated values are current
        run: python scripts/nats_identities.py check

      - name: Renderer unit tests
        run: python -m unittest scripts/tests/test_nats_identities.py -v
