name: NATS identities tests

# Per-service NATS identities (FEATURES A19): the spec invariants and generated Helm values
# (scripts/nats_identities.py check), their unit tests, and the Go permission tests
# (platform/nats/identities/permtest) that prove the access matrix on a real server. Nothing
# here touches the cluster.
#
# The permission tests run against the nats-server v2.14.2 release binary (the live version),
# checksum-verified, with -tags natsbin. Compiling nats-server into the test binary OOM-killed
# the zeus-v2 runner container (1 GiB limit, platform/core/github-runner.yaml); the in-process
# mode stays for local runs (platform/nats/IDENTITIES.md "Tests").

on:
  pull_request:
    paths:
      - ".github/workflows/test-nats-identities.yml"
      - "platform/nats/identities/**"
      - "platform/nats/values.identities.*.template.yaml"
      - "scripts/nats_identities.py"
      - "scripts/tests/test_nats_identities.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-nats-identities.yml"
      - "platform/nats/identities/**"
      - "platform/nats/values.identities.*.template.yaml"
      - "scripts/nats_identities.py"
      - "scripts/tests/test_nats_identities.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The self-hosted image does not ship a pinned Python with pip: install one per job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: nats-server v2.14.2 release binary (checksum-verified)
        env:
          NATS_SERVER_VERSION: v2.14.2
          # SHA256SUMS of the release: nats-server-v2.14.2-linux-amd64.tar.gz
          NATS_SERVER_SHA256: b3e7b14eb10c895fd90c2dacdb6b65bd3208adcc9524dd7689ba2c1024e6b97a
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/nats-server"; mkdir -p "$d"
          f="nats-server-${NATS_SERVER_VERSION}-linux-amd64"
          curl -fsSL -o "$d/$f.tar.gz" "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/$f.tar.gz"
          echo "${NATS_SERVER_SHA256}  $d/$f.tar.gz" | sha256sum -c -
          tar -xzf "$d/$f.tar.gz" -C "$d" "$f/nats-server"
          echo "NATS_SERVER_BIN=$d/$f/nats-server" >> "$GITHUB_ENV"
          "$d/$f/nats-server" --version

      - name: Spec invariants and generated values are current
        run: python scripts/nats_identities.py check

      - name: Renderer unit tests
        run: python -m unittest scripts/tests/test_nats_identities.py -v

      # Serial build under a soft memory limit: only nats.go is compiled (the server is the
      # release binary), well inside the runner's 1 GiB. `go vet` without the tag would compile
      # nats-server again, so only the natsbin build is vetted here.
      - name: gofmt, go vet and permission tests (release binary)
        working-directory: platform/nats/identities/permtest
        env:
          PYTHON: python
          GOFLAGS: -p=1
          GOMEMLIMIT: 600MiB
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet -tags natsbin ./...
          go test -tags natsbin -race -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/permtest.txt"; test "${PIPESTATUS[0]}" -eq 0
