name: OneMind inventory review
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: onemind-inventory-review
  cancel-in-progress: false
jobs:
  discover:
    # Explicit opt-in: runner must have observational kubectl, tailnet and GitHub access.
    if: vars.ONEMIND_INVENTORY_REFRESH_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked portal dependencies
        working-directory: apps/onemind-portal
        run: corepack yarn install --immutable
      - name: Discover complete inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/onemind-portal/scripts/refresh-inventory.cjs
      - name: Open or update review proposal
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/onemind-inventory-review
          commit-message: 'chore(inventory): refresh observed OneMind resources'
          title: 'chore(inventory): review latest OneMind discovery'
          body: |
            Complete Kubernetes, Tailscale and GitHub discovery. Curated Fabric entries are reconciled.
            Missing identities remain in the catalog for review; three complete missing observations flag retirement review.
            Observation timestamps describe discovery, not live health. Review before merging; this workflow never auto-merges.
          add-paths: |
            apps/onemind-portal/catalog/
            platform/backstage/catalog/
