name: Build TAK Server 5.8 → GHCR

# Builds all OneMind TAK Server images from the hardened 5.8 distro zip.
#
# Distro zip must be uploaded to GitHub Releases as a release asset:
#   gh release create takserver-5.8 \
#     "/Users/zeus/OneMind Guardian (TAK)/server/5.8/takserver-docker-hardened-5.8-RELEASE-69.zip" \
#     --repo onemindos/omos-infra --title "TAK Server 5.8 Distro" --notes "" --prerelease
#
# Images built and pushed to ghcr.io/onemindos/:
#   takserver-base         — eclipse-temurin:17-jammy + /opt/tak/ (base for all pods)
#   takserver-config       — runs config-cluster.sh
#   takserver-api          — runs api-cluster.sh
#   takserver-messaging    — runs messaging-cluster.sh
#   takserver-plugins      — runs plugins-cluster.sh (upstream only)
#   takserver-database-setup — SchemaManager init job
#   takserver-plugins (OneMind overlay) — adds NatsBridgePlugin on top

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-takserver.yml"
      - "tak-server/docker/**"
      - "tak-server/plugin/**"
  workflow_dispatch:

jobs:
  build:
    name: Build TAK Server 5.8 images
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout omos-infra
        uses: actions/checkout@v4

      - name: Download 5.8 distro from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download takserver-5.8 \
            --repo onemindos/omos-infra \
            --pattern "takserver-docker-hardened-5.8-RELEASE-69.zip" \
            --output /tmp/takserver-5.8.zip
          unzip -q /tmp/takserver-5.8.zip -d /tmp/takserver-5.8
          echo "DISTRO=/tmp/takserver-5.8/takserver-docker-hardened-5.8-RELEASE-69" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build all images locally first, then push ──────────────────────────
      # Uses plain docker build (not buildx push) to avoid GHCR cross-repo
      # blob mounting permission issues.

      - name: Build all TAK Server images
        run: |
          echo "::group::Build takserver-base"
          docker build \
            -f tak-server/docker/Dockerfile.takserver \
            --target base \
            -t ghcr.io/onemindos/takserver-base:5.8-onemind \
            "$DISTRO"
          echo "::endgroup::"

          echo "::group::Build takserver-config"
          docker build \
            -f tak-server/docker/Dockerfile.takserver \
            --target config \
            -t ghcr.io/onemindos/takserver-config:5.8-onemind \
            "$DISTRO"
          echo "::endgroup::"

          echo "::group::Build takserver-api"
          docker build \
            -f tak-server/docker/Dockerfile.takserver \
            --target api \
            -t ghcr.io/onemindos/takserver-api:5.8-onemind \
            "$DISTRO"
          echo "::endgroup::"

          echo "::group::Build takserver-messaging"
          docker build \
            -f tak-server/docker/Dockerfile.takserver \
            --target messaging \
            -t ghcr.io/onemindos/takserver-messaging:5.8-onemind \
            "$DISTRO"
          echo "::endgroup::"

          echo "::group::Build takserver-plugins (upstream)"
          docker build \
            -f tak-server/docker/Dockerfile.takserver \
            --target plugins \
            -t ghcr.io/onemindos/takserver-plugins-upstream:5.8-onemind \
            "$DISTRO"
          echo "::endgroup::"

          echo "::group::Build takserver-database-setup"
          docker build \
            -f tak-server/docker/Dockerfile.database-setup \
            -t ghcr.io/onemindos/takserver-database-setup:5.8-onemind \
            "$DISTRO"
          echo "::endgroup::"

          echo "::group::Build takserver-plugins (OneMind)"
          docker build \
            -f tak-server/docker/Dockerfile.takserver-plugins.onemind \
            --build-arg TAKSERVER_IMAGE_REPO=ghcr.io/onemindos/takserver-plugins-upstream \
            --build-arg TAKSERVER_IMAGE_TAG=5.8-onemind \
            -t ghcr.io/onemindos/takserver-plugins:5.8-onemind \
            tak-server
          echo "::endgroup::"

      - name: Push all images to GHCR
        run: |
          images=(
            "ghcr.io/onemindos/takserver-base:5.8-onemind"
            "ghcr.io/onemindos/takserver-config:5.8-onemind"
            "ghcr.io/onemindos/takserver-api:5.8-onemind"
            "ghcr.io/onemindos/takserver-messaging:5.8-onemind"
            "ghcr.io/onemindos/takserver-plugins-upstream:5.8-onemind"
            "ghcr.io/onemindos/takserver-database-setup:5.8-onemind"
            "ghcr.io/onemindos/takserver-plugins:5.8-onemind"
          )
          for img in "${images[@]}"; do
            echo "::group::Push $img"
            docker push "$img"
            echo "::endgroup::"
          done

      - name: Clean up
        if: always()
        run: |
          rm -rf /tmp/takserver-5.8 /tmp/takserver-5.8.zip
          docker image prune -f
