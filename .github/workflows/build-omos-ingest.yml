name: Build omos-ingest
# Tests the collector framework (services/bridge/ingest) on every PR that touches it and
# pushes ghcr.io/onemindos/omos-ingest:{VERSION} and :sha-{sha} from main. Record the
# digest from the artifact and pin it in platform/ingest/deployment.yaml.
on:
  push:
    branches:
      - main
    paths:
      - services/bridge/ingest/**
      - services/schemas/intel/**
      - services/schemas/ingest/**
      - services/schemas/envelope/**
      - platform/ingest/configmap.yaml
      - .github/workflows/build-omos-ingest.yml
  pull_request:
    paths:
      - services/bridge/ingest/**
      - services/schemas/intel/**
      - services/schemas/ingest/**
      - services/schemas/envelope/**
      - platform/ingest/configmap.yaml
      - .github/workflows/build-omos-ingest.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omos-ingest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bridge/ingest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/bridge/ingest/go.mod
          cache-dependency-path: services/bridge/ingest/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Unit, integration and golden tests (embedded JetStream)
        run: go test -race -count=1 ./...
      - name: Registry check (local)
        run: go run ./cmd/omos-ingest -check -config sources.local.yaml -schemas ../../schemas
      # The registry the cluster runs is data['sources.yaml'] in the ConfigMap; -check fails
      # when it finds no enabled source, so an empty or misplaced extract cannot pass.
      - name: Registry check (cluster ConfigMap)
        run: |
          yq -r '.data["sources.yaml"]' ../../../platform/ingest/configmap.yaml > "$RUNNER_TEMP/sources.cluster.yaml"
          go run ./cmd/omos-ingest -check -config "$RUNNER_TEMP/sources.cluster.yaml" -schemas ../../schemas
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version
        id: version
        run: echo "version=$(cat services/bridge/ingest/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: services
          file: services/bridge/ingest/Dockerfile
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/onemindos/omos-ingest:${{ steps.version.outputs.version }}
            ghcr.io/onemindos/omos-ingest:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=omos-ingest
          cache-to: type=gha,mode=max,scope=omos-ingest
      - name: Record image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omos-ingest-image
          path: image-digest.txt
