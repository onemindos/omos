name: Sync Tailscale ACLs

on:
  push:
    branches: ["main"]
    paths: ["platform/tailscale/policy.hujson", ".github/workflows/tailscale.yml"]
  pull_request:
    branches: ["main"]
    paths: ["platform/tailscale/policy.hujson", ".github/workflows/tailscale.yml"]

jobs:
  acls:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ACL (apply on push to main)
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: platform/tailscale/policy.hujson
          action: apply

      - name: Test ACL (dry-run on PR)
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: platform/tailscale/policy.hujson
          action: test
