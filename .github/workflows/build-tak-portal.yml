name: Build TAK Portal → GHCR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tak-portal.yml"
      - "apps/tak-portal/**"
  workflow_dispatch:

jobs:
  build:
    name: Build tak-portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/tak-portal
          push: true
          tags: ghcr.io/onemindos/tak-portal:latest
          cache-from: type=registry,ref=ghcr.io/onemindos/tak-portal:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/tak-portal:cache,mode=max
          platforms: linux/amd64,linux/arm64
