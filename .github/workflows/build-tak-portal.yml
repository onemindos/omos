name: Build TAK Portal → GHCR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tak-portal.yml"
      - "services/tak-portal/**"
  workflow_dispatch:

jobs:
  build:
    name: Build tak-portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/tak-portal
          push: true
          tags: ghcr.io/onemindos/tak-portal:latest
          cache-from: type=registry,ref=ghcr.io/onemindos/tak-portal:cache
          cache-to: type=registry,ref=ghcr.io/onemindos/tak-portal:cache,mode=max
          platforms: linux/amd64,linux/arm64
