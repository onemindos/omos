name: Build agentops
# Tests omos agentops (agent presence, ATAK chat path, watch jobs, AOI briefs; FEATURES I1, I3,
# D10) on every PR that touches it: unit tests and integration tests against a disposable
# nats-server. On main it builds ghcr.io/onemindos/omos-agentops with the tags sha-<commit> and
# the version in services/agentops/VERSION; the digest is uploaded as an artifact. Pin it in
# platform/omos/agentops/deployment.yaml. The e2e tests against the entity and policy services
# skip here (those services are not on main yet); see services/agentops/README.md.
on:
  push:
    branches: [main]
    paths:
      - services/agentops/**
      - .github/workflows/build-agentops.yml
  pull_request:
    paths:
      - services/agentops/**
      - .github/workflows/build-agentops.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agentops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.4"
          cache: false
      - name: Install nats-server
        run: go install github.com/nats-io/nats-server/v2@v2.14.9
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: NATS_SERVER_BIN="$(go env GOPATH)/bin/nats-server" go test -race -count=1 ./...
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < services/agentops/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: services/agentops
          file: services/agentops/Dockerfile
          push: true
          tags: |
            ghcr.io/onemindos/omos-agentops:sha-${{ github.sha }}
            ghcr.io/onemindos/omos-agentops:${{ steps.version.outputs.version }}
          platforms: linux/amd64
          cache-from: type=gha,scope=agentops
          cache-to: type=gha,mode=max,scope=agentops
      - name: Record image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentops-image
          path: image-digest.txt
