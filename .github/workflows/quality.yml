name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full-tree run: re-renders every Helm chart and re-validates every manifest, so
    # upstream chart/schema drift is caught even when nobody touched the files.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool versions. Binaries are checksum-verified before use.
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  HELM_VERSION: v3.19.0
  RCLONE_CLI_VERSION: v1.75.2
  RCLONE_SHA256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
  KYVERNO_CLI_VERSION: v1.19.1
  KYVERNO_CLI_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  # Kubernetes minor to validate against. kubeconform schemas are published for 1.36.x.
  KUBECONFORM_K8S_VERSION: "1.36.0"

jobs:
  lint:
    name: Lint & Validate
    # Per-change lint gates do not apply to the scheduled/manual full-tree run.
    # Self-hosted runner inside the production cluster: pull requests from forks never run here.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The self-hosted image does not ship a pinned Python with pip: install one per job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint changed YAML (required)
        env:
          YAML_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_changed_yaml.py

      - name: Report existing repository YAML debt
        continue-on-error: true
        run: yamllint -c .yamllint.yml platform/ docs/ platform/takserver/

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: 'vault' # historical/archive scripts are not maintained runtime code
          severity: error

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: cd infra && terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  manifests:
    name: Kubernetes manifest schema (kubeconform)
    # Self-hosted runner inside the production cluster: pull requests from forks never run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The self-hosted image does not ship a pinned Python with pip: install one per job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP/bin" kubeconform
          rm -f "$RUNNER_TEMP/kubeconform.tgz"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Plain manifests under platform/, platform/takserver/deploy and platform/takserver/fedhub. Kubernetes core kinds
      # use the upstream schemas; CRDs use datreeio/CRDs-catalog. Kinds without a published schema
      # (for example Backstage catalog entities) are skipped rather than failing, because the repo uses
      # many CRDs that have no public schema. -strict (unknown fields are errors) is ON: the current tree
      # is clean under it, so it catches typos such as `replica:` instead of `replicas:`.
      - name: kubeconform (changed manifests; whole tree on schedule/manual)
        env:
          YAML_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ARGS=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then ARGS="--all"; fi
          python scripts/validate_manifests.py $ARGS

  helm:
    name: Helm render check
    # Self-hosted runner inside the production cluster: pull requests from forks never run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The self-hosted image does not ship a pinned Python with pip: install one per job.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # The self-hosted image's system node is too old for `node --test` (used by the portal contract tests).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Native Kubernetes int64 values must be tested before the JSON CLI boundary.
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.4"
          cache: false

      # Match the deployed policy engine; these security tests must not silently skip in CI.
      - name: Install checksum-verified Kyverno policy test engine
        run: |
          mkdir -p "$RUNNER_TEMP/kyverno-cli"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kyverno-cli.tar.gz" \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          echo "$KYVERNO_CLI_SHA256  $RUNNER_TEMP/kyverno-cli.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kyverno-cli.tar.gz" -C "$RUNNER_TEMP/kyverno-cli" kyverno
          echo "KYVERNO_CLI=$RUNNER_TEMP/kyverno-cli/kyverno" >> "$GITHUB_ENV"

      # Match the deployed backup-copy engine; regression tests must run in CI.
      - name: Install checksum-verified rclone backup test engine
        run: |
          mkdir -p "$RUNNER_TEMP/rclone-cli"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rclone-cli.zip" \
            "https://github.com/rclone/rclone/releases/download/${RCLONE_CLI_VERSION}/rclone-${RCLONE_CLI_VERSION}-linux-amd64.zip"
          echo "$RCLONE_SHA256  $RUNNER_TEMP/rclone-cli.zip" | sha256sum -c -
          python -m zipfile -e "$RUNNER_TEMP/rclone-cli.zip" "$RUNNER_TEMP/rclone-cli"
          chmod +x "$RUNNER_TEMP/rclone-cli/rclone-${RCLONE_CLI_VERSION}-linux-amd64/rclone"
          echo "RCLONE_BIN=$RUNNER_TEMP/rclone-cli/rclone-${RCLONE_CLI_VERSION}-linux-amd64/rclone" >> "$GITHUB_ENV"

      - name: Portable GitOps pipeline safety contracts
        run: python -m unittest discover -s scripts/tests -p 'test_gitops*.py' -v

      # Renders every Argo CD Application that pulls a remote Helm chart when the Application file or one of
      # its valueFiles changed, plus the local charts (platform/takserver/chart, platform/ecosystem/charts/*) when
      # their files change. Weekly/manual runs render everything.
      - name: helm template (changed Applications and local charts)
        env:
          YAML_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ARGS=""
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then ARGS="--all"; fi
          python scripts/validate_helm_renders.py $ARGS

  secrets:
    name: Secret scan (gitleaks)
    # Self-hosted runner inside the production cluster: pull requests from forks never run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          rm -f "$RUNNER_TEMP/gitleaks.tgz"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Whole working tree. This FAILS the job on any finding that is not in .gitleaks-baseline.json.
      # SealedSecret ciphertext is allowlisted in .gitleaks.toml by pattern (not by path), so a plaintext
      # value pasted into a *.sealedsecret.yaml file is still caught. --redact keeps values out of the logs.
      - name: gitleaks (working tree, baseline-aware)
        run: |
          gitleaks dir . --config .gitleaks.toml --baseline-path .gitleaks-baseline.json \
            --redact --no-banner --exit-code 1

      # Commits introduced by this PR/push, including secrets added and then deleted again within the range.
      - name: gitleaks (commits in this change)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..HEAD"
