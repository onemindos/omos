name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint changed YAML (required)
        env:
          YAML_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_changed_yaml.py

      - name: Report existing repository YAML debt
        continue-on-error: true
        run: yamllint -c .yamllint.yml platform/ docs/ tak-server/

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'vault' # historical/archive scripts are not maintained runtime code
          severity: error

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: cd infra && terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

      - name: Check for secrets
        run: |
          echo "Scanning for potential secrets..."
          key_begin="BEGIN"
          key_kind="PRIVATE KEY"
          if grep -rl "${key_begin}.*${key_kind}" --include="*.yaml" --include="*.yml" --include="*.tf" .; then
            echo "::error::Private key found in tracked files!"
            exit 1
          fi
          if python scripts/check_secret_patterns.py; then
            echo "::warning::Possible hardcoded password found (review manually)"
          fi
