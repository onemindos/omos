name: OneMind internal MCP
on:
  push:
    branches: [main, codex/onemind-internal-mcp, codex/onemind-mcp-app-coverage]
    paths:
      - services/onemind-mcp/**
      - .github/workflows/onemind-mcp.yml
  pull_request:
    branches: [main]
    paths:
      - services/onemind-mcp/**
      - platform/hermes/mcp/**
      - scripts/onemind_mcp_probe.py
      - .github/workflows/onemind-mcp.yml
  workflow_dispatch:
    inputs:
      verify_live:
        description: Verify the deployed MCP from Legacy without changing cluster state
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: onemind-mcp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-and-image:
    # Self-hosted runner inside the production cluster: pull requests from forks never run here.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: services/onemind-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t onemind-mcp:check .
      # The runner's DinD filesystem does not share checkout bind-mount paths.
      # Copy smoke fixtures into a test-only layer; never push that layer.
      - run: python scripts/container_check.py onemind-mcp:check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.event_name != 'pull_request'
        id: image
        with:
          context: services/onemind-mcp
          push: true
          tags: ghcr.io/onemindos/onemind-mcp:sha-${{ github.sha }}
          platforms: linux/amd64
      - name: Record deployable digest
        if: github.event_name != 'pull_request'
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: onemind-mcp-image
          path: services/onemind-mcp/image-digest.txt
  preflight:
    # Existing scoped pod-reader identity; no new Kubernetes privileges or credentials.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && !inputs.verify_live)
    runs-on: [self-hosted, onemind-hermes-readonly]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checksum-verified kubectl
        env:
          KUBECTL_VERSION: v1.36.0
          KUBECTL_SHA256: 123d8c8844f46b1244c547fffb3c17180c0c26dac9890589fe7e67763298748e
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Observe app reachability and public sealing certificate from Legacy
        run: |
          set -euo pipefail
          POD=$(kubectl -n hermes get pod -l app.kubernetes.io/name=hermes,onemind.io/agent=legacy \
            -o jsonpath='{.items[0].metadata.name}')
          test -n "$POD"
          IMAGE_ID=$(kubectl -n hermes get pod "$POD" -o jsonpath='{.status.containerStatuses[?(@.name=="hermes")].imageID}')
          kubectl -n hermes exec -i "$POD" -c hermes -- /opt/hermes/.venv/bin/python - "$IMAGE_ID" \
            < scripts/onemind_mcp_probe.py > "$RUNNER_TEMP/mcp-preflight.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onemind-mcp-preflight
          path: ${{ runner.temp }}/mcp-preflight.json
          retention-days: 7
  acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_live
    runs-on: [self-hosted, onemind-hermes-readonly]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checksum-verified kubectl
        env:
          KUBECTL_VERSION: v1.36.0
          KUBECTL_SHA256: 123d8c8844f46b1244c547fffb3c17180c0c26dac9890589fe7e67763298748e
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify config, authentication, real tools, resource and Argo health
        run: |
          set -euo pipefail
          # Recreate replaces the old pod; select again on every read-only attempt.
          for attempt in $(seq 1 16); do
            POD=$(kubectl -n hermes get pod -l app.kubernetes.io/name=hermes,onemind.io/agent=legacy \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              set +e
              kubectl -n hermes exec -i "$POD" -c hermes -- /opt/hermes/.venv/bin/python - \
                < scripts/onemind_mcp_acceptance.py | tee "$RUNNER_TEMP/mcp-acceptance.json"
              check_status=${PIPESTATUS[0]}
              set -e
              if [ "$check_status" -eq 0 ]; then exit 0; fi
              if [ "$check_status" -eq 78 ]; then exit 78; fi
            fi
            echo "Waiting for GitOps rollout (attempt ${attempt}/16)"
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onemind-mcp-acceptance
          path: ${{ runner.temp }}/mcp-acceptance.json
