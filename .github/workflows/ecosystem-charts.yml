name: Ecosystem Helm Charts
on:
  pull_request:
    paths:
      - platform/ecosystem/**
      - scripts/validate_ecosystem_charts.py
      - .github/workflows/ecosystem-charts.yml
  push:
    branches: [main]
    paths:
      - platform/ecosystem/**
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: python scripts/validate_ecosystem_charts.py
