name: Ecosystem Helm Charts
on:
  pull_request:
    paths:
      - platform/ecosystem/**
      - scripts/validate_ecosystem_charts.py
      - .github/workflows/ecosystem-charts.yml
  push:
    branches: [main]
    paths:
      - platform/ecosystem/**
permissions:
  contents: read
jobs:
  render:
    runs-on: [self-hosted, linux, amd64, zeus-v2]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/validate_ecosystem_charts.py
