name: Ecosystem Helm Charts
on:
  pull_request:
    paths:
      - platform/ecosystem/**
      - scripts/validate_ecosystem_charts.py
      - .github/workflows/ecosystem-charts.yml
  push:
    branches: [main]
    paths:
      - platform/ecosystem/**
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - run: python scripts/validate_ecosystem_charts.py
