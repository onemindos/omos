name: Build OneMind Core
on:
  push:
    branches:
      - main
      - codex/onemind-cpu-services
      - codex/onemind-cpu-applications
      - codex/onemind-cpu-release
      - codex/onemind-interaction-platform
    paths:
      - services/onemind-core/**
      - services/onemind-postgres/**
      - schemas/missions/**
      - schemas/envelope/**
      - .github/workflows/build-onemind-core.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: onemind-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r services/onemind-core/requirements.txt pytest==9.0.2 jsonschema==4.25.1
      - run: PYTHONPATH=services/onemind-core pytest services/onemind-core/tests
  images:
    needs: boundaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [onemind-core, onemind-postgres]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: services/${{ matrix.service }}
          push: true
          load: true
          tags: ghcr.io/onemindos/${{ matrix.service }}:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Verify PostgreSQL extensions
        if: matrix.service == 'onemind-postgres'
        run: >-
          docker run --rm --entrypoint bash
          ghcr.io/onemindos/onemind-postgres:sha-${{ github.sha }}
          -ec 'initdb -D /tmp/test-db;
          pg_ctl -D /tmp/test-db -o "-k /tmp" -w start;
          psql -h /tmp -d postgres -v ON_ERROR_STOP=1 -f /extension-check.sql'
      - name: Record image digest
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.service }}-image
          path: image-digest.txt
